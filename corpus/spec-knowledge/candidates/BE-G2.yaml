# ============ 文件 4/6: backend/13-privacy-data-lifecycle-protocol.md (sha256 df20ccb8...) ============

- proposed_id: POLICY.PRV.SENSITIVE_DATA_SIX_FACTS
  source_section: MUST
  source_protocol: .trellis/spec/backend/13-privacy-data-lifecycle-protocol.md
  source_lines: L25
  source_sha256: df20ccb85008f8744ea16db3ea64e54bdf9fd19d7aa3098c45dc44fff94c3d8d
  classification: UNIVERSAL_POLICY
  sort: UNIVERSAL
  kind_proposal: policy
  enforcement: required_when_applicable
  vocab_pr_needed: true
  statement_zh: 任何被判定为敏感的数据，必须在进入系统前登记六个事实：收集目的、来源、流向的接收方、保留期限、删除的触发条件、访问控制方式。
  statement_en_keywords: sensitive data attributes, purpose, provenance, recipients, retention, deletion trigger, access control
  clean_room: true
  applies_when: {lane: backend, condition: 收集、存储或流转任何敏感数据前}
  notes: 前瞻：FE 44-privacy-data-lifecycle（inventory FE-G2，未拆解）未来入册时可能构成跨车道同构，登记为潜在 M 组候选

- proposed_id: POLICY.PRV.NO_JUST_IN_CASE_HOARDING
  source_section: MUST NOT
  source_protocol: .trellis/spec/backend/13-privacy-data-lifecycle-protocol.md
  source_lines: L29
  source_sha256: df20ccb85008f8744ea16db3ea64e54bdf9fd19d7aa3098c45dc44fff94c3d8d
  classification: UNIVERSAL_POLICY
  sort: UNIVERSAL
  kind_proposal: policy
  enforcement: required_when_applicable
  vocab_pr_needed: true
  statement_zh: 以『将来也许用得上』为理由收集数据，或不设期限地留存数据，均在禁止之列。
  statement_en_keywords: no just-in-case collection, no indefinite retention
  clean_room: true
  applies_when: {lane: backend, condition: 数据收集与保留策略制定}
  notes: 独立成卡（BE12 先例）：与 MUST 正本构成『属性齐备 vs 收集克制』两端，非极性反转

