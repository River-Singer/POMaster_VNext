        classification_proposal: PROJECT_BASELINE_TEMPLATE
        statement_zh: "MASTer 表格 UI 文案必须经项目全局 locale 机制桥接（适配器内 localeText 回调读取当前语言并返回译文，未覆盖 key 回退英文默认值）；该回调为初始化期选项，切换语言后必须经更新组件 key 强制重挂载生效。"
