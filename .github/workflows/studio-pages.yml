name: Studio Pages

# 总 Storybook（两个抽屉：Vue · Ant Design 与 React · Geist 的组合）→ GitHub Pages 发布流。
#
# 触发面：push main 且画廊源（packages/studio、packages/studio-react）、画廊读取的物料（catalog/、CLI 种子——
# 含规范源 antd.yaml / geist.yaml、统一骨架 skeleton.yaml 与 design-tokens.yaml）、编排脚本或本工作流文件
# 变更（paths 过滤），或手动 dispatch。规范源改了，在线 Storybook 必须随之重新发布，人看的页面才不会落后于
# AI 孪生。
# 流程：frozen-lockfile 安装 → 两个画廊的生成器重建 generated/（幂等可重放）→ scripts/studio.mjs build
# （总 Storybook 在根路径，抽屉在 vue/、react/ 子路径；POMASTER_STUDIO_SITE_URL 决定组合地址与各自的
# vite base——必须对齐 https://river-singer.github.io/POMaster_VNext/ 才不白屏）→ upload-pages-artifact
# → deploy-pages。
#
# Owner 一次性启用步骤（仓库 Settings，机器无法代办）：
#   Settings → Pages → Build and deployment → Source 选「GitHub Actions」。
# 启用一次后，本工作流每次绿跑即自动发布在线画廊。
#
# 权限：pages:write + id-token:write（Pages OIDC 部署最小集）+ contents:read（checkout）。
# 并发：同组「pages」串行——连推时旧跑取消，只发布最新。
on:
  push:
    branches: [main]
    paths:
      - "packages/studio/**"
      - "packages/studio-react/**"
      - "packages/cli/seeds/**"
      - "scripts/studio.mjs"
      - "catalog/**"
      - ".github/workflows/studio-pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
      POMASTER_STUDIO_SITE_URL: "https://river-singer.github.io/POMaster_VNext/"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install (frozen lockfile)
        run: corepack pnpm install --frozen-lockfile

      # 生成器先行显式跑一遍（各 run.mjs build 内部会再生成——幂等可重放，双跑 diff 空
      # 由两个画廊的 generators / react-stories 测试钉住；此处显式步让失败定位更准）。
      - name: Generate gallery pages
        run: |
          node packages/studio/run.mjs generate
          node packages/studio-react/run.mjs generate

      - name: Build Storybook (host + two drawers, static export)
        run: corepack pnpm studio:build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist-studio

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
