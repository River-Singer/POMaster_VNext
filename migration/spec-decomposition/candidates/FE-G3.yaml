        triage: UNIVERSAL
        kind_proposal: policy
        classification_proposal: UNIVERSAL_POLICY
        statement_zh: "每个持久化项必须声明用途、存储介质、隔离键、schema 版本、大小预算、过期时间、迁移/重置策略、清理触发器与归属者。"
        statement_en_keywords: "persisted item declaration, storage class, isolation key, schema version, size budget, expiry, owner"
        applies_when: {lane: any, condition: "建立任何客户端持久化"}
        enforcement: required_when_applicable
        source: {file: .trellis/spec/frontend/45-browser-storage-protocol.md, lines: "20"}
        clean_room: true

      - proposed_id: POLICY.STORAGE.READ_SIDE_VALIDATION
        triage: UNIVERSAL
        kind_proposal: policy
        classification_proposal: UNIVERSAL_POLICY
        statement_zh: "从浏览器存储读取的数据必须执行 schema、版本、身份、租户与权限校验；校验失败时保守重置，不得直接信任。"
        statement_en_keywords: "read-side validation, conservative reset on failure"
        applies_when: {lane: any, condition: "读取任何客户端持久化数据"}
        enforcement: required_when_applicable
        source: {file: .trellis/spec/frontend/45-browser-storage-protocol.md, lines: "21"}
        clean_room: true

      - proposed_id: POLICY.STORAGE.FAILURE_DEGRADATION
        triage: UNIVERSAL
        kind_proposal: policy
        classification_proposal: UNIVERSAL_POLICY
        statement_zh: "必须处理存储不可用、隐私模式、配额不足、写入失败、被驱逐与数据损坏六类故障，并为关键流程提供非持久化降级路径。"
        statement_en_keywords: "storage failure degradation, non-persisted fallback for critical flows"
        applies_when: {lane: any, condition: "依赖客户端持久化的流程"}
        enforcement: required_when_applicable
        source: {file: .trellis/spec/frontend/45-browser-storage-protocol.md, lines: "22"}
        clean_room: true

      - proposed_id: POLICY.STORAGE.IDENTITY_SWITCH_CLEARING
        triage: UNIVERSAL
        kind_proposal: policy
        classification_proposal: UNIVERSAL_POLICY
        statement_zh: "注销、切换账号/租户、权限变化与数据目的撤回时必须清除或重新隔离相关持久化数据。"
        statement_en_keywords: "identity-switch storage clearing, re-isolation"
        applies_when: {lane: any, condition: "身份/权限/目的变更"}
        enforcement: required_when_applicable
        source: {file: .trellis/spec/frontend/45-browser-storage-protocol.md, lines: "23"}
        clean_room: true
        notes: "与 POLICY.STATE.IDENTITY_SWITCH_CLEANSE 互引（持久化对象域实例）"

