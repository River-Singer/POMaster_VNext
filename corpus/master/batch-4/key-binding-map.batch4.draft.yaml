alias_registrations:
  applied_in_batch1:
  - alias_rule: PAGE-TASK-STEP-*→PAGE.*
    note: ALIASES_V0 已登记；本批 boundary/fixture/overlay/performance 的 page_id 字段照录 legacy 词形，不改源数据
    observed:
    - PAGE-TASK-STEP-AUTHENTICATE
    - PAGE-TASK-STEP-BIND-CARLINE
    - PAGE-TASK-STEP-BUC-ANALYSE
    - PAGE-TASK-STEP-BUILD-BOM
    - PAGE-TASK-STEP-EXPERT-MODEL-CALCULATE
    - PAGE-TASK-STEP-GENERATE-SNAPSHOT
    - PAGE-TASK-STEP-MAINTAIN-BASE-ATTRIBUTES
    - PAGE-TASK-STEP-MANAGE-USER-ROLE
    - PAGE-TASK-STEP-OUTPUT-TO-LEDGER
    - PAGE-TASK-STEP-QUERY-LEDGER
    - PAGE-TASK-STEP-SAVE-BOM
    - PAGE-TASK-STEP-SELECT-VEHICLE-CONTEXT
    - PAGE-TASK-STEP-TRACK-COST-BY-SNAPSHOT
    - PAGE-TASK-STEP-VIEW-ALL-PARTS
    - PAGE-TASK-STEP-WRITEBACK-LEDGER
    source: vocab-lock ALIASES_V0 / vocab.ts ALIASES_V0
  proposed_needs_human:
  - alias_rule: DEP.*/PATTERN.*/BOUNDARY.*/FIXTURE.* 本地族词形
    note: 均为注册表本地族词形（非 vocab v0.2 15 前缀成员、非 ALIASES_V0 现役 8 族）；本表只登记不改名；canonical 赐名归族待词汇表 PR/Owner 裁决
  - alias_rule: PAGE.* 模板词形（performance-budget budget_ref）
    note: PAGE.LIST/PAGE.FORM 等为页面模板引用（page-template-registry 族），非页面 id；按模板词形登记，不计残差（batch1 TEMPLATE_REF_NOTE 同口径）
