## 开放问题处置记录（2026-08-27 会话裁决，三问全决）

1. **SUPERSEDED vs DEPRECATED 边界** → ✅ 有后继链决定：
   有 successor_ref 指向替代者 → SUPERSEDED（终态）；
   无后继但不再推荐使用 → DEPRECATED（可过渡 RETIRED）。机器可自动归类。
2. **老页面 ID 收编拆分** → ✅ 统一收尾段 + 全量 alias：
   `PAGE-TASK-STEP-BIND-CARLINE` → `PAGE.BIND_CARLINE`；
   `PAGE-APP-DASHBOARD` → `PAGE.DASHBOARD`；
   `TASK-STEP` / `APP` 两代历史前缀均不保留于 canonical id，
   完整历史形态入 alias 双向链（键绑定表负责考古）。
3. **fixture 隔离** → ✅ 加 `TEST.` 前缀入 v0 闭包（见 prefixes_v0 注记）。

