# D4=(a)「一次 vocab PR 收编全部在用新词形」统一入锁；收编判据=实盘在用（有
# schema 冻结 + kernel/CLI 消费），纯文档词形不硬收；代码镜像点注记随本批转正。）
# ============================================================

runtime_semantics_axes:  # 运行语义十轴 + 绑定探针轴（schemas/src/vocab.ts「词表外局部枚举」段转正——schema 01/02/03/05/06/07 x-vocab-extra/definitions 冻结 + kernel/CLI 全量消费）
  gate_verdict:          # gate verdict 七态超集（03-gate-result definitions.verdict 候选冻结来源；C1 四态必答位=前四者）
    values: [passed, failed, warning, blocked, not_run, not_configured, skipped_blindspot]
    note: skipped_blindspot 为 09-03 复盘批假绿封堵补位态；七态与 production band 判定三态正交
  object_origin:         # 对象来源（01/02 x-vocab-extra.origin）
    values: [natural, derived, ingested]
    note: human_curated→natural、migrated→ingested 收编映射
  write_policy:          # 写策略（02 WritePolicyValue，thread-A §3.4）
    values: [NONE, AGENT_WITH_PERMIT, CORRECTION_ONLY, EVOLUTION_CHANNEL]
  match_rule:            # 匹配规则（02 MatchRuleValue，thread-A §3.2）
    values: [mechanical, manual_confirmed]
    note: manual_confirmed 占比=机器键债务指标
  verification_verdict:  # claim/verification 判卷四值（02/07 verification_verdict，thread-A §5）
    values: [VERIFIED, PARTIALLY_VERIFIED, UNVERIFIED, REJECTED]
  liveness_status:       # producer 活性三态（06 liveness.status）
    values: [active, stale, dead]
    note: suspect_stale→stale、dead_view→dead 已收敛（06 schema 冻结）
  producer_kind:         # producer 来源（06 producer_kind）
    values: [builtin, project]
    note: builtin=随 kernel 发行版内置；project=项目仓自有编译器
  actor_type:            # 行为主体类型（structural——03/07 actor.actor_type；非治理事实枚举）
    values: [agent, human, tool, kernel]
  run_trigger:           # gate 运行触发方式（structural——03/07 run_trigger.type；扩值须同步 Kernel GateRunner）
    values: [pre_closeout, pre_commit, post_edit, on_demand, scheduled]
  denominator_status:    # 分母生命周期（05 denominator_status——vocab lifecycle 的 kind 级收窄子集，只禁不扩）
    values: [PROPOSED, CURRENT, SUPERSEDED]
    note: 封死 DEPRECATED/RETIRED/REJECTED（DENOMINATOR 只许 supersede 不许删除的同源纪律）
  binding_probe_status:  # binding_summary.probe_status（01-truth-index；D15）
    values: [all_verified, has_unverified, not_configured]
    note: 01-truth-index binding_summary 词形（not_configured=终局性诚实报告——D15 binding 是期望声明不是豁免证书）；kernel BindingSummary 承载

discovery_vocab:         # P18/P19 Discovery 面词轴（08/09/10/11 schema definitions 冻结；kernel discovery-chain 消费；PRD v0.4 §80.3/§81/§82/§49.2/§91.3 逐字）
  discovery_chain:       # Discovery 状态链（新状态面——Discovery 讨论生命周期，与 state_axes.lifecycle 正交值域不相交）
    values: [IDEA, DISCOVERY, READY_TO_PROMOTE, CHANGE, TASK]
    transitions:
      IDEA:             { to: [DISCOVERY] }
      DISCOVERY:        { to: [READY_TO_PROMOTE], requires: [promotion_basis] }
      READY_TO_PROMOTE: { to: [CHANGE, TASK], requires: [promotion_basis] }
      CHANGE:           { to: [] }
      TASK:             { to: [] }
    note: PRD §80.3 原文词形逐字；矩阵外转移 fail-closed 显式拒绝；提升写入走 P11 maintain 面（§81.3 Discovery 不写 .pomaster/state/）
  promotion_basis:       # 晋升依据四值（§80.3 四条晋升条件词形化，任一满足即合法晋升）
    values: [user_explicit_request, msd_reached, needs_formal_resources, needs_cross_session_tracking]
  unknown_classification:  # Unknown 分类十分类（§82.2 逐字；禁裸词形 UNRESOLVED/BLOCKER）
    values: [BLOCKER_CANDIDATE, HARD_BLOCKER, SOFT_UNCERTAINTY, ASSUMPTION, DEFERRED_DECISION,
             DISCOVERY_REQUIRED, SUSPECTED_ISSUE, NON_BLOCKING_GAP, FUTURE_CONSIDERATION, OUT_OF_SCOPE]
    note: 与 state_axes.confidence 的 UNRESOLVED 正交（对象治理置信轴 vs Discovery 未决项分类）
  assumption_risk:       # 假设风险三级（§82.4 逐字；HIGH 默认需要 Authority）
    values: [LOW, MEDIUM, HIGH]
  blueprint_envelope_status:  # Blueprint Acceptance Envelope 四态（§82.5 逐字；CONDITIONALLY_ACCEPTED 要求 HARD_BLOCKER=0）
    values: [ACCEPTED, CONDITIONALLY_ACCEPTED, BLOCKED, REJECTED]
  research_finding_confidence:  # Research Finding 置信三级（§81.4；与 state_axes.confidence 正交）
    values: [HIGH, MEDIUM, LOW]
  research_evidence_level:  # Evidence 五级（§81.4 逐字；IMPLEMENTATION 证明「存在」不自动证明「正确」——§81.5）
    values: [AUTHORITATIVE, PRIMARY, IMPLEMENTATION, SECONDARY, INFERENCE]
  research_authority_effect:  # authority_effect 三值（§81.4；CONFLICTS 是发现不是裁决——上报走正式治理面）
    values: [NONE, SUPPORTS, CONFLICTS]
  research_mode:         # Research 六模式全量镜像（§81.2 逐字；本版 Artifact 层无 mode 字段消费——05 lifecycle_full_mirror 全量镜像模式）
    values: [INTERNAL, EXTERNAL, MIXED, COMPARATIVE, IMPACT, FORENSIC]
  exception_classification:  # Exception Ledger 分类五值（§49.2「至少分类」+ §91.3 词形大写化）
    values: [ASSUMPTION, OPEN_QUESTION, DEFERRED_DECISION, CONFLICT, HARD_BLOCKER]
    note: 与 §82.2 十分类正交（登记面 vs Discovery 分类面）；「Deferred Decision」取 §82.2 同词形先例

knowledge_vocab:         # P28 Knowledge 词轴（12-knowledge-entry schema 冻结；kernel knowledge 消费；PRD §83 逐字）
  knowledge_kind:        # 四类型（§83.3 逐字）
    values: [ENGINEERING_PATTERN, FAILURE_PATTERN, DIAGNOSTIC_PLAYBOOK, DECISION_HEURISTIC]
  knowledge_status:      # 生命周期五态（§83.9 逐字；起点恒 CANDIDATE——§25.3 Curator 生成候选）
    values: [CANDIDATE, VALIDATED, PROMOTED, DEPRECATED, REJECTED]
    transitions:
      CANDIDATE: { to: [VALIDATED, REJECTED] }
      VALIDATED: { to: [PROMOTED, DEPRECATED] }
      PROMOTED:  { to: [DEPRECATED], note: §83.11 去僵化——被推翻的提升经验显式淘汰 }
      DEPRECATED: { to: [] }
      REJECTED:  { to: [] }
    note: 唯一权威边 VALIDATED→PROMOTED requires [promotion_authority]（§83.10——唯一通路 promoteKnowledge；矩阵外 fail-closed）
  promotion_authority:   # 提升权威位三值（§25.3/§83.10 角色词形大写化——§91.3 先例）
    values: [MAINTAIN, AUTHORITY, GATEKEEPER]
    note: Curator 词形不在闭包（promote 词形闸显式拒绝）；kernel 不判申报真（C5），词形闸 + authorityRef 审批引用留痕
  context_authority_partition:  # Context 分区词形（§83.8 [AUTHORITATIVE]/[ADVISORY] 逐字；knowledge 条目恒 ADVISORY——§83.2 铁律）
    values: [AUTHORITATIVE, ADVISORY]
    note: 与 research_evidence_level / CATALOG_ENFORCEMENT_VALUES（小写 advisory）正交值域不相交
  knowledge_confidence:  # Knowledge 置信三级（§83.4 例文 HIGH；全集取 §81.4 同词形——词形复用不发明新值）
    values: [HIGH, MEDIUM, LOW]

execution_identity_vocab:  # P20/P21 Execution Identity / Capability Pool 词轴（D 线 §1-§5 + PRD §25.2-§25.4/§58 逐字；kernel sessions/locks/execution/runtime-adapter/handoff 消费）
  execution_runtime:     # 执行载体（D 线 §2.1 必填枚举逐字）
    values: [claude-code, codex, script]
  execution_identity_kind:  # 身份种类（D 线 §2.1 逐字；后台脚本文凭上二等公民，audit 可单独过滤）
    values: [interactive, subagent, script]
  execution_role:        # P0 执行角色标签六值（D 线 §4 roles_vocabulary_p0 逐字；配置可扩展非内置人格）
    values: [owner, orchestrator, research, implementer, qa, script]
    note: research 是唯一内置 sub-role（read-only contract）；与 agent_role_pool 分层不相交（P0=地基，P1=池——R2 重分类裁定）
  lock_kind:             # 锁三粒度（D 线 §3.3.1 表逐字）
    values: [change, task, unit]
    note: change=单驱动者强排他 / task=多读单写意图登记 / unit=Governed Code Unit 写写互斥读写共享
  agent_role_pool:       # §25.3 十二角色机器词形（SCREAMING_SNAKE；词形裁定落档 docs/wave3-p20-sec79-backfill-44-8.md P21 注记）
    values: [SUPERVISOR, BRAINSTORM, RESEARCH, ARCHITECT, GOVERNANCE_WRITER, GATEKEEPER,
             IMPLEMENTER, CLEANER, STRENGTHENER, QA, RECONCILIATION, KNOWLEDGE_CURATOR]
    prd_headings:
      SUPERVISOR: Supervisor
      BRAINSTORM: Brainstorm Agent
      RESEARCH: Research Agent
      ARCHITECT: Architect Agent
      GOVERNANCE_WRITER: Governance Writer
      GATEKEEPER: Governance Gatekeeper
      IMPLEMENTER: Implementation Agent
      CLEANER: Cleaner Agent
      STRENGTHENER: Strengthener Agent
      QA: QA Agent
      RECONCILIATION: Reconciliation Agent
      KNOWLEDGE_CURATOR: Knowledge Curator Agent
    note: 一词二形成文收编（content_drift 先例）——IMPLEMENTER/CLEANER 锚 §24/§25.4 yaml 词形，六短词形锚 §25.2 池选图大写化，四标题机械映射（不发明缩写）
  runtime_execution_mode:  # 角色执行形态三值（§58 四条降级规则 + §25.2 solo 内生形态机器词形）
    values: [direct, sequential, parallel]
    note: direct=不经池零开销（§25.2 MINIMAL + D 线 SOLO-DIRECT）；parallel=真并发（禁伪装并发封条唯一放行形）
  runtime_capability:    # §58 三探针判别词（方法名 snake_case 机械映射）
    values: [parallel, tool_permissions, context_isolation]
    note: 探针方法名本身是 §58 interface 契约面非词表管辖（runtime-adapter 头注）；本轴是降级报告 rows 的判别词
  runtime_degradation_rules:  # §58 四条降级规则 id（四 bullet 一一对应 mechanical mirror）
    values: [sequential_fallback, context_recompile_per_role, no_concurrency_masquerade, capability_degradation_report]
    note: no_concurrency_masquerade 恒真封条——mode 派生不可申报
  concurrency_masquerade_code:  # 伪装并发错误码位（kernel GovernanceErrorCode 同名成员常量镜像）
    values: [RUNTIME_CONCURRENCY_MASQUERADE]
    note: reason_code 独立维度不入词表（GOLDEN-L3-CASE-C 精神）——登记的是码位词形本身

question_gate_vocab:     # §80.4 Question Gate 词族（kernel question-gate 承载；Owner 裁定 C1 已裁 ASSUMPTION 第六处置——裁决 11 ⑨）
  classification:        # 问题分类五词形（PRD §80.4 逐字）
    values: [BLOCKING_AUTHORITY, PREFERENCE, DERIVABLE, RESEARCHABLE, DEFERABLE]
    note: 只能主动问的两类=BLOCKING_AUTHORITY/PREFERENCE（「只能主动问」逐字）
  disposition:           # 七关重算处置词形六值闭包（gate 处置轴）
    values: [ASK_HUMAN, ASK_REJECTED, DERIVABLE, RESEARCHABLE, DEFERABLE, ASSUMPTION]
    note: >-
      同词两轴区分（Owner 裁定 C1 成文）：ASSUMPTION 此处是 **gate 处置轴**（「这个 Unknown 以
      显式假设方式处置」），§49.2/MSD 十分类的 ASSUMPTION 是**异常登记轴**（「这笔登记算什么」）
      ——登记 ≠ 判定，两轴不合并。ASK_REJECTED=七关全过但申报分类非可问类（矛盾禁 ASK）。
  assumption_conditions: # ASSUMPTION 联动五条件申报键（§4A 五条件；纯判卷输入位零新状态轴——申报不落盘）
    values: [low_risk, reversible, within_permit, no_authority_conflict, acceptance_testable]
    note: 全五条件显式 true 且 Q7 不阻塞 → 处置 ASSUMPTION（DEFERABLE 显式升级，禁缺省布尔静默放行）
  gates:                 # 七关 id（原文行序 Q1..Q7；问句逐字以 kernel QUESTION_GATES 承载）
    values: [Q1, Q2, Q3, Q4, Q5, Q6, Q7]
    note: Q7 语义相反位（true=真的阻塞当前 Increment）；Q1-Q7 id 词形登记，问句原文非词表管辖

decision_graph_vocab:    # Grounded Decision Graph 词族（18-decision-graph schema 冻结 + kernel decision-graph 承载；Owner 裁决 9②③ 已裁）
  decision_class:        # Decision class（SCOPE 单值起步——裁决 9②）
    values: [SCOPE]
    note: 未映射 class 一律保守按显著处理（fail-closed）；第九维 Critical Failure Behavior 的 class 词形待扩容呈报（不悄悄吞并不悄悄丢弃）
  grounding_verdict:     # Grounding Verdict 五值（§6.2；**派生判定不落盘、不进 Canonical Object State Axis**——18 schema 刻意无 verdict 字段）
    values: [READY_FOR_DECISION, NEEDS_DERIVATION, NEEDS_RESEARCH, CONFLICT_REVIEW, INSUFFICIENT_GROUNDING]
  decision_relation:     # finding↔decision relation 六值（与 research_authority_effect 划界注记——裁决 9③：relation 管 finding→Decision 证据关系，authority_effect 管 finding→Authority 效应；两轴并存禁互填）
    values: [RESOLVES_FACT, SUPPORTS_OPTION, WEAKENS_OPTION, CONTRADICTS_PREMISE, NO_DECISION_EFFECT, INSUFFICIENT_EVIDENCE]
  decision_answer:       # Human 答面四词形（§13.2 逐字）
    values: [ACCEPT, CHANGE, UNKNOWN, DEFER]
  recommendation_source:  # Recommendation source 披露位（§12.2——只有模型经验必须显式披露 INFERENCE）
    values: [PROJECT_GROUNDED, INFERENCE]
  grounding_surface:     # G2 检索面四面（§6.1 逐字；刻意不含 KNOWLEDGE——§83.2 永不进 gate 判卷输入）
    values: [CURRENT_TRUTH, DOCS, REPO, EVIDENCE]
  missing_fact_route:    # G6 缺失事实路由两值（§6.1；ASK_HUMAN 刻意不在——事实型问题禁止问 Human §8 逐字）
    values: [DERIVABLE, RESEARCHABLE]
    note: 词源复用 question_gate_vocab.classification（零新分类词——四克制）
  unknown_disposition:   # UNKNOWN 六问重分类处置六值（§14；MSD 十分类子集零新词）
    values: [DERIVABLE, RESEARCHABLE, ASSUMPTION, DEFERRED_DECISION, DISCOVERY_REQUIRED, BLOCKER_CANDIDATE]
  sufficiency_dimensions:  # §15 Sufficiency 显著改变维度八维（任务口径；PRD 原文第九维 Critical Failure Behavior 待 class 扩容后并入——显式呈报位）
    values: [GOAL, SCOPE, BEHAVIOR, AUTHORITY, ACCEPTANCE, CRITICAL_CONTRACT, ARCHITECTURE_BOUNDARY, IRREVERSIBLE]
  sufficiency_residual_classifications:  # §15 残留合法分类四值（§15 逐字；MSD 十分类子集零新词——SOFT_UNCERTAINTY 承载 Known Unknown）
    values: [ASSUMPTION, DEFERRED_DECISION, FUTURE_CONSIDERATION, SOFT_UNCERTAINTY]
  forbidden_wordforms:   # 禁词负例（§1.1 不新增 State Axis——Grill 过程词不得变成状态词形；09 号 x-pomaster-vocab.forbidden_wordforms 同款登记位）
    values: [GRILLING, GRILLED, GRILL_CONFIRMED]
    note: 不得出现在 decision_id/class/options 词形位；机器拒绝面在 kernel buildDecisionGraph
  decision_presentation_forbidden_wordforms:  # §6A Recommendation UX 呈现禁词（vNext Batch 3 R3）
    values: ["[AI recommended]"]
    note: 呈现行零禁词（引注否定也算写出——实施中发现并修正两处）；与 forbidden_wordforms 分立（呈现层 vs 词形位）

equivalence_vocab:       # P31 跨域联结词形轴（13-equivalence-registry schema 冻结；kernel equivalence 消费）
  word_form_domain:      # 词形语言域标记六值（gaps §3 逐字转译 + 结构性必需位）
    values: [zh-formal, pinyin, abbrev, compressed, canonical, unknown]
    note: unknown=机械入册不判域（禁启发式判域——显式未知非猜测，域标记 Authority 声明时补登）
  equivalence_status:    # 等价组状态两值（只登记不裁决 + pending 桶词形）
    values: [active, pending]
    note: active=显式声明齐备（解析面唯一可命中）；pending=机械入册等裁决（解析面永不命中——禁假绿）；两值封闭无第三态

portability_vocab:       # P32 Portability 词形轴（PRD §85.2/§85.3/§84.6 逐字 + kernel fail-closed 补位词）
  check_status:          # §85.2 八项检查结果三态
    values: [PASS, FAIL, NOT_RUN]
    note: PASS=§85.2 逐字；FAIL=应存在而缺席/损坏/判违；NOT_RUN=环境性缺席；「缺项=FAIL 或 NOT_RUN 显式，绝不静默绿」fail-closed 补位词两枚随本轴一并登记（原 TODO 呈报位就此闭合）
  canonical_sets:        # §85.3 required_canonical_sets 五族闭集（manifest 读侧校验 ⊇ 五族）
    values: [truth, architecture, decisions, knowledge, evidence]
  runtime_rebuild:       # §85.3 required_runtime_rebuild 两项
    values: [contexts, harness-bootstrap]
  forbidden_dependencies:  # §85.3 forbidden_dependencies 两项（命中检测 fail-closed）
    values: [user-home-project-memory, untracked-local-spec]
  memory_drift:          # §84.6 Hidden Memory Drift 判定词形（单词常量承载——POMASTER_SELF_IMPROVEMENT_CANDIDATE 同款先例）
    values: [MEMORY_DRIFT]

memory_harvest_vocab:    # P33 Memory Harvest 词形轴（14-memory-harvest schema 冻结 + kernel memory-harvest 消费；thread-B §4 迁移设计 + PRD §48/§44.10 逐字）
  harvest_bucket:        # 分桶七值（thread-B §4.1 四桶 + 两条特殊出口 + UNCLASSIFIED_PENDING 拒绝位）
    values: [TRUTH, KNOWLEDGE, EPISODE, PREFERENCE, AUTHORITY_POLICY, INVALID_EXPIRED, UNCLASSIFIED_PENDING]
    note: 四桶初筛位=前四值（HARVEST_PRIMARY_BUCKETS）；特殊出口=AUTHORITY_POLICY 升格（须显式声明）/INVALID_EXPIRED 淘汰；UNCLASSIFIED_PENDING=机械判不了显式 unknown（confidence 恒 LOW 禁模糊猜测）
  memory_class:          # PRD §48.2 七类长期记忆分类（§48.2 标题词形大写化——§91.3 先例）
    values: [TRUTH, KNOWLEDGE, EPISODE, DECISION, EVIDENCE, USER, HARNESS_RUNTIME]
    note: 桶是 harvest 初筛位、类是 promote 后归属位（映射 MEMORY_CLASS_OF_BUCKET）；与 harvest_bucket 分轴正交
  review_state:          # inbox 条目 review 三态（fail-closed 纪律补位词；起点恒 PENDING——kernel buildInboxEntry 结构性只写）
    values: [PENDING, PROMOTED, REJECTED]
    note: 已决条目再决 fail-closed 拒绝；batch review 是唯一人工闸
  harvest_source:        # inbox 条目来源三值（P33a 通路词形）
    values: [user_capture, memory_harvest, memory_drift_audit]
  harvest_confidence:    # 分类提案置信三级（词形复用 §81.4/§83.4 三级——词形复用不发明新值先例）
    values: [HIGH, MEDIUM, LOW]
  cli_error_codes:       # memory CLI 错误词形族七值（P33b-Commands 补位词；kernel GovernanceError 码位之上的命令面呈现码——确定性一一对应映射，禁子串/模糊猜测映射）
    values: [MEMORY_ENTRY_NOT_FOUND, MEMORY_ALREADY_REVIEWED, MEMORY_REVIEW_REQUIRED,
             MEMORY_ALREADY_PROMOTED, MEMORY_PROMOTE_OWNER_REQUIRED, MEMORY_CAPTURE_DUPLICATE,
             MEMORY_HARVEST_NOT_RUN]
    note: 命令组词形 memory + 子命令名非本词表管辖（PR-0004 命令名先例——词表只收错误词形族不收命令名）
  owner_escalation:      # memory promote 呈报词形（P33b 任务定案；exit 0 不冒充失败也不冒充普通成功）
    values: [OWNER_ESCALATION_REQUIRED]
