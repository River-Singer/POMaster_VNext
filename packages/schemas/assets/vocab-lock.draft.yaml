  observation_surface:   # Observation Surface 八面（PRD §6.4 逐字；原文豁免「不要求立即成为新的 Closed-world Core Vocab」——开放枚举登记，扩值走词汇表 PR）
    values: [USER_SURFACE, INTERACTION_STATE, BOUNDARY_IO, RUNTIME_SIGNAL,
