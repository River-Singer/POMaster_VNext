      - id: COLOR.TOKENS_ONLY
        title_zh: 颜色只经 token 取
        statement_zh: 颜色只经主题变量取：Geist 色阶用 ds- 前缀的颜色类（bg-ds-gray-100、text-ds-gray-900），shadcn/ui 的成对变量（background / foreground、primary / primary-foreground）已映射到 Geist 色阶。不在组件里写死色值。
        anchors:
          - { spec: ui, quote: MUST NOT 写孤立色值、魔法间距和临时阴影。 }
        enforcement: { kind: gate, check: style.no-raw-color }
        examples:
          - kind: do
            title_zh: 用 Geist 色阶类
            jsx: |-
              <div className="flex gap-3">
                <div className="rounded-md bg-ds-gray-1000 px-4 py-2 text-label-14 text-ds-background-100">gray-1000</div>
                <div className="rounded-md bg-ds-gray-100 px-4 py-2 text-label-14 text-ds-gray-1000">gray-100</div>
                <div className="rounded-md border border-ds-gray-400 px-4 py-2 text-label-14 text-ds-gray-900">gray-400 边框</div>
              </div>
          - kind: dont
            title_zh: 写死色值
            code: |-
              <div style={{ background: "#171717", color: "#ededed" }}>部署</div>
            lang: tsx

      - id: COLOR.NEUTRAL_LAYERS
        title_zh: 中性色分层
        statement_zh: 页面用背景 1（background-100），背景 2 只在需要轻微区分时少量使用。组件放在背景 1 上时，用灰 100 作悬停背景、灰 200 作按下背景；徽标这类小元素用灰 200 或 300 作底。默认用实色灰；只有需要透出底色时（阴影、遮罩）才用透明灰。
        enforcement: { kind: review }
        showcase:
          - kind: specimen
            title_zh: 档位与用途
            name_label_zh: 类名
            rows:
              - name: bg-ds-background-100
                usage_zh: 页面与组件的默认背景
                jsx: |-
                  <div className="h-10 w-28 rounded-md border border-ds-gray-400 bg-ds-background-100" />
              - name: bg-ds-gray-100
                usage_zh: 组件的悬停背景
                jsx: |-
                  <div className="h-10 w-28 rounded-md bg-ds-gray-100" />
              - name: bg-ds-gray-200
                usage_zh: 组件的按下背景；徽标底色
                jsx: |-
                  <div className="h-10 w-28 rounded-md bg-ds-gray-200" />
              - name: border-ds-gray-400
                usage_zh: 默认边框
                jsx: |-
                  <div className="h-10 w-28 rounded-md border border-ds-gray-400" />
              - name: text-ds-gray-900
                usage_zh: 次要文字与图标
                jsx: |-
                  <span className="text-label-14 text-ds-gray-900">3 分钟前部署</span>
              - name: text-ds-gray-1000
                usage_zh: 主要文字与图标
                jsx: |-
                  <span className="text-label-14 text-ds-gray-1000">pomaster-web</span>

      - id: COLOR.BRAND
        title_zh: 品牌色
        statement_zh: Geist 默认单色，没有彩色的品牌主色：主操作用最深的灰（gray-1000）配背景色文字；蓝色只用于焦点环和信息提示，不用来装点主按钮或大面积背景。
        params:
          primary: { value: gray-1000, source: SRC.GEIST.BUTTON, label_zh: 主操作底色 }
          focus: { value: blue-700, source: SRC.VERCEL.BRAND_CSS, label_zh: 焦点环 }
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 主操作是黑底按钮
            jsx: |-
              <div className="flex gap-2">
                <Button>部署项目</Button>
                <Button variant="secondary">查看日志</Button>
              </div>
          - kind: dont
            title_zh: 给主按钮上彩色
            code: |-
              <Button className="bg-ds-blue-700">部署项目</Button>
            lang: tsx

      - id: COLOR.STATUS
        title_zh: 状态色
        statement_zh: 彩色只表达状态，含义固定：绿表示健康或成功，红表示错误，琥珀表示警告，蓝表示信息，灰表示中性。状态总伴随文字，颜色去掉后文字仍能读懂。
        params:
          success: { value: green-900, source: SRC.VERCEL.BRAND_CSS, label_zh: 成功 }
          error: { value: red-700, source: SRC.VERCEL.BRAND_CSS, label_zh: 错误 }
          warning: { value: amber-900, source: SRC.VERCEL.BRAND_CSS, label_zh: 警告 }
          info: { value: blue-700, source: SRC.VERCEL.BRAND_CSS, label_zh: 信息 }
        anchors:
          - { spec: ui, quote: 颜色不得作为唯一信息来源 }
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 颜色配文字
            jsx: |-
              <div className="flex flex-wrap gap-4 text-label-14">
                <span className="flex items-center gap-2 text-ds-green-900"><CircleCheckIcon />已就绪</span>
                <span className="flex items-center gap-2 text-ds-red-700"><CircleXIcon />构建失败</span>
                <span className="flex items-center gap-2 text-ds-amber-900"><TriangleAlertIcon />配额将满</span>
                <span className="flex items-center gap-2 text-ds-blue-700"><InfoIcon />新版本可用</span>
              </div>

      - id: COLOR.BORDERS
        title_zh: 边框
        statement_zh: 边框默认用实色灰 400，只有边缘需要和表面融在一起时才用同档的透明灰。每条边只画一次：容器里的分割线画在边框里面，不让两条半透明边框交叠出更深的交点。
        params:
          default: { value: gray-400, source: SRC.GEIST.COLORS, label_zh: 默认边框 }
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 分割线在边框里面
            jsx: |-
              <div className="w-64 rounded-md border border-ds-gray-400 bg-ds-background-100">
                <div className="border-b border-ds-gray-400 px-4 py-3 text-label-14">构建中…</div>
                <div className="px-4 py-3 text-copy-13 text-ds-gray-900">部署很快就会就绪。</div>
              </div>
          - kind: dont
            title_zh: 两条透明边框叠在一起
            code: |-
              <div className="border border-black/10"><div className="border border-black/10">…</div></div>
            lang: tsx

      - id: COLOR.NO_DECORATION
        title_zh: 不用装饰性效果
        statement_zh: 不用装饰性渐变、渐变文字、发光、色块、条纹、纹理、网格背景、毛玻璃，也不用装饰性或伪立体阴影。渐变只在表示连续数据刻度时使用，并且要标注。
        enforcement: { kind: review }
        examples:
          - kind: dont
            title_zh: 渐变文字加发光
            code: |-
              <h1 className="bg-linear-to-r from-purple-500 to-pink-500 bg-clip-text text-transparent">Ship faster</h1>
            lang: tsx

  # ───────────────────────────── 基础 · 字体 ─────────────────────────────
  - key: typography
    title_zh: 字体
    group: foundations
    prefix: TYPE
    summary_zh: Geist Sans 与 Geist Mono；字号只用 Geist 的四组排版类（标题、按钮、标签、正文）；单行用标签，多行用正文。
    rules:
      - id: TYPE.FAMILY
        title_zh: 字体族
        statement_zh: 正文、标题、标签、控件、表格、图表都用 Geist Sans；Geist Mono 只用于代码、命令、路径、原始 token、时间戳和短标识。字体从 Google Fonts 加载，字重 400 到 600。字体族只经 font-sans / font-mono（或带 -mono 的排版类）取，不写内联 font-family：主题里的字体栈带系统字体兜底，中文字形由系统无衬线字体补上。
        params:
          sans: { value: Geist, source: SRC.VERCEL.DESIGN_MD, label_zh: 无衬线 }
          mono: { value: Geist Mono, source: SRC.VERCEL.DESIGN_MD, label_zh: 等宽 }
          weights: { value: [400, 600], source: SRC.VERCEL.DESIGN_MD, label_zh: 字重范围 }
        enforcement: { kind: gate, check: style.font-family-token }
        examples:
          - kind: do
            title_zh: 正文用 Sans，标识用 Mono
            jsx: |-
              <p className="font-sans text-copy-14">
                部署 <code className="text-copy-13-mono">dpl_7Hq2x</code> 已于 <code className="text-copy-13-mono">2026-11-02 14:08</code> 上线。
              </p>
          - kind: dont
            title_zh: 内联写字体名
            code: |-
              <p style={{ fontFamily: "Geist" }}>部署已上线</p>
            lang: tsx
            note_zh: 只写一个字体名没有兜底，中文会落到浏览器默认字体（常是衬线体）。

      - id: TYPE.SCALE
        title_zh: 字阶
        statement_zh: 字号只用 Geist 的四组排版类，类名里的数字就是字号。标题类开启页面或区块；按钮类只在按钮组件里用；标签类用于单行文字；正文类用于多行文字。不自造字号。
        params:
          heading: { value: [72, 64, 56, 48, 40, 32, 24, 20, 16, 14], unit: px, source: SRC.GEIST.TYPOGRAPHY, label_zh: 标题 }
          button: { value: [16, 14, 12], unit: px, source: SRC.GEIST.TYPOGRAPHY, label_zh: 按钮 }
          label: { value: [20, 18, 16, 14, 13, 12], unit: px, source: SRC.GEIST.TYPOGRAPHY, label_zh: 标签 }
          copy: { value: [24, 20, 18, 16, 14, 13], unit: px, source: SRC.GEIST.TYPOGRAPHY, label_zh: 正文 }
        enforcement: { kind: gate, check: style.font-size-scale }
        showcase:
          - kind: specimen
            title_zh: 标题
            description_zh: 用来开启页面或区块。
            name_label_zh: 类名
            rows:
              - { name: text-heading-72, sample_zh: Heading 72 }
              - { name: text-heading-64, sample_zh: Heading 64 }
              - { name: text-heading-56, sample_zh: Heading 56 }
              - { name: text-heading-48, sample_zh: Heading 48 }
              - { name: text-heading-40, sample_zh: Heading 40 }
              - { name: text-heading-32, sample_zh: Heading 32 }
              - { name: text-heading-24, sample_zh: Heading 24 }
              - { name: text-heading-20, sample_zh: Heading 20 }
              - { name: text-heading-16, sample_zh: Heading 16 }
              - { name: text-heading-14, sample_zh: Heading 14 }
          - kind: specimen
            title_zh: 按钮
            description_zh: 只在渲染按钮的组件里用。
            name_label_zh: 类名
            rows:
              - { name: text-button-16, sample_zh: Button 16, usage_zh: 最大的按钮 }
              - { name: text-button-14, sample_zh: Button 14, usage_zh: 默认按钮 }
              - { name: text-button-12, sample_zh: Button 12, usage_zh: 只用于放在输入框里的小按钮 }
          - kind: specimen
            title_zh: 标签
            description_zh: 为单行文字设计，行高留得足，便于和图标对齐。
            name_label_zh: 类名
            rows:
              - { name: text-label-20, sample_zh: Label 20 }
              - { name: text-label-18, sample_zh: Label 18 }
              - { name: text-label-16, sample_zh: Label 16, usage_zh: 用在标题里，与常规文字区分 }
              - { name: text-label-14, sample_zh: Label 14, usage_zh: 最常用的文字样式，菜单里大量使用 }
              - { name: text-label-14-mono, sample_zh: Label 14 Mono, usage_zh: 最大的等宽字号，和 14 以上的文字搭配 }
              - { name: text-label-13, sample_zh: Label 13, usage_zh: 其他标签旁的次要一行；表达数字时用等宽数字 }
              - { name: text-label-13-mono, sample_zh: Label 13 Mono, usage_zh: 和 Label 14 搭配的等宽字号 }
              - { name: text-label-12, sample_zh: Label 12, usage_zh: 忙碌视图里的第三层文字，如评论、展开更多 }
              - { name: text-label-12-mono, sample_zh: Label 12 Mono }
          - kind: specimen
            title_zh: 正文
            description_zh: 为多行文字设计，行高比标签大。
            name_label_zh: 类名
            rows:
              - { name: text-copy-24, sample_zh: Copy 24, usage_zh: 营销页的首屏 }
              - { name: text-copy-20, sample_zh: Copy 20, usage_zh: 营销页的首屏 }
              - { name: text-copy-18, sample_zh: Copy 18, usage_zh: 主要用于营销页、大段引语 }
              - { name: text-copy-16, sample_zh: Copy 16, usage_zh: 对话框这类留白充足的视图 }
              - { name: text-copy-14, sample_zh: Copy 14, usage_zh: 最常用的正文样式 }
              - { name: text-copy-13, sample_zh: Copy 13, usage_zh: 次要文字，空间紧张的视图 }
              - { name: text-copy-13-mono, sample_zh: Copy 13 Mono, usage_zh: 正文里提到的代码 }
        examples:
          - kind: dont
            title_zh: 自造的 15px 与 font-weight 650
            code: |-
              <p style={{ fontSize: 15, fontWeight: 650 }}>项目设置</p>
            lang: tsx

      - id: TYPE.WEIGHT
        title_zh: 字重
        statement_zh: 字重跟着排版类走，不单独写 font-weight。需要在一段文字里强调时，在排版类里嵌套 strong 元素（Geist 的 Strong / Subtle 修饰）。
        params:
          class_metrics: { decision: 各排版类的行高、字重、字距取多少？（Geist 的完整数值在设计稿里，当前排版类只实现了字号）, label_zh: 行高 / 字重 / 字距 }
        enforcement: { kind: gate, check: style.font-weight-allowed }
        examples:
          - kind: do
            title_zh: 用 strong 强调
            jsx: |-
              <p className="text-copy-14">推送到 <strong>main</strong> 分支时自动部署到生产环境。</p>

      - id: TYPE.LINE_ROLES
        title_zh: 单行与多行
        statement_zh: 单行文字（菜单项、表单标签、与图标并排的文字）用标签类，行高留得足；多行文字用正文类。标签旁的次要信息用 text-label-13；忙碌视图里的第三层信息用 text-label-12；正文里提到代码用 text-copy-13-mono。
        params:
          secondary: { value: text-label-13, source: SRC.GEIST.TYPOGRAPHY, label_zh: 次要单行 }
          tertiary: { value: text-label-12, source: SRC.GEIST.TYPOGRAPHY, label_zh: 第三层单行 }
          inline_code: { value: text-copy-13-mono, source: SRC.GEIST.TYPOGRAPHY, label_zh: 正文中的代码 }
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 标签加次要信息
            jsx: |-
              <div className="flex items-baseline gap-2">
                <span className="text-label-14">生产环境</span>
                <span className="text-label-13 text-ds-gray-900 tabular-nums">3 分钟前</span>
              </div>

      - id: TYPE.COLOR
        title_zh: 文字颜色
        statement_zh: 文字只用两档：主要文字 gray-1000，次要文字 gray-900。更弱的灰只用于禁用态，不用来写说明文字。
        params:
          primary: { value: gray-1000, source: SRC.GEIST.COLORS, label_zh: 主要文字 }
          secondary: { value: gray-900, source: SRC.GEIST.COLORS, label_zh: 次要文字 }
        anchors:
          - { spec: ui, quote: 颜色不得作为唯一信息来源；文本对比度至少 4.5:1 }
        enforcement: { kind: gate, check: style.no-raw-color }
        examples:
          - kind: do
            title_zh: 两档文字色
            jsx: |-
              <div className="flex flex-col gap-1">
                <span className="text-label-14 text-ds-gray-1000">pomaster-web</span>
                <span className="text-label-13 text-ds-gray-900">由 river 在 3 分钟前部署</span>
              </div>

      - id: TYPE.TABULAR_NUMS
        title_zh: 等宽数字
        statement_zh: 需要上下对比的数字（表格的数字列、计数、用量、时间）用等宽数字（tabular-nums）或 Geist Mono，让各行的数位对齐。
        params:
          utility: { value: tabular-nums, source: SRC.GEIST.TABLE, label_zh: 工具类 }
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 数字列对齐
            jsx: |-
              <div className="flex w-48 flex-col text-label-14 tabular-nums">
                <div className="flex justify-between"><span>请求</span><span>1,204,511</span></div>
                <div className="flex justify-between"><span>错误</span><span>311</span></div>
                <div className="flex justify-between"><span>P95</span><span>48 ms</span></div>
              </div>

      - id: TYPE.READING
        title_zh: 长文行宽
        statement_zh: 长段落控制在每行 60 到 68 个字符；表格、表单这类结构化内容不受此限。
        params:
          line_length: { value: [60, 68], unit: chars, source: SRC.VERCEL.DESIGN_MD, label_zh: 长文行宽 }
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 正文限制行宽
            jsx: |-
              <p className="max-w-[68ch] text-copy-14 text-ds-gray-900">预览部署会为每个拉取请求生成一个独立地址，评审人打开就能看到这次改动的真实效果，合并后预览地址保留，方便回溯。</p>

      - id: TYPE.RICH_TEXT
        title_zh: 富文本
        statement_zh: 长文用正文类排版；正文里提到代码、路径、环境变量用 text-copy-13-mono；快捷键用键盘按键样式；多行源码用代码块，可复制的命令用命令片段，不用一段普通文字代替。
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 行内代码与快捷键
            jsx: |-
              <p className="text-copy-14">在项目根目录设置 <code className="text-copy-13-mono">DATABASE_URL</code>，然后按 <kbd className="rounded-md border border-ds-gray-400 px-1 text-label-12-mono">⌘ K</kbd> 打开命令面板。</p>

      - id: TYPE.OVERFLOW
        title_zh: 文字溢出
        statement_zh: 首尾都有信息的字符串（路径、地址、部署 ID、提交哈希）从中间省略，保留开头和结尾；句子、标题从末尾省略。被省略的值要能看到全文（文字提示）或一键复制。
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 句子从末尾省略，悬停看全文
            jsx: |-
              <div className="w-64 truncate text-label-14" title="修复了在 Safari 中预览部署的登录跳转问题">修复了在 Safari 中预览部署的登录跳转问题</div>

  # ───────────────────────────── 基础 · 标题层级 ─────────────────────────────
  - key: headings
    title_zh: 标题层级
    group: foundations
    prefix: HEADING
    summary_zh: 应用界面最多三级标题；每个视图一个 h1；标题逐级下降；类名决定样子，元素决定层级。
    rules:
      - id: HEADING.APP_LEVELS
        title_zh: 应用界面的标题级数
        statement_zh: 应用界面最多三级标题：页面标题 text-heading-24 或 32，区块标题 text-heading-20，子区块 text-heading-16；更大的标题类留给营销页和文档首页。
        params:
          page: { value: [24, 32], unit: px, source: SRC.POMASTER.PRESET, label_zh: 页面标题 }
          section: { value: 20, unit: px, source: SRC.POMASTER.PRESET, label_zh: 区块标题 }
          subsection: { value: 16, unit: px, source: SRC.POMASTER.PRESET, label_zh: 子区块 }
          max_levels: { value: 3, unit: count, source: SRC.POMASTER.PRESET, label_zh: 最多级数 }
        enforcement: { kind: gate, check: markup.heading-level-max }
        examples:
          - kind: do
            title_zh: 三级标题
            jsx: |-
              <div className="flex flex-col gap-3">
                <h2 className="text-heading-24">项目设置</h2>
                <h3 className="text-heading-20">构建与部署</h3>
                <h4 className="text-heading-16">构建命令</h4>
              </div>

      - id: HEADING.SINGLE_H1
        title_zh: 每个视图一个 h1
        statement_zh: 每个页面视图只有一个 h1，就是页面标题；卡片、对话框里的标题从 h2 往下排。
        enforcement: { kind: gate, check: markup.single-h1 }

      - id: HEADING.ORDER
        title_zh: 标题不跳级
        statement_zh: 标题逐级下降，不从 h2 直接跳到 h4；视觉层级和标题层级一致。
        anchors:
          - { spec: ui, quote: 标题层级 h1–h6 与视觉层级一致，不跳过层级 }
        enforcement: { kind: gate, check: markup.heading-order }

      - id: HEADING.CONTENT_LEVELS
        title_zh: 内容型页面的标题
        statement_zh: 文档、营销这类内容型页面可以用更大的标题类：首屏 text-heading-48 到 72，章节 text-heading-32，小节 text-heading-24。同一页面里每一级只用一种类。
        params:
          hero: { value: [48, 72], unit: px, source: SRC.POMASTER.PRESET, label_zh: 首屏 }
          chapter: { value: 32, unit: px, source: SRC.POMASTER.PRESET, label_zh: 章节 }
          section: { value: 24, unit: px, source: SRC.POMASTER.PRESET, label_zh: 小节 }
        enforcement: { kind: review }

      - id: HEADING.REAL_ELEMENT
        title_zh: 用真正的标题元素
        statement_zh: 标题用 h1 到 h6 元素，排版类只决定样子；不用 div 加标题类假装标题，也不为了字号挑标题元素。
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 元素定层级，类定样子
            jsx: |-
              <h2 className="text-heading-20">环境变量</h2>
          - kind: dont
            title_zh: div 假装标题
            code: |-
              <div className="text-heading-20">环境变量</div>
            lang: tsx

  # ───────────────────────────── 基础 · 图标 ─────────────────────────────
  - key: icons
    title_zh: 图标
    group: foundations
    prefix: ICON
    summary_zh: 一套线框图标；尺寸与间距跟随文字；颜色跟随文字；同一动作同一图标；纯图标按钮有名字。
    rules:
      - id: ICON.LIBRARY
        title_zh: 图标库
        statement_zh: 图标统一用 lucide-react，不混用第二套。Vercel 文档里的官方图标包 @vercel/geistcn-assets 在公开 npm 上装不到，能装后再评估替换。图标只在一个约定俗成的图标能让操作更快被认出时才用。
        params:
          library: { value: lucide-react, source: SRC.POMASTER.PRESET, label_zh: 图标库 }
          official: { value: "@vercel/geistcn-assets（公开 npm 上装不到）", source: SRC.GEIST.HOME, label_zh: Geist 官方图标包 }
        enforcement: { kind: gate, check: icon.single-library }

      - id: ICON.STYLE
        title_zh: 图标风格
        statement_zh: 只用线框图标，描边保持默认的 2；不在同一界面混用实心和线框，也不单独改某个图标的描边粗细。
        params:
          stroke: { value: 2, unit: px, source: SRC.LUCIDE, label_zh: 描边 }
        enforcement: { kind: review }

      - id: ICON.SIZE
        title_zh: 图标尺寸
        statement_zh: 图标尺寸跟随相邻文字：16px 配 text-label-14 和 text-button-14（默认）；14px 配 text-label-13、徽标里的小图标；12px 只用于 tiny 按钮这类最紧凑的位置；空状态这类独立出现的图标用 32px。
        params:
          default: { value: 16, unit: px, source: SRC.GEIST.PIE_GAUGE, label_zh: 默认（配 14 号文字） }
          compact: { value: 14, unit: px, source: SRC.POMASTER.PRESET, label_zh: 紧凑（配 13 号文字） }
          tiny: { value: 12, unit: px, source: SRC.POMASTER.PRESET, label_zh: 最小 }
          standalone: { value: 32, unit: px, source: SRC.GEIST.EMPTY_STATE, label_zh: 独立图标 }
        enforcement: { kind: review }
        showcase:
          - kind: specimen
            title_zh: 尺寸
            name_label_zh: 尺寸
            rows:
              - name: 12px · size-3
                usage_zh: tiny 按钮这类最紧凑的位置
                jsx: |-
                  <span className="flex items-center gap-1 text-label-12"><PlusIcon className="size-3" />添加</span>
              - name: 14px · size-3.5
                usage_zh: 配 text-label-13，徽标里的图标
                jsx: |-
                  <span className="flex items-center gap-1 text-label-13"><GitBranchIcon className="size-3.5" />main</span>
              - name: 16px · size-4
                usage_zh: 默认，配 text-label-14 与按钮
                jsx: |-
                  <span className="flex items-center gap-2 text-label-14"><SearchIcon className="size-4" />搜索项目</span>
              - name: 32px · size-8
                usage_zh: 空状态这类独立出现的图标
                jsx: |-
                  <ChartColumnIcon className="size-8 text-ds-gray-900" />

      - id: ICON.SPACING
        title_zh: 图标与文字的间距
        statement_zh: 图标和 14 号文字之间留 8px（gap-2），和 13、12 号文字之间留 6px 或 4px；按钮里的间距由组件给出，不手动加空格。
        params:
          gap: { value: 8, unit: px, source: SRC.POMASTER.PRESET, label_zh: 配 14 号文字 }
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 用 gap 留间距
            jsx: |-
              <span className="flex items-center gap-2 text-label-14"><GitBranchIcon />feature/design-standard</span>
          - kind: dont
            title_zh: 用空格隔开
            code: |-
              <span><GitBranchIcon />&nbsp;&nbsp;feature/design-standard</span>
            lang: tsx

      - id: ICON.COLOR
        title_zh: 图标颜色
        statement_zh: 图标跟随相邻文字的颜色（currentColor）：主要图标 gray-1000，次要图标 gray-900。彩色图标只用于状态，并且旁边有文字。
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 次要图标跟随次要文字
            jsx: |-
              <span className="flex items-center gap-2 text-label-13 text-ds-gray-900"><ClockIcon className="size-3.5" />3 分钟前</span>

      - id: ICON.SEMANTICS
        title_zh: 同一动作同一图标
        statement_zh: 同一个动作全系统用同一个图标（删除、复制、刷新、外链各一个），同一个图标不表示两种意思。
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 复制一律用同一个图标
            jsx: |-
              <div className="flex gap-2">
                <Button variant="secondary" size="small" prefix={<CopyIcon />}>复制地址</Button>
                <Button variant="secondary" size="small" prefix={<CopyIcon />}>复制部署 ID</Button>
              </div>

      - id: ICON.BUTTON_LABEL
        title_zh: 纯图标按钮的名称
        statement_zh: 只有图标的按钮必须带 aria-label，名称写动作和对象（「复制部署地址」），不写图标名（「复制」）；悬停时用文字提示显示同样的文字。按钮已经有可见文字时不要再加 aria-label。
        anchors:
          - { spec: ui, quote: MUST NOT 图标按钮缺少 aria-label 或等效可访问名称。 }
        enforcement: { kind: gate, check: markup.icon-button-label }
        examples:
          - kind: do
            title_zh: 带 aria-label
            jsx: |-
              <Button variant="secondary" svgOnly aria-label="刷新部署列表"><RefreshCwIcon /></Button>

  # ───────────────────────────── 基础 · 材质 ─────────────────────────────
  - key: materials
    title_zh: 材质
    group: foundations
    prefix: MATERIAL
    summary_zh: 圆角三档（6、12、16）；页面内四种表面、页面上四种浮层；只有提示气泡带指向三角；阴影半透明，只表达层级。
    rules:
      - id: MATERIAL.RADIUS
        title_zh: 圆角
        statement_zh: 圆角只取三档：日常控件、小表面、提示气泡 6px；卡片、菜单、对话框 12px；全屏层 16px。
        params:
          small: { value: 6, unit: px, source: SRC.GEIST.MATERIALS, label_zh: 控件与小表面 }
          large: { value: 12, unit: px, source: SRC.GEIST.MATERIALS, label_zh: 卡片、菜单、对话框 }
          fullscreen: { value: 16, unit: px, source: SRC.GEIST.MATERIALS, label_zh: 全屏层 }
        enforcement: { kind: review }
        showcase:
          - kind: specimen
            title_zh: 圆角
            name_label_zh: 类名 · 半径
            rows:
              - name: rounded-md · 6px
                usage_zh: 按钮、输入框、提示气泡
                jsx: |-
                  <div className="h-14 w-28 border border-ds-gray-400 bg-ds-background-100" style={{ borderRadius: p.small }} />
              - name: rounded-xl · 12px
                usage_zh: 卡片、菜单、对话框
                jsx: |-
                  <div className="h-14 w-28 border border-ds-gray-400 bg-ds-background-100" style={{ borderRadius: p.large }} />
              - name: rounded-2xl · 16px
                usage_zh: 全屏层
                jsx: |-
                  <div className="h-14 w-28 border border-ds-gray-400 bg-ds-background-100" style={{ borderRadius: p.fullscreen }} />

      - id: MATERIAL.SURFACES
        title_zh: 页面内的表面
        statement_zh: 页面内的表面按抬升程度分四种：base（日常）与 small（略抬起）用 6px 圆角，medium 与 large（更高）用 12px。同一层级的表面圆角一致。
        params:
          base: { value: 6, unit: px, source: SRC.GEIST.MATERIALS, label_zh: material-base }
          small: { value: 6, unit: px, source: SRC.GEIST.MATERIALS, label_zh: material-small }
          medium: { value: 12, unit: px, source: SRC.GEIST.MATERIALS, label_zh: material-medium }
          large: { value: 12, unit: px, source: SRC.GEIST.MATERIALS, label_zh: material-large }
        enforcement: { kind: review }
        showcase:
          - kind: specimen
            title_zh: 页面内
            name_label_zh: 材质
            rows:
              - name: material-base
                usage_zh: 日常使用，圆角 6px
                jsx: |-
                  <div className="h-14 w-36 border border-ds-gray-400 bg-ds-background-100" style={{ borderRadius: p.base }} />
              - name: material-small
                usage_zh: 略抬起，圆角 6px
                jsx: |-
                  <div className="h-14 w-36 border border-ds-gray-400 bg-ds-background-100 shadow-xs" style={{ borderRadius: p.small }} />
              - name: material-medium
                usage_zh: 更高，圆角 12px
                jsx: |-
                  <div className="h-14 w-36 border border-ds-gray-400 bg-ds-background-100 shadow-sm" style={{ borderRadius: p.medium }} />
              - name: material-large
                usage_zh: 更高，圆角 12px
                jsx: |-
                  <div className="h-14 w-36 border border-ds-gray-400 bg-ds-background-100 shadow-md" style={{ borderRadius: p.large }} />

      - id: MATERIAL.FLOATING
        title_zh: 浮层
        statement_zh: 浮在页面之上的元素：提示气泡 6px（阴影最轻，也是唯一带指向三角的浮层）；菜单 12px；对话框 12px（比菜单抬得更高）；全屏层 16px（抬得最高）。
        params:
          tooltip: { value: 6, unit: px, source: SRC.GEIST.MATERIALS, label_zh: material-tooltip }
          menu: { value: 12, unit: px, source: SRC.GEIST.MATERIALS, label_zh: material-menu }
          modal: { value: 12, unit: px, source: SRC.GEIST.MATERIALS, label_zh: material-modal }
          fullscreen: { value: 16, unit: px, source: SRC.GEIST.MATERIALS, label_zh: material-fullscreen }
        enforcement: { kind: review }
        showcase:
          - kind: specimen
            title_zh: 页面之上
            name_label_zh: 材质
            rows:
              - name: material-tooltip
                usage_zh: 阴影最轻，圆角 6px，唯一带指向三角
                jsx: |-
                  <div className="h-14 w-36 border border-ds-gray-400 bg-ds-background-100 shadow-sm" style={{ borderRadius: p.tooltip }} />
              - name: material-menu
                usage_zh: 从页面抬起，圆角 12px
                jsx: |-
                  <div className="h-14 w-36 border border-ds-gray-400 bg-ds-background-100 shadow-md" style={{ borderRadius: p.menu }} />
              - name: material-modal
                usage_zh: 抬得更高，圆角 12px
                jsx: |-
                  <div className="h-14 w-36 border border-ds-gray-400 bg-ds-background-100 shadow-lg" style={{ borderRadius: p.modal }} />
              - name: material-fullscreen
                usage_zh: 抬得最高，圆角 16px
                jsx: |-
                  <div className="h-14 w-36 border border-ds-gray-400 bg-ds-background-100 shadow-xl" style={{ borderRadius: p.fullscreen }} />

      - id: MATERIAL.SHADOWS
        title_zh: 阴影
        statement_zh: 阴影只表达层级，并且保持半透明，和底色融在一起；不用不透明的灰色阴影（会留下一圈灰晕），也不用装饰性阴影。各层级的具体阴影值待项目决定，当前示例用 Tailwind 的阴影档近似。
        params:
          values: { decision: 各层级的阴影取什么值？（Geist 未公开）, label_zh: 阴影值 }
        enforcement: { kind: review }
        examples:
          - kind: dont
            title_zh: 不透明的灰色阴影
            code: |-
              <div style={{ boxShadow: "0 4px 12px #bbbbbb" }}>…</div>
            lang: tsx

  # ───────────────────────────── 基础 · 圆角管理 ─────────────────────────────
  - key: radius
    title_zh: 圆角管理
    group: foundations
    prefix: RADIUS
    summary_zh: 圆角只取规范的档位；每类组件用哪一档有对照表；同一组件的尺寸越大圆角越大但有上限；嵌套时内层 = 外层 − 内边距；贴边与相接的那侧没有圆角；整圆只给短小的元素；媒体随容器裁切。
    rules:
      - id: RADIUS.TOKENS
        title_zh: 只用规范的圆角档
        statement_zh: 圆角值只取 MATERIAL.RADIUS 的三档（6 / 12 / 16，对应 rounded-md / rounded-xl / rounded-2xl），外加整圆 rounded-full；不写 rounded-[10px] 这类任意值，不在组件外层再套一层不同的圆角。
        anchors:
          - { spec: ui, quote: MUST NOT 写孤立色值、魔法间距和临时阴影。 }
        enforcement: { kind: gate, check: style.radius-token }
        examples:
          - kind: do
            title_zh: 用档位类
            code: |-
              <div className="rounded-xl border border-ds-gray-400">…</div>
            lang: tsx
          - kind: dont
            title_zh: 任意值
            code: |-
              <div className="rounded-[10px]">…</div>
            lang: tsx

      - id: RADIUS.BY_COMPONENT
        title_zh: 组件与圆角对照
        statement_zh: 每类组件用哪一档圆角按对照表执行，新组件先归到表里的一类再取值；同一页面上同类组件的圆角一致。
        enforcement: { kind: review }
        showcase:
          - kind: specimen
            title_zh: 组件用哪一档圆角
            name_label_zh: 组件
            rows:
              - name: 按钮、输入框、选择器、提示气泡（rounded-md）
                usage_zh: 6px
                jsx: |-
                  <div className="flex items-center gap-2"><Button size="small">按钮</Button><Input placeholder="输入框" className="w-36" /></div>
              - name: 卡片、菜单、对话框（rounded-xl）
                usage_zh: 12px
                jsx: |-
                  <div className="w-56 rounded-xl border border-ds-gray-400 bg-ds-background-100 p-4 text-label-14">卡片</div>
              - name: 全屏层（rounded-2xl）
                usage_zh: 16px
                jsx: |-
                  <div className="h-16 w-56 rounded-2xl border border-ds-gray-400 bg-ds-background-200" />
              - name: 头像、徽标、开关、进度条（rounded-full）
                usage_zh: 整圆
                jsx: |-
                  <div className="flex items-center gap-3"><span className="grid size-8 place-items-center rounded-full bg-ds-gray-200 text-label-13">王</span><Badge>Ready</Badge><Switch defaultChecked aria-label="开关" /></div>

      - id: RADIUS.SIZE_SCALE
        title_zh: 尺寸越大圆角越大，但有上限
        statement_zh: 控件统一用 6px，不随尺寸变化；容器按层级取 12px 或 16px，不超过 16px；不按像素尺寸按比例算圆角。
        enforcement: { kind: review }

      - id: RADIUS.NESTED
        title_zh: 嵌套时内层 = 外层 − 内边距
        statement_zh: "圆角容器里再放圆角元素时，内层圆角 = 外层圆角 − 两者之间的内边距（不小于 0），这样角落同心；内层直接贴边（没有内边距）时由外层裁切（overflow: hidden），内层不再单写圆角。"
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 内层减去内边距
            jsx: |-
              <div className="w-56 rounded-xl border border-ds-gray-400 p-2"><div className="rounded-md bg-ds-gray-100 p-3 text-label-13">外 12 − 内边距 6 = 内 6</div></div>
          - kind: dont
            title_zh: 内外同样的圆角
            jsx: |-
              <div className="w-56 rounded-xl border border-ds-gray-400 p-2"><div className="rounded-xl bg-ds-gray-100 p-3 text-label-13">内外都是 12，角落不同心</div></div>

      - id: RADIUS.FLUSH
        title_zh: 贴边与相接的那侧没有圆角
        statement_zh: 元素贴着容器边缘时，贴边那一侧不要圆角（卡片顶部的封面图只保留上面两个角，表格贴满卡片时由卡片裁切）；按钮组、输入框与前后缀相接处圆角为 0，只保留整组外侧的圆角（first:rounded-l-md last:rounded-r-md，中间 rounded-none）。
        enforcement: { kind: review }

      - id: RADIUS.PILL
        title_zh: 整圆只给短小的元素
        statement_zh: 整圆（胶囊、圆形）只用于徽标、计数、标签型状态、开关、进度条和头像；按钮、输入框不做胶囊，除非整个产品在主题里统一改；圆形图标按钮宽高相等。
        enforcement: { kind: review }

      - id: RADIUS.MEDIA
        title_zh: 媒体随容器裁切
        statement_zh: 图片、视频、地图、图表在圆角容器里由容器裁切，不各自再加圆角；单独出现的缩略图用控件那一档；头像用整圆；用户上传的图片不加阴影、描边之外的装饰。
        enforcement: { kind: review }

  # ───────────────────────────── 基础 · 投影 ─────────────────────────────
  - key: elevation
    title_zh: 投影
    group: foundations
    prefix: ELEV
    summary_zh: 投影只表达离页面多远：四个层级各一个阴影 token；页面内的区块用边框不用阴影；不手写阴影、不做发光；悬停最多升一级；阴影层级与叠放层级同序；深色主题改用更亮的表面；吸顶与固定列的阴影只在滚动后出现。
    rules:
      - id: ELEV.LEVELS
        title_zh: 四个层级各一个阴影
        statement_zh: 层级固定为四层：0 层贴在页面上；1 层是悬停抬起与吸顶后的元素；2 层是下拉、气泡、悬浮按钮；3 层是对话框、抽屉、通知。每层只有一个阴影 token，组件按所在层级取用（方向规则见 MATERIAL.SHADOWS）。
        params:
          values: { decision: 四个层级的阴影各取什么值？（Geist 未公开，与 MATERIAL.SHADOWS 同一决策）, label_zh: 层级阴影 }
        enforcement: { kind: review }
        showcase:
          - kind: specimen
            title_zh: 四个层级
            name_label_zh: 层级
            rows:
              - name: 第 0 层：贴在页面上（区块、表格、未悬停的卡片）
                usage_zh: 无阴影，用边框或底色区分
                jsx: |-
                  <div className="h-12 w-56 rounded-xl border border-ds-gray-400 bg-ds-background-100" />
              - name: 第 1 层：可点卡片悬停、吸顶表头滚动后
                usage_zh: shadow-sm（近似，值待定）
                jsx: |-
                  <div className="h-12 w-56 rounded-xl border border-ds-gray-400 bg-ds-background-100 shadow-sm" />
              - name: 第 2 层：菜单、提示气泡、悬浮按钮
                usage_zh: shadow-md（近似，值待定）
                jsx: |-
                  <div className="h-12 w-56 rounded-xl border border-ds-gray-400 bg-ds-background-100 shadow-md" />
              - name: 第 3 层：对话框、抽屉、通知
                usage_zh: shadow-lg（近似，值待定）
                jsx: |-
                  <div className="h-12 w-56 rounded-xl border border-ds-gray-400 bg-ds-background-100 shadow-lg" />

      - id: ELEV.FLAT_FIRST
        title_zh: 页面内的区块用边框不用阴影
        statement_zh: 页面里的区块、表格、表单分组用边框或底色区分，不用阴影；阴影只给浮在页面上、或者正在被拖动的东西；同一个元素不同时用粗边框和大阴影。
        enforcement: { kind: review }

      - id: ELEV.ONE_TOKEN
        title_zh: 不手写阴影、不做发光
        statement_zh: 阴影只取规范定下的层级类，不写 shadow-[…] 任意值；不做彩色、发光、内阴影装饰；阴影保持半透明，和底色融在一起。
        anchors:
          - { spec: ui, quote: MUST NOT 写孤立色值、魔法间距和临时阴影。 }
        enforcement: { kind: gate, check: style.shadow-token }
        examples:
          - kind: dont
            title_zh: 彩色发光阴影
            code: |-
              .promo { box-shadow: 0 0 24px rgba(99, 102, 241, 0.6); }
            lang: css

      - id: ELEV.HOVER
        title_zh: 悬停最多升一级
        statement_zh: 可点的卡片悬停时从 0 层升到 1 层（见 HOVER.SUBTLE），不跳到 2、3 层；浮层本身悬停不再变化；拖动中的元素升到 2 层，放下后回到原层。
        enforcement: { kind: review }

      - id: ELEV.Z_PAIR
        title_zh: 阴影层级与叠放层级同序
        statement_zh: 阴影层级和叠放层级（z-index，见 LAYOUT.Z_INDEX）同序：叠放在下面的元素不能有更重的阴影；同一层的两个浮层互相覆盖时，后出现的在上面。
        enforcement: { kind: review }

      - id: ELEV.DARK
        title_zh: 深色主题改用更亮的表面
        statement_zh: 深色背景上阴影几乎看不见，深色主题里层级改用更亮一档的表面色加细边框表达；阴影 token 随主题切换，组件不判断当前主题。
        anchors:
          - { spec: ui, quote: 表格、图表、弹层、焦点和状态随主题同步。 }
        enforcement: { kind: review }

      - id: ELEV.STICKY
        title_zh: 吸顶与固定列的阴影只在滚动后出现
        statement_zh: 吸顶的表头、工具栏和固定列，只有在内容滚到它下面时才显示分隔阴影或边框，静止时不显示（用滚动位置或 IntersectionObserver 切换一个类）。
        enforcement: { kind: review }

  # ───────────────────────────── 基础 · 布局 ─────────────────────────────
  - key: layout
    title_zh: 布局
    group: foundations
    prefix: LAYOUT
    summary_zh: 管理侧是顶栏加页内标签页；用户侧是移动端单列；先换行再缩小；外层管尺寸和滚动；层级只取预设档位。
    rules:
      - id: LAYOUT.ADMIN_SHELL
        title_zh: 管理侧页面骨架
        statement_zh: 管理侧页面是「顶栏（团队与项目切换）+ 页内标签页导航 + 内容区」；平级视图用标签页切换，不另开侧边菜单。内容区居中，最大宽度待项目决定。
        params:
          max_width: { value: 1400, unit: px, source: SRC.POMASTER.DEFAULTS, label_zh: 内容区最大宽度, note_zh: 以宽表格为主的管理端取宽档；纯阅读的页面可以更窄 }
        enforcement: { kind: review }

      - id: LAYOUT.PUBLIC_SHELL
        title_zh: 用户侧页面骨架
        statement_zh: 用户侧以移动端单列为基准：一列内容、底部主操作；小屏上的筛选、单个表单这类短任务用底部抽屉，不用对话框。
        enforcement: { kind: review }

      - id: LAYOUT.ADAPTIVE
        title_zh: 适配基准与验收宽度
        statement_zh: 断点用 Tailwind 的默认档（sm 640、md 768、lg 1024、xl 1280）；验收至少覆盖 375、768、1280 三个宽度。
        params:
          breakpoints: { value: [640, 768, 1024, 1280], unit: px, source: SRC.TAILWIND.BREAKPOINTS, label_zh: 断点 }
          acceptance: { value: [375, 768, 1280], unit: px, source: SRC.POMASTER.PRESET, label_zh: 验收宽度 }
        enforcement: { kind: review }

      - id: LAYOUT.CONTENT_REGION
        title_zh: 内容区边距与宽度
        statement_zh: 内容区左右边距随宽度取间距阶梯（手机 4 档、平板及以上 6 档），区块之间用 8 到 12 档；不同页面同一位置的边距一致。
        params:
          mobile_padding: { value: 4, unit: count, source: SRC.POMASTER.PRESET, label_zh: 手机边距（档） }
          padding: { value: 6, unit: count, source: SRC.POMASTER.PRESET, label_zh: 平板及以上边距（档） }
        enforcement: { kind: review }

      - id: LAYOUT.REFLOW
        title_zh: 先换行再缩小
        statement_zh: 空间不够时先重新排布（换行、换列），不先缩小字号；源码顺序就是阅读顺序。
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 按钮组允许换行
            jsx: |-
              <div className="flex w-72 flex-wrap gap-2">
                <Button variant="secondary" size="small">重新部署</Button>
                <Button variant="secondary" size="small">查看日志</Button>
                <Button variant="secondary" size="small">回滚</Button>
                <Button variant="secondary" size="small">分配域名</Button>
              </div>

      - id: LAYOUT.OVERFLOW
        title_zh: 尺寸与滚动的归属
        statement_zh: 网格和弹性布局的子项设 min-width 0，避免被长内容撑破；需要滚动时由明确的外层容器负责，不用 overflow 隐藏把内容藏起来。
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 子项 min-w-0，长文本截断
            jsx: |-
              <div className="flex w-72 items-center gap-2 rounded-md border border-ds-gray-400 p-3">
                <div className="min-w-0 flex-1 truncate text-label-14">pomaster-web-git-feature-design-standard-team.vercel.app</div>
                <Badge variant="secondary">Preview</Badge>
              </div>

      - id: LAYOUT.Z_INDEX
        title_zh: 层级
        statement_zh: 层级只取预设档位，从低到高：内容、吸顶元素、下拉与提示、抽屉、对话框、全局提示；不写任意的 z-index 数字。
        params:
          layers: { value: { base: 0, sticky: 10, header: 20, dropdown: 30, overlay: 40, modal: 50 }, unit: none, source: SRC.TAILWIND.Z_INDEX, label_zh: 层级档位, note_zh: 档位取 Tailwind 的 z-0 到 z-50，按层叠顺序给每档定名；页面只用这六个类 }
        enforcement: { kind: gate, check: style.no-raw-z-index }

  # ───────────────────────────── 基础 · 栅格 ─────────────────────────────
  - key: grid
    title_zh: 栅格
    group: foundations
    prefix: GRID
    summary_zh: 桌面 12 列、平板 6 列、手机 4 列；长文占 6 到 7 列；带参考线的二维布局才画参考线。
    rules:
      - id: GRID.COLUMNS
        title_zh: 栅格列数
        statement_zh: 外层栅格桌面 12 列、平板 6 列、手机 4 列；长文内容占 6 到 7 列，表格、图表和主要对比可以占满 12 列。
        params:
          desktop: { value: 12, unit: count, source: SRC.VERCEL.DESIGN_MD, label_zh: 桌面 }
          tablet: { value: 6, unit: count, source: SRC.VERCEL.DESIGN_MD, label_zh: 平板 }
          mobile: { value: 4, unit: count, source: SRC.VERCEL.DESIGN_MD, label_zh: 手机 }
          prose_span: { value: [6, 7], unit: count, source: SRC.VERCEL.DESIGN_MD, label_zh: 长文占列 }
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 12 列里长文占 7 列
            jsx: |-
              <div className="grid gap-4" style={{ gridTemplateColumns: `repeat(${p.desktop}, minmax(0, 1fr))` }}>
                <div className="rounded-md border border-ds-gray-400 p-3 text-copy-13" style={{ gridColumn: `span ${p.prose_span[1]}` }}>长文 · {p.prose_span[1]} 列</div>
                <div className="rounded-md bg-ds-gray-100 p-3 text-copy-13" style={{ gridColumn: `span ${p.desktop - p.prose_span[1]}` }}>侧栏 · {p.desktop - p.prose_span[1]} 列</div>
              </div>

      - id: GRID.GUTTER
        title_zh: 列间距
        statement_zh: 列间距取间距阶梯，同一个栅格里固定一档，不随窗口缩放。
        params:
          gutter: { value: [16, 24], unit: px, source: SRC.POMASTER.DEFAULTS, label_zh: 列间距, note_zh: 与 Ant Design 一侧一致：紧凑区 16、常规区 24（gap-4 / gap-6） }
        enforcement: { kind: gate, check: grid.gutter-allowed }

      - id: GRID.ROW_SUM
        title_zh: 一行的列数之和
        statement_zh: 一行里各格占的列数加起来不超过栅格总列数；超过就换行，不靠缩小格子硬塞。
        enforcement: { kind: gate, check: grid.row-sum }

      - id: GRID.BREAKPOINTS
        title_zh: 断点
        statement_zh: 响应式布局在 sm、md、lg 三个断点都写明列数和行数，让格子在手机、平板、桌面之间按预期重排；只用 Tailwind 的断点档，不自造断点。
        params:
          breakpoints: { value: [sm, md, lg], source: SRC.GEIST.GRID, label_zh: 必写的断点 }
        enforcement: { kind: gate, check: style.breakpoint-allowed }

      - id: GRID.GUIDES
        title_zh: 参考线
        statement_zh: 参考线和格子边框本身是设计的一部分时（营销页、文档首页），才画带参考线的网格；普通的响应式内容用 Tailwind 的 grid 工具类。网格最多嵌套一层；参考线是装饰，标 aria-hidden；可点的格子有自己的焦点环；参考线对比度不低于 3:1。
        params:
          guide_contrast: { value: 3, unit: ratio, source: SRC.GEIST.GRID, label_zh: 参考线最低对比度 }
          max_nesting: { value: 1, unit: count, source: SRC.GEIST.GRID, label_zh: 最多嵌套层数 }
        enforcement: { kind: review }

  # ───────────────────────────── 基础 · 间距 ─────────────────────────────
  - key: spacing
    title_zh: 间距
    group: foundations
    prefix: SPACING
    summary_zh: 间距只取间距阶梯（0.25rem 的整数倍）；组内、组间、区块、章节各用一段阶梯。
    rules:
      - id: SPACING.SCALE
        title_zh: 间距阶梯
        statement_zh: 间距只用间距阶梯（Tailwind 的 --spacing 基数 0.25rem 的整数倍），不写任意值。
        params:
          base: { value: 0.25rem, source: SRC.TAILWIND.SPACING, label_zh: 间距基数 --spacing }
        anchors:
          - { spec: ui, quote: MUST NOT 写孤立色值、魔法间距和临时阴影。 }
        enforcement: { kind: gate, check: style.spacing-scale }
        showcase:
          - kind: specimen
            title_zh: 常用档位
            name_label_zh: 类名 · 像素
            rows:
              - name: gap-1 · 4px
                usage_zh: 图标与 12 号文字
                jsx: |-
                  <div className="flex gap-1"><div className="size-6 rounded-md bg-ds-gray-200" /><div className="size-6 rounded-md bg-ds-gray-200" /></div>
              - name: gap-2 · 8px
                usage_zh: 组内元素、图标与 14 号文字
                jsx: |-
                  <div className="flex gap-2"><div className="size-6 rounded-md bg-ds-gray-200" /><div className="size-6 rounded-md bg-ds-gray-200" /></div>
              - name: gap-4 · 16px
                usage_zh: 组内较松的排布
                jsx: |-
                  <div className="flex gap-4"><div className="size-6 rounded-md bg-ds-gray-200" /><div className="size-6 rounded-md bg-ds-gray-200" /></div>
              - name: gap-6 · 24px
                usage_zh: 组与组之间
                jsx: |-
                  <div className="flex gap-6"><div className="size-6 rounded-md bg-ds-gray-200" /><div className="size-6 rounded-md bg-ds-gray-200" /></div>
              - name: gap-8 · 32px
                usage_zh: 组与组之间、区块转折
                jsx: |-
                  <div className="flex gap-8"><div className="size-6 rounded-md bg-ds-gray-200" /><div className="size-6 rounded-md bg-ds-gray-200" /></div>
              - name: gap-12 · 48px
                usage_zh: 大区块转折
                jsx: |-
                  <div className="flex gap-12"><div className="size-6 rounded-md bg-ds-gray-200" /><div className="size-6 rounded-md bg-ds-gray-200" /></div>
        examples:
          - kind: dont
            title_zh: 任意值
            code: |-
              <div className="mt-[13px] gap-[7px]">…</div>
            lang: tsx

      - id: SPACING.TIERS
        title_zh: 间距分档
        statement_zh: 按元素之间的关系选档：组内元素用第 2 到 4 档，组与组之间用第 6 到 8 档，大区块转折用第 8 到 12 档；第 16 档只用于真正的章节分隔，不作为页面默认间距。
        params:
          within_group: { value: [2, 4], unit: count, source: SRC.VERCEL.DESIGN_MD, label_zh: 组内档位 }
          between_groups: { value: [6, 8], unit: count, source: SRC.VERCEL.DESIGN_MD, label_zh: 组间档位 }
          sections: { value: [8, 12], unit: count, source: SRC.VERCEL.DESIGN_MD, label_zh: 区块档位 }
          chapter: { value: 16, unit: count, source: SRC.VERCEL.DESIGN_MD, label_zh: 章节档位 }
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 组内 gap-2，组间 gap-6
            jsx: |-
              <div className="flex flex-col gap-6">
                <div className="flex flex-col gap-2"><Label>项目名称</Label><Input defaultValue="pomaster-web" /></div>
                <div className="flex flex-col gap-2"><Label>根目录</Label><Input defaultValue="apps/web" /></div>
              </div>

  # ───────────────────────────── 基础 · 动效 ─────────────────────────────
  - key: motion
    title_zh: 动效
    group: foundations
    prefix: MOTION
    summary_zh: 默认静止；动效只用来解释状态变化、保持连续、确认操作；时长取过渡默认值；尊重减少动效设置。
    rules:
      - id: MOTION.PURPOSE
        title_zh: 动效要有理由
        statement_zh: 界面默认静止。动效只用于三件事：解释状态变化、保持视觉连续、确认一个操作。不用跑马灯、打字光标、脉冲指示、弹跳、视差和滚动出现效果。
        enforcement: { kind: review }

      - id: MOTION.DURATION
        title_zh: 时长与缓动
        statement_zh: 颜色、边框这类状态过渡用过渡工具类的默认时长与缓动；提示气泡、卡片浮层保留约 150ms 的出现延迟，避免鼠标扫过时闪烁。
        params:
          duration: { value: 150ms, source: SRC.TAILWIND.TRANSITIONS, label_zh: 默认过渡时长 }
          easing: { value: "cubic-bezier(0.4, 0, 0.2, 1)", source: SRC.TAILWIND.TRANSITIONS, label_zh: 默认缓动 }
          hover_delay: { value: 150ms, source: SRC.GEIST.TOOLTIP, label_zh: 提示出现延迟 }
        enforcement: { kind: review }
        showcase:
          - kind: specimen
            title_zh: 过渡
            description_zh: 把指针移到轨道上看速度。
            name_label_zh: 时长
            rows:
              - name: 150ms
                usage_zh: 颜色、边框、背景的状态过渡
                jsx: |-
                  <div className="std-motion-track"><span className="std-motion-dot" style={{ transitionDuration: p.duration, transitionTimingFunction: p.easing }} /></div>

      - id: MOTION.REDUCED
        title_zh: 减少动效
        statement_zh: 用户开启「减少动效」时，关闭或降级动画、滚动和过渡；用 Tailwind 的 motion-safe / motion-reduce 变体写动效。
        anchors:
          - { spec: ui, quote: 尊重 prefers-reduced-motion：动画、滚动、过渡在减少动效模式下关闭或降级 }
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 只在允许动效时转动
            code: |-
              <Loader2Icon className="motion-safe:animate-spin" />
            lang: tsx

  # ───────────────────────────── 基础 · 点击反馈 ─────────────────────────────
  - key: press_feedback
    title_zh: 点击反馈
    group: foundations
    prefix: PRESS
    summary_zh: 每个可点的元素都有默认、悬停、按下、聚焦与禁用；按下的瞬间就有反馈，颜色加深一档、不移动不变尺寸；波纹只用组件库自带的；时长取快档；触屏去掉点击延迟、目标够大；键盘触发同样的反馈；禁用与加载中不响应；减少动效时只保留颜色变化。
    rules:
      - id: PRESS.STATES
        title_zh: 可点的元素都有五态
        statement_zh: 每个可点的元素都设计默认、悬停、按下、聚焦、禁用五态；按下态在按下的瞬间出现，不等请求返回；松开后回到悬停态。
        anchors:
          - { spec: ui, quote: hover、active、focus、disabled、loading、empty、error 状态完整。 }
        enforcement: { kind: review }
        showcase:
          - kind: demo
            title_zh: 按下态
            description_zh: 按住按钮看按下态；松开回到悬停态。
            jsx: |-
              <div className="flex items-center gap-3">
                <Button>按住看按下态</Button>
                <Button variant="secondary">次要按钮</Button>
                <button type="button" className="rounded-md px-3 py-2 text-label-14 transition-colors duration-150 hover:bg-ds-gray-100 active:bg-ds-gray-200">列表行式的按钮</button>
              </div>

      - id: PRESS.VISUAL
        title_zh: 按下时颜色加深一档
        statement_zh: 按下时背景比悬停再深一档（如 hover:bg-ds-gray-100 → active:bg-ds-gray-200）；不移动位置、不改尺寸、不改边框宽度；按钮是否加轻微缩小由项目统一决定。
        params:
          scale: { decision: 按钮按下时是否缩小？, candidates: [不缩小, scale(0.98)], label_zh: 按下缩放 }
        enforcement: { kind: review }

      - id: PRESS.WAVE
        title_zh: 波纹只用组件库自带的
        statement_zh: Geist 不用点击波纹；按钮、列表行、卡片的按下都用背景色变化表示，不引入 ripple 一类效果。
        enforcement: { kind: review }

      - id: PRESS.TIMING
        title_zh: 按下即时、回弹取快档
        statement_zh: 按下态即时出现（不加过渡延迟），松开回弹用快档时长；点击动画不长于 200ms，也不阻塞下一次点击。
        params:
          release: { value: 150ms, source: SRC.TAILWIND.TRANSITIONS, label_zh: 回弹时长 }
        enforcement: { kind: review }

      - id: PRESS.TOUCH
        title_zh: 触屏：无延迟、目标够大
        statement_zh: "可点元素设 touch-action: manipulation 去掉双击缩放带来的点击延迟；去掉系统的灰色点按高亮时必须提供自己的按下态；点击目标至少 24×24 CSS px（建议 44×44），相邻目标之间留出间距。"
        params:
          target_min: { value: 24, unit: px, source: SRC.POMASTER.UI_SPEC, label_zh: 最小点击目标 }
        anchors:
          - { spec: ui, quote: 触控目标尺寸至少 24×24 CSS px，且目标之间提供足够间距（WCAG 2.5.8）；建议达到 44×44（AAA）。 }
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 触屏点按
            code: |-
              button, a, [role='button'] {
                touch-action: manipulation;
                -webkit-tap-highlight-color: transparent; /* 前提：有自己的 :active 样式 */
              }
            lang: css

      - id: PRESS.KEYBOARD
        title_zh: 键盘触发同样的反馈
        statement_zh: 可点元素用真正的 button / a 元素，空格与回车能触发并显示按下态；用 div 模拟按钮时要补上 role、tabindex 和键盘处理，否则不算可点。
        enforcement: { kind: review }

      - id: PRESS.DISABLED
        title_zh: 禁用与加载中不响应
        statement_zh: 禁用和加载中的元素没有悬停、按下效果，点击不触发任何反馈动画；禁用的光标为 not-allowed；加载中的按钮保持宽度不变（见 CMP.BUTTON.LOADING）。
        enforcement: { kind: review }

      - id: PRESS.REDUCED
        title_zh: 减少动效时只保留颜色变化
        statement_zh: 减少动效模式下去掉缩放与波纹，保留按下时的颜色变化；状态仍然看得出来。
        anchors:
          - { spec: ui, quote: 尊重 prefers-reduced-motion：动画、滚动、过渡在减少动效模式下关闭或降级 }
        enforcement: { kind: review }

  # ───────────────────────────── 基础 · 焦点环 ─────────────────────────────
  - key: focus_ring
    title_zh: 焦点环
    group: foundations
    prefix: FOCUS
    summary_zh: 焦点只在键盘聚焦时显示且永远不去掉；全站一种焦点样式；与相邻颜色有足够对比；不被裁切、不被吸顶栏遮住；焦点顺序与视觉顺序一致，弹层进出时焦点有去处；焦点环跟随元素圆角。
    rules:
      - id: FOCUS.VISIBLE
        title_zh: 键盘聚焦时显示，永远不去掉
        statement_zh: "焦点样式写在 :focus-visible 上（鼠标点击不出现，键盘聚焦一定出现）；不写 outline: none 而不给同等可见的替代。"
        anchors:
          - { spec: ui, quote: MUST NOT 移除焦点轮廓而无同等级可见替代。 }
        enforcement: { kind: review }
        examples:
          - kind: dont
            title_zh: 去掉焦点不给替代
            code: |-
              button:focus { outline: none; }
            lang: css
        showcase:
          - kind: demo
            title_zh: 用 Tab 键依次聚焦
            description_zh: 点击不出焦点环，按 Tab 才出；自定义元素与组件同一种样式。
            jsx: |-
              <div className="flex items-center gap-3">
                <Button variant="secondary">按 Tab 看焦点</Button>
                <Input placeholder="输入框" className="w-36" />
                <a href="#" className="rounded-md text-label-14 text-ds-gray-1000 no-underline underline-offset-4 outline-none hover:underline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-ds-blue-700">自定义链接</a>
              </div>

      - id: FOCUS.STYLE
        title_zh: 全站一种焦点样式
        statement_zh: 全站一种焦点样式：2px 蓝色轮廓（ds-blue-700）、外偏移 2px（与 Button 组件一致），写成共享的类，自己写的可点元素都用它。
        params:
          width: { value: 2, unit: px, source: SRC.POMASTER.PRESET, label_zh: 轮廓宽度 }
          offset: { value: 2, unit: px, source: SRC.POMASTER.PRESET, label_zh: 轮廓偏移 }
        anchors:
          - { spec: ui, quote: SHOULD 提供统一、设计系统级别的 focus indicator token（颜色、宽度、offset、:focus-visible）。 }
        enforcement: { kind: review }

      - id: FOCUS.CONTRAST
        title_zh: 与相邻颜色对比足够
        statement_zh: 焦点指示与相邻背景的对比度至少 3:1；在深色、彩色背景上换用能看清的颜色，不靠颜色变化本身表示焦点。
        anchors:
          - { spec: ui, quote: 颜色不得作为唯一信息来源；文本对比度至少 4.5:1，大文本至少 3:1，UI 组件/图标边界至少 3:1（WCAG 1.4.1 / 1.4.3 / 1.4.11）。 }
        enforcement: { kind: review }

      - id: FOCUS.NOT_OBSCURED
        title_zh: 不被裁切、不被遮住
        statement_zh: "overflow: hidden 的容器里改用内收的轮廓（负偏移或 inset 阴影），避免焦点环被裁掉；吸顶栏、固定底栏不能盖住获得焦点的元素（给滚动容器设 scroll-padding）。"
        anchors:
          - { spec: ui, quote: 焦点必须可见，且不得被吸顶栏、浮层、sticky 元素完全遮挡（WCAG 2.4.7 / 2.4.11）。 }
        enforcement: { kind: review }

      - id: FOCUS.ORDER
        title_zh: 焦点顺序与去处
        statement_zh: Tab 顺序与视觉顺序一致，不用正数 tabindex；弹层、抽屉、对话框打开时焦点进入，关闭后回到触发它的元素；只有模态层把焦点困在里面。
        anchors:
          - { spec: ui, quote: 弹层、抽屉、对话框打开后必须接管焦点，关闭后返回触发元素；背景不得保持可 Tab（WCAG 2.4.3 / 2.1.2）。 }
        enforcement: { kind: review }

      - id: FOCUS.RADIUS
        title_zh: 焦点环跟随元素圆角
        statement_zh: 焦点轮廓的圆角与元素一致（outline 会跟随 border-radius；用 box-shadow 画焦点时同样带圆角）；圆形按钮的焦点环也是圆的。
        enforcement: { kind: review }

  # ───────────────────────────── 组件 · 通用 · 按钮 ─────────────────────────────
  - key: button
    title_zh: 按钮
    group: components.general
    prefix: CMP.BUTTON
    summary_zh: 触发一个会改变状态的动作（部署、保存、删除）；改地址的跳转用链接按钮；一行有多个相关动作时用菜单或分裂按钮。
    playground:
      component: Button
      text_zh: 部署项目
      props:
        variant: { options: [default, secondary, tertiary, error, warning], default: default }
        size: { options: [tiny, small, medium, large], default: medium }
        shape: { options: [square, rounded], default: square }
        loading: { boolean: true, default: false }
        disabled: { boolean: true, default: false }
      matrix: { rows: variant, columns: size }
    rules:
      - id: CMP.BUTTON.USAGE
        title_zh: 何时用
        statement_zh: 按钮用于改变状态的动作（部署、保存、删除）；改变地址的导航用链接按钮。一行里有不止一个相关动作时，换成菜单或分裂按钮。
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 一个主操作配一个次要操作
            jsx: |-
              <div className="flex gap-2">
                <Button>部署项目</Button>
                <Button variant="secondary">查看日志</Button>
              </div>

      - id: CMP.BUTTON.VARIANTS
        title_zh: 变体
        statement_zh: 五种变体：default 是主操作；secondary 是辅助操作；tertiary 用于最次要的操作；error 用于破坏性的确认；warning 用于需要留意后果的操作。没有 primary、success、ghost 这类变体。
        params:
          variants: { value: [default, secondary, tertiary, error, warning], source: SRC.GEIST.BUTTON, label_zh: variant 取值 }
        enforcement: { kind: gate, check: markup.single-primary-button }
        showcase:
          - kind: specimen
            title_zh: 五种变体
            name_label_zh: variant
            rows:
              - name: default
                usage_zh: 主操作，一个操作区一个
                jsx: |-
                  <Button>部署项目</Button>
              - name: secondary
                usage_zh: 辅助操作
                jsx: |-
                  <Button variant="secondary">查看日志</Button>
              - name: tertiary
                usage_zh: 最次要的操作
                jsx: |-
                  <Button variant="tertiary">取消</Button>
              - name: error
                usage_zh: 破坏性的确认
                jsx: |-
                  <Button variant="error">删除项目</Button>
              - name: warning
                usage_zh: 需要留意后果的操作
                jsx: |-
                  <Button variant="warning">回滚部署</Button>

      - id: CMP.BUTTON.DANGER
        title_zh: 危险操作
        statement_zh: 破坏性的确认用 error 变体，文案是「动词 + 对象」，并且和完成后的提示一一对应：按钮「删除项目」，提示「项目已删除」。高风险操作（删除生产资源、吊销密钥）要求输入资源名确认。
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 动词加对象
            jsx: |-
              <Button variant="error">删除项目</Button>
          - kind: dont
            title_zh: 只有一个「删除」
            jsx: |-
              <Button variant="error">删除</Button>

      - id: CMP.BUTTON.SIZES
        title_zh: 尺寸
        statement_zh: 四种尺寸：tiny、small、medium（默认）、large。同一个操作区尺寸一致；tiny 只用于放在输入框里的小按钮。
        params:
          heights: { value: [24, 32, 40, 48], unit: px, source: SRC.POMASTER.PRESET, label_zh: 高度, note_zh: Geist 未公开像素高度，按 tiny / small / medium / large 取预设值 }
        enforcement: { kind: review }
        showcase:
          - kind: specimen
            title_zh: 四种尺寸
            name_label_zh: size
            rows:
              - name: tiny
                usage_zh: 输入框里的小按钮
                jsx: |-
                  <Button size="tiny">复制</Button>
              - name: small
                usage_zh: 表格行、卡片角落
                jsx: |-
                  <Button size="small">部署项目</Button>
              - name: medium
                usage_zh: 默认
                jsx: |-
                  <Button>部署项目</Button>
              - name: large
                usage_zh: 营销页、单列页面的主操作
                jsx: |-
                  <Button size="large">部署项目</Button>

      - id: CMP.BUTTON.SHAPES
        title_zh: 形状
        statement_zh: 默认是圆角矩形；纯图标按钮可以是方形或圆形；胶囊形（rounded）配阴影，只用于营销页。
        enforcement: { kind: review }
        showcase:
          - kind: demo
            title_zh: 形状
            jsx: |-
              <div className="flex items-center gap-3">
                <Button>部署项目</Button>
                <Button variant="secondary" svgOnly aria-label="上一页"><ArrowLeftIcon /></Button>
                <Button variant="secondary" shape="circle" svgOnly aria-label="下一页"><ArrowRightIcon /></Button>
                <Button shape="rounded" shadow>开始部署</Button>
              </div>

      - id: CMP.BUTTON.ICONS
        title_zh: 搭配图标
        statement_zh: 图标通过前缀、后缀放进按钮：前缀图标表达动作本身，后缀图标表达去向（箭头、外链）。同一个按钮区要么都带图标，要么都不带。
        enforcement: { kind: review }
        showcase:
          - kind: demo
            title_zh: 前缀与后缀
            jsx: |-
              <div className="flex gap-3">
                <Button variant="secondary" prefix={<ArrowLeftIcon />}>返回</Button>
                <Button variant="secondary" suffix={<ArrowRightIcon />}>下一步</Button>
                <Button variant="secondary" suffix={<ExternalLinkIcon />}>打开预览</Button>
              </div>

      - id: CMP.BUTTON.ICON_ONLY
        title_zh: 纯图标按钮
        statement_zh: 纯图标按钮设 svgOnly，并且必须带 aria-label；名称写动作和对象（「复制部署地址」），不写图标名。
        anchors:
          - { spec: ui, quote: MUST NOT 图标按钮缺少 aria-label 或等效可访问名称。 }
        enforcement: { kind: gate, check: markup.icon-button-label }
        examples:
          - kind: do
            title_zh: 有名称
            jsx: |-
              <Button variant="secondary" svgOnly aria-label="复制部署地址"><CopyIcon /></Button>
          - kind: dont
            title_zh: 读屏只能读出「按钮」
            code: |-
              <Button variant="secondary" svgOnly><CopyIcon /></Button>
            lang: tsx

      - id: CMP.BUTTON.LOADING
        title_zh: 加载
        statement_zh: 进行中的操作用按钮自身的 loading，按钮保持可聚焦并向读屏报告忙碌状态；不要把按钮换成一个单独的转圈图标。
        enforcement: { kind: review }
        showcase:
          - kind: demo
            title_zh: 加载状态
            jsx: |-
              <div className="flex gap-3">
                <Button loading>部署中</Button>
                <Button variant="secondary" loading>保存中</Button>
              </div>

      - id: CMP.BUTTON.DISABLED
        title_zh: 禁用
        statement_zh: 只有动作此刻做不了（缺少输入、权限不够）才禁用，并配文字提示说明原因。
        enforcement: { kind: review }
        showcase:
          - kind: demo
            title_zh: 禁用的五种变体
            jsx: |-
              <div className="flex flex-wrap gap-3">
                <Button disabled>部署项目</Button>
                <Button variant="secondary" disabled>查看日志</Button>
                <Button variant="tertiary" disabled>取消</Button>
                <Button variant="error" disabled>删除项目</Button>
                <Button variant="warning" disabled>回滚部署</Button>
              </div>

      - id: CMP.BUTTON.LINK
        title_zh: 链接按钮
        statement_zh: 改变地址的导航用链接按钮（与按钮同样的属性，渲染成链接）；不用按钮的点击事件去跳转。
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 链接按钮
            jsx: |-
              <ButtonLink variant="secondary" href="#/deployments">查看全部部署</ButtonLink>
          - kind: dont
            title_zh: 点击事件里跳转
            code: |-
              <Button onClick={() => router.push("/deployments")}>查看全部部署</Button>
            lang: tsx

      - id: CMP.BUTTON.WIDTH
        title_zh: 宽度
        statement_zh: 按钮宽度由文字决定；需要固定宽度时设宽度，单列表单的主操作可以占满整行。
        enforcement: { kind: review }
        showcase:
          - kind: demo
            title_zh: 占满整行
            jsx: |-
              <div className="w-80"><Button className="w-full">继续</Button></div>

      - id: CMP.BUTTON.SUBMIT
        title_zh: 表单提交
        statement_zh: 表单的提交按钮设 type="submit"，回车即可提交；一个表单一个提交按钮。项目里的按钮用 variant 选变体（对应 Geist 文档里的 type 属性），原生 type 照常写。
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 提交按钮
            code: |-
              <form onSubmit={onSave}>
                <Input name="name" />
                <Button type="submit">保存项目</Button>
              </form>
            lang: tsx

      - id: CMP.BUTTON.LABEL
        title_zh: 文案
        statement_zh: 文案说清会发生什么：「部署项目」「邀请成员」「轮换密钥」；不用光秃秃的「提交」，也不用「确定」「好的」这类泛泛的确认。切换方式的按钮加「改用」：「改用恢复码」。
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 说清会发生什么
            jsx: |-
              <Button>邀请成员</Button>
          - kind: dont
            title_zh: 泛泛的「确定」
            jsx: |-
              <Button>确定</Button>

  - key: split_button
    title_zh: 分裂按钮
    group: components.general
    prefix: CMP.SPLIT_BUTTON
    summary_zh: 主操作 + 一组相关操作：左边直接执行最常用的那个，右边箭头展开其余选项；箭头按钮有自己的名称。
    rules:
      - id: CMP.SPLIT_BUTTON.WHEN
        title_zh: 什么时候用分裂按钮
        statement_zh: 一个主操作有几种变体（立即派单 / 定时派单 / 批量派单、导出 Excel / CSV / PDF），而其中一种最常用时，用分裂按钮：左边执行最常用的，右边展开其余；几个操作同等重要时平铺成按钮，不藏进菜单。
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 最常用的在左边
            jsx: |-
              <SplitButton menuLabel="更多派单方式" actions={[{ key: "schedule", label: "定时派单" }, { key: "batch", label: "批量派单" }]}>立即派单</SplitButton>

      - id: CMP.SPLIT_BUTTON.MENU_LABEL
        title_zh: 箭头按钮要有名称
        statement_zh: 右边的箭头是独立的按钮，带 aria-label（「更多派单方式」）与 aria-haspopup，键盘能单独聚焦、回车展开（Radix DropdownMenu）；菜单项的文字是完整的动作，不只写名词。
        enforcement: { kind: review }

      - id: CMP.SPLIT_BUTTON.LIMIT
        title_zh: 菜单项克制
        statement_zh: 菜单里放 2 到 7 项；危险操作放最后并用分隔线隔开；不在菜单里再套子菜单；左边的主操作不能是危险操作。
        enforcement: { kind: review }

  - key: copy_button
    title_zh: 复制按钮
    group: components.general
    prefix: CMP.COPY_BUTTON
    summary_zh: 复制一段文本（编号、命令、链接、密钥）：结果即时可见、读屏可知，失败给出替代办法。
    rules:
      - id: CMP.COPY_BUTTON.WHEN
        title_zh: 什么时候给复制按钮
        statement_zh: 用户要把一段文本带去别处（订单号、车牌号、命令、邀请链接、API 密钥）时，在文本旁边放复制按钮；可复制的文本本身也保持可选中，复制按钮只是快捷方式。
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 文本旁放复制按钮
            jsx: |-
              <div className="flex items-center gap-2"><span className="font-mono text-copy-14">ORD-20261107-0042</span><CopyButton value="ORD-20261107-0042" label="复制订单号" /></div>

      - id: CMP.COPY_BUTTON.FEEDBACK
        title_zh: 复制成功即时反馈
        statement_zh: 点了之后图标立即变成对勾、约 2 秒后复原，同时用礼貌的 aria-live 播报「已复制」；不额外弹 Toast（一次复制不值得打断）。
        params:
          reset: { value: 2000, unit: ms, source: SRC.POMASTER.PRESET, label_zh: 对勾停留 }
        enforcement: { kind: review }

      - id: CMP.COPY_BUTTON.FAILURE
        title_zh: 剪贴板不可用时
        statement_zh: 浏览器不给剪贴板权限（非安全上下文、被策略禁止）时说明原因，并把文本选中方便用户手动复制；不静默失败。
        enforcement: { kind: review }

      - id: CMP.COPY_BUTTON.LABEL
        title_zh: 纯图标按钮带名称
        statement_zh: 复制按钮通常只有图标，必须带写明对象的名称（「复制订单号」，不是「复制」）；同一行有多个可复制内容时，名称能区分它们。
        enforcement: { kind: review }

  - key: float_button
    title_zh: 悬浮按钮
    group: components.general
    prefix: CMP.FLOAT_BUTTON
    summary_zh: 悬浮在页面角落的全局入口（联系客服、反馈、回到顶部）：一页最多一组，不遮挡内容，带名称。
    rules:
      - id: CMP.FLOAT_BUTTON.WHEN
        title_zh: 只放全局辅助入口
        statement_zh: 悬浮按钮只放和当前页面内容无关、随时可能用到的入口：联系客服、提交反馈、回到顶部；页面的主操作放在页头或工具栏，不做成悬浮按钮。
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 全局辅助入口
            jsx: |-
              <div className="relative h-32 w-72 rounded-xl border border-dashed border-ds-gray-500"><div className="absolute bottom-4 right-4"><FloatButton position="static" label="联系调度员" badge={3}><HeadsetIcon /></FloatButton></div></div>

      - id: CMP.FLOAT_BUTTON.PLACEMENT
        title_zh: 位置与避让
        statement_zh: 固定在右下角，距边缘 24px 起；不遮挡页脚、分页和表格最后一行（页面底部留出等高的内边距）；移动端避开安全区与底部导航。
        params:
          offset: { value: 24, unit: px, source: SRC.POMASTER.PRESET, label_zh: 距边缘 }
        enforcement: { kind: review }

      - id: CMP.FLOAT_BUTTON.LIMIT
        title_zh: 一页最多一组
        statement_zh: 一页最多一个悬浮按钮，或一组（展开后不超过 3 个）；组里的每一项都带名称与文字提示。
        enforcement: { kind: review }

      - id: CMP.FLOAT_BUTTON.BACK_TOP
        title_zh: 回到顶部
        statement_zh: 「回到顶部」在页面滚动超过一屏后才出现；点了之后平滑滚回顶部（减少动效时直接跳转），并把焦点交给页面标题。
        enforcement: { kind: review }

  - key: typography_text
    title_zh: 排版文本
    group: components.general
    prefix: CMP.TEXT
    summary_zh: 文字只取排版档位与语义色调；省略要能看到全文；行内代码、标记、键盘各用对应语义。
    playground:
      component: Text
      text_zh: 车辆年检将在 7 天后到期
      props:
        variant: { options: [copy-14, copy-13, label-14, heading-16], default: copy-14 }
        tone: { options: [default, secondary, success, warning, error], default: default }
    rules:
      - id: CMP.TEXT.SCALE
        title_zh: 只用排版档位
        statement_zh: 文字的字号只取 Geist 排版类（text-heading-* / text-label-* / text-copy-*），用 Text 组件或排版类，不写 text-[15px] 这类自造字号。
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 标题、正文、次要文字
            jsx: |-
              <div className="flex flex-col gap-2"><Text variant="heading-20" asChild><h4>本周派单</h4></Text><Text>已完成 128 单，3 单超时未签收。</Text><Text variant="copy-13" tone="secondary">数据每 5 分钟刷新一次</Text></div>

      - id: CMP.TEXT.TONE
        title_zh: 语义色调
        statement_zh: 文字颜色只用语义色调：默认、次要、成功、警告、危险；危险色只用于错误与危险操作的说明，不用来强调普通内容；状态不只靠颜色，文字本身要说清。
        enforcement: { kind: review }

      - id: CMP.TEXT.ELLIPSIS
        title_zh: 省略要能看到全文
        statement_zh: 单行省略、多行省略都要让用户看到全文（悬停提示、展开按钮或 title）；路径、编号这类结尾有区分度的内容用中间省略。
        enforcement: { kind: review }

      - id: CMP.TEXT.SEMANTICS
        title_zh: 行内语义
        statement_zh: 行内代码用 <code>（Geist Code），键盘按键用 Kbd，删除用 <del>、插入用 <ins>、标记用 <mark>，不只改样式。
        enforcement: { kind: review }

  - key: code_block
    title_zh: 代码块
    group: components.general
    prefix: CMP.CODE_BLOCK
    summary_zh: 多行代码与配置：文件名标题栏 + 复制；不折行、横向滚动；等宽字体；高亮只用于讲解。
    rules:
      - id: CMP.CODE_BLOCK.WHEN
        title_zh: 什么时候用代码块
        statement_zh: 多行代码、配置文件、接口返回示例用代码块；一两个词的代码写在行内（code）；要在终端执行的命令用命令片段（snippet），不用代码块。
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 文件名 + 复制 + 等宽
            jsx: |-
              <CodeBlock className="w-full max-w-[440px]" filename="src/api/vehicle.ts" code={"export function useVehicleList(filters) {\n  return useQuery({ queryKey: [\"vehicle\", \"list\", filters], queryFn: () => vehicleApi.list(filters) })\n}"} />

      - id: CMP.CODE_BLOCK.HEADER
        title_zh: 标题栏
        statement_zh: 标题栏写文件名或语言，右侧是带名称的复制按钮（「复制代码」）；复制的是代码原文，不带行号。
        enforcement: { kind: review }

      - id: CMP.CODE_BLOCK.WRAP
        title_zh: 不折行，横向滚动
        statement_zh: 代码不自动折行（折行会改变缩进的含义），超宽时代码区横向滚动，滚动区可用键盘聚焦；字体取等宽字体 token，字号比正文小一档。
        enforcement: { kind: review }

      - id: CMP.CODE_BLOCK.HIGHLIGHT
        title_zh: 高亮只用于讲解
        statement_zh: 需要指出某几行时用行高亮加文字说明，不只靠颜色；语法着色可选，颜色取主题 token，不引入整套高亮主题色。
        enforcement: { kind: review }

  - key: snippet
    title_zh: 命令片段
    group: components.general
    prefix: CMP.SNIPPET
    summary_zh: 要复制到终端执行的命令：行首提示符不进剪贴板；一行一个命令；整段可复制。
    rules:
      - id: CMP.SNIPPET.WHEN
        title_zh: 什么时候用命令片段
        statement_zh: 让用户在终端里执行的命令（安装、启动、迁移）用命令片段；配置文件、多行脚本用代码块。
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 提示符不进剪贴板
            jsx: |-
              <Snippet text="corepack pnpm studio:react:dev" />

      - id: CMP.SNIPPET.PROMPT
        title_zh: 提示符与输出
        statement_zh: 行首的「$」提示符只是标识，不选中、不进剪贴板；命令的输出不放在同一个片段里，需要展示输出时另起一个代码块。
        enforcement: { kind: review }

      - id: CMP.SNIPPET.MULTI_LINE
        title_zh: 一行一个命令
        statement_zh: 多个命令分行写，每行一个，按执行顺序排列；不用 && 把不相关的命令串成一行；需要逐条执行时每条单独可复制。
        enforcement: { kind: review }

      - id: CMP.SNIPPET.PLACEHOLDER
        title_zh: 占位写法
        statement_zh: 命令里需要用户替换的部分用大写占位（YOUR_API_TOKEN、<项目目录>）并在片段下方说明；不放真实密钥。
        enforcement: { kind: review }

  - key: kbd
    title_zh: 键盘按键
    group: components.general
    prefix: CMP.KBD
    summary_zh: 快捷键提示：用键盘按键的语义标注；按平台显示 ⌘ 或 Ctrl；快捷键只是加速，不是唯一入口。
    rules:
      - id: CMP.KBD.WHEN
        title_zh: 什么时候显示快捷键
        statement_zh: 常用操作的快捷键显示在菜单项右侧、按钮的文字提示里或帮助面板中；不在页面正文里大量罗列。
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 菜单项右侧显示快捷键
            jsx: |-
              <div className="flex items-center gap-2 text-copy-14"><span>打开命令面板</span><KbdGroup><Kbd>⌘</Kbd><Kbd>K</Kbd></KbdGroup></div>

      - id: CMP.KBD.PLATFORM
        title_zh: 按平台显示
        statement_zh: macOS 显示 ⌘ ⌥ ⇧，Windows / Linux 显示 Ctrl Alt Shift；按用户平台判断，不两套都写；非 QWERTY 键盘布局下按实际键位提示。
        enforcement: { kind: review }

      - id: CMP.KBD.COMBO
        title_zh: 组合键的写法
        statement_zh: 组合键每个键单独一个按键标注，键与键之间用不换行空格或「+」连接，整组不被折行拆开。
        enforcement: { kind: review }

      - id: CMP.KBD.NOT_ONLY
        title_zh: 不是唯一入口
        statement_zh: 每个快捷键对应的操作在界面上都有可点击的入口；快捷键不和浏览器、读屏软件的常用快捷键冲突。
        enforcement: { kind: review }

  - key: divider
    title_zh: 分割线
    group: components.layout
    prefix: CMP.DIVIDER
    summary_zh: 分隔两块内容：优先用间距分组，分隔线只在间距不够时用；带文字的分隔线用于长表单分段。
    rules:
      - id: CMP.DIVIDER.SPACING_FIRST
        title_zh: 先用间距，再用线
        statement_zh: 相关内容用间距分组（PROXIMITY），只有间距不足以区分时才加分隔线；卡片之间、列表项之间不同时用间距和线。
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 线只在需要时
            jsx: |-
              <div className="flex w-80 flex-col gap-3 text-copy-14"><span>基本信息</span><Separator /><span>证件信息</span></div>

      - id: CMP.DIVIDER.TEXT
        title_zh: 带文字的分隔线用于分段
        statement_zh: 长表单或长详情里，带文字的分隔线可以作为轻量的分段标题；文字左对齐，不居中。
        enforcement: { kind: review }

      - id: CMP.DIVIDER.VERTICAL
        title_zh: 竖线分隔行内元素
        statement_zh: 竖向分隔线用于分隔同一行的文字链接或元信息（「编辑 | 复制」），高度与文字一致。
        enforcement: { kind: review }

  - key: flex
    title_zh: 弹性布局
    group: components.layout
    prefix: CMP.FLEX
    summary_zh: 一维排布：方向、对齐、换行与间距；间距只取档位，不用外边距拼。
    rules:
      - id: CMP.FLEX.USE
        title_zh: 一维排布用弹性布局
        statement_zh: 一行或一列里的元素排布用 Flex 组件或 flex 工具类（flex-col、justify-*、items-*、gap-*、flex-wrap），二维排布用 grid；不靠 float 或外边距。
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 方向、对齐与间距
            jsx: |-
              <Flex justify="between" align="center" className="w-full max-w-[360px]"><span className="text-copy-14">沪A·D2391</span><Flex gap={2}><Button size="small" variant="secondary">编辑</Button><Button size="small">派单</Button></Flex></Flex>

      - id: CMP.FLEX.GAP
        title_zh: 间距只取档位
        statement_zh: 元素之间的间距用 gap，取间距阶梯（小 8、中 16、大 24）；不在子元素上各自写外边距。
        enforcement: { kind: review }

      - id: CMP.FLEX.WRAP
        title_zh: 换行
        statement_zh: 可能放不下的行允许换行，换行后行间距与列间距一致；不让内容溢出产生横向滚动。
        enforcement: { kind: review }

  - key: space
    title_zh: 间距组合
    group: components.layout
    prefix: CMP.SPACE
    summary_zh: 行内元素之间的统一间距：按钮组、标签组、表单行内控件用间距组件而不是各自写外边距。
    rules:
      - id: CMP.SPACE.USE
        title_zh: 用间距组件，不手写外边距
        statement_zh: 一组并排的按钮、标签、行内控件用 flex + gap（gap-2 / gap-3 / gap-4，取间距阶梯），不在每个元素上写 margin；需要相接的按钮组用相邻圆角归零的组合。
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 统一间距
            jsx: |-
              <div className="flex gap-2"><Button>新建车辆</Button><Button variant="secondary">导入</Button><Button variant="secondary">导出</Button></div>
          - kind: dont
            title_zh: 各自写外边距
            code: |-
              <Button className="mr-[10px]">导入</Button><Button className="mr-[10px]">导出</Button>
            lang: tsx

      - id: CMP.SPACE.WRAP
        title_zh: 放不下就换行
        statement_zh: 间距组可能放不下时允许换行（wrap），换行后的行间距与列间距一致；不出现横向滚动。
        enforcement: { kind: review }

      - id: CMP.SPACE.ALIGN
        title_zh: 对齐基线
        statement_zh: 不同高度的元素并排时按中线对齐（align=center），文字与输入框并排时按基线对齐。
        enforcement: { kind: review }

  - key: grid_component
    title_zh: 栅格组件
    group: components.layout
    prefix: CMP.GRID
    summary_zh: 二维排布：按栏数切分、栏间距取档位、随断点变化；内容区不靠固定像素宽度。
    rules:
      - id: CMP.GRID.COLUMNS
        title_zh: 栏数
        statement_zh: 用 12 栏栅格（Grid / GridCell 或 grid-cols-12），span 之和每行不超过 12；常用切分 12、6+6、4+4+4、3×4。
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 按栏数切分
            jsx: |-
              <Grid className="w-full max-w-[440px]" gutter={16}><GridCell span={8} className="rounded-md bg-ds-background-200 p-2 text-label-13">订单列表 · 8</GridCell><GridCell span={4} className="rounded-md bg-ds-background-200 p-2 text-label-13">筛选 · 4</GridCell></Grid>

      - id: CMP.GRID.GUTTER
        title_zh: 栏间距
        statement_zh: 栏间距只取规范的档位（16 / 24），同一页面统一；横向与纵向间距一致时用同一个值。
        enforcement: { kind: review }

      - id: CMP.GRID.RESPONSIVE
        title_zh: 随断点变化
        statement_zh: 窄屏下多栏改为少栏或单栏（按断点 token 切换 span），不缩小字号硬塞；栅格只负责版面，组件内部的排布用弹性布局。
        enforcement: { kind: review }

  - key: page_layout
    title_zh: 页面布局
    group: components.layout
    prefix: CMP.LAYOUT
    summary_zh: 后台页面骨架：顶栏 + 可收起的侧栏 + 内容区；侧栏状态记住；固定的顶栏不遮挡焦点。
    rules:
      - id: CMP.LAYOUT.SHELL
        title_zh: 页面骨架
        statement_zh: 管理侧页面用顶栏（品牌、全局搜索、用户菜单）+ 左侧边栏（主导航，可收起为图标栏）+ 内容区；内容区背景用 ds-background-200，内容卡片用 ds-background-100。
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 顶栏 + 侧栏 + 内容
            jsx: |-
              <div className="flex h-44 w-full max-w-[440px] flex-col overflow-hidden rounded-xl border border-ds-gray-400"><div className="flex h-10 items-center border-b border-ds-gray-400 bg-ds-background-100 px-4 text-label-14">车队调度</div><div className="flex flex-1"><nav aria-label="主导航" className="w-28 border-r border-ds-gray-400 bg-ds-background-100 p-2 text-copy-13">车辆 · 司机</nav><main className="flex-1 bg-ds-background-200 p-4 text-copy-14">内容区</main></div></div>

      - id: CMP.LAYOUT.SIDER
        title_zh: 侧栏收起与记忆
        statement_zh: 侧栏可以收起为只有图标的窄栏（收起按钮带名称与 aria-expanded），收起状态按用户记住；窄屏下侧栏变成抽屉。
        enforcement: { kind: review }

      - id: CMP.LAYOUT.STICKY
        title_zh: 固定的顶栏不遮挡焦点
        statement_zh: 顶栏固定时，页面设置与顶栏等高的 scroll-padding-top，锚点跳转与键盘聚焦的元素不被顶栏盖住。
        enforcement: { kind: review }

      - id: CMP.LAYOUT.CONTENT
        title_zh: 内容区宽度
        statement_zh: 表单与详情类页面的内容区设最大宽度，避免超宽屏上一行过长；列表与看板类页面铺满可用宽度。
        enforcement: { kind: review }

  - key: scroller
    title_zh: 滚动区
    group: components.layout
    prefix: CMP.SCROLLER
    summary_zh: 局部滚动区：只在必要时用；能用键盘滚动、有名称；不嵌套滚动；滚动条可见。
    rules:
      - id: CMP.SCROLLER.WHEN
        title_zh: 只在必要时局部滚动
        statement_zh: 固定高度的面板（侧栏列表、下拉、对话框正文、日志）才用局部滚动；页面主体随页面滚动，不把整页内容塞进一个固定高度的滚动框。
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 固定高度的列表
            jsx: |-
              <ScrollArea className="h-36 w-56 rounded-lg border border-ds-gray-400"><ul className="p-2">{Array.from({ length: 12 }, (_, i) => <li key={i} className="px-2 py-1 text-copy-14">沪A·D{2300 + i}</li>)}</ul></ScrollArea>

      - id: CMP.SCROLLER.KEYBOARD
        title_zh: 键盘可滚、有名称
        statement_zh: 滚动区可以被键盘聚焦（tabindex=0）并有可读名称（role=region + aria-label），方向键与翻页键能滚动；聚焦时有焦点环。
        enforcement: { kind: review }

      - id: CMP.SCROLLER.NESTING
        title_zh: 不嵌套滚动
        statement_zh: "避免滚动区里再套滚动区；对话框、抽屉里的滚动设 overscroll-behavior: contain，滚到头不带动底下的页面。"
        enforcement: { kind: review }

      - id: CMP.SCROLLER.SCROLLBAR
        title_zh: 滚动条可见
        statement_zh: 有可滚动内容时保留可见的滚动条（可以变细），不隐藏滚动条只留拖拽手势；内容不足时不出现多余的滚动条。
        enforcement: { kind: review }

  - key: anchor
    title_zh: 锚点
    group: components.navigation
    prefix: CMP.ANCHOR
    summary_zh: 长页面的本页目录：链接到页内标题，当前段落高亮；不用它做跨页导航。
    rules:
      - id: CMP.ANCHOR.WHEN
        title_zh: 什么时候用锚点
        statement_zh: 超过三屏、分成多个段落的长页面（规范页、详情页、设置页）在右侧放本页目录；目录只链接本页的标题，跨页导航用侧栏或标签页。
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 右侧本页目录
            jsx: |-
              <Anchor defaultActive="basic" items={[{ id: "basic", label: "基本信息" }, { id: "driver", label: "司机" }, { id: "repair", label: "保养记录" }]} />

      - id: CMP.ANCHOR.ACTIVE
        title_zh: 当前段落高亮
        statement_zh: 滚动时高亮当前所在的段落（aria-current），点击后平滑滚动到标题（减少动效时直接跳转），并把焦点交给标题；标题设 scroll-margin-top，不被固定的顶栏盖住。
        enforcement: { kind: review }

      - id: CMP.ANCHOR.DEPTH
        title_zh: 层级
        statement_zh: 目录最多两级；标题文字与页面里的标题一致；段落少于 3 个时不放目录。
        enforcement: { kind: review }

  - key: breadcrumb
    title_zh: 面包屑
    group: components.navigation
    prefix: CMP.BREADCRUMB
    summary_zh: 显示当前页面在层级中的位置：从一级菜单开始、最后一项是当前页且不可点；层级超过 4 级时折叠中间。
    rules:
      - id: CMP.BREADCRUMB.PATH
        title_zh: 从一级开始、最后一项不可点
        statement_zh: 面包屑从一级菜单开始（不从「首页」开始，除非首页是真实的一级入口），最后一项是当前页标题且不可点；中间项可点并回到对应列表时恢复其筛选（CONTEXT）。
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 层级路径
            jsx: |-
              <nav aria-label="面包屑" className="flex items-center gap-2 text-copy-14"><a href="#" className="text-ds-gray-900 no-underline">车辆管理</a><span className="text-ds-gray-900">/</span><a href="#" className="text-ds-gray-900 no-underline">车辆台账</a><span className="text-ds-gray-900">/</span><span aria-current="page" className="text-ds-gray-1000">沪A12345</span></nav>

      - id: CMP.BREADCRUMB.COLLAPSE
        title_zh: 太深就折叠
        statement_zh: 超过 4 级时折叠中间层级为「…」并可展开；单层页面不显示面包屑。
        enforcement: { kind: review }

      - id: CMP.BREADCRUMB.NAMES
        title_zh: 名称与菜单一致
        statement_zh: 面包屑里的名称与菜单、页面标题一致；详情页用对象名称（车牌号、单号），不用「详情」。
        enforcement: { kind: review }

  - key: dropdown
    title_zh: 下拉菜单
    group: components.navigation
    prefix: CMP.DROPDOWN
    summary_zh: 收起一组次要操作或选项：触发器说清会展开什么；菜单项是动作、按频率排序、危险项最后并分隔。
    rules:
      - id: CMP.DROPDOWN.TRIGGER
        title_zh: 触发器说清会展开什么
        statement_zh: 触发器写「更多」或带向下箭头的动作名（「导出 ▾」）；悬停触发只用于导航菜单，操作菜单用点击触发；键盘可打开、上下键移动、Esc 关闭。
        enforcement: { kind: review }

      - id: CMP.DROPDOWN.ITEMS
        title_zh: 动作排序、危险最后
        statement_zh: 菜单项是动作（动词开头），按使用频率排序；危险操作放最后，用分隔线隔开并用危险色；不可用的项置灰并说明原因。
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 危险项分隔在最后
            jsx: |-
              <DropdownMenu><DropdownMenuTrigger asChild><Button size="small" variant="secondary">更多操作</Button></DropdownMenuTrigger><DropdownMenuContent className="w-44" align="start"><DropdownMenuItem>编辑</DropdownMenuItem><DropdownMenuItem>复制为新车辆</DropdownMenuItem><DropdownMenuSeparator /><DropdownMenuItem variant="destructive">删除</DropdownMenuItem></DropdownMenuContent></DropdownMenu>

      - id: CMP.DROPDOWN.SIZE
        title_zh: 菜单不宜过长
        statement_zh: 菜单项不超过 10 个，超过分组（带组标题）或改为对话框选择；嵌套子菜单最多一层。
        enforcement: { kind: review }

  - key: context_menu
    title_zh: 右键菜单
    group: components.navigation
    prefix: CMP.CONTEXT_MENU
    summary_zh: 右键菜单只是快捷方式：里面的每个操作在界面别处也找得到；键盘能打开。
    rules:
      - id: CMP.CONTEXT_MENU.SHORTCUT_ONLY
        title_zh: 只是快捷方式
        statement_zh: 右键菜单里的操作（查看、复制、停用）都要在界面别处有入口（行内按钮、「更多」菜单）；不把某个操作只放在右键菜单里，很多人不知道可以右键。
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 右键打开
            jsx: |-
              <ContextMenu><ContextMenuTrigger className="flex h-24 w-64 items-center justify-center rounded-xl border border-dashed border-ds-gray-500 text-copy-14 text-ds-gray-900">在这里点右键</ContextMenuTrigger><ContextMenuContent><ContextMenuItem>查看详情</ContextMenuItem><ContextMenuItem>复制车牌号</ContextMenuItem><ContextMenuSeparator /><ContextMenuItem variant="destructive">停用车辆</ContextMenuItem></ContextMenuContent></ContextMenu>

      - id: CMP.CONTEXT_MENU.KEYBOARD
        title_zh: 键盘能打开
        statement_zh: 聚焦的元素上按菜单键或 Shift+F10 也能打开右键菜单；菜单里上下键移动、回车执行、Esc 关闭并把焦点还回去。
        enforcement: { kind: review }

      - id: CMP.CONTEXT_MENU.CONTENT
        title_zh: 内容克制
        statement_zh: 右键菜单放与被点对象直接相关的 3 到 8 项，按「查看 → 编辑 → 复制 → 危险操作」排列，危险操作在最后并用分隔线隔开。
        enforcement: { kind: review }

  - key: command_menu
    title_zh: 命令面板
    group: components.navigation
    prefix: CMP.COMMAND_MENU
    summary_zh: ⌘K 打开的全局命令面板：输入即筛选，键盘为主；命令名与界面上的叫法一致。
    rules:
      - id: CMP.COMMAND_MENU.WHEN
        title_zh: 什么时候提供命令面板
        statement_zh: 功能多、熟练用户多的工作台提供命令面板（⌘K / Ctrl+K），集中「跳转到某页」「执行某个操作」；它是加速，不替代导航与按钮。
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 按分组列出命令
            jsx: |-
              <div><Button variant="secondary" onClick={() => set({ open: true })}>搜索命令 ⌘K</Button><CommandMenu open={Boolean(s.open)} onOpenChange={(open) => set({ open })} items={[{ id: "new", label: "新建订单", group: "操作", shortcut: "N" }, { id: "vehicles", label: "前往车辆列表", group: "跳转" }]} /></div>

      - id: CMP.COMMAND_MENU.KEYBOARD
        title_zh: 键盘为主
        statement_zh: 打开后焦点在输入框，输入即筛选（名称与拼音、英文关键词都能搜），上下键移动、回车执行、Esc 关闭并把焦点还回去；结果列表是 listbox，当前项由 aria-activedescendant 指出。
        enforcement: { kind: review }

      - id: CMP.COMMAND_MENU.NAMING
        title_zh: 命令的叫法
        statement_zh: 命令名与界面上的按钮、菜单、页面标题一致（「新建订单」，不是「订单创建」）；有快捷键的在右侧显示；没有结果时说明并给出下一步（换个关键词、去帮助中心）。
        enforcement: { kind: review }

  - key: nav_menu
    title_zh: 导航菜单
    group: components.navigation
    prefix: CMP.NAV_MENU
    summary_zh: 应用的主导航：层级不超过两级、当前位置高亮；菜单项按权限出现；折叠后图标可辨认。
    rules:
      - id: CMP.NAV_MENU.DEPTH
        title_zh: 不超过两级
        statement_zh: 侧边主导航最多两级（分组 + 页面）；第三层放到页面内的标签页或筛选里；菜单名与页面标题一致。
        enforcement: { kind: review }

      - id: CMP.NAV_MENU.ACTIVE
        title_zh: 当前位置高亮
        statement_zh: 当前页面对应的菜单项高亮，进入详情页时其所属列表的菜单项仍高亮；展开状态记住（SIDEBAR）。
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 当前项高亮
            jsx: |-
              <nav className="flex w-56 flex-col gap-1 text-copy-14"><span className="px-3 py-1 text-label-12 text-ds-gray-900">车辆管理</span><a href="#" aria-current="page" className="rounded-md bg-ds-gray-200 px-3 py-2 text-ds-gray-1000 no-underline">车辆台账</a><a href="#" className="rounded-md px-3 py-2 text-ds-gray-900 no-underline">保险管理</a></nav>

      - id: CMP.NAV_MENU.PERMISSION
        title_zh: 按权限出现
        statement_zh: 没有权限的菜单项不显示（不是置灰）；整组都没有权限时整组不显示；菜单权限与路由守卫用同一份权限码（GUARD）。
        enforcement: { kind: review }

  - key: pagination
    title_zh: 分页
    group: components.navigation
    prefix: CMP.PAGINATION
    summary_zh: 分页：显示总数与当前范围，每页条数可选；页码进 URL；数据量不确定时用「加载更多」。
    rules:
      - id: CMP.PAGINATION.TOTAL
        title_zh: 显示总数与范围
        statement_zh: 显示总条数（「共 1,248 条」），每页条数可选 10 / 20 / 50 / 100；总页数多时显示快速跳转；只有一页时不显示分页。
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 总数与每页条数
            jsx: |-
              <nav aria-label="分页" className="flex items-center gap-3 text-copy-14"><span className="text-ds-gray-900">共 1,248 条</span><Button size="small" variant="secondary">上一页</Button><span className="tabular-nums">3 / 63</span><Button size="small" variant="secondary">下一页</Button></nav>

      - id: CMP.PAGINATION.URL
        title_zh: 页码进 URL
        statement_zh: 页码与每页条数写进 URL（STATE.URL）；筛选条件变化时回到第 1 页；删除当前页最后一条后回到上一页。
        enforcement: { kind: review }

      - id: CMP.PAGINATION.POSITION
        title_zh: 位置固定
        statement_zh: 表格分页放在表格右下方，与表格右边对齐；列表很长时可以在顶部也放一个简洁版。
        enforcement: { kind: review }

  - key: load_more
    title_zh: 加载更多
    group: components.navigation
    prefix: CMP.LOAD_MORE
    summary_zh: 追加式列表的「加载更多」：按钮而不是无限滚动；读屏知道加载了多少；到底了说清楚。
    rules:
      - id: CMP.LOAD_MORE.WHEN
        title_zh: 按钮加载，不用无限滚动
        statement_zh: 动态、评论、消息这类追加式列表用「加载更多」按钮（与接口的游标分页一致），不用滚到底自动加载：页脚要能到达、位置要能保持、键盘用户能控制节奏。
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 加载更多按钮
            jsx: |-
              <div className="flex w-80 flex-col gap-3"><ul className="divide-y divide-ds-gray-400 text-copy-14"><li className="py-2">第 1 条动态</li><li className="py-2">第 2 条动态</li></ul><LoadMore loading={false} hasMore loadedCount={2} onLoadMore={() => undefined} /></div>

      - id: CMP.LOAD_MORE.STATE
        title_zh: 加载中与读屏
        statement_zh: 加载中按钮保留文字并显示转圈、不能重复点；加载完成后用礼貌的 aria-live 播报「已加载 30 条」，焦点留在按钮上，新内容出现在按钮前面。
        enforcement: { kind: review }

      - id: CMP.LOAD_MORE.END
        title_zh: 到底了
        statement_zh: 没有更多时按钮换成「没有更多了」的说明（不是禁用的按钮）；加载失败时就地显示原因与「重试」。
        enforcement: { kind: review }

  - key: steps
    title_zh: 步骤条
    group: components.navigation
    prefix: CMP.STEPS
    summary_zh: 多步流程的进度：步骤 3–5 个、名称是名词；当前步骤、已完成、出错分明；可回到已完成的步骤修改。
    rules:
      - id: CMP.STEPS.COUNT
        title_zh: 3–5 步
        statement_zh: 步骤控制在 3–5 个，每步名称是名词或短动宾（「填写车辆」「上传证件」「确认提交」）；超过 5 步合并或拆成多个流程。
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 当前与出错
            jsx: |-
              <ol className="m-0 flex w-[480px] list-none items-center gap-3 p-0 text-label-13"><li className="flex items-center gap-2 text-ds-gray-1000"><span className="grid size-6 place-items-center rounded-full bg-ds-gray-1000 text-ds-background-100">1</span>填写车辆</li><li aria-hidden="true" className="h-px flex-1 bg-ds-gray-400" /><li className="flex items-center gap-2 text-ds-red-700"><span className="grid size-6 place-items-center rounded-full border border-ds-red-700">2</span>上传证件</li><li aria-hidden="true" className="h-px flex-1 bg-ds-gray-400" /><li className="flex items-center gap-2 text-ds-gray-900"><span className="grid size-6 place-items-center rounded-full border border-ds-gray-400">3</span>确认提交</li></ol>

      - id: CMP.STEPS.STATUS
        title_zh: 状态分明
        statement_zh: 已完成、当前、未开始、出错四种状态样式分明，出错的步骤写原因；已完成的步骤可点回去修改，未开始的不可跳过。
        enforcement: { kind: review }

      - id: CMP.STEPS.SAVE
        title_zh: 跨步保存
        statement_zh: 每步完成时保存草稿（FORM 草稿），中途离开再回来停在原步骤；最后一步汇总全部信息再提交。
        enforcement: { kind: review }

  - key: tabs
    title_zh: 标签页
    group: components.navigation
    prefix: CMP.TABS
    summary_zh: 同一页面内平级视图的切换：标签名短、数量少；当前标签进 URL；不把流程步骤做成标签页。
    rules:
      - id: CMP.TABS.WHEN
        title_zh: 平级视图才用标签页
        statement_zh: 标签页切换同一对象的平级视图（基本信息 / 维修记录 / 费用）；有先后顺序的流程用步骤条；标签多于 7 个时考虑拆页或用侧栏导航。
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 平级视图
            jsx: |-
              <Tabs defaultValue="repair" className="w-[420px]"><TabsList><TabsTrigger value="base">基本信息</TabsTrigger><TabsTrigger value="repair">维修记录（3）</TabsTrigger><TabsTrigger value="cost">费用</TabsTrigger></TabsList></Tabs>

      - id: CMP.TABS.URL
        title_zh: 当前标签进 URL
        statement_zh: 当前标签写进 URL（查询参数或子路由），刷新与分享后停在同一标签；切换标签不丢失其他标签里未保存的内容（或切换前提示）。
        enforcement: { kind: review }

      - id: CMP.TABS.LABEL
        title_zh: 标签名短，可带计数
        statement_zh: 标签名 2–6 个字，可以带计数（「维修记录（3）」）；不在标签名里放图标以外的装饰；禁用的标签说明原因。
        enforcement: { kind: review }

  - key: auto_complete
    title_zh: 自动完成
    group: components.entry
    prefix: CMP.AUTO_COMPLETE
    summary_zh: 自由输入 + 建议：可以输入建议之外的值；建议随输入更新；键盘可选。
    rules:
      - id: CMP.AUTO_COMPLETE.WHEN
        title_zh: 和可搜索选择的区别
        statement_zh: 允许输入任意值、建议只是帮忙（地址、搜索词、邮箱后缀）时用自动完成；只能从给定选项里选时用可搜索选择（combobox）。
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 输入时给建议
            jsx: |-
              <div className="flex w-72 flex-col gap-2"><Label htmlFor="ac">目的地</Label><AutoComplete id="ac" value={s.q ?? ""} onValueChange={(q) => set({ q })} suggestions={[{ value: "浦东机场 T1", label: "浦东机场 T1" }, { value: "虹桥火车站", label: "虹桥火车站" }]} placeholder="输入地点" /></div>

      - id: CMP.AUTO_COMPLETE.SUGGEST
        title_zh: 建议怎么给
        statement_zh: 输入时防抖后请求建议（约 300ms），取消过期请求；匹配的部分加粗；最多显示 8 条，没有建议时不弹空列表。
        params:
          debounce: { value: 300, unit: ms, source: SRC.POMASTER.PRESET, label_zh: 防抖 }
          max: { value: 8, source: SRC.POMASTER.PRESET, label_zh: 最多条数 }
        enforcement: { kind: review }

      - id: CMP.AUTO_COMPLETE.KEYBOARD
        title_zh: 键盘可选
        statement_zh: 建议列表是 listbox，上下键移动（aria-activedescendant 指向当前项）、回车采用、Esc 收起并保留已输入的文字；采用建议不自动提交。
        enforcement: { kind: review }

  - key: combobox
    title_zh: 可搜索选择
    group: components.entry
    prefix: CMP.COMBOBOX
    summary_zh: 选项多时的可搜索单选：只能选列表里的值；按名称与拼音搜；无结果时说明。
    rules:
      - id: CMP.COMBOBOX.WHEN
        title_zh: 什么时候用可搜索选择
        statement_zh: 选项超过 10 个的单选用 Combobox（触发按钮 + 弹层里的搜索框与列表），选项少时用 Select；允许输入列表外的值时改用 AutoComplete。
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 搜索并选择
            jsx: |-
              <div className="flex w-72 flex-col gap-2"><Label htmlFor="cb">指派司机</Label><Combobox id="cb" options={[{ value: "zw", label: "张伟", keywords: ["zhangwei"] }, { value: "ln", label: "李娜", keywords: ["lina"] }, { value: "wf", label: "王芳", keywords: ["wangfang"] }, { value: "ly", label: "刘洋", keywords: ["liuyang"] }]} value={s.v ?? null} onValueChange={(v) => set({ v })} placeholder="选择司机" searchPlaceholder="搜索姓名或拼音" /></div>

      - id: CMP.COMBOBOX.SEARCH
        title_zh: 怎么搜
        statement_zh: 按显示名称、拼音全拼与首字母、编号搜；匹配不区分大小写；选项来自接口时远程搜索并防抖，加载中在列表里显示加载态。
        enforcement: { kind: review }

      - id: CMP.COMBOBOX.EMPTY
        title_zh: 无结果
        statement_zh: 没有匹配时在列表里说明「没有找到」并给出下一步（换个关键词，或新建一个）；不显示空白弹层。
        enforcement: { kind: review }

  - key: cascader
    title_zh: 级联选择
    group: components.entry
    prefix: CMP.CASCADER
    summary_zh: 层级数据逐级选择（省市区、类目）：每级一列，选到叶子才算完；触发器显示完整路径。
    rules:
      - id: CMP.CASCADER.WHEN
        title_zh: 什么时候用级联选择
        statement_zh: 有明确层级、每级选项不多的数据（省 / 市 / 区、商品类目）用级联选择；层级不固定或需要看到整棵树时用树选择。
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 逐级选择
            jsx: |-
              <div className="flex w-72 flex-col gap-2"><Label htmlFor="cas">服务区域</Label><Cascader id="cas" options={[{ value: "sh", label: "上海市", children: [{ value: "pd", label: "浦东新区", children: [{ value: "zj", label: "张江镇" }, { value: "jq", label: "金桥镇" }] }] }]} value={s.path ?? ["sh", "pd", "zj"]} onValueChange={(path) => set({ path })} /></div>

      - id: CMP.CASCADER.PATH
        title_zh: 显示完整路径
        statement_zh: 选完后触发器显示完整路径（上海市 / 浦东新区 / 张江镇），路径太长时中间省略并能看到全文；只能选叶子节点时，中间级点击只展开不选中。
        enforcement: { kind: review }

      - id: CMP.CASCADER.SEARCH
        title_zh: 层级深时可搜
        statement_zh: 超过三级或选项多时提供搜索，结果按完整路径显示；每一级都能用键盘左右键进出、上下键移动。
        enforcement: { kind: review }

  - key: checkbox
    title_zh: 多选框
    group: components.entry
    prefix: CMP.CHECKBOX
    summary_zh: 在一组选项里选多个，或确认一句声明：选项竖排、标签可点；全选给出半选态；单个多选框不代替开关。
    rules:
      - id: CMP.CHECKBOX.LAYOUT
        title_zh: 竖排、标签可点
        statement_zh: 多于 3 个选项竖排，每项的标签文字也能点中；组有标题说明选什么；选项多于 10 个改带搜索的多选或穿梭框。
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 竖排与全选
            jsx: |-
              <fieldset className="flex flex-col gap-2"><legend className="mb-1 text-label-14 text-ds-gray-1000">通知</legend><div className="flex items-center gap-2"><Checkbox id="notify-all" checked="indeterminate" /><Label htmlFor="notify-all">全部通知</Label></div><div className="flex flex-col gap-2 pl-6"><div className="flex items-center gap-2"><Checkbox id="notify-maint" defaultChecked /><Label htmlFor="notify-maint">保养到期</Label></div><div className="flex items-center gap-2"><Checkbox id="notify-ins" /><Label htmlFor="notify-ins">保险到期</Label></div><div className="flex items-center gap-2"><Checkbox id="notify-check" defaultChecked /><Label htmlFor="notify-check">年检到期</Label></div></div></fieldset>

      - id: CMP.CHECKBOX.INDETERMINATE
        title_zh: 全选有半选态
        statement_zh: 有「全选」时，部分选中显示半选态（indeterminate），点击半选态变为全选；全选只作用于当前可见、可操作的选项，并说清范围。
        enforcement: { kind: review }

      - id: CMP.CHECKBOX.NOT_SWITCH
        title_zh: 立即生效用开关，提交生效用多选框
        statement_zh: 改了立即生效的设置用开关；需要随表单一起提交的选择用多选框；单个多选框只用于确认一句声明（「我已阅读并同意…」），并且声明文字完整可读。
        enforcement: { kind: review }

  - key: choicebox
    title_zh: 选择卡片
    group: components.entry
    prefix: CMP.CHOICEBOX
    summary_zh: 带标题与说明的选项卡片：少量需要解释差别的选项；整张卡片可点；单选多选语义正确。
    rules:
      - id: CMP.CHOICEBOX.WHEN
        title_zh: 什么时候用选择卡片
        statement_zh: 2 到 4 个选项、每个都需要一句话解释差别（配送时效、套餐、部署区域）时用选择卡片；不需要解释的用单选或多选。
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 单选卡片
            jsx: |-
              <ChoiceboxGroup aria-label="配送时效" value={s.plan ?? "standard"} onValueChange={(plan) => set({ plan })} options={[{ value: "standard", title: "标准配送", description: "次日送达" }, { value: "express", title: "加急配送", description: "当日 4 小时内" }]} />

      - id: CMP.CHOICEBOX.SEMANTICS
        title_zh: 语义与点击区
        statement_zh: 单选是一组 radio、多选是一组 checkbox（读屏与键盘行为随之而来），整张卡片都是点击区；选中态除了边框颜色还有勾选标记，不只靠颜色。
        enforcement: { kind: review }

      - id: CMP.CHOICEBOX.CONTENT
        title_zh: 卡片内容
        statement_zh: 标题一行，说明一句话；卡片等宽、等高排成一行或两列；不可用的选项说明原因（「暂未开通」）。
        enforcement: { kind: review }

  - key: date_picker
    title_zh: 日期选择
    group: components.entry
    prefix: CMP.DATE_PICKER
    summary_zh: 选择日期或日期范围：显示格式统一、可键盘输入；范围选择给常用快捷项并限制跨度；不可选的日期置灰并说明。
    rules:
      - id: CMP.DATE_PICKER.FORMAT
        title_zh: 显示格式统一
        statement_zh: 日期显示统一为 YYYY-MM-DD，日期时间为 YYYY-MM-DD HH:mm:ss（见 FORMAT.DATETIME）；存储与传输用 ISO 8601；允许用户直接键入日期，键入后按同一格式回显。
        enforcement: { kind: review }

      - id: CMP.DATE_PICKER.RANGE
        title_zh: 范围选择有快捷项与上限
        statement_zh: 日期范围给常用快捷项（今天、最近 7 天、本月、上月）；查询类范围限制最大跨度（如 366 天）并在超出时提示；开始和结束一起选，不拆成两个独立控件。
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 范围与快捷项
            jsx: |-
              <div className="flex flex-col gap-2"><div className="flex items-center gap-2"><input type="date" className="h-9 rounded-md border border-ds-gray-400 bg-ds-background-100 px-3 text-copy-14 text-ds-gray-1000" /><span className="text-ds-gray-900">～</span><input type="date" className="h-9 rounded-md border border-ds-gray-400 bg-ds-background-100 px-3 text-copy-14 text-ds-gray-1000" /></div><div className="flex gap-2"><Button size="small" variant="secondary">最近 7 天</Button><Button size="small" variant="secondary">本月</Button></div></div>

      - id: CMP.DATE_PICKER.DISABLED
        title_zh: 不可选的日期置灰
        statement_zh: 不可选的日期（过去、节假日、超出业务范围）置灰并在面板里说明原因；不在选完后才报错。
        enforcement: { kind: review }

  - key: time_picker
    title_zh: 时间选择
    group: components.entry
    prefix: CMP.TIME_PICKER
    summary_zh: 选时间：时、分（可选秒）分列选择；分钟按步长；值是 24 小时制字符串。
    rules:
      - id: CMP.TIME_PICKER.STEP
        title_zh: 按业务给步长
        statement_zh: 预约、排班类的时间按业务步长给分钟（5 / 15 / 30），不给用户 60 个分钟选项；需要精确到秒的才显示秒列。
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 15 分钟步长
            jsx: |-
              <div className="flex w-60 flex-col gap-2"><Label htmlFor="tp">发车时间</Label><TimePicker id="tp" value={s.time ?? "08:30"} onValueChange={(time) => set({ time })} minuteStep={15} /></div>

      - id: CMP.TIME_PICKER.FORMAT
        title_zh: 24 小时制
        statement_zh: 显示与取值都用 24 小时制 HH:mm（需要时 HH:mm:ss），跨天的时间段写明「次日」；值的格式由格式化注册表统一。
        enforcement: { kind: review }

      - id: CMP.TIME_PICKER.RANGE
        title_zh: 时间段
        statement_zh: 选时间段时开始与结束分两个字段并校验先后；常用的时间段（上午、下午、全天）给快捷选项。
        enforcement: { kind: review }

  - key: form
    title_zh: 表单
    group: components.entry
    prefix: CMP.FORM
    summary_zh: 字段的标签、分组、校验与提交：标签在上、按业务分组；必填只标星号不重复说明；提交时整体校验并定位到第一个错误；提交中锁定。
    rules:
      - id: CMP.FORM.LAYOUT
        title_zh: 标签在上，按业务分组
        statement_zh: 新建、编辑表单标签在输入框上方（Label 在上）；字段按业务分组（fieldset + legend），每组有标题；一行最多两列，相关字段放同一行；不把所有字段堆成一长列不分组。
        enforcement: { kind: review }
        showcase:
          - kind: demo
            title_zh: 分组、必填与操作区
            jsx: |-
              <form className="flex w-96 flex-col gap-4"><fieldset className="flex flex-col gap-3"><legend className="mb-1 text-label-14 font-semibold text-ds-gray-1000">基本信息</legend><div className="flex flex-col gap-2"><Label htmlFor="f1"><span className="text-ds-red-700">*</span> 车牌号</Label><Input id="f1" placeholder="例：沪A12345" /></div><div className="flex flex-col gap-2"><Label htmlFor="f2">备注（选填）</Label><Input id="f2" /></div></fieldset><div className="flex gap-2"><Button>保存</Button><Button variant="secondary">取消</Button></div></form>

      - id: CMP.FORM.REQUIRED
        title_zh: 必填只标星号
        statement_zh: 必填字段在标签前标星号，必填字段多于可选字段时改为只标「（选填）」；说明文字写在字段下方，不写在占位符里。
        enforcement: { kind: review }

      - id: CMP.FORM.SUBMIT
        title_zh: 提交整体校验并定位
        statement_zh: 提交时校验全部字段，滚动并聚焦到第一个错误字段；提交中锁定按钮与表单（CLICK.LOCK），成功后给出结果并决定去向（返回列表或停留继续编辑），失败保留已填内容。
        enforcement: { kind: review }

      - id: CMP.FORM.ACTIONS
        title_zh: 操作区固定位置
        statement_zh: 表单操作区在表单末尾左对齐（与字段左边对齐），主按钮在前；长表单把操作区吸底（sticky bottom-0），保证随时可提交。
        enforcement: { kind: review }

  - key: input
    title_zh: 输入框
    group: components.entry
    prefix: CMP.INPUT
    summary_zh: 单行文字输入：标签在上、占位符只给格式示例；必填、长度、格式在提交前就地提示；前后缀放单位与固定内容，不放说明。
    rules:
      - id: CMP.INPUT.LABEL
        title_zh: 标签在外，占位符只放示例
        statement_zh: 每个输入框都有可见标签（表单里用表单项的 label，不用占位符代替标签）；占位符只写格式示例（如「例：沪A12345」），不写「请输入」之类的废话；聚焦后占位符消失不影响理解。
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 标签 + 示例占位符
            jsx: |-
              <div className="flex w-72 flex-col gap-2"><Label htmlFor="plate">车牌号</Label><Input id="plate" placeholder="例：沪A12345" /></div>
          - kind: dont
            title_zh: 用占位符当标签
            jsx: |-
              <Input placeholder="请输入车牌号" className="w-72" />
        showcase:
          - kind: demo
            title_zh: 标签、示例占位符与错误态
            jsx: |-
              <div className="flex w-80 flex-col gap-4"><div className="flex flex-col gap-2"><Label htmlFor="p2">车牌号</Label><Input id="p2" defaultValue="沪A1" aria-invalid="true" className="border-ds-red-700" /><span className="text-copy-13 text-ds-red-700">车牌号为 7–8 位，如沪A12345</span></div><div className="flex flex-col gap-2"><Label htmlFor="w2">整备质量</Label><div className="flex items-center gap-2"><Input id="w2" placeholder="例：1580" /><span className="text-label-13 text-ds-gray-900">kg</span></div></div></div>

      - id: CMP.INPUT.VALIDATION
        title_zh: 就地校验，失败说清怎么改
        statement_zh: 格式与长度在失焦时校验，错误显示在输入框下方（用 aria-describedby 关联），输入框标 aria-invalid 让边框变为错误态；提示写清规则与改法（「车牌号为 7–8 位，如沪A12345」），不写「格式错误」；用户改动后立即撤掉错误。
        enforcement: { kind: review }

      - id: CMP.INPUT.AFFIX
        title_zh: 前后缀只放单位与固定内容
        statement_zh: 单位、货币代码、固定前缀（https://）放在输入框两侧的附加区里，不让用户输入；图标前缀只用于搜索、账号这类约定俗成的场景；清除按钮（带 aria-label 的纯图标按钮）给可选字段，必填字段不清空为空串。
        enforcement: { kind: review }

      - id: CMP.INPUT.WIDTH
        title_zh: 宽度跟内容长度走
        statement_zh: 输入框宽度按预期内容长度选（短码、数量、手机号用窄档，名称、地址用宽档），同一表单里同类字段等宽；不要所有输入框都拉满整行。
        enforcement: { kind: review }

  - key: search_input
    title_zh: 搜索框
    group: components.entry
    prefix: CMP.SEARCH_INPUT
    summary_zh: 搜索框：放大镜 + 清空；防抖后搜索、回车立即搜索；在 role=search 区域里；结果数可读。
    rules:
      - id: CMP.SEARCH_INPUT.BEHAVIOR
        title_zh: 什么时候搜
        statement_zh: 输入时防抖约 300ms 自动搜索，回车立即搜索；取消过期请求、丢弃过期响应；清空后恢复全部结果。
        params:
          debounce: { value: 300, unit: ms, source: SRC.POMASTER.PRESET, label_zh: 防抖 }
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 防抖搜索
            jsx: |-
              <SearchInput aria-label="搜索车辆" placeholder="车牌号、司机或订单号" className="w-full max-w-[300px]" />

      - id: CMP.SEARCH_INPUT.SEMANTICS
        title_zh: 语义
        statement_zh: 搜索框是 type="search"，放在 role="search" 的区域里，有可读名称；不触发密码管理器（autocomplete="off" 或具体的 token）。
        enforcement: { kind: review }

      - id: CMP.SEARCH_INPUT.RESULT
        title_zh: 结果可读
        statement_zh: 搜索后用礼貌的 aria-live 播报结果数（「找到 12 辆车」）；没有结果时显示空状态与「清除搜索」。
        enforcement: { kind: review }

  - key: textarea
    title_zh: 多行输入
    group: components.entry
    prefix: CMP.TEXTAREA
    summary_zh: 多行文字输入：给出行数与字数上限，自动增高有上限；长文本才用它，短备注用单行。
    rules:
      - id: CMP.TEXTAREA.ROWS
        title_zh: 初始行数与自动增高
        statement_zh: 初始 3–4 行；内容变多时自动增高（autoSize / field-sizing），最多 8 行后出现滚动条；不允许用户把它拖得比容器还宽。
        enforcement: { kind: review }

      - id: CMP.TEXTAREA.COUNT
        title_zh: 有上限就显示计数
        statement_zh: 后端有长度上限的字段显示字数计数（showCount + maxlength），接近上限时计数变为警示色；超限不截断用户已输入的内容，而是阻止提交并提示。
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 计数
            jsx: |-
              <div className="flex w-80 flex-col gap-1"><textarea rows={3} maxLength={200} placeholder="例：前保险杠有划痕" className="rounded-md border border-ds-gray-400 bg-ds-background-100 p-3 text-copy-14" /><span className="self-end text-copy-13 text-ds-gray-900">0 / 200</span></div>

      - id: CMP.TEXTAREA.WHEN
        title_zh: 长文本才用多行
        statement_zh: 备注、描述、原因这类可能超过一行的内容用多行输入；名称、编号、短备注用单行输入，不为了「看起来宽敞」用多行。
        enforcement: { kind: review }

  - key: input_number
    title_zh: 数字输入
    group: components.entry
    prefix: CMP.INPUT_NUMBER
    summary_zh: 输入有范围的数字：写明单位、范围与精度，步进按钮可选；金额和数量右对齐。
    rules:
      - id: CMP.INPUT_NUMBER.RANGE
        title_zh: 范围、精度、单位写清
        statement_zh: 设置 min / max / precision，与后端校验一致；单位放在后缀或标签里（「整备质量（kg）」），不让用户输入单位；超出范围时就地提示允许的范围，不静默改成边界值。
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 范围与单位
            jsx: |-
              <div className="flex w-56 items-center gap-2"><Input type="number" min={0} max={9999} placeholder="0–9999" className="text-right" /><span className="text-label-13 text-ds-gray-900">kg</span></div>

      - id: CMP.INPUT_NUMBER.ALIGN
        title_zh: 数字右对齐、等宽
        statement_zh: 金额、数量、重量这类可比较的数字在输入框和列表里都右对齐并用等宽数字（tabular-nums），方便按位比较。
        enforcement: { kind: review }

      - id: CMP.INPUT_NUMBER.STEP
        title_zh: 步进按钮只给小范围
        statement_zh: 步进按钮适合 0–20 这类小范围的调整（数量、优先级）；金额、长编号不显示步进按钮，避免误点改值；滚轮不改值。
        enforcement: { kind: review }

  - key: mentions
    title_zh: 提及
    group: components.entry
    prefix: CMP.MENTIONS
    summary_zh: 在多行输入里 @ 提及成员：弹出建议、键盘选择；提及的人会收到通知要说清。
    rules:
      - id: CMP.MENTIONS.TRIGGER
        title_zh: 触发与建议
        statement_zh: 输入「@」后弹出成员建议，按姓名与拼音筛选，上下键移动、回车插入、Esc 关闭；插入后光标停在提及之后。
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: "@ 提及"
            jsx: |-
              <Mentions aria-label="调度备注" value={s.text ?? "@张伟 明早 8 点前到浦东仓提货"} onValueChange={(text) => set({ text })} people={[{ value: "zw", label: "张伟", keywords: ["zhangwei"] }, { value: "ln", label: "李娜", keywords: ["lina"] }, { value: "wf", label: "王芳", keywords: ["wangfang"] }, { value: "ly", label: "刘洋", keywords: ["liuyang"] }]} className="w-full max-w-[360px]" />

      - id: CMP.MENTIONS.NOTIFY
        title_zh: 说清通知
        statement_zh: 被提及的人会收到通知时，在输入框下方写明「被 @ 的人会收到通知」；提交后提及显示为可点的人名。
        enforcement: { kind: review }

      - id: CMP.MENTIONS.SCOPE
        title_zh: 只提及有权限的人
        statement_zh: 建议列表只列出能看到这条内容的成员；没有权限的人不出现在建议里。
        enforcement: { kind: review }

  - key: radio
    title_zh: 单选框
    group: components.entry
    prefix: CMP.RADIO
    summary_zh: 在几个互斥的选项里选一个：2–5 个选项且要一眼看全时用；有默认值；选项多了改选择器。
    rules:
      - id: CMP.RADIO.WHEN
        title_zh: 选项少且要看全才用单选
        statement_zh: 2–5 个互斥选项且用户需要对比时用单选组；超过 5 个改选择器；只有「是 / 否」且立即生效时用开关。
        enforcement: { kind: review }
        showcase:
          - kind: demo
            title_zh: 表单里的单选与切换视图的按钮样式
            jsx: |-
              <div className="flex w-80 flex-col gap-4"><fieldset className="flex flex-col gap-2"><legend className="mb-1 text-label-14 text-ds-gray-1000">可见范围</legend><RadioGroup defaultValue="self"><div className="flex items-center gap-2"><RadioGroupItem value="self" id="scope-self" /><Label htmlFor="scope-self">仅本人可见</Label></div><div className="flex items-center gap-2"><RadioGroupItem value="team" id="scope-team" /><Label htmlFor="scope-team">本部门可见</Label></div><div className="flex items-center gap-2"><RadioGroupItem value="all" id="scope-all" /><Label htmlFor="scope-all">全公司可见</Label></div></RadioGroup></fieldset><div className="inline-flex w-fit rounded-md border border-ds-gray-400 p-1 text-label-13"><span className="rounded px-3 py-1 text-ds-gray-900">日</span><span className="rounded bg-ds-gray-200 px-3 py-1 text-ds-gray-1000">周</span><span className="rounded px-3 py-1 text-ds-gray-900">月</span></div></div>

      - id: CMP.RADIO.DEFAULT
        title_zh: 给安全的默认值
        statement_zh: 单选组默认选中最常用或最安全的一项（如「仅本人可见」）；确实要用户主动选择的（无安全默认），不预选并在提交时校验必选。
        enforcement: { kind: review }

      - id: CMP.RADIO.BUTTON_STYLE
        title_zh: 按钮样式只用于切换视图
        statement_zh: 分段样式的单选（Segmented / Tabs 外观）只用于切换视图、筛选范围这类立即生效的选择；表单里的取值用普通单选，竖排或横排保持一致。
        enforcement: { kind: review }

  - key: rate
    title_zh: 评分
    group: components.entry
    prefix: CMP.RATE
    summary_zh: 星级评分：一组 radio、每颗星有名称；能清空；只读时同时显示数字。
    rules:
      - id: CMP.RATE.SEMANTICS
        title_zh: 语义与键盘
        statement_zh: 评分是一组单选（radiogroup），左右键改分，每颗星有可读名称（「4 星：满意」）；再点当前分可以清空。
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 带说明的评分
            jsx: |-
              <Rate aria-label="司机服务评分" value={s.score ?? 4} onValueChange={(score) => set({ score })} labels={["很差", "较差", "一般", "满意", "非常满意"]} />

      - id: CMP.RATE.LABELS
        title_zh: 每一档有文字
        statement_zh: 每个分值有对应的文字说明，选中后显示在星的旁边；默认 5 档，不用半星做输入。
        enforcement: { kind: review }

      - id: CMP.RATE.READONLY
        title_zh: 只读展示
        statement_zh: 只读展示平均分时同时显示数字与评价人数（4.6 · 128 人评价），星只是辅助。
        enforcement: { kind: review }

  - key: select
    title_zh: 选择器
    group: components.entry
    prefix: CMP.SELECT
    summary_zh: 从下拉列表里选一项：选项多于 7 个可搜索、多于 50 个改远程搜索；选项文案短、互斥、有序；空态与加载态都要有。
    rules:
      - id: CMP.SELECT.WHEN
        title_zh: 选项数量决定控件
        statement_zh: 2–5 个互斥选项且需要一眼看全时用单选组或分段控制；6 个以上用选择器（Select）；超过 7 个改用可搜索的组合框（Combobox：Popover 里放带搜索框的列表）；超过 50 个或来自接口时改远程搜索，并防抖、显示加载态。
        enforcement: { kind: review }
        showcase:
          - kind: demo
            title_zh: 选择器与停用项
            jsx: |-
              <div className="flex w-72 flex-col gap-2"><Label htmlFor="model">车型</Label><Select><SelectTrigger id="model" className="w-full"><SelectValue placeholder="选择车型" /></SelectTrigger><SelectContent><SelectItem value="M01">轻型厢式货车</SelectItem><SelectItem value="M02">中型栏板货车</SelectItem><SelectItem value="M09" disabled>重型牵引车（已停用）</SelectItem></SelectContent></Select></div>

      - id: CMP.SELECT.OPTIONS
        title_zh: 选项短、互斥、有序
        statement_zh: 选项文案短（不超过 12 个字）、互斥、按使用频率或自然顺序排列（状态按流程顺序，地区按行政顺序），「其他」放最后；禁用的选项说明原因（tooltip），不直接隐藏。
        enforcement: { kind: review }

      - id: CMP.SELECT.EMPTY
        title_zh: 空与加载有反馈
        statement_zh: 远程搜索时显示加载态；没有匹配项时显示「无匹配的车型」并给出新建入口（有新建权限时）；不把空列表留成一片白。
        enforcement: { kind: review }

      - id: CMP.SELECT.VALUE
        title_zh: 值与显示分开
        statement_zh: 选项的值用稳定的编码（code / id），显示用名称；回显时用值匹配，名称改了不影响已存数据；值不在选项里时显示原值并提示「已停用」，不显示成空。
        enforcement: { kind: review }

  - key: multi_select
    title_zh: 多选选择器
    group: components.entry
    prefix: CMP.MULTI_SELECT
    summary_zh: 多选选择器：选中项显示为可移除的标签，超过上限折叠；弹层里可搜、可勾选。
    rules:
      - id: CMP.MULTI_SELECT.TAGS
        title_zh: 选中项显示为标签
        statement_zh: 选中的项在触发器里显示为标签，每个标签可单独移除（移除按钮带名称）；超过 3 个时折叠成「+N」，悬停或展开能看到全部。
        params:
          max_tags: { value: 3, source: SRC.POMASTER.PRESET, label_zh: 折叠前最多显示 }
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 多选与折叠
            jsx: |-
              <MultiSelect aria-label="随车人员" options={[{ value: "zw", label: "张伟", keywords: ["zhangwei"] }, { value: "ln", label: "李娜", keywords: ["lina"] }, { value: "wf", label: "王芳", keywords: ["wangfang"] }, { value: "ly", label: "刘洋", keywords: ["liuyang"] }]} value={s.crew ?? ["zw", "ln", "wf"]} onValueChange={(crew) => set({ crew })} maxTags={2} className="w-full max-w-[300px]" />

      - id: CMP.MULTI_SELECT.WHEN
        title_zh: 多选选择器还是复选框
        statement_zh: 选项少（5 个以内）且都要看见时用复选框组；选项多、选中的少时用多选选择器。
        enforcement: { kind: review }

      - id: CMP.MULTI_SELECT.LIMIT
        title_zh: 数量限制
        statement_zh: 有选择上限时在标签旁写明「最多选 5 个」，达到上限后其余选项不可选并说明原因。
        enforcement: { kind: review }

  - key: slider
    title_zh: 滑块
    group: components.entry
    prefix: CMP.SLIDER
    summary_zh: 滑块：连续值或区间的大致调节；需要精确值时旁边配数字输入；每个滑块有名称。
    rules:
      - id: CMP.SLIDER.WHEN
        title_zh: 什么时候用滑块
        statement_zh: 大致调节一个范围内的值（音量、半径、价格区间）用滑块；需要精确输入的数值用数字输入，或在滑块旁边并排一个数字输入。
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 区间滑块
            jsx: |-
              <div className="flex w-full max-w-[300px] flex-col gap-2"><Label>运价区间（元）</Label><Slider defaultValue={[200, 800]} max={1000} step={50} thumbLabels={["最低运价", "最高运价"]} /></div>

      - id: CMP.SLIDER.KEYBOARD
        title_zh: 键盘与名称
        statement_zh: 每个滑块手柄有可读名称（区间的两端分别是「最低运价」「最高运价」），方向键按步长调节、PageUp / PageDown 大步调节，当前值随时可读。
        enforcement: { kind: review }

      - id: CMP.SLIDER.MARKS
        title_zh: 刻度与当前值
        statement_zh: 关键的值用刻度标出并写数字；拖动时显示当前值；不用滑块表示只有两三个离散选项的设置（用分段控制器）。
        enforcement: { kind: review }

  - key: switch
    title_zh: 开关
    group: components.entry
    prefix: CMP.SWITCH
    summary_zh: 两个状态之间切换、并且立即生效：标签写它控制什么；有副作用的切换先确认；切换中显示加载并防重复。
    playground:
      component: Switch
      props:
        disabled: { boolean: true, default: false }
    rules:
      - id: CMP.SWITCH.IMMEDIATE
        title_zh: 开关立即生效
        statement_zh: 开关只用于立即生效的设置；需要点「保存」才生效的选项用多选框或单选；切换后给出结果反馈（状态变化本身或一条轻提示），失败时回到原状态并提示原因。
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 标签写控制什么
            jsx: |-
              <label className="flex items-center gap-2 text-copy-14"><Switch defaultChecked aria-label="到期自动提醒" /> 到期自动提醒</label>
          - kind: dont
            title_zh: 用开关做表单项再点保存
            code: |-
              <Label>接收通知</Label><Switch checked={form.notify} onCheckedChange={(v) => setForm({ ...form, notify: v })} />
              <Button type="submit">保存</Button>
            lang: tsx

      - id: CMP.SWITCH.LOADING
        title_zh: 切换中加载、防重复
        statement_zh: 切换要请求接口时显示加载态（loading）并在返回前禁用，防止连点；接口失败回滚开关状态。
        enforcement: { kind: review }

      - id: CMP.SWITCH.CONFIRM
        title_zh: 有副作用先确认
        statement_zh: 关闭后会影响他人或不可撤回的开关（停用账号、关闭对外接口）先弹确认，说清后果；普通偏好不确认。
        enforcement: { kind: review }

  - key: segmented
    title_zh: 分段控制器
    group: components.entry
    prefix: CMP.SEGMENTED
    summary_zh: 2 到 5 个互斥选项的即时切换：切换同一份内容的展示方式；切换不同内容区用标签页。
    rules:
      - id: CMP.SEGMENTED.WHEN
        title_zh: 分段控制器还是标签页
        statement_zh: 切换同一份内容的展示方式或范围（列表 / 地图、今日 / 本周 / 本月）用分段控制器；切换不同的内容区用标签页。
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 切换统计范围
            jsx: |-
              <Segmented aria-label="统计范围" value={s.range ?? "week"} onValueChange={(range) => set({ range })} options={[{ value: "day", label: "今日" }, { value: "week", label: "本周" }, { value: "month", label: "本月" }]} />

      - id: CMP.SEGMENTED.COUNT
        title_zh: 选项数量
        statement_zh: 放 2 到 5 个选项，每项文字不超过 4 个字；图标段要有可读名称。
        params:
          min: { value: 2, source: SRC.POMASTER.PRESET, label_zh: 最少选项 }
          max: { value: 5, source: SRC.POMASTER.PRESET, label_zh: 最多选项 }
        enforcement: { kind: review }

      - id: CMP.SEGMENTED.IMMEDIATE
        title_zh: 即时生效
        statement_zh: 切换立即生效、不需要确认；当前选择写进地址，刷新后保持。
        enforcement: { kind: review }

  - key: transfer
    title_zh: 穿梭框
    group: components.entry
    prefix: CMP.TRANSFER
    summary_zh: 两栏之间移动条目（分配权限、编排线路）：可搜索、可全选；按钮写清方向；数量可见。
    rules:
      - id: CMP.TRANSFER.WHEN
        title_zh: 什么时候用穿梭框
        statement_zh: 从一批条目里挑一部分出来、并且要同时看到「已选」与「待选」两边时用穿梭框（分配车辆到线路、给角色分配权限）；只需要选、不关心另一边时用多选选择器。
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 分配车辆
            jsx: |-
              <Transfer items={[{ key: "1", label: "沪A·D2390" }, { key: "2", label: "沪A·D2391" }, { key: "3", label: "沪A·D2392" }]} targetKeys={s.target ?? ["3"]} onChange={(target) => set({ target })} titles={["可用车辆", "本线路车辆"]} />

      - id: CMP.TRANSFER.CONTROLS
        title_zh: 搜索、全选与方向
        statement_zh: 每一栏可搜索、可全选，栏头显示「已选 n / 共 m」；中间的按钮写清方向（「移到右侧」「移回左侧」），没有勾选时不可用。
        enforcement: { kind: review }

      - id: CMP.TRANSFER.LARGE
        title_zh: 条目很多时
        statement_zh: 条目超过几百条时分页或虚拟滚动，搜索走服务端；不一次把全部条目渲染出来。
        enforcement: { kind: review }

  - key: tree_select
    title_zh: 树选择
    group: components.entry
    prefix: CMP.TREE_SELECT
    summary_zh: 从树形数据里选节点（组织、车队）：弹层里是树；可搜索；显示路径。
    rules:
      - id: CMP.TREE_SELECT.WHEN
        title_zh: 什么时候用树选择
        statement_zh: 层级不固定、需要看到树形结构才能选的数据（组织架构、车队分组）用树选择；层级固定且浅的用级联选择。
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 选择车队
            jsx: |-
              <div className="flex w-72 flex-col gap-2"><Label htmlFor="ts">所属车队</Label><TreeSelect id="ts" nodes={[{ key: "east", label: "华东区", children: [{ key: "pd", label: "浦东车队" }, { key: "xh", label: "徐汇车队" }] }]} value={s.team ?? "pd"} onValueChange={(team) => set({ team })} defaultExpanded={["east"]} /></div>

      - id: CMP.TREE_SELECT.KEYBOARD
        title_zh: 键盘
        statement_zh: 弹层里的树用方向键移动、左右键收起展开、回车选择；选中后弹层收起、焦点回到触发器。
        enforcement: { kind: review }

      - id: CMP.TREE_SELECT.SEARCH
        title_zh: 搜索与路径
        statement_zh: 节点多时提供搜索，匹配的节点连同祖先一起显示；触发器上显示选中节点的名称，悬停可看完整路径。
        enforcement: { kind: review }

  - key: upload
    title_zh: 上传
    group: components.entry
    prefix: CMP.UPLOAD
    summary_zh: 上传文件：说清格式、大小与数量；上传中显示进度、可取消；失败可重试；上传与提交分开。
    rules:
      - id: CMP.UPLOAD.LIMITS
        title_zh: 格式、大小、数量写在前面
        statement_zh: 上传区域旁写明允许的格式、单个大小与数量上限（「PDF、JPG，单个不超过 10 MB，最多 5 个」）；选择文件时就校验，不等上传完才拒绝；校验以服务端为准。
        enforcement: { kind: review }

      - id: CMP.UPLOAD.PROGRESS
        title_zh: 进度、取消、重试
        statement_zh: 每个文件显示进度，可取消；失败的文件保留在列表里标红、写清原因并可重试；全部完成前不允许提交依赖这些文件的表单。
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 文件列表
            jsx: |-
              <ul className="m-0 flex w-80 list-none flex-col gap-2 p-0 text-copy-14"><li className="flex items-center justify-between rounded-md border border-ds-gray-400 px-3 py-2"><span>行驶证.pdf</span><span className="text-ds-green-900">已上传</span></li><li className="flex items-center justify-between rounded-md border border-ds-red-700 px-3 py-2"><span>保单.jpg：文件超过 10 MB</span><Button size="small" variant="secondary">重试</Button></li></ul>

      - id: CMP.UPLOAD.SEPARATE
        title_zh: 上传与提交分开
        statement_zh: 文件先上传得到文件标识，表单提交只带标识；大文件分片上传、可断点续传；上传的文件名、类型在服务端重新校验与改名（SEC 规范）。
        enforcement: { kind: review }

  - key: address_input
    title_zh: 地址输入
    group: components.entry
    prefix: CMP.ADDRESS_INPUT
    summary_zh: 一组地址字段：省市区 + 详细地址 + 邮编；各自有标签与自动填充提示。
    rules:
      - id: CMP.ADDRESS_INPUT.STRUCTURE
        title_zh: 按地址结构拆字段
        statement_zh: 地址按国内结构拆成省市区（级联选择）、详细地址、可选的邮编，外面包一个 fieldset 写明是什么地址（「提货地址」）；不让用户在一个输入框里自由写整段地址再由程序拆分。
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 省市区 + 详细地址
            jsx: |-
              <AddressInput legend="提货地址" regions={[{ value: "sh", label: "上海市", children: [{ value: "pd", label: "浦东新区", children: [{ value: "zj", label: "张江镇" }, { value: "jq", label: "金桥镇" }] }] }]} value={s.addr ?? { region: ["sh", "pd", "zj"], detail: "碧波路 690 号" }} onValueChange={(addr) => set({ addr })} className="w-full max-w-[360px]" />

      - id: CMP.ADDRESS_INPUT.AUTOFILL
        title_zh: 自动填充
        statement_zh: 每个字段设置对应的 autocomplete（address-level1/2/3、street-address、postal-code）与 inputmode，让浏览器与密码管理器能自动填写。
        enforcement: { kind: review }

      - id: CMP.ADDRESS_INPUT.VALIDATION
        title_zh: 校验
        statement_zh: 省市区必须选到最后一级；详细地址校验长度；邮编 6 位数字；错误贴着对应字段，不在整组顶部笼统报错。
        enforcement: { kind: review }

  - key: destructive_input
    title_zh: 破坏性确认输入
    group: components.entry
    prefix: CMP.DESTRUCTIVE_INPUT
    summary_zh: 不可逆的大操作前输入对象名称确认：写出原文；输入一致后才能确认；不禁止粘贴。
    rules:
      - id: CMP.DESTRUCTIVE_INPUT.WHEN
        title_zh: 什么时候要输入名称
        statement_zh: 删除项目、解散车队、清空数据这类影响大且不可逆的操作，要求输入对象名称再确认；普通删除用气泡确认或撤销。
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 输入名称确认
            jsx: |-
              <DestructiveInput expected="浦东车队" onMatchChange={(ok) => set({ ok })} className="w-full max-w-[320px]" />

      - id: CMP.DESTRUCTIVE_INPUT.PROMPT
        title_zh: 写出原文
        statement_zh: 提示里写出要输入的原文（「输入 浦东车队 确认」），原文用等宽或标签样式突出；比较时去掉首尾空格、区分大小写。
        enforcement: { kind: review }

      - id: CMP.DESTRUCTIVE_INPUT.PASTE
        title_zh: 不禁止粘贴
        statement_zh: 允许粘贴（禁止粘贴只会为难密码管理器与读屏用户）；输入一致前危险按钮不可用，一致后可用。
        enforcement: { kind: review }

  - key: filter_bar
    title_zh: 筛选条
    group: components.entry
    prefix: CMP.FILTER_BAR
    summary_zh: 列表上方的筛选条：已生效的筛选是可移除的标签；添加筛选用下拉；一键清除；筛选写进地址。
    rules:
      - id: CMP.FILTER_BAR.CHIPS
        title_zh: 已生效的筛选看得见
        statement_zh: 每个已生效的筛选显示为「名称：值」的标签，可单独移除（移除按钮带名称）；没有筛选时只显示「添加筛选」。
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 增删筛选
            jsx: |-
              <FilterBar filters={s.filters ?? [{ key: "status", label: "状态", value: "在途" }]} available={[{ key: "status", label: "状态" }, { key: "team", label: "车队" }]} onRemove={() => set({ filters: [] })} onClear={() => set({ filters: [] })} onAdd={() => undefined} />

      - id: CMP.FILTER_BAR.URL
        title_zh: 筛选写进地址
        statement_zh: 筛选条件写进地址的查询参数，刷新、分享、浏览器后退都能恢复；改筛选后页码回到第一页。
        enforcement: { kind: review }

      - id: CMP.FILTER_BAR.CLEAR
        title_zh: 一键清除
        statement_zh: 有两个以上筛选时提供「清除全部」；清除后结果恢复为全部，并播报结果数。
        enforcement: { kind: review }

  - key: feedback_widget
    title_zh: 反馈收集
    group: components.entry
    prefix: CMP.FEEDBACK_WIDGET
    summary_zh: 页面上的「反馈」入口：选感受 + 写几句；提交后就地确认；不强制留联系方式。
    rules:
      - id: CMP.FEEDBACK_WIDGET.FORM
        title_zh: 简短的反馈表单
        statement_zh: 反馈入口打开一个小弹层：一组感受选项（表情或评分，每项有名称）+ 一个可选的文字框；感受与文字至少填一项才能提交。
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 反馈入口
            jsx: |-
              <Feedback onSubmit={() => Promise.resolve()} />

      - id: CMP.FEEDBACK_WIDGET.CONFIRM
        title_zh: 就地确认
        statement_zh: 提交中按钮忙碌；成功后在弹层里显示「已收到」，不跳转、不弹新的对话框；失败时保留已填内容并给出重试。
        enforcement: { kind: review }

      - id: CMP.FEEDBACK_WIDGET.PRIVACY
        title_zh: 隐私
        statement_zh: 不强制填写联系方式；随反馈一起提交的页面地址、浏览器信息要在表单里写明。
        enforcement: { kind: review }

  - key: theme_switcher
    title_zh: 主题切换
    group: components.entry
    prefix: CMP.THEME_SWITCHER
    summary_zh: 跟随系统 / 浅色 / 深色三段切换：默认跟随系统；切换即时生效；偏好要记住。
    rules:
      - id: CMP.THEME_SWITCHER.OPTIONS
        title_zh: 三个选项
        statement_zh: 提供「跟随系统」「浅色」「深色」三个选项，默认跟随系统；用分段控制器，图标段要有可读名称。
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 三段切换
            jsx: |-
              <ThemeSwitcher value={s.theme ?? "system"} onValueChange={(theme) => set({ theme })} />

      - id: CMP.THEME_SWITCHER.APPLY
        title_zh: "{'antd': '怎么生效', 'geist': '怎么生效'}"
        statement_zh: 切换即时生效：写到根元素的 data-theme 与 color-scheme，颜色由 --ds-* 变量切换；不刷新页面。
        enforcement: { kind: review }

      - id: CMP.THEME_SWITCHER.PERSIST
        title_zh: 记住偏好
        statement_zh: 偏好存在用户设置里（登录后跨设备）或本地，下次打开在首屏渲染前就应用，避免先闪一下浅色。
        enforcement: { kind: review }

  - key: avatar
    title_zh: 头像
    group: components.display
    prefix: CMP.AVATAR
    summary_zh: 代表人或团队的头像：没有图时显示姓名缩写；旁边已有姓名时作为装饰；多人叠放以「+N」收尾。
    rules:
      - id: CMP.AVATAR.FALLBACK
        title_zh: 没有图时显示缩写
        statement_zh: 没有头像或图片加载失败时显示姓名缩写（中文取最后一个字、英文取首字母），底色按姓名稳定取色；不显示破图标或统一的灰色人形。
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 缩写与叠放
            jsx: |-
              <div className="flex items-center gap-4"><Avatar name="张伟" /><Avatar name="李娜" size={40} /><AvatarGroup names={["张伟", "李娜", "王芳", "刘洋", "陈杰"]} max={3} /></div>

      - id: CMP.AVATAR.ALT
        title_zh: 替代文字
        statement_zh: 头像旁边已经写了姓名时，头像是装饰（alt 留空）；单独出现的头像（只有头像的成员列表）要有姓名作为可读名称。
        enforcement: { kind: review }

      - id: CMP.AVATAR.GROUP
        title_zh: 多人叠放
        statement_zh: 多人头像叠放时最多显示 3 到 5 个，其余折叠成「+N」，整组有可读名称（「5 人：张伟、李娜……」）；尺寸取 24 / 32 / 40 / 64 四档。
        enforcement: { kind: review }

  - key: badge
    title_zh: 徽标数
    group: components.display
    prefix: CMP.BADGE
    summary_zh: 在图标或头像右上角显示计数或状态点：只提示有新东西，数字封顶；状态点配文字。
    rules:
      - id: CMP.BADGE.COUNT
        title_zh: 计数封顶
        statement_zh: 计数超过 99 显示「99+」；为 0 时不显示；计数表示「有待处理的东西」，点进去处理后清零或减少。
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 封顶与状态点
            jsx: |-
              <div className="flex items-center gap-6"><span className="relative grid size-8 place-items-center rounded-md bg-ds-gray-200 text-label-13">消<span className="absolute -right-2 -top-2 rounded-full bg-ds-red-700 px-2 text-label-12 text-ds-background-100">99+</span></span><span className="flex items-center gap-2 text-copy-14"><span className="size-2 rounded-full bg-ds-blue-700" />同步中</span></div>

      - id: CMP.BADGE.DOT
        title_zh: 状态点配文字
        statement_zh: 状态点（在线、同步中、异常）旁边写文字，不单独用颜色表达状态；动画状态点只用于正在进行的过程。
        enforcement: { kind: review }

      - id: CMP.BADGE.RESTRAINT
        title_zh: 克制使用
        statement_zh: 徽标只用于需要用户注意的新消息、待办；不给每个菜单都加数字；同一屏不超过 3 个红点。
        enforcement: { kind: review }

  - key: tag
    title_zh: 标签
    group: components.display
    prefix: CMP.TAG
    summary_zh: 给对象打上分类或状态的短标签：颜色有固定语义、文字不超过 6 个字；可关闭的标签用于筛选条件；不当按钮用。
    playground:
      component: Badge
      text_zh: 在用
      props:
        variant: { options: [default, secondary, outline, destructive], default: secondary }
    rules:
      - id: CMP.TAG.SEMANTIC
        title_zh: 颜色有固定语义
        statement_zh: 状态标签的颜色按语义固定（成功 / 进行中 / 警告 / 失败 / 中性），同一状态全站同色；分类标签用中性色或预设色板，不自定义色值；颜色之外还有文字，不只靠颜色区分。
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 语义色
            jsx: |-
              <div className="flex gap-2"><Badge variant="secondary">在用</Badge><Badge>调度中</Badge><Badge variant="outline">待年检</Badge><Badge variant="destructive">已报废</Badge></div>
          - kind: dont
            title_zh: 自定义色值
            code: |-
              <Badge className="bg-[#f50]">急</Badge>
            lang: tsx

      - id: CMP.TAG.SHORT
        title_zh: 文字短
        statement_zh: 标签文字不超过 6 个字，不换行；一行标签超过 3 个时折叠为「+N」，悬停显示全部。
        enforcement: { kind: review }

      - id: CMP.TAG.CLOSABLE
        title_zh: 可关闭的标签只用于条件
        statement_zh: 可关闭标签用于展示已选的筛选条件或已添加的关键词，关闭即移除该条件；标签不当按钮或链接用，需要点击跳转的用链接。
        enforcement: { kind: review }

  - key: status_dot
    title_zh: 状态点
    group: components.display
    prefix: CMP.STATUS_DOT
    summary_zh: 对象状态的圆点 + 文字：颜色按语义；文字必须在；进行中可以呼吸闪烁。
    rules:
      - id: CMP.STATUS_DOT.TEXT
        title_zh: 圆点加文字
        statement_zh: 对象的状态用 StatusDot：圆点颜色按语义，后面跟文字；不只放一个彩色圆点。
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 五种状态
            jsx: |-
              <div className="flex flex-col gap-2"><StatusDot state="ready" label="空闲" /><StatusDot state="building" label="在途" /><StatusDot state="error" label="故障" /><StatusDot state="queued" label="待派" /><StatusDot state="canceled" label="已停用" /></div>

      - id: CMP.STATUS_DOT.MAPPING
        title_zh: 状态与颜色对应
        statement_zh: 同一个状态在全系统用同一种颜色与文字（领域规格里的状态枚举对应固定的语义色）；颜色只有五种语义，不按状态各配一种颜色。
        enforcement: { kind: review }

      - id: CMP.STATUS_DOT.MOTION
        title_zh: 进行中的闪烁
        statement_zh: 只有进行中的状态（处理中、部署中）用呼吸闪烁；用户开启减少动效时静止。
        enforcement: { kind: review }

  - key: calendar
    title_zh: 日历
    group: components.display
    prefix: CMP.CALENDAR
    summary_zh: 月历网格：选日期或在格子里看当天的数据；键盘按天、周、月移动；今天与选中日区分清楚。
    rules:
      - id: CMP.CALENDAR.WHEN
        title_zh: 什么时候用日历
        statement_zh: 需要按月看每天数据（排班、订单量、预约）时用日历面板，格子里放当天的摘要；只是选一个日期用日期选择器。
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 卡片式日历
            jsx: |-
              <Calendar selected={s.day ?? "2026-11-07"} onSelect={(day) => set({ day })} today="2026-11-07" defaultMonth="2026-11-01" />

      - id: CMP.CALENDAR.KEYBOARD
        title_zh: 键盘
        statement_zh: 日历是网格（role=grid），方向键按天、上下按周移动，PageUp / PageDown 换月，Home / End 到周首尾；每个日期格有完整的可读名称（「2026 年 11 月 7 日 星期六」）。
        enforcement: { kind: review }

      - id: CMP.CALENDAR.MARKS
        title_zh: 今天、选中与不可选
        statement_zh: 今天、选中日、不可选的日期用不同的样式区分（不只靠颜色）；格子里的数据摘要简短，详细内容点开再看。
        enforcement: { kind: review }

  - key: card
    title_zh: 卡片
    group: components.display
    prefix: CMP.CARD
    summary_zh: 把一组相关信息装进一个容器：标题说清是什么，操作在右上；卡片之间等距；可点的整张卡片有悬停反馈（见卡片悬停）。
    rules:
      - id: CMP.CARD.STRUCTURE
        title_zh: 标题、内容、操作
        statement_zh: 卡片标题说清内容是什么（CardTitle），补充说明放 CardDescription；操作放标题行右侧，最多 2 个；底部操作放 CardFooter，只放与卡片内容相关的动作。
        enforcement: { kind: review }
        showcase:
          - kind: demo
            title_zh: 标题、操作与内容
            jsx: |-
              <Card className="w-80"><CardHeader><CardTitle>本月保养</CardTitle><CardDescription>按到期日排序</CardDescription></CardHeader><CardContent className="flex justify-between text-copy-14"><span>待保养</span><span className="tabular-nums">12 辆</span></CardContent></Card>

      - id: CMP.CARD.SPACING
        title_zh: 等距与等高
        statement_zh: 同一行卡片等高、间距一致（取栅格 gutter）；卡片里不再套带边框的卡片，二级分组用分隔线或小标题。
        enforcement: { kind: review }

      - id: CMP.CARD.CLICKABLE
        title_zh: 整卡可点要说清
        statement_zh: 整张卡片可点时，整卡是一个链接或按钮（键盘可聚焦），悬停有反馈；卡片里同时还有其他按钮时，不把整卡做成可点，避免误触。
        enforcement: { kind: review }

  - key: carousel
    title_zh: 走马灯
    group: components.display
    prefix: CMP.CAROUSEL
    summary_zh: 轮播：同级内容 3 到 5 张；看得出总数与方向；不自动播放；管理侧工作页不用。
    rules:
      - id: CMP.CAROUSEL.WHEN
        title_zh: 什么时候用轮播
        statement_zh: 用户侧的图片、公告等同级内容才用轮播，3 到 5 张；管理侧的工作页面不用轮播（信息藏在后面的页里，很少有人去翻）。
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 带指示与翻页
            jsx: |-
              <Carousel label="本周动态" className="w-full max-w-[360px]" slides={[<div key="a" className="flex h-28 items-center justify-center bg-ds-background-200 text-label-14">准点率 98.2%</div>, <div key="b" className="flex h-28 items-center justify-center bg-ds-background-200 text-label-14">新增 6 辆冷链车</div>]} />

      - id: CMP.CAROUSEL.CONTROLS
        title_zh: 看得出总数与方向
        statement_zh: 有上一张 / 下一张按钮与页码指示（每个指示点是带名称的按钮），左右键翻页；读屏知道这是轮播（aria-roledescription）以及当前第几张。
        enforcement: { kind: review }

      - id: CMP.CAROUSEL.AUTOPLAY
        title_zh: 不自动播放
        statement_zh: 默认不自动播放；确需自动播放时提供暂停按钮，鼠标悬停与键盘聚焦时暂停，减少动效时不自动播放。
        enforcement: { kind: review }

  - key: collapse
    title_zh: 折叠面板
    group: components.display
    prefix: CMP.COLLAPSE
    summary_zh: 折叠面板：长而不规则的内容逐段展开；标题是按钮、报告展开状态；默认展开最常用的一段。
    rules:
      - id: CMP.COLLAPSE.WHEN
        title_zh: 什么时候折叠
        statement_zh: 内容长、各段相对独立、用户通常只看其中一两段时用折叠面板（常见问题、详情页的次要信息）；需要对比各段时平铺，不折叠。
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 手风琴
            jsx: |-
              <Collapse type="single" collapsible defaultValue="insurance" className="w-full max-w-[360px]"><CollapseItem value="license"><CollapseTrigger>行驶证</CollapseTrigger><CollapseContent>有效期至 2028 年 3 月 14 日。</CollapseContent></CollapseItem><CollapseItem value="insurance"><CollapseTrigger>保险</CollapseTrigger><CollapseContent>交强险与商业险均在保。</CollapseContent></CollapseItem></Collapse>

      - id: CMP.COLLAPSE.SEMANTICS
        title_zh: 标题是按钮
        statement_zh: 每段标题是按钮，用 aria-expanded 报告展开状态、aria-controls 指向内容；上下键在标题之间移动；展开箭头的方向与状态一致。
        enforcement: { kind: review }

      - id: CMP.COLLAPSE.MODE
        title_zh: 一次一段还是多段
        statement_zh: 各段之间互不相关、篇幅长时一次只展开一段（手风琴）；用户可能同时对照几段时允许多段展开；默认展开最常用的那一段。
        enforcement: { kind: review }

  - key: descriptions
    title_zh: 描述列表
    group: components.display
    prefix: CMP.DESCRIPTIONS
    summary_zh: 详情页里成组展示字段：标签与值对齐、分组有标题；空值显示占位；长文本独占一行。
    rules:
      - id: CMP.DESCRIPTIONS.LAYOUT
        title_zh: 标签与值成对对齐
        statement_zh: 字段按业务分组，每组有标题；桌面端每行 3 列、窄屏 1 列；标签右侧或上方对齐保持全页一致；值可复制的（编号、单号）提供复制按钮。
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 分组详情
            jsx: |-
              <dl className="grid w-[520px] grid-cols-[96px_1fr_96px_1fr] gap-x-4 gap-y-2 text-copy-14"><dt className="text-ds-gray-900">车牌号</dt><dd>沪A12345</dd><dt className="text-ds-gray-900">车型</dt><dd>轻型厢式货车</dd><dt className="text-ds-gray-900">购置日期</dt><dd className="tabular-nums">2024-03-18</dd><dt className="text-ds-gray-900">备注</dt><dd className="text-ds-gray-900">—</dd></dl>

      - id: CMP.DESCRIPTIONS.EMPTY
        title_zh: 空值显示占位
        statement_zh: 没有值的字段显示「—」，不留空白也不隐藏字段（隐藏会让用户以为没有这个信息）；值为 0 显示 0。
        enforcement: { kind: review }

      - id: CMP.DESCRIPTIONS.LONG
        title_zh: 长文本独占一行
        statement_zh: 备注、地址这类长文本独占一整行（span 全部列），超过 3 行折叠并可展开。
        enforcement: { kind: review }

  - key: empty
    title_zh: 空状态
    group: components.display
    prefix: CMP.EMPTY
    summary_zh: 没有数据时：说清为什么空、下一步做什么；首次使用、筛选无结果、无权限、出错各用各的文案。
    rules:
      - id: CMP.EMPTY.REASON
        title_zh: 说清为什么空
        statement_zh: 空状态写清原因：首次使用（「还没有车辆」）、筛选无结果（「没有符合条件的车辆」）、无权限（「你没有查看车辆的权限」）；出错不用空状态，用错误状态（ERRH）。
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 原因 + 下一步
            jsx: |-
              <div className="flex w-80 flex-col items-center gap-3 rounded-xl border border-dashed border-ds-gray-400 p-6 text-center"><p className="text-copy-14 text-ds-gray-1000">没有符合条件的车辆</p><p className="text-copy-13 text-ds-gray-900">换个关键词，或清除筛选再看</p><Button size="small" variant="secondary">清除筛选</Button></div>

      - id: CMP.EMPTY.NEXT
        title_zh: 给出下一步
        statement_zh: 空状态带一个主要动作（新建、导入、清除筛选、申请权限），有权限才显示新建；不写「暂无数据」就结束。
        enforcement: { kind: review }

      - id: CMP.EMPTY.QUIET
        title_zh: 插图克制
        statement_zh: 表格、卡片里的空状态用简洁的小插图或不用插图；整页空状态可以用插图，但不喧宾夺主。
        enforcement: { kind: review }

  - key: image
    title_zh: 图片
    group: components.display
    prefix: CMP.IMAGE
    summary_zh: 图片：固定宽高比占位不跳布局；懒加载；失败有说明；有替代文字；需要时可看大图。
    rules:
      - id: CMP.IMAGE.RATIO
        title_zh: 固定宽高比
        statement_zh: 图片容器先按宽高比占位（4:3、16:9、1:1），加载前后不跳布局；裁切用 cover，需要看全图的（证件、票据）用 contain。
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 占位、懒加载、替代文字
            code: |-
              <Image src={vehicle.photoUrl} alt={`${vehicle.plate} 左侧照片`} ratio="4/3" preview className="w-80" />
            lang: tsx

      - id: CMP.IMAGE.ALT
        title_zh: 替代文字
        statement_zh: 每张图都有替代文字：内容图写图里有什么（「行驶证正面」），装饰图写空串；不写「图片」这类无信息的词。
        enforcement: { kind: review }

      - id: CMP.IMAGE.LOADING
        title_zh: 懒加载与失败
        statement_zh: 首屏以外的图片懒加载；加载失败显示占位与说明，不显示破图标；需要看细节的图片提供「查看大图」，大图在对话框里打开，可用 Esc 关闭。
        enforcement: { kind: review }

  - key: video
    title_zh: 视频
    group: components.display
    prefix: CMP.VIDEO
    summary_zh: 视频：原生控件；只预载元数据；有对白要有字幕；只有装饰视频能静音自动播放。
    rules:
      - id: CMP.VIDEO.CONTROLS
        title_zh: 用原生控件
        statement_zh: 视频用浏览器原生的 video 控件（键盘、全屏、倍速、画中画都有），外面套固定宽高比的框；不自己画一套播放控件。
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 原生控件 + 字幕
            code: |-
              <Video src={clip.url} poster={clip.poster} label="装车流程讲解" captions={{ src: clip.vtt, label: "中文", lang: "zh" }} />
            lang: tsx

      - id: CMP.VIDEO.CAPTIONS
        title_zh: 字幕
        statement_zh: 有对白或讲解的视频必须带字幕轨（captions），重要内容同时提供文字稿；只有画面的演示视频写明「无对白」。
        enforcement: { kind: review }

      - id: CMP.VIDEO.AUTOPLAY
        title_zh: 自动播放
        statement_zh: 只有静音、循环的装饰视频可以自动播放，并且在用户开启减少动效时不播放；只预载元数据（preload=metadata），不在首屏下载整段视频。
        enforcement: { kind: review }

  - key: list
    title_zh: 列表
    group: components.display
    prefix: CMP.LIST
    summary_zh: 列表：一行一个对象；标题是链接；元信息与操作对齐；空间小时代替表格。
    rules:
      - id: CMP.LIST.STRUCTURE
        title_zh: 一行一个对象
        statement_zh: 每行是一个对象：图标或头像 + 标题 + 一行描述 + 元信息 + 操作；行的结构全列表一致；需要按列比较、排序时用表格。
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 司机列表
            jsx: |-
              <List className="w-full max-w-[400px]"><ListItem href="#zw" leading={<Avatar name="张伟" decorative />} title="张伟" description="沪A·D2391" meta="128 单" /><ListItem href="#ln" leading={<Avatar name="李娜" decorative />} title="李娜" description="沪A·D2392" meta="96 单" /></List>

      - id: CMP.LIST.LINK
        title_zh: 标题是链接
        statement_zh: 整行可点时只有标题是链接，点击区扩展到整行；行内的操作按钮仍可单独聚焦，不把整行包成一个按钮。
        enforcement: { kind: review }

      - id: CMP.LIST.STATES
        title_zh: 加载、空与更多
        statement_zh: 首次加载用骨架、没有数据用空状态、追加式列表用「加载更多」；列表项超过一屏时考虑分页。
        enforcement: { kind: review }

  - key: popover
    title_zh: 气泡卡片
    group: components.display
    prefix: CMP.POPOVER
    summary_zh: 气泡卡片：点击打开、可交互的小浮层；焦点进出有序；不放必须完成的长流程。
    rules:
      - id: CMP.POPOVER.WHEN
        title_zh: 气泡卡片还是文字提示
        statement_zh: 浮层里有可交互的内容（按钮、链接、表单）或内容较多时用气泡卡片，点击打开；只有一句说明、不可交互的用文字提示。
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 点击打开、可交互
            jsx: |-
              <Popover><PopoverTrigger asChild><Button variant="secondary">车辆概况</Button></PopoverTrigger><PopoverContent className="flex w-64 flex-col gap-2"><span className="text-label-14">沪A·D2391</span><span className="text-copy-13 text-ds-gray-900">张伟 · 在途 · 预计 11:40 到达</span><Button size="small" className="self-start">查看轨迹</Button></PopoverContent></Popover>

      - id: CMP.POPOVER.FOCUS
        title_zh: 焦点与关闭
        statement_zh: 打开后焦点进入浮层（或停在触发按钮、Tab 进入浮层），Esc 或点外面关闭并把焦点还给触发按钮；浮层不遮住触发按钮。
        enforcement: { kind: review }

      - id: CMP.POPOVER.SCOPE
        title_zh: 内容克制
        statement_zh: 气泡卡片放补充信息与简短操作；必须完成的多步流程用对话框或抽屉，不放进气泡卡片。
        enforcement: { kind: review }

  - key: relative_time
    title_zh: 相对时间
    group: components.display
    prefix: CMP.RELATIVE_TIME
    summary_zh: 相对时间：「3 分钟前」；带机器可读时间；悬停看绝对时间与时区；自动刷新。
    rules:
      - id: CMP.RELATIVE_TIME.FORMAT
        title_zh: 分档
        statement_zh: 1 分钟内「刚刚」，1 小时内「N 分钟前」，24 小时内「N 小时前」，7 天内「N 天前」，更早显示日期（见 FORMAT.RELATIVE_TIME）；经格式化注册表输出。
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 相对时间 + 绝对时间
            jsx: |-
              <span className="text-copy-14">签收：<RelativeTime date="2026-11-07T11:42:03+08:00" /></span>

      - id: CMP.RELATIVE_TIME.ABSOLUTE
        title_zh: 绝对时间可见
        statement_zh: 用 time 元素并带 datetime 属性；悬停或键盘聚焦时显示带时区的绝对时间；需要审计的场景（日志、审批）直接显示绝对时间。
        enforcement: { kind: review }

      - id: CMP.RELATIVE_TIME.REFRESH
        title_zh: 自动刷新
        statement_zh: 相对时间每分钟刷新一次，不让「刚刚」停留一小时；页面不可见时暂停刷新。
        enforcement: { kind: review }

  - key: qrcode
    title_zh: 二维码
    group: components.display
    prefix: CMP.QRCODE
    summary_zh: 二维码：留足静区、对比度够；附上原文；内容过长换短链；过期的码要说明。
    rules:
      - id: CMP.QRCODE.SCAN
        title_zh: 能扫
        statement_zh: 二维码四周留出至少 4 个模块的静区，深色在浅色底上，尺寸不小于 120px；纠错等级默认 M，码上叠图标时用 H。
        params:
          min_size: { value: 120, unit: px, source: SRC.POMASTER.PRESET, label_zh: 最小尺寸 }
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 附原文的二维码
            jsx: |-
              <QrCode value="https://example.com/o/0042" size={144} caption="example.com/o/0042" />

      - id: CMP.QRCODE.TEXT
        title_zh: 附上原文
        statement_zh: 二维码下方附上原文或「复制链接」，扫不了的人（读屏用户、桌面用户）也拿得到内容；二维码本身有可读名称。
        enforcement: { kind: review }

      - id: CMP.QRCODE.STATUS
        title_zh: 过期与刷新
        statement_zh: 有时效的码（登录码、提货码）显示有效期，过期后盖上「已过期」并提供刷新；内容过长时换成短链，不生成密到扫不出的码。
        enforcement: { kind: review }

  - key: statistic
    title_zh: 统计数值
    group: components.display
    prefix: CMP.STATISTIC
    summary_zh: 指标数值：标签 + 等宽数字 + 单位；趋势用箭头加文字；涨跌好坏按指标定义。
    rules:
      - id: CMP.STATISTIC.FORMAT
        title_zh: 数字格式
        statement_zh: 数值用千分位、等宽数字，单位小一号写在数字后；精度按指标固定（金额 2 位、比例 1 位），经格式化注册表输出。
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 指标与趋势
            jsx: |-
              <div className="flex gap-12"><Statistic label="本周订单" value={12846} unit="单" trend={{ delta: 12.4, period: "较上周" }} /><Statistic label="平均等待" value={7.5} precision={1} unit="分钟" trend={{ delta: -8, period: "较上周", goodWhen: "down" }} /></div>

      - id: CMP.STATISTIC.TREND
        title_zh: 趋势
        statement_zh: 趋势用箭头加文字（「较上周 +12.4%」），写清比较的周期；涨是好是坏按指标定义（等待时长下降是好事），颜色只是辅助。
        enforcement: { kind: review }

      - id: CMP.STATISTIC.ANIMATION
        title_zh: 数字变化
        statement_zh: 数值更新时可以用数字滚动强调变化，只滚动变化的数位，停在最终值；减少动效时直接显示最终值。
        enforcement: { kind: review }

  - key: gauge
    title_zh: 仪表
    group: components.display
    prefix: CMP.GAUGE
    summary_zh: 仪表：表示一个比例（用量、满载率、得分）；阈值变色；中心写数字；不用来表示没有上限的值。
    rules:
      - id: CMP.GAUGE.WHEN
        title_zh: 什么时候用仪表
        statement_zh: 表示一个 0 到 100% 的比例（存储用量、车厢满载率、健康得分）用环形仪表；没有上限的数值用统计数值，进度用进度条。
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 阈值变色
            jsx: |-
              <div className="flex gap-6"><Gauge value={42} label="一组满载率" /><Gauge value={95} label="三组满载率" /></div>

      - id: CMP.GAUGE.THRESHOLD
        title_zh: 阈值
        statement_zh: 按业务阈值变色（例如 ≥70% 警告、≥90% 危险），阈值写在规格里而不是写死在组件里；中心同时写数字，颜色只是辅助。
        params:
          warning: { value: 70, source: SRC.POMASTER.PRESET, label_zh: 警告阈值（%） }
          danger: { value: 90, source: SRC.POMASTER.PRESET, label_zh: 危险阈值（%） }
        enforcement: { kind: review }

      - id: CMP.GAUGE.SEMANTICS
        title_zh: 可读
        statement_zh: 仪表有 role=meter 与 aria-valuenow / valuemin / valuemax，以及写明含义的名称（「三组满载率 95%」）。
        enforcement: { kind: review }

  - key: table
    title_zh: 表格
    group: components.display
    prefix: CMP.TABLE
    summary_zh: 成行成列的数据：表头清楚、数字右对齐、操作列在最右；空、加载、错误三态保持表头；分页或虚拟滚动二选一。大数据与复杂交互见「数据网格」。
    rules:
      - id: CMP.TABLE.COLUMNS
        title_zh: 列的顺序与对齐
        statement_zh: 第一列放识别对象的名称或编号（可点进详情）；文字左对齐，数字、金额右对齐并用等宽数字，状态、操作居中或左对齐但同表一致；列宽给最小值，超长文本省略并悬停显示全文。
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 对齐与操作列
            jsx: |-
              <Table className="w-[520px]"><TableHeader><TableRow><TableHead>车牌号</TableHead><TableHead className="text-right">里程（km）</TableHead><TableHead>状态</TableHead><TableHead>操作</TableHead></TableRow></TableHeader><TableBody><TableRow><TableCell>沪A12345</TableCell><TableCell className="text-right tabular-nums">12,480</TableCell><TableCell>在用</TableCell><TableCell><Button size="small" variant="tertiary">编辑</Button></TableCell></TableRow></TableBody></Table>

      - id: CMP.TABLE.ACTIONS
        title_zh: 操作列在最右，最多三个
        statement_zh: 行操作放最右列，最多直接露出 3 个文字按钮，其余收进「更多」下拉；危险操作放最后并二次确认；操作列在横向滚动时固定在右侧。
        enforcement: { kind: review }

      - id: CMP.TABLE.STATES
        title_zh: 空、加载、错误保持表头
        statement_zh: 加载时保留表头并在表体显示骨架或加载态；没有数据时表体显示空状态（说明为什么空、能做什么）；出错时表体显示错误与重试，不把整张表换成一句话。
        enforcement: { kind: review }

      - id: CMP.TABLE.PAGING
        title_zh: 分页规则
        statement_zh: 默认每页 10 或 20 条，可选 10 / 20 / 50 / 100；页码、每页条数与排序写进 URL（STATE.URL）；翻页后回到表格顶部；数据量很大时用服务端分页，不在前端一次拉全量。
        enforcement: { kind: review }

  - key: timeline
    title_zh: 时间轴
    group: components.display
    prefix: CMP.TIMELINE
    summary_zh: 时间轴：按时间排列事件；最新的在上；状态圆点加文字；进行中的下一步用待定项。
    rules:
      - id: CMP.TIMELINE.ORDER
        title_zh: 顺序
        statement_zh: 记录类的时间轴（操作日志、物流轨迹）最新的在最上面；计划类的（里程碑）按时间先后从上往下；同一页保持一种顺序。
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 物流轨迹
            jsx: |-
              <Timeline items={[{ key: "b", title: "已提货", time: { iso: "2026-11-07T09:40:00+08:00", text: "09:40" }, tone: "success" }, { key: "a", title: "已派单给张伟", time: { iso: "2026-11-07T08:15:00+08:00", text: "08:15" }, tone: "info" }]} pending="等待签收" />

      - id: CMP.TIMELINE.SEMANTICS
        title_zh: 语义
        statement_zh: 时间轴是有序列表；每项的时间用 time 元素；状态圆点只是辅助，标题里写清发生了什么。
        enforcement: { kind: review }

      - id: CMP.TIMELINE.LENGTH
        title_zh: 条目多时
        statement_zh: 条目超过 20 条时默认只显示最近的若干条，提供「查看全部」；不同类型的事件可以用图标区分，同样配文字。
        enforcement: { kind: review }

  - key: tooltip
    title_zh: 文字提示
    group: components.display
    prefix: CMP.TOOLTIP
    summary_zh: 悬停或聚焦时显示的简短说明：只补充、不承载必需信息；键盘可触达；不放可点内容。
    rules:
      - id: CMP.TOOLTIP.SUPPLEMENT
        title_zh: 只补充，不承载必需信息
        statement_zh: 提示只放补充说明（图标按钮的名称、被截断的全文、禁用原因）；完成任务必需的信息直接写在界面上；提示文字一两句，超过就改用气泡卡片或帮助链接。
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 禁用原因
            jsx: |-
              <Tooltip><TooltipTrigger asChild><span tabIndex={0} className="inline-block"><Button variant="secondary" disabled>删除</Button></span></TooltipTrigger><TooltipContent>已有在途工单，不能删除</TooltipContent></Tooltip>

      - id: CMP.TOOLTIP.A11Y
        title_zh: 键盘与读屏可达
        statement_zh: 触发元素可聚焦，聚焦时也显示提示；提示内容通过 aria-describedby 关联；移动端没有悬停，关键说明不要只放在提示里。
        enforcement: { kind: review }

      - id: CMP.TOOLTIP.NO_ACTIONS
        title_zh: 提示里不放可点内容
        statement_zh: 提示里不放按钮、链接；需要交互的用气泡卡片（Popover）；延迟出现（约 100ms）避免划过时闪烁。
        enforcement: { kind: review }

  - key: tour
    title_zh: 漫游引导
    group: components.display
    prefix: CMP.TOUR
    summary_zh: 新功能的分步引导：几步就够；可跳过、可重看；锚定到真实元素；只出现一次。
    rules:
      - id: CMP.TOUR.WHEN
        title_zh: 什么时候引导
        statement_zh: 只为新功能或改动较大的界面做引导，每次 3 到 5 步；引导不能弥补设计本身的问题，能靠界面说清的不靠引导。
        params:
          max_steps: { value: 5, source: SRC.POMASTER.PRESET, label_zh: 最多步数 }
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 锚定到真实元素
            code: |-
              <Tour open={open} onOpenChange={setOpen} steps={[{ target: () => createRef.current, title: "新建车辆", description: "录入车辆后就可以派单。" }]} />
            lang: tsx

      - id: CMP.TOUR.CONTROL
        title_zh: 可跳过、可重看
        statement_zh: 每一步都有「跳过」「上一步」「下一步」，显示「2 / 4」；Esc 随时退出；帮助菜单里可以重新打开引导。
        enforcement: { kind: review }

      - id: CMP.TOUR.ONCE
        title_zh: 只出现一次
        statement_zh: 引导完成或跳过后记住，不在每次进入时都弹；引导期间目标元素高亮，不挡住用户正常操作。
        enforcement: { kind: review }

  - key: tree
    title_zh: 树形控件
    group: components.display
    prefix: CMP.TREE
    summary_zh: 树：层级数据的浏览与选择；键盘按 WAI-ARIA 树模式；可勾选时父子联动显示半选。
    rules:
      - id: CMP.TREE.KEYBOARD
        title_zh: 键盘
        statement_zh: 树是 role=tree，节点是 treeitem；上下键移动、右键展开或进入子节点、左键收起或回到父节点、回车选择；当前节点用 aria-selected 标出。
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 组织树
            jsx: |-
              <Tree aria-label="车队组织" nodes={[{ key: "east", label: "华东区", children: [{ key: "pd", label: "浦东车队" }, { key: "xh", label: "徐汇车队" }] }, { key: "south", label: "华南区", children: [{ key: "th", label: "天河车队" }] }]} checkable checked={s.checked ?? ["pd"]} onCheckedChange={(checked) => set({ checked })} defaultExpanded={["east", "south"]} />

      - id: CMP.TREE.CHECK
        title_zh: 勾选联动
        statement_zh: 可勾选的树中，勾选父节点等于勾选全部子节点，部分子节点勾选时父节点显示半选（aria-checked=mixed）。
        enforcement: { kind: review }

      - id: CMP.TREE.LARGE
        title_zh: 节点多时
        statement_zh: 节点多时子节点按需加载（展开时请求），提供搜索并展开匹配节点的祖先；层级超过 4 级时考虑改用别的组织方式。
        enforcement: { kind: review }

  - key: json_view
    title_zh: JSON 查看器
    group: components.display
    prefix: CMP.JSON_VIEW
    summary_zh: 只读的 JSON 树：可折叠、默认展开两层；保留字面形式；整段可复制；不执行任何内容。
    rules:
      - id: CMP.JSON_VIEW.WHEN
        title_zh: 什么时候用 JSON 查看器
        statement_zh: 审计日志、Webhook 载荷、接口调试这类结构化数据用 JSON 查看器；给普通用户看的信息整理成描述列表，不直接给 JSON。
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: Webhook 载荷
            jsx: |-
              <JsonView label="order.delivered" value={{ id: "evt_8f2c", data: { order_id: "ORD-0042", signed: true, weight_kg: 1830.5 } }} className="w-full max-w-[420px]" />

      - id: CMP.JSON_VIEW.COLLAPSE
        title_zh: 折叠
        statement_zh: 对象与数组可以折叠（按钮带 aria-expanded），折叠后显示项数；默认展开两层，很大的数据默认更浅。
        enforcement: { kind: review }

      - id: CMP.JSON_VIEW.LITERAL
        title_zh: 字面形式与安全
        statement_zh: 字符串保留引号、null 与布尔值照原样显示，类型配色只是辅助；只读展示，不 eval、不把值当 HTML 渲染；整段可复制。
        enforcement: { kind: review }

  - key: middle_truncate
    title_zh: 中间省略
    group: components.display
    prefix: CMP.MIDDLE_TRUNCATE
    summary_zh: 中间省略：长路径、哈希、文件名保留首尾；全文可见可复制。
    rules:
      - id: CMP.MIDDLE_TRUNCATE.WHEN
        title_zh: 什么时候中间省略
        statement_zh: 结尾最有区分度的长文本（文件路径、哈希、带版本号的文件名、长编号）用中间省略；普通句子用结尾省略。
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 保留首尾
            jsx: |-
              <MiddleTruncate className="font-mono text-copy-13" text="uploads/2026/11/07/vehicle/沪A·D2391/inspection-report-final-v3.pdf" max={36} tail={18} />

      - id: CMP.MIDDLE_TRUNCATE.FULL_TEXT
        title_zh: 全文可见
        statement_zh: 全文放在 title 与读屏文字里，悬停能看到、读屏读得到；复制时拿到全文而不是带省略号的文本。
        enforcement: { kind: review }

      - id: CMP.MIDDLE_TRUNCATE.KEEP
        title_zh: 保留多少
        statement_zh: 结尾至少保留扩展名或版本号所在的部分（约一半），开头保留能识别出类别的部分。
        enforcement: { kind: review }

  - key: device_frame
    title_zh: 设备外框
    group: components.display
    prefix: CMP.DEVICE_FRAME
    summary_zh: 设备外框：说明截图或演示出现在哪个环境；外框是装饰；地址栏只是文字。
    rules:
      - id: CMP.DEVICE_FRAME.WHEN
        title_zh: 什么时候套外框
        statement_zh: 文档、发布说明、引导页里的截图或演示，需要说明它出现在浏览器还是手机上时套外框；产品界面本身不套外框。
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 浏览器外框
            jsx: |-
              <BrowserFrame address="fleet.example.com/vehicles" className="w-full max-w-[360px]"><div className="p-4 text-label-14">车辆列表</div></BrowserFrame>

      - id: CMP.DEVICE_FRAME.DECORATIVE
        title_zh: 外框是装饰
        statement_zh: 外框对读屏隐藏（aria-hidden），地址栏只是文字、不是可点的链接；框里的截图要有替代文字。
        enforcement: { kind: review }

      - id: CMP.DEVICE_FRAME.SCALE
        title_zh: 比例
        statement_zh: 手机外框按真实设备的宽高比，内容按实际尺寸缩放，不把桌面截图塞进手机框。
        enforcement: { kind: review }

  - key: book
    title_zh: 书封
    group: components.display
    prefix: CMP.BOOK
    summary_zh: 书封：文档、手册的封面卡片；整张是链接；颜色取品牌与功能色；悬停轻微翻开。
    rules:
      - id: CMP.BOOK.WHEN
        title_zh: 什么时候用书封
        statement_zh: 帮助中心、知识库首页展示几本手册或指南时用书封卡片，一行 3 到 5 本；普通的链接列表不用书封。
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 手册书架
            jsx: |-
              <div className="flex gap-6"><Book title="司机上岗手册" href="#driver" /><Book title="冷链运输规范" href="#cold" tone="blue" /></div>

      - id: CMP.BOOK.LINK
        title_zh: 整张是链接
        statement_zh: 整张书封是指向那份文档的链接，可读名称就是书名；不在书封里再放其他按钮。
        enforcement: { kind: review }

      - id: CMP.BOOK.MOTION
        title_zh: 悬停效果
        statement_zh: 悬停与键盘聚焦时轻微翻开，用户开启减少动效时不动；书名过长时换行，最多三行。
        enforcement: { kind: review }

  - key: comment
    title_zh: 评论
    group: components.display
    prefix: CMP.COMMENT
    summary_zh: 评论与回复：作者、时间、正文、操作；回复缩进嵌套最多两层；点赞报告状态。
    rules:
      - id: CMP.COMMENT.STRUCTURE
        title_zh: 结构
        statement_zh: 每条评论是一个 article：头像 + 作者 + 相对时间 + 正文 + 操作（回复、点赞）；回复缩进嵌套，最多两层，更深的平铺并 @ 被回复的人。
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 评论与回复
            jsx: |-
              <Comment author="李娜" date="2026-11-07T10:00:00+08:00" content="浦东仓 3 号门今天下午封闭，提货改走 5 号门。" likes={3} className="w-full max-w-[420px]" />

      - id: CMP.COMMENT.ACTIONS
        title_zh: 操作
        statement_zh: 点赞按钮报告状态（aria-pressed）与计数；回复在原处展开输入框，不跳页；自己的评论提供编辑与删除，删除后保留「该评论已删除」的占位以维持对话结构。
        enforcement: { kind: review }

      - id: CMP.COMMENT.TIME
        title_zh: 时间
        statement_zh: 时间用相对时间，悬停显示绝对时间；编辑过的评论标出「已编辑」。
        enforcement: { kind: review }

  - key: page_header
    title_zh: 页头
    group: components.display
    prefix: CMP.PAGE_HEADER
    summary_zh: 页头：面包屑 + 返回 + 页面唯一的 h1 + 描述 + 主操作；同类页面结构一致。
    rules:
      - id: CMP.PAGE_HEADER.STRUCTURE
        title_zh: 结构
        statement_zh: 页头从上到下：面包屑（可选）、返回 + 标题（页面唯一的 h1）、一句描述或元信息、右侧的主操作；同类页面的页头结构一致。
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 详情页页头
            jsx: |-
              <PageHeader className="w-full max-w-[520px]" title="沪A·D2391" description="厢式冷链车，归属浦东车队一组。" backHref="#vehicles" actions={<><Button variant="secondary">编辑</Button><Button>派单</Button></>} />

      - id: CMP.PAGE_HEADER.ACTIONS
        title_zh: 主操作
        statement_zh: 页头右侧最多一个主按钮，其余用次按钮，超过 3 个收进「更多」；操作针对整个页面的对象，行内对象的操作放在行内。
        enforcement: { kind: review }

      - id: CMP.PAGE_HEADER.TITLE
        title_zh: 标题
        statement_zh: 标题写当前对象或页面名称，与浏览器标签页的 title 对应；返回按钮带名称（「返回车辆列表」）。
        enforcement: { kind: review }

  - key: alert
    title_zh: 警告提示
    group: components.feedback
    prefix: CMP.ALERT
    summary_zh: 页面内常驻的提示条：按语义选类型，写清影响与怎么办；可关闭的只放可以忽略的信息。
    playground:
      component: Alert
      text_zh: 车辆数据每天 02:00 同步
      props:
        variant: { options: [default, destructive], default: default }
    rules:
      - id: CMP.ALERT.TYPE
        title_zh: 按语义选类型
        statement_zh: 信息（info）、成功（success）、警告（warning）、错误（error）四类按语义选，不按颜色喜好选；标题一句话说清发生了什么，描述写影响与怎么办。
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 写清影响与怎么办
            jsx: |-
              <Alert className="w-[420px]"><AlertTitle>3 辆车保险将在 7 天内到期</AlertTitle><AlertDescription>到期后车辆不能派单。到「保险管理」续保。</AlertDescription></Alert>

      - id: CMP.ALERT.PLACEMENT
        title_zh: 放在受影响内容的上方
        statement_zh: 与整页有关的提示放页面顶部（页头下方），与某个区块有关的放在该区块上方；同一位置最多一条，多条合并或按严重程度只显示最高的。
        enforcement: { kind: review }

      - id: CMP.ALERT.DISMISS
        title_zh: 只有可忽略的才能关
        statement_zh: 错误和必须处理的警告不可关闭，问题解决后自动消失；可关闭的提示关闭后记住（按用户），不每次刷新都出现。
        enforcement: { kind: review }

  - key: banner
    title_zh: 横幅
    group: components.feedback
    prefix: CMP.BANNER
    summary_zh: 贴着顶部导航的整宽系统消息：一次一条；要处理的给动作；区块内的提示用警告提示。
    rules:
      - id: CMP.BANNER.WHEN
        title_zh: 什么时候用横幅
        statement_zh: 影响整个系统的消息（计划维护、试用到期、服务降级）用横幅，贴在顶部导航下方、整宽；只和某个区块有关的提示用警告提示，放在区块里。
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 整宽系统消息
            jsx: |-
              <Banner className="w-full max-w-[520px]" onDismiss={() => undefined} action={<a href="#notice">查看公告</a>}>11 月 9 日 02:00–04:00 系统维护，期间不能派单。</Banner>

      - id: CMP.BANNER.ONE_AT_A_TIME
        title_zh: 一次一条
        statement_zh: 同一时间只显示一条横幅，按严重程度排队（出错 > 警告 > 信息）；关闭后不在本次会话里再出现，严重的问题解决前不允许关闭。
        enforcement: { kind: review }

      - id: CMP.BANNER.ACTION
        title_zh: 要处理的给动作
        statement_zh: 需要用户处理的横幅（续费、补充资料）带一个动作链接，文案写清不处理的后果与期限；纯通知类不放动作。
        enforcement: { kind: review }

  - key: drawer
    title_zh: 侧边抽屉
    group: components.feedback
    prefix: CMP.DRAWER
    summary_zh: 从侧边滑出的面板：用于需要对照页面内容的录入与详情；宽度取档位；有未保存内容时关闭先确认。
    rules:
      - id: CMP.DRAWER.WHEN
        title_zh: 对照页面内容时用抽屉
        statement_zh: 查看或编辑一条记录、同时需要看着列表或页面时用抽屉；录入超过 5 个字段用抽屉而不是对话框；抽屉里不再打开抽屉（最多两层，第二层更窄）。
        enforcement: { kind: review }

      - id: CMP.DRAWER.SIZE
        title_zh: 宽度取档位
        statement_zh: 宽度取两档：普通 384px（w-96）、宽 736px，不随内容随意设宽；窄屏全宽。标题写对象名（「编辑 沪A12345」）。
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 操作在底部
            jsx: |-
              <aside className="flex h-64 w-96 flex-col border-l border-ds-gray-400 bg-ds-background-100 shadow-lg"><header className="border-b border-ds-gray-400 px-5 py-4 text-heading-16">编辑 沪A12345</header><div className="flex-1 p-5"><Label htmlFor="d1">车牌号</Label><Input id="d1" defaultValue="沪A12345" className="mt-2" /></div><footer className="flex gap-2 border-t border-ds-gray-400 px-5 py-3"><Button>保存</Button><Button variant="secondary">取消</Button></footer></aside>

      - id: CMP.DRAWER.CLOSE
        title_zh: 未保存先确认
        statement_zh: 有未保存的修改时，点关闭、遮罩或 Esc 先确认是否放弃；保存成功后关闭抽屉并刷新受影响的列表行，不整页刷新。
        enforcement: { kind: review }

  - key: bottom_sheet
    title_zh: 底部抽屉
    group: components.feedback
    prefix: CMP.BOTTOM_SHEET
    summary_zh: 移动端的底部抽屉：操作菜单与短表单；有把手、可下滑关闭、最高 85% 视口。
    rules:
      - id: CMP.BOTTOM_SHEET.WHEN
        title_zh: 什么时候用底部抽屉
        statement_zh: 移动端的操作菜单（对一个对象的几种操作）和短表单用底部抽屉，拇指够得到；桌面端同样的内容用下拉菜单或侧边抽屉。
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 操作菜单
            jsx: |-
              <Sheet><SheetTrigger asChild><Button variant="secondary">订单操作</Button></SheetTrigger><SheetContent side="bottom"><SheetHeader><SheetTitle>ORD-20261107-0042</SheetTitle><SheetDescription>选择要对这个订单做的操作。</SheetDescription></SheetHeader><div className="flex flex-col gap-2"><Button variant="secondary">联系收货人</Button><Button variant="secondary">上报异常</Button></div></SheetContent></Sheet>

      - id: CMP.BOTTOM_SHEET.HEIGHT
        title_zh: 高度与滚动
        statement_zh: 高度随内容，最高 85% 视口，内容更多时抽屉内部滚动（滚到头不带动底下的页面）；顶部有拖拽把手，下滑或点遮罩关闭，同时保留可点的关闭按钮。
        params:
          max_height: { value: 85vh, source: SRC.POMASTER.PRESET, label_zh: 最大高度 }
        enforcement: { kind: review }

      - id: CMP.BOTTOM_SHEET.FOCUS
        title_zh: 焦点与安全区
        statement_zh: 打开后焦点进入抽屉、关闭后回到触发按钮；底部留出设备安全区，按钮不贴着屏幕边缘。
        enforcement: { kind: review }

  - key: message
    title_zh: 全局提示
    group: components.feedback
    prefix: CMP.MESSAGE
    summary_zh: 操作后的轻量全局反馈：一句话、自动消失、不打断；失败与需要处理的不用它。
    rules:
      - id: CMP.MESSAGE.WHEN
        title_zh: 只给轻量的结果
        statement_zh: 保存、复制、删除成功这类结果用全局提示，一句话说清结果（「已保存」「已复制车牌号」），2–3 秒自动消失；错误需要用户处理时用就地错误或通知，不用一闪而过的提示。
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 结果一句话
            code: |-
              toast.success('已保存')
              toast.success('已复制车牌号')
            lang: ts
          - kind: dont
            title_zh: 错误一闪而过
            code: |-
              toast.error('保存失败')
            lang: ts

      - id: CMP.MESSAGE.ONE
        title_zh: 同一时间一条
        statement_zh: 同类提示合并（连续保存只提示一次），同一时间最多 3 条；页面跳转后上一页的提示不延续。
        enforcement: { kind: review }

      - id: CMP.MESSAGE.WORDING
        title_zh: 措辞用结果
        statement_zh: 写结果而不是过程（「已删除 3 辆车」，不写「操作成功」）；与按钮名对应（按钮「发布」→ 提示「已发布」）。
        enforcement: { kind: review }

  - key: notification
    title_zh: 通知提醒框
    group: components.feedback
    prefix: CMP.NOTIFICATION
    summary_zh: 系统级、需要用户知道但不必立刻处理的消息：右上角、停留更久、可关闭、可带一个动作。
    rules:
      - id: CMP.NOTIFICATION.WHEN
        title_zh: 系统级消息用通知
        statement_zh: 后台任务完成（导出就绪、导入结束）、他人操作影响到当前用户、连接断开与恢复用通知；当前操作的直接结果用全局提示或就地反馈。
        enforcement: { kind: review }

      - id: CMP.NOTIFICATION.CONTENT
        title_zh: 标题、描述、一个动作
        statement_zh: 标题说清是什么，描述说清影响；最多一个动作（「下载」「查看」）；停留 4–5 秒，带动作或错误类的不自动关闭。
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 带动作的通知
            code: |-
              toast('车辆台账已导出', {
                description: '共 1,248 条，文件保留 24 小时。',
                action: { label: '下载', onClick: download },
                duration: Infinity,
              })
            lang: ts

      - id: CMP.NOTIFICATION.STACK
        title_zh: 堆叠有上限
        statement_zh: 同时最多 3 条，更早的折叠；同一任务的进度与结果更新同一条通知，不新弹一条。
        enforcement: { kind: review }

  - key: modal
    title_zh: 对话框
    group: components.feedback
    prefix: CMP.MODAL
    summary_zh: 需要用户先做决定的弹窗：只用于短流程与确认；标题是问题或动作，按钮写动作名；可键盘操作与关闭；长表单改抽屉或新页面。
    rules:
      - id: CMP.MODAL.WHEN
        title_zh: 只用于短流程
        statement_zh: 对话框用于确认、简短的录入（不超过 5 个字段）与需要打断当前流程的决定；字段多、需要对照页面内容的录入用抽屉；更复杂的流程用新页面；不在对话框里再弹对话框。
        enforcement: { kind: review }

      - id: CMP.MODAL.CONTENT
        title_zh: 标题与按钮写动作
        statement_zh: 标题写动作或问题（「删除 3 辆车？」），正文写后果；按钮写具体动作（「删除」「取消」），主按钮在右；危险动作的主按钮用危险样式，默认焦点在取消上。
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 动作化的标题与按钮
            jsx: |-
              <Dialog><DialogTrigger asChild><Button variant="error">删除选中车辆</Button></DialogTrigger><DialogContent className="sm:max-w-96"><DialogHeader><DialogTitle>删除 3 辆车？</DialogTitle><DialogDescription>删除后车辆的历史工单仍保留，但不能再派单。</DialogDescription></DialogHeader><DialogFooter><DialogClose asChild><Button variant="secondary">取消</Button></DialogClose><Button variant="error">删除</Button></DialogFooter></DialogContent></Dialog>

      - id: CMP.MODAL.KEYBOARD
        title_zh: 键盘与焦点
        statement_zh: 打开时焦点进入对话框、在内部循环；Esc 关闭（有未保存内容时先确认）；关闭后焦点回到触发它的元素；遮罩点击是否关闭与 Esc 一致。
        enforcement: { kind: review }

      - id: CMP.MODAL.ASYNC
        title_zh: 确认中锁定
        statement_zh: 点主按钮后按钮进入加载态并锁定，请求完成再关闭；失败时保持打开并显示错误，不丢失用户输入。
        enforcement: { kind: review }

  - key: destructive_modal
    title_zh: 危险操作确认
    group: components.feedback
    prefix: CMP.DESTRUCTIVE_MODAL
    summary_zh: 不可逆操作的确认：写清后果；焦点先在取消；确认按钮写动作本身；影响大的要输入名称。
    rules:
      - id: CMP.DESTRUCTIVE_MODAL.CONSEQUENCE
        title_zh: 写清后果
        statement_zh: 标题是问句（「解散浦东车队？」），正文写清删什么、能否恢复、影响谁（「24 辆车会移到未分组，进行中的 3 个订单不受影响，解散后不能恢复」）；不写「确定要执行此操作吗」。
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 后果 + 动作本身
            jsx: |-
              <div><Button variant="error" onClick={() => set({ open: true })}>解散车队</Button><DestructiveModal open={Boolean(s.open)} onOpenChange={(open) => set({ open })} title="解散浦东车队？" consequences="24 辆车会移到「未分组」，进行中的 3 个订单不受影响。解散后不能恢复。" confirmLabel="解散车队" confirmText="浦东车队" onConfirm={() => undefined} /></div>

      - id: CMP.DESTRUCTIVE_MODAL.FOCUS
        title_zh: 焦点与关闭
        statement_zh: 打开后焦点在「取消」上，回车不会误删；点遮罩不关闭（必须明确选择），Esc 等同取消；确认进行中按钮忙碌、不能重复提交。
        enforcement: { kind: review }

      - id: CMP.DESTRUCTIVE_MODAL.TYPE_TO_CONFIRM
        title_zh: 影响大的输入名称
        statement_zh: 批量删除、清空、解散这类影响大且不可逆的操作，要求输入对象名称后确认按钮才可用；能撤销的删除不用确认，直接做并提供撤销。
        enforcement: { kind: review }

  - key: popconfirm
    title_zh: 气泡确认
    group: components.feedback
    prefix: CMP.POPCONFIRM
    summary_zh: 就地的轻量确认：只问一句、可撤回的操作才用；不可撤回或影响大的用对话框。
    rules:
      - id: CMP.POPCONFIRM.WHEN
        title_zh: 轻量确认就地问
        statement_zh: 删除一条记录、移除一个成员这类影响小、可恢复的操作用气泡确认；批量、不可撤回、影响他人的操作用对话框写清后果。
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 一句话确认
            jsx: |-
              <Popover><PopoverTrigger asChild><Button size="small" variant="secondary">移除</Button></PopoverTrigger><PopoverContent className="w-56 p-3"><p className="text-copy-14">移除这名司机？</p><div className="mt-2 flex justify-end gap-2"><PopoverClose asChild><Button size="small" variant="secondary">取消</Button></PopoverClose><Button size="small" variant="error">移除</Button></div></PopoverContent></Popover>

      - id: CMP.POPCONFIRM.WORDING
        title_zh: 问句 + 动作按钮
        statement_zh: 标题是一句问句，确认按钮写动作名（「移除」「删除」），不写「确定」；危险动作的确认按钮用危险样式。
        enforcement: { kind: review }

      - id: CMP.POPCONFIRM.ASYNC
        title_zh: 确认中加载
        statement_zh: 确认后按钮显示加载，请求完成再关闭；失败时提示原因并保持原状态。
        enforcement: { kind: review }

  - key: progress
    title_zh: 进度条
    group: components.feedback
    prefix: CMP.PROGRESS
    summary_zh: 长任务的进度：可估计的显示百分比与剩余量，不可估计的显示阶段；超过 10 秒的任务可离开页面后台进行。
    rules:
      - id: CMP.PROGRESS.DETERMINATE
        title_zh: 能估计就显示百分比
        statement_zh: 能估计进度的任务（导入、导出、上传）显示百分比与已完成数量（「已导入 320 / 1,248 条」）；失败时进度条转为错误态并写原因。
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 百分比与数量
            jsx: |-
              <div className="flex w-80 flex-col gap-2"><Progress value={26} aria-label="导入进度" /><span className="text-copy-13 text-ds-gray-900">已导入 320 / 1,248 条</span></div>

      - id: CMP.PROGRESS.INDETERMINATE
        title_zh: 不能估计就显示阶段
        statement_zh: 无法估计的过程显示当前阶段（「校验中」「写入中」），不用假的百分比；1 秒以内的过程不显示进度（见加载条与延迟出现）。
        enforcement: { kind: review }

      - id: CMP.PROGRESS.BACKGROUND
        title_zh: 长任务转后台
        statement_zh: 超过 10 秒的任务允许离开页面继续，完成后用通知告知；任务可取消时提供取消。
        enforcement: { kind: review }

  - key: result
    title_zh: 结果与错误
    group: components.feedback
    prefix: CMP.RESULT
    summary_zh: 操作结束或整页不可用的结果页：说清发生了什么、下一步做什么；错误页给可报告的编号。
    rules:
      - id: CMP.RESULT.WHEN
        title_zh: 什么时候用结果页
        statement_zh: 流程的终点（提交成功、处理失败）和整页不可用（403 无权限、404 不存在、500 出错）用结果页；局部的失败用警告提示，不跳结果页。
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 无权限
            jsx: |-
              <Result status="403" title="没有查看这个车队的权限" description="请联系车队管理员开通。" actions={<Button variant="secondary">回到首页</Button>} />

      - id: CMP.RESULT.NEXT_STEP
        title_zh: 下一步
        statement_zh: 每个结果页都有下一步：成功页给「返回列表」「继续添加」，失败页给「重试」「返回修改」，无权限页给「申请权限」或联系人；不让用户停在死胡同。
        enforcement: { kind: review }

      - id: CMP.RESULT.ERROR_DETAIL
        title_zh: 错误页的细节
        statement_zh: 500 这类错误页不暴露堆栈与内部信息，给出可报告的请求编号（可选中复制）；404 说明可能的原因（已删除、链接有误）。
        enforcement: { kind: review }

  - key: skeleton
    title_zh: 骨架屏
    group: components.feedback
    prefix: CMP.SKELETON
    summary_zh: 首次加载的占位：几何与最终内容一致；延迟出现；只用于首屏，局部刷新用加载态。
    rules:
      - id: CMP.SKELETON.SHAPE
        title_zh: 几何与内容一致
        statement_zh: 骨架的行数、宽度、头像与图片位置与最终内容一致，加载完成后页面不跳动；宽度逐行变化，不铺满一样长的灰条。
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 和内容同形
            jsx: |-
              <div className="flex w-full max-w-[360px] gap-3"><Skeleton className="size-10 rounded-full" /><div className="flex flex-1 flex-col gap-2"><Skeleton className="h-4 w-1/2" /><Skeleton className="h-4 w-full" /><Skeleton className="h-4 w-4/5" /></div></div>

      - id: CMP.SKELETON.WHEN
        title_zh: 只用于首屏
        statement_zh: 骨架只用于页面或区块的首次加载；已有内容时的刷新、翻页用局部加载态，保留旧内容直到新内容到达。
        enforcement: { kind: review }

      - id: CMP.SKELETON.TIMING
        title_zh: 延迟出现
        statement_zh: 加载很快（约 300ms 内）时不显示骨架，避免一闪；出现后至少停留约 300–500ms；骨架的微光动画在减少动效时停止。
        params:
          delay: { value: 300, unit: ms, source: SRC.VERCEL.GUIDELINES, label_zh: 延迟出现 }
        enforcement: { kind: review }

  - key: spin
    title_zh: 加载中
    group: components.feedback
    prefix: CMP.SPIN
    summary_zh: 局部加载：只盖住正在加载的区域，延迟出现避免闪烁；整页加载用骨架或加载条。
    rules:
      - id: CMP.SPIN.SCOPE
        title_zh: 只盖住正在加载的区域
        statement_zh: 局部刷新时只在该区域显示加载（spinning 包裹区域），保留原内容的占位，不清空；整页首屏用骨架屏，路由切换用顶部加载条。
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 区域加载
            jsx: |-
              <div className="relative w-80"><Card><CardHeader><CardTitle>本月保养</CardTitle></CardHeader><CardContent className="text-copy-14">待保养 12 辆</CardContent></Card><div className="absolute inset-0 grid place-items-center rounded-xl bg-ds-background-100/70 text-label-13 text-ds-gray-900">刷新中…</div></div>

      - id: CMP.SPIN.DELAY
        title_zh: 延迟出现
        statement_zh: 加载指示延迟约 200ms 出现，出现后至少显示约 400ms（LOADING.DELAY），避免快速请求时闪一下。
        enforcement: { kind: review }

      - id: CMP.SPIN.TEXT
        title_zh: 久了要说话
        statement_zh: 超过 2 秒的加载在指示旁写在做什么（「正在汇总 3 个月的数据」）；超过 10 秒提供取消或转后台。
        enforcement: { kind: review }

  - key: watermark
    title_zh: 水印
    group: components.feedback
    prefix: CMP.WATERMARK
    summary_zh: 敏感页面的截图追溯：倾斜重复的姓名与工号；是威慑不是安全措施；不挡操作、不影响阅读。
    rules:
      - id: CMP.WATERMARK.WHEN
        title_zh: 什么时候加水印
        statement_zh: 展示个人信息、财务数据的管理侧页面加水印，内容写当前用户的姓名、工号与日期，用于截图追溯；水印是威慑，敏感数据仍靠权限与脱敏保护。
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 姓名 + 工号 + 日期
            jsx: |-
              <Watermark content={["张调度 · 10086", "2026-11-07"]} className="h-36 w-full max-w-[360px] rounded-xl border border-ds-gray-400 p-6 text-copy-14">司机：张伟　手机号：138****2391</Watermark>

      - id: CMP.WATERMARK.READABILITY
        title_zh: 不影响阅读与操作
        statement_zh: 水印颜色取半透明的中性色，正文对比度不受影响；水印层不拦截点击与选中，读屏忽略它（aria-hidden）。
        enforcement: { kind: review }

      - id: CMP.WATERMARK.CONTENT
        title_zh: 水印内容
        statement_zh: 水印内容来自当前登录用户（服务端下发），不让用户自己填写；不写手机号、证件号这类本身就敏感的信息。
        enforcement: { kind: review }

  - key: affix
    title_zh: 固钉
    group: components.other
    prefix: CMP.AFFIX
    summary_zh: 滚动时钉住的工具栏与操作条：CSS sticky；钉住后加边线与投影；不遮挡焦点。
    rules:
      - id: CMP.AFFIX.WHEN
        title_zh: 钉住什么
        statement_zh: 长列表的批量操作条、长表单的提交栏、详情页的标签栏在滚动时钉在顶部或底部；一页最多钉一条，不把整块内容钉住。
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 钉住的操作条
            jsx: |-
              <div className="h-40 w-80 overflow-y-auto rounded-xl border border-ds-gray-400"><Affix className="flex gap-2 px-4 py-2"><Button size="small">批量派单</Button><Button size="small" variant="secondary">导出</Button></Affix><ul>{Array.from({ length: 12 }, (_, i) => <li key={i} className="px-4 py-1 text-copy-14">沪A·D{2300 + i}</li>)}</ul></div>

      - id: CMP.AFFIX.STICKY
        title_zh: 用 sticky，不用滚动监听
        statement_zh: "钉住用 position: sticky（相对最近的滚动容器），不监听滚动事件去改 top；钉住后加底边线与投影，表示它浮在内容上面。"
        enforcement: { kind: review }

      - id: CMP.AFFIX.FOCUS
        title_zh: 不遮挡焦点
        statement_zh: 钉在顶部时页面设置等高的 scroll-padding-top，钉在底部时设置 scroll-padding-bottom，键盘聚焦的元素不被钉住的条盖住。
        enforcement: { kind: review }

  - key: config_provider
    title_zh: 全局配置
    group: components.other
    prefix: CMP.CONFIG_PROVIDER
    summary_zh: 应用根部的全局配置：语言地区、主题、组件默认尺寸；只放一次，组件从这里读。
    rules:
      - id: CMP.CONFIG_PROVIDER.ROOT_ONCE
        title_zh: 只在根部放一次
        statement_zh: GeistProvider 放在应用根组件，统一设置 locale、主题偏好、组件默认尺寸与文字提示延迟；组件用 useGeistConfig() 读取，页面里不各自传语言与主题。
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 根部统一配置
            jsx: |-
              <GeistProvider locale="zh-CN" theme="light" size="medium"><div className="flex gap-2"><Button>派单</Button><Button variant="secondary">取消</Button></div></GeistProvider>

      - id: CMP.CONFIG_PROVIDER.LOCALE
        title_zh: 语言与地区
        statement_zh: 日期、数字、货币的格式化读这里的地区设置（经格式化注册表），组件内置文案（「确定」「上一页」）跟随语言；语言从用户设置或浏览器语言判断，不按 IP。
        enforcement: { kind: review }

      - id: CMP.CONFIG_PROVIDER.THEME
        title_zh: 主题
        statement_zh: 主题偏好（跟随系统 / 浅色 / 深色）写到根元素的 data-theme 与 color-scheme，颜色由主题样式表的 --ds-* 变量切换；组件不按主题写两套类名。
        enforcement: { kind: review }

  - key: feedback
    title_zh: 反馈
    group: patterns.global
    prefix: FEEDBACK
    summary_zh: 按反馈的重要程度和用户是否需要处理来选提示方式；失败要给恢复动作；加载、空状态、部分成功各有固定做法。
    rules:
      - id: FEEDBACK.CHOOSE
        title_zh: 按重要程度选提示方式
        statement_zh: 操作结果轻、用户不必等待时用 Toast（一句话，约 4 秒自动消失，悬停时暂停）；必须处理的才用 Modal；后台任务完成这类系统推送用带标题与动作的通知（右下角）；需要在页面上常驻的说明用 Note / Alert（不自动消失）；操作前的二次确认贴着按钮用气泡确认，不可逆的大操作用危险确认对话框。能立刻看到结果的简单操作可以不提示，不要过度反馈。
        params:
          channels: { value: "{'轻量结果': 'Toast', '必须处理': 'Modal', '系统推送': '通知（Toast 带标题与动作）', '页面常驻说明': 'Note / Alert', '操作前确认': '气泡确认 / 危险确认对话框'}", source: SRC.POMASTER.PRESET, label_zh: 场景 → 提示方式 }
          toast_duration: { value: 4000, unit: ms, source: SRC.POMASTER.PRESET, label_zh: Toast 停留时长 }
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 页面常驻说明用 Alert
            jsx: |-
              <Alert className="w-full max-w-[480px]"><InfoIcon /><AlertTitle>停用的车型不会出现在下单页</AlertTitle><AlertDescription>已有运单不受影响。</AlertDescription></Alert>
          - kind: do
            title_zh: 轻量结果用 Toast
            code: |-
              toast.success(t('vehicleModel.saved'))   // 「车型已保存」，约 4 秒后自动消失，悬停时暂停
            lang: ts

      - id: FEEDBACK.FAILURE
        title_zh: 失败的处理
        statement_zh: 重要的失败不用会自动消失的 Toast，用 Alert 或 Modal 写清发生了什么，并给出恢复动作（重试、下载错误明细、联系管理员）；带动作的错误 Toast 不自动消失。权限不足、离线也一样要给恢复动作。每一屏都要有下一步或恢复路径。
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: Alert + 恢复动作
            jsx: |-
              <Alert variant="destructive" className="w-full max-w-[480px]"><OctagonAlertIcon /><AlertTitle>车辆台账导出失败</AlertTitle><AlertDescription><span>网络中断，已导出的 600 条保留在草稿里。</span><div className="mt-2 flex gap-2"><Button size="small" variant="secondary">重试</Button><Button size="small" variant="tertiary">下载错误明细</Button></div></AlertDescription></Alert>
          - kind: dont
            title_zh: 几秒后消失、没有下一步
            code: |-
              toast.error('导出失败')
            lang: ts

      - id: FEEDBACK.LOADING
        title_zh: 加载反馈
        statement_zh: 预计超过约 1 秒的操作给出加载反馈：按钮保留原文字并加转圈（按钮报告忙碌、不能重复提交）；局部区域用转圈；长任务用进度条并允许取消；首屏加载用骨架屏，骨架和最终内容的几何一致，加载完成后页面不跳动。转圈和骨架延迟约 150–300ms 再出现、出现后至少停留约 300–500ms，避免一闪而过。
        params:
          show_delay: { value: 150–300, unit: ms, source: SRC.VERCEL.GUIDELINES, label_zh: 延迟出现 }
          min_visible: { value: 300–500, unit: ms, source: SRC.VERCEL.GUIDELINES, label_zh: 最短停留 }
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 按钮加载态、进度条、骨架屏
            jsx: |-
              <div className="flex w-full max-w-[420px] flex-col gap-4"><Button loading>导出中</Button><div className="flex flex-col gap-2"><span className="text-label-13 text-ds-gray-900">已导出 640 / 1,248 条</span><Progress value={51} aria-label="导出进度" /></div><div className="flex flex-col gap-2"><Skeleton className="h-5 w-1/2" /><Skeleton className="h-4 w-full" /><Skeleton className="h-4 w-4/5" /></div></div>

      - id: FEEDBACK.FIELD_ERROR
        title_zh: 字段错误
        statement_zh: 校验错误显示在对应字段下方（aria-describedby 关联、aria-invalid 标出），用文字说明怎么改，用户修改前不消失；提交时聚焦到第一个出错的字段，必要时在表单顶部给错误摘要；不能只靠颜色、图标或 Toast 表达字段错误；提交失败不清空已填内容。
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 错误文字贴着字段
            jsx: |-
              <div className="flex w-72 flex-col gap-2"><Label htmlFor="fb-plate">车牌号</Label><Input id="fb-plate" defaultValue="沪A1" aria-invalid="true" aria-describedby="fb-plate-err" /><span id="fb-plate-err" className="text-copy-13 text-ds-red-900">车牌号为 7–8 位，如沪A12345</span></div>

      - id: FEEDBACK.EMPTY
        title_zh: 空状态
        statement_zh: 还没有任何数据时，空状态说明为什么是空的并引导第一步（「添加车辆」）；筛选或搜索没有结果时，说明没找到并提供「清除筛选」。两种情况文案和动作不同；空、稀疏、密集、出错四种状态都要设计。
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 还没有数据：引导第一步
            jsx: |-
              <div className="flex w-80 flex-col items-center gap-3 rounded-xl border border-dashed border-ds-gray-400 p-8 text-center"><InboxIcon className="size-6 text-ds-gray-900" /><span className="text-label-14">还没有车辆</span><span className="text-copy-13 text-ds-gray-900">添加第一辆车后就能派单了。</span><Button size="small"><PlusIcon />添加车辆</Button></div>
          - kind: do
            title_zh: 筛选无结果：提供清除筛选
            jsx: |-
              <div className="flex w-80 flex-col items-center gap-3 rounded-xl border border-ds-gray-400 p-6 text-center"><SearchXIcon className="size-6 text-ds-gray-900" /><span className="text-label-14">没有符合条件的车辆</span><Button size="small" variant="secondary">清除筛选</Button></div>

      - id: FEEDBACK.PARTIAL
        title_zh: 部分成功
        statement_zh: 批量操作部分成功时，结果里写明成功、失败、跳过各多少条，并提供失败明细与「只重试失败的」；不能只说「操作成功」或「操作失败」。
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 写清三个数
            jsx: |-
              <Alert className="w-full max-w-[480px]"><TriangleAlertIcon /><AlertTitle>120 辆车，导入了 117 辆</AlertTitle><AlertDescription><span>2 辆车牌号重复，1 辆缺少车型，已跳过。</span><div className="mt-2 flex gap-2"><Button size="small" variant="secondary">只重试失败的 3 辆</Button><Button size="small" variant="tertiary">下载明细</Button></div></AlertDescription></Alert>

      - id: FEEDBACK.BADGE
        title_zh: 徽标
        statement_zh: 与用户强相关的重要信息（待审批数）用数字计数，次要提醒用小圆点；有图标时叠在图标右上角，没有图标时放在标题后；数量要写进被包住元素的可读名称（「通知，5 条未读」），计数本身 aria-hidden。
        params:
          rule: { value: "{'重要且与用户相关': '数字', '次要提醒': '圆点'}", source: SRC.POMASTER.PRESET, label_zh: 用数字还是圆点 }
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 数字与圆点
            jsx: |-
              <div className="flex items-center gap-6"><span className="relative inline-flex"><Button variant="secondary" svgOnly aria-label="待审批，5 条"><BellIcon /></Button><span aria-hidden="true" className="absolute -right-2 -top-2 flex h-5 min-w-5 items-center justify-center rounded-full bg-ds-red-700 px-1 text-label-12 text-ds-background-100">5</span></span><span className="flex items-center gap-2 text-label-14">系统公告<span aria-hidden="true" className="size-2 rounded-full bg-ds-red-700" /><span className="sr-only">（有更新）</span></span></div>

  - key: navigation
    title_zh: 导航
    group: patterns.global
    prefix: NAV
    summary_zh: 管理侧用左侧边栏；顶部导航只在一级入口少时用；面包屑、标签页、步骤条、分页各有数量与字数上限；导航用真链接。
    rules:
      - id: NAV.ADMIN_SIDE
        title_zh: 管理侧主导航
        statement_zh: 管理侧主导航用左侧边栏（shadcn Sidebar 的形态，可收起为图标栏，Cmd/Ctrl+B 切换），适合多级、操作密集的工作台；菜单项按业务域分组，多了可以滚动；当前页面用 aria-current="page" 高亮，高亮按路由的稳定标识匹配，不按标题文字或截取 URL 判断。导航项是真链接（<a> / 路由 Link），按住修饰键能在新标签页打开。
        params:
          sider_width: { value: 16rem, source: SRC.SHADCN.SIDEBAR, label_zh: 侧栏宽度 }
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 按业务域分组的侧栏
            jsx: |-
              <nav aria-label="主导航" className="flex w-60 flex-col gap-1 rounded-xl border border-ds-gray-400 p-2"><span className="px-2 py-1 text-label-12 text-ds-gray-900">车队</span><a href="#vehicles" aria-current="page" className="flex items-center gap-2 rounded-md bg-ds-gray-alpha-200 px-2 py-2 text-label-14"><CarIcon className="size-4" />车辆</a><a href="#drivers" className="flex items-center gap-2 rounded-md px-2 py-2 text-label-14 text-ds-gray-900 hover:bg-ds-gray-alpha-100"><UsersIcon className="size-4" />司机</a><span className="px-2 py-1 text-label-12 text-ds-gray-900">运营</span><a href="#orders" className="flex items-center gap-2 rounded-md px-2 py-2 text-label-14 text-ds-gray-900 hover:bg-ds-gray-alpha-100"><PackageIcon className="size-4" />运单</a></nav>

      - id: NAV.TOP
        title_zh: 顶部导航
        statement_zh: 顶部导航只在一级入口为 2 到 7 个时使用，常见于用户侧门户；每个导航项名称不超过 14 个字；当前项 aria-current="page"。
        params:
          min_items: { value: 2, source: SRC.POMASTER.PRESET, label_zh: 最少入口 }
          max_items: { value: 7, source: SRC.POMASTER.PRESET, label_zh: 最多入口 }
          label_max: { value: 14, source: SRC.POMASTER.PRESET, label_zh: 名称字数上限 }
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 五个一级入口
            jsx: |-
              <nav aria-label="主导航" className="flex items-center gap-1 border-b border-ds-gray-400 px-2">{["首页", "下单", "运单", "账单", "帮助"].map((name, i) => <a key={name} href={"#" + i} aria-current={i === 1 ? "page" : undefined} className={"px-3 py-3 text-label-14 " + (i === 1 ? "border-b-2 border-ds-gray-1000 text-ds-gray-1000" : "text-ds-gray-900")}>{name}</a>)}</nav>

      - id: NAV.BREADCRUMB
        title_zh: 面包屑
        statement_zh: 面包屑显示当前页在层级里的位置（nav + 有序列表，最后一项是当前页、不是链接），建议不超过 3 级、最多 5 级，更深的中间折叠；页面自身的导航已经能说明位置时不加面包屑。
        params:
          recommended_max: { value: 3, source: SRC.POMASTER.PRESET, label_zh: 建议层级 }
          max: { value: 5, source: SRC.POMASTER.PRESET, label_zh: 最多层级 }
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 三级面包屑
            jsx: |-
              <nav aria-label="面包屑"><ol className="flex items-center gap-2 text-copy-14"><li><a href="#fleet" className="text-ds-gray-900 hover:text-ds-gray-1000">车队</a></li><li aria-hidden="true" className="text-ds-gray-700">/</li><li><a href="#vehicles" className="text-ds-gray-900 hover:text-ds-gray-1000">车辆</a></li><li aria-hidden="true" className="text-ds-gray-700">/</li><li aria-current="page" className="text-ds-gray-1000">沪A·D2391</li></ol></nav>

      - id: NAV.TABS
        title_zh: 标签页
        statement_zh: 标签页名称不超过 14 个字。切换页面里平级的内容区用 Tabs；卡片里切换同一份内容的展示方式用分段控件；选项很多时改用竖向标签页。标签页状态写进地址，刷新和分享后停在同一个页签。
        params:
          label_max: { value: 14, source: SRC.POMASTER.PRESET, label_zh: 名称字数上限 }
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 页面级标签页 + 卡片内分段控件
            jsx: |-
              <div className="flex w-full max-w-[480px] flex-col gap-4"><Tabs defaultValue="basic"><TabsList><TabsTrigger value="basic">基本信息</TabsTrigger><TabsTrigger value="repair">维修记录（3）</TabsTrigger><TabsTrigger value="cost">费用</TabsTrigger></TabsList></Tabs><Card><CardHeader className="flex flex-row items-center justify-between"><CardTitle>里程</CardTitle><div role="group" aria-label="统计范围" className="flex gap-1 rounded-md bg-ds-gray-100 p-1"><Button size="tiny" variant="secondary" aria-pressed="true">本周</Button><Button size="tiny" variant="tertiary" aria-pressed="false">本月</Button></div></CardHeader></Card></div>

      - id: NAV.STEPS
        title_zh: 步骤条
        statement_zh: 有固定流程的任务用步骤条（有序列表，当前步 aria-current="step"）。横向步骤条放 3 到 4 步，每步标题不超过 11 个字；步骤更多或数量会变时，用固定在页面左侧的竖向步骤条。
        params:
          horizontal_min: { value: 3, source: SRC.POMASTER.PRESET, label_zh: 横向最少步数 }
          horizontal_max: { value: 4, source: SRC.POMASTER.PRESET, label_zh: 横向最多步数 }
          title_max: { value: 11, source: SRC.POMASTER.PRESET, label_zh: 步骤标题字数上限 }
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 三步流程
            jsx: |-
              <ol className="flex w-full max-w-[480px] items-center gap-3">{["填写车辆信息", "上传证件", "提交审核"].map((title, i) => <li key={title} aria-current={i === 1 ? "step" : undefined} className="flex flex-1 items-center gap-2"><span className={"flex size-6 shrink-0 items-center justify-center rounded-full text-label-12 " + (i < 1 ? "bg-ds-gray-1000 text-ds-background-100" : i === 1 ? "bg-ds-blue-700 text-ds-background-100" : "border border-ds-gray-400 text-ds-gray-900")}>{i < 1 ? <CheckIcon className="size-3" /> : i + 1}</span><span className={"text-label-14 " + (i > 1 ? "text-ds-gray-900" : "")}>{title}</span>{i < 2 ? <span aria-hidden="true" className="h-px flex-1 bg-ds-gray-400" /> : null}</li>)}</ol>

      - id: NAV.PAGINATION
        title_zh: 分页
        statement_zh: 管理侧列表用页码分页：默认每页 20 条，每页最多 200 条；页数多时显示首尾页与当前页附近的页码，其余折叠，数据多时允许改每页条数；当前页 aria-current="page"，页码写进地址。用户侧列表用「加载更多」的游标分页，与接口的 KEYSET 分页一致，每次最多 50 条，不显示总页数。不得前端拉全量再假分页。
        params:
          admin_page_size: { value: 20, source: SRC.POMASTER.PRESET, label_zh: 管理侧每页条数 }
          admin_max_page_size: { value: 200, source: SRC.POMASTER.PRESET, label_zh: 每页最多 }
          public_max_page_size: { value: 50, source: SRC.POMASTER.PRESET, label_zh: 用户侧每次最多 }
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 管理侧页码分页
            jsx: |-
              <nav aria-label="分页" className="flex items-center gap-1 text-copy-14"><span className="mr-2 text-ds-gray-900">共 1,286 条</span><Button size="small" variant="tertiary" svgOnly aria-label="上一页"><ChevronLeftIcon /></Button><Button size="small" variant="tertiary">1</Button><span aria-hidden="true" className="px-1 text-ds-gray-700">…</span><Button size="small" variant="tertiary">5</Button><Button size="small" variant="secondary" aria-current="page">6</Button><Button size="small" variant="tertiary">7</Button><span aria-hidden="true" className="px-1 text-ds-gray-700">…</span><Button size="small" variant="tertiary">65</Button><Button size="small" variant="tertiary" svgOnly aria-label="下一页"><ChevronRightIcon /></Button></nav>

  - key: data_entry
    title_zh: 数据录入
    group: patterns.global
    prefix: ENTRY
    summary_zh: 标签常驻可见、位置全系统一致；选择控件按选项数选；提示放对位置；校验不拦键入、提交防重复且失败不丢输入。
    rules:
      - id: ENTRY.LABEL
        title_zh: 输入标签
        statement_zh: 每个输入都有常驻可见的标签（<Label htmlFor> 关联，点标签聚焦控件），必填项有星号加读屏文字。Geist 的表单标签在输入上方、左对齐、不带冒号；同一个系统只用一种。占位文字只给格式示例，不能代替标签。
        params:
          label_position: { value: 上方，左对齐，不带冒号, source: SRC.GEIST.HOME, label_zh: 标签位置 }
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 标签在上
            jsx: |-
              <div className="flex w-72 flex-col gap-2"><Label htmlFor="en-plate">车牌号</Label><Input id="en-plate" placeholder="例：沪A12345" /></div>
          - kind: dont
            title_zh: 只有占位文字，填了之后就不知道是什么
            jsx: |-
              <Input className="w-72" placeholder="请输入车牌号" />

      - id: ENTRY.CHOICE_CONTROL
        title_zh: 选择控件
        statement_zh: 二选一、改了立即生效的用开关；选项 3 到 4 个时用单选全部摆出来（需要解释差别时用选择卡片）；5 个以上用下拉选择，超过 10 个用可搜索选择；多选少量用复选框组，多了用多选选择器；需要精确数值时不用滑块，用数字输入。
        params:
          radio_range: { value: [3, 4], source: SRC.POMASTER.PRESET, label_zh: 单选平铺的选项数 }
          select_above: { value: 5, source: SRC.POMASTER.PRESET, label_zh: 改用下拉的选项数 }
          search_above: { value: 10, source: SRC.POMASTER.PRESET, label_zh: 改用可搜索选择的选项数 }
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 3 个选项用单选，即时生效用开关
            jsx: |-
              <div className="flex w-80 flex-col gap-4"><div className="flex flex-col gap-2"><span className="text-label-14">可见范围</span><RadioGroup defaultValue="dept" aria-label="可见范围">{[["self", "仅本人"], ["dept", "本部门"], ["all", "全公司"]].map(([v, l]) => <div key={v} className="flex items-center gap-2"><RadioGroupItem value={v} id={"en-" + v} /><Label htmlFor={"en-" + v}>{l}</Label></div>)}</RadioGroup></div><div className="flex items-center gap-2"><Switch id="en-auto" defaultChecked /><Label htmlFor="en-auto">到期自动提醒</Label></div></div>
          - kind: dont
            title_zh: 两个选项用下拉，多点一次还看不到全部
            jsx: |-
              <Select defaultValue="yes"><SelectTrigger className="w-40" aria-label="是否冷链"><SelectValue /></SelectTrigger><SelectContent><SelectItem value="yes">是</SelectItem><SelectItem value="no">否</SelectItem></SelectContent></Select>

      - id: ENTRY.SWITCH_IMMEDIATE
        title_zh: 开关即时生效
        statement_zh: 开关拨动即生效，旁边不放「保存」按钮，开关旁的文字写清它控制什么；保存失败时把开关拨回并说明原因；需要和其他字段一起提交才生效的，用复选框。
        params:
          labels: { value: [开启, 关闭], source: SRC.POMASTER.PRESET, label_zh: 状态文字 }
        enforcement: { kind: review }

      - id: ENTRY.HINTS
        title_zh: 提示
        statement_zh: 短提示放在字段下方，不超过一句话；优先就地说明，文字提示（Tooltip）是最后手段；收集身份证号、手机号等敏感信息时写明为什么需要；能给合理默认值就给；用正确的 type、inputMode 与 autocomplete，让键盘与自动填充对得上。
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 字段下方一句话提示
            jsx: |-
              <div className="flex w-72 flex-col gap-2"><Label htmlFor="en-phone">司机手机号</Label><Input id="en-phone" type="tel" inputMode="tel" autoComplete="tel" aria-describedby="en-phone-hint" /><span id="en-phone-hint" className="text-copy-13 text-ds-gray-900">用于派单短信，不会展示给收货人。</span></div>

      - id: ENTRY.VALIDATION
        title_zh: 校验
        statement_zh: 不拦截键入，用校验反馈代替；提交按钮在提交开始前一直可用（不因表单未填完而禁用），点了再把问题列出来并聚焦第一个错误；前端先校验格式（zod 模式），后端返回的字段错误定位到对应字段；提交中按钮进入加载态并带幂等键防止重复提交；提交失败保留已填内容；有未保存的修改时离开页面先提醒。
        enforcement: { kind: review }

      - id: ENTRY.UPLOAD
        title_zh: 上传
        statement_zh: 拖放区同时提供「选择文件」按钮（键盘可用），写明允许的格式和大小，并在选择时就校验、说明不符合的原因；上传中逐个显示进度，失败的写原因并能重试；图片用缩略图，达到数量上限后隐藏上传入口。
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 写明格式与大小
            jsx: |-
              <div className="flex w-full max-w-[420px] flex-col items-center gap-2 rounded-xl border border-dashed border-ds-gray-500 p-6 text-center"><UploadIcon className="size-5 text-ds-gray-900" /><span className="text-label-14">拖到这里，或 <Button size="tiny" variant="secondary">选择文件</Button></span><span className="text-copy-13 text-ds-gray-900">JPG、PNG 或 PDF，单个不超过 10 MB</span></div>

  - key: data_display
    title_zh: 数据展示
    group: patterns.global
    prefix: DISPLAY
    summary_zh: 表格列有稳定的类型、宽度与对齐；卡片一行最多 4 张；折叠、时间轴、轮播各有用法；每种展示都要设计超长与空数据。
    rules:
      - id: DISPLAY.TABLE_COLUMNS
        title_zh: 表格列
        statement_zh: 每列有稳定的 key、标题、值类型和宽度策略；时间、状态、操作列不换行；金额、数量右对齐并用等宽数字（tabular-nums），同列小数位一致，单位写在表头；空单元格显示「—」；长文本单行省略、悬停看全文；状态列用状态点加文字，不只靠颜色。
        params:
          empty: { value: —, source: SRC.POMASTER.PRESET, label_zh: 空值写法 }
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 金额右对齐、单位在表头、空值用「—」
            jsx: |-
              <Table className="w-full max-w-[520px]"><TableHeader><TableRow><TableHead>车牌号</TableHead><TableHead>状态</TableHead><TableHead className="text-right">运费（CNY）</TableHead><TableHead>备注</TableHead></TableRow></TableHeader><TableBody><TableRow><TableCell>沪A·D2391</TableCell><TableCell><span className="inline-flex items-center gap-2"><span aria-hidden="true" className="size-2 rounded-full bg-ds-green-700" />已签收</span></TableCell><TableCell className="text-right tabular-nums">1,280.00</TableCell><TableCell>—</TableCell></TableRow><TableRow><TableCell>沪A·D2392</TableCell><TableCell><span className="inline-flex items-center gap-2"><span aria-hidden="true" className="size-2 rounded-full bg-ds-amber-700" />在途</span></TableCell><TableCell className="text-right tabular-nums">86.50</TableCell><TableCell className="max-w-32 truncate" title="收货人要求下午三点后送达">收货人要求下午三点后送达</TableCell></TableRow></TableBody></Table>

      - id: DISPLAY.CARD_GRID
        title_zh: 卡片排布
        statement_zh: 卡片用来把相关信息收拢成一块，按栅格排列，一行最多 4 张；卡片里的长文本截断，卡片之间间距一致；整张卡片可点时只有标题是链接、点击区扩展到整卡，卡内其他按钮仍可单独聚焦。
        params:
          per_row_max: { value: 4, source: SRC.POMASTER.PRESET, label_zh: 一行最多张数 }
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 一行 4 张
            jsx: |-
              <div className="grid w-full max-w-[640px] grid-cols-4 gap-4">{[["在途", "128"], ["空闲", "42"], ["维修", "6"], ["停用", "3"]].map(([label, value]) => <Card key={label} className="gap-1 py-4"><CardContent className="flex flex-col gap-1 px-4"><span className="text-label-13 text-ds-gray-900">{label}</span><span className="text-heading-24 tabular-nums">{value}</span></CardContent></Card>)}</div>

      - id: DISPLAY.COLLAPSE
        title_zh: 折叠
        statement_zh: 长而不规则的内容用折叠面板逐步展开（标题是按钮，aria-expanded 报告状态）；各面板之间关系松散时一次只展开一个；展开状态写进地址，便于分享。
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 一次只展开一个
            jsx: |-
              <div className="w-full max-w-[420px] divide-y divide-ds-gray-400 border-y border-ds-gray-400">{[["行驶证", "有效期至 2028 年 3 月 14 日。", false], ["保险", "交强险与商业险均在保。", true], ["年检", "下次年检 2026 年 11 月 12 日。", false]].map(([title, body, open]) => <div key={title}><button type="button" aria-expanded={open} className="flex w-full items-center justify-between py-3 text-left text-label-14">{title}<ChevronDownIcon className={"size-4 text-ds-gray-900 " + (open ? "rotate-180" : "")} /></button>{open ? <p className="pb-3 text-copy-14 text-ds-gray-900">{body}</p> : null}</div>)}</div>

      - id: DISPLAY.TIMELINE
        title_zh: 时间轴
        statement_zh: 按时间记录的事件、任务用竖向时间轴（有序列表，时间用 <time>），最新的在最上面；状态圆点只是辅助，标题里有文字。
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 新的在上
            jsx: |-
              <ol className="flex w-80 flex-col gap-4">{[["途中延误", "11:05", "bg-ds-amber-700"], ["已提货", "09:40", "bg-ds-green-700"], ["已派单给张伟", "08:15", "bg-ds-blue-700"]].map(([title, time, dot]) => <li key={title} className="flex gap-3"><span aria-hidden="true" className={"mt-2 size-2 shrink-0 rounded-full " + dot} /><div className="flex flex-col"><span className="text-label-14">{title}</span><time className="text-copy-13 tabular-nums text-ds-gray-900">{time}</time></div></li>)}</ol>

      - id: DISPLAY.CAROUSEL
        title_zh: 轮播
        statement_zh: 轮播只放同级内容（图片、卡片），3 到 5 张，让用户看得出一共几张、往哪个方向切（页码圆点是带名称的按钮）；不自动轮播；管理侧工作页不用轮播。
        params:
          slides: { value: [3, 5], source: SRC.POMASTER.PRESET, label_zh: 张数 }
        enforcement: { kind: review }

      - id: DISPLAY.EDGE_CASES
        title_zh: 超长与空数据
        statement_zh: 每个展示组件都要设计两种边界情况：内容超长（截断、换行或展开；路径和编号用中间省略）和没有数据（空状态）；按短、一般、很长三种用户内容测一遍布局。按重要程度、使用频率和关联程度排列信息。
        enforcement: { kind: review }

  - key: data_format
    title_zh: 数据格式
    group: patterns.global
    prefix: FORMAT
    summary_zh: 数字、金额、日期时间、相对时间、脱敏各有固定格式，全部经格式化注册表（Intl 封装）输出，页面里不手拼。
    rules:
      - id: FORMAT.NUMBER
        title_zh: 数字
        statement_zh: 数字默认带千分位；数字与单位之间留一个空格（123,220 kg、10 MB），用不换行空格连住；比例用百分比（12.32%），进度用分数（12/30）；很大的数可以用「万」「亿」；表格里的单位写在表头；需要上下比较的数字用等宽数字。
        params:
          examples: { value: ["123,220 kg", 12.32%, 12/30], source: SRC.VERCEL.GUIDELINES, label_zh: 示例 }
          large_units: { value: [万, 亿], source: SRC.POMASTER.PRESET, label_zh: 大数单位 }
        enforcement: { kind: review }

      - id: FORMAT.AMOUNT
        title_zh: 金额
        statement_zh: 金额写成货币代码加数字（CNY 1,280.00）；同一处上下文里小数位要么都是 0 位、要么都是 2 位，不混用；列表里右对齐并用等宽数字；货币代码用 ISO 4217，不在代码里写死 ¥、$ 符号；经格式化注册表输出（Intl.NumberFormat 只在注册表里出现）。
        params:
          code: { value: CNY, source: SRC.POMASTER.PRESET, label_zh: 默认货币 }
          decimals: { value: 2, source: SRC.VERCEL.GUIDELINES, label_zh: 小数位 }
        enforcement: { kind: gate, check: format.no-local-pattern }
        examples:
          - kind: do
            title_zh: 经格式化注册表输出
            code: |-
              import { formatAmount } from '@/lib/format'

              <TableCell className="text-right tabular-nums">{formatAmount(order.freight, 'CNY')}</TableCell>
            lang: tsx
          - kind: dont
            title_zh: 页面里拼符号和小数
            code: |-
              <TableCell>¥{order.freight.toFixed(2)}</TableCell>
            lang: tsx

      - id: FORMAT.DATETIME
        title_zh: 日期时间
        statement_zh: 日期 YYYY-MM-DD，时间 24 小时制 HH:mm:ss，日期与时间之间一个空格；日期区间用「～」，两侧各一个空格；存储用 ISO 8601（UTC），显示按用户的时区与地区转换（语言从 navigator.languages 判断，不按 IP）；全部经格式化注册表输出，页面里不手拼格式串、不直接调 toLocaleString。
        params:
          date: { value: YYYY-MM-DD, source: SRC.POMASTER.PRESET, label_zh: 日期 }
          time: { value: HH:mm:ss, source: SRC.POMASTER.PRESET, label_zh: 时间 }
          datetime: { value: YYYY-MM-DD HH:mm:ss, source: SRC.POMASTER.PRESET, label_zh: 日期时间 }
          range_separator: { value: " ～ ", source: SRC.POMASTER.PRESET, label_zh: 区间连接 }
        enforcement: { kind: gate, check: format.no-local-pattern }
        examples:
          - kind: do
            title_zh: 注册表输出
            code: |-
              import { formatDateTime } from '@/lib/format'

              <time dateTime={order.signedAt}>{formatDateTime(order.signedAt)}</time>
            lang: tsx
          - kind: dont
            title_zh: 页面里手拼格式串
            code: |-
              <span>{dayjs(order.signedAt).format('YYYY/MM/DD HH:mm')}</span>
            lang: tsx

      - id: FORMAT.RELATIVE_TIME
        title_zh: 相对时间
        statement_zh: 消息、通知、动态里的时间用相对时间：1 分钟内写「刚刚」，1 小时内写「N 分钟前」，24 小时内写「N 小时前」，7 天内写「N 天前」，更早写日期；<time dateTime> 带机器可读时间，悬停或聚焦显示带时区的绝对时间（Geist Relative Time Card 的做法）；同样经格式化注册表输出。
        params:
          tiers: { value: "{'1 分钟内': '刚刚', '1 小时内': 'N 分钟前', '24 小时内': 'N 小时前', '7 天内': 'N 天前', '更早': 'YYYY-MM-DD'}", source: SRC.POMASTER.PRESET, label_zh: 分档 }
        enforcement: { kind: review }

      - id: FORMAT.MASKING
        title_zh: 脱敏
        statement_zh: 管理侧展示个人信息（领域规格里分级为 pii / sensitive_pii 的字段）时脱敏：用 * 替换并保持位数；金额、时间等高度敏感的值整体隐藏为 ***；脱敏在服务端完成，前端不拿到明文再遮。各类信息保留的位数按下表，业务更严格时可以收紧。
        params:
          rules: { value: "{'姓名': '两个字留首字，三个字及以上留首尾', '手机号': '留前 3 后 4', '证件号': '留前 6 后 4', '银行卡': '留后 4', '邮箱': '留域名和账号前 3 位', '地址': '留到省市区'}", source: SRC.POMASTER.PRESET, label_zh: 保留位数 }
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 保持位数的部分脱敏
            jsx: |-
              <dl className="grid w-80 grid-cols-[6rem_1fr] gap-y-2 text-copy-14"><dt className="text-ds-gray-900">姓名</dt><dd>张*伟</dd><dt className="text-ds-gray-900">手机号</dt><dd className="tabular-nums">138****2391</dd><dt className="text-ds-gray-900">身份证号</dt><dd className="tabular-nums">310101********1234</dd></dl>

  - key: copywriting
    title_zh: 文案
    group: patterns.global
    prefix: COPY
    summary_zh: 界面文字走文案字典；从用户视角、简洁一致地写；语气平和；报错说清怎么办；标点与用词统一。
    rules:
      - id: COPY.NO_LITERAL
        title_zh: 文案字典
        statement_zh: 组件、hooks、工具函数里不写死界面文字，统一经文案字典的 key 取用（t('vehicle.form.plate')，用户数据除外）；key 用稳定的点分标识，不用文案本身作 key；插值用命名占位符 {name}；品牌名、代码和标识符标 translate="no"。
        enforcement: { kind: gate, check: text.no-literal-copy }
        examples:
          - kind: do
            title_zh: 经 key 取文案
            code: |-
              <Button onClick={save}>{t('vehicle.form.save')}</Button>
            lang: tsx
          - kind: dont
            title_zh: 组件里写死中文
            code: |-
              <Button onClick={save}>保存车辆</Button>
            lang: tsx

      - id: COPY.USER_VIEW
        title_zh: 用户视角
        statement_zh: 写用户能做什么、会得到什么，不写系统怎么实现；用主动语态（「安装命令行工具」，不是「命令行工具将被安装」）；去掉用户已经知道的话；同一事物全系统一个叫法，操作名称和它打开的页面标题一致，按钮叫「发布」，结果就叫「已发布」；最重要的信息放在最前面。
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 说结果
            jsx: |-
              <Alert className="w-full max-w-[420px]"><CircleCheckIcon /><AlertTitle>车辆已停用</AlertTitle><AlertDescription>它不会再被派单，已有运单照常完成。</AlertDescription></Alert>
          - kind: dont
            title_zh: 说实现
            jsx: |-
              <Alert className="w-full max-w-[420px]"><AlertTitle>status 字段已更新为 DISABLED</AlertTitle><AlertDescription>调度服务将在下次同步时读取该变更。</AlertDescription></Alert>

      - id: COPY.TONE
        title_zh: 语气
        statement_zh: 称呼用「你」；多给建议，少用「不能」「不要」「请勿」这类命令；出了问题聚焦怎么解决，不指责用户；「抱歉」只用在系统造成的问题上；不用「绝不」这类绝对化说法；语气积极、给出办法，即使是报错。
        enforcement: { kind: review }

      - id: COPY.ERROR_MESSAGE
        title_zh: 报错文案
        statement_zh: 报错写清两件事：发生了什么（客观描述，不只给错误码），用户下一步怎么做（配一个明确的动作）。错误码与请求编号可以附在后面供排查。
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 原因 + 下一步
            jsx: |-
              <Alert variant="destructive" className="w-full max-w-[420px]"><OctagonAlertIcon /><AlertTitle>车牌号已存在</AlertTitle><AlertDescription><span>沪A·D2391 已登记在浦东车队。换一个车牌号，或去编辑那辆车。</span><span className="mt-1 text-copy-12 text-ds-gray-900">错误码 VEHICLE_PLATE_TAKEN</span></AlertDescription></Alert>
          - kind: dont
            title_zh: 只有错误码
            jsx: |-
              <Alert variant="destructive" className="w-full max-w-[420px]"><AlertTitle>错误 409</AlertTitle></Alert>

      - id: COPY.PUNCTUATION
        title_zh: 标点与空格
        statement_zh: 中文与数字、英文之间加一个空格（2 个、5 MB）；按钮、标题、输入提示、表格里的短句不加句号；感叹号只用于问候和祝贺；省略号用单个字符「…」，打开后续步骤的菜单项（「重命名…」）与加载中的文字（「保存中…」）以它结尾；快捷键与单位用不换行空格连住（⌘ K、10 MB）。
        enforcement: { kind: review }

      - id: COPY.TERMS
        title_zh: 用词
        statement_zh: 规范用词：写「其他」不写「其它」，写「登录」不写「登陆」，指代时「此」比「该」更明确；统计数字用阿拉伯数字。禁用词表随项目补充。
        params:
          banned: { value: "{'其它': '其他', '登陆': '登录'}", source: SRC.POMASTER.PRESET, label_zh: 禁用词 }
        enforcement: { kind: gate, check: text.banned-terms }

  - key: buttons
    title_zh: 按钮
    group: patterns.global
    prefix: BUTTON
    summary_zh: 按用途选按钮变体；一个按钮区一个主按钮；推荐操作在前、风险操作在后、「更多」在最右；文案用动词。
    rules:
      - id: BUTTON.TYPES
        title_zh: 按钮类型
        statement_zh: default（最深的灰）用于完成、推荐类操作；拿不准时用 secondary；表格操作列等大量重复的地方用 tertiary；删除等有风险的操作用 error，需要提醒但可撤销的用 warning；空间小、按钮多时用纯图标按钮，必须带 aria-label（需要时配文字提示）；一个按钮里不放两个图标。
        params:
          map: { value: "{'完成与推荐': 'default', '其余操作': 'secondary', '表格操作列': 'tertiary', '有风险': 'error', '需提醒': 'warning', '空间小': '纯图标（带 aria-label）'}", source: SRC.GEIST.BUTTON, label_zh: 用途 → 变体 }
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 各变体的用途
            jsx: |-
              <div className="flex items-center gap-3"><Button>发布</Button><Button variant="secondary">预览</Button><Button variant="tertiary">编辑</Button><Button variant="error">删除车辆</Button><Button variant="secondary" svgOnly aria-label="刷新列表"><RefreshCwIcon /></Button></div>

      - id: BUTTON.SINGLE_PRIMARY
        title_zh: 主按钮
        statement_zh: 同一个按钮区（工具栏、对话框底部、表单底部）最多一个 default 变体的主按钮，其余用 secondary 或 tertiary。
        params:
          max_primary: { value: 1, source: SRC.GEIST.BUTTON, label_zh: 主按钮上限 }
        enforcement: { kind: gate, check: markup.single-primary-button }
        examples:
          - kind: do
            title_zh: 一个主按钮
            jsx: |-
              <div className="flex gap-2"><Button variant="secondary">取消</Button><Button>保存车辆</Button></div>
          - kind: dont
            title_zh: 三个主按钮，看不出该点哪个
            jsx: |-
              <div className="flex gap-2"><Button>保存</Button><Button>保存并新建</Button><Button>提交审核</Button></div>

      - id: BUTTON.ORDER
        title_zh: 按钮顺序
        statement_zh: 推荐的操作放在阅读起点，有风险的操作放最后，折叠起来的「更多」永远在最右；有返回含义的按钮放最左；对话框底部「取消」在前、主操作在后（右对齐）。工具栏按「推进业务（新建、保存、发布）→ 视图控制 → 其他（刷新、设置）→ 更多」排列。
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 工具栏顺序
            jsx: |-
              <div className="flex items-center gap-2"><Button><PlusIcon />新建车辆</Button><Button variant="secondary">导出</Button><Button variant="tertiary" svgOnly aria-label="刷新"><RefreshCwIcon /></Button><DropdownMenu><DropdownMenuTrigger asChild><Button variant="tertiary" svgOnly aria-label="更多操作"><EllipsisIcon /></Button></DropdownMenuTrigger><DropdownMenuContent><DropdownMenuItem>导入…</DropdownMenuItem><DropdownMenuItem>列设置…</DropdownMenuItem></DropdownMenuContent></DropdownMenu></div>

      - id: BUTTON.PLACEMENT
        title_zh: 按钮位置
        statement_zh: 按钮放在它作用的内容旁边；工具栏的按钮靠右；页面底部的按钮区只用于两种情况：详情页推进流程（审批通过、驳回）和拆成多张卡片的复杂表单（Geist 的表单卡片把保存放在卡片页脚）。
        enforcement: { kind: review }

      - id: BUTTON.COPY
        title_zh: 按钮文案
        statement_zh: 按钮文案用动词（下拉按钮除外），具体到对象，说清点了会发生什么，如「发布」「保存 API 密钥」，少用「确定」「继续」「提交」这类泛词；主要操作本身是否定动作时点明后果，如「删除车型」；加载中保留原文字并加转圈。
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 说清结果
            jsx: |-
              <div className="flex gap-2"><Button variant="secondary">取消</Button><Button variant="error">删除车型</Button></div>
          - kind: dont
            title_zh: 泛词，看不出后果
            jsx: |-
              <div className="flex gap-2"><Button variant="secondary">取消</Button><Button>确定</Button></div>

      - id: BUTTON.GROUPING
        title_zh: 按钮分组
        statement_zh: 按钮之间用间距分组，确有需要才加分割线；不要把普通按钮拼接成一组，容易被当成切换按钮——互斥切换用分段控件。
        enforcement: { kind: review }

  - key: data_list
    title_zh: 数据列表
    group: patterns.global
    prefix: LIST
    summary_zh: 按数据选列表形态与查询方式；分页并记住位置；详情打开方式有选择规则；批量、新建、删除各有固定做法。
    rules:
      - id: LIST.FORM
        title_zh: 列表形态
        statement_zh: 多字段、需要比较的数据用表格；空间小（侧栏、下拉、小弹层）时用实体列表（每行图标 + 标题 + 描述 + 操作）；展示型内容用卡片网格；数据很多时虚拟滚动，不一次渲染上千行。
        enforcement: { kind: review }

      - id: LIST.QUERY
        title_zh: 查询方式
        statement_zh: 改条件立刻刷新结果用筛选（已生效的筛选显示为可移除的标签）；一个关键词跨多个字段找用搜索框（防抖、取消旧请求）；多个条件组合后一起提交用查询表单。常用的查询放在列表工具栏里，复杂查询单独放一个区域；筛选、排序、页码全部写进地址。
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 工具栏里的搜索与筛选
            jsx: |-
              <div className="flex w-full max-w-[560px] items-center gap-2"><div role="search" className="relative flex-1"><SearchIcon className="pointer-events-none absolute left-3 top-1/2 size-4 -translate-y-1/2 text-ds-gray-900" /><Input type="search" aria-label="搜索车辆" placeholder="车牌号、司机" className="pl-8" /></div><Select defaultValue="all"><SelectTrigger className="w-32" aria-label="状态"><SelectValue /></SelectTrigger><SelectContent><SelectItem value="all">全部状态</SelectItem><SelectItem value="moving">在途</SelectItem><SelectItem value="idle">空闲</SelectItem></SelectContent></Select><Button><PlusIcon />新建车辆</Button></div>

      - id: LIST.PAGING
        title_zh: 分页与位置
        statement_zh: 列表默认分页加载，只有一页时隐藏分页；从详情返回列表时恢复原来的页码、筛选和滚动位置（状态在地址里，浏览器后退即可恢复），并标记看过的条目；信息流、消息类列表用同页加载更多。
        enforcement: { kind: review }

      - id: LIST.DETAIL_ENTRY
        title_zh: 详情入口
        statement_zh: 点标题进入详情（标题是链接）。内容一屏放得下就在行内展开；信息较多用侧边抽屉（不离开列表）；需要分享链接或沉浸处理用独立页面；需要在多条之间快速切换用左右两栏。
        enforcement: { kind: review }

      - id: LIST.BATCH
        title_zh: 批量操作
        statement_zh: 勾选行之后，工具栏位置出现批量操作栏，写明已选几项，并提供批量操作和取消选择；表头复选框在部分选中时是半选态；批量操作的位置全系统一致。
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 已选数量 + 批量操作
            jsx: |-
              <div className="flex w-full max-w-[560px] items-center justify-between rounded-md border border-ds-gray-400 bg-ds-gray-100 px-3 py-2"><span className="text-label-14">已选 3 辆车</span><div className="flex gap-2"><Button size="small" variant="secondary">批量派单</Button><Button size="small" variant="secondary">导出</Button><Button size="small" variant="tertiary">取消选择</Button></div></div>

      - id: LIST.CREATE
        title_zh: 新建入口
        statement_zh: 工具栏右侧「新建」按钮打开对话框、侧边抽屉或新页面，新建成功后新条目排在列表第一并短暂高亮；在列表里就地添加时，「添加」按钮放在列表首或尾，新条目出现在按钮的位置。
        enforcement: { kind: review }

      - id: LIST.DELETE
        title_zh: 删除
        statement_zh: 能撤销的删除直接执行，并在 Toast 里提供约 1 分钟内的撤销；不能撤销的删除贴着按钮用气泡确认，不弹整屏对话框；破坏性很大的操作（批量删除、清空、删除项目）用危险确认对话框，并要求输入名称确认。
        params:
          undo_window: { value: 60000, unit: ms, source: SRC.POMASTER.PRESET, label_zh: 撤销窗口 }
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 气泡确认贴着按钮
            jsx: |-
              <Popover><PopoverTrigger asChild><Button size="small" variant="error">删除</Button></PopoverTrigger><PopoverContent className="flex w-64 flex-col gap-3" role="alertdialog" aria-label="删除这辆车？"><span className="text-label-14">删除这辆车？</span><span className="text-copy-13 text-ds-gray-900">删除后不能恢复。</span><div className="flex justify-end gap-2"><PopoverClose asChild><Button size="tiny" variant="secondary">取消</Button></PopoverClose><Button size="tiny" variant="error">删除</Button></div></PopoverContent></Popover>

  - key: proximity
    title_zh: 亲密性
    group: patterns.principles
    prefix: PROXIMITY
    summary_zh: 有关系的靠近，没关系的拉开；用间距的远近表达结构与层级。
    rules:
      - id: PROXIMITY.GROUPING
        title_zh: 分组
        statement_zh: 关系紧密的元素靠在一起，读作一个整体；没关系的拉开距离。间距只取 4px 倍数的档位（见「间距」领域），常用 8 / 16 / 24 / 32 四档：标签与值 8，同组字段 16，组与组 24 到 32；需要再拉开层次时升一档，或加分割线。
        params:
          formula: { value: 4 的倍数, source: SRC.TAILWIND.SPACING, label_zh: 间距取值 }
          tiers: { value: [8, 16, 24, 32], unit: px, source: SRC.POMASTER.PRESET, label_zh: 常用档位 }
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 标签和值靠近，组与组拉开
            jsx: |-
              <div className="flex w-80 flex-col gap-8"><div className="flex flex-col gap-4"><div className="flex flex-col gap-2"><span className="text-label-13 text-ds-gray-900">车牌号</span><span className="text-copy-14">沪A·D2391</span></div><div className="flex flex-col gap-2"><span className="text-label-13 text-ds-gray-900">司机</span><span className="text-copy-14">张伟</span></div></div><div className="flex flex-col gap-2"><span className="text-label-13 text-ds-gray-900">下次年检</span><span className="text-copy-14">2026-11-12</span></div></div>

  - key: alignment
    title_zh: 对齐
    group: patterns.principles
    prefix: ALIGN
    summary_zh: 每个元素都有意对齐到栅格、基线、边缘或视觉中心；文字左对齐共用起始边；数字右对齐、小数位一致。
    rules:
      - id: ALIGN.TEXT
        title_zh: 文字对齐
        statement_zh: 标题和正文左对齐，共用同一条起始边；每个元素都有意对齐到栅格、基线、边缘或视觉中心，几何对齐看着不对时允许 1px 的视觉微调；图标与文字并排时平衡两者的粗细、大小与间距。只有在刻意强调标题与正文的区别时才打破这条线。
        enforcement: { kind: review }

      - id: ALIGN.FORM_LABEL
        title_zh: 表单标签对齐
        statement_zh: Geist 的表单标签在输入上方、与输入左边对齐；同一表单里的标签与输入共用一条起始边；横排的筛选条、设置项（标签在左）时标签列等宽、左对齐，输入列对齐成一条竖线。
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 标签与输入共用起始边
            jsx: |-
              <div className="flex w-72 flex-col gap-4">{[["车牌号", "沪A·D2391"], ["核定载重（吨）", "12.5"]].map(([label, value]) => <div key={label} className="flex flex-col gap-2"><Label htmlFor={"al-" + label}>{label}</Label><Input id={"al-" + label} defaultValue={value} /></div>)}</div>

      - id: ALIGN.NUMBERS
        title_zh: 数字对齐
        statement_zh: 同一列的数字右对齐，小数位保持一致，用等宽数字（tabular-nums），方便上下比较。
        enforcement: { kind: review }

  - key: contrast
    title_zh: 对比
    group: patterns.principles
    prefix: CONTRAST
    summary_zh: 主次分明；需要慎重的选择保持中立；状态靠颜色加形状或文字区分；交互态比静止态对比更强。
    rules:
      - id: CONTRAST.PRIMARY_ACTION
        title_zh: 主次对比
        statement_zh: 更重要、更常用的操作要突出，也可以靠弱化其他操作来突出它。需要用户慎重判断的选择（同意或拒绝一份申请）两个按钮用同样的变体，不引导用户选某一个。
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 审批时两个选择同等对待
            jsx: |-
              <div className="flex gap-2"><Button variant="secondary">驳回</Button><Button variant="secondary">通过</Button></div>
          - kind: dont
            title_zh: 把「通过」做成主按钮，暗示用户选它
            jsx: |-
              <div className="flex gap-2"><Button variant="tertiary">驳回</Button><Button>通过</Button></div>

      - id: CONTRAST.STATUS
        title_zh: 状态区分
        statement_zh: 不同状态用不同颜色，同时配图标或文字，不能只靠颜色区分；悬停、按下、聚焦态的对比要比静止态更强；整页的标题与正文用字号、字重拉开层级；图表用色盲友好的配色。
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 颜色 + 文字
            jsx: |-
              <div className="flex items-center gap-4 text-copy-14">{[["bg-ds-green-700", "已签收"], ["bg-ds-amber-700", "在途"], ["bg-ds-red-700", "异常"]].map(([dot, label]) => <span key={label} className="inline-flex items-center gap-2"><span aria-hidden="true" className={"size-2 rounded-full " + dot} />{label}</span>)}</div>

  - key: repetition
    title_zh: 重复
    group: patterns.principles
    prefix: REPEAT
    summary_zh: 同类东西全系统长得一样、放在一样的位置，降低学习成本。
    rules:
      - id: REPEAT.CONSISTENCY
        title_zh: 一致性
        statement_zh: 同一类元素（分割线、颜色、形状、信息格式、间距、圆角）在全系统用同一种做法；同类页面用同样的结构，共性问题在共享组件（src/components/ui）里改，不在单个页面里改。
        enforcement: { kind: review }

  - key: direct
    title_zh: 直截了当
    group: patterns.principles
    prefix: DIRECT
    summary_zh: 在哪里看到就在哪里改；拖拽只沿一个方向，并提供不用拖拽的替代方式。
    rules:
      - id: DIRECT.INLINE_EDIT
        title_zh: 就地编辑
        statement_zh: 能就地编辑的不跳到另一页。偶尔改、以阅读为主的单个字段用点击编辑（悬停高亮，点开带保存和取消，Esc 取消）；经常要改的用旁边的编辑按钮；多个字段一起改时进入行内编辑，切换前后表格列宽不跳动。
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 单字段点击编辑
            jsx: |-
              <div className="flex w-80 flex-col gap-2"><span className="text-label-13 text-ds-gray-900">备注</span>{s.editing ? <div className="flex items-center gap-2"><Input aria-label="备注" defaultValue="冷链车，箱温 2–8℃" /><Button size="small" onClick={() => set({ editing: false })}>保存</Button><Button size="small" variant="tertiary" onClick={() => set({ editing: false })}>取消</Button></div> : <button type="button" onClick={() => set({ editing: true })} className="rounded-md px-2 py-1 text-left text-copy-14 hover:bg-ds-gray-alpha-100">冷链车，箱温 2–8℃</button>}</div>

      - id: DIRECT.DRAG
        title_zh: 拖拽
        statement_zh: 可拖拽的条目悬停时出现拖拽手柄、指针变成手形，可放置的位置有明显外框；只沿一个方向拖（纵向或横向）；拖动期间禁止选中文字；每个拖拽都提供点击和键盘的替代方式（上移、下移按钮或序号输入）。
        enforcement: { kind: review }

  - key: stay
    title_zh: 足不出户
    group: patterns.principles
    prefix: STAY
    summary_zh: 能在当前页完成的不跳页：确认用气泡确认或撤销，补充信息用浮层或抽屉，流程尽量在一页内展开。
    rules:
      - id: STAY.ON_PAGE
        title_zh: 不跳页
        statement_zh: "能撤销的操作直接做并提供撤销，不能撤销的贴着按钮用气泡确认；补充信息用浮层或侧边抽屉；同一组文字提示只有第一个有延迟，后面的立即出现；小的文字修改用就地编辑；多步任务尽量在一页内逐步展开，不把每一步拆成独立页面；对话框与抽屉里的滚动不带动底下的页面（overscroll-behavior: contain）。"
        params:
          undo_window: { value: 60000, unit: ms, source: SRC.POMASTER.PRESET, label_zh: 撤销窗口 }
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 悬停看详情，不跳页
            jsx: |-
              <TooltipProvider><Tooltip><TooltipTrigger asChild><Button variant="tertiary" size="small">沪A·D2391</Button></TooltipTrigger><TooltipContent>张伟 · 在途 · 预计 11:40 到达</TooltipContent></Tooltip></TooltipProvider>

  - key: lightweight
    title_zh: 简化交互
    group: patterns.principles
    prefix: LIGHT
    summary_zh: 关键操作常驻可见；上下文操作悬停出现；可点区域做大、工具靠近内容；看着能点的都能点。
    rules:
      - id: LIGHT.TOOLS
        title_zh: 工具常驻
        statement_zh: 关键操作始终可见，有清晰的可点区域和悬停、按下状态；只和某一行或某个对象相关的操作，悬停或聚焦时才出现（键盘聚焦时也要出现）；看起来可交互的部分都要真能交互。关键操作不能藏在悬停或模式切换后面。
        enforcement: { kind: review }

      - id: LIGHT.HOTSPOT
        title_zh: 可点区域
        statement_zh: 可点区域与看到的目标一致；小于 24px 的目标把点击区扩到至少 24×24 CSS px，移动端至少 44px；优先放大可点区域，而不是放大按钮本身（比如整行都能点）；工具放在它作用的内容旁边。
        params:
          min_target: { value: 24, unit: px, source: SRC.VERCEL.GUIDELINES, label_zh: 最小点击区 }
          min_target_mobile: { value: 44, unit: px, source: SRC.VERCEL.GUIDELINES, label_zh: 移动端最小点击区 }
        enforcement: { kind: review }

  - key: invitation
    title_zh: 提供邀请
    group: patterns.principles
    prefix: INVITE
    summary_zh: 拖拽、就地编辑这类不容易发现的交互，要主动给出提示。
    rules:
      - id: INVITE.DISCOVERABILITY
        title_zh: 交互邀请
        statement_zh: 拖拽、就地编辑、上下文工具这类不容易发现的交互要给出提示：空状态引导第一步、悬停时提示可点或可编辑、未完成的任务提示继续。新功能引导只放几步，可跳过、可重看；不能拿引导来弥补交互本身的问题。
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 未完成任务提示继续
            jsx: |-
              <Card className="w-full max-w-[420px]"><CardHeader><CardTitle>完成车队设置</CardTitle><CardDescription>还差 2 步：添加司机、设置派单规则。</CardDescription></CardHeader><CardContent className="flex flex-col gap-2"><Progress value={60} aria-label="设置进度" /><Button size="small" className="self-start">继续设置</Button></CardContent></Card>

  - key: transition
    title_zh: 巧用过渡
    group: patterns.principles
    prefix: TRANSITION
    summary_zh: 用过渡说明刚刚发生了什么；只动 transform 与 opacity；不动没变化的东西；尊重减少动效设置。
    rules:
      - id: TRANSITION.EXPLAIN
        title_zh: 用过渡说明变化
        statement_zh: "动画只用来说明因果或刻意的愉悦：切换视图时用滑动、展开保留上下文；新增的条目短暂高亮，修改过的单元格短暂着色后恢复，删除的元素平滑移除，高亮在几秒内淡出；只动 transform 与 opacity，不写 transition: all，列出要过渡的属性；用户操作能打断动画；不给没变化的元素加动画；用户开启「减少动效」时关闭或降级过渡。时长取动效 token。"
        params:
          fast: { value: 150, unit: ms, source: SRC.TAILWIND.TRANSITIONS, label_zh: 短 }
          normal: { value: 200, unit: ms, source: SRC.TAILWIND.TRANSITIONS, label_zh: 中 }
          slow: { value: 300, unit: ms, source: SRC.TAILWIND.TRANSITIONS, label_zh: 长 }
        enforcement: { kind: review }

  - key: reaction
    title_zh: 即时反应
    group: patterns.principles
    prefix: REACT
    summary_zh: 输入时即时给出联想、校验与结果；加载样式随操作的频率与重要程度选；新内容到达时提示或短暂高亮。
    rules:
      - id: REACT.IMMEDIATE
        title_zh: 即时反应
        statement_zh: 输入时给出联想、实时校验（如密码强度）、实时搜索结果，并做防抖、取消旧请求、丢弃过期响应；加载样式按操作的频率和重要程度选（按钮、表格、整页），不要所有操作都用同一种；异步更新用礼貌的 aria-live 区域播报；有新内容时提示刷新，或在几秒内高亮新到的条目；提示逐步给，不要一次全摆出来。
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 输入联想
            jsx: |-
              <div className="flex w-72 flex-col gap-2"><Label htmlFor="re-dest">目的地</Label><Input id="re-dest" defaultValue="浦东机" role="combobox" aria-expanded="true" aria-controls="re-list" /><ul id="re-list" role="listbox" className="rounded-md border border-ds-gray-400 p-1 shadow-md">{["浦东机场 T1", "浦东机场 T2"].map((name, i) => <li key={name} role="option" aria-selected={i === 0} className={"rounded-md px-2 py-2 text-copy-14 " + (i === 0 ? "bg-ds-gray-alpha-200" : "")}>{name}</li>)}</ul></div>

  - key: visualization_page
    title_zh: 数据可视化页
    group: patterns.templates
    prefix: VIZ
    summary_zh: 概览、分析、明细三类；最重要的指标放左上；一屏 5 到 9 个模块；高度概括的数据用指标卡；一张卡片一个主题。
    rules:
      - id: VIZ.TYPES
        title_zh: 页面类型
        statement_zh: 数据可视化页分三类：概览（指标大盘、监控）、分析（多维分析）、明细（数据明细）。先定类型，再选模块。
        enforcement: { kind: review }

      - id: VIZ.LAYOUT
        title_zh: 版面布局
        statement_zh: 最重要的指标和视图放在页面顶部或左上；一屏控制在 5 到 9 个模块；高度概括的数据优先用指标卡（数值 + 趋势），而不是图表；一张卡片一个主题，相关度高的数据合并到一张卡片；用 Bento 栅格时大格给主角，小格给辅助指标。
        params:
          modules: { value: [5, 9], source: SRC.POMASTER.PRESET, label_zh: 一屏模块数 }
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 顶部一排指标卡
            jsx: |-
              <div className="grid w-full max-w-[640px] grid-cols-3 gap-4">{[["本周订单", "12,846", "较上周 +12.4%"], ["准点率", "98.2%", "较上周 +1.4%"], ["平均等待", "7.5 分钟", "较上周 −8%"]].map(([label, value, trend]) => <Card key={label} className="py-4"><CardContent className="flex flex-col gap-1 px-4"><span className="text-label-13 text-ds-gray-900">{label}</span><span className="text-heading-24 tabular-nums">{value}</span><span className="text-label-12 text-ds-green-900">{trend}</span></CardContent></Card>)}</div>

      - id: VIZ.CHART
        title_zh: 图表与口径
        statement_zh: 按要表达的关系选图表类型（趋势用折线，构成用堆叠，比较用柱状），用色盲友好的配色，必要时说明指标口径；用筛选让用户既能看全局，也能下钻到细节，筛选写进地址；页面之间用交互串联。
        enforcement: { kind: review }

  - key: detail_page
    title_zh: 详情页
    group: patterns.templates
    prefix: DETAIL
    summary_zh: 按信息复杂度选布局；信息平铺直给；用分割线、卡片、标签页分出层级；单据类流程操作放页脚。
    rules:
      - id: DETAIL.LAYOUT
        title_zh: 布局
        statement_zh: 内容简单时放在一张卡片里，用分割线分组；有多个复杂模块时每个模块一张卡片（审批单据类）；内容多到一页放不下时用标签页做导航；按阶段推进的内容用步骤组织。默认用最简单的那种。
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 一张卡片，分割线分组
            jsx: |-
              <Card className="w-full max-w-[480px]"><CardHeader><CardTitle>沪A·D2391</CardTitle><CardDescription>厢式冷链车 · 浦东车队一组</CardDescription></CardHeader><CardContent className="flex flex-col gap-4"><dl className="grid grid-cols-2 gap-4 text-copy-14"><div><dt className="text-label-13 text-ds-gray-900">司机</dt><dd>张伟</dd></div><div><dt className="text-label-13 text-ds-gray-900">核定载重</dt><dd className="tabular-nums">12.5 吨</dd></div></dl><Separator /><dl className="grid grid-cols-2 gap-4 text-copy-14"><div><dt className="text-label-13 text-ds-gray-900">下次年检</dt><dd className="tabular-nums">2026-11-12</dd></div><div><dt className="text-label-13 text-ds-gray-900">GPS 设备号</dt><dd>—</dd></div></dl></CardContent></Card>

      - id: DETAIL.FLAT
        title_zh: 信息平铺
        statement_zh: 信息平铺直给，没有必要不折叠、不隐藏；强相关的内容靠近，弱相关的拉开；同类详情页用同样的结构和模块；页面 <title> 与 h1 写当前对象（「沪A·D2391 · 车辆」）。
        enforcement: { kind: review }

      - id: DETAIL.SEPARATORS
        title_zh: 分隔方式
        statement_zh: 组内用分割线，大段之间拉开间距或换一张卡片，一个主题一张卡片，最高一级用标签页（按版本、意图或阶段）。
        enforcement: { kind: review }

      - id: DETAIL.ACTIONS
        title_zh: 流程操作
        statement_zh: 审批单据类详情页的流程操作（通过、驳回、转交、加签、挂起、撤回）放在页面底部按钮区；通过与驳回同等样式（见 CONTRAST.PRIMARY_ACTION）；不可逆的操作走危险确认。
        enforcement: { kind: review }

  # ───────────────────────────── 体验管理 · 界面静帧 ─────────────────────────────
  - key: ui_stills
    title_zh: 界面静帧
    group: patterns.experience
    prefix: STILL
    summary_zh: 文档、功能卡片、空状态与引导里的产品静帧：像真产品、只给故事主角真实文字、裁切有意图、一个焦点、按展示尺寸设计、动画先定封面帧、用规范组件与图标。
    rules:
      - id: STILL.WHEN
        title_zh: 什么时候用静帧
        statement_zh: 要在文档配图、功能介绍卡片、空状态或新手引导里说明「产品长什么样、这里会发生什么」时，用规范组件搭一张产品静帧，不贴真实截图：截图很快过期、带着真实数据、换主题就不对。一张静帧只讲一件事。
        rationale_zh: 静帧和产品同源（同一套组件与 token），改版时跟着变；截图是一次性的。
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 组件搭出来的功能卡片
            jsx: |-
              <div className="relative h-[210px] w-[360px] overflow-hidden rounded-xl bg-ds-background-200">
                <div className="absolute left-6 top-6 w-[420px] rounded-xl border border-ds-gray-400 bg-ds-background-100 shadow-sm">
                  <div className="flex items-center gap-2 border-b border-ds-gray-400 px-4 py-3">
                    <span className="text-label-14 text-ds-gray-1000">部署</span>
                    <span className="h-2 w-16 rounded-full bg-ds-gray-200" />
                  </div>
                  <div className="border-b border-ds-gray-400 px-4 py-3"><span className="block h-2 w-[60%] rounded-full bg-ds-gray-200" /></div>
                  <div className="flex items-center gap-3 border-b border-ds-gray-400 bg-ds-gray-100 px-4 py-3">
                    <span className="text-label-14 text-ds-gray-1000">pomaster-web</span>
                    <span className="text-label-13 tabular-nums text-ds-gray-900">2 分钟前</span>
                    <Badge variant="outline">Ready</Badge>
                  </div>
                  <div className="px-4 py-3"><span className="block h-2 w-[45%] rounded-full bg-ds-gray-200" /></div>
                </div>
              </div>
          - kind: dont
            title_zh: 贴一张产品截图
            code: |-
              <img src="/screenshots/dashboard-2026-05.png" alt="仪表盘">
            lang: html

      - id: STILL.RESTRAINT
        title_zh: 只给故事主角真实文字
        statement_zh: 一张静帧里真实的字通常只有 3 到 7 处：标题、被操作的对象、输入的内容和结果；其余位置用占位条，占位条的宽度逐行变化。不要每行都塞真实文本和数字——细节越多越像拼凑的假图；视线落点上不放占位条。
        params:
          real_strings: { value: 3–7, source: SRC.STAGESHOW, label_zh: 真实文字处数 }
        enforcement: { kind: review }

      - id: STILL.FRAMING
        title_zh: 裁切与出血
        statement_zh: 裁到故事发生的那块区域，窗口从画面的一边或两边出血；窗口保持原本的比例，不压扁、不整体缩小塞进卡片再四周留等宽空白；页面本身已有底色时不再垫一块底板；画面里不留空着的角落。
        enforcement: { kind: review }

      - id: STILL.FOCAL
        title_zh: 一个焦点
        statement_zh: 每张静帧只有一个主角，最重的视觉（实色、字重、阴影）落在它身上；辅助对象（一张回执、一个小卡片）至多一个，压在主体边缘；不用描边光晕去「指」主角，用产品自己的选中态。
        enforcement: { kind: review }

      - id: STILL.SCALE
        title_zh: 按展示尺寸设计
        statement_zh: 按最终显示尺寸 1:1 设计：功能卡片约 400×300，侧栏插图更小；手机宽度的版本重新排布，只留动作和可读的字，不是整体缩小——缩小后的小字没人看得清。
        params:
          card: { value: 400×300, source: SRC.STAGESHOW, label_zh: 功能卡片尺寸 }
        enforcement: { kind: review }

      - id: STILL.POSTER
        title_zh: 动画先定封面帧
        statement_zh: 静帧做成小动画时，先定封面帧：缩略图、截图和减少动效模式都只看到这一帧，它要能单独讲完故事——结果留在画面上，不是变化途中的一帧；动画只演一件事，回到开头时要有看得见的原因（撤销、关闭）或在被遮住时复位。
        enforcement: { kind: review }

      - id: STILL.REAL_PARTS
        title_zh: 用规范组件与图标
        statement_zh: 静帧里的按钮、徽标、头像、输入框都用 src/components/ui 的组件，不手画；图标只用 lucide-react，同一尺寸、同一描边；不发明 logo（色块里放一个字母不是 logo）；AI 功能不用闪光、魔杖和紫色当装饰，直接展示它做了什么。
        enforcement: { kind: review }

  # ───────────────────────────── 体验管理 · 组件动效 ─────────────────────────────
  - key: component_motion
    title_zh: 组件动效
    group: patterns.experience
    prefix: CMOTION
    summary_zh: 动效只说明变化：每个动作有原因；出现和离开都有过渡；动关系而不只动对象；数字与文字就地变化；成组只在首次出现时错峰；可以打断；只动 transform 与透明度；减少动效时状态变化仍看得见。
    rules:
      - id: CMOTION.CAUSE
        title_zh: 每个动作有原因
        statement_zh: 动效由用户操作或数据变化触发，用来说明「刚才发生了什么」；不做自动循环的吸睛动画（呼吸灯、无限脉冲）；同一屏同一时刻只有一处在动。界面反馈和真实产品一样快，只有讲故事的演示动画才放慢。
        enforcement: { kind: review }
        examples:
          - kind: dont
            title_zh: 无限脉冲吸引注意
            code: |-
              .badge-new { animation: pulse 1.2s infinite; }
            lang: css

      - id: CMOTION.ENTER_EXIT
        title_zh: 出现与离开
        statement_zh: 会出现又消失的元素保持挂载，用状态切换显隐，让离开也有过渡；离开比出现快；面板打开时带着内容一起出现，不先出一块空白再填内容；不要「啪」地插入或消失。
        params:
          enter: { value: 200ms, source: SRC.POMASTER.PRESET, label_zh: 出现 }
          exit: { value: 150ms, source: SRC.TAILWIND.TRANSITIONS, label_zh: 离开 }
          ease: { value: "cubic-bezier(0.4, 0, 0.2, 1)", source: SRC.TAILWIND.TRANSITIONS, label_zh: 缓动 }
        enforcement: { kind: review }
        showcase:
          - kind: demo
            title_zh: 展开与收起：同一个按钮、内容一起出现
            description_zh: 点按钮：面板高度与透明度一起过渡，收起比展开快；按钮文字在同一个按钮上变化。
            jsx: |-
              <div className="w-[340px]">
                <Button size="small" variant="secondary" onClick={() => set({ open: !s.open })}>{s.open ? "收起筛选" : "展开筛选"}</Button>
                <div className="grid transition-[grid-template-rows,opacity]" style={{ gridTemplateRows: s.open ? "1fr" : "0fr", opacity: s.open ? 1 : 0, transitionDuration: s.open ? p.enter : p.exit, transitionTimingFunction: p.ease }}>
                  <div className="overflow-hidden">
                    <div className="flex gap-2 pt-3"><Input placeholder="项目名称" /><Input placeholder="分支" /></div>
                  </div>
                </div>
              </div>

      - id: CMOTION.RELATIONSHIP
        title_zh: 动关系而不只动对象
        statement_zh: 新增一行时，下面的行一起让位（新行的高度从 0 展开），不是新行凭空出现、其余行跳位；删除时先收起占位再移除；尺寸变化的容器不拉伸里面的文字（用网格行或高度过渡，不用 scale）；列表重排用位置过渡。
        params:
          duration: { value: 200ms, source: SRC.POMASTER.PRESET, label_zh: 让位时长 }
          ease: { value: "cubic-bezier(0.4, 0, 0.2, 1)", source: SRC.TAILWIND.TRANSITIONS, label_zh: 缓动 }
        enforcement: { kind: review }
        showcase:
          - kind: demo
            title_zh: 新增一行：其余行一起让位
            jsx: |-
              <div className="w-80">
                <Button size="small" onClick={() => set({ added: !s.added })}>{s.added ? "撤销新增" : "新增项目"}</Button>
                <div className="mt-3 overflow-hidden rounded-xl border border-ds-gray-400">
                  <div className="grid transition-[grid-template-rows]" style={{ gridTemplateRows: s.added ? "1fr" : "0fr", transitionDuration: p.duration, transitionTimingFunction: p.ease }}>
                    <div className="overflow-hidden"><div className="border-b border-ds-gray-400 bg-ds-gray-100 px-4 py-3 text-label-14">docs-site（新）</div></div>
                  </div>
                  {["pomaster-web", "pomaster-api", "studio"].map((name) => (
                    <div key={name} className="border-b border-ds-gray-400 px-4 py-3 text-label-14 last:border-b-0">{name}</div>
                  ))}
                </div>
              </div>

      - id: CMOTION.VALUE_CHANGE
        title_zh: 数字与文字就地变化
        statement_zh: 数值变化用数字滚动：只滚变化的位，货币符号与千分位不动，用等宽数字，最终值停住；状态词变化（排队中→运行中→已通过）在同一位置滚动或淡入淡出，并按最长的词预留宽度，邻居不跳；按钮文字变化发生在同一个按钮上，不换成另一个按钮。
        enforcement: { kind: review }
        showcase:
          - kind: demo
            title_zh: 数字滚动
            description_zh: 点按钮：金额只滚动变化的数位（NumberTicker，收录自 affectUI，MIT）。
            jsx: |-
              <div className="flex items-center gap-4">
                <NumberTicker value={s.total || 48240} format={{ style: "currency", currency: "CNY", maximumFractionDigits: 0 }} locale="zh-CN" className="text-heading-24" />
                <Button size="small" variant="secondary" onClick={() => set({ total: (s.total || 48240) + 1280 })}>记一笔 ¥1,280</Button>
              </div>

      - id: CMOTION.STAGGER
        title_zh: 成组错峰只在首次出现
        statement_zh: 只有一组元素首次一起出现时才错峰：按阅读顺序、间隔小、总时长有上限；刷新数据、翻页、筛选时整组一次出现，不逐行飞入；栅格卡片首次进入视口时可以错峰一次。
        params:
          interval: { value: 60, unit: ms, source: SRC.STAGESHOW, label_zh: 错峰间隔, note_zh: 同一组 40–80ms 取中；栅格的格与格之间可放宽到 80–120ms }
          total: { value: 400, unit: ms, source: SRC.POMASTER.DEFAULTS, label_zh: 总时长上限, note_zh: 一组错峰总长不超过 400ms，再长就像在等动画 }
        enforcement: { kind: review }
        examples:
          - kind: dont
            title_zh: 每次刷新逐行飞入
            code: |-
              .row { animation: fly-in .4s both; animation-delay: calc(var(--i) * 80ms); }
            lang: css

      - id: CMOTION.INTERRUPT
        title_zh: 可以打断
        statement_zh: 动画进行中用户再次操作，从当前状态反向或继续，不排队等上一段放完；动画期间控件保持可用；状态切换用 CSS transition（天然可打断），不用固定时长的关键帧动画表达状态。
        enforcement: { kind: review }

      - id: CMOTION.PERF
        title_zh: 只动 transform 与透明度
        statement_zh: 过渡只作用于 transform 和 opacity，高度展开用 grid-template-rows 过渡；不过渡 width、height、top、left、margin 这类触发重排的属性；will-change 只在动画期间加在动的那个元素上，不全局铺。
        enforcement: { kind: gate, check: motion.transform-only }
        examples:
          - kind: do
            title_zh: 位移与透明度
            code: |-
              .panel { transition: transform .2s, opacity .2s; }
            lang: css
          - kind: dont
            title_zh: 过渡布局属性
            code: |-
              .panel { transition: height .3s, top .3s; }
            lang: css

      - id: CMOTION.REDUCED
        title_zh: 减少动效时保留状态变化
        statement_zh: 减少动效模式下状态变化仍要看得见：淡入淡出或直接切换，去掉位移、缩放、视差和自动播放；数字滚动直接显示最终值；每段关键帧动画都写 prefers-reduced-motion 分支（全局降级见 MOTION.REDUCED）。
        anchors:
          - { spec: ui, quote: 尊重 prefers-reduced-motion：动画、滚动、过渡在减少动效模式下关闭或降级 }
        enforcement: { kind: gate, check: motion.reduced-motion }
        examples:
          - kind: do
            title_zh: 关键帧动画的降级分支
            code: |-
              @media (prefers-reduced-motion: reduce) {
                .ticker-col { animation: none; }
                .ticker-stack { transition: none; }
              }
            lang: css

  # ───────────────────────────── 体验管理 · Bento 栅格 ─────────────────────────────
  - key: bento_grid
    title_zh: Bento 栅格
    group: patterns.experience
    prefix: BENTO
    summary_zh: 一组格子拼成一张图：一个主角格；格子不全是界面截图，邻格类型交替；同一套外框；跨度取栅格整数；数字格一行写完；窄屏重新排；可点的格整格可点。
    rules:
      - id: BENTO.WHEN
        title_zh: 什么时候用
        statement_zh: 功能概览、首页看板入口、发布说明和特性墙用 Bento；表单、明细列表、需要逐项对比的数据不用 Bento，用表格、描述列表或卡片列表。
        enforcement: { kind: review }

      - id: BENTO.HERO
        title_zh: 一个主角格
        statement_zh: 一格最大（跨两列或两行），放最主要的信息或画面，其余格支撑它；格子大小相同时，内容和分量要有明显差别，不排成五块一样重的卡片。
        enforcement: { kind: review }
        showcase:
          - kind: demo
            title_zh: 主角格 + 数字格 + 组件格 + 一句话
            description_zh: 主角格跨两列并整格可点；数字格一行写完；组件格只截一个控件；一句话格用正文大字。
            jsx: |-
              <div className="grid w-[600px] grid-cols-3 gap-4">
                <a href="#" className="col-span-2 flex flex-col gap-3 rounded-xl border border-ds-gray-400 bg-ds-background-100 p-6 text-ds-gray-1000 no-underline outline-none transition-[border-color] duration-150 hover:border-ds-gray-500 focus-visible:ring-2 focus-visible:ring-ds-blue-700">
                  <span className="text-label-16 font-semibold">部署总览</span>
                  <div className="flex h-[72px] items-end gap-2">
                    {[32, 48, 40, 64, 56, 72].map((h) => <span key={h} className={h === 72 ? "flex-1 rounded-sm bg-ds-gray-1000" : "flex-1 rounded-sm bg-ds-gray-400"} style={{ height: h }} />)}
                  </div>
                </a>
                <div className="flex flex-col justify-center gap-1 rounded-xl bg-ds-background-200 p-6">
                  <span className="whitespace-nowrap text-heading-32 tabular-nums">99.99%</span>
                  <span className="text-label-13 text-ds-gray-900">过去 90 天可用率</span>
                </div>
                <div className="flex flex-col gap-3 rounded-xl border border-ds-gray-400 bg-ds-background-100 p-6">
                  <span className="text-label-14 font-medium">自动回滚</span>
                  <Switch defaultChecked aria-label="自动回滚" />
                </div>
                <div className="col-span-2 flex items-center rounded-xl bg-ds-background-200 p-6 text-copy-16">
                  <span><b>每次推送都有预览。</b><span className="text-ds-gray-900">评审人打开链接就能看到改动。</span></span>
                </div>
              </div>

      - id: BENTO.KINDS
        title_zh: 邻格类型交替
        statement_zh: 界面格（只截一个组件或一小块界面，不放整个窗口）约占三分之一到一半，其余是大数字、一句话、对象、示意图或一组标志；相邻的格类型不同；窗口外框在一组栅格里至多出现一次；同一段真实文字不在两格里重复。
        params:
          ui_share: { value: 1/3–1/2, source: SRC.STAGESHOW, label_zh: 界面格占比 }
        enforcement: { kind: review }

      - id: BENTO.FRAME
        title_zh: 同一套外框
        statement_zh: 所有格的圆角、格间距、内边距、文案位置一致（文案都在上或都在下）；格间距等于格内边距或其整数分之一；一组栅格只选一种家族：带间距的圆角格，或无间距、用细分割线分格。
        params:
          gap: { value: 16, unit: px, source: SRC.TAILWIND.SPACING, label_zh: 格间距（gap-4） }
          radius: { value: 12, unit: px, source: SRC.GEIST.MATERIALS, label_zh: 格圆角（rounded-xl） }
        enforcement: { kind: review }

      - id: BENTO.SPANS
        title_zh: 跨度取栅格整数
        statement_zh: 用 CSS grid 分格，列数取 12 列栅格的约数（常用 3 列，即每格 4/12），格子跨度是整数列（col-span-2）；行高用统一基准；不给格子手写像素宽度。
        enforcement: { kind: review }
        examples:
          - kind: dont
            title_zh: 手写像素宽度拼格子
            code: |-
              <div style={{ width: 412, float: "left" }}>…</div>
            lang: tsx

      - id: BENTO.STAT
        title_zh: 数字格一行写完
        statement_zh: "数字格是一个大数字加一句短标签，数字和单位不换行（white-space: nowrap）；用真实数字，不用「10x」「无限」这类填充；数字紧跟标签或撑满格子，不要钉在高格底部、上面留一大片空。"
        enforcement: { kind: review }

      - id: BENTO.RESPONSIVE
        title_zh: 窄屏重新排
        statement_zh: 每格都读得清时才保留两列；手机宽度变单列，主角格在最前；按内容决定断点，不整体等比缩小；窄格里的界面画面重新取景，而不是缩小。
        enforcement: { kind: review }

      - id: BENTO.CLICK
        title_zh: 可点的格整格可点
        statement_zh: 一格对应一个去处时整格就是一个链接（a 或 button 包住整格），焦点环画在格上；格内不再放第二个去同一处的按钮；悬停反馈按卡片悬停的规则。
        enforcement: { kind: review }

  # ───────────────────────────── 体验管理 · 状态反馈 ─────────────────────────────
  - key: state_feedback
    title_zh: 状态反馈
    group: patterns.experience
    prefix: SFB
    summary_zh: 每个数据视图都有完整的状态；反馈出现在动作发生的地方；确认的力度跟操作的分量走；乐观更新只用于可回滚的小操作；能撤销就不弹确认；长操作给进度；读屏能感知状态变化。
    rules:
      - id: SFB.STATES
        title_zh: 每个视图都有完整状态
        statement_zh: 每个数据视图都设计并实现这些状态：加载中、空、出错、部分成功、正常，以及无权限和禁用；每种状态在 Storybook 里都能单独看到。空状态给下一步动作，出错给原因和恢复入口。
        anchors:
          - { spec: page, quote: State Matrix：默认、加载、空、错误、权限、禁用、长文本和小屏等状态。 }
          - { spec: ui, quote: hover、active、focus、disabled、loading、empty、error 状态完整。 }
        enforcement: { kind: review }
        showcase:
          - kind: demo
            title_zh: 同一个视图的五种状态
            description_zh: 切换看每种状态：骨架保持内容的几何；空状态给动作；出错保留筛选并给重试；部分成功说清成功几条、失败的怎么办。
            jsx: |-
              <div className="w-[440px]">
                <div className="flex gap-1" role="group" aria-label="状态">
                  {["加载中", "空", "出错", "部分成功", "正常"].map((name) => (
                    <Button key={name} size="small" variant={(s.view || "加载中") === name ? "default" : "tertiary"} onClick={() => set({ view: name })}>{name}</Button>
                  ))}
                </div>
                <div className="mt-3 min-h-[200px]">
                  {(s.view || "加载中") === "加载中" && (
                    <div className="flex flex-col gap-2"><Skeleton className="h-5 w-1/2" /><Skeleton className="h-4 w-full" /><Skeleton className="h-4 w-4/5" /></div>
                  )}
                  {s.view === "空" && (
                    <div className="flex flex-col items-center gap-3 rounded-xl border border-dashed border-ds-gray-400 p-8 text-center">
                      <span className="text-label-14">还没有部署</span>
                      <span className="text-copy-13 text-ds-gray-900">推送到 main 分支后会自动部署。</span>
                      <Button size="small">导入项目</Button>
                    </div>
                  )}
                  {s.view === "出错" && (
                    <Alert variant="destructive"><AlertTitle>部署列表没有加载出来</AlertTitle><AlertDescription>网络中断，筛选条件已保留。<Button size="small" variant="secondary" className="mt-2">重试</Button></AlertDescription></Alert>
                  )}
                  {s.view === "部分成功" && (
                    <Alert><AlertTitle>120 个环境变量，导入了 117 个</AlertTitle><AlertDescription>3 个变量名重复，修改后可以只重新导入这 3 个。</AlertDescription></Alert>
                  )}
                  {s.view === "正常" && (
                    <div className="flex flex-col rounded-xl border border-ds-gray-400">
                      {["pomaster-web · Ready", "pomaster-api · Ready", "studio · Building"].map((item) => <div key={item} className="border-b border-ds-gray-400 px-4 py-3 text-label-14 last:border-b-0">{item}</div>)}
                    </div>
                  )}
                </div>
              </div>

      - id: SFB.IN_PLACE
        title_zh: 反馈出现在动作发生的地方
        statement_zh: 按钮自己进入加载并在原位给出结果；字段错误挂在字段上；行内操作的结果出现在那一行；不把所有结果都弹到页面顶部，也不用一个轻提示处理所有错误。
        anchors:
          - { spec: api, quote: MUST NOT 用一个 Toast 处理所有错误。 }
        enforcement: { kind: review }

      - id: SFB.WEIGHT
        title_zh: 确认的力度跟操作的分量走
        statement_zh: 轻操作（收藏、切换显示）就地变化，不弹提示；普通保存用 Toast 轻提示；会影响他人或不可逆的操作用结果页或带操作的 Toast；失败比成功更显眼，并且停留到用户处理。
        enforcement: { kind: review }

      - id: SFB.OPTIMISTIC
        title_zh: 乐观更新只用于可回滚的小操作
        statement_zh: 点赞、标星、拖动排序这类成功率高、可回滚、影响范围小的操作可以先改界面再发请求，失败时回滚并就地说明；金额、库存、审批、权限这类以服务端结果为准，等返回再更新。
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: useMutation 的 onMutate / onError 回滚
            code: |-
              useMutation({
                mutationFn: (starred: boolean) => api.star(id, starred),
                onMutate: async (starred) => { const prev = queryClient.getQueryData(key); queryClient.setQueryData(key, (old) => ({ ...old, starred })); return { prev } },
                onError: (_e, _v, ctx) => queryClient.setQueryData(key, ctx?.prev),
                onSettled: () => queryClient.invalidateQueries({ queryKey: key }),
              })
            lang: tsx

      - id: SFB.UNDO
        title_zh: 能撤销就不弹确认
        statement_zh: 可以撤销的删除、归档用「已删除 · 撤销」的提示代替二次确认；真正不可逆的操作才要确认，确认框说清后果（删掉什么、影响谁）。
        anchors:
          - { spec: page, quote: 删除、提交、转账等高风险动作必须提供复核、确认、撤销或等效防错 }
        enforcement: { kind: review }

      - id: SFB.PROGRESS
        title_zh: 长操作给进度
        statement_zh: 超过 1 秒的操作给加载反馈；预计超过 10 秒的给确定进度（百分比或步骤）和预计剩余时间，并允许离开当前页面：转为后台任务，完成后通知并能回到结果。
        params:
          busy: { value: 1000, unit: ms, source: SRC.NNG.RESPONSE_TIMES, label_zh: 需要加载反馈 }
          determinate: { value: 10000, unit: ms, source: SRC.NNG.RESPONSE_TIMES, label_zh: 需要确定进度 }
        anchors:
          - { spec: perf, quote: 长任务异步执行并可恢复。 }
        enforcement: { kind: review }

      - id: SFB.LIVE
        title_zh: 读屏能感知状态变化
        statement_zh: 异步结果和进度变化写进 aria-live 区（一般用 polite，阻断性错误用 assertive），不抢焦点；颜色不是唯一的信号，状态都有文字。
        anchors:
          - { spec: ui, quote: 动态状态、异步结果、进度变化必须可在不抢夺焦点的前提下被辅助技术识别 }
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 状态写进 live 区
            code: |-
              <div aria-live="polite" className="sr-only">{statusText}</div>
            lang: tsx

  # ───────────────────────────── 体验管理 · 上下文管理 ─────────────────────────────
  - key: context
    title_zh: 上下文管理
    group: patterns.experience
    prefix: CTX
    summary_zh: 保住用户的位置（分页、筛选、滚动、选中）；未保存的内容有去处；就地操作与工具栏一致；当前位置始终可见；切换团队或身份时显式清理；代码里的上下文只放稳定的跨层依赖。
    rules:
      - id: CTX.PRESERVE
        title_zh: 保住用户的位置
        statement_zh: 从列表进详情再返回，恢复原来的页码、筛选、排序、滚动位置和选中行（筛选与页码在 URL 里，滚动位置用路由的滚动恢复）；能在当前页完成的查看用侧边抽屉，不离开列表。
        anchors:
          - { spec: page, quote: 返回恢复分页、筛选、排序和必要视图状态。 }
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 路由层恢复滚动位置
            code: |-
              <ScrollRestoration getKey={(location) => location.pathname} />
            lang: tsx
        showcase:
          - kind: lab
            lab: context.restore
            title_zh: 实验：返回列表时恢复位置
            description_zh: 翻到第 3 页、选中一行、打开详情再返回：正确做法回到原来的页和那一行；错误做法回到第 1 页。

      - id: CTX.DRAFTS
        title_zh: 未保存的内容有去处
        statement_zh: 表单有改动时离开要提示（页内跳转和关闭页签都拦）；长表单自动保存草稿，草稿按用户隔离、带版本与过期时间，提交成功后清掉；失败的提交保留用户的输入。
        anchors:
          - { spec: page, quote: dirty 离开、草稿隔离和版本冲突有策略。 }
          - { spec: page, quote: 提交防重复并保留失败输入。 }
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 离开前拦截
            code: |-
              const blocker = useBlocker(form.formState.isDirty)
            lang: tsx

      - id: CTX.INLINE_ACTIONS
        title_zh: 就地操作与工具栏一致
        statement_zh: 行上的「更多」菜单、右键菜单里的操作与工具栏、详情页同名同图标；右键菜单只是快捷方式，不是唯一入口；批量操作出现在选中后的批量栏里，并显示选中了几条。
        enforcement: { kind: review }

      - id: CTX.WAYFINDING
        title_zh: 当前位置始终可见
        statement_zh: 页面标题、导航高亮、面包屑三者一致并与路由同源；每个可分享的视图有深链接，打开深链接得到同样的视图（含筛选与标签页）。
        anchors:
          - { spec: page, quote: 每个页面路由有稳定 name、path、page key、title、权限和布局 meta。 }
        enforcement: { kind: review }

      - id: CTX.SCOPE_SWITCH
        title_zh: 切换团队或身份时显式清理
        statement_zh: 团队、租户、环境的切换入口全局可见，当前作用域显示在顶部；切换后清掉旧作用域的查询缓存、草稿和订阅，回到新作用域下安全的页面，不把旧数据带到新作用域。
        anchors:
          - { spec: state, quote: 用户、角色、组织和数据范围切换时清理风险缓存。 }
        enforcement: { kind: review }

      - id: CTX.PROVIDER
        title_zh: 代码里的上下文只放稳定的跨层依赖
        statement_zh: React Context 只放跨多层、变化少的依赖（主题、当前团队、权限判断函数）；按关注点拆成多个 Context；Provider 的 value 用 useMemo 固定引用，避免整棵树重渲染；频繁变化的数据走 Zustand 选择器或查询缓存。
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 固定 value 引用
            code: |-
              const value = useMemo(() => ({ team, can }), [team, can])
              return <TeamContext.Provider value={value}>{children}</TeamContext.Provider>
            lang: tsx
          - kind: dont
            title_zh: 每次渲染新建 value
            code: |-
              <TeamContext.Provider value={{ team, can, filters, setFilters }}>
            lang: tsx

  # ───────────────────────────── 体验管理 · 侧边栏管理 ─────────────────────────────
  - key: sidebar
    title_zh: 侧边栏管理
    group: patterns.experience
    prefix: SIDEBAR
    summary_zh: 宽度取规范值；收起后只留图标并有名字；收起状态按用户记住；窄屏变抽屉；当前项与路由同源；最多两级；分组按使用频率；自己滚动、底部固定；键盘可操作。
    rules:
      - id: SIDEBAR.WIDTH
        title_zh: 宽度取规范值
        statement_zh: 侧边栏展开宽度 16rem、手机上的抽屉宽度 18rem（shadcn/ui Sidebar 的缺省值）；收起成图标栏的宽度由项目定；不按页面各自调宽度。
        params:
          width: { value: 16rem, source: SRC.SHADCN.SIDEBAR, label_zh: 展开宽度 }
          mobile_width: { value: 18rem, source: SRC.SHADCN.SIDEBAR, label_zh: 手机抽屉宽度 }
          collapsed_width: { value: 3rem, unit: none, source: SRC.SHADCN.SIDEBAR, label_zh: 收起宽度, note_zh: shadcn/ui 的 SIDEBAR_WIDTH_ICON }
        enforcement: { kind: review }
        showcase:
          - kind: demo
            title_zh: 收起与展开
            description_zh: 点按钮收起：只留图标，每项有名字；当前项保持高亮。
            jsx: |-
              <div className="flex h-[260px] w-[520px] overflow-hidden rounded-xl border border-ds-gray-400">
                <nav aria-label="主导航" className="flex shrink-0 flex-col gap-1 border-r border-ds-gray-400 bg-ds-background-200 p-2 transition-[width] duration-200" style={{ width: s.collapsed ? "3rem" : p.width }}>
                  <a href="#" title={s.collapsed ? "总览" : undefined} className="flex h-8 items-center gap-2 overflow-hidden whitespace-nowrap rounded-md px-2 text-label-14 text-ds-gray-900 no-underline hover:bg-ds-gray-100"><LayoutDashboardIcon className="size-4 shrink-0" />{!s.collapsed && "总览"}</a>
                  <a href="#" title={s.collapsed ? "部署" : undefined} aria-current="page" className="flex h-8 items-center gap-2 overflow-hidden whitespace-nowrap rounded-md bg-ds-gray-200 px-2 text-label-14 text-ds-gray-1000 no-underline"><RocketIcon className="size-4 shrink-0" />{!s.collapsed && "部署"}</a>
                  <a href="#" title={s.collapsed ? "设置" : undefined} className="flex h-8 items-center gap-2 overflow-hidden whitespace-nowrap rounded-md px-2 text-label-14 text-ds-gray-900 no-underline hover:bg-ds-gray-100"><SettingsIcon className="size-4 shrink-0" />{!s.collapsed && "设置"}</a>
                </nav>
                <div className="flex-1 bg-ds-background-100 p-4">
                  <Button size="small" variant="tertiary" svgOnly aria-label={s.collapsed ? "展开侧边栏" : "收起侧边栏"} onClick={() => set({ collapsed: !s.collapsed })}>
                    {s.collapsed ? <PanelLeftOpenIcon /> : <PanelLeftCloseIcon />}
                  </Button>
                </div>
              </div>

      - id: SIDEBAR.COLLAPSE
        title_zh: 收起与展开
        statement_zh: 收起后只留图标，每项有 title 或 tooltip 显示名字；收起状态按用户记住（shadcn/ui Sidebar 用 sidebar_state Cookie，项目可换成偏好存储）；手机宽度下变成抽屉，点遮罩或按 Esc 关闭。
        params:
          persist: { value: sidebar_state, source: SRC.SHADCN.SIDEBAR, label_zh: 记住收起状态的 Cookie }
        enforcement: { kind: review }

      - id: SIDEBAR.ACTIVE
        title_zh: 当前项与路由同源
        statement_zh: 高亮哪一项由当前路由决定，不另存一份「选中项」状态；刷新后保持；子页面高亮它所属的一级项，父级自动展开。
        anchors:
          - { spec: permission, quote: 菜单、路由、按钮、字段和接口使用同一权限语义。 }
        enforcement: { kind: review }

      - id: SIDEBAR.DEPTH
        title_zh: 最多两级
        statement_zh: 侧边栏最多两级；第三级用页内的标签页或二级导航，不在侧边栏里继续嵌套；只有一个子项的分组不展开，直接放这一项。
        enforcement: { kind: review }

      - id: SIDEBAR.GROUPS
        title_zh: 分组按使用频率
        statement_zh: 菜单按任务分组、按使用频率排序，最常用的在上；分组标题不可点、不当链接；无权限的菜单项不显示（不显示禁用的菜单项让人猜）。
        enforcement: { kind: review }

      - id: SIDEBAR.SCROLL
        title_zh: 自己滚动、底部固定
        statement_zh: 侧边栏独立滚动，不跟着内容区滚；账户、设置、帮助固定在底部；当前项在可视区外时自动滚到可见。
        enforcement: { kind: review }

      - id: SIDEBAR.KEYBOARD
        title_zh: 键盘可操作
        statement_zh: 收起/展开用 Cmd/Ctrl + B（shadcn/ui Sidebar 的缺省快捷键），按钮提示里写出；菜单可以用 Tab 进入、方向键移动；收起展开后焦点留在切换按钮上。
        params:
          shortcut: { value: Mod+B, source: SRC.SHADCN.SIDEBAR, label_zh: 收起快捷键 }
        enforcement: { kind: review }

  # ───────────────────────────── 体验管理 · 卡片悬停 ─────────────────────────────
  - key: card_hover
    title_zh: 卡片悬停
    group: patterns.experience
    prefix: HOVER
    summary_zh: 悬停只表示可点；幅度克制（边框或阴影升一级，不缩放）；不引起布局移动；键盘焦点的反馈不弱于悬停；触屏不依赖悬停；悬停才出现的操作不挤开内容；时长取 token。
    rules:
      - id: HOVER.SIGNAL
        title_zh: 悬停只表示可点
        statement_zh: 只有可点的卡片做悬停效果；不可点的卡片悬停没有任何变化，避免让人以为能点。
        enforcement: { kind: review }
        showcase:
          - kind: demo
            title_zh: 可点与不可点
            description_zh: 把指针移到两张卡片上对比；用 Tab 键聚焦可点的那张。
            jsx: |-
              <div className="flex gap-4">
                <a href="#" className="block w-[200px] rounded-xl border border-ds-gray-400 bg-ds-background-100 p-4 text-ds-gray-1000 no-underline outline-none transition-[border-color,box-shadow] duration-150 hover:border-ds-gray-500 hover:shadow-sm focus-visible:ring-2 focus-visible:ring-ds-blue-700">
                  <div className="text-label-14 font-medium">pomaster-web</div>
                  <div className="text-copy-13 text-ds-gray-900">可点：边框加深、阴影升一级</div>
                </a>
                <div className="w-[200px] rounded-xl border border-ds-gray-400 bg-ds-background-100 p-4">
                  <div className="text-label-14 font-medium">构建说明</div>
                  <div className="text-copy-13 text-ds-gray-900">不可点：没有悬停效果</div>
                </div>
              </div>

      - id: HOVER.SUBTLE
        title_zh: 幅度克制
        statement_zh: 悬停时边框加深一档（gray-400 → gray-500）或阴影升一级；位移不超过 1px，不缩放卡片、不放大内容。
        enforcement: { kind: review }

      - id: HOVER.NO_SHIFT
        title_zh: 不引起布局移动
        statement_zh: 悬停不改卡片尺寸、不改边框宽度、不显示会挤开内容的元素；需要强调时用阴影、outline 或改变边框颜色，宽度不变。
        enforcement: { kind: review }
        examples:
          - kind: dont
            title_zh: 悬停加粗边框，整排卡片抖动
            code: |-
              .card:hover { border-width: 2px; }
            lang: css
          - kind: do
            title_zh: 只换颜色或加阴影
            code: |-
              .card:hover { border-color: var(--border-strong); box-shadow: var(--shadow-1); }
            lang: css

      - id: HOVER.FOCUS_PARITY
        title_zh: 焦点反馈不弱于悬停
        statement_zh: 可点的卡片能用键盘聚焦（链接或按钮包住整卡，或 tabindex=0 并响应 Enter/空格）；:focus-visible 的反馈不弱于悬停，并且不被遮挡。
        anchors:
          - { spec: ui, quote: MUST NOT 移除焦点轮廓而无同等级可见替代。 }
        enforcement: { kind: review }

      - id: HOVER.TOUCH
        title_zh: 触屏不依赖悬停
        statement_zh: "悬停才显示的操作，在不支持悬停的设备上常显或放进「更多」菜单（用 @media (hover: hover) 区分）；关键信息不只放在悬停提示里。"
        anchors:
          - { spec: ui, quote: MUST NOT 仅通过颜色、hover 或 tooltip 传递关键信息。 }
        enforcement: { kind: review }

      - id: HOVER.REVEAL
        title_zh: 悬停出现的操作不挤开内容
        statement_zh: 行或卡片上悬停才出现的操作占位预留（透明度从 0 到 1，不从无到有插入），键盘聚焦到行内时同样出现；离开后收起。
        enforcement: { kind: review }
        showcase:
          - kind: demo
            title_zh: 悬停与聚焦都显示行操作
            description_zh: 指针移到行上或用 Tab 聚焦到行内按钮，操作出现；在触屏设备上常显。
            jsx: |-
              <div className="w-[360px] rounded-xl border border-ds-gray-400">
                {["pomaster-web", "pomaster-api"].map((name) => (
                  <div key={name} className="group flex items-center justify-between border-b border-ds-gray-400 px-4 py-2 last:border-b-0">
                    <span className="text-label-14">{name}</span>
                    <span className="flex gap-1 opacity-100 transition-opacity duration-150 [@media(hover:hover)]:opacity-0 [@media(hover:hover)]:group-hover:opacity-100 [@media(hover:hover)]:group-focus-within:opacity-100">
                      <Button size="small" variant="tertiary" svgOnly aria-label="编辑"><PencilIcon /></Button>
                      <Button size="small" variant="tertiary" svgOnly aria-label="更多"><EllipsisIcon /></Button>
                    </span>
                  </div>
                ))}
              </div>

      - id: HOVER.TIMING
        title_zh: 时长取 token
        statement_zh: 悬停过渡 150ms（Tailwind 缺省时长），离开同档；不额外加延迟（文字提示除外）。
        params:
          duration: { value: 150ms, source: SRC.TAILWIND.TRANSITIONS, label_zh: 悬停过渡 }
        enforcement: { kind: review }

  # ───────────────────────────── 体验管理 · 加载条 ─────────────────────────────
  - key: loading_bar
    title_zh: 加载条
    group: patterns.experience
    prefix: LBAR
    summary_zh: 选对加载形态；快的请求不显示加载条，出现后至少停留一会儿；不确定进度时缓慢推进、完成时补满；全局只有一条；有确切进度时显示百分比与剩余并能取消；读屏能感知。
    rules:
      - id: LBAR.KIND
        title_zh: 选对加载形态
        statement_zh: 页面切换用顶部细加载条；区块首次加载用骨架（保持内容的几何）；按钮触发的操作用按钮自己的加载态；有确切进度的（上传、导出、导入）用确定进度条；不用整页转圈遮住已有内容。
        anchors:
          - { spec: page, quote: 首屏骨架保持主要布局尺寸。 }
        enforcement: { kind: review }

      - id: LBAR.DELAY
        title_zh: 快的不显示，出现了停一会儿
        statement_zh: 请求在延迟阈值内完成就不显示加载条，避免一闪；一旦显示，至少停留最短时长再淡出；两个值全局统一，在 HTTP 客户端或路由层实现，页面不各自写。
        params:
          delay: { value: 200, unit: ms, source: SRC.NNG.RESPONSE_TIMES, label_zh: 出现延迟, note_zh: 0.1 秒以内感觉即时；200ms 内返回的请求不出加载条，避免闪一下 }
          min_visible: { value: 400, unit: ms, source: SRC.POMASTER.DEFAULTS, label_zh: 最短停留, note_zh: 出现了就至少停 400ms，避免一闪而过（与加载延迟实验一致） }
        enforcement: { kind: review }
        showcase:
          - kind: lab
            lab: loading.delay
            title_zh: 实验：加载条的延迟出现与最短停留
            description_zh: 分别发一个快请求和一个慢请求：快的不出现加载条；慢的出现后至少停留一会儿再收起。打开「错误做法」看快请求让加载条一闪而过。

      - id: LBAR.TRICKLE
        title_zh: 不确定进度时缓慢推进
        statement_zh: 不知道总量时，加载条先快后慢地推进但停在 100% 之前；完成时补满并淡出；失败时也要收起，并在出错的位置给反馈。
        enforcement: { kind: review }

      - id: LBAR.SINGLE
        title_zh: 全局只有一条
        statement_zh: 页面级加载条全局只有一个，用计数管理：每个请求开始加一、结束减一，归零才收起；并发请求不各自起一条，也不互相提前收起。
        anchors:
          - { spec: api, quote: SHOULD 让 loading 来源唯一，避免重复状态。 }
        enforcement: { kind: review }

      - id: LBAR.DETERMINATE
        title_zh: 确定进度显示百分比与剩余
        statement_zh: 上传、导出、导入这类有确切进度的操作显示百分比和预计剩余时间，可以取消；超过 10 秒的转后台任务并在完成时通知（见 SFB.PROGRESS）。
        enforcement: { kind: review }
        showcase:
          - kind: demo
            title_zh: 确定进度：百分比、剩余时间、可取消
            jsx: |-
              <div className="flex w-[360px] flex-col gap-2">
                <div className="flex justify-between text-label-14"><span>上传构建产物</span><span className="tabular-nums text-ds-gray-900">约 20 秒</span></div>
                <Progress value={64} aria-label="上传构建产物" className="h-2" />
                <div><Button size="small" variant="secondary">取消上传</Button></div>
              </div>

      - id: LBAR.A11Y
        title_zh: 读屏能感知
        statement_zh: 进度条带 role=progressbar 与 aria-valuenow（不确定进度时不写 valuenow，所在区域标 aria-busy）；完成和失败写进 aria-live 区。
        enforcement: { kind: review }

  # ───────────────────────────── 数据呈现 · 数据网格 ─────────────────────────────
  - key: data_grid
    title_zh: 数据网格
    group: patterns.data
    prefix: DGRID
    summary_zh: 先分清表格与数据网格；列的对齐、冻结与宽度有规则；排序筛选在服务端并进 URL；跨页选择说清范围；大数据虚拟滚动；行内编辑可撤回；密度三档按用户记住；空与加载保持列结构。
    rules:
      - id: DGRID.WHEN
        title_zh: 表格还是数据网格
        statement_zh: 只读、列不多、一屏看得完的列表用普通表格；需要列配置、冻结列、行内编辑、海量数据滚动、键盘逐格移动的用数据网格；同一个产品里数据网格只用一种实现。
        params:
          grid_library: { decision: 数据网格用哪个实现？, candidates: [TanStack Table + TanStack Virtual, AG Grid], label_zh: 数据网格实现 }
        enforcement: { kind: review }

      - id: DGRID.COLUMNS
        title_zh: 列的对齐、冻结与宽度
        statement_zh: 文本左对齐，数字和金额右对齐并用等宽数字，日期统一格式；首列（标识列）冻结在左、操作列冻结在右；列宽有最小值，内容超出时省略并能看全文；用户调整的列宽、顺序、显示的列按用户记住。
        anchors:
          - { spec: ui, quote: 表格、图表、弹层、焦点和状态随主题同步。 }
        enforcement: { kind: review }
        showcase:
          - kind: demo
            title_zh: 冻结首列与操作列，数字右对齐
            description_zh: 横向滚动时首列与操作列保持可见；金额列右对齐、等宽数字。
            jsx: |-
              <div className="w-[560px] overflow-x-auto rounded-xl border border-ds-gray-400">
                <Table className="min-w-[680px]">
                  <TableHeader>
                    <TableRow>
                      <TableHead className="sticky left-0 border-r border-ds-gray-400 bg-ds-background-100">项目</TableHead>
                      <TableHead>环境</TableHead>
                      <TableHead className="text-right">构建（秒）</TableHead>
                      <TableHead className="text-right">请求（24 小时）</TableHead>
                      <TableHead>状态</TableHead>
                      <TableHead className="sticky right-0 border-l border-ds-gray-400 bg-ds-background-100"><span className="sr-only">操作</span></TableHead>
                    </TableRow>
                  </TableHeader>
                  <TableBody>
                    {[["pomaster-web", "生产", "48.2", "1,204,511", "Ready"], ["pomaster-api", "预览", "112.9", "86,240", "Building"], ["studio", "生产", "31.0", "9,812", "Error"]].map(([name, env, build, req, status]) => (
                      <TableRow key={name}>
                        <TableCell className="sticky left-0 border-r border-ds-gray-400 bg-ds-background-100 font-medium">{name}</TableCell>
                        <TableCell>{env}</TableCell>
                        <TableCell className="text-right tabular-nums">{build}</TableCell>
                        <TableCell className="text-right tabular-nums">{req}</TableCell>
                        <TableCell><Badge variant={status === "Error" ? "destructive" : "outline"}>{status}</Badge></TableCell>
                        <TableCell className="sticky right-0 border-l border-ds-gray-400 bg-ds-background-100"><Button size="small" variant="tertiary">查看</Button></TableCell>
                      </TableRow>
                    ))}
                  </TableBody>
                </Table>
              </div>

      - id: DGRID.SORT_FILTER
        title_zh: 排序与筛选在服务端并进 URL
        statement_zh: 数据量超过一页时排序和筛选由服务端完成；当前排序的列有标识、可以取消；筛选条件、排序、页码进 URL，刷新和分享后恢复；表头的列筛选与筛选条共享同一套条件。
        anchors:
          - { spec: perf, quote: 大列表服务端分页，宽表虚拟化。 }
          - { spec: state, quote: 可分享和可恢复状态进入 URL。 }
        enforcement: { kind: review }

      - id: DGRID.SELECTION
        title_zh: 跨页选择说清范围
        statement_zh: 勾选只作用于本页时写明「已选本页 N 条」；需要选中全部结果时给「选择全部 M 条」的明确入口，批量操作按筛选条件在服务端执行，不在前端拉全量；翻页、筛选变化后说清选择是否保留。
        enforcement: { kind: review }

      - id: DGRID.VIRTUAL
        title_zh: 大数据虚拟滚动
        statement_zh: 行数超过阈值时启用虚拟滚动，行高固定，表头与冻结列保持；不一次渲染全部行；滚动时不做重计算。
        params:
          virtual_threshold: { value: 500, unit: count, source: SRC.POMASTER.DEFAULTS, label_zh: 虚拟滚动阈值, note_zh: 500 行以内整表渲染的成本可以接受，超过再上虚拟滚动 }
        anchors:
          - { spec: perf, quote: 面对大数据必须虚拟滚动或分页 }
        enforcement: { kind: review }

      - id: DGRID.EDIT
        title_zh: 行内编辑可撤回
        statement_zh: 单元格就地编辑：Enter 提交、Esc 取消、Tab 到下一格；校验错误挂在单元格上并能定位；保存失败回滚到原值并说明原因；有未保存的修改时离开要提示；批量粘贴先校验再提交。
        anchors:
          - { spec: api, quote: Field Error：可定位到字段/单元格的错误。 }
        enforcement: { kind: review }

      - id: DGRID.DENSITY
        title_zh: 密度三档按用户记住
        statement_zh: 紧凑、默认、宽松三档（行高 32 / 40 / 48px，与按钮尺寸对齐），默认取中档，用户的选择按用户记住；同一页的多个表格用同一档。
        enforcement: { kind: review }

      - id: DGRID.EMPTY_LOADING
        title_zh: 空与加载保持列结构
        statement_zh: 首次加载显示与真实行同高的骨架行，表头和列宽不变；重新查询时保留旧数据并标出「更新中」，不清空闪烁；空结果在表格内给原因和下一步（清除筛选、新建）。
        anchors:
          - { spec: state, quote: SHOULD 在后台刷新时保留可用旧数据并标识 stale。 }
        enforcement: { kind: review }

  # ───────────────────────────── 数据呈现 · 图表 ─────────────────────────────
  - key: charts
    title_zh: 图表
    group: patterns.data
    prefix: CHART
    summary_zh: 图表库全项目一个；按问题选图；配色取 token、不只靠颜色区分；坐标轴与单位写清，柱状图从 0 开始；提示给精确值与口径；空、加载、出错与列表一致；提供数据表替代；大数据降采样；随容器重绘、卸载时销毁。
    rules:
      - id: CHART.LIBRARY
        title_zh: 图表库全项目一个
        statement_zh: 全项目只用一个图表库，经一个封装层（主题、空与出错态、尺寸监听、销毁）使用；图表库按需引入，不在应用入口同步加载。
        params:
          library: { decision: 图表用哪个库？, candidates: [Recharts, visx, ECharts（按需引入）], label_zh: 图表库 }
        anchors:
          - { spec: perf, quote: 路由、图表和重组件按需加载。 }
        enforcement: { kind: review }

      - id: CHART.CHOOSE
        title_zh: 按问题选图
        statement_zh: 先问图要回答什么：随时间的趋势用折线，类别之间比较用柱，构成用堆叠柱（饼图只在 5 类以内、强调占比时用），分布用直方图或箱线图，两个量的关系用散点；一张图只回答一个问题；需要精确值时直接给表格。
        params:
          pie_max: { value: 5, unit: count, source: SRC.POMASTER.PRESET, label_zh: 饼图最多类别 }
        enforcement: { kind: review }

      - id: CHART.COLOR
        title_zh: 配色取 token、不只靠颜色
        statement_zh: 分类色取规范色板的顺序，系列数有上限，超出合并为「其他」；连续值用单色深浅，正负对比用发散色；状态色只表示状态；不只靠颜色区分系列（加图例、直接标注或线型），对比度满足要求。
        anchors:
          - { spec: ui, quote: 颜色不得作为唯一信息来源 }
        enforcement: { kind: review }

      - id: CHART.AXES
        title_zh: 坐标轴与单位写清
        statement_zh: 柱状图纵轴从 0 开始，折线图可以截断但要标明；单位写在轴标题或图注里；刻度 4 到 6 个，数字格式与数据格式规范一致（千分位、单位缩写）；时间轴按时间等距，不按数据点等距。
        enforcement: { kind: review }
        examples:
          - kind: dont
            title_zh: 柱状图纵轴从 40 开始，差距被放大
            code: |-
              <YAxis domain={[40, 'auto']} />
            lang: tsx
        showcase:
          - kind: demo
            title_zh: 纵轴从 0 开始、单位写在图注
            jsx: |-
              <figure className="m-0">
                <svg width="220" height="150" role="img" aria-label="近 4 周部署次数：42、56、48、71">
                  <line x1="36" y1="120" x2="210" y2="120" className="stroke-ds-gray-400" />
                  <line x1="36" y1="60" x2="210" y2="60" className="stroke-ds-gray-200" />
                  <text x="30" y="124" textAnchor="end" className="fill-ds-gray-900 text-[11px]">0</text>
                  <text x="30" y="64" textAnchor="end" className="fill-ds-gray-900 text-[11px]">40</text>
                  {[42, 56, 48, 71].map((v, i) => <rect key={i} x={48 + i * 42} y={120 - v * 1.5} width={26} height={v * 1.5} rx={4} className={i === 3 ? "fill-ds-gray-1000" : "fill-ds-gray-500"} />)}
                  {["W1", "W2", "W3", "W4"].map((w, i) => <text key={w} x={61 + i * 42} y={138} textAnchor="middle" className="fill-ds-gray-900 text-[11px]">{w}</text>)}
                </svg>
                <figcaption className="text-copy-13 text-ds-gray-900">部署次数，纵轴从 0 开始</figcaption>
              </figure>

      - id: CHART.TOOLTIP
        title_zh: 提示给精确值与口径
        statement_zh: 悬停显示该点的精确值、单位和口径说明，多系列时同一时刻的值放在一个提示里；图例可点击切换系列；触屏上点按显示提示；关键结论不只放在提示里。
        enforcement: { kind: review }

      - id: CHART.STATES
        title_zh: 空、加载、出错与列表一致
        statement_zh: 图表区域在加载、空、出错时保持尺寸不变：加载用骨架，空数据说明原因（时间范围内没有数据），出错给重试；不渲染一张空坐标轴冒充「没有数据」。
        anchors:
          - { spec: ui, quote: MUST NOT 只处理页面背景而遗漏 portal/图表。 }
        enforcement: { kind: review }

      - id: CHART.A11Y
        title_zh: 提供数据表替代
        statement_zh: 每张图有一句话的文字摘要（aria-label 或图注），并能切换到数据表视图或下载数据；颜色之外还有文字或图形区分。
        anchors:
          - { spec: ui, quote: SHOULD 为复杂图表、媒体提供数据表格、长描述或音频描述。 }
        enforcement: { kind: review }

      - id: CHART.PERF
        title_zh: 大数据降采样
        statement_zh: 点数超过阈值时先在服务端聚合或降采样；大量点用 canvas 渲染；聚合计算不放在主线程的渲染路径里；实时图表合并更新、按帧刷新。
        params:
          max_points: { value: 2000, unit: count, source: SRC.POMASTER.DEFAULTS, label_zh: 单系列点数上限, note_zh: 单系列超过 2000 点先降采样或聚合再画 }
        enforcement: { kind: review }

      - id: CHART.LIFECYCLE
        title_zh: 随容器重绘、卸载时销毁
        statement_zh: 图表跟随容器尺寸重绘（ResponsiveContainer 或 ResizeObserver，加防抖）；组件卸载时销毁实例并解除监听；主题切换时重新应用主题。
        anchors:
          - { spec: state, quote: 状态拥有的监听器、计时器、观察器、请求、流、连接、Worker 和对象 URL 必须声明释放时机，并在卸载、身份切换或能力关闭时清理。 }
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 清理函数里销毁
            code: |-
              useEffect(() => { const ro = new ResizeObserver(resize); ro.observe(el); return () => { ro.disconnect(); chart.destroy() } }, [])
            lang: tsx

  # ───────────────────────────── 数据呈现 · 报表 ─────────────────────────────
  - key: reports
    title_zh: 报表
    group: patterns.data
    prefix: REPORT
    summary_zh: 报表结构固定（标题与口径、筛选、指标、明细）；口径与数据截至时间写清；筛选与对比期进 URL；合计与小计规则明确；数字格式统一；导出与页面同口径并受权限控制；打印有专门样式；大报表服务端聚合。
    rules:
      - id: REPORT.STRUCTURE
        title_zh: 报表结构固定
        statement_zh: 从上到下：报表名称与数据截至时间、筛选与对比、关键指标、图表、明细表；每块都能单独加载和出错；同类报表结构一致，用户换一张报表不用重新学。
        enforcement: { kind: review }
        showcase:
          - kind: demo
            title_zh: 标题与截至时间、筛选、指标、带合计的明细
            jsx: |-
              <div className="flex w-[600px] flex-col gap-4">
                <div className="flex items-baseline justify-between">
                  <h3 className="text-heading-20">用量月报</h3>
                  <span className="text-label-13 text-ds-gray-900">数据截至 2026-11-05 24:00（UTC+8）</span>
                </div>
                <div className="grid grid-cols-3 gap-4">
                  {[["请求", "1,204,511"], ["带宽", "48.2 GB"], ["错误率", "0.03%"]].map(([label, value]) => (
                    <div key={label} className="rounded-xl border border-ds-gray-400 p-4"><div className="text-label-13 text-ds-gray-900">{label}</div><div className="text-heading-24 tabular-nums">{value}</div></div>
                  ))}
                </div>
                <div className="overflow-hidden rounded-xl border border-ds-gray-400">
                  <Table>
                    <TableHeader><TableRow><TableHead>项目</TableHead><TableHead className="text-right">请求</TableHead><TableHead className="text-right">带宽（GB）</TableHead></TableRow></TableHeader>
                    <TableBody>
                      <TableRow><TableCell>pomaster-web</TableCell><TableCell className="text-right tabular-nums">1,118,271</TableCell><TableCell className="text-right tabular-nums">41.9</TableCell></TableRow>
                      <TableRow><TableCell>studio</TableCell><TableCell className="text-right tabular-nums">86,240</TableCell><TableCell className="text-right tabular-nums">6.3</TableCell></TableRow>
                    </TableBody>
                    <TableFooter><TableRow><TableCell>合计</TableCell><TableCell className="text-right tabular-nums">1,204,511</TableCell><TableCell className="text-right tabular-nums">48.2</TableCell></TableRow></TableFooter>
                  </Table>
                </div>
              </div>

      - id: REPORT.DEFINITIONS
        title_zh: 口径与截至时间写清
        statement_zh: 每个指标都有口径说明（悬停或「口径」入口）：计算公式、包含与排除、统计时区；页面显示数据截至时间和数据延迟；口径变化时标出变化点，不把新旧口径的数据画成一条线。
        enforcement: { kind: review }

      - id: REPORT.FILTERS
        title_zh: 筛选与对比期进 URL
        statement_zh: 时间范围、维度筛选、对比期（环比、同比）进 URL，可分享可恢复；默认时间范围固定且写明；对比结果同时给绝对值和变化率。
        anchors:
          - { spec: state, quote: 可分享和可恢复状态进入 URL。 }
        enforcement: { kind: review }

      - id: REPORT.TOTALS
        title_zh: 合计与小计规则明确
        statement_zh: 合计行固定在明细底部（或顶部，全项目一致）；比率类指标的合计按分子分母重新计算，不对各行百分比求和或求平均；不同单位的值不相加；分组小计与总计的口径一致。
        enforcement: { kind: review }

      - id: REPORT.NUMBERS
        title_zh: 数字格式统一
        statement_zh: 金额、数量、比率按数据格式规范输出：千分位、固定小数位、单位写在表头或指标名里、负数格式统一；空值显示「—」，和 0 区分开；数字右对齐、用等宽数字。
        enforcement: { kind: gate, check: format.no-local-pattern }

      - id: REPORT.EXPORT
        title_zh: 导出与页面同口径并受权限控制
        statement_zh: 导出的数据与页面使用同一组筛选和口径，文件名带报表名与时间范围；大数据量导出走后台任务，给进度并在完成时通知；导出受权限控制并按规则脱敏，导出操作留审计。
        anchors:
          - { spec: security, quote: MUST 对复制、导出、打印功能实施权限控制与脱敏策略；高敏感字段导出需审计与额外授权。 }
        enforcement: { kind: review }

      - id: REPORT.PRINT
        title_zh: 打印有专门样式
        statement_zh: 需要打印的报表提供打印样式：去掉导航与交互控件，表头在每页重复，行不被分页截断，打印页脚写明报表名、筛选条件与截至时间。
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 打印样式
            code: |-
              @media print {
                nav, .toolbar { display: none; }
                thead { display: table-header-group; }
                tr { break-inside: avoid; }
              }
            lang: css

      - id: REPORT.PERF
        title_zh: 大报表服务端聚合
        statement_zh: 聚合在服务端完成，前端只拿结果；明细分页或懒加载；同一报表的多个区块并行请求；结果可以缓存，页面显示缓存的生成时间并能手动刷新。
        anchors:
          - { spec: perf, quote: MUST NOT 串行发起可并行的页面初始化请求（须并行或后端聚合）。 }
        enforcement: { kind: review }

  # ───────────────────────────── 工程规范 · 前端架构 ─────────────────────────────
  - key: architecture
    title_zh: 前端架构
    group: engineering
    prefix: ARCH
    summary_zh: 技术栈以项目基线为准：React + TypeScript + Vite、shadcn/ui + Tailwind CSS 4、TanStack Query、Zustand、react-hook-form + zod；目录按职责分层，模块只经公开入口互相引用；函数组件 + hooks；组件源码进项目由项目维护；接口客户端由 OpenAPI 生成；表单、路由、类型与测试各有固定做法。
    rules:
      - id: ARCH.STACK
        title_zh: 技术栈以基线为准，同类库只用一套
        statement_zh: 框架与配套以项目技术基线（.pomaster/baseline/frontend/stack.yaml）为准：React + TypeScript + Vite（管理端是单页应用，除非基线另有决定，不上服务端渲染框架），组件 shadcn/ui（Radix）+ Tailwind CSS 4 + lucide-react，接口数据 @tanstack/react-query，全局状态 Zustand，表单 react-hook-form + zod，单元测试 Vitest。路由库由项目在基线里选定（见参数）；同一类能力（请求、日期、表单校验、图表）全项目只用一套。
        params:
          router: { decision: 路由库用哪一个？, candidates: [react-router, tanstack-router], unit: none, label_zh: 路由库 }
        anchors:
          - { spec: react, quote: 必须固定并记录 react、react-dom、路由库（React Router 或 TanStack Router，二选一）、服务端状态库（@tanstack/react-query）与 TypeScript 工具链的版本位与来源；版本位经实抓核实，不得沿用旧主版本记忆。 }
        enforcement: { kind: review }

      - id: ARCH.LAYOUT
        title_zh: 目录按职责分层
        statement_zh: src 下按职责分目录：api/（由 OpenAPI 生成的接口客户端与查询 hooks）、routes/<模块>/（路由页面与 loader）、features/<模块>/（模块内的组件、hooks、表单）、components/ui/（shadcn 组件源码）、components/（跨模块、与业务无关的组件）、hooks/、stores/（Zustand，一个 store 一个文件）、lib/（cn、格式化等工具）、locales/、styles/。每个顶层目录在 README 里写清职责；不新建没有说明的顶层目录。
        anchors:
          - { spec: arch, quote: 顶层目录和模块职责必须文档化。 }
          - { spec: arch, quote: MUST NOT 新建无职责说明的顶层目录。 }
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 目录
            code: |-
              src/
                api/                 # 生成的接口客户端 + useXxxQuery
                routes/vehicle/      # list.tsx、loader.ts
                features/vehicle/    # VehicleEditDialog.tsx、useVehicleForm.ts
                components/ui/       # shadcn 组件源码（项目维护）
                components/  hooks/  stores/  lib/  locales/  styles/
            lang: text

      - id: ARCH.BOUNDARY
        title_zh: 模块只经公开入口互相引用
        statement_zh: 业务模块之间只经模块的公开入口（features/<模块>/index.ts 导出）引用，不引用别的模块内部的文件，路由页面之间不互相 import；几个模块共同参与的流程放到单独的编排模块；带业务语义的组件不下沉到 components/ 或 components/ui/；循环依赖由 lint 检查并阻止。
        anchors:
          - { spec: arch, quote: 模块外部只能通过 Public API 引用。 }
          - { spec: arch, quote: MUST NOT 因方便把业务能力放进 shared。 }
          - { spec: arch, quote: 循环依赖必须被工具检测并阻止。 }
        enforcement: { kind: review }
        examples:
          - kind: dont
            title_zh: 引用别的模块内部文件
            code: |-
              import { formatPlate } from '@/features/vehicle/lib/plate'
            lang: ts
          - kind: do
            title_zh: 经公开入口
            code: |-
              import { formatPlate } from '@/features/vehicle'
            lang: ts

      - id: ARCH.COMPONENT
        title_zh: 组件写法
        statement_zh: 组件写成函数组件 + hooks，不写 class 组件；props 用 TypeScript 类型声明；可复用的有状态逻辑抽成自定义 hook（useXxx），hooks 只在组件顶层调用、依赖数组写全（eslint-plugin-react-hooks 检查）；路由组件负责取数据，展示组件只收 props、通过回调把事件交出去；不在 useEffect 里同步派生状态，能在渲染时算的直接算。
        anchors:
          - { spec: react, quote: hooks 只在组件或自定义 hook 的顶层调用，不放进条件、循环和回调；依赖数组写全，由 eslint-plugin-react-hooks 的规则检查，不关闭规则来掩盖问题。 }
        enforcement: { kind: review }
        examples:
          - kind: dont
            title_zh: 用 effect 同步派生值
            code: |-
              const [total, setTotal] = useState(0)
              useEffect(() => { setTotal(rows.reduce((sum, row) => sum + row.cost, 0)) }, [rows])
            lang: tsx
          - kind: do
            title_zh: 渲染时直接算
            code: |-
              const total = rows.reduce((sum, row) => sum + row.cost, 0)
            lang: tsx

      - id: ARCH.UI_LIBRARY
        title_zh: 组件库怎么用、怎么改
        statement_zh: shadcn/ui 组件用它的 CLI 拷进 components/ui/，源码归项目维护：改外观改组件文件里的类，调用处只追加布局类，不整套覆盖；颜色、字号只用 Geist 主题变量与排版类；组件依赖 Radix 的放在 Radix 上，不自己重写焦点和键盘逻辑；升级时对照上游变更手工合并。
        anchors:
          - { spec: arch, quote: MUST NOT 因方便把业务能力放进 shared。 }
        enforcement: { kind: review }

      - id: ARCH.DATA_LAYER
        title_zh: 接口请求层
        statement_zh: 接口客户端由 OpenAPI 生成（类型同源）；每个资源一组 useQuery / useMutation hooks（useVehicleList、useUpdateVehicle，基于 @tanstack/react-query），组件只调这些 hooks，不直接调 fetch；进入路由前需要的数据在 loader 里用 queryClient.ensureQueryData 预取，组件里再用同一个 key 读；鉴权、CSRF、超时、错误归一在 HTTP 客户端统一处理（见 SEC.CSRF、ROBUST.TIMEOUT、ERRH.NORMALIZE）。
        anchors:
          - { spec: state, quote: server state 由查询缓存层管理。 }
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 资源的查询 hook
            code: |-
              export function useVehicleList(params: VehicleQuery) {
                return useQuery({ queryKey: ['vehicles', params], queryFn: ({ signal }) => api.listVehicles(params, { signal }) })
              }
            lang: ts

      - id: ARCH.FORMS
        title_zh: 表单
        statement_zh: 表单用 react-hook-form + zod（zodResolver），schema 与接口类型同源，defaultValues 从接口数据转换而来、不直接用 DTO；字段与 Label 用 id 关联，错误用 aria-describedby 关联；提交返回 422 时用 setError 把字段错误挂回对应字段；isDirty、isSubmitting 留在表单里，不进全局 store。
        anchors:
          - { spec: state, quote: 表单区分 initial、current、dirty、errors、submitting 和 conflict。 }
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: schema 驱动的表单
            code: |-
              const schema = z.object({ plate: z.string().regex(/^[\u4e00-\u9fa5][A-Z][A-Z0-9]{5,6}$/, '车牌号为 7–8 位，如沪A12345') })
              const form = useForm({ resolver: zodResolver(schema), defaultValues: toFormValues(vehicle) })
            lang: tsx

      - id: ARCH.ROUTING
        title_zh: 路由组织
        statement_zh: 路由集中定义（路由配置对象或文件路由，全项目选一种），按模块分组；每个路由懒加载，在 handle（或路由上下文）里声明访问要求与布局（见 GUARD.DECLARE）；数据在 loader 里预取，出错由路由的错误元素承接（见 ERRH.BOUNDARY）；列表的筛选与分页进搜索参数（见 STATE.URL）。
        anchors:
          - { spec: page, quote: 每个页面路由有稳定 name、path、page key、title、权限和布局 meta。 }
        enforcement: { kind: review }

      - id: ARCH.TYPES
        title_zh: 类型严格、接口类型生成
        statement_zh: TypeScript 开 strict，类型检查用 tsc --noEmit 进 CI；接口类型从 OpenAPI 生成，不手写重复的 DTO 类型；组件 props 用 type 声明，不用 React.FC；不用 any 逃逸，确实不知道类型时用 unknown 再收窄。
        anchors:
          - { spec: toolchain, quote: TypeScript 项目必须启用与代码库兼容的严格类型检查；暂不能启用的严格选项必须有范围、Owner、迁移计划和期限。 }
          - { spec: toolchain, quote: MUST NOT 用项目级忽略、`any`、类型断言或关闭规则掩盖局部问题；例外必须最小化并可追踪。 }
        enforcement: { kind: review }

      - id: ARCH.TESTING
        title_zh: 测试分层
        statement_zh: hooks、store 和关键组件用 Vitest + Testing Library 测，按用户看得到的角色和文字找元素（getByRole、getByLabelText），不测实现细节；关键业务流程用 Playwright 端到端测；接口用 MSW 按 OpenAPI 模拟加载、空、出错、部分成功、正常五种状态。
        anchors:
          - { spec: testing, quote: Contract Mock：由正式 schema 生成或校验的 Mock。 }
        enforcement: { kind: review }

  # ───────────────────────────── 工程规范 · 状态管理 ─────────────────────────────
  - key: state
    title_zh: 状态管理
    group: engineering
    prefix: STATE
    summary_zh: 每份状态先定属主再定存放处：服务端数据进 TanStack Query，跨页稳定状态进 Zustand，可分享的视图状态进 URL，表单用表单模型。
    rules:
      - id: STATE.OWNERSHIP
        title_zh: 状态放哪
        statement_zh: 每份状态都说清楚：谁拥有、谁能改、放在哪、活多久、什么时候清理。组件自己的状态用 useState / useReducer 留在组件里；接口数据进查询缓存；跨页稳定的状态进全局 store；可分享的视图状态进 URL；表单进表单模型。
        anchors:
          - { spec: state, quote: 每个状态声明 owner、更新者、存储位置、生命周期和清理策略。 }
          - { spec: state, quote: MUST NOT 将组件状态放入全局 store。 }
        enforcement: { kind: review }
        showcase:
          - kind: specimen
            title_zh: 这份状态放哪
            name_label_zh: 状态
            rows:
              - name: 接口返回的数据
                usage_zh: "@tanstack/react-query 查询缓存"
                jsx: |-
                  <code className="text-label-13-mono">useQuery(&#123; queryKey, queryFn &#125;)</code>
              - name: 跨页、少变（当前用户、团队、偏好）
                usage_zh: Zustand 全局 store
                jsx: |-
                  <code className="text-label-13-mono">useSessionStore()</code>
              - name: 可分享的筛选、页码、标签页
                usage_zh: URL 查询参数
                jsx: |-
                  <code className="text-label-13-mono">?status=ready&amp;page=2</code>
              - name: 正在编辑的表单
                usage_zh: 表单模型
                jsx: |-
                  <code className="text-label-13-mono">useForm()</code>
              - name: 组件内的临时状态（展开、悬停）
                usage_zh: 组件局部状态
                jsx: |-
                  <code className="text-label-13-mono">useState()</code>

      - id: STATE.SERVER_STATE
        title_zh: 服务端数据
        statement_zh: 从接口来的数据由 @tanstack/react-query 管理（缓存 key、过期、重新获取、失效都在这一层），组件直接从查询读；不把接口数据复制进全局 store 再手动同步。
        params:
          query_library: { value: "@tanstack/react-query", source: SRC.POMASTER.STACK_DECISION, label_zh: 查询缓存库 }
        anchors:
          - { spec: state, quote: server state 由查询缓存层管理。 }
          - { spec: state, quote: MUST NOT 复制 server state 到全局 store 手动同步。 }
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 组件从查询读
            code: |-
              const { data, isPending } = useQuery({ queryKey: ["deployments", { status, page }], queryFn: () => api.listDeployments({ status, page }) })
            lang: tsx
          - kind: dont
            title_zh: 拉回来塞进全局 store
            code: |-
              useEffect(() => { api.listDeployments(query).then((list) => useDeployStore.setState({ list })) }, [query])
            lang: tsx

      - id: STATE.GLOBAL_STORE
        title_zh: 全局 store
        statement_zh: 全局 store 用 Zustand，只放跨页面且稳定的状态（当前用户、团队、偏好设置）；每个 store 一个文件，文件头写明属主；组件用选择器只订阅自己用到的字段。
        params:
          library: { value: Zustand, source: SRC.POMASTER.STACK_DECISION, label_zh: 全局状态库 }
        anchors:
          - { spec: state, quote: 全局 store 只保存稳定跨页面状态。 }
        enforcement: { kind: gate, check: state.store-library }
        examples:
          - kind: do
            title_zh: 用选择器订阅
            code: |-
              const team = useSessionStore((state) => state.team)
            lang: tsx

      - id: STATE.URL
        title_zh: URL 状态
        statement_zh: 列表的筛选条件、页码、排序、当前标签页这类可分享、刷新后要恢复的状态放进 URL 查询参数；敏感信息和没提交的表单不进 URL。
        anchors:
          - { spec: state, quote: 可分享和可恢复状态进入 URL。 }
          - { spec: state, quote: MUST NOT 将敏感或未提交表单写入 URL。 }
        enforcement: { kind: review }
        showcase:
          - kind: lab
            lab: state.url-filters
            title_zh: 实验：筛选条件进 URL
            description_zh: 改筛选和页码，地址栏跟着变；点「刷新页面」，视图从 URL 原样恢复。

      - id: STATE.REQUESTS
        title_zh: 请求入口
        statement_zh: 组件不直接调用 fetch，一律经生成的接口客户端（类型与 OpenAPI 同源）和查询；展示组件不请求接口、不改路由、不改全局状态，数据从属性传入。
        anchors:
          - { spec: ui, quote: MUST NOT 让展示组件偷偷请求接口、改路由或全局状态。 }
        enforcement: { kind: gate, check: state.no-direct-request }
        examples:
          - kind: dont
            title_zh: 组件里直接 fetch
            code: |-
              useEffect(() => { fetch("/api/deployments").then((r) => r.json()).then(setRows) }, [])
            lang: tsx

      - id: STATE.CACHE_KEYS
        title_zh: 缓存 key 与失效
        statement_zh: 查询 key 包含所有影响结果的筛选条件和上下文（团队、数据范围）；每个写操作声明它会让哪些查询失效，成功后 invalidateQueries；切换团队或身份时清掉可能越权的缓存。
        anchors:
          - { spec: state, quote: Query Key 包含所有影响结果的筛选和上下文。 }
          - { spec: state, quote: 写操作定义依赖失效矩阵。 }
        enforcement: { kind: review }
        showcase:
          - kind: lab
            lab: state.query-cache
            title_zh: 实验：查询缓存与失效
            description_zh: 切换筛选看缓存命中；点「新建一条」后，对应的 key 失效并重新拉取。

      - id: STATE.CLEANUP
        title_zh: 清理与竞态
        statement_zh: 订阅、计时器、请求在组件卸载和身份切换时清理（useEffect 返回清理函数，请求带 AbortSignal）；已取消的请求和旧身份下的迟到结果不得写入当前状态。
        anchors:
          - { spec: state, quote: MUST NOT 让已取消请求、旧订阅或旧身份上下文的迟到结果继续写入当前状态。 }
        enforcement: { kind: review }
        showcase:
          - kind: lab
            lab: state.race
            title_zh: 实验：迟到的响应不写回
            description_zh: 快速输入会发出多个请求，响应乱序到达；只有最新一次的结果写进列表。打开「错误做法」看旧结果覆盖新结果。

      - id: STATE.FORM_MODEL
        title_zh: 表单模型
        statement_zh: 表单用独立的表单模型和类型化的校验 schema，不直接绑定接口返回的 DTO；区分初始值、当前值、是否改过、错误和提交中。
        params:
          form_library: { decision: 表单模型用哪个库？, candidates: ["react-hook-form + zod", "TanStack Form"], label_zh: 表单库 }
        anchors:
          - { spec: page, quote: 使用独立 FormModel 和 typed schema。 }
          - { spec: page, quote: MUST NOT 直接绑定 DTO。 }
        enforcement: { kind: review }

      - id: STATE.BROWSER_STORAGE
        title_zh: 浏览器存储
        statement_zh: 存进浏览器（localStorage、IndexedDB）的每一项都登记用途、隔离 key（按用户、团队）、版本、大小、过期时间和清理时机；读回来先校验版本和身份；脚本可读的存储里不放会话标识、刷新令牌等凭据。
        anchors:
          - { spec: state, quote: 可被脚本读取的存储不得持久化 session identifier、refresh token、secret 或等价凭据 }
        enforcement: { kind: review }

  # ───────────────────────────── 工程规范 · 性能 ─────────────────────────────
  - key: performance
    title_zh: 性能
    group: engineering
    prefix: PERF
    summary_zh: 先定预算；路由与重组件按需加载；组件与图标按需引入；大列表分页与虚拟化；输入防抖并丢弃过期响应；初始化请求并行；渲染里不做重计算；度量分清实验室与真实用户数据。
    rules:
      - id: PERF.BUDGET
        title_zh: 性能预算
        statement_zh: 上线前定好预算：真实用户第 75 百分位 LCP ≤ 2.5 s、INP ≤ 200 ms、CLS ≤ 0.1（项目可以凭证据收紧）；首屏脚本体积和单个路由分包体积由项目定上限，构建时检查。
        params:
          lcp: { value: 2500, unit: ms, source: SRC.POMASTER.PERF_SPEC, label_zh: LCP（p75） }
          inp: { value: 200, unit: ms, source: SRC.POMASTER.PERF_SPEC, label_zh: INP（p75） }
          cls: { value: 0.1, source: SRC.POMASTER.PERF_SPEC, label_zh: CLS（p75） }
          initial_js: { value: 170, unit: none, source: SRC.POMASTER.DEFAULTS, label_zh: 首屏脚本体积（KB，压缩后）, note_zh: 取业界常用的首屏脚本预算 170 KB（gzip 后） }
          route_chunk: { value: 100, unit: none, source: SRC.POMASTER.DEFAULTS, label_zh: 路由分包体积（KB，压缩后）, note_zh: 单个路由分包不超过 100 KB（gzip 后），超过就再拆 }
        anchors:
          - { spec: perf, quote: 定义首屏、包体、交互和核心页面预算。 }
        enforcement: { kind: review }

      - id: PERF.LAZY_LOAD
        title_zh: 按需加载
        statement_zh: 路由一律懒加载（lazy 路由或 React.lazy）；图表、富文本编辑器、大表格等重组件在用到的页面里按需加载；应用入口不同步引入这些重型依赖。
        anchors:
          - { spec: perf, quote: 路由、图表和重组件按需加载。 }
        enforcement: { kind: gate, check: perf.lazy-load }
        examples:
          - kind: do
            title_zh: 路由懒加载
            code: |-
              { path: '/usage', lazy: () => import('./pages/usage') }
            lang: tsx
          - kind: dont
            title_zh: 入口同步引入图表库
            code: |-
              // main.tsx
              import { LineChart } from 'recharts'
            lang: tsx

      - id: PERF.ON_DEMAND_LIBRARY
        title_zh: 组件库按需引入
        statement_zh: 组件按文件引入（shadcn/ui 的组件本来就在 src/components/ui 下按文件存在）；lucide-react 按图标名具名引入，不整包引入或用动态名字查整个图标表。
        enforcement: { kind: gate, check: perf.no-full-library-import }
        examples:
          - kind: do
            title_zh: 具名引入图标
            code: |-
              import { RocketIcon } from 'lucide-react'
            lang: tsx
          - kind: dont
            title_zh: 整包引入图标表
            code: |-
              import * as Icons from 'lucide-react'
              const Icon = Icons[name]
            lang: tsx

      - id: PERF.LARGE_LISTS
        title_zh: 大列表
        statement_zh: 大列表走服务端分页、筛选、排序；行数多或列很多的表格用虚拟滚动（TanStack Virtual）；不用 map 一次渲染全量数据；列表项有稳定的 key。
        params:
          virtual_threshold: { value: 500, unit: count, source: SRC.POMASTER.DEFAULTS, label_zh: 虚拟滚动阈值, note_zh: 与数据网格的虚拟滚动阈值一致 }
        anchors:
          - { spec: perf, quote: 大列表服务端分页，宽表虚拟化。 }
        enforcement: { kind: review }

      - id: PERF.INPUT
        title_zh: 输入与过期响应
        statement_zh: 搜索、联想等随输入触发的请求做防抖，或用 useDeferredValue 让输入保持跟手；新请求发出时取消旧请求；过期的响应不覆盖新状态（查询 key 带上关键字时由查询缓存层处理）。
        params:
          debounce: { value: 300, unit: ms, source: SRC.POMASTER.DEFAULTS, label_zh: 防抖间隔, note_zh: 输入停顿 300ms 再发请求：打字时不连发，停下来又不显得迟钝 }
        anchors:
          - { spec: perf, quote: 搜索防抖、旧请求取消、过期响应丢弃。 }
        enforcement: { kind: review }

      - id: PERF.PARALLEL_INIT
        title_zh: 并行初始化
        statement_zh: 页面初始化需要的多个请求并行发出（多个 useQuery 天然并行，或 useQueries），或由后端聚合成一个；不在 useEffect 里串行等待彼此无关的请求，不造成请求瀑布。
        anchors:
          - { spec: perf, quote: MUST NOT 串行发起可并行的页面初始化请求（须并行或后端聚合）。 }
        enforcement: { kind: review }
        examples:
          - kind: dont
            title_zh: 请求瀑布
            code: |-
              const { data: team } = useQuery(teamQuery)
              const { data: usage } = useQuery({ ...usageQuery(team?.id), enabled: !!team }) // 与 team 无关却等它
            lang: tsx

      - id: PERF.COMPUTE
        title_zh: 渲染计算
        statement_zh: 渲染里不做复杂计算：派生值在渲染时直接算（轻量的）或用 useMemo（昂贵的）；对大数据全集的计算放到后端或 Web Worker；只订阅用到的状态（Zustand 选择器），避免整树重渲染。
        anchors:
          - { spec: perf, quote: MUST NOT 在 render 中执行复杂计算。 }
        enforcement: { kind: review }

      - id: PERF.MEASURE
        title_zh: 度量口径
        statement_zh: 性能结论分清实验室数据和真实用户数据，记录设备、网络、浏览器、样本量和统计口径，放行看第 75 百分位；同一数据量下对比前后结果，不拿平均值或单次本地耗时下结论；用 React Profiler 定位重渲染。
        anchors:
          - { spec: perf, quote: 性能预算必须区分实验室数据与真实用户数据 }
        enforcement: { kind: review }

  # ───────────────────────────── 工程规范 · 安全 ─────────────────────────────
  - key: security
    title_zh: 安全
    group: engineering
    prefix: SEC
    summary_zh: 不可信内容不进危险渲染；链接与跳转走白名单；状态变更请求带 CSRF 防护；不用 eval 一类动态执行；第三方脚本登记并校验完整性；前端隐藏不是鉴权；敏感值不出现在 URL、日志、埋点和剪贴板；跨窗口消息校验来源。
    rules:
      - id: SEC.XSS
        title_zh: 不可信内容不进危险渲染
        statement_zh: 不用 dangerouslySetInnerHTML 渲染用户输入或接口返回的富文本；确实要渲染富文本时，经项目唯一的净化组件（白名单 sanitizer，如 DOMPurify）输出；不拼接 HTML 字符串。
        anchors:
          - { spec: security, quote: MUST NOT 使用 `v-html` / `innerHTML` / `dangerouslySetInnerHTML` 渲染不可信内容；富文本必须使用白名单 sanitizer。 }
        enforcement: { kind: gate, check: security.no-unsafe-html }
        examples:
          - kind: dont
            title_zh: 直接渲染接口返回的 HTML
            code: |-
              <div dangerouslySetInnerHTML={{ __html: notice.content }} />
            lang: tsx
          - kind: do
            title_zh: 经净化组件
            code: |-
              <SafeHtml html={notice.content} />
            lang: tsx

      - id: SEC.LINKS
        title_zh: 链接与跳转走白名单
        statement_zh: 用户或接口提供的链接只接受 http、https、mailto 协议（拒绝 javascript:、data:）；登录后的回跳地址只接受站内相对路径；新窗口打开外链一律带 rel="noopener noreferrer"。
        enforcement: { kind: gate, check: security.safe-link }
        examples:
          - kind: do
            title_zh: 回跳地址只认站内路径
            code: |-
              const next = params.get('next')
              navigate(next?.startsWith('/') && !next.startsWith('//') ? next : '/')
            lang: tsx
          - kind: do
            title_zh: 外链
            code: |-
              <a href={url} target="_blank" rel="noopener noreferrer">查看文档</a>
            lang: tsx

      - id: SEC.CSRF
        title_zh: 状态变更请求带 CSRF 防护
        statement_zh: 所有改变状态的请求（表单、AJAX、上传、批量操作）由 HTTP 客户端统一带上 CSRF token 和自定义请求头；token 不放 URL、不存进脚本可读的存储；业务代码不自己拼这些头。
        anchors:
          - { spec: security, quote: MUST 在表单提交、AJAX/Fetch、上传、批量操作、GraphQL mutation 中携带 CSRF token。 }
          - { spec: security, quote: MUST NOT 让业务请求自行决定 CSRF/token 头格式。 }
        enforcement: { kind: review }

      - id: SEC.NO_EVAL
        title_zh: 不用动态执行
        statement_zh: 不用 eval、new Function、字符串形式的 setTimeout / setInterval，不用内联事件属性；生产环境按严格 CSP 部署（script-src 不含 'unsafe-inline' 和 'unsafe-eval'）。
        anchors:
          - { spec: security, quote: MUST 部署 CSP，默认 `default-src 'self'`；脚本/样式/img/font/connect/frame 按业务最小白名单开放。 }
        enforcement: { kind: gate, check: security.no-eval }
        examples:
          - kind: dont
            title_zh: 字符串当代码执行
            code: |-
              setTimeout('refresh()', 1000)
              const fn = new Function('row', rule.expression)
            lang: ts

      - id: SEC.THIRD_PARTY
        title_zh: 第三方脚本登记并校验完整性
        statement_zh: 第三方脚本、iframe、SDK 先登记（负责人、来源域、权限、数据范围、版本、撤除方式）再引入；从 CDN 加载的脚本带 SRI（integrity + crossorigin）；iframe 用 sandbox 收紧能力。
        anchors:
          - { spec: security, quote: MUST NOT 加载无 SRI/无来源清单的第三方脚本或 iframe。 }
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 带完整性校验
            code: |-
              <script src="https://cdn.example.com/widget@2.1.0/widget.js" integrity="sha384-…" crossorigin="anonymous"></script>
            lang: html

      - id: SEC.AUTHZ_UI
        title_zh: 前端隐藏不是鉴权
        statement_zh: 按权限隐藏或禁用按钮、菜单只是体验；每个接口由后端强制鉴权；前端不拿全量敏感数据再自己过滤或用 CSS 藏起来，按权限脱敏由后端完成。
        anchors:
          - { spec: security, quote: MUST NOT 用前端隐藏菜单或按钮替代后端鉴权。 }
          - { spec: security, quote: MUST 后端返回字段按权限脱敏，前端不得获取全量敏感数据后再自行过滤或仅 CSS 隐藏。 }
        enforcement: { kind: review }

      - id: SEC.SENSITIVE
        title_zh: 敏感值不外泄
        statement_zh: token、密码、身份证号这类敏感原值不写进 console、日志、埋点、错误上报、剪贴板、URL 和下载文件名；错误提示不暴露堆栈、内部路径和内部 ID。
        anchors:
          - { spec: security, quote: MUST NOT 将敏感原值写入浏览器 console、日志、埋点、错误监控、剪贴板、URL、localStorage、下载文件。 }
        enforcement: { kind: review }

      - id: SEC.POSTMESSAGE
        title_zh: 跨窗口消息校验来源
        statement_zh: postMessage 指定目标 origin，不用 '*'；接收方先校验 event.origin 在白名单内，再按结构解析数据；收到的内容不进 eval 或 innerHTML。
        anchors:
          - { spec: security, quote: MUST NOT 使用 `postMessage('*')` 或在跨窗口消息中直接执行 eval/innerHTML。 }
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 校验来源
            code: |-
              window.addEventListener('message', (event) => {
                if (!TRUSTED_ORIGINS.includes(event.origin)) return
                const message = parseWidgetMessage(event.data)
              })
            lang: ts

  # ───────────────────────────── 工程规范 · 会话与凭据 ─────────────────────────────
  - key: session
    title_zh: 会话与凭据
    group: engineering
    prefix: SESSION
    summary_zh: 凭据放在脚本读不到的地方；Cookie 属性收紧；登录后换会话；空闲与绝对超时；敏感操作重新验证；静默刷新只试一次；登出全面清理并同步到所有标签页；非必要 Cookie 先征得同意。
    rules:
      - id: SESSION.STORAGE
        title_zh: 凭据放在脚本读不到的地方
        statement_zh: 会话标识与刷新令牌放在 HttpOnly Cookie 里，由后端设置；短期访问令牌只放内存（模块变量或状态库里不持久化的字段）；不存进 localStorage、sessionStorage、IndexedDB，不放进 URL 和 URL 片段。
        anchors:
          - { spec: security, quote: MUST 禁止将 session identifier、refresh token、access token、secret、密码等价凭据持久化到 localStorage/sessionStorage/IndexedDB（除非经安全 Owner 批准的短期例外）。 }
        enforcement: { kind: gate, check: security.no-token-storage }
        examples:
          - kind: dont
            title_zh: 令牌存进 localStorage
            code: |-
              localStorage.setItem('access_token', data.token)
            lang: ts
          - kind: do
            title_zh: 令牌只放内存
            code: |-
              let accessToken: string | null = null
              export const setAccessToken = (token: string | null) => { accessToken = token }
            lang: ts

      - id: SESSION.COOKIE
        title_zh: Cookie 属性收紧
        statement_zh: 会话类 Cookie 一律 HttpOnly、Secure、SameSite（默认 Lax，跨站场景不需要时用 Strict），优先用 __Host- 前缀（必须 Secure、Path=/、不带 Domain）；Path 与 Domain 取最小范围；Cookie 里不放业务数据和个人信息；前端代码不读写会话 Cookie。
        params:
          same_site: { decision: 会话 Cookie 的 SameSite 取 Lax 还是 Strict？, candidates: [Lax, Strict], label_zh: SameSite }
          prefix: { value: __Host-, source: SRC.MDN.COOKIES, label_zh: Cookie 名前缀 }
        anchors:
          - { spec: security, quote: MUST 使用双重提交 cookie 或同步器 token；token 必须每次会话/请求不可预测且由后端验证。 }
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 后端下发的会话 Cookie
            code: |-
              Set-Cookie: __Host-sid=…; Path=/; Secure; HttpOnly; SameSite=Lax
            lang: html

      - id: SESSION.ROTATE
        title_zh: 登录后换会话
        statement_zh: 登录成功、切换租户、提升权限后由后端签发新的会话标识并作废旧的（防会话固定）；前端在这些时刻丢弃内存里的旧令牌和旧的 CSRF token，重新获取。
        anchors:
          - { spec: security, quote: MUST 在登录、切换租户、敏感操作后轮换 CSRF token。 }
        enforcement: { kind: review }

      - id: SESSION.TIMEOUT
        title_zh: 空闲与绝对超时
        statement_zh: 会话同时有空闲超时和绝对超时；空闲超时到期前提示「即将退出」并允许续期；超时后保存可恢复的现场（当前路由、未提交表单的草稿），重新登录后回到原处。
        params:
          idle: { decision: 空闲多久自动退出？, candidates: [30 分钟, 2 小时], label_zh: 空闲超时 }
          absolute: { decision: 登录后最长多久必须重新登录？, candidates: [8 小时, 24 小时], label_zh: 绝对超时 }
          warn_before: { decision: 到期前多久提示？, candidates: [2 分钟, 5 分钟], label_zh: 到期提醒 }
        enforcement: { kind: review }

      - id: SESSION.STEP_UP
        title_zh: 敏感操作重新验证
        statement_zh: 修改密码、改绑手机、导出敏感数据、批量删除、审批这类高影响操作前要求重新验证身份（输入密码或二次验证），验证结果只对这一次操作有效。
        anchors:
          - { spec: security, quote: MUST 对导出、删除、审批、批量操作等高影响动作增加二次确认或后端 challenge。 }
        enforcement: { kind: review }

      - id: SESSION.REFRESH
        title_zh: 静默刷新只试一次
        statement_zh: 请求返回 401 时，HTTP 客户端用刷新令牌静默刷新一次（并发的 401 共用同一次刷新），成功后重放原请求；刷新失败就清理会话并带回跳地址去登录；刷新逻辑只在 HTTP 客户端里写一处。
        anchors:
          - { spec: security, quote: MUST 在 token 即将过期前使用 silent refresh 或显式重新认证，不得在 URL 中传递 token。 }
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 并发 401 共用一次刷新
            code: |-
              let refreshing: Promise<void> | null = null
              async function onUnauthorized() {
                refreshing ??= api.refresh().finally(() => { refreshing = null })
                await refreshing
              }
            lang: ts

      - id: SESSION.LOGOUT
        title_zh: 登出全面清理并同步
        statement_zh: 登出时调用后端注销接口，清空内存令牌、查询缓存、状态库、按用户隔离的存储、订阅、Worker 和长连接；用 BroadcastChannel 通知其他标签页同步登出。
        anchors:
          - { spec: security, quote: MUST 实现统一登出：清除服务端会话、客户端内存 token、触发所有标签页/Worker 登出事件。 }
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 多标签页同步登出
            code: |-
              const channel = new BroadcastChannel('auth')
              channel.onmessage = (event) => { if (event.data === 'logout') clearSession() }
              export function logout() { clearSession(); channel.postMessage('logout') }
            lang: ts

      - id: SESSION.CONSENT
        title_zh: 非必要 Cookie 先征得同意
        statement_zh: 统计、广告等非必要 Cookie 和本地存储在用户同意之前不写入；同意可以撤回，撤回后停止加载对应脚本并清理它写下的数据；必要 Cookie 在隐私说明里列明用途。
        anchors:
          - { spec: security, quote: MUST 在用户撤回同意或第三方 SDK 不再需要时停止加载并清理其状态/缓存。 }
        enforcement: { kind: review }

  # ───────────────────────────── 工程规范 · 防篡改与防劫持 ─────────────────────────────
  - key: tamper
    title_zh: 防篡改与防劫持
    group: engineering
    prefix: TAMPER
    summary_zh: 前端的一切都可被篡改：价格、权限、状态以服务端为准；关键写请求防重放；传输全程 HTTPS 与 HSTS；页面不被别人嵌套（防点击劫持）；外链防反向标签页劫持；本地数据读回先校验；前端混淆不是安全措施。
    rules:
      - id: TAMPER.SERVER_TRUTH
        title_zh: 以服务端为准
        statement_zh: 金额、价格、折扣、库存、权限、审批状态这类业务事实由服务端计算和判定；前端提交用户的意图（选了哪个商品、改成什么），不提交可被改写的结论（总价、是否有权限）；客户端校验只是体验，服务端再校验一遍。
        anchors:
          - { spec: security, quote: MUST 将客户端校验仅视为 UX 辅助，服务端校验为权威；前端仍需执行同步/异步校验以提升体验。 }
        enforcement: { kind: review }
        examples:
          - kind: dont
            title_zh: 提交前端算的总价
            code: |-
              api.createOrder({ items, totalPrice: cart.total })
            lang: ts
          - kind: do
            title_zh: 只提交意图，总价由后端算
            code: |-
              api.createOrder({ items: items.map(({ skuId, quantity }) => ({ skuId, quantity })) })
            lang: ts

      - id: TAMPER.REPLAY
        title_zh: 关键写请求防重放
        statement_zh: 支付、审批、转账这类关键写请求带一次性随机数和时间戳，由后端校验时效并拒绝重复；需要时对请求体签名（密钥不在前端代码里，由后端按会话下发短期签名凭据）；重放保护与幂等键一起使用。
        params:
          window: { value: 300, unit: none, source: SRC.POMASTER.DEFAULTS, label_zh: 时间窗口（秒）, note_zh: 允许 5 分钟时钟偏差，与常见请求签名方案一致 }
        enforcement: { kind: review }

      - id: TAMPER.TRANSPORT
        title_zh: 传输全程 HTTPS
        statement_zh: 全站 HTTPS 并启用 HSTS；页面不加载任何 HTTP 资源（无混合内容）；接口地址、WebSocket 地址都用 https / wss；证书错误不提供「继续访问」的旁路。
        anchors:
          - { spec: security, quote: MUST 配置 TLS 1.2+；HTTPS 页面不得加载 HTTP 资源（混合内容）。 }
        enforcement: { kind: review }

      - id: TAMPER.FRAMING
        title_zh: 页面不被别人嵌套
        statement_zh: 响应头设置 CSP frame-ancestors（或 X-Frame-Options），默认禁止被其他站点嵌入 iframe，防点击劫持；确需被嵌入的页面列出允许的来源。
        anchors:
          - { spec: security, quote: "MUST 使用 `X-Frame-Options: DENY/SAMEORIGIN` 或 CSP `frame-ancestors` 防止点击劫持。" }
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 禁止被嵌入
            code: |-
              Content-Security-Policy: frame-ancestors 'self'
            lang: html

      - id: TAMPER.TABNABBING
        title_zh: 外链防反向标签页劫持
        statement_zh: target=_blank 的链接一律带 rel="noopener noreferrer"；用 window.open 打开外部页面时传 noopener；不把 window.opener 交给外部页面。
        enforcement: { kind: gate, check: security.safe-link }
        examples:
          - kind: do
            title_zh: window.open 带 noopener
            code: |-
              window.open(url, '_blank', 'noopener,noreferrer')
            lang: ts

      - id: TAMPER.LOCAL_DATA
        title_zh: 本地数据读回先校验
        statement_zh: 从 localStorage、IndexedDB、URL 参数读回的数据当作不可信输入：校验结构、版本和所属用户，不符合就丢弃并回到默认值；不把本地数据当成权限或业务判定的依据。
        anchors:
          - { spec: state, quote: 持久化状态必须区分用户/租户/环境命名空间，并在登出、权限收缩或版本不兼容时失效或迁移。 }
        enforcement: { kind: review }

      - id: TAMPER.OBFUSCATION
        title_zh: 前端混淆不是安全措施
        statement_zh: 代码混淆、禁用右键、反调试只能增加一点阅读成本，不能保护任何秘密：前端代码里不放密钥、内部接口凭据和不该给用户看到的规则；source map 不公开发布（随版本上传到错误监控并限制访问）。
        anchors:
          - { spec: obs, quote: source map 与版本对应且受权限保护。 }
        enforcement: { kind: review }

  # ───────────────────────────── 工程规范 · 健壮性 ─────────────────────────────
  - key: robustness
    title_zh: 健壮性
    group: engineering
    prefix: ROBUST
    summary_zh: 接口数据在边界按契约解析；渲染不怕空值与缺字段；每个请求有超时；离线和弱网有处理；非核心模块失败不影响主流程；界面承受重复与乱序；资源在卸载时清理；输入上限前端先拦。
    rules:
      - id: ROBUST.PARSE
        title_zh: 接口数据在边界按契约解析
        statement_zh: 接口响应在 HTTP 客户端或接口层按契约 schema 解析（类型由 OpenAPI 生成，运行时用 zod 一类校验关键结构）；解析失败归为「契约错误」走错误处理，不把畸形数据交给组件去崩。
        anchors:
          - { spec: api, quote: 传输成功与业务成功必须分别判断；HTTP 非成功状态、契约解析失败、取消、超时、离线和业务错误不得混为一类。 }
        enforcement: { kind: review }

      - id: ROBUST.NULLS
        title_zh: 渲染不怕空值与缺字段
        statement_zh: 可选字段用可选链和明确的默认显示（「—」）；列表字段为空数组、null 或缺失时都能渲染；数字字段区分 0 与空；不在模板里写多层取值链而不设防。
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 明确的空值显示
            code: |-
              <span>{order.customer?.name ?? '—'}</span>
            lang: tsx

      - id: ROBUST.TIMEOUT
        title_zh: 每个请求有超时
        statement_zh: HTTP 客户端给每个请求设超时（上传、导出等长请求单独设）；超时、取消、离线、服务端错误分别处理与提示；超时的请求不自动重发非幂等写操作。
        params:
          timeout: { value: 15, unit: none, source: SRC.POMASTER.DEFAULTS, label_zh: 请求超时（秒）, note_zh: 普通请求 15 秒超时；导出、上传这类长任务走后台任务，不靠拉长超时 }
        anchors:
          - { spec: api, quote: HTTP Client 统一处理 base URL、认证、超时、取消、trace 和 envelope。 }
        enforcement: { kind: review }

      - id: ROBUST.OFFLINE
        title_zh: 离线和弱网有处理
        statement_zh: 监听 online / offline：离线时顶部提示并暂停轮询，已输入的内容不丢；恢复后重新校验数据新鲜度并重试读请求；页面从后台或前进后退缓存恢复时同样重新校验。
        anchors:
          - { spec: page, quote: 页面必须兼容 `pagehide` / `pageshow`、可见性变化和 bfcache 恢复；恢复后重新校验连接、缓存、权限与数据新鲜度。 }
        enforcement: { kind: review }

      - id: ROBUST.DEGRADE
        title_zh: 非核心模块失败不影响主流程
        statement_zh: 推荐位、统计 SDK、客服挂件、图表这类非核心模块失败时只在它自己的位置降级（隐藏或显示占位），不阻塞首屏和主流程；第三方 SDK 初始化失败静默降级并上报。
        anchors:
          - { spec: obs, quote: MUST NOT 让 SDK 初始化、遥测缓存或发送重试阻塞首屏、用户操作或错误恢复。 }
        enforcement: { kind: review }

      - id: ROBUST.REPEAT_ORDER
        title_zh: 承受重复与乱序
        statement_zh: 同一事件触发两次、响应乱序到达、组件重复挂载，界面状态都保持正确：请求结果写回前核对请求序号与上下文（见 ASYNC.LATEST），订阅与监听的数量有上限、不随重复挂载增长。
        anchors:
          - { spec: page, quote: 重复进入、挂载、恢复或重试必须保持资源数量有界，并有自动化证据证明不会重复订阅或产生开放句柄。 }
        enforcement: { kind: review }

      - id: ROBUST.CLEANUP
        title_zh: 资源在卸载时清理
        statement_zh: 定时器、事件监听、订阅、观察器、WebSocket、对象 URL 在 useEffect 的清理函数里释放；路由离开和身份切换时取消进行中的请求。
        anchors:
          - { spec: page, quote: 路由离开、组件销毁、注销、切换账号/租户、权限变化和功能关闭必须清理对应资源与敏感上下文。 }
        enforcement: { kind: review }

      - id: ROBUST.LIMITS
        title_zh: 输入上限前端先拦
        statement_zh: 长度、文件大小、文件类型、数量、数值范围的上限与后端契约一致，在前端先拦截并说清限制（还能输入多少字、最大 20 MB）；后端仍是最终校验。
        anchors:
          - { spec: api, quote: 上传声明 multipart 字段、类型、大小、数量、文件名、校验阶段和安全错误。 }
        enforcement: { kind: review }

  # ───────────────────────────── 工程规范 · 报错管理 ─────────────────────────────
  - key: error_handling
    title_zh: 报错管理
    group: engineering
    prefix: ERRH
    summary_zh: 错误归一成统一结构；按状态码分别处理；路由级与区块级错误边界，局部失败不白屏；全局兜底捕获并脱敏上报；文案说清发生了什么、怎么办；不吞错误；错误码到界面状态的映射只有一份。
    rules:
      - id: ERRH.NORMALIZE
        title_zh: 错误归一成统一结构
        statement_zh: HTTP 客户端把所有失败归一成一个结构：类别（网络、超时、取消、契约、业务、权限……）、稳定错误码、可显示的文案、traceId、是否可重试、字段错误、建议的恢复动作；页面只消费这个结构，不解析原始响应。
        anchors:
          - { spec: api, quote: 将原始错误归一化为稳定 code、trace、fieldErrors、retryable 和 recoverAction。 }
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 统一的错误结构
            code: |-
              interface AppError {
                kind: 'network' | 'timeout' | 'canceled' | 'contract' | 'business' | 'auth' | 'forbidden' | 'not_found' | 'conflict' | 'rate_limited' | 'server'
                code: string
                message: string
                traceId: string | null
                retryable: boolean
                fieldErrors: Record<string, string>
                recover: 'login' | 'retry' | 'reload' | 'resolve_conflict' | 'contact' | null
              }
            lang: ts

      - id: ERRH.MAPPING
        title_zh: 按状态码分别处理
        statement_zh: 401 走静默刷新或去登录；403 显示无权限状态；404 显示资源不存在；409 给冲突解决（重新加载或比较合并）；422 把字段错误挂到字段；429 按 Retry-After 稍后重试；5xx 与网络错误显示可重试的错误；取消不提示。
        anchors:
          - { spec: api, quote: 401、403、404、409、422、429、5xx 和网络错误分别处理。 }
          - { spec: api, quote: 错误码到 UI 状态的映射必须维护在单一事实源 `outputs/frontend/10_planned/api-error-mapping.yaml`，并与契约版本同步。 }
        enforcement: { kind: review }

      - id: ERRH.BOUNDARY
        title_zh: 局部失败不白屏
        statement_zh: 路由级和区块级都有错误边界（ErrorBoundary 包住每个独立区块，路由用 errorElement）：一个区块渲染失败只替换这个区块并给重试，页面其余部分照常可用。
        anchors:
          - { spec: api, quote: 分层设置错误边界，局部失败不得导致整页白屏。 }
        enforcement: { kind: review }
        showcase:
          - kind: lab
            lab: error.boundary
            title_zh: 实验：区块级错误边界
            description_zh: 让「回款趋势」区块出错：正确做法只有这一块显示错误并能重试；错误做法整页白屏。

      - id: ERRH.GLOBAL
        title_zh: 全局兜底捕获并脱敏上报
        statement_zh: 注册 window.onerror 与 unhandledrejection（根组件外再包一层 ErrorBoundary），捕获到的错误先过滤敏感字段再上报，带 traceId、版本、路由；兜底只记录和提示，不吞掉错误继续假装正常。
        anchors:
          - { spec: security, quote: MUST 在前端异常捕获（Error Boundary、window.onerror、unhandledrejection）中过滤敏感字段后再上报监控。 }
        enforcement: { kind: review }

      - id: ERRH.MESSAGE
        title_zh: 文案说清发生了什么、怎么办
        statement_zh: 错误文案用用户的话说清发生了什么和下一步（重试、检查网络、联系管理员）；不显示堆栈、内部错误码原文和接口路径；需要反馈时给 traceId 方便复制；同一种错误全站同一句话。
        anchors:
          - { spec: security, quote: MUST 禁止在错误消息、Toast、Modal、URL、日志、监控 payload 中暴露 token、密码、PII、内部 ID。 }
        enforcement: { kind: review }
        examples:
          - kind: dont
            title_zh: 把原始错误抛给用户
            code: |-
              toast.error(error.response.data.exception)
            lang: ts
          - kind: do
            title_zh: 说清怎么办
            code: |-
              网络中断，修改已保存在本页。恢复后点「重试」。（问题编号 7f3a-21c9）
            lang: html

      - id: ERRH.NO_SWALLOW
        title_zh: 不吞错误
        statement_zh: catch 之后要么处理并告知用户，要么继续向上抛；不写空 catch，不只 console.log 了事；不用 try/catch 包住整段代码掩盖问题。
        anchors:
          - { spec: api, quote: MUST NOT 吞掉字段错误、冲突或 TraceId。 }
        enforcement: { kind: gate, check: error.no-empty-catch }
        examples:
          - kind: dont
            title_zh: 空 catch
            code: |-
              try { await save() } catch (e) {}
            lang: ts

      - id: ERRH.REPORT
        title_zh: 上报可定位、不刷屏
        statement_zh: 错误上报带版本、环境、页面、操作和 traceId，按去重键合并同类错误并采样；白屏、根组件渲染失败、接口失败率有告警；上报本身失败不影响用户操作。
        anchors:
          - { spec: obs, quote: 采集并分类运行错误、Promise rejection、资源失败、接口错误、白屏和根组件渲染失败 }
        enforcement: { kind: review }

  # ───────────────────────────── 工程规范 · 保护页 ─────────────────────────────
  - key: route_guard
    title_zh: 保护页
    group: engineering
    prefix: GUARD
    summary_zh: 每个路由声明访问要求；守卫集中在路由层；未登录去登录再回来；无权限与不存在有统一的页面；判定完成前不渲染受保护内容；会话过期保住现场；按钮级权限规则统一。
    rules:
      - id: GUARD.DECLARE
        title_zh: 每个路由声明访问要求
        statement_zh: 路由定义的 handle（或路由配置的元数据）里声明这个页面要求什么：是否登录、权限码、功能开关、布局；没有声明的路由在开发期就报错，不默认放行。
        anchors:
          - { spec: page, quote: 每个页面路由有稳定 name、path、page key、title、权限和布局 meta。 }
        enforcement: { kind: gate, check: guard.route-meta }
        examples:
          - kind: do
            title_zh: 路由声明访问要求
            code: |-
              { path: '/deployments', lazy: () => import('./pages/deployments'), handle: { title: '部署', auth: true, permission: 'deployment:read' } }
            lang: tsx

      - id: GUARD.CENTRAL
        title_zh: 守卫集中在路由层
        statement_zh: 访问判定只在路由层做一次（根路由的 loader 或统一的守卫组件，读 handle 与当前会话、权限），页面组件不各自判断；直接输入地址打开的页面同样经过守卫。
        anchors:
          - { spec: permission, quote: 直达 URL 仍经过页面权限守卫。 }
        enforcement: { kind: review }
        showcase:
          - kind: lab
            lab: guard.route
            title_zh: 实验：保护页与回跳
            description_zh: 以访客、只读成员、管理员身份打开受保护页面：访客去登录并在登录后回到原页面；只读成员看到无权限页；伪造的站外回跳地址被拒绝。

      - id: GUARD.LOGIN_REDIRECT
        title_zh: 未登录去登录再回来
        statement_zh: 未登录访问受保护页面时跳到登录页并带上当前地址作回跳；登录成功后回到原页面；回跳地址只接受站内相对路径（见 SEC.LINKS）；登录页本身不再要求登录。
        enforcement: { kind: review }

      - id: GUARD.FORBIDDEN
        title_zh: 无权限与不存在有统一的页面
        statement_zh: 无权限显示统一的 403 页（说明缺什么权限、找谁申请），资源不存在显示统一的 404 页（给返回列表的入口）；按安全要求，对不该知道存在与否的资源统一显示 404，不泄露它是否存在。
        anchors:
          - { spec: page, quote: 401、403、404、500 和资源删除有统一路由策略。 }
          - { spec: security, quote: MUST 对 401/403/404/409/422/429/5xx 分别处理，避免通过错误差异泄露权限/存在性信息。 }
        enforcement: { kind: review }

      - id: GUARD.NO_FLASH
        title_zh: 判定完成前不渲染受保护内容
        statement_zh: 会话和权限还在确认时显示页面级加载，不先渲染受保护内容再跳走（避免闪现敏感信息）；权限数据随会话一次取回并缓存，路由切换时不重复拉取。
        enforcement: { kind: review }

      - id: GUARD.EXPIRED
        title_zh: 会话过期保住现场
        statement_zh: 停留期间会话过期，下一次请求 401 时先静默刷新一次（见 SESSION.REFRESH）；仍失败就保存现场（路由与未提交的草稿）再去登录，登录后恢复；其他标签页同步处理。
        enforcement: { kind: review }

      - id: GUARD.BUTTON
        title_zh: 按钮级权限规则统一
        statement_zh: 页面内的操作按同一套权限判断：没有权限的操作隐藏，或禁用并说明原因（全项目选一种并写明）；同一个操作在列表、详情、右键菜单里的权限判断一致；后端仍然校验。
        params:
          mode: { decision: 无权限的操作是隐藏，还是禁用并说明原因？, candidates: [隐藏, 禁用并说明原因], label_zh: 无权限操作的呈现 }
        anchors:
          - { spec: permission, quote: SHOULD 对禁用动作展示只读原因。 }
        enforcement: { kind: review }

  # ───────────────────────────── 工程规范 · 页面加载 ─────────────────────────────
  - key: page_loading
    title_zh: 页面加载
    group: engineering
    prefix: PLOAD
    summary_zh: 路由分包并预取；首屏骨架保持布局；先框架后数据、核心优先；异步加载的边界给全加载、出错、超时；分包加载失败能自愈；不跳布局；字体与图片有加载策略。
    rules:
      - id: PLOAD.SPLIT
        title_zh: 路由分包并预取
        statement_zh: 每个路由懒加载成独立分包（lazy 路由或 React.lazy）；导航链接在悬停或进入视口时预取目标路由；首屏只加载当前路由需要的代码。
        anchors:
          - { spec: perf, quote: 路由、图表和重组件按需加载。 }
        enforcement: { kind: gate, check: perf.lazy-load }

      - id: PLOAD.SKELETON
        title_zh: 首屏骨架保持布局
        statement_zh: 首次加载用与真实内容同几何的骨架（同样的行高、列宽、卡片尺寸），不用整页转圈；骨架只覆盖还没到的区块，已经有的内容先显示。
        anchors:
          - { spec: page, quote: 首屏骨架保持主要布局尺寸。 }
        enforcement: { kind: review }

      - id: PLOAD.PROGRESSIVE
        title_zh: 先框架后数据、核心优先
        statement_zh: 页面框架（导航、标题、工具栏）立即出现；核心数据最先请求并渲染；图表、历史、推荐等非核心区块延后加载或进入视口再加载；多个区块的请求并行。
        anchors:
          - { spec: perf, quote: MUST NOT 串行发起可并行的页面初始化请求（须并行或后端聚合）。 }
        enforcement: { kind: review }

      - id: PLOAD.ASYNC_BOUNDARY
        title_zh: 异步边界给全加载、出错、超时
        statement_zh: Suspense 的 fallback 用区块骨架，外面包 ErrorBoundary 处理加载失败；数据加载给超时与重试入口。
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: Suspense 外包错误边界
            code: |-
              <ErrorBoundary fallback={<BlockError />}>
                <Suspense fallback={<ChartSkeleton />}>
                  <UsageChart />
                </Suspense>
              </ErrorBoundary>
            lang: tsx

      - id: PLOAD.CHUNK_ERROR
        title_zh: 分包加载失败能自愈
        statement_zh: 发布新版本后旧分包不存在（动态 import 失败）时，识别分包加载错误，提示「有新版本」并刷新一次到目标地址；同一会话只自动刷新一次，避免循环。
        enforcement: { kind: review }

      - id: PLOAD.NO_SHIFT
        title_zh: 不跳布局
        statement_zh: 图片、广告位、异步区块预留尺寸（宽高或 aspect-ratio）；字体加载不引起明显跳动；新内容插在用户视线下方或由用户触发；累计布局偏移守住性能预算。
        params:
          cls: { value: 0.1, source: SRC.POMASTER.PERF_SPEC, label_zh: CLS（p75） }
        enforcement: { kind: review }

      - id: PLOAD.ASSETS
        title_zh: 字体与图片有加载策略
        statement_zh: "字体用 font-display: swap 并只加载用到的字重；首屏大图预加载，其余图片懒加载（loading=\"lazy\"）并给出响应式尺寸；图标走图标库的按需引入，不加载整套字体图标。"
        enforcement: { kind: review }

  # ───────────────────────────── 工程规范 · 缓存 ─────────────────────────────
  - key: caching
    title_zh: 缓存
    group: engineering
    prefix: CACHE
    summary_zh: 分清每一层缓存的用途；每类数据定新鲜度；先显示旧数据、后台刷新；写后失效；按身份隔离；持久化只存可过期的非敏感数据；静态资源带指纹、入口页不缓存。
    rules:
      - id: CACHE.LAYERS
        title_zh: 分清每一层缓存
        statement_zh: HTTP 缓存管静态资源；查询缓存（TanStack Query）管接口数据；持久化缓存（localStorage、IndexedDB）只管偏好和离线需要的数据；Service Worker 只在明确需要离线时启用。同一份数据不在两层各缓存一份再手动同步。
        anchors:
          - { spec: state, quote: server state 由查询缓存层管理。 }
        enforcement: { kind: review }

      - id: CACHE.FRESHNESS
        title_zh: 每类数据定新鲜度
        statement_zh: 每类查询明确 staleTime：字典、配置这类少变的长，列表、详情短，实时数据不缓存；缓存保留时间（gcTime）默认 5 分钟，按需调整；默认失败重试 3 次（指数退避），写操作不自动重试。
        params:
          gc_time: { value: 5 分钟, source: SRC.TANSTACK.QUERY, label_zh: 缓存保留（gcTime 缺省） }
          query_retry: { value: 3, unit: count, source: SRC.TANSTACK.QUERY, label_zh: 查询失败重试（缺省） }
          dict_stale: { value: 1800000, unit: ms, source: SRC.POMASTER.DEFAULTS, label_zh: 字典新鲜度, note_zh: 字典类数据 30 分钟内视为新鲜；字典改动后由写操作主动失效 }
        anchors:
          - { spec: state, quote: 每个缓存声明 key、参数、身份/权限隔离、stale、保留和失效规则。 }
        enforcement: { kind: review }

      - id: CACHE.SWR
        title_zh: 先显示旧数据、后台刷新
        statement_zh: 有缓存时先显示旧数据并标出「更新中」，后台刷新后替换；不在刷新时清空列表造成闪烁；用户正在编辑的数据不被后台刷新覆盖。
        anchors:
          - { spec: state, quote: SHOULD 在后台刷新时保留可用旧数据并标识 stale。 }
        enforcement: { kind: review }
        showcase:
          - kind: lab
            lab: state.query-cache
            title_zh: 实验：查询缓存与失效
            description_zh: 切换筛选看缓存命中；让缓存过期后先显示旧数据再后台刷新；新建一条后对应的 key 失效并重新拉取。

      - id: CACHE.INVALIDATE
        title_zh: 写后失效
        statement_zh: 每个写操作声明它影响哪些查询（失效矩阵），成功后精确失效这些 key；不靠全量刷新页面；乐观更新的回滚和失效配套使用（见 STATE.CACHE_KEYS）。
        anchors:
          - { spec: state, quote: 写操作定义依赖失效矩阵。 }
          - { spec: state, quote: MUST NOT 成功后遗漏缓存刷新。 }
        enforcement: { kind: review }

      - id: CACHE.ISOLATION
        title_zh: 按身份隔离
        statement_zh: 查询 key 与持久化 key 都带用户、租户、数据范围；登出、切换租户、权限收缩时清理对应缓存；不同身份不复用同一份缓存。
        anchors:
          - { spec: state, quote: MUST NOT 多个用户、租户或权限范围复用未隔离的 key、数据库或缓存条目。 }
        enforcement: { kind: review }

      - id: CACHE.PERSIST
        title_zh: 持久化只存可过期的非敏感数据
        statement_zh: 写进浏览器的缓存登记用途、隔离 key、版本、大小和过期时间；读回先校验版本；不持久化接口的敏感数据和凭据；配额不足或写入失败时降级为只在内存里。
        anchors:
          - { spec: state, quote: MUST NOT 无限期持久化草稿、文件、接口响应或敏感偏好。 }
        enforcement: { kind: review }

      - id: CACHE.ASSETS
        title_zh: 静态资源带指纹、入口页不缓存
        statement_zh: 构建产物文件名带内容哈希并长缓存（immutable）；index.html 不缓存或每次校验（no-cache）；Service Worker 的缓存带版本，新版本激活时清理旧缓存。
        anchors:
          - { spec: state, quote: Service Worker 与 Cache API 必须限定作用域、版本化缓存、验证响应来源，并在发布和退出策略中清理过期内容。 }
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 入口页与静态资源的缓存头
            code: |-
              index.html      Cache-Control: no-cache
              /assets/*.js    Cache-Control: public, max-age=31536000, immutable
            lang: html

  # ───────────────────────────── 工程规范 · 异步处理 ─────────────────────────────
  - key: async
    title_zh: 异步处理
    group: engineering
    prefix: ASYNC
    summary_zh: 请求可取消；只认最新一次的结果；无依赖的并行、部分失败要处理；重试只对幂等与可重试错误、指数退避；输入防抖、滚动节流；轮询会暂停会停止；每个 Promise 都有去处。
    rules:
      - id: ASYNC.CANCEL
        title_zh: 请求可取消
        statement_zh: 请求接受 AbortSignal；重新输入、切换筛选、离开页面、组件卸载时取消进行中的请求；TanStack Query 会把 signal 传给 queryFn，接口层要接住它。
        anchors:
          - { spec: api, quote: 查询可取消和丢弃过期响应。 }
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 把 signal 传下去
            code: |-
              queryFn: ({ signal }) => api.listReceipts(filters, { signal })
            lang: ts

      - id: ASYNC.LATEST
        title_zh: 只认最新一次的结果
        statement_zh: 同一个视图的多次请求，只有最新一次的结果写进界面；写回前核对请求序号和当时的身份、租户、参数，旧的结果丢弃；已取消的请求不提示为错误。
        anchors:
          - { spec: api, quote: 请求结果提交前必须验证身份、租户、权限、参数和请求版本，防止旧上下文结果写回。 }
        enforcement: { kind: review }
        showcase:
          - kind: lab
            lab: state.race
            title_zh: 实验：迟到的响应不写回
            description_zh: 快速输入会发出多个请求，响应乱序到达；只有最新一次的结果写进列表。打开「错误做法」看旧结果覆盖新结果。

      - id: ASYNC.PARALLEL
        title_zh: 无依赖的并行、部分失败要处理
        statement_zh: 彼此无关的请求并行发出；需要全部结果时用 Promise.all，允许部分失败时用 Promise.allSettled 并逐项呈现失败；不在循环里逐个 await 彼此无关的请求。
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 部分失败逐项呈现
            code: |-
              const results = await Promise.allSettled(ids.map((id) => api.archive(id)))
              const failed = results.flatMap((result, index) => (result.status === 'rejected' ? [ids[index]] : []))
            lang: ts

      - id: ASYNC.RETRY
        title_zh: 重试只对幂等与可重试错误
        statement_zh: 只重试读请求和声明了幂等的写请求，且只在错误可重试时（网络错误、超时、5xx、429）；指数退避加随机抖动，有次数上限，服务端给了 Retry-After 就按它等；重试过程可以取消，用户能看到「正在重试」。
        params:
          max_attempts: { value: 3, unit: count, source: SRC.TANSTACK.QUERY, label_zh: 重试上限, note_zh: 与 TanStack Query 的缺省一致：失败的查询静默重试 3 次 }
          base_delay: { value: 1000, unit: ms, source: SRC.TANSTACK.QUERY, label_zh: 起始间隔, note_zh: 与 TanStack Query 的缺省退避一致：1 秒起，每次翻倍，上限 30 秒 }
        anchors:
          - { spec: api, quote: 重试必须服从幂等性、服务端 `Retry-After` 或受控退避，并能取消；取消或已被替代的请求不得提示为用户错误。 }
          - { spec: api, quote: MUST NOT 对非幂等 mutation 默认自动重试。 }
        enforcement: { kind: review }
        showcase:
          - kind: lab
            lab: async.retry
            title_zh: 实验：重试与退避
            description_zh: 调用一个时好时坏的接口：正确做法按指数退避重试、在上限内成功或明确失败；对不幂等的提交不自动重试。打开「错误做法」看立即重试把接口打爆。

      - id: ASYNC.DEBOUNCE
        title_zh: 输入防抖、滚动节流
        statement_zh: 随输入触发的查询做防抖；滚动、窗口尺寸变化、拖动这类高频事件做节流或合到动画帧；防抖和节流的间隔全项目统一。
        params:
          debounce: { value: 300, unit: ms, source: SRC.POMASTER.DEFAULTS, label_zh: 防抖间隔, note_zh: 与输入防抖同一取值 }
          throttle: { value: 100, unit: ms, source: SRC.POMASTER.DEFAULTS, label_zh: 节流间隔, note_zh: 滚动、拖拽每 100ms 最多处理一次；跟帧走的动画用 requestAnimationFrame }
        anchors:
          - { spec: perf, quote: 搜索防抖、旧请求取消、过期响应丢弃。 }
        enforcement: { kind: review }

      - id: ASYNC.POLLING
        title_zh: 轮询会暂停会停止
        statement_zh: 后台任务提交后轮询状态：间隔逐步加大，页面隐藏时暂停、回到页面时立即查一次，任务结束或离开页面时停止；能用服务端推送（SSE、WebSocket）就不轮询；同一任务只有一个轮询。
        anchors:
          - { spec: page, quote: 页面隐藏、冻结或进入前进后退缓存时必须暂停无必要轮询和高频工作；恢复时重新验证数据新鲜度、连接状态和权限上下文。 }
        enforcement: { kind: review }

      - id: ASYNC.NO_FLOATING
        title_zh: 每个 Promise 都有去处
        statement_zh: 每个 Promise 要么被 await，要么接上 catch 并处理；异步的事件处理器内部 try/catch，失败走错误处理；不留悬空的 Promise（失败会变成未处理的 rejection）。
        enforcement: { kind: review }
        examples:
          - kind: dont
            title_zh: 悬空的 Promise
            code: |-
              useEffect(() => { loadDashboard() }, [])
            lang: ts
          - kind: do
            title_zh: 失败有去处
            code: |-
              const dashboard = useQuery({ queryKey: ['dashboard'], queryFn: loadDashboard })
              // 失败进 dashboard.error，由区块的错误态呈现；不在 useEffect 里手动发请求
            lang: ts

  # ───────────────────────────── 工程规范 · 高并发 ─────────────────────────────
  - key: concurrency
    title_zh: 高并发
    group: engineering
    prefix: CONC
    summary_zh: 相同的在途请求合并；批量操作有并发上限；多个小请求合成批量接口；收到限流就退避排队；写冲突用版本号；实时推送重连退避、去重保序；高频更新合帧渲染。
    rules:
      - id: CONC.DEDUP
        title_zh: 相同的在途请求合并
        statement_zh: 同一个查询 key 在途时，新的调用复用同一个请求，不重复发；组件各自用同一个查询，由查询缓存层负责合并（TanStack Query 天然按 key 去重）。
        enforcement: { kind: review }
        showcase:
          - kind: lab
            lab: concurrency.pool
            title_zh: 实验：在途合并与并发上限
            description_zh: 三个组件同时要同一份数据：合并成一个请求。批量上传 10 个文件：并发池最多同时 3 个。打开「错误做法」看重复请求和同时发出 10 个请求。

      - id: CONC.LIMIT
        title_zh: 批量操作有并发上限
        statement_zh: 批量上传、批量导入、批量调用接口用并发池，同时进行的数量有上限，并显示整体进度；单项失败可以单独重试；不一次性发出全部请求。
        params:
          pool: { value: 4, unit: count, source: SRC.POMASTER.DEFAULTS, label_zh: 并发上限, note_zh: 浏览器对同一域名的并发连接有限（HTTP/1.1 通常 6 条），批量任务占 4 条，给页面其他请求留余量 }
        anchors:
          - { spec: perf, quote: 请求并发安全。 }
        enforcement: { kind: review }

      - id: CONC.BATCH
        title_zh: 多个小请求合成批量接口
        statement_zh: 要对很多对象做同一件事时调用批量接口，或在同一帧内把多个小请求合成一次；不在循环里逐条请求。
        enforcement: { kind: review }
        examples:
          - kind: dont
            title_zh: 循环里逐条请求
            code: |-
              for (const id of ids) await api.updateStatus(id, 'archived')
            lang: ts
          - kind: do
            title_zh: 批量接口
            code: |-
              await api.batchUpdateStatus({ ids, status: 'archived' })
            lang: ts

      - id: CONC.RATE_LIMIT
        title_zh: 收到限流就退避排队
        statement_zh: 收到 429 时读取 Retry-After，在客户端排队等待后再发，界面提示「请求过多，稍后自动重试」；不立即重发，不让多个组件同时各自重试。
        anchors:
          - { spec: api, quote: 409 返回冲突实体或重新获取方式；429 返回明确退避信息；5xx 不代表所有请求均可重试。 }
        enforcement: { kind: review }

      - id: CONC.VERSION
        title_zh: 写冲突用版本号
        statement_zh: 可编辑的资源带版本号（version、updatedAt 或 ETag），更新时一并提交；后端返回冲突时，给用户重新加载或比较合并的选择，不静默覆盖别人的修改。
        anchors:
          - { spec: api, quote: 可编辑资源返回 version、updatedAt 或 ETag，并在更新命令携带预期版本。 }
        enforcement: { kind: review }

      - id: CONC.REALTIME
        title_zh: 实时推送重连退避、去重保序
        statement_zh: WebSocket / SSE 断线后指数退避重连，重连后补拉断线期间的数据；消息按 messageId 去重、按序号保序；收到的消息先合并再渲染，不逐条触发整页更新。
        anchors:
          - { spec: api, quote: 必须定义鉴权、心跳、断线重连、重复、乱序、丢失、回放、完成终止和降级行为。 }
        enforcement: { kind: review }

      - id: CONC.RENDER
        title_zh: 高频更新合帧渲染
        statement_zh: 行情、日志、进度这类高频数据先进缓冲区，按动画帧（requestAnimationFrame）或固定间隔批量刷新界面；长列表虚拟化；不为每条消息触发一次状态更新。
        enforcement: { kind: review }

  # ───────────────────────────── 工程规范 · 防重复点击 ─────────────────────────────
  - key: click_guard
    title_zh: 防重复点击
    group: engineering
    prefix: CLICK
    summary_zh: 提交中锁住并显示加载；创建类写请求带幂等键；回车与按钮共用一把锁；刷新、点赞这类按钮节流或合并；重复导航不重复入栈；锁定期间有反馈；按钮锁只是体验，后端仍要幂等。
    rules:
      - id: CLICK.LOCK
        title_zh: 提交中锁住并显示加载
        statement_zh: 点击提交后按钮立即进入加载（Button 的 loading）并拒绝再次触发，请求结束（成功或失败）后解锁；锁放在提交函数里（或用 mutation 的 isPending），不只靠按钮的禁用样式。
        anchors:
          - { spec: page, quote: 提交防重复并保留失败输入。 }
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 用 mutation 的 isPending
            code: |-
              const create = useMutation({ mutationFn: (input) => api.createOrder(input, { idempotencyKey }) })
              <Button loading={create.isPending} onClick={() => !create.isPending && create.mutate(form)}>提交订单</Button>
            lang: tsx
        showcase:
          - kind: lab
            lab: click.guard
            title_zh: 实验：防重复点击
            description_zh: 连点「提交订单」五次：正确做法只发出一个请求，并且带同一个幂等键；错误做法发出五个请求、创建五张订单。

      - id: CLICK.IDEMPOTENCY
        title_zh: 创建类写请求带幂等键
        statement_zh: 创建订单、提交审批、发起支付这类写请求在表单打开时生成一个幂等键，提交和重试都复用它，成功后换新键；按钮锁只是体验保护，重复请求由后端按幂等键识别。
        params:
          header: { value: Idempotency-Key, source: SRC.IETF.IDEMPOTENCY_KEY, label_zh: 幂等键请求头 }
        anchors:
          - { spec: api, quote: 前端按钮禁用和 loading 只是体验保护，不构成业务幂等。 }
          - { spec: api, quote: MUST NOT 用按钮 loading 代替后端幂等。 }
        enforcement: { kind: review }

      - id: CLICK.ONE_PATH
        title_zh: 回车与按钮共用一把锁
        statement_zh: 表单的回车提交、按钮点击、快捷键都走同一个提交函数、共用同一把锁；不在两个地方各写一份提交逻辑。
        enforcement: { kind: review }

      - id: CLICK.THROTTLE
        title_zh: 刷新、点赞这类按钮节流或合并
        statement_zh: 刷新、点赞、收藏、切换这类可以重复触发的操作：刷新按钮在请求进行中不再发新的；点赞收藏先乐观改状态，连续点击只发最后一次的结果（防抖合并）。
        enforcement: { kind: review }

      - id: CLICK.NAVIGATION
        title_zh: 重复导航不重复入栈
        statement_zh: 连续点击同一个导航入口不重复压入历史记录、不重复打开同一个详情抽屉或新窗口；打开新窗口的操作在窗口打开前锁住。
        enforcement: { kind: review }

      - id: CLICK.FEEDBACK
        title_zh: 锁定期间有反馈
        statement_zh: 锁定期间按钮显示加载、文字说明正在做什么（「提交中…」），不静默吞掉点击；超过 1 秒还没结束的给出更明确的进度（见 SFB.PROGRESS）。
        enforcement: { kind: review }

  # ───────────────────────────── 工程规范 · 原型转换 ─────────────────────────────
  - key: prototype_intake
    title_zh: 原型转换
    group: engineering
    prefix: PROTO
    summary_zh: BA 交来的 spec 与 HTML 原型拆成四层：业务事实、信息结构、交互意图原样保留，表现全部丢掉；表现里藏着的事实翻译成语义；冲突进提问；按规范重绘后用同一个抽取器做事实对账。
    rules:
      - id: PROTO.LAYERS
        title_zh: 拆成四层，只丢表现
        statement_zh: 原型按四层读：业务事实（字段、操作、状态、有业务含义的文案）原样保留；信息结构（页面、区域、分组、顺序、主次）保留关系；交互意图（点什么打开什么、提交前校验、删除要确认）保留意图；表现（样式、栅格、间距、字体、组件长相）全部丢掉，由规范重新给出。不同 BA 写的原型结构与风格各不相同，读的是这四层，不是某一种写法。
        enforcement: { kind: review }
        showcase:
          - kind: specimen
            title_zh: 哪些保留、哪些丢掉
            description_zh: 判定口径：换一套 UI 以后，业务方会不会说「这不是我要的」——会，就是事实；不会，就是表现。
            name_label_zh: 原型里的内容
            rows:
              - name: 字段：标签、类型、必填、枚举值、校验、默认值、格式、能否编辑
                usage_zh: 业务事实 · 原样保留
                sample_zh: 保留
              - name: 操作：按钮与链接的文字、要求的权限、前置条件、是否二次确认
                usage_zh: 业务事实 · 原样保留
                sample_zh: 保留
              - name: 状态值与流转、有业务含义的文案（提示条、错误、空状态说明）
                usage_zh: 业务事实 · 原样保留
                sample_zh: 保留
              - name: 页面清单与页面类型、区域、字段分组与先后顺序、主次
                usage_zh: 信息结构 · 保留关系
                sample_zh: 保留关系
              - name: 页面之间与区域之间的跳转：点行开详情、新增开弹窗、返回
                usage_zh: 交互意图 · 保留意图
                sample_zh: 保留意图
              - name: class、内联样式、颜色、字体、字号、间距、圆角、阴影
                usage_zh: 表现 · 全部丢掉，改用规范 token
                sample_zh: 丢掉
              - name: 栅格列数、像素宽度、组件库与组件长相、图标库
                usage_zh: 表现 · 全部丢掉，改用规范组件
                sample_zh: 丢掉
              - name: 红字表示逾期、星号表示必填、删除线表示作废、右对齐表示金额
                usage_zh: 表现里藏着的事实 · 翻译成语义再保留
                sample_zh: 翻译

      - id: PROTO.EXTRACT
        title_zh: 去表现化抽取
        statement_zh: 用 pomaster prototype ingest 读原型：JS 渲染的页面先在浏览器里渲染再读（表格行、弹窗内容常常是脚本生成的）；隐藏的弹窗、抽屉也读，标为条件区域；丢掉 class、style、纯布局的包裹层，只留标题层级、地标、区域、字段、操作、表格（表头与示例行）、标签页、提示文字和状态值；每条事实带出处（文件、节点路径、文本指纹）。
        enforcement: { kind: review }
        showcase:
          - kind: lab
            lab: prototype.convert
            title_zh: 实验：原型转换与事实对账
            description_zh: 左边是一份样式很乱的原型片段；点「抽取」得到去掉表现后的大纲与事实清单；「对账」把按规范重绘的版本再抽一次，逐条比较。打开「错误做法」看重绘时漏掉一个字段、改掉一个选项后对账报出的差异。

      - id: PROTO.TRANSLATE
        title_zh: 表现里藏着的事实翻译成语义
        statement_zh: 表现里带业务含义的部分翻译成语义再保留，不照抄样子：标签旁的星号 → 必填；红色或绿色的状态文字 → 状态值与它的语气（危险、成功）；删除线 → 作废或删除状态；右对齐的数字列 → 数值列与格式；初始禁用的按钮 → 启用条件（要选中行才能用）；垃圾桶图标 → 删除意图；固定在左右的列 → 冻结列。颜色值、像素、字体名一律不带进实现。
        enforcement: { kind: review }

      - id: PROTO.SPEC_FACTS
        title_zh: spec 里读业务规则
        statement_zh: spec 按结构读而不是按格式读：字段表（中文名、英文名、类型、必填、编辑权限、枚举）、SHALL / MUST / 必须 一类规则句、枚举与默认值、状态流转、交互说明表、权限与角色表；每条带章节出处。读不出结构的段落原文保留为待确认的说明，不猜。
        enforcement: { kind: review }

      - id: PROTO.CONFLICTS
        title_zh: 冲突进提问，不自己挑
        statement_zh: spec 与 HTML 不一致（必填、枚举、字段有无）、原型与本规范冲突（例如原型每页 1000 条而规范上限 200 条）、原型里有 spec 没写的操作，都进 Question Gate 由人裁决；在裁决之前的默认口径：业务规则以 spec 为准，信息结构以 HTML 为准，呈现以本规范为准，并把这个默认写进提问里。
        enforcement: { kind: review }

      - id: PROTO.MAP
        title_zh: 映射到规范，记下依据
        statement_zh: 页面类型映射到规范的页面模板（列表、详情、表单、看板、向导），区域映射到规范的模式（筛选条、数据列表、描述列表、抽屉、分步表单……），元素映射到规范组件；每个映射在 UX 中间表示里记下依据的规则编号，后来的人和 agent 能复查。
        enforcement: { kind: review }

      - id: PROTO.REBUILD
        title_zh: 按规范重绘
        statement_zh: 重绘时布局、间距、字号、颜色、组件全部来自本规范的 token 与组件；不复制原型的 class、内联样式、字体、颜色值、栅格列数和像素宽度；原型里的分组、顺序、主次和文案保留。原型用了另一套组件库或 CDN 引入的样式框架，实现里都不出现。
        enforcement: { kind: gate, check: style.no-raw-color }

      - id: PROTO.VERIFY
        title_zh: 用同一个抽取器做事实对账
        statement_zh: 重绘完成后，用同一个抽取器读重绘后的页面，与事实清单逐条比较：缺失、改动、新增都为零（确需新增的事实走提问记录），同时规范门禁通过，才算转换完成；对账结果作为 verify 的证据。
        enforcement: { kind: review }

  - key: spec_writing
    title_zh: 写入规范
    group: engineering
    prefix: SPECW
    summary_zh: 规范条文怎么写进项目：每条规则七个字段齐全；条文自足、长期成立——不带引用、版本号、时间戳、记录人；只经 pomaster update spec 写入，写前校验，不合规直接拒绝；pomaster spec-lint 复核已有条文。
    rules:
      - id: SPECW.FIELDS
        title_zh: 每条规则七个字段齐全
        statement_zh: 写进项目的每条规则都带齐七个字段：规则、级别、适用范围、理由、检查方式、正例、反例。缺任何一个，写入口直接拒绝并说出缺了哪个。
        rationale_zh: 只有一句话的规则，读的人不知道管到哪里、为什么、怎么判定；七个字段齐了，人和 AI 才能据此写代码、做评审、接门禁。
        level: MUST
        scope_zh: 所有空间的规范条文：前端、前端服务器、后端、数据库、缓存、消息与异步、平台与运维、安全、测试
        check_zh: pomaster update spec 写前校验（缺字段报 SPEC_UPDATE_FIELDS）
        enforcement: { kind: review }
        showcase:
          - kind: specimen
            title_zh: 七个字段
            description_zh: 写入口的参数与每个字段要回答的问题。
            name_label_zh: 字段
            rows:
              - name: 规则（规范原文）
                usage_zh: 一句话写清做什么或不做什么，读完就能判断一段代码或一个界面是否合规
                sample_zh: 必填
              - name: 级别（--level）
                usage_zh: MUST / MUST NOT / SHOULD；不写时按措辞判
                sample_zh: 可推断
              - name: 适用范围（--scope）
                usage_zh: 哪个空间、哪类对象或哪些路径
                sample_zh: 必填
              - name: 理由（--why）
                usage_zh: 为什么要这样，违反的后果是什么
                sample_zh: 必填
              - name: 检查方式（--check-by）
                usage_zh: 门禁检查编号，或评审时具体看什么
                sample_zh: 必填
              - name: 正例（--do）
                usage_zh: 一个合规的具体写法
                sample_zh: 必填
              - name: 反例（--dont）
                usage_zh: 一个违规的具体写法
                sample_zh: 必填
        examples:
          - kind: do
            title_zh: 字段齐全
            code: |-
              pomaster update spec "列表接口必须分页，单页上限 200 条" \
                --scope "后端 / 所有列表查询接口" \
                --why "不分页的列表会随数据量拖垮数据库和前端" \
                --check-by "评审：接口定义里有分页参数与上限" \
                --do "GET /orders?page=1&size=50" \
                --dont "GET /orders 一次返回全部订单" \
                --by agent:implementer
            lang: text
          - kind: dont
            title_zh: 只有一句话
            code: |-
              pomaster update spec "列表接口要分页" --by agent:implementer
            lang: text

      - id: SPECW.STATEMENT
        title_zh: 一条只说一件事，读完能判定
        statement_zh: 规则正文是一句可判定的话：说清对象和要求，读完就能判断合规与否；两件事拆成两条，形容词换成可检查的条件。
        rationale_zh: 一条里塞几件事，评审时只要有一件没做到就说不清是哪条没过；「合理」「适当」这类词没法判定。
        level: MUST
        scope_zh: 所有规范条文的规则正文
        check_zh: 评审：正文能否直接判定一个具体写法合规与否
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 可判定
            code: 表格的操作列固定在右侧，最多放三个文字按钮，更多操作收进「更多」下拉。
            lang: text
          - kind: dont
            title_zh: 没法判定
            code: 表格操作要合理布局，按钮数量适当，同时注意性能和权限。
            lang: text

      - id: SPECW.SELF_CONTAINED
        title_zh: 条文自足，不带引用
        statement_zh: 条文里不放链接、把读者引到别处的措辞、文档路径、章节编号和变更编号；外部材料里的要求直接写成规则本身。
        rationale_zh: 引用会过期、会失效，也逼着读的人和 AI 再去找一份文档；写进项目的规范要能单独成立。
        level: MUST NOT
        scope_zh: 规则、理由、适用范围、检查方式、正例、反例各字段，以及规范文档的正文
        check_zh: pomaster update spec 写前校验（SPEC_UPDATE_CONTENT）；pomaster spec-lint 复核已有条文
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 要求写在条文里
            code: 所有交互元素都能用键盘到达并操作，Tab 顺序与视觉顺序一致。
            lang: text
          - kind: dont
            title_zh: 把读者引到别处
            code: 键盘可达性要求详见 docs/a11y.md 第 3 节，另见 PR #128 的讨论。
            lang: text

      - id: SPECW.NO_VERSION
        title_zh: 不写版本号
        statement_zh: 条文里不写版本号——带点的版本串、包名加版本、主版本线都不写；用到的库和工具的版本只记在项目技术基线里，条文写成不随版本变的规则。
        rationale_zh: 版本一升级，带版本号的条文就过期了，还会和技术基线的记录打架；版本有唯一的记录处，条文只说规则。
        level: MUST NOT
        scope_zh: 所有规范条文；版本记录在技术基线（pomaster baseline）
        check_zh: pomaster update spec 写前校验；pomaster spec-lint 复核已有条文
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 规则不随版本变
            code: 组件库按需引入，不整包注册；用到的组件在入口逐个登记。
            lang: text
          - kind: dont
            title_zh: 条文里钉版本
            code: 使用 ant-design-vue 4.2.6，按需引入组件。
            lang: text

      - id: SPECW.TIMELESS
        title_zh: 不写时间戳与一次性措辞
        statement_zh: 条文里不写日期、时刻，也不写只在某一段时间成立的话（指某一轮工作、某个截止点、待办标记）；规则写下就长期成立，什么时候写的由版本库记录。
        rationale_zh: 带日期的条文让人分不清规则还算不算数；临时的说法写进规范，就会被当成长期规则执行。
        level: MUST NOT
        scope_zh: 所有规范条文
        check_zh: pomaster update spec 写前校验；pomaster spec-lint 复核已有条文
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 长期成立
            code: 金额列右对齐，统一保留两位小数，千分位分隔。
            lang: text
          - kind: dont
            title_zh: 带时间
            code: 金额列暂时先左对齐，本轮结束后再统一（2026-11-11 定）。
            lang: text

      - id: SPECW.NO_PROVENANCE
        title_zh: 不写记录人与会话标记
        statement_zh: 条文里不写是谁写的、在哪次会话或提交里定的（human:<名字>、agent:<名字>、提交哈希、会话编号）；写入口只把记录人放进命令结果。
        rationale_zh: 规则的效力不取决于谁写的；记录人写进正文只会变成噪音，追溯交给版本库。
        level: MUST NOT
        scope_zh: 所有规范条文
        check_zh: pomaster update spec 写前校验；pomaster spec-lint 复核已有条文
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 只有规则
            code: 删除操作必须二次确认，确认框写明删除对象的名称。
            lang: text
          - kind: dont
            title_zh: 带记录人
            code: 删除操作必须二次确认（agent:implementer 提议，human:owner 同意）。
            lang: text

      - id: SPECW.WRITE_PATH
        title_zh: 只经写入口写，写后复核
        statement_zh: 新规范一律用 pomaster update spec 写：它按领域与主题找到该写的位置，写前做字段与内容校验；改动已有条文后跑 pomaster spec-lint，零问题才算写完。
        rationale_zh: 手写容易写错位置、漏字段、夹带引用；走同一个写入口，规范的形态和位置才一致，Storybook 与 AI 读到的才是同一份。
        level: MUST
        scope_zh: 往项目规范里加、改条文的所有操作（人和 AI 都一样）
        check_zh: pomaster spec-lint 退出码为 0
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 走写入口并复核
            code: |-
              pomaster update spec "<规则>" --scope … --why … --check-by … --do … --dont … --by agent:<名字>
              pomaster spec-lint
            lang: text
          - kind: dont
            title_zh: 直接改文件
            code: 打开 .pomaster/specs/hard/themes/security.md，在末尾随手加一行「注意 XSS」。
            lang: text
