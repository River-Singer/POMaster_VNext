code_scan_spec:
  file_scope: src/**/*.ts, src/**/*.vue
  line_limit: whole_file（领域 token 常居数据面中部，非仅头 30 行）
  token_rx: \b(?:CALC-[A-Z]+(?:-[A-Z0-9]+)*|NEG\.[A-Z0-9.\-]+|STATE-[A-Z0-9\-]+|MACHINE-[A-Z0-9\-]+|FIELD\.[A-Za-z0-9\-.\u4e00-\u9fff]+|TRANSITION-[0-9A-F]{16})
denominators_note: CALC 分母=formulas 59（wired true 6/false 53）；formatter 分母=formatters 10；state owner 标签分母=distinct owner 97 种（entities 约定词形 24 种 + local 方言）；MACHINE/STATE 族 registry 侧分母 33/464、NEG 64、FIELD 785、TRANSITION-<HEX> 311。与 inventory.yaml denominators 同源。
