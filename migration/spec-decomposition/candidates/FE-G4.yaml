# ============ 文件 1/10: frontend/21-design-system-protocol.md (sha256 66f7a7ab4292ab17ae578c338da04833e4705e027aebacce09693fb67e166c9d) ============

- proposed_id: POLICY.WEB.DS.VISUAL_SOURCE_TOKEN_ONLY
  source_section: MUST + MUST NOT
  source_protocol: .trellis/spec/frontend/21-design-system-protocol.md
  source_lines: L19-L21, L95-L97
  source_sha256: 66f7a7ab4292ab17ae578c338da04833e4705e027aebacce09693fb67e166c9d
  classification: UNIVERSAL_POLICY
  sort: UNIVERSAL
  kind_proposal: policy
  enforcement: required_when_applicable
  vocab_pr_needed: true
  statement_zh: 界面的一切视觉规则只能取自设计令牌与经批准的组件清单两个来源；孤立取色、随手指定间距、临时阴影、『看起来接近』的目测替代，以及在业务页面滋生第二套视觉语言，一律禁止。
  statement_en_keywords: visual rules source, design tokens, approved components, no orphan values, no second visual language
  clean_room: true
  applies_when: {lane: frontend, condition: 编写或评审任何携带视觉表现的界面代码时}
  cross_refs: [POLICY.WEB.STYLE.OWNERSHIP_MATRIX]
  notes: 正面来源约束（token + 批准组件）超出 OWNERSHIP_MATRIX 的样式写权限矩阵（后者管写入归属，本卡管取值来源），不构成重复；MUST NOT 四条（孤立值/近似替代/第二套语言/临时样式）中前三条并入本卡禁止形态段，第四条独立成卡（DRAFT_VALUE_NOT_TOKEN_OVERRIDE）
- proposed_id: POLICY.WEB.DS.VISUAL_STATE_COMPLETENESS
  source_section: MUST
  source_protocol: .trellis/spec/frontend/21-design-system-protocol.md
  source_lines: L21
  source_sha256: 66f7a7ab4292ab17ae578c338da04833e4705e027aebacce09693fb67e166c9d
  classification: UNIVERSAL_POLICY
  sort: UNIVERSAL
  kind_proposal: policy
  enforcement: required_when_applicable
  vocab_pr_needed: true
  statement_zh: 每一类可交互元素都必须给齐全套视觉状态——悬停、激活、焦点、禁用、加载、空、错误——缺任何一个状态都视为交付未完成。
  statement_en_keywords: visual state completeness, hover, active, focus, disabled, loading, empty, error
  clean_room: true
  applies_when: {lane: frontend, condition: 设计或实现可交互元素时}
  cross_refs: [POLICY.WEB.COMP.STATE_SET_IN_CONTRACT]
  uncertainty: 与 24 组件协议『状态至少考虑 loading/empty/error/disabled/readonly/focus』语义高度相邻（本卡为视觉状态视角、彼卡为组件契约视角，交集 5/7），保留两卡互引而非合并；汇总组可裁并条
- proposed_id: POLICY.WEB.DS.TOKEN_MAP_SINGLE_SOURCE
  source_section: MUST
  source_protocol: .trellis/spec/frontend/21-design-system-protocol.md
  source_lines: L22
  source_sha256: 66f7a7ab4292ab17ae578c338da04833e4705e027aebacce09693fb67e166c9d
  classification: UNIVERSAL_POLICY
  sort: UNIVERSAL
  kind_proposal: policy
  enforcement: required_when_applicable
  vocab_pr_needed: true
  statement_zh: 同一令牌在代码侧与设计工具侧的对应关系必须由唯一登记来源定义，两侧取值不允许各自为政。
  statement_en_keywords: token mapping, single source, design tool parity
  clean_room: true
  applies_when: {lane: frontend, condition: 维护令牌体系或同步设计工具时}
- proposed_id: POLICY.WEB.DS.TOKEN_SOURCE_REGENERATION
  source_section: 项目强制规则·token 事实源与生成
  source_protocol: .trellis/spec/frontend/21-design-system-protocol.md
  source_lines: L60-L64, L103
  source_sha256: 66f7a7ab4292ab17ae578c338da04833e4705e027aebacce09693fb67e166c9d
  classification: LANE_POLICY
  sort: HYBRID
  kind_proposal: policy
  enforcement: required_when_applicable
  vocab_pr_needed: true
  statement_zh: 视觉值的新增与修改只能落在令牌事实源并触发派生产物重新生成；直接编辑派生产物、或在页面里书写游离于令牌体系之外的值，都会在下一次生成时被静默冲掉，一律禁止。
  statement_en_keywords: token source of truth, derived artifacts, regeneration, no hand edit
  clean_room: true
  applies_when: {lane: frontend, condition: 项目建立令牌生成管道后修改任何视觉值时}
  project_scope: 事实源与派生产物的具体路径、生成命令、UI 库变量桥接均由项目基线登记（源文示例为 tokens.json→tokens.css 管道）
  cross_refs: [POLICY.WEB.STYLE.OWNERSHIP_MATRIX]
  notes: OWNERSHIP_MATRIX design-token 域禁手改『令牌源文件』；本卡禁手改『派生产物』并要求单向再生——对象不同，互补非重复；与 25 页面结构 DERIVED_VIEW_REGENERATION 同构（生成物纪律族）
- proposed_id: POLICY.WEB.DS.LIBRARY_THEME_OVERRIDDEN_BY_TOKENS
  source_section: 项目强制规则·token 事实源与生成 + 项目禁止
  source_protocol: .trellis/spec/frontend/21-design-system-protocol.md
  source_lines: L62, L102
  source_sha256: 66f7a7ab4292ab17ae578c338da04833e4705e027aebacce09693fb67e166c9d
  classification: LANE_POLICY
  sort: HYBRID
  kind_proposal: policy
  enforcement: required_when_applicable
  vocab_pr_needed: true
  statement_zh: 第三方组件库自带的出厂主题永远不能成为项目视觉基准：库的主题变量必须被项目令牌单向覆盖，而不是反过来让出厂值决定项目长相。
  statement_en_keywords: vendor default theme, token override direction, no factory palette as baseline
  clean_room: true
  applies_when: {lane: frontend, condition: 引入或配置第三方组件库主题时}
  cross_refs: [POLICY.WEB.STYLE.OWNERSHIP_MATRIX]
  uncertainty: 与 OWNERSHIP_MATRIX vendor-adapter 域（禁页面局部覆盖第三方主题）方向互补——彼卡管『谁有权调第三方视觉』（只许适配层），本卡管『项目令牌与出厂值的覆盖方向』；自判不重复，提请汇总组复核
- proposed_id: POLICY.WEB.DS.DRAFT_VALUE_NOT_TOKEN_OVERRIDE
  source_section: MUST NOT
  source_protocol: .trellis/spec/frontend/21-design-system-protocol.md
  source_lines: L98
  source_sha256: 66f7a7ab4292ab17ae578c338da04833e4705e027aebacce09693fb67e166c9d
  classification: UNIVERSAL_POLICY
  sort: UNIVERSAL
  kind_proposal: policy
  enforcement: required_when_applicable
  vocab_pr_needed: true
  statement_zh: 设计稿或原型里出现的临时数值没有资格直接压过已登记令牌；双方不一致时必须回到令牌事实源裁决，而不是在实现里就地改值迁就截图。
  statement_en_keywords: design draft values, no token override, resolve at token source
  clean_room: true
  applies_when: {lane: frontend, condition: 依据设计稿实现且发现与令牌不一致时}
  cross_refs: [POLICY.SPEC.DRAFT_NOT_BASELINE]
  notes: 与 POLICY.SPEC.DRAFT_NOT_BASELINE（草稿内容不得当基线执行）精神同源但对象不同——彼卡管变更治理中的草稿态内容，本卡管视觉值域的设计稿临时值；保留独立卡
- proposed_id: POLICY.WEB.DS.VISUAL_BASELINE_PROTOTYPE
  source_section: 项目强制规则·视觉基线来源
  source_protocol: .trellis/spec/frontend/21-design-system-protocol.md
  source_lines: L27-L38
  source_sha256: 66f7a7ab4292ab17ae578c338da04833e4705e027aebacce09693fb67e166c9d
  classification: PROJECT_BASELINE_TEMPLATE
  sort: PROJECT
  kind_proposal: policy
  enforcement: required_when_applicable
  vocab_pr_needed: true
  statement_zh: 本项目视觉基线以原型为准并经设计知识库独立校验，适用范围限于色彩令牌、布局密度与排版层级三类；操作形态（按钮构成、图标文字组合、语义变体映射）不构成基线、不作为照抄依据，一律以组件协议与操作放置登记表为准。
  statement_en_keywords: visual baseline, prototype authority, scoped applicability, operation forms excluded
  clean_room: true
  applies_when: {lane: frontend, condition: 确定项目视觉基准或对照原型实现时}
  project_scope: 基线来源（原型 + 设计知识库校验）与主色等具体色值为 MASTer 项目裁定（2026-08-17 决议语境）
  cross_refs: [POLICY.WEB.UIUX.PROVIDER_EVIDENCE_NOT_BUSINESS_TRUTH]
  notes: 与既有 PROVIDER_EVIDENCE_NOT_BUSINESS_TRUTH 部分同构——『操作形态不构成基线』半边正是『原型抽取非业务事实』在视觉域的投影；『原型是视觉基线』半边为项目专属决定，两半合一故标 PROJECT 非重复
- proposed_id: POLICY.WEB.DS.LIGHT_DOMINANT_PALETTE
  source_section: 项目强制规则·浅色主导与深色配额
  source_protocol: .trellis/spec/frontend/21-design-system-protocol.md
  source_lines: L40-L44, L110
  source_sha256: 66f7a7ab4292ab17ae578c338da04833e4705e027aebacce09693fb67e166c9d
  classification: PROJECT_BASELINE_TEMPLATE
  sort: PROJECT
  kind_proposal: policy
  enforcement: required_when_applicable
  vocab_pr_needed: true
  statement_zh: 本项目界面以浅白为主导面；深色只允许出现在文字、图标、极小面积强调与遮罩上，不得充任侧边导航、顶栏、卡片或表格的大面积底色；层次表达优先用边框、极浅底色差与间距，投影其次。
  statement_en_keywords: light dominant surface, dark quota, hierarchy via border and spacing
  clean_room: true
  applies_when: {lane: frontend, condition: 确定界面明度方向或评审大面积用色时}
  project_scope: 明度方向为 MASTer 项目视觉裁定（密集数据看板语境）
- proposed_id: POLICY.WEB.DS.SHADOW_FOCUS_TIERS
  source_section: 项目强制规则·视觉克制 + 项目禁止
  source_protocol: .trellis/spec/frontend/21-design-system-protocol.md
  source_lines: L46-L50, L111-L113
  source_sha256: 66f7a7ab4292ab17ae578c338da04833e4705e027aebacce09693fb67e166c9d
  classification: PROJECT_BASELINE_TEMPLATE
  sort: PROJECT
  kind_proposal: policy
  enforcement: required_when_applicable
  vocab_pr_needed: true
  statement_zh: 本项目投影与焦点表达按固定档位封顶：投影分五档且全部使用低透明度冷灰，焦点使用 2 像素实心焦点环加 1 像素偏移、取主色；发光边缘、外扩光晕、霓虹描边、大面积多层投影、毛玻璃模糊与装饰性渐变全部禁用。
