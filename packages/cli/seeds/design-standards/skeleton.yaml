  # ═════════════════════════════ 设计模式 · 体验管理 ═════════════════════════════
  - key: ui_stills
    title_zh: 界面静帧
    group: patterns.experience
    prefix: STILL
    summary_zh: 文档、功能卡片、空状态与引导里的产品静帧：像真产品、只给故事主角真实文字、裁切有意图、一个焦点、按展示尺寸设计、动画先定封面帧、用规范组件与图标。
    topics:
      - { id: STILL.WHEN, title_zh: 什么时候用静帧 }
      - { id: STILL.RESTRAINT, title_zh: 只给故事主角真实文字 }
      - { id: STILL.FRAMING, title_zh: 裁切与出血 }
      - { id: STILL.FOCAL, title_zh: 一个焦点 }
      - { id: STILL.SCALE, title_zh: 按展示尺寸设计 }
      - { id: STILL.POSTER, title_zh: 动画先定封面帧 }
      - { id: STILL.REAL_PARTS, title_zh: 用规范组件与图标 }
  - key: component_motion
    title_zh: 组件动效
    group: patterns.experience
    prefix: CMOTION
    summary_zh: 动效只说明变化：每个动作有原因；出现和离开都有过渡；动关系而不只动对象；数字与文字就地变化；成组只在首次出现时错峰；可以打断；只动 transform 与透明度；减少动效时状态变化仍看得见。
    topics:
      - { id: CMOTION.CAUSE, title_zh: 每个动作有原因 }
      - { id: CMOTION.ENTER_EXIT, title_zh: 出现与离开 }
      - { id: CMOTION.RELATIONSHIP, title_zh: 动关系而不只动对象 }
      - { id: CMOTION.VALUE_CHANGE, title_zh: 数字与文字就地变化 }
      - { id: CMOTION.STAGGER, title_zh: 成组错峰只在首次出现 }
      - { id: CMOTION.INTERRUPT, title_zh: 可以打断 }
      - { id: CMOTION.PERF, title_zh: 只动 transform 与透明度 }
      - { id: CMOTION.REDUCED, title_zh: 减少动效时保留状态变化 }
  - key: bento_grid
    title_zh: Bento 栅格
    group: patterns.experience
    prefix: BENTO
    summary_zh: 一组格子拼成一张图：一个主角格；格子不全是界面截图，邻格类型交替；同一套外框；跨度取栅格整数；数字格一行写完；窄屏重新排；可点的格整格可点。
    topics:
      - { id: BENTO.WHEN, title_zh: 什么时候用 }
      - { id: BENTO.HERO, title_zh: 一个主角格 }
      - { id: BENTO.KINDS, title_zh: 邻格类型交替 }
      - { id: BENTO.FRAME, title_zh: 同一套外框 }
      - { id: BENTO.SPANS, title_zh: 跨度取栅格整数 }
      - { id: BENTO.STAT, title_zh: 数字格一行写完 }
      - { id: BENTO.RESPONSIVE, title_zh: 窄屏重新排 }
      - { id: BENTO.CLICK, title_zh: 可点的格整格可点 }
  - key: state_feedback
    title_zh: 状态反馈
    group: patterns.experience
    prefix: SFB
    summary_zh: 每个数据视图都有完整的状态；反馈出现在动作发生的地方；确认的力度跟操作的分量走；乐观更新只用于可回滚的小操作；能撤销就不弹确认；长操作给进度；读屏能感知状态变化。
    topics:
      - { id: SFB.STATES, title_zh: 每个视图都有完整状态 }
      - { id: SFB.IN_PLACE, title_zh: 反馈出现在动作发生的地方 }
      - { id: SFB.WEIGHT, title_zh: 确认的力度跟操作的分量走 }
      - { id: SFB.OPTIMISTIC, title_zh: 乐观更新只用于可回滚的小操作 }
      - { id: SFB.UNDO, title_zh: 能撤销就不弹确认 }
      - { id: SFB.PROGRESS, title_zh: 长操作给进度 }
      - { id: SFB.LIVE, title_zh: 读屏能感知状态变化 }
  - key: context
    title_zh: 上下文管理
    group: patterns.experience
    prefix: CTX
    summary_zh: 保住用户的位置（分页、筛选、滚动、选中）；未保存的内容有去处；就地操作与工具栏一致；当前位置始终可见；切换团队或身份时显式清理；代码里的上下文只放稳定的跨层依赖。
    topics:
      - { id: CTX.PRESERVE, title_zh: 保住用户的位置 }
      - { id: CTX.DRAFTS, title_zh: 未保存的内容有去处 }
      - { id: CTX.INLINE_ACTIONS, title_zh: 就地操作与工具栏一致 }
      - { id: CTX.WAYFINDING, title_zh: 当前位置始终可见 }
      - { id: CTX.SCOPE_SWITCH, title_zh: 切换团队或身份时显式清理 }
      - { id: CTX.PROVIDER, title_zh: 代码里的上下文只放稳定的跨层依赖 }
  - key: sidebar
    title_zh: 侧边栏管理
    group: patterns.experience
    prefix: SIDEBAR
    summary_zh: 宽度取规范值；收起后只留图标并有名字；收起状态按用户记住；窄屏变抽屉；当前项与路由同源；最多两级；分组按使用频率；自己滚动、底部固定；键盘可操作。
    topics:
      - { id: SIDEBAR.WIDTH, title_zh: 宽度取规范值 }
      - { id: SIDEBAR.COLLAPSE, title_zh: 收起与展开 }
      - { id: SIDEBAR.ACTIVE, title_zh: 当前项与路由同源 }
      - { id: SIDEBAR.DEPTH, title_zh: 最多两级 }
      - { id: SIDEBAR.GROUPS, title_zh: 分组按使用频率 }
      - { id: SIDEBAR.SCROLL, title_zh: 自己滚动、底部固定 }
      - { id: SIDEBAR.KEYBOARD, title_zh: 键盘可操作 }
  - key: card_hover
    title_zh: 卡片悬停
    group: patterns.experience
    prefix: HOVER
    summary_zh: 悬停只表示可点；幅度克制（边框或阴影升一级，不缩放）；不引起布局移动；键盘焦点的反馈不弱于悬停；触屏不依赖悬停；悬停才出现的操作不挤开内容；时长取 token。
    topics:
      - { id: HOVER.SIGNAL, title_zh: 悬停只表示可点 }
      - { id: HOVER.SUBTLE, title_zh: 幅度克制 }
      - { id: HOVER.NO_SHIFT, title_zh: 不引起布局移动 }
      - { id: HOVER.FOCUS_PARITY, title_zh: 焦点反馈不弱于悬停 }
      - { id: HOVER.TOUCH, title_zh: 触屏不依赖悬停 }
      - { id: HOVER.REVEAL, title_zh: 悬停出现的操作不挤开内容 }
      - { id: HOVER.TIMING, title_zh: 时长取 token }
  - key: loading_bar
    title_zh: 加载条
    group: patterns.experience
    prefix: LBAR
    summary_zh: 选对加载形态；快的请求不显示加载条，出现后至少停留一会儿；不确定进度时缓慢推进、完成时补满；全局只有一条；有确切进度时显示百分比与剩余并能取消；读屏能感知。
    topics:
      - { id: LBAR.KIND, title_zh: 选对加载形态 }
      - { id: LBAR.DELAY, title_zh: 快的不显示，出现了停一会儿 }
      - { id: LBAR.TRICKLE, title_zh: 不确定进度时缓慢推进 }
      - { id: LBAR.SINGLE, title_zh: 全局只有一条 }
      - { id: LBAR.DETERMINATE, title_zh: 确定进度显示百分比与剩余 }
      - { id: LBAR.A11Y, title_zh: 读屏能感知 }
  # ═════════════════════════════ 设计模式 · 数据呈现 ═════════════════════════════
  - key: data_grid
    title_zh: 数据网格
    group: patterns.data
    prefix: DGRID
    summary_zh: 先分清表格与数据网格；列的对齐、冻结与宽度有规则；排序筛选在服务端并进 URL；跨页选择说清范围；大数据虚拟滚动；行内编辑可撤回；密度三档按用户记住；空与加载保持列结构。
    topics:
      - { id: DGRID.WHEN, title_zh: 表格还是数据网格 }
      - { id: DGRID.COLUMNS, title_zh: 列的对齐、冻结与宽度 }
      - { id: DGRID.SORT_FILTER, title_zh: 排序与筛选在服务端并进 URL }
      - { id: DGRID.SELECTION, title_zh: 跨页选择说清范围 }
      - { id: DGRID.VIRTUAL, title_zh: 大数据虚拟滚动 }
      - { id: DGRID.EDIT, title_zh: 行内编辑可撤回 }
      - { id: DGRID.DENSITY, title_zh: 密度三档按用户记住 }
      - { id: DGRID.EMPTY_LOADING, title_zh: 空与加载保持列结构 }
  - key: charts
    title_zh: 图表
    group: patterns.data
    prefix: CHART
    summary_zh: 图表库全项目一个；按问题选图；配色取 token、不只靠颜色区分；坐标轴与单位写清，柱状图从 0 开始；提示给精确值与口径；空、加载、出错与列表一致；提供数据表替代；大数据降采样；随容器重绘、卸载时销毁。
    topics:
      - { id: CHART.LIBRARY, title_zh: 图表库全项目一个 }
      - { id: CHART.CHOOSE, title_zh: 按问题选图 }
      - { id: CHART.COLOR, title_zh: 配色取 token、不只靠颜色 }
      - { id: CHART.AXES, title_zh: 坐标轴与单位写清 }
      - { id: CHART.TOOLTIP, title_zh: 提示给精确值与口径 }
      - { id: CHART.STATES, title_zh: 空、加载、出错与列表一致 }
      - { id: CHART.A11Y, title_zh: 提供数据表替代 }
      - { id: CHART.PERF, title_zh: 大数据降采样 }
      - { id: CHART.LIFECYCLE, title_zh: 随容器重绘、卸载时销毁 }
  - key: reports
    title_zh: 报表
    group: patterns.data
    prefix: REPORT
    summary_zh: 报表结构固定（标题与口径、筛选、指标、明细）；口径与数据截至时间写清；筛选与对比期进 URL；合计与小计规则明确；数字格式统一；导出与页面同口径并受权限控制；打印有专门样式；大报表服务端聚合。
    topics:
      - { id: REPORT.STRUCTURE, title_zh: 报表结构固定 }
      - { id: REPORT.DEFINITIONS, title_zh: 口径与截至时间写清 }
      - { id: REPORT.FILTERS, title_zh: 筛选与对比期进 URL }
      - { id: REPORT.TOTALS, title_zh: 合计与小计规则明确 }
      - { id: REPORT.NUMBERS, title_zh: 数字格式统一 }
      - { id: REPORT.EXPORT, title_zh: 导出与页面同口径并受权限控制 }
      - { id: REPORT.PRINT, title_zh: 打印有专门样式 }
      - { id: REPORT.PERF, title_zh: 大报表服务端聚合 }
  - key: architecture
    title_zh: 前端架构
    group: engineering
    prefix: ARCH
    summary_zh: 技术栈以项目基线为准：Vue 3 + TypeScript + Vite、ant-design-vue、vue-router、Pinia、TanStack Query；目录按职责分层，模块只经公开入口互相引用；单文件组件 + 组合式函数；接口客户端由 OpenAPI 生成；表单、路由、类型与测试各有固定做法。
    topics:
      - { id: ARCH.STACK, title_zh: 技术栈以基线为准，同类库只用一套 }
      - { id: ARCH.LAYOUT, title_zh: 目录按职责分层 }
      - { id: ARCH.BOUNDARY, title_zh: 模块只经公开入口互相引用 }
      - { id: ARCH.COMPONENT, title_zh: 组件写法 }
      - { id: ARCH.UI_LIBRARY, title_zh: 组件库怎么用、怎么改 }
      - { id: ARCH.DATA_LAYER, title_zh: 接口请求层 }
      - { id: ARCH.FORMS, title_zh: 表单 }
      - { id: ARCH.ROUTING, title_zh: 路由组织 }
      - { id: ARCH.TYPES, title_zh: 类型严格、接口类型生成 }
      - { id: ARCH.TESTING, title_zh: 测试分层 }
  # ═════════════════════════════ 工程规范 ═════════════════════════════
  - key: state
    title_zh: 状态管理
    group: engineering
    prefix: STATE
    summary_zh: 每份状态先定属主再定存放处：服务端数据进查询缓存，跨页稳定状态进全局 store，可分享的视图状态进 URL。
    topics:
      - { id: STATE.OWNERSHIP, title_zh: 状态放哪 }
      - { id: STATE.SERVER_STATE, title_zh: 服务端数据 }
      - { id: STATE.GLOBAL_STORE, title_zh: 全局 store }
      - { id: STATE.URL, title_zh: URL 状态 }
      - { id: STATE.REQUESTS, title_zh: 请求入口 }
      - { id: STATE.CACHE_KEYS, title_zh: 缓存 key 与失效 }
      - { id: STATE.CLEANUP, title_zh: 清理与竞态 }
      - { id: STATE.FORM_MODEL, title_zh: 表单模型 }
      - { id: STATE.BROWSER_STORAGE, title_zh: 浏览器存储 }
  - key: performance
    title_zh: 性能
    group: engineering
    prefix: PERF
    summary_zh: 先定预算；按需加载；大列表分页与虚拟化；输入防抖；并行初始化；渲染里不做重计算；度量分清口径。
    topics:
      - { id: PERF.BUDGET, title_zh: 性能预算 }
      - { id: PERF.LAZY_LOAD, title_zh: 按需加载 }
      - { id: PERF.ON_DEMAND_LIBRARY, title_zh: 组件库按需引入 }
      - { id: PERF.LARGE_LISTS, title_zh: 大列表 }
      - { id: PERF.INPUT, title_zh: 输入与过期响应 }
      - { id: PERF.PARALLEL_INIT, title_zh: 并行初始化 }
      - { id: PERF.COMPUTE, title_zh: 渲染计算 }
      - { id: PERF.MEASURE, title_zh: 度量口径 }
  - key: security
    title_zh: 安全
    group: engineering
    prefix: SEC
    summary_zh: 不可信内容不进危险渲染；链接与跳转走白名单；状态变更请求带 CSRF 防护；不用 eval 一类动态执行；第三方脚本登记并校验完整性；前端隐藏不是鉴权；敏感值不出现在 URL、日志、埋点和剪贴板；跨窗口消息校验来源。
    topics:
      - { id: SEC.XSS, title_zh: 不可信内容不进危险渲染 }
      - { id: SEC.LINKS, title_zh: 链接与跳转走白名单 }
      - { id: SEC.CSRF, title_zh: 状态变更请求带 CSRF 防护 }
      - { id: SEC.NO_EVAL, title_zh: 不用动态执行 }
      - { id: SEC.THIRD_PARTY, title_zh: 第三方脚本登记并校验完整性 }
      - { id: SEC.AUTHZ_UI, title_zh: 前端隐藏不是鉴权 }
      - { id: SEC.SENSITIVE, title_zh: 敏感值不外泄 }
      - { id: SEC.POSTMESSAGE, title_zh: 跨窗口消息校验来源 }
  - key: session
    title_zh: 会话与凭据
    group: engineering
    prefix: SESSION
    summary_zh: 凭据放在脚本读不到的地方；Cookie 属性收紧；登录后换会话；空闲与绝对超时；敏感操作重新验证；静默刷新只试一次；登出全面清理并同步到所有标签页；非必要 Cookie 先征得同意。
    topics:
      - { id: SESSION.STORAGE, title_zh: 凭据放在脚本读不到的地方 }
      - { id: SESSION.COOKIE, title_zh: Cookie 属性收紧 }
      - { id: SESSION.ROTATE, title_zh: 登录后换会话 }
      - { id: SESSION.TIMEOUT, title_zh: 空闲与绝对超时 }
      - { id: SESSION.STEP_UP, title_zh: 敏感操作重新验证 }
      - { id: SESSION.REFRESH, title_zh: 静默刷新只试一次 }
      - { id: SESSION.LOGOUT, title_zh: 登出全面清理并同步 }
      - { id: SESSION.CONSENT, title_zh: 非必要 Cookie 先征得同意 }
  - key: tamper
    title_zh: 防篡改与防劫持
    group: engineering
    prefix: TAMPER
    summary_zh: 前端的一切都可被篡改：价格、权限、状态以服务端为准；关键写请求防重放；传输全程 HTTPS 与 HSTS；页面不被别人嵌套（防点击劫持）；外链防反向标签页劫持；本地数据读回先校验；前端混淆不是安全措施。
    topics:
      - { id: TAMPER.SERVER_TRUTH, title_zh: 以服务端为准 }
      - { id: TAMPER.REPLAY, title_zh: 关键写请求防重放 }
      - { id: TAMPER.TRANSPORT, title_zh: 传输全程 HTTPS }
      - { id: TAMPER.FRAMING, title_zh: 页面不被别人嵌套 }
      - { id: TAMPER.TABNABBING, title_zh: 外链防反向标签页劫持 }
      - { id: TAMPER.LOCAL_DATA, title_zh: 本地数据读回先校验 }
      - { id: TAMPER.OBFUSCATION, title_zh: 前端混淆不是安全措施 }
  - key: robustness
    title_zh: 健壮性
    group: engineering
    prefix: ROBUST
    summary_zh: 接口数据在边界按契约解析；渲染不怕空值与缺字段；每个请求有超时；离线和弱网有处理；非核心模块失败不影响主流程；界面承受重复与乱序；资源在卸载时清理；输入上限前端先拦。
    topics:
      - { id: ROBUST.PARSE, title_zh: 接口数据在边界按契约解析 }
      - { id: ROBUST.NULLS, title_zh: 渲染不怕空值与缺字段 }
      - { id: ROBUST.TIMEOUT, title_zh: 每个请求有超时 }
      - { id: ROBUST.OFFLINE, title_zh: 离线和弱网有处理 }
      - { id: ROBUST.DEGRADE, title_zh: 非核心模块失败不影响主流程 }
      - { id: ROBUST.REPEAT_ORDER, title_zh: 承受重复与乱序 }
      - { id: ROBUST.CLEANUP, title_zh: 资源在卸载时清理 }
      - { id: ROBUST.LIMITS, title_zh: 输入上限前端先拦 }
  - key: error_handling
    title_zh: 报错管理
    group: engineering
    prefix: ERRH
    summary_zh: 错误归一成统一结构；按状态码分别处理；路由级与区块级错误边界，局部失败不白屏；全局兜底捕获并脱敏上报；文案说清发生了什么、怎么办；不吞错误；错误码到界面状态的映射只有一份。
    topics:
      - { id: ERRH.NORMALIZE, title_zh: 错误归一成统一结构 }
      - { id: ERRH.MAPPING, title_zh: 按状态码分别处理 }
      - { id: ERRH.BOUNDARY, title_zh: 局部失败不白屏 }
      - { id: ERRH.GLOBAL, title_zh: 全局兜底捕获并脱敏上报 }
      - { id: ERRH.MESSAGE, title_zh: 文案说清发生了什么、怎么办 }
      - { id: ERRH.NO_SWALLOW, title_zh: 不吞错误 }
      - { id: ERRH.REPORT, title_zh: 上报可定位、不刷屏 }
  - key: route_guard
    title_zh: 保护页
    group: engineering
    prefix: GUARD
    summary_zh: 每个路由声明访问要求；守卫集中在路由层；未登录去登录再回来；无权限与不存在有统一的页面；判定完成前不渲染受保护内容；会话过期保住现场；按钮级权限规则统一。
    topics:
      - { id: GUARD.DECLARE, title_zh: 每个路由声明访问要求 }
      - { id: GUARD.CENTRAL, title_zh: 守卫集中在路由层 }
      - { id: GUARD.LOGIN_REDIRECT, title_zh: 未登录去登录再回来 }
      - { id: GUARD.FORBIDDEN, title_zh: 无权限与不存在有统一的页面 }
      - { id: GUARD.NO_FLASH, title_zh: 判定完成前不渲染受保护内容 }
      - { id: GUARD.EXPIRED, title_zh: 会话过期保住现场 }
      - { id: GUARD.BUTTON, title_zh: 按钮级权限规则统一 }
  - key: page_loading
    title_zh: 页面加载
    group: engineering
    prefix: PLOAD
    summary_zh: 路由分包并预取；首屏骨架保持布局；先框架后数据、核心优先；异步加载的边界给全加载、出错、超时；分包加载失败能自愈；不跳布局；字体与图片有加载策略。
    topics:
      - { id: PLOAD.SPLIT, title_zh: 路由分包并预取 }
      - { id: PLOAD.SKELETON, title_zh: 首屏骨架保持布局 }
      - { id: PLOAD.PROGRESSIVE, title_zh: 先框架后数据、核心优先 }
      - { id: PLOAD.ASYNC_BOUNDARY, title_zh: 异步边界给全加载、出错、超时 }
      - { id: PLOAD.CHUNK_ERROR, title_zh: 分包加载失败能自愈 }
      - { id: PLOAD.NO_SHIFT, title_zh: 不跳布局 }
      - { id: PLOAD.ASSETS, title_zh: 字体与图片有加载策略 }
  - key: caching
    title_zh: 缓存
    group: engineering
    prefix: CACHE
    summary_zh: 分清每一层缓存的用途；每类数据定新鲜度；先显示旧数据、后台刷新；写后失效；按身份隔离；持久化只存可过期的非敏感数据；静态资源带指纹、入口页不缓存。
    topics:
      - { id: CACHE.LAYERS, title_zh: 分清每一层缓存 }
      - { id: CACHE.FRESHNESS, title_zh: 每类数据定新鲜度 }
      - { id: CACHE.SWR, title_zh: 先显示旧数据、后台刷新 }
      - { id: CACHE.INVALIDATE, title_zh: 写后失效 }
      - { id: CACHE.ISOLATION, title_zh: 按身份隔离 }
      - { id: CACHE.PERSIST, title_zh: 持久化只存可过期的非敏感数据 }
      - { id: CACHE.ASSETS, title_zh: 静态资源带指纹、入口页不缓存 }
  - key: async
    title_zh: 异步处理
    group: engineering
    prefix: ASYNC
    summary_zh: 请求可取消；只认最新一次的结果；无依赖的并行、部分失败要处理；重试只对幂等与可重试错误、指数退避；输入防抖、滚动节流；轮询会暂停会停止；每个 Promise 都有去处。
    topics:
      - { id: ASYNC.CANCEL, title_zh: 请求可取消 }
      - { id: ASYNC.LATEST, title_zh: 只认最新一次的结果 }
      - { id: ASYNC.PARALLEL, title_zh: 无依赖的并行、部分失败要处理 }
      - { id: ASYNC.RETRY, title_zh: 重试只对幂等与可重试错误 }
      - { id: ASYNC.DEBOUNCE, title_zh: 输入防抖、滚动节流 }
      - { id: ASYNC.POLLING, title_zh: 轮询会暂停会停止 }
      - { id: ASYNC.NO_FLOATING, title_zh: 每个 Promise 都有去处 }
  - key: concurrency
    title_zh: 高并发
    group: engineering
    prefix: CONC
    summary_zh: 相同的在途请求合并；批量操作有并发上限；多个小请求合成批量接口；收到限流就退避排队；写冲突用版本号；实时推送重连退避、去重保序；高频更新合帧渲染。
    topics:
      - { id: CONC.DEDUP, title_zh: 相同的在途请求合并 }
      - { id: CONC.LIMIT, title_zh: 批量操作有并发上限 }
      - { id: CONC.BATCH, title_zh: 多个小请求合成批量接口 }
      - { id: CONC.RATE_LIMIT, title_zh: 收到限流就退避排队 }
      - { id: CONC.VERSION, title_zh: 写冲突用版本号 }
      - { id: CONC.REALTIME, title_zh: 实时推送重连退避、去重保序 }
      - { id: CONC.RENDER, title_zh: 高频更新合帧渲染 }
  - key: click_guard
    title_zh: 防重复点击
    group: engineering
    prefix: CLICK
    summary_zh: 提交中锁住并显示加载；创建类写请求带幂等键；回车与按钮共用一把锁；刷新、点赞这类按钮节流或合并；重复导航不重复入栈；锁定期间有反馈；按钮锁只是体验，后端仍要幂等。
    topics:
      - { id: CLICK.LOCK, title_zh: 提交中锁住并显示加载 }
      - { id: CLICK.IDEMPOTENCY, title_zh: 创建类写请求带幂等键 }
      - { id: CLICK.ONE_PATH, title_zh: 回车与按钮共用一把锁 }
      - { id: CLICK.THROTTLE, title_zh: 刷新、点赞这类按钮节流或合并 }
      - { id: CLICK.NAVIGATION, title_zh: 重复导航不重复入栈 }
      - { id: CLICK.FEEDBACK, title_zh: 锁定期间有反馈 }
  - key: prototype_intake
    title_zh: 原型转换
    group: engineering
    prefix: PROTO
    summary_zh: BA 交来的 spec 与 HTML 原型拆成四层：业务事实、信息结构、交互意图原样保留，表现全部丢掉；表现里藏着的事实翻译成语义；冲突进提问；按规范重绘后用同一个抽取器做事实对账。
    topics:
      - { id: PROTO.LAYERS, title_zh: 拆成四层，只丢表现 }
      - { id: PROTO.EXTRACT, title_zh: 去表现化抽取 }
      - { id: PROTO.TRANSLATE, title_zh: 表现里藏着的事实翻译成语义 }
      - { id: PROTO.SPEC_FACTS, title_zh: spec 里读业务规则 }
      - { id: PROTO.CONFLICTS, title_zh: 冲突进提问，不自己挑 }
      - { id: PROTO.MAP, title_zh: 映射到规范，记下依据 }
      - { id: PROTO.REBUILD, title_zh: 按规范重绘 }
      - { id: PROTO.VERIFY, title_zh: 用同一个抽取器做事实对账 }
