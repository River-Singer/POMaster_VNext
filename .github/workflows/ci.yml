name: CI

on:
  push:
    branches: [main]
  pull_request:
  # T4 R1（09-08-sc-t4）可复用入口：publish.yml 以 `uses: ./.github/workflows/ci.yml`
  # 在同一 run 内复用本 workflow 作发布前置闸（publish job needs: ci——tag push →
  # CI 全绿 → publish 串行）。workflow_call 不改变 push/PR 触发面；被调用时
  # github.sha = 调用方触发 sha（tag push 即 tag 指向的 commit）。
  workflow_call:

# 三 OS 腿（P32b · gaps B3 闭合；macOS 腿 Owner 2026-09-01 批准启用——呈报件
# docs/l6-release-gate-p35-report.md §3 即插即用件）：matrix 而非独立 job 的裁定——
# install→build→封条×2→pyyaml→test→ratchet→lint 七步在各 OS 上完全同形（零步骤复制）；
# fail-fast: false 让单腿红不取消另一腿（Windows/macOS 特有失败不得掩盖 ubuntu
# 主信号，反之亦然）。
#
# Windows 腿考量（如实处理）：
# - corepack 启用：COREPACK_ENABLE_DOWNLOAD_PROMPT=0（job 级 env，三腿共享）——
#   免交互下载确认，Windows runner 同样需要；
# - 路径分隔符：产品全部走 node:path（ratchet.mjs/build-all.mjs 均 process.execPath
#   直连、shell:false + 参数数组，不经 cmd/PowerShell 解析）——run 步本身只有
#   `corepack pnpm <script>`，无 shell 专属语法，pwsh 与 bash 同形；
# - 宿主工具缺席（oasdiff/lighthouse/schemathesis 等）：套内既有机制为探测缺席即
#   诚实 skip/not_run（非宿主原因不误红）；全量 vitest 已在 Windows 开发机实证绿。
jobs:
  ci:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    env:
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: corepack pnpm install

      - name: Build
        run: corepack pnpm build

      # P35 RT2/RT4 封条接线：落盘事实件配机器复核（mutation at-rest 校验重放
      # 判卷锚——手改 benchmarks/mutation-last-results.json 的分数/计数在此检出；
      # THIRD_PARTY_NOTICES 逐行按 node_modules 锚核对 license id 词形）。零 vitest
      # 运行、零网络、秒级；置于 build 后（mutation verify 消费 gauntlet-lite dist）。
      - name: Verify mutation results (at-rest)
        run: corepack pnpm mutation:verify

      - name: Verify third-party notices
        run: corepack pnpm notices:verify

      # M5 human views 编译器（corpus/master/tools/build_human_views.py）依赖 PyYAML：
      # runner 预置 Python 不带（macos/windows CI 实证 ModuleNotFoundError: yaml）。
      # `python -m pip` 词形三腿同形（python 垫片三腿皆在 PATH——human-views spec
      # 探测面同源）；ubuntu 镜像已预装 → already-satisfied 零写入零风险，
      # macos/windows 真装入未标记 toolcache 解释器（ubuntu-24.04 系统 python 的
      # PEP 668 标记不触发：非 real install 不做 externally-managed 检查）。
      - name: Install pyyaml (human views compiler dependency)
        run: python -m pip install pyyaml

      - name: Test
        run: corepack pnpm test

      - name: Ratchet (test-count floor, 只升不降)
        run: corepack pnpm ratchet

      - name: Lint
        run: corepack pnpm lint

  # ─────────────────────────────────────────────────────────────────────────────
  # 在线 Storybook 的静态构建预演：Pages 只在 main 上发布，合并前在这里把总 Storybook
  # （两个抽屉的组合）按发布位真实构建一遍，并核对产物——根路径是总 Storybook、vue/ 与 react/
  # 是两个抽屉、组合引用指向发布位的子路径、两个抽屉都有「规范」分区。只构建不部署。
  studio-build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
      POMASTER_STUDIO_SITE_URL: "https://river-singer.github.io/POMaster_VNext/"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install (frozen lockfile)
        run: corepack pnpm install --frozen-lockfile

      - name: Generate gallery pages
        run: |
          node packages/studio/run.mjs generate
          node packages/studio-react/run.mjs generate

      - name: Build Storybook (host + two drawers, static export)
        run: corepack pnpm studio:build

      - name: Check composed output
        run: |
          set -e
          for f in dist-studio/index.html dist-studio/vue/index.html dist-studio/react/index.html dist-studio/vue/index.json dist-studio/react/index.json; do
            test -s "$f" || { echo "::error::缺少 $f"; exit 1; }
          done
          grep -rqs "POMaster_VNext/vue" dist-studio/index.html dist-studio/sb-manager dist-studio/*.js || { echo "::error::总 Storybook 没有指向 vue/ 子路径的组合引用"; exit 1; }
          grep -rqs "POMaster_VNext/react" dist-studio/index.html dist-studio/sb-manager dist-studio/*.js || { echo "::error::总 Storybook 没有指向 react/ 子路径的组合引用"; exit 1; }
          for d in vue react; do
            node -e "const i=require('./dist-studio/'+process.argv[1]+'/index.json');const n=Object.values(i.entries).filter(e=>String(e.title).startsWith('规范/')).length;console.log(process.argv[1],'规范 entries',n);if(n<100)process.exit(1)" "$d"
          done

  # ─────────────────────────────────────────────────────────────────────────────
  # 脚手架后端实证（S1-6）：按两份样例规格（fleet、shop）各生成一个完整项目，用真实 Maven 编译，
  # 再在 MySQL 8.4 上用迁移账号跑 Flyway、按 grants.sql 给两个应用账号授权、起管理侧与用户侧两个
  # 应用，按规格走一遍接口（权限码 / 访问档、校验、乐观锁、唯一值、KEYSET 翻页、可见性、属主、
  # 脱敏、字段加密、ETag）。生成器的单元测试只钉文本，这里钉「生成出来的东西真能跑」。
  scaffold-java:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -proot"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install (frozen lockfile)
        run: corepack pnpm install --frozen-lockfile

      - name: Build
        run: corepack pnpm build

      - name: Generate sample projects
        run: |
          node scripts/scaffold-sample/generate.mjs packages/cli/scaffold/examples/fleet.domain-spec.yaml "$RUNNER_TEMP/fleet"
          node scripts/scaffold-sample/generate.mjs packages/cli/scaffold/examples/shop.domain-spec.yaml "$RUNNER_TEMP/shop"

      - name: Maven package
        run: |
          mvn -B -ntp -f "$RUNNER_TEMP/fleet/backend/pom.xml" -DskipTests package
          mvn -B -ntp -f "$RUNNER_TEMP/shop/backend/pom.xml" -DskipTests package

      - name: Migrate, run both apps, exercise the API
        run: |
          node scripts/scaffold-sample/smoke.mjs "$RUNNER_TEMP/fleet"
          node scripts/scaffold-sample/smoke.mjs "$RUNNER_TEMP/shop"

  # ─────────────────────────────────────────────────────────────────────────────
  # 脚手架前端实证（S1-7 / S1-8）：同一份样例规格按 Vue 3 + Ant Design Vue、React + Geist 各生成一个管理侧前端
  # （受管页面 + 种子外壳），装依赖后跑项目自己的 build（先类型检查再 Vite 构建），三个系统都跑。
  scaffold-web:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        frontend: [vue, react]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install (frozen lockfile)
        run: corepack pnpm install --frozen-lockfile

      - name: Build
        run: corepack pnpm build

      - name: Generate sample project
        shell: bash
        run: node scripts/scaffold-sample/generate.mjs packages/cli/scaffold/examples/fleet.domain-spec.yaml "$RUNNER_TEMP/fleet-${{ matrix.frontend }}" ${{ matrix.frontend }}

      - name: Install and build the generated admin web
        shell: bash
        working-directory: ${{ runner.temp }}/fleet-${{ matrix.frontend }}/frontend/admin
        run: |
          npm install --no-audit --no-fund
          npm run build

  # ─────────────────────────────────────────────────────────────────────────────
  # L6-2 自主半边（P35）：clean HOME × fresh clone bootstrap 演练。
  #
  # 语义：模拟「一台什么都没有的新机器」——HOME 指向全新空临时目录（runner 默认
  # HOME=/home/runner 带预热的 corepack/pnpm 缓存，本 job 一概不可见），checkout
  # 进 workspace 子目录（runner 一次一毁 = 天然 fresh clone；子目录使其显式化），
  # corepack/pnpm store 全部在干净 HOME 下从零下载安装，再 build → test → 三档
  # 自托管基准。HOME 隔离是机器判据：每步 echo HOME 并断言其不等于 runner 默认。
  #
  # 边界（如实）：
  # - 仅 ubuntu-latest 单腿，不引入新 OS 配额——macOS 腿是 Owner 批准位
  #   （呈报件 docs/l6-release-gate-p35-report.md §3：matrix.os 一行 diff 即插即用）；
  # - 本 job 是 bootstrap 演练，不跑 ratchet/lint（棘轮与 lint 归上方 matrix 腿）；
  # - GitHub hosted runner 本身一次一毁，干净 HOME 演练的增量价值是「连 corepack
  #   首次下载 pnpm 的路径也走通」——这是 fresh 机器 bootstrap 的第一步，此前矩阵腿
  #   用的 runner 预置 HOME 无法覆盖；
  # - bash 多行/`$(...)` 仅出现在本 ubuntu 专属 job——上 matrix 腿维持 pwsh/bash
  #   双 shell 同形纪律（契约测试钉的是 jobs.ci，不含本 job）。
  bootstrap-clean:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
    steps:
      - name: Prepare clean HOME (fresh temp dir, assert isolation from runner default)
        id: cleanhome
        run: |
          CLEAN_HOME="$(mktemp -d /tmp/pomaster-clean-home-XXXXXX)"
          echo "runner_default_HOME=$HOME"
          echo "clean_HOME=$CLEAN_HOME"
          echo "path=$CLEAN_HOME" >> "$GITHUB_OUTPUT"
          if [ -z "$CLEAN_HOME" ] || [ "$CLEAN_HOME" = "$HOME" ]; then
            echo "::error::clean HOME 未隔离（为空或等于 runner 默认 HOME）"
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          path: fresh-clone

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # 与 matrix 腿同词形（pyyaml = M5 human views 编译器依赖；runner 预置 Python 不带）。
      - name: Install pyyaml (human views compiler dependency)
        run: python -m pip install pyyaml

      - name: Bootstrap under clean HOME (install → build → test)
        working-directory: fresh-clone
        env:
          HOME: ${{ steps.cleanhome.outputs.path }}
        run: |
          echo "HOME=$HOME (runner default was /home/runner)"
          case "$HOME" in
            ""|/home/runner|/home/runner/*)
              echo "::error::HOME 未隔离: '$HOME'"
              exit 1 ;;
          esac
          corepack pnpm install
          corepack pnpm build
          corepack pnpm test

      - name: Self-hosting benchmark 三档合跑 (clean HOME 下)
        working-directory: fresh-clone
        env:
          HOME: ${{ steps.cleanhome.outputs.path }}
        run: |
          echo "HOME=$HOME (runner default was /home/runner)"
          node benchmarks/run-all.mjs
