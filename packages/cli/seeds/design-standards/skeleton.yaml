  # ═════════════════════════════ 工程规范 ═════════════════════════════
  - key: state
    title_zh: 状态管理
    group: engineering
    prefix: STATE
    summary_zh: 每份状态先定属主再定存放处：服务端数据进查询缓存，跨页稳定状态进全局 store，可分享的视图状态进 URL。
    topics:
      - { id: STATE.OWNERSHIP, title_zh: 状态放哪 }
      - { id: STATE.SERVER_STATE, title_zh: 服务端数据 }
      - { id: STATE.GLOBAL_STORE, title_zh: 全局 store }
      - { id: STATE.URL, title_zh: URL 状态 }
      - { id: STATE.REQUESTS, title_zh: 请求入口 }
      - { id: STATE.CACHE_KEYS, title_zh: 缓存 key 与失效 }
      - { id: STATE.CLEANUP, title_zh: 清理与竞态 }
      - { id: STATE.FORM_MODEL, title_zh: 表单模型 }
      - { id: STATE.BROWSER_STORAGE, title_zh: 浏览器存储 }
  - key: performance
    title_zh: 性能
    group: engineering
    prefix: PERF
    summary_zh: 先定预算；按需加载；大列表分页与虚拟化；输入防抖；并行初始化；渲染里不做重计算；度量分清口径。
    topics:
      - { id: PERF.BUDGET, title_zh: 性能预算 }
      - { id: PERF.LAZY_LOAD, title_zh: 按需加载 }
      - { id: PERF.ON_DEMAND_LIBRARY, title_zh: 组件库按需引入 }
      - { id: PERF.LARGE_LISTS, title_zh: 大列表 }
      - { id: PERF.INPUT, title_zh: 输入与过期响应 }
      - { id: PERF.PARALLEL_INIT, title_zh: 并行初始化 }
      - { id: PERF.COMPUTE, title_zh: 渲染计算 }
      - { id: PERF.MEASURE, title_zh: 度量口径 }
