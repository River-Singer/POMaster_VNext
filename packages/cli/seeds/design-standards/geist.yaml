# design-standards/geist.yaml —— 前端设计规范工具预设（Vercel Geist 体系 · React 栈）
#
# 预设不直接播种：项目落地后规范在 .pomaster/baseline/frontend/design-standard.yaml，
# 未落地时 `pomaster design validate / show --system geist` 与 React 画廊（packages/studio-react）
# 的规范页用本预设。领域与条目按统一骨架（skeleton.yaml）组织，与 Ant Design 预设目录一致。
#
# 实现栈：React + Tailwind CSS 4 + shadcn/ui（组件源码进项目，按 Geist 重新配色与定尺寸）；图标 lucide-react；
# 服务端数据 @tanstack/react-query；全局 store Zustand。Vercel 文档里的组件包 @vercel/geistcn 与图标包
# @vercel/geistcn-assets 在公开 npm 上装不到（2026-11-02 返回 404），所以不用。字体从 Google Fonts 加载。
#
# 数值纪律同 antd 预设：定值带出处；Geist 没公开的数值写成项目决策位，或注明是 pomaster 预设取值。
# 色值取自 vercel.com/geist/vercel-brand.css（Owner 2026-11-06 提供的副本），只公开了部分彩色档位。
#
# 怎么改：编辑本文件 → `pomaster design validate --system geist` → `node packages/studio-react/run.mjs generate`。
#
# 实时内容（jsx）是 JSX 片段，React 画廊里真渲染：`p` 是本条规则的参数。可用组件见
# packages/studio-react/scripts/lib/standard.mjs 的 UI_COMPONENTS，以及 lucide-react 图标（XxxIcon）。
# Geist 色阶在 Tailwind 里是 ds- 前缀的颜色类：bg-ds-gray-100、text-ds-gray-900、border-ds-gray-alpha-400……
schema: pomaster.design-standard/v1
meta:
  origin: preset
  customized: false
  design_system: geist
  ui_library: shadcn/ui + Tailwind CSS 4

