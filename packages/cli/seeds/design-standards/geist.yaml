                swatches:
                  - { name: teal-100, pending_zh: 未公开 }
                  - { name: teal-200, pending_zh: 未公开 }
                  - { name: teal-300, pending_zh: 未公开 }
                  - { name: teal-400, pending_zh: 未公开 }
                  - { name: teal-500, pending_zh: 未公开 }
                  - { name: teal-600, pending_zh: 未公开 }
                  - { name: teal-700, pending_zh: 未公开 }
