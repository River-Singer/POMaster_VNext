      - proposed_id: POLICY.WEB.GRID.ALIGNMENT_AND_FREEZE_DISCIPLINE
        triage: HYBRID
        kind_proposal: policy
        classification_proposal: LANE_POLICY
        statement_zh: "数值列右对齐、文本列左对齐且同类列跨页同制；关键标识与名称固定左侧、操作列固定右侧，冻结总宽不得吞噬主数据区；列不足容器时必须由明确拉伸策略处理，不得交由引擎随机分配。居中豁免列类型清单属项目视觉基线。"
        statement_en_keywords: "alignment discipline, freeze left/right, explicit stretch strategy, center exemption list as baseline"
        applies_when: {lane: frontend, condition: "列对齐与冻结设计"}
        enforcement: required_when_applicable
        source: {file: .trellis/spec/frontend/30-data-grid-protocol.md, lines: "45-47"}
        clean_room: true
        uncertainty: "对齐通则可泛化；居中豁免清单（序号/操作/徽章/日期/打点列等）属项目视觉基线，故 HYBRID"

      - proposed_id: POLICY.WEB.GRID.DERIVED_COLUMN_DISCIPLINE
        triage: UNIVERSAL
        kind_proposal: policy
        classification_proposal: LANE_POLICY
        statement_zh: "派生列必须标记派生标识并持有真实计算式（编辑态联动即时生效）；派生值不得提交服务端、写入全局状态或导出为正式值，除非接口契约声明该值来自服务端权威结果。"
        statement_en_keywords: "derived column marking, real computation formula, no export/commit of derived values"
        applies_when: {lane: frontend, condition: "定义派生列"}
        enforcement: required_when_applicable
        source: {file: .trellis/spec/frontend/30-data-grid-protocol.md, lines: "51, 155, 188"}
        clean_room: true

      - proposed_id: POLICY.WEB.GRID.HEADER_FILTER_WIDTH
        triage: UNIVERSAL
        kind_proposal: policy
        classification_proposal: LANE_POLICY
        statement_zh: "表头内置筛选输入宽度必须贴合列头文字的实际渲染宽度，不得撑满列宽；文字宽度必须以画布文本测量获得（字体声明与表头一致），不得以容器布局宽度冒充；外宽取测得文字宽与最小宽度的较大者，不再追加内边距与边框补偿。"
