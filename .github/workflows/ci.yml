name: CI

on:
  push:
    branches: [main]
  pull_request:

# 双 OS 腿（P32b · gaps B3 闭合）：matrix 而非独立 job 的裁定——
# install→build→test→ratchet→lint 五步在两个 OS 上完全同形（零步骤复制），
# 后续 L6-2 扩 macOS 是 matrix.os 一行改动；fail-fast: false 让单腿红不取消
# 另一腿（Windows 特有失败不得掩盖 ubuntu 主信号，反之亦然）。
#
# Windows 腿考量（如实处理）：
# - corepack 启用：COREPACK_ENABLE_DOWNLOAD_PROMPT=0（job 级 env，两腿共享）——
#   免交互下载确认，Windows runner 同样需要；
# - 路径分隔符：产品全部走 node:path（ratchet.mjs/build-all.mjs 均 process.execPath
#   直连、shell:false + 参数数组，不经 cmd/PowerShell 解析）——run 步本身只有
#   `corepack pnpm <script>`，无 shell 专属语法，pwsh 与 bash 同形；
# - 宿主工具缺席（oasdiff/lighthouse/schemathesis 等）：套内既有机制为探测缺席即
#   诚实 skip/not_run（非宿主原因不误红）；全量 vitest 已在 Windows 开发机实证绿。
jobs:
  ci:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      COREPACK_ENABLE_DOWNLOAD_PROMPT: "0"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install
        run: corepack pnpm install

      - name: Build
        run: corepack pnpm build

      - name: Test
        run: corepack pnpm test

      - name: Ratchet (test-count floor, 只升不降)
        run: corepack pnpm ratchet

      - name: Lint
        run: corepack pnpm lint
