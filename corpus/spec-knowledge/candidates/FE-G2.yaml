    lines: 207
    coverage: full
    coverage_note: P0 最长协议；MUST 7 条 + Contract 段 15 小节逐节提取；L191-199 示例/反模式由卡 14 收编；无空段
    candidates:

      - proposed_id: POLICY.WEB.COMM.ENDPOINT_CONTRACT_COMPLETENESS
        triage: UNIVERSAL
        kind_proposal: policy
        classification_suggestion: UNIVERSAL_POLICY
        enforcement_suggestion: required_when_applicable
        clean_room: true
        statement_zh: "每个对外接口必须在契约中完整声明地址、方法、参数位置与类型、响应形状、错误、权限与责任归属；分页、筛选、排序、空值、枚举、计量单位与时间语义必须逐项显式化；字段级须给出必填性、可空性、默认值、取值范围与未知值策略，且空字符串、null、缺失字段与空数组四者语义不得互换。"
        en_keywords: "endpoint contract completeness, field-level metadata, null-family semantics"
        applies_when: {lane: any, condition: "定义或评审任何前后端接口契约时"}
        source_locator: "L20-L21, L44-L61"
        backlog_disposition: materialize_eligible

      - proposed_id: POLICY.WEB.COMM.RESOURCE_MODELING
        triage: UNIVERSAL
        kind_proposal: policy
        classification_suggestion: UNIVERSAL_POLICY
        enforcement_suggestion: required_when_applicable
        clean_room: true
        statement_zh: "接口路径以稳定资源名与层级表达资源结构；只读与各类变更按方法语义区分，非增删改查的领域动作使用显式动作端点，禁止万能处理端点；路径、查询、头部与请求体各承载其语义（资源标识、分页筛选、协议上下文、命令数据），页面动作或展示标题不得编码进路径。"
        en_keywords: "resource modeling, method semantics, no universal action endpoint, param placement"
        applies_when: {lane: any, condition: "设计接口 URL 与方法语义时"}
        source_locator: "L52-L57"
        backlog_disposition: materialize_eligible

      - proposed_id: POLICY.WEB.COMM.OPTIMISTIC_CONCURRENCY
        triage: UNIVERSAL
        kind_proposal: policy
        classification_suggestion: UNIVERSAL_POLICY
        enforcement_suggestion: required_when_applicable
        clean_room: true
        statement_zh: "可编辑资源必须在契约中提供版本凭据（版本号、更新时间或实体标签），更新命令携带预期版本；冲突必须显式返回并附带解决冲突所需数据（重取方式、字段差异），禁止静默 last-write-wins。"
        en_keywords: "optimistic concurrency, expected version, explicit conflict, no silent overwrite"
        applies_when: {lane: any, condition: "定义可编辑资源的写操作契约时"}
        source_locator: "L22, L119-L123"
        backlog_disposition: materialize_eligible

      - proposed_id: POLICY.WEB.COMM.LIST_SHAPE_CONTRACT
        triage: UNIVERSAL
        kind_proposal: policy
        classification_suggestion: UNIVERSAL_POLICY
        enforcement_suggestion: required_when_applicable
        clean_room: true
        statement_zh: "列表响应必须固定数据数组、页码或游标、页大小与总数语义；操作类响应必须显式声明同步结果、任务标识或无内容三者之一；同一业务禁止并存多个未版本化响应信封；导出必须复用列表筛选语义并声明范围（当前页、选中项或全量）。"
        en_keywords: "list shape contract, pagination semantics, operation result shape, export scope reuse"
        applies_when: {lane: any, condition: "定义列表与操作类响应契约时"}
        source_locator: "L63-L68, L95-L100"
        backlog_disposition: materialize_eligible

      - proposed_id: POLICY.WEB.COMM.ERROR_SEMANTICS
        triage: UNIVERSAL
        kind_proposal: policy
        classification_suggestion: UNIVERSAL_POLICY
        enforcement_suggestion: required_when_applicable
        clean_room: true
        statement_zh: "业务错误由稳定、可枚举的机器码承载，消息文本仅用于展示与诊断、不得驱动任何逻辑；字段级错误携带稳定字段键、错误码与参数，批量错误携带对象或行标识；传输状态码表达协议层事实；五系列错误必须显式声明可重试性而非默认可重试。"
        en_keywords: "stable business code, message display-only, field errors, 5xx retryability"
        applies_when: {lane: any, condition: "定义错误结构与消费错误语义时"}
        source_locator: "L31, L70-L89"
        backlog_disposition: materialize_eligible

      - proposed_id: POLICY.WEB.COMM.ERROR_UI_MAPPING_REGISTRY
        triage: UNIVERSAL
        kind_proposal: policy
        classification_suggestion: UNIVERSAL_POLICY
        enforcement_suggestion: required_when_applicable
        clean_room: true
        statement_zh: "错误码到界面状态的映射必须收敛到单一事实源登记表并随契约版本同步升级，破坏性码变化视同契约变更；界面禁止按消息文本或传输状态推导业务状态；未登记码必须落入兜底状态并被记录。"
        en_keywords: "error-to-UI-state mapping registry, single source of truth, fallback state"
        applies_when: {lane: any, condition: "消费错误码驱动界面状态时"}
        source_locator: "L26, L168-L178"
        uncertainty:
          - "本条 7 值界面状态词表与 FE16 项目强制枚举（11 值）不一致，正本化前需 Owner 对齐状态词表（跨文件张力）"
        backlog_disposition: materialize_eligible

      - proposed_id: POLICY.WEB.COMM.TRACE_CORRELATION
        triage: UNIVERSAL
        kind_proposal: policy
        classification_suggestion: UNIVERSAL_POLICY
        enforcement_suggestion: required_when_applicable
        clean_room: true
        statement_zh: "客户端操作、传输请求、异步任务、实时消息、服务端日志与用户可见错误之间必须可经链路标识关联；链路标识不得携带敏感信息，跨服务时保持或建立明确父子关系。"
        en_keywords: "trace id correlation, no sensitive data in trace, parent-child across services"
        applies_when: {lane: any, condition: "设计链路追踪贯通时"}
        source_locator: "L25, L164-L166"
        backlog_disposition: materialize_eligible

      - proposed_id: POLICY.WEB.COMM.SESSION_LIFECYCLE_CONTRACT
        triage: UNIVERSAL
        kind_proposal: policy
        classification_suggestion: UNIVERSAL_POLICY
        enforcement_suggestion: required_when_applicable
        clean_room: true
        statement_zh: "会话凭证的完整生命周期（签发、刷新、撤销、退出、多标签同步、并发失效合并）必须在契约中定义；凭证不得进入地址栏、日志、埋点或业务组件载荷；凭证相关缓存与已打开页面的失效方式必须明确。"
        en_keywords: "session token lifecycle contract, multi-tab sync, concurrent 401 merge, token exclusion"
        applies_when: {lane: any, condition: "定义认证会话契约时"}
        source_locator: "L107, L109-L111"
        uncertainty:
          - "凭证禁入地址/日志面与 FE-G1 04-security L36/L21 同语义（跨组合并审阅）；本文件增量为生命周期契约定义面（多标签同步、并发失效合并）"
        backlog_disposition: backlog_only

      - proposed_id: POLICY.WEB.COMM.CACHEABILITY_DECLARATION
        triage: UNIVERSAL
        kind_proposal: policy
        classification_suggestion: UNIVERSAL_POLICY
        enforcement_suggestion: required_when_applicable
        clean_room: true
        statement_zh: "接口必须声明可缓存性、版本凭据与数据实时性；高风险数据不得由调用方自行延长缓存；写操作必须提供足以精确失效依赖缓存的信息。"
        en_keywords: "cacheability declaration, high-risk data, mutation invalidation info"
        applies_when: {lane: any, condition: "定义接口缓存语义时"}
        source_locator: "L125-L127"
        uncertainty:
          - "失效矩阵面与 FE-G3 19-cache（L21 写操作定义依赖失效矩阵）同语义，跨组合并审阅；本卡收窄为契约声明面"
        backlog_disposition: backlog_only

      - proposed_id: POLICY.WEB.COMM.JOB_CONTRACT
        triage: UNIVERSAL
        kind_proposal: policy
        classification_suggestion: UNIVERSAL_POLICY
        enforcement_suggestion: required_when_applicable
        clean_room: true
        statement_zh: "异步任务必须使用正式任务契约：任务标识、类型、状态、进度、结果、错误明细与链路标识齐备；状态机至少区分未开始、执行中、成功、失败与已取消，新增状态视同契约变更；创建、查询、取消、重试、结果获取与过期语义必须定义。"
        en_keywords: "async job contract, job state machine, cancellation and expiry semantics"
        applies_when: {lane: any, condition: "定义异步任务契约时"}
        source_locator: "L23, L135-L145"
        backlog_disposition: materialize_eligible

      - proposed_id: POLICY.WEB.COMM.REALTIME_CHANNEL_SEMANTICS
        triage: UNIVERSAL
        kind_proposal: policy
        classification_suggestion: UNIVERSAL_POLICY
        enforcement_suggestion: required_when_applicable
        clean_room: true
        statement_zh: "服务端单向推送优先选用事件流通道，双向协作才启用双向套接字通道，轮询仅作降级；实时消息信封至少含消息标识、类型、载荷、时间戳、版本与链路标识；鉴权、心跳、重连、去重、乱序、丢失、回放、终止与降级行为必须定义。"
        en_keywords: "sse-first realtime, websocket for bidirectional, message envelope, reconnection semantics"
        applies_when: {lane: any, condition: "设计实时通信契约时"}
        source_locator: "L38, L147-L151"
        uncertainty:
          - "通道选择语义源强度介于 SHOULD（L38）与契约段规则（L149）之间，升 MUST 与否留 Owner 裁定"
        backlog_disposition: backlog_only

      - proposed_id: POLICY.WEB.COMM.INTEGRATION_SCENARIO_COVERAGE
        triage: UNIVERSAL
        kind_proposal: policy
        classification_suggestion: UNIVERSAL_POLICY
        enforcement_suggestion: required_when_applicable
        clean_room: true
        statement_zh: "前后端联调验收必须覆盖非理想响应：认证失败、无权限、冲突、校验失败、限流、服务错误、超时与部分成功；仅验证正常返回不构成联调完成。"
        en_keywords: "integration scenario coverage, non-2xx acceptance, partial success"
        applies_when: {lane: any, condition: "前后端联调与验收时"}
        source_locator: "L160-L162"
        backlog_disposition: materialize_eligible

      - proposed_id: POLICY.CHG.CONTRACT_FREEZE_FLOW
        triage: UNIVERSAL
        kind_proposal: policy
        classification_suggestion: UNIVERSAL_POLICY
        enforcement_suggestion: required_when_applicable
        clean_room: true
        statement_zh: "接口协作遵循先评审、后冻结、再实现的次序；契约冻结前不进入并行实现。"
        en_keywords: "contract review freeze implement, no parallel implementation before freeze"
        applies_when: {lane: any, condition: "新契约或契约破坏性变更进入实现前"}
        source_locator: "L160-L162, L205-L207"
        uncertainty:
          - "Change Policy 段无显式 MUST 前缀；强度按试点 Change Policy 先例记 required，留 Owner 确认"
        backlog_disposition: backlog_only

      - proposed_id: KNOWLEDGE.FP.COMM.MOCK_GUESS_AND_ENVELOPE_DRIFT
        triage: UNIVERSAL
        kind_proposal: knowledge_entry
        classification_suggestion: FAILURE_PATTERN
        enforcement_suggestion: advisory
        clean_room: true
        statement_zh: "凭替身数据猜测字段结构、服务端改名后同时兼容多套响应并比较消息文本、以按钮加载态冒充幂等防护、多通道各自定义任务状态——契约缺位在消费侧的典型失败形态。"
        en_keywords: "mock-derived fields, envelope drift, loading-as-idempotency, per-channel job states"
        applies_when: {lane: frontend, condition: "反模式知识，无适用门禁"}
        source_locator: "L197-L199"
        backlog_disposition: backlog_only

      - proposed_id: POLICY.WEB.COMM.NO_INFORMAL_ARTIFACTS
        triage: UNIVERSAL
        kind_proposal: policy
        classification_suggestion: DUPLICATE
        enforcement_suggestion: advisory
        clean_room: true
        statement_zh: "口头约定、截图、替身数据、抓包结果或前端临时类型不得替代正式契约，只能作评审输入；文件、异步任务与实时消息同样必须使用正式结构契约。"
        source_locator: "L23, L30, L50"
        duplicate_of: POLICY.API.NO_INFORMAL_CONTRACT
        notes: "既有正本已含『Mock/聊天记录/猜测不得充当契约』；本文件 L23 将覆盖面延伸到文件/任务/实时通道，作为正本适用性扩展合并审"
        backlog_disposition: backlog_only

      - proposed_id: POLICY.WEB.COMM.NO_UNVERSIONED_BREAKING_CHANGE
        triage: UNIVERSAL
        kind_proposal: policy
        classification_suggestion: DUPLICATE
        enforcement_suggestion: advisory
        clean_room: true
        statement_zh: "未版本化地修改字段、枚举、分页或错误语义，以及破坏性变更不提供新版本、调用方清单、迁移期、弃用日期与回滚的形态被禁止。"
        source_locator: "L24, L153, L157"
        duplicate_of: POLICY.CHG.BREAKING_VERSIONING
        backlog_disposition: backlog_only

      - proposed_id: POLICY.WEB.COMM.ARTIFACT_SYNC_ON_CONTRACT_CHANGE
        triage: UNIVERSAL
        kind_proposal: policy
        classification_suggestion: DUPLICATE
        enforcement_suggestion: advisory
        clean_room: true
        statement_zh: "契约变更后生成类型、边界映射、替身、导入导出与测试必须同步更新。"
        source_locator: "L158, L188"
        duplicate_of: POLICY.CHG.SYNC_CONTRACT_DOCS_TESTS
        backlog_disposition: backlog_only

      - proposed_id: POLICY.WEB.COMM.OPTIONAL_FIELD_COMPAT_DEFAULT
        triage: UNIVERSAL
        kind_proposal: policy
        classification_suggestion: DUPLICATE
        enforcement_suggestion: advisory
        clean_room: true
        statement_zh: "新增可选字段默认向后兼容。"
        source_locator: "L155"
        duplicate_of: POLICY.API.BACKWARD_COMPAT_DEFAULTS
        backlog_disposition: backlog_only

      - proposed_id: POLICY.WEB.COMM.NO_DTO_IN_SHARED_SURFACES
        triage: UNIVERSAL
        kind_proposal: policy
        classification_suggestion: DUPLICATE
        enforcement_suggestion: advisory
        clean_room: true
        statement_zh: "公共组件、表格列与模板不得直接依赖传输层对象；字段重命名、空值、枚举、日期与金额转换只能在边界完成。"
        source_locator: "L91-L93"
        duplicate_of: POLICY.WEB.MODEL.LAYERING_CHAIN
        notes: "intra-batch：FE14 为正本（同批产出），物化时仅保留 FE14 侧"
        backlog_disposition: backlog_only

      - proposed_id: POLICY.WEB.COMM.COMMAND_IDEMPOTENCY_DECLARATION
        triage: UNIVERSAL
        kind_proposal: policy
        classification_suggestion: DUPLICATE
        enforcement_suggestion: advisory
        clean_room: true
        statement_zh: "可能重复执行的命令必须声明幂等支持；幂等键的生成方、作用域、有效期、重复请求响应与冲突行为必须固定；界面禁用与加载态只是体验保护。"
        source_locator: "L22, L113-L117"
        duplicate_of: POLICY.WEB.API.MUTATION_IDEMPOTENCY
