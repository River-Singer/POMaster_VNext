# design-standards/skeleton.yaml —— 前端设计规范的统一骨架（两套设计体系的并集）
#
# Storybook 里 Vue · Ant Design 与 React · Geist 两个抽屉的目录完全相同：领域、领域下的条目（规则）、
# 组件清单都取两套体系的并集，写在这份骨架里。每套体系的规范（antd.yaml / geist.yaml）按骨架写内容：
#   - 领域键、标题、分区、规则前缀、先后顺序与骨架一致（不一致就报错）；
#   - 条目编号、标题、先后顺序与骨架一致；骨架里有而规范里没写的条目，规范页显示「待补」并给警告；
#   - 组件领域标出两套体系各自对应的现成组件（counterparts）；某套体系没有现成组件时为空表，
#     由该体系自行设计。
#
# 怎么改：先改这份骨架（加领域、加条目、加组件），再分别补两套规范；
# `pomaster design validate --system antd|geist` 会逐条报出没对齐的地方。
schema: pomaster.design-skeleton/v1

areas:
  # ═════════════════════════════ 基础 ═════════════════════════════
  - key: color
    title_zh: 色彩
    group: foundations
    prefix: COLOR
    summary_zh: 色板与每一档的用途、中性色分层、品牌色与状态色；颜色只经 token 取。
    topics:
      - { id: COLOR.PALETTE, title_zh: 色板 }
      - { id: COLOR.TOKENS_ONLY, title_zh: 颜色只经 token 取 }
      - { id: COLOR.NEUTRAL_LAYERS, title_zh: 中性色分层 }
      - { id: COLOR.BRAND, title_zh: 品牌色 }
      - { id: COLOR.STATUS, title_zh: 状态色 }
      - { id: COLOR.BORDERS, title_zh: 边框 }
      - { id: COLOR.NO_DECORATION, title_zh: 不用装饰性效果 }
  - key: typography
    title_zh: 字体
    group: foundations
    prefix: TYPE
    summary_zh: 字体族、字阶、字重、单行与多行、文字颜色、等宽数字、行宽、富文本与溢出。
    topics:
      - { id: TYPE.FAMILY, title_zh: 字体族 }
      - { id: TYPE.SCALE, title_zh: 字阶 }
      - { id: TYPE.WEIGHT, title_zh: 字重 }
      - { id: TYPE.LINE_ROLES, title_zh: 单行与多行 }
      - { id: TYPE.COLOR, title_zh: 文字颜色 }
      - { id: TYPE.TABULAR_NUMS, title_zh: 等宽数字 }
      - { id: TYPE.READING, title_zh: 长文行宽 }
      - { id: TYPE.RICH_TEXT, title_zh: 富文本 }
      - { id: TYPE.OVERFLOW, title_zh: 文字溢出 }
  - key: headings
    title_zh: 标题层级
    group: foundations
    prefix: HEADING
    summary_zh: 应用界面与内容型页面各用几级标题；一个视图一个 h1；逐级下降；用真正的标题元素。
    topics:
      - { id: HEADING.APP_LEVELS, title_zh: 应用界面的标题级数 }
      - { id: HEADING.SINGLE_H1, title_zh: 每个视图一个 h1 }
      - { id: HEADING.ORDER, title_zh: 标题不跳级 }
      - { id: HEADING.CONTENT_LEVELS, title_zh: 内容型页面的标题 }
      - { id: HEADING.REAL_ELEMENT, title_zh: 用真正的标题元素 }
  - key: icons
    title_zh: 图标
    group: foundations
    prefix: ICON
    summary_zh: 一套图标库、一种风格；尺寸与间距跟随文字；颜色跟随文字；同一动作同一图标；纯图标按钮有名字。
    topics:
      - { id: ICON.LIBRARY, title_zh: 图标库 }
      - { id: ICON.STYLE, title_zh: 图标风格 }
      - { id: ICON.SIZE, title_zh: 图标尺寸 }
      - { id: ICON.SPACING, title_zh: 图标与文字的间距 }
      - { id: ICON.COLOR, title_zh: 图标颜色 }
      - { id: ICON.SEMANTICS, title_zh: 同一动作同一图标 }
      - { id: ICON.BUTTON_LABEL, title_zh: 纯图标按钮的名称 }
  - key: materials
    title_zh: 材质
    group: foundations
    prefix: MATERIAL
    summary_zh: 圆角、页面内的表面、浮层与阴影：每一级表面固定的圆角和阴影，阴影只表达层级。
    topics:
      - { id: MATERIAL.RADIUS, title_zh: 圆角 }
      - { id: MATERIAL.SURFACES, title_zh: 页面内的表面 }
      - { id: MATERIAL.FLOATING, title_zh: 浮层 }
      - { id: MATERIAL.SHADOWS, title_zh: 阴影 }
  - key: radius
    title_zh: 圆角管理
    group: foundations
    prefix: RADIUS
    summary_zh: 圆角只取规范的档位；每类组件用哪一档有对照表；同一组件的尺寸越大圆角越大但有上限；嵌套时内层 = 外层 − 内边距；贴边与相接的那侧没有圆角；整圆只给短小的元素；媒体随容器裁切。
    topics:
      - { id: RADIUS.TOKENS, title_zh: 只用规范的圆角档 }
      - { id: RADIUS.BY_COMPONENT, title_zh: 组件与圆角对照 }
      - { id: RADIUS.SIZE_SCALE, title_zh: 尺寸越大圆角越大，但有上限 }
      - { id: RADIUS.NESTED, title_zh: 嵌套时内层 = 外层 − 内边距 }
      - { id: RADIUS.FLUSH, title_zh: 贴边与相接的那侧没有圆角 }
      - { id: RADIUS.PILL, title_zh: 整圆只给短小的元素 }
      - { id: RADIUS.MEDIA, title_zh: 媒体随容器裁切 }
  - key: elevation
    title_zh: 投影
    group: foundations
    prefix: ELEV
    summary_zh: 投影只表达离页面多远：四个层级各一个阴影 token；页面内的区块用边框不用阴影；不手写阴影、不做发光；悬停最多升一级；阴影层级与叠放层级同序；深色主题改用更亮的表面；吸顶与固定列的阴影只在滚动后出现。
    topics:
      - { id: ELEV.LEVELS, title_zh: 四个层级各一个阴影 }
      - { id: ELEV.FLAT_FIRST, title_zh: 页面内的区块用边框不用阴影 }
      - { id: ELEV.ONE_TOKEN, title_zh: 不手写阴影、不做发光 }
      - { id: ELEV.HOVER, title_zh: 悬停最多升一级 }
      - { id: ELEV.Z_PAIR, title_zh: 阴影层级与叠放层级同序 }
      - { id: ELEV.DARK, title_zh: 深色主题改用更亮的表面 }
      - { id: ELEV.STICKY, title_zh: 吸顶与固定列的阴影只在滚动后出现 }
  - key: layout
    title_zh: 布局
    group: foundations
    prefix: LAYOUT
    summary_zh: 管理侧与用户侧的页面骨架、适配宽度、内容区边距与宽度、换行优先、滚动归属、层级。
    topics:
      - { id: LAYOUT.ADMIN_SHELL, title_zh: 管理侧页面骨架 }
      - { id: LAYOUT.PUBLIC_SHELL, title_zh: 用户侧页面骨架 }
      - { id: LAYOUT.ADAPTIVE, title_zh: 适配基准与验收宽度 }
      - { id: LAYOUT.CONTENT_REGION, title_zh: 内容区边距与宽度 }
      - { id: LAYOUT.REFLOW, title_zh: 先换行再缩小 }
      - { id: LAYOUT.OVERFLOW, title_zh: 尺寸与滚动的归属 }
      - { id: LAYOUT.Z_INDEX, title_zh: 层级 }
  - key: grid
    title_zh: 栅格
    group: foundations
    prefix: GRID
    summary_zh: 栅格列数、列间距、一行的列数之和、断点，以及参考线什么时候画。
    topics:
      - { id: GRID.COLUMNS, title_zh: 栅格列数 }
      - { id: GRID.GUTTER, title_zh: 列间距 }
      - { id: GRID.ROW_SUM, title_zh: 一行的列数之和 }
      - { id: GRID.BREAKPOINTS, title_zh: 断点 }
      - { id: GRID.GUIDES, title_zh: 参考线 }
  - key: spacing
    title_zh: 间距
    group: foundations
    prefix: SPACING
    summary_zh: 间距只取阶梯值，按元素之间的关系选档。
    topics:
      - { id: SPACING.SCALE, title_zh: 间距阶梯 }
      - { id: SPACING.TIERS, title_zh: 间距分档 }
  - key: motion
    title_zh: 动效
    group: foundations
    prefix: MOTION
    summary_zh: 动效只用来说明变化；时长取 token；尊重减少动效的系统设置。
    topics:
      - { id: MOTION.PURPOSE, title_zh: 动效要有理由 }
      - { id: MOTION.DURATION, title_zh: 时长与缓动 }
      - { id: MOTION.REDUCED, title_zh: 减少动效 }
  - key: press_feedback
    title_zh: 点击反馈
    group: foundations
    prefix: PRESS
    summary_zh: 每个可点的元素都有默认、悬停、按下、聚焦与禁用；按下的瞬间就有反馈，颜色加深一档、不移动不变尺寸；波纹只用组件库自带的；时长取快档；触屏去掉点击延迟、目标够大；键盘触发同样的反馈；禁用与加载中不响应；减少动效时只保留颜色变化。
    topics:
      - { id: PRESS.STATES, title_zh: 可点的元素都有五态 }
      - { id: PRESS.VISUAL, title_zh: 按下时颜色加深一档 }
      - { id: PRESS.WAVE, title_zh: 波纹只用组件库自带的 }
      - { id: PRESS.TIMING, title_zh: 按下即时、回弹取快档 }
      - { id: PRESS.TOUCH, title_zh: 触屏：无延迟、目标够大 }
      - { id: PRESS.KEYBOARD, title_zh: 键盘触发同样的反馈 }
      - { id: PRESS.DISABLED, title_zh: 禁用与加载中不响应 }
      - { id: PRESS.REDUCED, title_zh: 减少动效时只保留颜色变化 }
  - key: focus_ring
    title_zh: 焦点环
    group: foundations
    prefix: FOCUS
    summary_zh: 焦点只在键盘聚焦时显示且永远不去掉；全站一种焦点样式；与相邻颜色有足够对比；不被裁切、不被吸顶栏遮住；焦点顺序与视觉顺序一致，弹层进出时焦点有去处；焦点环跟随元素圆角。
    topics:
      - { id: FOCUS.VISIBLE, title_zh: 键盘聚焦时显示，永远不去掉 }
      - { id: FOCUS.STYLE, title_zh: 全站一种焦点样式 }
      - { id: FOCUS.CONTRAST, title_zh: 与相邻颜色对比足够 }
      - { id: FOCUS.NOT_OBSCURED, title_zh: 不被裁切、不被遮住 }
      - { id: FOCUS.ORDER, title_zh: 焦点顺序与去处 }
      - { id: FOCUS.RADIUS, title_zh: 焦点环跟随元素圆角 }
  # ═════════════════════════════ 组件 · 通用 ═════════════════════════════
  - key: button
    title_zh: 按钮
    group: components.general
    prefix: CMP.BUTTON
    summary_zh: 触发一个会改变状态的动作。改 URL 用链接按钮；一行有多个相关动作时用分裂按钮或下拉菜单。
    counterparts: { antd: [Button], geist: [Button, ButtonLink] }
    topics:
      - { id: CMP.BUTTON.USAGE, title_zh: 何时用 }
      - { id: CMP.BUTTON.VARIANTS, title_zh: 变体 }
      - { id: CMP.BUTTON.DANGER, title_zh: 危险操作 }
      - { id: CMP.BUTTON.SIZES, title_zh: 尺寸 }
      - { id: CMP.BUTTON.SHAPES, title_zh: 形状 }
      - { id: CMP.BUTTON.ICONS, title_zh: 搭配图标 }
      - { id: CMP.BUTTON.ICON_ONLY, title_zh: 纯图标按钮 }
      - { id: CMP.BUTTON.LOADING, title_zh: 加载 }
      - { id: CMP.BUTTON.DISABLED, title_zh: 禁用 }
      - { id: CMP.BUTTON.LINK, title_zh: 链接按钮 }
      - { id: CMP.BUTTON.WIDTH, title_zh: 宽度 }
      - { id: CMP.BUTTON.SUBMIT, title_zh: 表单提交 }
      - { id: CMP.BUTTON.LABEL, title_zh: 文案 }
  - { key: split_button, title_zh: 分裂按钮, group: components.general, prefix: CMP.SPLIT_BUTTON, summary_zh: 一个默认动作加一组相近的动作。, counterparts: { antd: [Dropdown.Button], geist: [Split Button] }, topics: [] }
  - { key: copy_button, title_zh: 复制按钮, group: components.general, prefix: CMP.COPY_BUTTON, summary_zh: 把一段文字复制到剪贴板并给出反馈。, counterparts: { antd: [Typography.copyable], geist: [Copy Button, Text With Copy Button] }, topics: [] }
  - { key: float_button, title_zh: 悬浮按钮, group: components.general, prefix: CMP.FLOAT_BUTTON, summary_zh: 悬浮在页面上的全局功能入口。, counterparts: { antd: [FloatButton], geist: [] }, topics: [] }
  - { key: typography_text, title_zh: 排版文本, group: components.general, prefix: CMP.TEXT, summary_zh: 标题、正文、强调、删除线、可复制与可编辑文本。, counterparts: { antd: [Typography], geist: [Text, Label] }, topics: [] }
  - { key: code_block, title_zh: 代码块, group: components.general, prefix: CMP.CODE_BLOCK, summary_zh: 多行、带高亮的源代码。, counterparts: { antd: [], geist: [Code Block, Code] }, topics: [] }
  - { key: snippet, title_zh: 命令片段, group: components.general, prefix: CMP.SNIPPET, summary_zh: 可一键复制的命令行。, counterparts: { antd: [], geist: [Snippet] }, topics: [] }
  - { key: kbd, title_zh: 键盘按键, group: components.general, prefix: CMP.KBD, summary_zh: 展示触发动作的快捷键。, counterparts: { antd: [Typography.keyboard], geist: [Keyboard Input] }, topics: [] }
  # ═════════════════════════════ 组件 · 布局 ═════════════════════════════
  - key: divider
    title_zh: 分割线
    group: components.layout
    prefix: CMP.DIVIDER
    summary_zh: 把内容分成不同区块。
    counterparts: { antd: [Divider], geist: [Separator] }
    topics:
      - { id: CMP.DIVIDER.SPACING_FIRST, title_zh: 先用间距，再用线 }
      - { id: CMP.DIVIDER.TEXT, title_zh: 带文字的分隔线用于分段 }
      - { id: CMP.DIVIDER.VERTICAL, title_zh: 竖线分隔行内元素 }
  - { key: flex, title_zh: 弹性布局, group: components.layout, prefix: CMP.FLEX, summary_zh: 一维排布与对齐。, counterparts: { antd: [Flex], geist: [] }, topics: [] }
  - key: space
    title_zh: 间距组合
    group: components.layout
    prefix: CMP.SPACE
    summary_zh: 统一相邻元素的间距。
    counterparts: { antd: [Space], geist: [] }
    topics:
      - { id: CMP.SPACE.USE, title_zh: 用间距组件，不手写外边距 }
      - { id: CMP.SPACE.WRAP, title_zh: 放不下就换行 }
      - { id: CMP.SPACE.ALIGN, title_zh: 对齐基线 }
  - { key: grid_component, title_zh: 栅格组件, group: components.layout, prefix: CMP.GRID, summary_zh: 按栅格排布内容。, counterparts: { antd: [Row, Col], geist: [Grid] }, topics: [] }
  - { key: page_layout, title_zh: 页面布局, group: components.layout, prefix: CMP.LAYOUT, summary_zh: 顶栏、侧栏、内容区与页脚组成的页面框架。, counterparts: { antd: [Layout], geist: [] }, topics: [] }
  - { key: scroller, title_zh: 滚动区, group: components.layout, prefix: CMP.SCROLLER, summary_zh: 沿一个方向滚动的一组同类条目。, counterparts: { antd: [], geist: [Scroller] }, topics: [] }
  # ═════════════════════════════ 组件 · 导航 ═════════════════════════════
  - { key: anchor, title_zh: 锚点, group: components.navigation, prefix: CMP.ANCHOR, summary_zh: 在长页面内跳到指定区块。, counterparts: { antd: [Anchor], geist: [] }, topics: [] }
  - key: breadcrumb
    title_zh: 面包屑
    group: components.navigation
    prefix: CMP.BREADCRUMB
    summary_zh: 显示当前页面在层级中的位置。
    counterparts: { antd: [Breadcrumb], geist: [Breadcrumbs] }
    topics:
      - { id: CMP.BREADCRUMB.PATH, title_zh: 从一级开始、最后一项不可点 }
      - { id: CMP.BREADCRUMB.COLLAPSE, title_zh: 太深就折叠 }
      - { id: CMP.BREADCRUMB.NAMES, title_zh: 名称与菜单一致 }
  - key: dropdown
    title_zh: 下拉菜单
    group: components.navigation
    prefix: CMP.DROPDOWN
    summary_zh: 从一个按钮展开一组动作。
    counterparts: { antd: [Dropdown], geist: [Menu, Dots Menu] }
    topics:
      - { id: CMP.DROPDOWN.TRIGGER, title_zh: 触发器说清会展开什么 }
      - { id: CMP.DROPDOWN.ITEMS, title_zh: 动作排序、危险最后 }
      - { id: CMP.DROPDOWN.SIZE, title_zh: 菜单不宜过长 }
  - { key: context_menu, title_zh: 右键菜单, group: components.navigation, prefix: CMP.CONTEXT_MENU, summary_zh: 右击或长按时出现的上下文动作。, counterparts: { antd: [Dropdown.contextMenu], geist: [Context Menu] }, topics: [] }
  - { key: command_menu, title_zh: 命令面板, group: components.navigation, prefix: CMP.COMMAND_MENU, summary_zh: 全局的键盘优先命令入口。, counterparts: { antd: [], geist: [Command Menu] }, topics: [] }
  - key: nav_menu
    title_zh: 导航菜单
    group: components.navigation
    prefix: CMP.NAV_MENU
    summary_zh: 页面的主导航与子导航。
    counterparts: { antd: [Menu], geist: [] }
    topics:
      - { id: CMP.NAV_MENU.DEPTH, title_zh: 不超过两级 }
      - { id: CMP.NAV_MENU.ACTIVE, title_zh: 当前位置高亮 }
      - { id: CMP.NAV_MENU.PERMISSION, title_zh: 按权限出现 }
  - key: pagination
    title_zh: 分页
    group: components.navigation
    prefix: CMP.PAGINATION
    summary_zh: 在分页数据或相邻页面之间切换。
    counterparts: { antd: [Pagination], geist: [Pagination] }
    topics:
      - { id: CMP.PAGINATION.TOTAL, title_zh: 显示总数与范围 }
      - { id: CMP.PAGINATION.URL, title_zh: 页码进 URL }
      - { id: CMP.PAGINATION.POSITION, title_zh: 位置固定 }
  - { key: load_more, title_zh: 加载更多, group: components.navigation, prefix: CMP.LOAD_MORE, summary_zh: 在列表末尾追加下一批数据，或展开收起的内容。, counterparts: { antd: [List.loadMore], geist: [Load More Button, Show More] }, topics: [] }
  - key: steps
    title_zh: 步骤条
    group: components.navigation
    prefix: CMP.STEPS
    summary_zh: 显示多步流程的进度。
    counterparts: { antd: [Steps], geist: [] }
    topics:
      - { id: CMP.STEPS.COUNT, title_zh: 3–5 步 }
      - { id: CMP.STEPS.STATUS, title_zh: 状态分明 }
      - { id: CMP.STEPS.SAVE, title_zh: 跨步保存 }
  - key: tabs
    title_zh: 标签页
    group: components.navigation
    prefix: CMP.TABS
    summary_zh: 在同一页面内切换平级视图。
    counterparts: { antd: [Tabs], geist: [Tabs] }
    topics:
      - { id: CMP.TABS.WHEN, title_zh: 平级视图才用标签页 }
      - { id: CMP.TABS.URL, title_zh: 当前标签进 URL }
      - { id: CMP.TABS.LABEL, title_zh: 标签名短，可带计数 }
  # ═════════════════════════════ 组件 · 数据录入 ═════════════════════════════
  - { key: auto_complete, title_zh: 自动完成, group: components.entry, prefix: CMP.AUTO_COMPLETE, summary_zh: 输入时给出补全建议。, counterparts: { antd: [AutoComplete], geist: [] }, topics: [] }
  - { key: combobox, title_zh: 可搜索选择, group: components.entry, prefix: CMP.COMBOBOX, summary_zh: 输入关键字过滤一个已知列表并选中一项。, counterparts: { antd: [Select.showSearch], geist: [Combobox] }, topics: [] }
  - { key: cascader, title_zh: 级联选择, group: components.entry, prefix: CMP.CASCADER, summary_zh: 从有层级的选项里逐级选择。, counterparts: { antd: [Cascader], geist: [] }, topics: [] }
  - key: checkbox
    title_zh: 多选框
    group: components.entry
    prefix: CMP.CHECKBOX
    summary_zh: 在一组选项里选多个，或确认一句声明。
