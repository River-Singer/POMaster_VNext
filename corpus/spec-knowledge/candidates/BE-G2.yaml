- proposed_id: POLICY.AUTHZ.SERVER_FIVE_FACTOR_VERIFICATION
  source_section: MUST
  source_protocol: .trellis/spec/backend/17-permission-authorization-protocol.md
  source_lines: L25
  source_sha256: d85a431b682a3a7c3dd4a6ee1f67fc375b54edb4a8e7fe98d283103b64a6b41e
  classification: UNIVERSAL_POLICY
  sort: UNIVERSAL
  kind_proposal: policy
  enforcement: required_when_applicable
  vocab_pr_needed: true
  statement_zh: 每个受保护操作在服务端执行时必须完成五元核验：请求主体是谁、要执行什么动作、属于哪个租户、数据范围边界在哪、目标资源归谁所有。
  statement_en_keywords: server-side five-factor verification, subject, action, tenant, data scope, resource ownership
  clean_room: true
  applies_when: {lane: backend, condition: 执行任何受保护操作}
  cross_refs: [POLICY.SEC.TRUST_BOUNDARY_ENFORCEMENT]
  notes: 信任边界通用条款的授权域细化（五元分解为本条独有增量），互引不合并；租户为通用多租户概念非项目专名

- proposed_id: POLICY.AUTHZ.NO_GATING_PROXY_TRUST
  source_section: MUST NOT
  source_protocol: .trellis/spec/backend/17-permission-authorization-protocol.md
  source_lines: L29
  source_sha256: d85a431b682a3a7c3dd4a6ee1f67fc375b54edb4a8e7fe98d283103b64a6b41e
  classification: UNIVERSAL_POLICY
  sort: UNIVERSAL
  kind_proposal: policy
  enforcement: required_when_applicable
  vocab_pr_needed: true
