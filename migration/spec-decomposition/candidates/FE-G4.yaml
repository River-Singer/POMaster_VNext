  statement_zh: 本项目采用最小 locale 机制而非完整多语言框架：locale 单一来源文件提供当前区域、翻译函数与持久化读写，状态仓包装供调试追踪，应用启动时恢复用户上次选择；第三方组件库经配置注入器接线全局区域，网格经取词回调维护词条、未覆盖键回退英文并在切换语言时强制重挂载（取词回调仅初始化时读取）；格式化器读取当前区域而非硬编码。
  statement_en_keywords: minimal locale mechanism, single locale source, provider locale injection, getLocaleText initial only, forced remount
  clean_room: true
  applies_when: {lane: frontend, condition: 维护本项目多语言机制时}
  project_scope: 文件路径、状态仓、注入器、网格取词与重挂载技法均为 MASTer 项目实现决定
