status_legend:
  CONVENTION_LABEL_NO_LITERAL_EXPORT: 形态登记：owner 标签为命名约定词形，src/entities 全域无字面同名导出（如 entities/auth#useAuthQuery vs 实际 useCurrentUser）；只登记不改名，落 KEYBINDING.* 前须人工裁决。
  CONVENTION_LABEL_SYMBOL_ELSEWHERE: 形态登记（模块名 drift）：标签符号在 src/entities 其他模块字面存在（如 entities/ledger#useLedgerQuery 实际在 src/entities/parts-ledger/）——路径段约定与实目录漂移，只登记不改名。
  MECHANICAL_LITERAL_EXPORT: 最高置信：锚路径存在且 export function/const <sym> 字面命中。仍属草表，落 KEYBINDING.* 对象前需人工复核一次。
  MECHANICAL_TOKEN_MATCH_WIRED: wired=true 且 src/ 存在非镜像实现锚（引擎接线态）。
  RESIDUAL_ANCHOR_MISSING: 残差：registry implementation 锚在 src/ 无字面导出（本批实测 formatter 0 条）。
  WIRED_FALSE_ENGINE_REGISTERED_ONLY: wired=false 且仅 registry.ts 代码镜像命中（引擎已注册、无实现锚）——doc §二口径的『注册层完成、接线未做』态。
  WIRED_FALSE_NO_CODE_ANCHOR: wired=false 且 src/ 无任何 token 锚（本批实测 0 条：镜像全量注册在场）。
  WIRED_FALSE_PARALLEL_IMPLEMENTATION_PRESENT: wired=false 但 src/ 存在非镜像同名 token（doc §二『平行实现/游离债务』形态：引擎注册已存在却另写一份）。
  WIRED_NO_IMPLEMENTATION_ANCHOR: 异常：wired=true 但无非镜像实现锚（接线声明缺代码佐证，待人工核）。
