areas:
  # ───────────────────────────── 基础 · 色彩 ─────────────────────────────
  - key: color
    title_zh: 色彩
    group: foundations
    prefix: COLOR
    summary_zh: 品牌色取蓝色板第 6 档；功能色只表达状态；中性色按透明度分出文字、边框、背景三层。色彩用得克制，颜色只经 token 取。
    rules:
      - id: COLOR.PALETTE
        title_zh: 色板
        statement_zh: 基础色板共 12 种主色，每种 10 档，由色板算法从主色派生，不手调；主色固定在第 6 档。界面只从这些色板和中性色里取色。
        rationale_zh: 色板由算法生成，换主色时整套衍生色一起变，深浅关系保持一致。
        params:
          steps: { value: 10, unit: count, source: SRC.ANTD.SPEC.COLORS, label_zh: 每种色板的档数 }
          primary_step: { value: 6, unit: count, source: SRC.ANTD.SPEC.COLORS, label_zh: 主色所在档 }
        enforcement: { kind: review }
        showcase:
          - kind: palette
            title_zh: 品牌色与功能色
            description_zh: 由主题种子色派生，与 ant-design-vue 4.2.6 运行时一致；第 6 档就是种子色本身。
            source: SRC.ANTD.COLORS_GENERATE
            scales:
              - name: primary
                label_zh: 品牌
                swatches:
                  - { name: primary-1, value: "#e6f4ff" }
                  - { name: primary-2, value: "#bae0ff" }
                  - { name: primary-3, value: "#91caff" }
                  - { name: primary-4, value: "#69b1ff" }
                  - { name: primary-5, value: "#4096ff" }
                  - { name: primary-6, value: "#1677ff", usage_zh: 主色 }
                  - { name: primary-7, value: "#0958d9" }
                  - { name: primary-8, value: "#003eb3" }
                  - { name: primary-9, value: "#002c8c" }
                  - { name: primary-10, value: "#001d66" }
              - name: success
                label_zh: 成功
                swatches:
                  - { name: success-1, value: "#f6ffed" }
                  - { name: success-2, value: "#d9f7be" }
                  - { name: success-3, value: "#b7eb8f" }
                  - { name: success-4, value: "#95de64" }
                  - { name: success-5, value: "#73d13d" }
                  - { name: success-6, value: "#52c41a", usage_zh: 主色 }
                  - { name: success-7, value: "#389e0d" }
                  - { name: success-8, value: "#237804" }
                  - { name: success-9, value: "#135200" }
                  - { name: success-10, value: "#092b00" }
              - name: warning
                label_zh: 警告
                swatches:
                  - { name: warning-1, value: "#fffbe6" }
                  - { name: warning-2, value: "#fff1b8" }
                  - { name: warning-3, value: "#ffe58f" }
                  - { name: warning-4, value: "#ffd666" }
                  - { name: warning-5, value: "#ffc53d" }
                  - { name: warning-6, value: "#faad14", usage_zh: 主色 }
                  - { name: warning-7, value: "#d48806" }
                  - { name: warning-8, value: "#ad6800" }
                  - { name: warning-9, value: "#874d00" }
                  - { name: warning-10, value: "#613400" }
              - name: error
