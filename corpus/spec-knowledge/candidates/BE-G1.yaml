    kind: policy
    classification: LANE_POLICY
    sort: HYBRID
    statement_zh: 任何规则修改必须就地落在路由表命中的既有协议文件；只有全部主题与覆盖层均无处归属时才允许新建协议文件，且必须同步双向索引。
