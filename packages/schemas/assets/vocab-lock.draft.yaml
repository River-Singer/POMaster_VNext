  capability_outcome_metric_key:     # §55.1 十六指标机器键（八能力 × Leading/Lagging；PRD L3583-3592 表列机械映射）
    values: [brainstorm_change_convergence_time, in_dev_requirement_rework_rate,
             research_high_risk_unknown_reduction_rate, research_tech_choice_rework_rate,
