        backlog_disposition: backlog_only

      - proposed_id: POLICY.WEB.COMM.DOWNLOAD_REAUTHORIZATION
        triage: UNIVERSAL
        kind_proposal: policy
        classification_suggestion: DUPLICATE
        enforcement_suggestion: advisory
        clean_room: true
        statement_zh: "下载必须重新授权并校验数据范围；文件地址不得构成持久越权入口。"
