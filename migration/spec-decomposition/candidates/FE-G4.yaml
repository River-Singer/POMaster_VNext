# ============ 文件 3/10: frontend/23-accessibility-protocol.md (sha256 542b8843ef53ae6446c84be72f6f76a402d22afc9e55d405a4f1de4c0add0d41) ============

- proposed_id: POLICY.WEB.A11Y.STANDARD_TARGET_WITH_LEDGER
  source_section: MUST + Change Policy
  source_protocol: .trellis/spec/frontend/23-accessibility-protocol.md
  source_lines: L19, L41, L77
  source_sha256: 542b8843ef53ae6446c84be72f6f76a402d22afc9e55d405a4f1de4c0add0d41
  classification: UNIVERSAL_POLICY
  sort: UNIVERSAL
  kind_proposal: policy
  enforcement: required_when_applicable
  vocab_pr_needed: true
  statement_zh: 可访问性以公认无障碍标准的 AA 级为默认达标线；凡未达标项必须逐条登记适用成功准则、影响、替代路径、责任人与修复期限，任何例外都要留下同样完整的台账。
  statement_en_keywords: wcag aa default target, non-conformance ledger, alternative path, owner, deadline
  clean_room: true
  applies_when: {lane: frontend, condition: 设定可访问性目标或申请例外时}
  uncertainty: statement 保留公开标准名（WCAG 2.2 AA）——属国际标准非项目专名，判可入 Universal；若汇总组从严可参数化为『公认无障碍标准 AA 级』（现措辞已按此泛化，源文 L19/L42 为 WCAG 2.2 AA）
- proposed_id: POLICY.WEB.A11Y.KEYBOARD_FOCUS_ORDER
  source_section: MUST + MUST NOT
  source_protocol: .trellis/spec/frontend/23-accessibility-protocol.md
  source_lines: L20, L35
  source_sha256: 542b8843ef53ae6446c84be72f6f76a402d22afc9e55d405a4f1de4c0add0d41
  classification: UNIVERSAL_POLICY
  sort: UNIVERSAL
  kind_proposal: policy
  enforcement: required_when_applicable
  vocab_pr_needed: true
  statement_zh: 每一处交互都必须能仅用键盘完成，焦点移动次序与视觉呈现次序一致；移除焦点轮廓而不提供同等可见替代，视为违规。
  statement_en_keywords: keyboard operable, focus order matches visual order, no focus outline removal
  clean_room: true
  applies_when: {lane: frontend, condition: 实现任何交互时}
- proposed_id: POLICY.WEB.A11Y.SEMANTIC_EQUIVALENCE
  source_section: MUST + MUST NOT
  source_protocol: .trellis/spec/frontend/23-accessibility-protocol.md
  source_lines: L21, L34
  source_sha256: 542b8843ef53ae6446c84be72f6f76a402d22afc9e55d405a4f1de4c0add0d41
  classification: UNIVERSAL_POLICY
  sort: UNIVERSAL
  kind_proposal: policy
  enforcement: required_when_applicable
  vocab_pr_needed: true
  statement_zh: 控件必须使用原生语义或提供完整等价语义；拿无语义容器冒充可交互控件一律禁止。
  statement_en_keywords: native semantics, equivalent semantics, no semantic-free div buttons
  clean_room: true
  applies_when: {lane: frontend, condition: 实现控件时}
- proposed_id: POLICY.WEB.A11Y.FOCUS_TRAP_AND_RETURN
  source_section: MUST + MUST NOT
  source_protocol: .trellis/spec/frontend/23-accessibility-protocol.md
  source_lines: L22, L37
  source_sha256: 542b8843ef53ae6446c84be72f6f76a402d22afc9e55d405a4f1de4c0add0d41
  classification: UNIVERSAL_POLICY
  sort: UNIVERSAL
  kind_proposal: policy
  enforcement: required_when_applicable
  vocab_pr_needed: true
  statement_zh: 浮层打开时接管焦点，关闭后焦点必须回到触发点；焦点泄入背景内容视为缺陷。
  statement_en_keywords: focus trap, focus return to trigger, no focus leak
  clean_room: true
  applies_when: {lane: frontend, condition: 实现弹层类组件时}
- proposed_id: POLICY.WEB.A11Y.ASSISTIVE_STATUS_ANNOUNCEMENT
  source_section: MUST
  source_protocol: .trellis/spec/frontend/23-accessibility-protocol.md
  source_lines: L23, L28
  source_sha256: 542b8843ef53ae6446c84be72f6f76a402d22afc9e55d405a4f1de4c0add0d41
  classification: UNIVERSAL_POLICY
  sort: UNIVERSAL
  kind_proposal: policy
  enforcement: required_when_applicable
  vocab_pr_needed: true
  statement_zh: 校验错误必须与对应字段显式关联；状态消息、异步结果与进度变化必须能被辅助技术识别，且不得借此抢夺用户焦点。
  statement_en_keywords: error field association, live announcements, async results, no focus stealing
  clean_room: true
  applies_when: {lane: frontend, condition: 实现动态状态反馈时}
- proposed_id: POLICY.WEB.A11Y.COLOR_NOT_SOLE_CHANNEL
  source_section: MUST + MUST NOT
  source_protocol: .trellis/spec/frontend/23-accessibility-protocol.md
  source_lines: L24, L36
  source_sha256: 542b8843ef53ae6446c84be72f6f76a402d22afc9e55d405a4f1de4c0add0d41
  classification: UNIVERSAL_POLICY
  sort: UNIVERSAL
  kind_proposal: policy
  enforcement: required_when_applicable
  vocab_pr_needed: true
  statement_zh: 颜色永远不能是信息的唯一载体；文本与交互元素必须满足项目对比度标准；只靠颜色、悬停或悬浮提示传递关键信息一律禁止。
  statement_en_keywords: color not sole channel, contrast requirement, no hover-only info
  clean_room: true
  applies_when: {lane: frontend, condition: 用颜色表达状态或信息时}
- proposed_id: POLICY.WEB.A11Y.FOCUS_OCCLUSION_DRAG_TARGET
  source_section: MUST
  source_protocol: .trellis/spec/frontend/23-accessibility-protocol.md
  source_lines: L26-L27
  source_sha256: 542b8843ef53ae6446c84be72f6f76a402d22afc9e55d405a4f1de4c0add0d41
  classification: UNIVERSAL_POLICY
  sort: UNIVERSAL
  kind_proposal: policy
  enforcement: required_when_applicable
  vocab_pr_needed: true
  statement_zh: 键盘焦点不得被吸顶栏、浮层或其他作者自建内容完全遮住；依赖拖拽的操作必须提供免拖拽的等价路径；交互目标的尺寸与间距必须满足达标线对应的成功准则。
  statement_en_keywords: focus not obscured, dragging alternatives, target size
  clean_room: true
  applies_when: {lane: frontend, condition: 实现吸顶布局、拖拽交互或小尺寸控件时}
- proposed_id: POLICY.WEB.A11Y.AUTH_FLOW_ACCESSIBILITY
  source_section: MUST
  source_protocol: .trellis/spec/frontend/23-accessibility-protocol.md
  source_lines: L29
  source_sha256: 542b8843ef53ae6446c84be72f6f76a402d22afc9e55d405a4f1de4c0add0d41
  classification: UNIVERSAL_POLICY
  sort: UNIVERSAL
  kind_proposal: policy
  enforcement: required_when_applicable
  vocab_pr_needed: true
  statement_zh: 登录与认证流程必须兼容密码管理器与粘贴输入，不得强迫用户仅凭记忆、抄写或解谜完成认证；确有安全例外须走正式批准流程。
  statement_en_keywords: accessible authentication, paste allowed, no cognitive test, security exception approval
  clean_room: true
  applies_when: {lane: frontend, condition: 实现认证流程时}
- proposed_id: POLICY.WEB.A11Y.ERROR_PREVENTION_NO_REENTRY
  source_section: MUST
  source_protocol: .trellis/spec/frontend/23-accessibility-protocol.md
  source_lines: L30
  source_sha256: 542b8843ef53ae6446c84be72f6f76a402d22afc9e55d405a4f1de4c0add0d41
  classification: UNIVERSAL_POLICY
  sort: UNIVERSAL
  kind_proposal: policy
  enforcement: required_when_applicable
  vocab_pr_needed: true
  statement_zh: 同一流程里用户已录入的信息不得无理由要求二次录入；高风险操作必须提供确认、复核、撤销或等效的防错机制。
  statement_en_keywords: no redundant entry, high risk confirmation, undo, error prevention
  clean_room: true
  applies_when: {lane: frontend, condition: 设计多步流程或高风险操作时}
- proposed_id: POLICY.WEB.A11Y.SCAN_NOT_SOLE_EVIDENCE
  source_section: MUST NOT + SHOULD
  source_protocol: .trellis/spec/frontend/23-accessibility-protocol.md
