        classification_proposal: LANE_POLICY
        statement_zh: "所有表格列的默认最小宽度必须能完整显示列标题（不允许省略号），由文本测量加占位计算得出；列宽拖拽调整机制必须保留；主题上下文变量须从实际渲染作用域读取而非根作用域。"
