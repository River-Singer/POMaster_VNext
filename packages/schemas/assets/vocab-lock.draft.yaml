  diagnosis_kind:             # §95.3 诊断三分（PRD L6153 逐字语义；SCREAMING_SNAKE 词形——§31 challenge classification 词形 ARCHITECTURE_EVOLUTION 同源先例；大小写裁定 Owner 2026-09-01 照准）
    values: [IMPLEMENTATION_ISSUE, CONFIG_ISSUE, ARCHITECTURE_EVOLUTION]
    note: 与 §31 分类词表同形复用不发明新值；§95.2 链序封条：diagnosis 必持存在且 BREACHED 的 band evidence（kernel DIAGNOSIS_WITHOUT_BREACH_EVIDENCE）
  capability_outcome_metric_status:  # §55.1 指标机算状态两值（P34 任务定案；fail-closed 分账）
