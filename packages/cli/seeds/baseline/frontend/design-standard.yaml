# baseline/frontend/design-standard.yaml —— 前端设计规范（Ant Design 体系 · Vue 栈预设）
#
# 这是 Storybook「规范」分区与 AI 孪生的单一结构化源：人看的规范页、AI 读的孪生、
# `pomaster design show` 的输出都从这里同源生成，并盖同一个规范指纹。
#
# 怎么改（AI 与人同一条路）：
#   1. 直接改本文件（新增规则、改数值、补示例）；
#   2. `pomaster design validate` 校验（闭世界：未知键、未登记出处、锚点原文对不上、
#      实时示例引用了待定参数……一次报全）；
#   3. 重新生成 Storybook（`node packages/studio/run.mjs generate`），页面与孪生随之更新。
#   页面和孪生都不手改。
#
# 纪律：
#   - 定值必须带出处（sources 登记：标题、链接、核实日期）；没有权威数值的写成 decision
#     （项目决策位，框架不替项目选），或引用 design-tokens 里仍为 UNKNOWN 的 token；
#   - 条文用自己的话写成可执行条款；官方文档只取数值与规则要点，不搬原文；
#   - 锚点（anchors）逐字摘自主题硬规范，校验时逐条核对原文仍在——成文规则只有一个来源；
#   - 机器可查的规则写 enforcement.kind: gate（门禁直接拦，D-S8），其余写 review。
#
# 实时示例（examples[].template）是 Vue 模板，Storybook 里真渲染：`p` 是本条规则的参数
# （已解析的值），`t` 是 token 表（如 t['spacing.lg']）。示例只能引用已定的值。
schema: pomaster.design-standard/v1
meta:
  origin: preset
  customized: false
  design_system: antd
  ui_library: ant-design-vue@4.2.6

