    materialize: {recommendation: backlog, reason: HYBRID，通用化变体（唯一权威文件原则）可作 R-F 式上提候选留 Owner}

  - proposed_id: POLICY.SPEC.FAMILY_CONFLICT_PRECEDENCE
    kind: policy
    classification: LANE_POLICY
    sort: HYBRID
    statement_zh: 族内规则冲突按固定优先序裁决——安全优先于便利，服务端权威授权优先于客户端展示，正式契约优先于替代品、历史示例与会话记录，权威语义协议优先于边界转换协议。
    statement_en_keywords: [conflict precedence, security over convenience, formal contract priority]
    applies_when: {lane: any, condition: 族内协议语义冲突裁决}
    enforcement: advisory
    clean_room: true
