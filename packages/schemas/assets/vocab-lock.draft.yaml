software_graph_vocab:   # P-v06 Software Graph / Engineering Substrate 词轴（PR-0006 收编；Owner 四决议 D-1~D-4 2026-09-02 批准——.trellis/tasks/09-02-vnext-prd-v06-governed-substrate/prd.md；PRD v0.6 §6-8/§111/§148-149/§162-163 + PRD v0.6.1 §2/§69/§73/§75 逐字 + 批次裁定补位词；schema 冻结锚 19-relations definitions + kernel relations.ts / resolver.ts / analyzer-contract.ts；扩值走词汇表 PR）
  relation_type:         # Typed Relation 词表首批 8 值（PRD v0.6 §7 Relation Model 逐字词形 + D-2 裁定补位 INSTANCE_OF；「只收真实消费」纪律——PRD §7 其余词形（OWNS/DEPENDS_ON/CONSUMES/TRANSFORMS/PUBLISHES/SUBSCRIBES/CACHES/INVALIDATES/DEPLOYS_AS/RUNS_ON/CONNECTS_TO/AUTHENTICATES_WITH/AUTHORIZED_BY/USES_TOKEN/USES_COMPONENT/PRODUCES/GOVERNED_BY/CHANGED_BY 等）待真实消费者落地逐批 append-only 增补，禁一次性登记空词）
    values: [INSTANCE_OF, IMPLEMENTS, CONTAINS, CALLS, READS, WRITES, VERIFIED_BY, DERIVED_FROM]
    notes:
      INSTANCE_OF: 项目对象 → archetype/catalog 标准件（D-2 裁定：v0.6.1 §84 instance binding 的边化落法——定义住 catalog 面、实例边住 sidecar）
      IMPLEMENTS: 实现（PRD §7 逐字）
      CONTAINS: 组成（PRD §7 逐字）
      CALLS: 调用（PRD §7 逐字）
      READS: 数据读（PRD §7 逐字）
      WRITES: 数据写（PRD §7 逐字）
      VERIFIED_BY: 被什么验证（PRD §111 Trace Everything 逐字）
      DERIVED_FROM: 派生来源（PRD §7 逐字；机器派生边的 provenance 承载位）
    note: MAPS_TO_SOURCE 语义由既有 key_bindings 承载（D15——ID↔路径锚是一等公民，零新增边型）；SUPERSEDES 语义由信封 supersedes/successor_ref 承载零新增（PRD §7 词形在既有机制已有承载位的不重复登记）
  relation_origin:       # 边来源三值（PRD v0.6 §8 Graph Provenance 语义的边侧承载：source_type STATIC_ANALYSIS→static_analysis / 运行时 trace→runtime_trace / 人类/治理声明→human_declared）
    values: [static_analysis, runtime_trace, human_declared]
    note: >-
      与 SOURCE_TYPE_ALL_VALUES（02 信封 sources[].type 十值，PR-0007 起）正交——那是对象侧来源词表，本轴是边侧 provenance 来源
      （snake_case 机器词形，PRESENTATION/production 信号源词形先例）。runtime_trace 边必须附 observation_ref
      （OBS-n / POB-<12hex> 通路词形——「Agent 必须证明我看过」§6.13 封条纪律的边侧镜像）。
  relation_endpoint_domain:  # 边端点域两值（D-2：边端点可指 governed id（truth 面）或 catalog 条目 id（catalog 面））
    values: [truth, catalog]
    note: truth 端点词形须过 parseGovernedId（A5 closed-world）；catalog 端点词形须命中 catalog-lock entries 分母（存在性归消费 gate/loader 判卷——「本面只解析命名，存在性归消费面」equivalence 三腿链先例）；两端点域可同可异（INSTANCE_OF 典型=truth→catalog）
  relation_confidence:   # 边置信三级（PRD v0.6 §8 Graph Provenance confidence.deterministic 语义的三级化 + §148 Analyzer Output Contract confidence 位；批次裁定补位词）
    values: [deterministic, probable, declared]
    note: deterministic=机器确定性派生（AST/import 等可重算）；probable=机器非确定派生（启发式 analyzer——必须附 unresolved/parse_failures 披露，§148）；declared=人类/治理显式声明。与 state_axes.confidence（UNRESOLVED/EXPERIMENTAL/PROVISIONAL/LOCKED 对象治理轴）正交、值域不相交禁混用
  substrate_layer:      # Engineering Substrate 七层（PRD v0.6.1 §2 分层逐字：Foundation→Primitive→Pattern→Archetype→Reference Solution→Project Baseline→Business Delta；SCREAMING_SNAKE 词形化——§91.3 词形大写化先例；空格词形转下划线：Reference Solution→REFERENCE_SOLUTION）
    values: [FOUNDATION, PRIMITIVE, PATTERN, ARCHETYPE, REFERENCE_SOLUTION, PROJECT_BASELINE, BUSINESS_DELTA]
    note: >-
      archetype 物料的必填分层位（catalog_layer_vocab.catalog_kind=archetype 的物料级轴）：
      逐层稳定度递减、复用面递增方向即 §2 箭头序；批次 1 物料首落 ARCHETYPE 层
      （PAGE_ARCHETYPE/ARCHETYPE.BACKEND/DATA_ARCHETYPE 族）+ 少量 FOUNDATION 层
      design foundations；层间组合约束（§2.4 组合语义）归物料 composition 字段与
      后续批次 SOP 面，本轴只登记分层归属。
  resolution_match_class:  # Resolver 匹配分类六值（PRD v0.6.1 §69 Requirement Resolution SOP 分类清单逐字）
    values: [EXACT_MATCH, CONFIGURABLE_MATCH, COMPOSABLE_MATCH, EXTENSIBLE_MATCH, REFERENCE_MATCH, NO_MATCH]
    note: >-
      只有 NO_MATCH 才允许进入 Design Synthesis（§69 逐字）；New Entity Gate 判卷消费本轴（§75 五否证明）。
      Resolver MVP 确定性派生覆盖 EXACT_MATCH / CONFIGURABLE_MATCH / EXTENSIBLE_MATCH / NO_MATCH 四值；
      COMPOSABLE_MATCH / REFERENCE_MATCH 为批次 2+ 组合分析预留位（登记全闭包、派生覆盖子集——缺席显式不伪造）。
      Anti-Hallucination（§87）：advisory 面（knowledge/policy）命中不改变 match_class——advisory ≠ match。
  object_family:         # 十二 Object Family（PRD v0.6 §6.1 Object Family 十二族逐字）——**family=派生视图**（PRD §1.2 Derived Facts Must Be Derived：由前缀映射机器派生，零信封改动；PREFIX_FAMILY_MAP 见 kernel family.ts；PRD §163 Phase C：新 family 待真实对象出现走词汇表 PR 增前缀，本轴不扩值）
    values: [PRODUCT, UI, INTERFACE, CODE, DATA, RUNTIME, RESOURCE, RELIABILITY, SECURITY, DELIVERY, GOVERNANCE, EVIDENCE]
    note: >-
      既有 15 前缀的派生映射：PAGE/COMPONENT→UI；CAPABILITY→PRODUCT；API_REQ/ERR→INTERFACE；FIELD→DATA；
      KEYBINDING→CODE；KNOWLEDGE/CHANGE/TASK/DENOMINATOR/POLICY/PROFILE/AUTHORITY→GOVERNANCE；TEST→EVIDENCE。
      RUNTIME/RESOURCE/RELIABILITY/SECURITY/DELIVERY 五族暂无前缀映射（派生为 null 显式缺席——禁猜测，§163 Phase C 逐批落）

digest_ethics:          # D24 落地注记 —— 全局适用于一切 sha256/digest 字段
  write_blocking: false           # digest 永不作为写入门闸
  side: read_only_service         # identity / rerun-shortcut / tamper-audit
  human_touch: forbidden          # 人不可计算/核对/传递任何 sha；事务自动维护
  violation_treatment: WARN + auto-regen hint
