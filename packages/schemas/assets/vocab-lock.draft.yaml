production_band_vocab:  # P34 Production Feedback / Control Band 词轴（PR-0004 收编；Owner 决议 2026-09-01 批准；§95/§30/§55.1/§90.4 逐字 + P34 任务定案补位词；schema 冻结锚 15-production-band definitions + kernel production.ts；扩值走词汇表 PR）
  phase_timeline:             # §30 开发时间轴四态（PRD L2554-2563 逐字）
    values: [PRE_DEV, IN_DEV, POST_DEV, IN_PRODUCTION]
    note: 与 state_axes.lifecycle 正交（对象生命周期轴 vs 开发阶段轴，值域不相交禁混用）；band.phase 为本轴的 band 级收窄恒 IN_PRODUCTION（§95 生产反馈带只在第四态生效——PRE_DEV/IN_DEV/POST_DEV 门禁归 Gauntlet/Gate 体系）
  production_signal_source:   # §95.2 生产信号源五词形（PRD L6126「metric / log / error budget / SLO / control band」逐字）
    values: [metric, log, error_budget, slo, control_band]
    note: 空格词形转 snake_case 映射注记：error budget→error_budget、control band→control_band、SLO→slo（映射随 PR-0004 呈报 Owner 照准）
  band_predicate_operator:    # 击穿谓词算子五值（P34 任务定案机器词形；§95.2「不得把是否异常完全交给 LLM 主观判断」的判定面闭集）
    values: [gt, lt, gte, lte, between]
    note: machine-evaluable 谓词——判定通路只接受显式算子+数值阈值，禁自由文本判据字段；between 须 threshold+threshold_max 成对（闭区间健康带），单阈值算子携带 threshold_max 非法（单/双阈值互斥）
  control_band_evaluation_status:  # band 判定三态（P34 fail-closed 纪律；P32 PASS/FAIL/NOT_RUN 三态显式同源）
    values: [OK, BREACHED, NOT_EVALUABLE]
    note: OK=带内；BREACHED=击穿（产 Evidence，detected_by=tool_signal）；NOT_EVALUABLE=不可判（显式缺席绝不静默折算 OK）。与 03 VERDICT_VALUES 七态正交（band 判定是 §95.2 Deterministic Detection 面，不是 gate 判卷面）；缺席归因呈现码见 not_evaluable_detail_reasons
  not_evaluable_detail_reasons:    # NOT_EVALUABLE 缺席归因呈现码三值（observation 台账 detail 字段结构化前缀）
    values: [METRIC_NAME_MISMATCH, VALUE_NOT_FINITE_NUMBER, PREDICATE_CORRUPT]
    note: detail 是自由文本留痕位，本轴值是其前缀呈现码（CLI hint 提示机器回溯用）；非独立字段枚举——判定三态以 control_band_evaluation_status 为准
  diagnosis_kind:             # §95.3 诊断三分（PRD L6153 逐字语义；SCREAMING_SNAKE 词形——§31 challenge classification 词形 ARCHITECTURE_EVOLUTION 同源先例；大小写裁定 Owner 2026-09-01 照准）
    values: [IMPLEMENTATION_ISSUE, CONFIG_ISSUE, ARCHITECTURE_EVOLUTION]
    note: 与 §31 分类词表同形复用不发明新值；§95.2 链序封条：diagnosis 必持存在且 BREACHED 的 band evidence（kernel DIAGNOSIS_WITHOUT_BREACH_EVIDENCE）
  capability_outcome_metric_status:  # §55.1 指标机算状态两值（P34 任务定案；fail-closed 分账）
    values: [MEASURED, NOT_MEASURABLE_YET]
    note: MEASURED=从既有 gate/evidence 台账机算成立（附 value+numerator/denominator 分账口径披露）；NOT_MEASURABLE_YET=不可机算显式缺席（附理由——绝不冒充数值，§55.1「Metrics 用于风险提示，不直接替代专业判断」fail-closed 半边）
  capability_outcome_metric_key:     # §55.1 十六指标机器键（八能力 × Leading/Lagging；PRD L3583-3592 表列机械映射）
    values: [brainstorm_change_convergence_time, in_dev_requirement_rework_rate,
             research_high_risk_unknown_reduction_rate, research_tech_choice_rework_rate,
             context_hit_or_redundancy_rate, agent_boundary_violation_rate,
             profile_first_hit_rate, governance_overhead,
             arch_gate_predev_interceptions, architecture_rework_rollback_rate,
             relevant_knowledge_hit_rate, same_class_bug_recurrence_rate,
             gauntlet_first_pass_pass_rate, production_change_failure_rate,
             drift_detection_rate, cross_session_state_error_rate]
    note: 人读呈现列（八能力三列原文）以 kernel CAPABILITY_OUTCOME_METRICS 常量逐字承载，本轴是机器消费键；v1 可算子集=gauntlet_first_pass_pass_rate + arch_gate_predev_interceptions（「开发前拦截数」口径取 ARCHITECTURE 门 verdict∈{failed,blocked} 计数——实现裁定随 P34 呈报件呈报），其余十四位显式 NOT_MEASURABLE_YET
  self_improvement_signal:    # §90.4 自改进八信号（PRD L5686-5693 八条 bullet 逐字语义 snake_case 机器词形）
    values: [governance_overhead_ratio_anomaly, gate_high_frequency_false_positive,
             role_without_independent_evidence, registry_empty_or_duplicate_view,
             context_oversized_low_utilization, repeated_architecture_challenge,
             profile_frequent_manual_deescalation, profile_frequent_inflight_escalation]
    note: 人读原文列 self_improvement_signal_prd_labels 逐字镜像（一词二形成文收编——content_drift 先例：登记歧义而非消歧）；登记产物 kind 恒 POMASTER_SELF_IMPROVEMENT_CANDIDATE 呈报态——「不得自动应用」（L5695 逐字）由 kernel production.ts 结构封条承载（导出面无任何 Router/Profile/Gate 配置修改函数）
  self_improvement_signal_prd_labels:  # §90.4 八信号人读原文逐字镜像（键=机器词形，值=PRD bullet 原文；AGENT_ROLE_POOL_PRD_HEADINGS 一词二形同款先例）
    governance_overhead_ratio_anomaly: Governance Overhead Ratio 长期异常
    gate_high_frequency_false_positive: 某 Gate 高频产生误报
    role_without_independent_evidence: 某 Agent Role 几乎从不带来独立 Evidence
    registry_empty_or_duplicate_view: 某 Registry 长期为空或重复另一 Object View
    context_oversized_low_utilization: Context 长期过大但实际使用率低
    repeated_architecture_challenge: 相同 Architecture Challenge 重复出现
    profile_frequent_manual_deescalation: Profile 经常被人工降级，说明 Router 过度保守
    profile_frequent_inflight_escalation: Profile 经常在开发中升级，说明 Triage 过度乐观
  product_word_forms:         # 产物/常量词形（单词常量位；MEMORY_DRIFT 单词常量承载先例）
    POMASTER_SELF_IMPROVEMENT_CANDIDATE: §90.4 L5695 逐字产物词形（登记产物 kind 字段恒携带；呈报位非应用位）
    tool_signal: §95.2 Deterministic Detection 判定主体词形（breach Evidence detected_by 恒值——C5「判定来自工具信号非 LLM 自报」的承载位）
  cli_error_codes:            # production CLI 错误词形族六值（P34b 任务定案；kernel GovernanceError 码位之上的命令面呈现码——确定性一一对应映射，禁子串/模糊猜测映射）
    values: [BAND_SCHEMA_INVALID, BAND_NOT_FOUND, OBSERVATION_NOT_EVALUABLE,
             CHALLENGE_REJECTED, EVIDENCE_NOT_FOUND, DIAGNOSIS_WITHOUT_BREACH_EVIDENCE]
    note: 第 6 位 DIAGNOSIS_WITHOUT_BREACH_EVIDENCE 与 kernel GovernanceErrorCode 同名同义（族内唯一同名者，零二次造词——透传复用）。命令组词形 production + 六子命令名（band/evaluate/challenge/diagnose/metrics/self-improvement）非本词表管辖（命令面命名权 Owner 2026-09-01 认可，落档 docs/kernel-api.md production 命令段；memory CLI 六命令 P33b 同款先例：词表只收错误词形族不收命令名）

software_graph_vocab:   # P-v06 Software Graph / Engineering Substrate 词轴（PR-0006 收编；Owner 四决议 D-1~D-4 2026-09-02 批准——.trellis/tasks/09-02-vnext-prd-v06-governed-substrate/prd.md；PRD v0.6 §6-8/§111/§148-149/§162-163 + PRD v0.6.1 §2/§69/§73/§75 逐字 + 批次裁定补位词；schema 冻结锚 19-relations definitions + kernel relations.ts / resolver.ts / analyzer-contract.ts；扩值走词汇表 PR）
  relation_type:         # Typed Relation 词表首批 8 值（PRD v0.6 §7 Relation Model 逐字词形 + D-2 裁定补位 INSTANCE_OF；「只收真实消费」纪律——PRD §7 其余词形（OWNS/DEPENDS_ON/CONSUMES/TRANSFORMS/PUBLISHES/SUBSCRIBES/CACHES/INVALIDATES/DEPLOYS_AS/RUNS_ON/CONNECTS_TO/AUTHENTICATES_WITH/AUTHORIZED_BY/USES_TOKEN/USES_COMPONENT/PRODUCES/GOVERNED_BY/CHANGED_BY 等）待真实消费者落地逐批 append-only 增补，禁一次性登记空词）
    values: [INSTANCE_OF, IMPLEMENTS, CONTAINS, CALLS, READS, WRITES, VERIFIED_BY, DERIVED_FROM]
    notes:
      INSTANCE_OF: 项目对象 → archetype/catalog 标准件（D-2 裁定：v0.6.1 §84 instance binding 的边化落法——定义住 catalog 面、实例边住 sidecar）
      IMPLEMENTS: 实现（PRD §7 逐字）
      CONTAINS: 组成（PRD §7 逐字）
      CALLS: 调用（PRD §7 逐字）
      READS: 数据读（PRD §7 逐字）
      WRITES: 数据写（PRD §7 逐字）
      VERIFIED_BY: 被什么验证（PRD §111 Trace Everything 逐字）
      DERIVED_FROM: 派生来源（PRD §7 逐字；机器派生边的 provenance 承载位）
    note: MAPS_TO_SOURCE 语义由既有 key_bindings 承载（D15——ID↔路径锚是一等公民，零新增边型）；SUPERSEDES 语义由信封 supersedes/successor_ref 承载零新增（PRD §7 词形在既有机制已有承载位的不重复登记）
  relation_origin:       # 边来源三值（PRD v0.6 §8 Graph Provenance 语义的边侧承载：source_type STATIC_ANALYSIS→static_analysis / 运行时 trace→runtime_trace / 人类/治理声明→human_declared）
    values: [static_analysis, runtime_trace, human_declared]
    note: >-
      与 SOURCE_TYPE_ALL_VALUES（02 信封 sources[].type 十值，PR-0007 起）正交——那是对象侧来源词表，本轴是边侧 provenance 来源
      （snake_case 机器词形，PRESENTATION/production 信号源词形先例）。runtime_trace 边必须附 observation_ref
      （OBS-n / POB-<12hex> 通路词形——「Agent 必须证明我看过」§6.13 封条纪律的边侧镜像）。
  relation_endpoint_domain:  # 边端点域两值（D-2：边端点可指 governed id（truth 面）或 catalog 条目 id（catalog 面））
    values: [truth, catalog]
    note: truth 端点词形须过 parseGovernedId（A5 closed-world）；catalog 端点词形须命中 catalog-lock entries 分母（存在性归消费 gate/loader 判卷——「本面只解析命名，存在性归消费面」equivalence 三腿链先例）；两端点域可同可异（INSTANCE_OF 典型=truth→catalog）
  relation_confidence:   # 边置信三级（PRD v0.6 §8 Graph Provenance confidence.deterministic 语义的三级化 + §148 Analyzer Output Contract confidence 位；批次裁定补位词）
    values: [deterministic, probable, declared]
    note: deterministic=机器确定性派生（AST/import 等可重算）；probable=机器非确定派生（启发式 analyzer——必须附 unresolved/parse_failures 披露，§148）；declared=人类/治理显式声明。与 state_axes.confidence（UNRESOLVED/EXPERIMENTAL/PROVISIONAL/LOCKED 对象治理轴）正交、值域不相交禁混用
  substrate_layer:      # Engineering Substrate 七层（PRD v0.6.1 §2 分层逐字：Foundation→Primitive→Pattern→Archetype→Reference Solution→Project Baseline→Business Delta；SCREAMING_SNAKE 词形化——§91.3 词形大写化先例；空格词形转下划线：Reference Solution→REFERENCE_SOLUTION）
    values: [FOUNDATION, PRIMITIVE, PATTERN, ARCHETYPE, REFERENCE_SOLUTION, PROJECT_BASELINE, BUSINESS_DELTA]
    note: >-
      archetype 物料的必填分层位（catalog_layer_vocab.catalog_kind=archetype 的物料级轴）：
      逐层稳定度递减、复用面递增方向即 §2 箭头序；批次 1 物料首落 ARCHETYPE 层
      （PAGE_ARCHETYPE/ARCHETYPE.BACKEND/DATA_ARCHETYPE 族）+ 少量 FOUNDATION 层
      design foundations；层间组合约束（§2.4 组合语义）归物料 composition 字段与
      后续批次 SOP 面，本轴只登记分层归属。
  resolution_match_class:  # Resolver 匹配分类六值（PRD v0.6.1 §69 Requirement Resolution SOP 分类清单逐字）
    values: [EXACT_MATCH, CONFIGURABLE_MATCH, COMPOSABLE_MATCH, EXTENSIBLE_MATCH, REFERENCE_MATCH, NO_MATCH]
    note: >-
      只有 NO_MATCH 才允许进入 Design Synthesis（§69 逐字）；New Entity Gate 判卷消费本轴（§75 五否证明）。
      Resolver MVP 确定性派生覆盖 EXACT_MATCH / CONFIGURABLE_MATCH / EXTENSIBLE_MATCH / NO_MATCH 四值；
      COMPOSABLE_MATCH / REFERENCE_MATCH 为批次 2+ 组合分析预留位（登记全闭包、派生覆盖子集——缺席显式不伪造）。
      Anti-Hallucination（§87）：advisory 面（knowledge/policy）命中不改变 match_class——advisory ≠ match。
  object_family:         # 十二 Object Family（PRD v0.6 §6.1 Object Family 十二族逐字）——**family=派生视图**（PRD §1.2 Derived Facts Must Be Derived：由前缀映射机器派生，零信封改动；PREFIX_FAMILY_MAP 见 kernel family.ts；PRD §163 Phase C：新 family 待真实对象出现走词汇表 PR 增前缀，本轴不扩值）
    values: [PRODUCT, UI, INTERFACE, CODE, DATA, RUNTIME, RESOURCE, RELIABILITY, SECURITY, DELIVERY, GOVERNANCE, EVIDENCE]
    note: >-
      既有 15 前缀的派生映射（v0.6 时点）：PAGE/COMPONENT→UI；CAPABILITY→PRODUCT；API_REQ/ERR→INTERFACE；FIELD→DATA；
      KEYBINDING→CODE；KNOWLEDGE/CHANGE/TASK/DENOMINATOR/POLICY/PROFILE/AUTHORITY→GOVERNANCE；TEST→EVIDENCE。
      PR-0008（v0.7）同批补映射：SPEC→EVIDENCE（Evidence Spec 要求面住证据族——Spec 持要求不持判定）。
      RUNTIME/RESOURCE/RELIABILITY/SECURITY/DELIVERY 五族暂无前缀映射（派生为 null 显式缺席——禁猜测，§163 Phase C 逐批落）

