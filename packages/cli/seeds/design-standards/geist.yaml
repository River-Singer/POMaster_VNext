              - name: pink
                label_zh: 粉
                swatches:
                  - { name: pink-100, pending_zh: 未公开 }
                  - { name: pink-200, pending_zh: 未公开 }
                  - { name: pink-300, pending_zh: 未公开 }
                  - { name: pink-400, pending_zh: 未公开 }
                  - { name: pink-500, pending_zh: 未公开 }
                  - { name: pink-600, pending_zh: 未公开 }
                  - { name: pink-700, pending_zh: 未公开 }
                  - { name: pink-800, pending_zh: 未公开 }
                  - { name: pink-900, pending_zh: 未公开 }
                  - { name: pink-1000, pending_zh: 未公开 }

      - id: COLOR.TOKENS_ONLY
        title_zh: 颜色只经 token 取
        statement_zh: 颜色只经主题变量取：Geist 色阶用 ds- 前缀的颜色类（bg-ds-gray-100、text-ds-gray-900），shadcn/ui 的成对变量（background / foreground、primary / primary-foreground）已映射到 Geist 色阶。不在组件里写死色值。
        anchors:
          - { spec: ui, quote: MUST NOT 写孤立色值、魔法间距和临时阴影。 }
        enforcement: { kind: gate, check: style.no-raw-color }
        examples:
          - kind: do
            title_zh: 用 Geist 色阶类
            jsx: |-
              <div className="flex gap-3">
                <div className="rounded-md bg-ds-gray-1000 px-4 py-2 text-label-14 text-ds-background-100">gray-1000</div>
                <div className="rounded-md bg-ds-gray-100 px-4 py-2 text-label-14 text-ds-gray-1000">gray-100</div>
                <div className="rounded-md border border-ds-gray-400 px-4 py-2 text-label-14 text-ds-gray-900">gray-400 边框</div>
              </div>
          - kind: dont
            title_zh: 写死色值
            code: |-
              <div style={{ background: "#171717", color: "#ededed" }}>部署</div>
            lang: tsx

      - id: COLOR.NEUTRAL_LAYERS
        title_zh: 中性色分层
        statement_zh: 页面用背景 1（background-100），背景 2 只在需要轻微区分时少量使用。组件放在背景 1 上时，用灰 100 作悬停背景、灰 200 作按下背景；徽标这类小元素用灰 200 或 300 作底。默认用实色灰；只有需要透出底色时（阴影、遮罩）才用透明灰。
        enforcement: { kind: review }
        showcase:
          - kind: specimen
            title_zh: 档位与用途
            name_label_zh: 类名
            rows:
              - name: bg-ds-background-100
                usage_zh: 页面与组件的默认背景
                jsx: |-
                  <div className="h-10 w-28 rounded-md border border-ds-gray-400 bg-ds-background-100" />
              - name: bg-ds-gray-100
                usage_zh: 组件的悬停背景
                jsx: |-
                  <div className="h-10 w-28 rounded-md bg-ds-gray-100" />
              - name: bg-ds-gray-200
                usage_zh: 组件的按下背景；徽标底色
                jsx: |-
                  <div className="h-10 w-28 rounded-md bg-ds-gray-200" />
              - name: border-ds-gray-400
                usage_zh: 默认边框
                jsx: |-
                  <div className="h-10 w-28 rounded-md border border-ds-gray-400" />
              - name: text-ds-gray-900
                usage_zh: 次要文字与图标
                jsx: |-
                  <span className="text-label-14 text-ds-gray-900">3 分钟前部署</span>
              - name: text-ds-gray-1000
                usage_zh: 主要文字与图标
                jsx: |-
                  <span className="text-label-14 text-ds-gray-1000">pomaster-web</span>

      - id: COLOR.BRAND
        title_zh: 品牌色
        statement_zh: Geist 默认单色，没有彩色的品牌主色：主操作用最深的灰（gray-1000）配背景色文字；蓝色只用于焦点环和信息提示，不用来装点主按钮或大面积背景。
        params:
          primary: { value: gray-1000, source: SRC.GEIST.BUTTON, label_zh: 主操作底色 }
          focus: { value: blue-700, source: SRC.VERCEL.BRAND_CSS, label_zh: 焦点环 }
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 主操作是黑底按钮
            jsx: |-
              <div className="flex gap-2">
                <Button>部署项目</Button>
                <Button variant="secondary">查看日志</Button>
              </div>
          - kind: dont
            title_zh: 给主按钮上彩色
            code: |-
              <Button className="bg-ds-blue-700">部署项目</Button>
            lang: tsx

      - id: COLOR.STATUS
        title_zh: 状态色
        statement_zh: 彩色只表达状态，含义固定：绿表示健康或成功，红表示错误，琥珀表示警告，蓝表示信息，灰表示中性。状态总伴随文字，颜色去掉后文字仍能读懂。
        params:
          success: { value: green-900, source: SRC.VERCEL.BRAND_CSS, label_zh: 成功 }
          error: { value: red-700, source: SRC.VERCEL.BRAND_CSS, label_zh: 错误 }
          warning: { value: amber-900, source: SRC.VERCEL.BRAND_CSS, label_zh: 警告 }
          info: { value: blue-700, source: SRC.VERCEL.BRAND_CSS, label_zh: 信息 }
        anchors:
          - { spec: ui, quote: 颜色不得作为唯一信息来源 }
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 颜色配文字
            jsx: |-
              <div className="flex flex-wrap gap-4 text-label-14">
                <span className="flex items-center gap-2 text-ds-green-900"><CircleCheckIcon />已就绪</span>
                <span className="flex items-center gap-2 text-ds-red-700"><CircleXIcon />构建失败</span>
                <span className="flex items-center gap-2 text-ds-amber-900"><TriangleAlertIcon />配额将满</span>
                <span className="flex items-center gap-2 text-ds-blue-700"><InfoIcon />新版本可用</span>
              </div>

      - id: COLOR.BORDERS
        title_zh: 边框
        statement_zh: 边框默认用实色灰 400，只有边缘需要和表面融在一起时才用同档的透明灰。每条边只画一次：容器里的分割线画在边框里面，不让两条半透明边框交叠出更深的交点。
        params:
          default: { value: gray-400, source: SRC.GEIST.COLORS, label_zh: 默认边框 }
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 分割线在边框里面
            jsx: |-
              <div className="w-64 rounded-md border border-ds-gray-400 bg-ds-background-100">
                <div className="border-b border-ds-gray-400 px-4 py-3 text-label-14">构建中…</div>
                <div className="px-4 py-3 text-copy-13 text-ds-gray-900">部署很快就会就绪。</div>
              </div>
          - kind: dont
            title_zh: 两条透明边框叠在一起
            code: |-
              <div className="border border-black/10"><div className="border border-black/10">…</div></div>
            lang: tsx

      - id: COLOR.NO_DECORATION
        title_zh: 不用装饰性效果
        statement_zh: 不用装饰性渐变、渐变文字、发光、色块、条纹、纹理、网格背景、毛玻璃，也不用装饰性或伪立体阴影。渐变只在表示连续数据刻度时使用，并且要标注。
        enforcement: { kind: review }
        examples:
          - kind: dont
            title_zh: 渐变文字加发光
            code: |-
              <h1 className="bg-linear-to-r from-purple-500 to-pink-500 bg-clip-text text-transparent">Ship faster</h1>
            lang: tsx

  # ───────────────────────────── 基础 · 字体 ─────────────────────────────
  - key: typography
    title_zh: 字体
    group: foundations
    prefix: TYPE
    summary_zh: Geist Sans 与 Geist Mono；字号只用 Geist 的四组排版类（标题、按钮、标签、正文）；单行用标签，多行用正文。
    rules:
      - id: TYPE.FAMILY
        title_zh: 字体族
        statement_zh: 正文、标题、标签、控件、表格、图表都用 Geist Sans；Geist Mono 只用于代码、命令、路径、原始 token、时间戳和短标识。字体从 Google Fonts 加载，字重 400 到 600。字体族只经 font-sans / font-mono（或带 -mono 的排版类）取，不写内联 font-family：主题里的字体栈带系统字体兜底，中文字形由系统无衬线字体补上。
        params:
          sans: { value: Geist, source: SRC.VERCEL.DESIGN_MD, label_zh: 无衬线 }
          mono: { value: Geist Mono, source: SRC.VERCEL.DESIGN_MD, label_zh: 等宽 }
          weights: { value: [400, 600], source: SRC.VERCEL.DESIGN_MD, label_zh: 字重范围 }
        enforcement: { kind: gate, check: style.font-family-token }
        examples:
          - kind: do
            title_zh: 正文用 Sans，标识用 Mono
            jsx: |-
              <p className="font-sans text-copy-14">
                部署 <code className="text-copy-13-mono">dpl_7Hq2x</code> 已于 <code className="text-copy-13-mono">2026-11-02 14:08</code> 上线。
              </p>
          - kind: dont
            title_zh: 内联写字体名
            code: |-
              <p style={{ fontFamily: "Geist" }}>部署已上线</p>
            lang: tsx
            note_zh: 只写一个字体名没有兜底，中文会落到浏览器默认字体（常是衬线体）。

      - id: TYPE.SCALE
        title_zh: 字阶
        statement_zh: 字号只用 Geist 的四组排版类，类名里的数字就是字号。标题类开启页面或区块；按钮类只在按钮组件里用；标签类用于单行文字；正文类用于多行文字。不自造字号。
        params:
          heading: { value: [72, 64, 56, 48, 40, 32, 24, 20, 16, 14], unit: px, source: SRC.GEIST.TYPOGRAPHY, label_zh: 标题 }
          button: { value: [16, 14, 12], unit: px, source: SRC.GEIST.TYPOGRAPHY, label_zh: 按钮 }
          label: { value: [20, 18, 16, 14, 13, 12], unit: px, source: SRC.GEIST.TYPOGRAPHY, label_zh: 标签 }
          copy: { value: [24, 20, 18, 16, 14, 13], unit: px, source: SRC.GEIST.TYPOGRAPHY, label_zh: 正文 }
        enforcement: { kind: gate, check: style.font-size-scale }
        showcase:
          - kind: specimen
            title_zh: 标题
            description_zh: 用来开启页面或区块。
            name_label_zh: 类名
            rows:
              - { name: text-heading-72, sample_zh: Heading 72 }
              - { name: text-heading-64, sample_zh: Heading 64 }
              - { name: text-heading-56, sample_zh: Heading 56 }
              - { name: text-heading-48, sample_zh: Heading 48 }
              - { name: text-heading-40, sample_zh: Heading 40 }
              - { name: text-heading-32, sample_zh: Heading 32 }
              - { name: text-heading-24, sample_zh: Heading 24 }
              - { name: text-heading-20, sample_zh: Heading 20 }
              - { name: text-heading-16, sample_zh: Heading 16 }
              - { name: text-heading-14, sample_zh: Heading 14 }
          - kind: specimen
            title_zh: 按钮
            description_zh: 只在渲染按钮的组件里用。
            name_label_zh: 类名
            rows:
              - { name: text-button-16, sample_zh: Button 16, usage_zh: 最大的按钮 }
              - { name: text-button-14, sample_zh: Button 14, usage_zh: 默认按钮 }
              - { name: text-button-12, sample_zh: Button 12, usage_zh: 只用于放在输入框里的小按钮 }
          - kind: specimen
            title_zh: 标签
            description_zh: 为单行文字设计，行高留得足，便于和图标对齐。
            name_label_zh: 类名
            rows:
              - { name: text-label-20, sample_zh: Label 20 }
              - { name: text-label-18, sample_zh: Label 18 }
              - { name: text-label-16, sample_zh: Label 16, usage_zh: 用在标题里，与常规文字区分 }
              - { name: text-label-14, sample_zh: Label 14, usage_zh: 最常用的文字样式，菜单里大量使用 }
              - { name: text-label-14-mono, sample_zh: Label 14 Mono, usage_zh: 最大的等宽字号，和 14 以上的文字搭配 }
              - { name: text-label-13, sample_zh: Label 13, usage_zh: 其他标签旁的次要一行；表达数字时用等宽数字 }
              - { name: text-label-13-mono, sample_zh: Label 13 Mono, usage_zh: 和 Label 14 搭配的等宽字号 }
              - { name: text-label-12, sample_zh: Label 12, usage_zh: 忙碌视图里的第三层文字，如评论、展开更多 }
              - { name: text-label-12-mono, sample_zh: Label 12 Mono }
          - kind: specimen
            title_zh: 正文
            description_zh: 为多行文字设计，行高比标签大。
            name_label_zh: 类名
            rows:
              - { name: text-copy-24, sample_zh: Copy 24, usage_zh: 营销页的首屏 }
              - { name: text-copy-20, sample_zh: Copy 20, usage_zh: 营销页的首屏 }
              - { name: text-copy-18, sample_zh: Copy 18, usage_zh: 主要用于营销页、大段引语 }
              - { name: text-copy-16, sample_zh: Copy 16, usage_zh: 对话框这类留白充足的视图 }
              - { name: text-copy-14, sample_zh: Copy 14, usage_zh: 最常用的正文样式 }
              - { name: text-copy-13, sample_zh: Copy 13, usage_zh: 次要文字，空间紧张的视图 }
              - { name: text-copy-13-mono, sample_zh: Copy 13 Mono, usage_zh: 正文里提到的代码 }
        examples:
          - kind: dont
            title_zh: 自造的 15px 与 font-weight 650
            code: |-
              <p style={{ fontSize: 15, fontWeight: 650 }}>项目设置</p>
            lang: tsx

      - id: TYPE.WEIGHT
        title_zh: 字重
        statement_zh: 字重跟着排版类走，不单独写 font-weight。需要在一段文字里强调时，在排版类里嵌套 strong 元素（Geist 的 Strong / Subtle 修饰）。
        params:
          class_metrics: { decision: 各排版类的行高、字重、字距取多少？（Geist 的完整数值在设计稿里，当前排版类只实现了字号）, label_zh: 行高 / 字重 / 字距 }
        enforcement: { kind: gate, check: style.font-weight-allowed }
        examples:
          - kind: do
            title_zh: 用 strong 强调
            jsx: |-
              <p className="text-copy-14">推送到 <strong>main</strong> 分支时自动部署到生产环境。</p>

      - id: TYPE.LINE_ROLES
        title_zh: 单行与多行
        statement_zh: 单行文字（菜单项、表单标签、与图标并排的文字）用标签类，行高留得足；多行文字用正文类。标签旁的次要信息用 text-label-13；忙碌视图里的第三层信息用 text-label-12；正文里提到代码用 text-copy-13-mono。
        params:
          secondary: { value: text-label-13, source: SRC.GEIST.TYPOGRAPHY, label_zh: 次要单行 }
          tertiary: { value: text-label-12, source: SRC.GEIST.TYPOGRAPHY, label_zh: 第三层单行 }
          inline_code: { value: text-copy-13-mono, source: SRC.GEIST.TYPOGRAPHY, label_zh: 正文中的代码 }
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 标签加次要信息
            jsx: |-
              <div className="flex items-baseline gap-2">
                <span className="text-label-14">生产环境</span>
                <span className="text-label-13 text-ds-gray-900 tabular-nums">3 分钟前</span>
              </div>

      - id: TYPE.COLOR
        title_zh: 文字颜色
        statement_zh: 文字只用两档：主要文字 gray-1000，次要文字 gray-900。更弱的灰只用于禁用态，不用来写说明文字。
        params:
          primary: { value: gray-1000, source: SRC.GEIST.COLORS, label_zh: 主要文字 }
          secondary: { value: gray-900, source: SRC.GEIST.COLORS, label_zh: 次要文字 }
        anchors:
          - { spec: ui, quote: 颜色不得作为唯一信息来源；文本对比度至少 4.5:1 }
        enforcement: { kind: gate, check: style.no-raw-color }
        examples:
          - kind: do
            title_zh: 两档文字色
            jsx: |-
              <div className="flex flex-col gap-1">
                <span className="text-label-14 text-ds-gray-1000">pomaster-web</span>
                <span className="text-label-13 text-ds-gray-900">由 river 在 3 分钟前部署</span>
              </div>

      - id: TYPE.TABULAR_NUMS
        title_zh: 等宽数字
        statement_zh: 需要上下对比的数字（表格的数字列、计数、用量、时间）用等宽数字（tabular-nums）或 Geist Mono，让各行的数位对齐。
        params:
          utility: { value: tabular-nums, source: SRC.GEIST.TABLE, label_zh: 工具类 }
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 数字列对齐
            jsx: |-
              <div className="flex w-48 flex-col text-label-14 tabular-nums">
                <div className="flex justify-between"><span>请求</span><span>1,204,511</span></div>
                <div className="flex justify-between"><span>错误</span><span>311</span></div>
                <div className="flex justify-between"><span>P95</span><span>48 ms</span></div>
              </div>

      - id: TYPE.READING
        title_zh: 长文行宽
        statement_zh: 长段落控制在每行 60 到 68 个字符；表格、表单这类结构化内容不受此限。
        params:
          line_length: { value: [60, 68], unit: chars, source: SRC.VERCEL.DESIGN_MD, label_zh: 长文行宽 }
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 正文限制行宽
            jsx: |-
              <p className="max-w-[68ch] text-copy-14 text-ds-gray-900">预览部署会为每个拉取请求生成一个独立地址，评审人打开就能看到这次改动的真实效果，合并后预览地址保留，方便回溯。</p>

      - id: TYPE.RICH_TEXT
        title_zh: 富文本
        statement_zh: 长文用正文类排版；正文里提到代码、路径、环境变量用 text-copy-13-mono；快捷键用键盘按键样式；多行源码用代码块，可复制的命令用命令片段，不用一段普通文字代替。
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 行内代码与快捷键
            jsx: |-
              <p className="text-copy-14">在项目根目录设置 <code className="text-copy-13-mono">DATABASE_URL</code>，然后按 <kbd className="rounded-md border border-ds-gray-400 px-1 text-label-12-mono">⌘ K</kbd> 打开命令面板。</p>

      - id: TYPE.OVERFLOW
        title_zh: 文字溢出
        statement_zh: 首尾都有信息的字符串（路径、地址、部署 ID、提交哈希）从中间省略，保留开头和结尾；句子、标题从末尾省略。被省略的值要能看到全文（文字提示）或一键复制。
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 句子从末尾省略，悬停看全文
            jsx: |-
              <div className="w-64 truncate text-label-14" title="修复了在 Safari 中预览部署的登录跳转问题">修复了在 Safari 中预览部署的登录跳转问题</div>

  # ───────────────────────────── 基础 · 标题层级 ─────────────────────────────
  - key: headings
    title_zh: 标题层级
    group: foundations
    prefix: HEADING
    summary_zh: 应用界面最多三级标题；每个视图一个 h1；标题逐级下降；类名决定样子，元素决定层级。
    rules:
      - id: HEADING.APP_LEVELS
        title_zh: 应用界面的标题级数
        statement_zh: 应用界面最多三级标题：页面标题 text-heading-24 或 32，区块标题 text-heading-20，子区块 text-heading-16；更大的标题类留给营销页和文档首页。
        params:
          page: { value: [24, 32], unit: px, source: SRC.POMASTER.PRESET, label_zh: 页面标题 }
          section: { value: 20, unit: px, source: SRC.POMASTER.PRESET, label_zh: 区块标题 }
          subsection: { value: 16, unit: px, source: SRC.POMASTER.PRESET, label_zh: 子区块 }
          max_levels: { value: 3, unit: count, source: SRC.POMASTER.PRESET, label_zh: 最多级数 }
        enforcement: { kind: gate, check: markup.heading-level-max }
        examples:
          - kind: do
            title_zh: 三级标题
            jsx: |-
              <div className="flex flex-col gap-3">
                <h2 className="text-heading-24">项目设置</h2>
                <h3 className="text-heading-20">构建与部署</h3>
                <h4 className="text-heading-16">构建命令</h4>
              </div>

      - id: HEADING.SINGLE_H1
        title_zh: 每个视图一个 h1
        statement_zh: 每个页面视图只有一个 h1，就是页面标题；卡片、对话框里的标题从 h2 往下排。
        enforcement: { kind: gate, check: markup.single-h1 }

      - id: HEADING.ORDER
        title_zh: 标题不跳级
        statement_zh: 标题逐级下降，不从 h2 直接跳到 h4；视觉层级和标题层级一致。
        anchors:
          - { spec: ui, quote: 标题层级 h1–h6 与视觉层级一致，不跳过层级 }
        enforcement: { kind: gate, check: markup.heading-order }

      - id: HEADING.CONTENT_LEVELS
        title_zh: 内容型页面的标题
        statement_zh: 文档、营销这类内容型页面可以用更大的标题类：首屏 text-heading-48 到 72，章节 text-heading-32，小节 text-heading-24。同一页面里每一级只用一种类。
        params:
          hero: { value: [48, 72], unit: px, source: SRC.POMASTER.PRESET, label_zh: 首屏 }
          chapter: { value: 32, unit: px, source: SRC.POMASTER.PRESET, label_zh: 章节 }
          section: { value: 24, unit: px, source: SRC.POMASTER.PRESET, label_zh: 小节 }
        enforcement: { kind: review }

      - id: HEADING.REAL_ELEMENT
        title_zh: 用真正的标题元素
        statement_zh: 标题用 h1 到 h6 元素，排版类只决定样子；不用 div 加标题类假装标题，也不为了字号挑标题元素。
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 元素定层级，类定样子
            jsx: |-
              <h2 className="text-heading-20">环境变量</h2>
          - kind: dont
            title_zh: div 假装标题
            code: |-
              <div className="text-heading-20">环境变量</div>
            lang: tsx

  # ───────────────────────────── 基础 · 图标 ─────────────────────────────
  - key: icons
    title_zh: 图标
    group: foundations
    prefix: ICON
    summary_zh: 一套线框图标；尺寸与间距跟随文字；颜色跟随文字；同一动作同一图标；纯图标按钮有名字。
    rules:
      - id: ICON.LIBRARY
        title_zh: 图标库
        statement_zh: 图标统一用 lucide-react，不混用第二套。Vercel 文档里的官方图标包 @vercel/geistcn-assets 在公开 npm 上装不到，能装后再评估替换。图标只在一个约定俗成的图标能让操作更快被认出时才用。
        params:
          library: { value: lucide-react, source: SRC.POMASTER.PRESET, label_zh: 图标库 }
          official: { value: "@vercel/geistcn-assets（公开 npm 上装不到）", source: SRC.GEIST.HOME, label_zh: Geist 官方图标包 }
        enforcement: { kind: gate, check: icon.single-library }

      - id: ICON.STYLE
        title_zh: 图标风格
        statement_zh: 只用线框图标，描边保持默认的 2；不在同一界面混用实心和线框，也不单独改某个图标的描边粗细。
        params:
          stroke: { value: 2, unit: px, source: SRC.LUCIDE, label_zh: 描边 }
        enforcement: { kind: review }

      - id: ICON.SIZE
        title_zh: 图标尺寸
        statement_zh: 图标尺寸跟随相邻文字：16px 配 text-label-14 和 text-button-14（默认）；14px 配 text-label-13、徽标里的小图标；12px 只用于 tiny 按钮这类最紧凑的位置；空状态这类独立出现的图标用 32px。
        params:
          default: { value: 16, unit: px, source: SRC.GEIST.PIE_GAUGE, label_zh: 默认（配 14 号文字） }
          compact: { value: 14, unit: px, source: SRC.POMASTER.PRESET, label_zh: 紧凑（配 13 号文字） }
          tiny: { value: 12, unit: px, source: SRC.POMASTER.PRESET, label_zh: 最小 }
          standalone: { value: 32, unit: px, source: SRC.GEIST.EMPTY_STATE, label_zh: 独立图标 }
        enforcement: { kind: review }
        showcase:
          - kind: specimen
            title_zh: 尺寸
            name_label_zh: 尺寸
            rows:
              - name: 12px · size-3
                usage_zh: tiny 按钮这类最紧凑的位置
                jsx: |-
                  <span className="flex items-center gap-1 text-label-12"><PlusIcon className="size-3" />添加</span>
              - name: 14px · size-3.5
                usage_zh: 配 text-label-13，徽标里的图标
                jsx: |-
                  <span className="flex items-center gap-1.5 text-label-13"><GitBranchIcon className="size-3.5" />main</span>
              - name: 16px · size-4
                usage_zh: 默认，配 text-label-14 与按钮
                jsx: |-
                  <span className="flex items-center gap-2 text-label-14"><SearchIcon className="size-4" />搜索项目</span>
              - name: 32px · size-8
                usage_zh: 空状态这类独立出现的图标
                jsx: |-
                  <ChartColumnIcon className="size-8 text-ds-gray-900" />

      - id: ICON.SPACING
        title_zh: 图标与文字的间距
        statement_zh: 图标和 14 号文字之间留 8px（gap-2），和 13、12 号文字之间留 6px 或 4px；按钮里的间距由组件给出，不手动加空格。
        params:
          gap: { value: 8, unit: px, source: SRC.POMASTER.PRESET, label_zh: 配 14 号文字 }
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 用 gap 留间距
            jsx: |-
              <span className="flex items-center gap-2 text-label-14"><GitBranchIcon />feature/design-standard</span>
          - kind: dont
            title_zh: 用空格隔开
            code: |-
              <span><GitBranchIcon />&nbsp;&nbsp;feature/design-standard</span>
            lang: tsx

      - id: ICON.COLOR
        title_zh: 图标颜色
        statement_zh: 图标跟随相邻文字的颜色（currentColor）：主要图标 gray-1000，次要图标 gray-900。彩色图标只用于状态，并且旁边有文字。
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 次要图标跟随次要文字
            jsx: |-
              <span className="flex items-center gap-2 text-label-13 text-ds-gray-900"><ClockIcon className="size-3.5" />3 分钟前</span>

      - id: ICON.SEMANTICS
        title_zh: 同一动作同一图标
        statement_zh: 同一个动作全系统用同一个图标（删除、复制、刷新、外链各一个），同一个图标不表示两种意思。
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 复制一律用同一个图标
            jsx: |-
              <div className="flex gap-2">
                <Button variant="secondary" size="small" prefix={<CopyIcon />}>复制地址</Button>
                <Button variant="secondary" size="small" prefix={<CopyIcon />}>复制部署 ID</Button>
              </div>

      - id: ICON.BUTTON_LABEL
        title_zh: 纯图标按钮的名称
        statement_zh: 只有图标的按钮必须带 aria-label，名称写动作和对象（「复制部署地址」），不写图标名（「复制」）；悬停时用文字提示显示同样的文字。按钮已经有可见文字时不要再加 aria-label。
        anchors:
          - { spec: ui, quote: MUST NOT 图标按钮缺少 aria-label 或等效可访问名称。 }
        enforcement: { kind: gate, check: markup.icon-button-label }
        examples:
          - kind: do
            title_zh: 带 aria-label
            jsx: |-
              <Button variant="secondary" svgOnly aria-label="刷新部署列表"><RefreshCwIcon /></Button>

  # ───────────────────────────── 基础 · 材质 ─────────────────────────────
  - key: materials
    title_zh: 材质
    group: foundations
    prefix: MATERIAL
    summary_zh: 圆角三档（6、12、16）；页面内四种表面、页面上四种浮层；只有提示气泡带指向三角；阴影半透明，只表达层级。
    rules:
      - id: MATERIAL.RADIUS
        title_zh: 圆角
        statement_zh: 圆角只取三档：日常控件、小表面、提示气泡 6px；卡片、菜单、对话框 12px；全屏层 16px。
        params:
          small: { value: 6, unit: px, source: SRC.GEIST.MATERIALS, label_zh: 控件与小表面 }
          large: { value: 12, unit: px, source: SRC.GEIST.MATERIALS, label_zh: 卡片、菜单、对话框 }
          fullscreen: { value: 16, unit: px, source: SRC.GEIST.MATERIALS, label_zh: 全屏层 }
        enforcement: { kind: review }
        showcase:
          - kind: specimen
            title_zh: 圆角
            name_label_zh: 类名 · 半径
            rows:
              - name: rounded-md · 6px
                usage_zh: 按钮、输入框、提示气泡
                jsx: |-
                  <div className="h-14 w-28 border border-ds-gray-400 bg-ds-background-100" style={{ borderRadius: p.small }} />
              - name: rounded-xl · 12px
                usage_zh: 卡片、菜单、对话框
                jsx: |-
                  <div className="h-14 w-28 border border-ds-gray-400 bg-ds-background-100" style={{ borderRadius: p.large }} />
              - name: rounded-2xl · 16px
                usage_zh: 全屏层
                jsx: |-
                  <div className="h-14 w-28 border border-ds-gray-400 bg-ds-background-100" style={{ borderRadius: p.fullscreen }} />

      - id: MATERIAL.SURFACES
        title_zh: 页面内的表面
        statement_zh: 页面内的表面按抬升程度分四种：base（日常）与 small（略抬起）用 6px 圆角，medium 与 large（更高）用 12px。同一层级的表面圆角一致。
        params:
          base: { value: 6, unit: px, source: SRC.GEIST.MATERIALS, label_zh: material-base }
          small: { value: 6, unit: px, source: SRC.GEIST.MATERIALS, label_zh: material-small }
          medium: { value: 12, unit: px, source: SRC.GEIST.MATERIALS, label_zh: material-medium }
          large: { value: 12, unit: px, source: SRC.GEIST.MATERIALS, label_zh: material-large }
        enforcement: { kind: review }
        showcase:
          - kind: specimen
            title_zh: 页面内
            name_label_zh: 材质
            rows:
              - name: material-base
                usage_zh: 日常使用，圆角 6px
                jsx: |-
                  <div className="h-14 w-36 border border-ds-gray-400 bg-ds-background-100" style={{ borderRadius: p.base }} />
              - name: material-small
                usage_zh: 略抬起，圆角 6px
                jsx: |-
                  <div className="h-14 w-36 border border-ds-gray-400 bg-ds-background-100 shadow-xs" style={{ borderRadius: p.small }} />
              - name: material-medium
                usage_zh: 更高，圆角 12px
                jsx: |-
                  <div className="h-14 w-36 border border-ds-gray-400 bg-ds-background-100 shadow-sm" style={{ borderRadius: p.medium }} />
              - name: material-large
                usage_zh: 更高，圆角 12px
                jsx: |-
                  <div className="h-14 w-36 border border-ds-gray-400 bg-ds-background-100 shadow-md" style={{ borderRadius: p.large }} />

      - id: MATERIAL.FLOATING
        title_zh: 浮层
        statement_zh: 浮在页面之上的元素：提示气泡 6px（阴影最轻，也是唯一带指向三角的浮层）；菜单 12px；对话框 12px（比菜单抬得更高）；全屏层 16px（抬得最高）。
        params:
          tooltip: { value: 6, unit: px, source: SRC.GEIST.MATERIALS, label_zh: material-tooltip }
          menu: { value: 12, unit: px, source: SRC.GEIST.MATERIALS, label_zh: material-menu }
          modal: { value: 12, unit: px, source: SRC.GEIST.MATERIALS, label_zh: material-modal }
          fullscreen: { value: 16, unit: px, source: SRC.GEIST.MATERIALS, label_zh: material-fullscreen }
        enforcement: { kind: review }
        showcase:
          - kind: specimen
            title_zh: 页面之上
            name_label_zh: 材质
            rows:
              - name: material-tooltip
                usage_zh: 阴影最轻，圆角 6px，唯一带指向三角
                jsx: |-
                  <div className="h-14 w-36 border border-ds-gray-400 bg-ds-background-100 shadow-sm" style={{ borderRadius: p.tooltip }} />
              - name: material-menu
                usage_zh: 从页面抬起，圆角 12px
                jsx: |-
                  <div className="h-14 w-36 border border-ds-gray-400 bg-ds-background-100 shadow-md" style={{ borderRadius: p.menu }} />
              - name: material-modal
                usage_zh: 抬得更高，圆角 12px
                jsx: |-
                  <div className="h-14 w-36 border border-ds-gray-400 bg-ds-background-100 shadow-lg" style={{ borderRadius: p.modal }} />
              - name: material-fullscreen
                usage_zh: 抬得最高，圆角 16px
                jsx: |-
                  <div className="h-14 w-36 border border-ds-gray-400 bg-ds-background-100 shadow-xl" style={{ borderRadius: p.fullscreen }} />

      - id: MATERIAL.SHADOWS
        title_zh: 阴影
        statement_zh: 阴影只表达层级，并且保持半透明，和底色融在一起；不用不透明的灰色阴影（会留下一圈灰晕），也不用装饰性阴影。各层级的具体阴影值待项目决定，当前示例用 Tailwind 的阴影档近似。
        params:
          values: { decision: 各层级的阴影取什么值？（Geist 未公开）, label_zh: 阴影值 }
        enforcement: { kind: review }
        examples:
          - kind: dont
            title_zh: 不透明的灰色阴影
            code: |-
              <div style={{ boxShadow: "0 4px 12px #bbbbbb" }}>…</div>
            lang: tsx

  # ───────────────────────────── 基础 · 圆角管理 ─────────────────────────────
  - key: radius
    title_zh: 圆角管理
    group: foundations
    prefix: RADIUS
    summary_zh: 圆角只取规范的档位；每类组件用哪一档有对照表；同一组件的尺寸越大圆角越大但有上限；嵌套时内层 = 外层 − 内边距；贴边与相接的那侧没有圆角；整圆只给短小的元素；媒体随容器裁切。
    rules:
      - id: RADIUS.TOKENS
        title_zh: 只用规范的圆角档
        statement_zh: 圆角值只取 MATERIAL.RADIUS 的三档（6 / 12 / 16，对应 rounded-md / rounded-xl / rounded-2xl），外加整圆 rounded-full；不写 rounded-[10px] 这类任意值，不在组件外层再套一层不同的圆角。
        anchors:
          - { spec: ui, quote: MUST NOT 写孤立色值、魔法间距和临时阴影。 }
        enforcement: { kind: gate, check: style.radius-token }
        examples:
          - kind: do
            title_zh: 用档位类
            code: |-
              <div className="rounded-xl border border-ds-gray-400">…</div>
            lang: tsx
          - kind: dont
            title_zh: 任意值
            code: |-
              <div className="rounded-[10px]">…</div>
            lang: tsx

      - id: RADIUS.BY_COMPONENT
        title_zh: 组件与圆角对照
        statement_zh: 每类组件用哪一档圆角按对照表执行，新组件先归到表里的一类再取值；同一页面上同类组件的圆角一致。
        enforcement: { kind: review }
        showcase:
          - kind: specimen
            title_zh: 组件用哪一档圆角
            name_label_zh: 组件
            rows:
              - name: 按钮、输入框、选择器、提示气泡（rounded-md）
                usage_zh: 6px
                jsx: |-
                  <div className="flex items-center gap-2"><Button size="small">按钮</Button><Input placeholder="输入框" className="w-36" /></div>
              - name: 卡片、菜单、对话框（rounded-xl）
                usage_zh: 12px
                jsx: |-
                  <div className="w-56 rounded-xl border border-ds-gray-400 bg-ds-background-100 p-4 text-label-14">卡片</div>
              - name: 全屏层（rounded-2xl）
                usage_zh: 16px
                jsx: |-
                  <div className="h-16 w-56 rounded-2xl border border-ds-gray-400 bg-ds-background-200" />
              - name: 头像、徽标、开关、进度条（rounded-full）
                usage_zh: 整圆
                jsx: |-
                  <div className="flex items-center gap-3"><span className="grid size-8 place-items-center rounded-full bg-ds-gray-200 text-label-13">王</span><Badge>Ready</Badge><Switch defaultChecked aria-label="开关" /></div>

      - id: RADIUS.SIZE_SCALE
        title_zh: 尺寸越大圆角越大，但有上限
        statement_zh: 控件统一用 6px，不随尺寸变化；容器按层级取 12px 或 16px，不超过 16px；不按像素尺寸按比例算圆角。
        enforcement: { kind: review }

      - id: RADIUS.NESTED
        title_zh: 嵌套时内层 = 外层 − 内边距
        statement_zh: "圆角容器里再放圆角元素时，内层圆角 = 外层圆角 − 两者之间的内边距（不小于 0），这样角落同心；内层直接贴边（没有内边距）时由外层裁切（overflow: hidden），内层不再单写圆角。"
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 内层减去内边距
            jsx: |-
              <div className="w-56 rounded-xl border border-ds-gray-400 p-1.5"><div className="rounded-md bg-ds-gray-100 p-3 text-label-13">外 12 − 内边距 6 = 内 6</div></div>
          - kind: dont
            title_zh: 内外同样的圆角
            jsx: |-
              <div className="w-56 rounded-xl border border-ds-gray-400 p-1.5"><div className="rounded-xl bg-ds-gray-100 p-3 text-label-13">内外都是 12，角落不同心</div></div>

      - id: RADIUS.FLUSH
        title_zh: 贴边与相接的那侧没有圆角
        statement_zh: 元素贴着容器边缘时，贴边那一侧不要圆角（卡片顶部的封面图只保留上面两个角，表格贴满卡片时由卡片裁切）；按钮组、输入框与前后缀相接处圆角为 0，只保留整组外侧的圆角（first:rounded-l-md last:rounded-r-md，中间 rounded-none）。
        enforcement: { kind: review }

      - id: RADIUS.PILL
        title_zh: 整圆只给短小的元素
        statement_zh: 整圆（胶囊、圆形）只用于徽标、计数、标签型状态、开关、进度条和头像；按钮、输入框不做胶囊，除非整个产品在主题里统一改；圆形图标按钮宽高相等。
        enforcement: { kind: review }

      - id: RADIUS.MEDIA
        title_zh: 媒体随容器裁切
        statement_zh: 图片、视频、地图、图表在圆角容器里由容器裁切，不各自再加圆角；单独出现的缩略图用控件那一档；头像用整圆；用户上传的图片不加阴影、描边之外的装饰。
        enforcement: { kind: review }

  # ───────────────────────────── 基础 · 投影 ─────────────────────────────
  - key: elevation
    title_zh: 投影
    group: foundations
    prefix: ELEV
    summary_zh: 投影只表达离页面多远：四个层级各一个阴影 token；页面内的区块用边框不用阴影；不手写阴影、不做发光；悬停最多升一级；阴影层级与叠放层级同序；深色主题改用更亮的表面；吸顶与固定列的阴影只在滚动后出现。
    rules:
      - id: ELEV.LEVELS
        title_zh: 四个层级各一个阴影
        statement_zh: 层级固定为四层：0 层贴在页面上；1 层是悬停抬起与吸顶后的元素；2 层是下拉、气泡、悬浮按钮；3 层是对话框、抽屉、通知。每层只有一个阴影 token，组件按所在层级取用（方向规则见 MATERIAL.SHADOWS）。
        params:
          values: { decision: 四个层级的阴影各取什么值？（Geist 未公开，与 MATERIAL.SHADOWS 同一决策）, label_zh: 层级阴影 }
        enforcement: { kind: review }
        showcase:
          - kind: specimen
            title_zh: 四个层级
            name_label_zh: 层级
            rows:
              - name: 第 0 层：贴在页面上（区块、表格、未悬停的卡片）
                usage_zh: 无阴影，用边框或底色区分
                jsx: |-
                  <div className="h-12 w-56 rounded-xl border border-ds-gray-400 bg-ds-background-100" />
              - name: 第 1 层：可点卡片悬停、吸顶表头滚动后
                usage_zh: shadow-sm（近似，值待定）
                jsx: |-
                  <div className="h-12 w-56 rounded-xl border border-ds-gray-400 bg-ds-background-100 shadow-sm" />
              - name: 第 2 层：菜单、提示气泡、悬浮按钮
                usage_zh: shadow-md（近似，值待定）
                jsx: |-
                  <div className="h-12 w-56 rounded-xl border border-ds-gray-400 bg-ds-background-100 shadow-md" />
              - name: 第 3 层：对话框、抽屉、通知
                usage_zh: shadow-lg（近似，值待定）
                jsx: |-
                  <div className="h-12 w-56 rounded-xl border border-ds-gray-400 bg-ds-background-100 shadow-lg" />

      - id: ELEV.FLAT_FIRST
        title_zh: 页面内的区块用边框不用阴影
        statement_zh: 页面里的区块、表格、表单分组用边框或底色区分，不用阴影；阴影只给浮在页面上、或者正在被拖动的东西；同一个元素不同时用粗边框和大阴影。
        enforcement: { kind: review }

      - id: ELEV.ONE_TOKEN
        title_zh: 不手写阴影、不做发光
        statement_zh: 阴影只取规范定下的层级类，不写 shadow-[…] 任意值；不做彩色、发光、内阴影装饰；阴影保持半透明，和底色融在一起。
        anchors:
          - { spec: ui, quote: MUST NOT 写孤立色值、魔法间距和临时阴影。 }
        enforcement: { kind: gate, check: style.shadow-token }
        examples:
          - kind: dont
            title_zh: 彩色发光阴影
            code: |-
              .promo { box-shadow: 0 0 24px rgba(99, 102, 241, 0.6); }
            lang: css

      - id: ELEV.HOVER
        title_zh: 悬停最多升一级
        statement_zh: 可点的卡片悬停时从 0 层升到 1 层（见 HOVER.SUBTLE），不跳到 2、3 层；浮层本身悬停不再变化；拖动中的元素升到 2 层，放下后回到原层。
        enforcement: { kind: review }

      - id: ELEV.Z_PAIR
        title_zh: 阴影层级与叠放层级同序
        statement_zh: 阴影层级和叠放层级（z-index，见 LAYOUT.Z_INDEX）同序：叠放在下面的元素不能有更重的阴影；同一层的两个浮层互相覆盖时，后出现的在上面。
        enforcement: { kind: review }

      - id: ELEV.DARK
        title_zh: 深色主题改用更亮的表面
        statement_zh: 深色背景上阴影几乎看不见，深色主题里层级改用更亮一档的表面色加细边框表达；阴影 token 随主题切换，组件不判断当前主题。
        anchors:
          - { spec: ui, quote: 表格、图表、弹层、焦点和状态随主题同步。 }
        enforcement: { kind: review }

      - id: ELEV.STICKY
        title_zh: 吸顶与固定列的阴影只在滚动后出现
        statement_zh: 吸顶的表头、工具栏和固定列，只有在内容滚到它下面时才显示分隔阴影或边框，静止时不显示（用滚动位置或 IntersectionObserver 切换一个类）。
        enforcement: { kind: review }

  # ───────────────────────────── 基础 · 布局 ─────────────────────────────
  - key: layout
    title_zh: 布局
    group: foundations
    prefix: LAYOUT
    summary_zh: 管理侧是顶栏加页内标签页；用户侧是移动端单列；先换行再缩小；外层管尺寸和滚动；层级只取预设档位。
    rules:
      - id: LAYOUT.ADMIN_SHELL
        title_zh: 管理侧页面骨架
        statement_zh: 管理侧页面是「顶栏（团队与项目切换）+ 页内标签页导航 + 内容区」；平级视图用标签页切换，不另开侧边菜单。内容区居中，最大宽度待项目决定。
        params:
          max_width: { value: 1400, unit: px, source: SRC.POMASTER.DEFAULTS, label_zh: 内容区最大宽度, note_zh: 以宽表格为主的管理端取宽档；纯阅读的页面可以更窄 }
        enforcement: { kind: review }

      - id: LAYOUT.PUBLIC_SHELL
        title_zh: 用户侧页面骨架
        statement_zh: 用户侧以移动端单列为基准：一列内容、底部主操作；小屏上的筛选、单个表单这类短任务用底部抽屉，不用对话框。
        enforcement: { kind: review }

      - id: LAYOUT.ADAPTIVE
        title_zh: 适配基准与验收宽度
        statement_zh: 断点用 Tailwind 的默认档（sm 640、md 768、lg 1024、xl 1280）；验收至少覆盖 375、768、1280 三个宽度。
        params:
          breakpoints: { value: [640, 768, 1024, 1280], unit: px, source: SRC.TAILWIND.BREAKPOINTS, label_zh: 断点 }
          acceptance: { value: [375, 768, 1280], unit: px, source: SRC.POMASTER.PRESET, label_zh: 验收宽度 }
        enforcement: { kind: review }

      - id: LAYOUT.CONTENT_REGION
        title_zh: 内容区边距与宽度
        statement_zh: 内容区左右边距随宽度取间距阶梯（手机 4 档、平板及以上 6 档），区块之间用 8 到 12 档；不同页面同一位置的边距一致。
        params:
          mobile_padding: { value: 4, unit: count, source: SRC.POMASTER.PRESET, label_zh: 手机边距（档） }
          padding: { value: 6, unit: count, source: SRC.POMASTER.PRESET, label_zh: 平板及以上边距（档） }
        enforcement: { kind: review }

      - id: LAYOUT.REFLOW
        title_zh: 先换行再缩小
        statement_zh: 空间不够时先重新排布（换行、换列），不先缩小字号；源码顺序就是阅读顺序。
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 按钮组允许换行
            jsx: |-
              <div className="flex w-72 flex-wrap gap-2">
                <Button variant="secondary" size="small">重新部署</Button>
                <Button variant="secondary" size="small">查看日志</Button>
                <Button variant="secondary" size="small">回滚</Button>
                <Button variant="secondary" size="small">分配域名</Button>
              </div>

      - id: LAYOUT.OVERFLOW
        title_zh: 尺寸与滚动的归属
        statement_zh: 网格和弹性布局的子项设 min-width 0，避免被长内容撑破；需要滚动时由明确的外层容器负责，不用 overflow 隐藏把内容藏起来。
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 子项 min-w-0，长文本截断
            jsx: |-
              <div className="flex w-72 items-center gap-2 rounded-md border border-ds-gray-400 p-3">
                <div className="min-w-0 flex-1 truncate text-label-14">pomaster-web-git-feature-design-standard-team.vercel.app</div>
                <Badge variant="secondary">Preview</Badge>
              </div>

      - id: LAYOUT.Z_INDEX
        title_zh: 层级
        statement_zh: 层级只取预设档位，从低到高：内容、吸顶元素、下拉与提示、抽屉、对话框、全局提示；不写任意的 z-index 数字。
        params:
          layers: { value: { base: 0, sticky: 10, header: 20, dropdown: 30, overlay: 40, modal: 50 }, unit: none, source: SRC.TAILWIND.Z_INDEX, label_zh: 层级档位, note_zh: 档位取 Tailwind 的 z-0 到 z-50，按层叠顺序给每档定名；页面只用这六个类 }
        enforcement: { kind: gate, check: style.no-raw-z-index }

  # ───────────────────────────── 基础 · 栅格 ─────────────────────────────
  - key: grid
    title_zh: 栅格
    group: foundations
    prefix: GRID
    summary_zh: 桌面 12 列、平板 6 列、手机 4 列；长文占 6 到 7 列；带参考线的二维布局才画参考线。
    rules:
      - id: GRID.COLUMNS
        title_zh: 栅格列数
        statement_zh: 外层栅格桌面 12 列、平板 6 列、手机 4 列；长文内容占 6 到 7 列，表格、图表和主要对比可以占满 12 列。
        params:
          desktop: { value: 12, unit: count, source: SRC.VERCEL.DESIGN_MD, label_zh: 桌面 }
          tablet: { value: 6, unit: count, source: SRC.VERCEL.DESIGN_MD, label_zh: 平板 }
          mobile: { value: 4, unit: count, source: SRC.VERCEL.DESIGN_MD, label_zh: 手机 }
          prose_span: { value: [6, 7], unit: count, source: SRC.VERCEL.DESIGN_MD, label_zh: 长文占列 }
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 12 列里长文占 7 列
            jsx: |-
              <div className="grid gap-4" style={{ gridTemplateColumns: `repeat(${p.desktop}, minmax(0, 1fr))` }}>
                <div className="rounded-md border border-ds-gray-400 p-3 text-copy-13" style={{ gridColumn: `span ${p.prose_span[1]}` }}>长文 · {p.prose_span[1]} 列</div>
                <div className="rounded-md bg-ds-gray-100 p-3 text-copy-13" style={{ gridColumn: `span ${p.desktop - p.prose_span[1]}` }}>侧栏 · {p.desktop - p.prose_span[1]} 列</div>
              </div>

      - id: GRID.GUTTER
        title_zh: 列间距
        statement_zh: 列间距取间距阶梯，同一个栅格里固定一档，不随窗口缩放。
        params:
          gutter: { value: [16, 24], unit: px, source: SRC.POMASTER.DEFAULTS, label_zh: 列间距, note_zh: 与 Ant Design 一侧一致：紧凑区 16、常规区 24（gap-4 / gap-6） }
        enforcement: { kind: gate, check: grid.gutter-allowed }

      - id: GRID.ROW_SUM
        title_zh: 一行的列数之和
        statement_zh: 一行里各格占的列数加起来不超过栅格总列数；超过就换行，不靠缩小格子硬塞。
        enforcement: { kind: gate, check: grid.row-sum }

      - id: GRID.BREAKPOINTS
        title_zh: 断点
        statement_zh: 响应式布局在 sm、md、lg 三个断点都写明列数和行数，让格子在手机、平板、桌面之间按预期重排；只用 Tailwind 的断点档，不自造断点。
        params:
          breakpoints: { value: [sm, md, lg], source: SRC.GEIST.GRID, label_zh: 必写的断点 }
        enforcement: { kind: gate, check: style.breakpoint-allowed }

      - id: GRID.GUIDES
        title_zh: 参考线
        statement_zh: 参考线和格子边框本身是设计的一部分时（营销页、文档首页），才画带参考线的网格；普通的响应式内容用 Tailwind 的 grid 工具类。网格最多嵌套一层；参考线是装饰，标 aria-hidden；可点的格子有自己的焦点环；参考线对比度不低于 3:1。
        params:
          guide_contrast: { value: 3, unit: ratio, source: SRC.GEIST.GRID, label_zh: 参考线最低对比度 }
          max_nesting: { value: 1, unit: count, source: SRC.GEIST.GRID, label_zh: 最多嵌套层数 }
        enforcement: { kind: review }

  # ───────────────────────────── 基础 · 间距 ─────────────────────────────
  - key: spacing
    title_zh: 间距
    group: foundations
    prefix: SPACING
    summary_zh: 间距只取间距阶梯（0.25rem 的整数倍）；组内、组间、区块、章节各用一段阶梯。
    rules:
      - id: SPACING.SCALE
        title_zh: 间距阶梯
        statement_zh: 间距只用间距阶梯（Tailwind 的 --spacing 基数 0.25rem 的整数倍），不写任意值。
        params:
          base: { value: 0.25rem, source: SRC.TAILWIND.SPACING, label_zh: 间距基数 --spacing }
        anchors:
          - { spec: ui, quote: MUST NOT 写孤立色值、魔法间距和临时阴影。 }
        enforcement: { kind: gate, check: style.spacing-scale }
        showcase:
          - kind: specimen
            title_zh: 常用档位
            name_label_zh: 类名 · 像素
            rows:
              - name: gap-1 · 4px
                usage_zh: 图标与 12 号文字
                jsx: |-
                  <div className="flex gap-1"><div className="size-6 rounded-md bg-ds-gray-200" /><div className="size-6 rounded-md bg-ds-gray-200" /></div>
              - name: gap-2 · 8px
                usage_zh: 组内元素、图标与 14 号文字
                jsx: |-
                  <div className="flex gap-2"><div className="size-6 rounded-md bg-ds-gray-200" /><div className="size-6 rounded-md bg-ds-gray-200" /></div>
              - name: gap-4 · 16px
                usage_zh: 组内较松的排布
                jsx: |-
                  <div className="flex gap-4"><div className="size-6 rounded-md bg-ds-gray-200" /><div className="size-6 rounded-md bg-ds-gray-200" /></div>
              - name: gap-6 · 24px
                usage_zh: 组与组之间
                jsx: |-
                  <div className="flex gap-6"><div className="size-6 rounded-md bg-ds-gray-200" /><div className="size-6 rounded-md bg-ds-gray-200" /></div>
              - name: gap-8 · 32px
                usage_zh: 组与组之间、区块转折
                jsx: |-
                  <div className="flex gap-8"><div className="size-6 rounded-md bg-ds-gray-200" /><div className="size-6 rounded-md bg-ds-gray-200" /></div>
              - name: gap-12 · 48px
                usage_zh: 大区块转折
                jsx: |-
                  <div className="flex gap-12"><div className="size-6 rounded-md bg-ds-gray-200" /><div className="size-6 rounded-md bg-ds-gray-200" /></div>
        examples:
          - kind: dont
            title_zh: 任意值
            code: |-
              <div className="mt-[13px] gap-[7px]">…</div>
            lang: tsx

      - id: SPACING.TIERS
        title_zh: 间距分档
        statement_zh: 按元素之间的关系选档：组内元素用第 2 到 4 档，组与组之间用第 6 到 8 档，大区块转折用第 8 到 12 档；第 16 档只用于真正的章节分隔，不作为页面默认间距。
        params:
          within_group: { value: [2, 4], unit: count, source: SRC.VERCEL.DESIGN_MD, label_zh: 组内档位 }
          between_groups: { value: [6, 8], unit: count, source: SRC.VERCEL.DESIGN_MD, label_zh: 组间档位 }
          sections: { value: [8, 12], unit: count, source: SRC.VERCEL.DESIGN_MD, label_zh: 区块档位 }
          chapter: { value: 16, unit: count, source: SRC.VERCEL.DESIGN_MD, label_zh: 章节档位 }
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 组内 gap-2，组间 gap-6
            jsx: |-
              <div className="flex flex-col gap-6">
                <div className="flex flex-col gap-2"><Label>项目名称</Label><Input defaultValue="pomaster-web" /></div>
                <div className="flex flex-col gap-2"><Label>根目录</Label><Input defaultValue="apps/web" /></div>
              </div>

  # ───────────────────────────── 基础 · 动效 ─────────────────────────────
  - key: motion
    title_zh: 动效
    group: foundations
    prefix: MOTION
    summary_zh: 默认静止；动效只用来解释状态变化、保持连续、确认操作；时长取过渡默认值；尊重减少动效设置。
    rules:
      - id: MOTION.PURPOSE
        title_zh: 动效要有理由
        statement_zh: 界面默认静止。动效只用于三件事：解释状态变化、保持视觉连续、确认一个操作。不用跑马灯、打字光标、脉冲指示、弹跳、视差和滚动出现效果。
        enforcement: { kind: review }

      - id: MOTION.DURATION
        title_zh: 时长与缓动
        statement_zh: 颜色、边框这类状态过渡用过渡工具类的默认时长与缓动；提示气泡、卡片浮层保留约 150ms 的出现延迟，避免鼠标扫过时闪烁。
        params:
          duration: { value: 150ms, source: SRC.TAILWIND.TRANSITIONS, label_zh: 默认过渡时长 }
          easing: { value: "cubic-bezier(0.4, 0, 0.2, 1)", source: SRC.TAILWIND.TRANSITIONS, label_zh: 默认缓动 }
          hover_delay: { value: 150ms, source: SRC.GEIST.TOOLTIP, label_zh: 提示出现延迟 }
        enforcement: { kind: review }
        showcase:
          - kind: specimen
            title_zh: 过渡
            description_zh: 把指针移到轨道上看速度。
            name_label_zh: 时长
            rows:
              - name: 150ms
                usage_zh: 颜色、边框、背景的状态过渡
                jsx: |-
                  <div className="std-motion-track"><span className="std-motion-dot" style={{ transitionDuration: p.duration, transitionTimingFunction: p.easing }} /></div>

      - id: MOTION.REDUCED
        title_zh: 减少动效
        statement_zh: 用户开启「减少动效」时，关闭或降级动画、滚动和过渡；用 Tailwind 的 motion-safe / motion-reduce 变体写动效。
        anchors:
          - { spec: ui, quote: 尊重 prefers-reduced-motion：动画、滚动、过渡在减少动效模式下关闭或降级 }
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 只在允许动效时转动
            code: |-
              <Loader2Icon className="motion-safe:animate-spin" />
            lang: tsx

  # ───────────────────────────── 基础 · 点击反馈 ─────────────────────────────
  - key: press_feedback
    title_zh: 点击反馈
    group: foundations
    prefix: PRESS
    summary_zh: 每个可点的元素都有默认、悬停、按下、聚焦与禁用；按下的瞬间就有反馈，颜色加深一档、不移动不变尺寸；波纹只用组件库自带的；时长取快档；触屏去掉点击延迟、目标够大；键盘触发同样的反馈；禁用与加载中不响应；减少动效时只保留颜色变化。
    rules:
      - id: PRESS.STATES
        title_zh: 可点的元素都有五态
        statement_zh: 每个可点的元素都设计默认、悬停、按下、聚焦、禁用五态；按下态在按下的瞬间出现，不等请求返回；松开后回到悬停态。
        anchors:
          - { spec: ui, quote: hover、active、focus、disabled、loading、empty、error 状态完整。 }
        enforcement: { kind: review }
        showcase:
          - kind: demo
            title_zh: 按下态
            description_zh: 按住按钮看按下态；松开回到悬停态。
            jsx: |-
              <div className="flex items-center gap-3">
                <Button>按住看按下态</Button>
                <Button variant="secondary">次要按钮</Button>
                <button type="button" className="rounded-md px-3 py-2 text-label-14 transition-colors duration-150 hover:bg-ds-gray-100 active:bg-ds-gray-200">列表行式的按钮</button>
              </div>

      - id: PRESS.VISUAL
        title_zh: 按下时颜色加深一档
        statement_zh: 按下时背景比悬停再深一档（如 hover:bg-ds-gray-100 → active:bg-ds-gray-200）；不移动位置、不改尺寸、不改边框宽度；按钮是否加轻微缩小由项目统一决定。
        params:
          scale: { decision: 按钮按下时是否缩小？, candidates: [不缩小, scale(0.98)], label_zh: 按下缩放 }
        enforcement: { kind: review }

      - id: PRESS.WAVE
        title_zh: 波纹只用组件库自带的
        statement_zh: Geist 不用点击波纹；按钮、列表行、卡片的按下都用背景色变化表示，不引入 ripple 一类效果。
        enforcement: { kind: review }

      - id: PRESS.TIMING
        title_zh: 按下即时、回弹取快档
        statement_zh: 按下态即时出现（不加过渡延迟），松开回弹用快档时长；点击动画不长于 200ms，也不阻塞下一次点击。
        params:
          release: { value: 150ms, source: SRC.TAILWIND.TRANSITIONS, label_zh: 回弹时长 }
        enforcement: { kind: review }

      - id: PRESS.TOUCH
        title_zh: 触屏：无延迟、目标够大
        statement_zh: "可点元素设 touch-action: manipulation 去掉双击缩放带来的点击延迟；去掉系统的灰色点按高亮时必须提供自己的按下态；点击目标至少 24×24 CSS px（建议 44×44），相邻目标之间留出间距。"
        params:
          target_min: { value: 24, unit: px, source: SRC.POMASTER.UI_SPEC, label_zh: 最小点击目标 }
        anchors:
          - { spec: ui, quote: 触控目标尺寸至少 24×24 CSS px，且目标之间提供足够间距（WCAG 2.5.8）；建议达到 44×44（AAA）。 }
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 触屏点按
            code: |-
              button, a, [role='button'] {
                touch-action: manipulation;
                -webkit-tap-highlight-color: transparent; /* 前提：有自己的 :active 样式 */
              }
            lang: css

      - id: PRESS.KEYBOARD
        title_zh: 键盘触发同样的反馈
        statement_zh: 可点元素用真正的 button / a 元素，空格与回车能触发并显示按下态；用 div 模拟按钮时要补上 role、tabindex 和键盘处理，否则不算可点。
        enforcement: { kind: review }

      - id: PRESS.DISABLED
        title_zh: 禁用与加载中不响应
        statement_zh: 禁用和加载中的元素没有悬停、按下效果，点击不触发任何反馈动画；禁用的光标为 not-allowed；加载中的按钮保持宽度不变（见 CMP.BUTTON.LOADING）。
        enforcement: { kind: review }

      - id: PRESS.REDUCED
        title_zh: 减少动效时只保留颜色变化
        statement_zh: 减少动效模式下去掉缩放与波纹，保留按下时的颜色变化；状态仍然看得出来。
        anchors:
          - { spec: ui, quote: 尊重 prefers-reduced-motion：动画、滚动、过渡在减少动效模式下关闭或降级 }
        enforcement: { kind: review }

  # ───────────────────────────── 基础 · 焦点环 ─────────────────────────────
  - key: focus_ring
    title_zh: 焦点环
    group: foundations
    prefix: FOCUS
    summary_zh: 焦点只在键盘聚焦时显示且永远不去掉；全站一种焦点样式；与相邻颜色有足够对比；不被裁切、不被吸顶栏遮住；焦点顺序与视觉顺序一致，弹层进出时焦点有去处；焦点环跟随元素圆角。
    rules:
      - id: FOCUS.VISIBLE
        title_zh: 键盘聚焦时显示，永远不去掉
        statement_zh: "焦点样式写在 :focus-visible 上（鼠标点击不出现，键盘聚焦一定出现）；不写 outline: none 而不给同等可见的替代。"
        anchors:
          - { spec: ui, quote: MUST NOT 移除焦点轮廓而无同等级可见替代。 }
        enforcement: { kind: review }
        examples:
          - kind: dont
            title_zh: 去掉焦点不给替代
            code: |-
              button:focus { outline: none; }
            lang: css
        showcase:
          - kind: demo
            title_zh: 用 Tab 键依次聚焦
            description_zh: 点击不出焦点环，按 Tab 才出；自定义元素与组件同一种样式。
            jsx: |-
              <div className="flex items-center gap-3">
                <Button variant="secondary">按 Tab 看焦点</Button>
                <Input placeholder="输入框" className="w-36" />
                <a href="#" className="rounded-md text-label-14 text-ds-gray-1000 no-underline underline-offset-4 outline-none hover:underline focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-ds-blue-700">自定义链接</a>
              </div>

      - id: FOCUS.STYLE
        title_zh: 全站一种焦点样式
        statement_zh: 全站一种焦点样式：2px 蓝色轮廓（ds-blue-700）、外偏移 2px（与 Button 组件一致），写成共享的类，自己写的可点元素都用它。
        params:
          width: { value: 2, unit: px, source: SRC.POMASTER.PRESET, label_zh: 轮廓宽度 }
          offset: { value: 2, unit: px, source: SRC.POMASTER.PRESET, label_zh: 轮廓偏移 }
        anchors:
          - { spec: ui, quote: SHOULD 提供统一、设计系统级别的 focus indicator token（颜色、宽度、offset、:focus-visible）。 }
        enforcement: { kind: review }

      - id: FOCUS.CONTRAST
        title_zh: 与相邻颜色对比足够
        statement_zh: 焦点指示与相邻背景的对比度至少 3:1；在深色、彩色背景上换用能看清的颜色，不靠颜色变化本身表示焦点。
        anchors:
          - { spec: ui, quote: 颜色不得作为唯一信息来源；文本对比度至少 4.5:1，大文本至少 3:1，UI 组件/图标边界至少 3:1（WCAG 1.4.1 / 1.4.3 / 1.4.11）。 }
        enforcement: { kind: review }

      - id: FOCUS.NOT_OBSCURED
        title_zh: 不被裁切、不被遮住
        statement_zh: "overflow: hidden 的容器里改用内收的轮廓（负偏移或 inset 阴影），避免焦点环被裁掉；吸顶栏、固定底栏不能盖住获得焦点的元素（给滚动容器设 scroll-padding）。"
        anchors:
          - { spec: ui, quote: 焦点必须可见，且不得被吸顶栏、浮层、sticky 元素完全遮挡（WCAG 2.4.7 / 2.4.11）。 }
        enforcement: { kind: review }

      - id: FOCUS.ORDER
        title_zh: 焦点顺序与去处
        statement_zh: Tab 顺序与视觉顺序一致，不用正数 tabindex；弹层、抽屉、对话框打开时焦点进入，关闭后回到触发它的元素；只有模态层把焦点困在里面。
        anchors:
          - { spec: ui, quote: 弹层、抽屉、对话框打开后必须接管焦点，关闭后返回触发元素；背景不得保持可 Tab（WCAG 2.4.3 / 2.1.2）。 }
        enforcement: { kind: review }

      - id: FOCUS.RADIUS
        title_zh: 焦点环跟随元素圆角
        statement_zh: 焦点轮廓的圆角与元素一致（outline 会跟随 border-radius；用 box-shadow 画焦点时同样带圆角）；圆形按钮的焦点环也是圆的。
        enforcement: { kind: review }

  # ───────────────────────────── 组件 · 通用 · 按钮 ─────────────────────────────
  - key: button
    title_zh: 按钮
    group: components.general
    prefix: CMP.BUTTON
    summary_zh: 触发一个会改变状态的动作（部署、保存、删除）；改地址的跳转用链接按钮；一行有多个相关动作时用菜单或分裂按钮。
    playground:
      component: Button
      text_zh: 部署项目
      props:
        variant: { options: [default, secondary, tertiary, error, warning], default: default }
        size: { options: [tiny, small, medium, large], default: medium }
        shape: { options: [square, rounded], default: square }
        loading: { boolean: true, default: false }
        disabled: { boolean: true, default: false }
      matrix: { rows: variant, columns: size }
    rules:
      - id: CMP.BUTTON.USAGE
        title_zh: 何时用
        statement_zh: 按钮用于改变状态的动作（部署、保存、删除）；改变地址的导航用链接按钮。一行里有不止一个相关动作时，换成菜单或分裂按钮。
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 一个主操作配一个次要操作
            jsx: |-
              <div className="flex gap-2">
                <Button>部署项目</Button>
                <Button variant="secondary">查看日志</Button>
              </div>

      - id: CMP.BUTTON.VARIANTS
        title_zh: 变体
        statement_zh: 五种变体：default 是主操作；secondary 是辅助操作；tertiary 用于最次要的操作；error 用于破坏性的确认；warning 用于需要留意后果的操作。没有 primary、success、ghost 这类变体。
        params:
          variants: { value: [default, secondary, tertiary, error, warning], source: SRC.GEIST.BUTTON, label_zh: variant 取值 }
        enforcement: { kind: gate, check: markup.single-primary-button }
        showcase:
          - kind: specimen
            title_zh: 五种变体
            name_label_zh: variant
            rows:
              - name: default
                usage_zh: 主操作，一个操作区一个
                jsx: |-
                  <Button>部署项目</Button>
              - name: secondary
                usage_zh: 辅助操作
                jsx: |-
                  <Button variant="secondary">查看日志</Button>
              - name: tertiary
                usage_zh: 最次要的操作
                jsx: |-
                  <Button variant="tertiary">取消</Button>
              - name: error
                usage_zh: 破坏性的确认
                jsx: |-
                  <Button variant="error">删除项目</Button>
              - name: warning
                usage_zh: 需要留意后果的操作
                jsx: |-
                  <Button variant="warning">回滚部署</Button>

      - id: CMP.BUTTON.DANGER
        title_zh: 危险操作
        statement_zh: 破坏性的确认用 error 变体，文案是「动词 + 对象」，并且和完成后的提示一一对应：按钮「删除项目」，提示「项目已删除」。高风险操作（删除生产资源、吊销密钥）要求输入资源名确认。
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 动词加对象
            jsx: |-
              <Button variant="error">删除项目</Button>
          - kind: dont
            title_zh: 只有一个「删除」
            jsx: |-
              <Button variant="error">删除</Button>

      - id: CMP.BUTTON.SIZES
        title_zh: 尺寸
        statement_zh: 四种尺寸：tiny、small、medium（默认）、large。同一个操作区尺寸一致；tiny 只用于放在输入框里的小按钮。
        params:
          heights: { value: [24, 32, 40, 48], unit: px, source: SRC.POMASTER.PRESET, label_zh: 高度, note_zh: Geist 未公开像素高度，按 tiny / small / medium / large 取预设值 }
        enforcement: { kind: review }
        showcase:
          - kind: specimen
            title_zh: 四种尺寸
            name_label_zh: size
            rows:
              - name: tiny
                usage_zh: 输入框里的小按钮
                jsx: |-
                  <Button size="tiny">复制</Button>
              - name: small
                usage_zh: 表格行、卡片角落
                jsx: |-
                  <Button size="small">部署项目</Button>
              - name: medium
                usage_zh: 默认
                jsx: |-
                  <Button>部署项目</Button>
              - name: large
                usage_zh: 营销页、单列页面的主操作
                jsx: |-
                  <Button size="large">部署项目</Button>

      - id: CMP.BUTTON.SHAPES
        title_zh: 形状
        statement_zh: 默认是圆角矩形；纯图标按钮可以是方形或圆形；胶囊形（rounded）配阴影，只用于营销页。
        enforcement: { kind: review }
        showcase:
          - kind: demo
            title_zh: 形状
            jsx: |-
              <div className="flex items-center gap-3">
                <Button>部署项目</Button>
                <Button variant="secondary" svgOnly aria-label="上一页"><ArrowLeftIcon /></Button>
                <Button variant="secondary" shape="circle" svgOnly aria-label="下一页"><ArrowRightIcon /></Button>
                <Button shape="rounded" shadow>开始部署</Button>
              </div>

      - id: CMP.BUTTON.ICONS
        title_zh: 搭配图标
        statement_zh: 图标通过前缀、后缀放进按钮：前缀图标表达动作本身，后缀图标表达去向（箭头、外链）。同一个按钮区要么都带图标，要么都不带。
        enforcement: { kind: review }
        showcase:
          - kind: demo
            title_zh: 前缀与后缀
            jsx: |-
              <div className="flex gap-3">
                <Button variant="secondary" prefix={<ArrowLeftIcon />}>返回</Button>
                <Button variant="secondary" suffix={<ArrowRightIcon />}>下一步</Button>
                <Button variant="secondary" suffix={<ExternalLinkIcon />}>打开预览</Button>
              </div>

      - id: CMP.BUTTON.ICON_ONLY
        title_zh: 纯图标按钮
        statement_zh: 纯图标按钮设 svgOnly，并且必须带 aria-label；名称写动作和对象（「复制部署地址」），不写图标名。
        anchors:
          - { spec: ui, quote: MUST NOT 图标按钮缺少 aria-label 或等效可访问名称。 }
        enforcement: { kind: gate, check: markup.icon-button-label }
        examples:
          - kind: do
            title_zh: 有名称
            jsx: |-
              <Button variant="secondary" svgOnly aria-label="复制部署地址"><CopyIcon /></Button>
          - kind: dont
            title_zh: 读屏只能读出「按钮」
            code: |-
              <Button variant="secondary" svgOnly><CopyIcon /></Button>
            lang: tsx

      - id: CMP.BUTTON.LOADING
        title_zh: 加载
        statement_zh: 进行中的操作用按钮自身的 loading，按钮保持可聚焦并向读屏报告忙碌状态；不要把按钮换成一个单独的转圈图标。
        enforcement: { kind: review }
        showcase:
          - kind: demo
            title_zh: 加载状态
            jsx: |-
              <div className="flex gap-3">
                <Button loading>部署中</Button>
                <Button variant="secondary" loading>保存中</Button>
              </div>

      - id: CMP.BUTTON.DISABLED
        title_zh: 禁用
        statement_zh: 只有动作此刻做不了（缺少输入、权限不够）才禁用，并配文字提示说明原因。
        enforcement: { kind: review }
        showcase:
          - kind: demo
            title_zh: 禁用的五种变体
            jsx: |-
              <div className="flex flex-wrap gap-3">
                <Button disabled>部署项目</Button>
                <Button variant="secondary" disabled>查看日志</Button>
                <Button variant="tertiary" disabled>取消</Button>
                <Button variant="error" disabled>删除项目</Button>
                <Button variant="warning" disabled>回滚部署</Button>
              </div>

      - id: CMP.BUTTON.LINK
        title_zh: 链接按钮
        statement_zh: 改变地址的导航用链接按钮（与按钮同样的属性，渲染成链接）；不用按钮的点击事件去跳转。
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 链接按钮
            jsx: |-
              <ButtonLink variant="secondary" href="#/deployments">查看全部部署</ButtonLink>
          - kind: dont
            title_zh: 点击事件里跳转
            code: |-
              <Button onClick={() => router.push("/deployments")}>查看全部部署</Button>
            lang: tsx

      - id: CMP.BUTTON.WIDTH
        title_zh: 宽度
        statement_zh: 按钮宽度由文字决定；需要固定宽度时设宽度，单列表单的主操作可以占满整行。
        enforcement: { kind: review }
        showcase:
          - kind: demo
            title_zh: 占满整行
            jsx: |-
              <div className="w-80"><Button className="w-full">继续</Button></div>

      - id: CMP.BUTTON.SUBMIT
        title_zh: 表单提交
        statement_zh: 表单的提交按钮设 type="submit"，回车即可提交；一个表单一个提交按钮。项目里的按钮用 variant 选变体（对应 Geist 文档里的 type 属性），原生 type 照常写。
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 提交按钮
            code: |-
              <form onSubmit={onSave}>
                <Input name="name" />
                <Button type="submit">保存项目</Button>
              </form>
            lang: tsx

      - id: CMP.BUTTON.LABEL
        title_zh: 文案
        statement_zh: 文案说清会发生什么：「部署项目」「邀请成员」「轮换密钥」；不用光秃秃的「提交」，也不用「确定」「好的」这类泛泛的确认。切换方式的按钮加「改用」：「改用恢复码」。
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 说清会发生什么
            jsx: |-
              <Button>邀请成员</Button>
          - kind: dont
            title_zh: 泛泛的「确定」
            jsx: |-
              <Button>确定</Button>

  - key: divider
    title_zh: 分割线
    group: components.layout
    prefix: CMP.DIVIDER
    summary_zh: 分隔两块内容：优先用间距分组，分隔线只在间距不够时用；带文字的分隔线用于长表单分段。
    rules:
      - id: CMP.DIVIDER.SPACING_FIRST
        title_zh: 先用间距，再用线
        statement_zh: 相关内容用间距分组（PROXIMITY），只有间距不足以区分时才加分隔线；卡片之间、列表项之间不同时用间距和线。
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 线只在需要时
            jsx: |-
              <div className="flex w-80 flex-col gap-3 text-copy-14"><span>基本信息</span><Separator /><span>证件信息</span></div>

      - id: CMP.DIVIDER.TEXT
        title_zh: 带文字的分隔线用于分段
        statement_zh: 长表单或长详情里，带文字的分隔线可以作为轻量的分段标题；文字左对齐，不居中。
        enforcement: { kind: review }

      - id: CMP.DIVIDER.VERTICAL
        title_zh: 竖线分隔行内元素
        statement_zh: 竖向分隔线用于分隔同一行的文字链接或元信息（「编辑 | 复制」），高度与文字一致。
        enforcement: { kind: review }

  - key: space
    title_zh: 间距组合
    group: components.layout
    prefix: CMP.SPACE
    summary_zh: 行内元素之间的统一间距：按钮组、标签组、表单行内控件用间距组件而不是各自写外边距。
    rules:
      - id: CMP.SPACE.USE
        title_zh: 用间距组件，不手写外边距
        statement_zh: 一组并排的按钮、标签、行内控件用 flex + gap（gap-2 / gap-3 / gap-4，取间距阶梯），不在每个元素上写 margin；需要相接的按钮组用相邻圆角归零的组合。
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 统一间距
            jsx: |-
              <div className="flex gap-2"><Button>新建车辆</Button><Button variant="secondary">导入</Button><Button variant="secondary">导出</Button></div>
          - kind: dont
            title_zh: 各自写外边距
            code: |-
              <Button className="mr-[10px]">导入</Button><Button className="mr-[10px]">导出</Button>
            lang: tsx

      - id: CMP.SPACE.WRAP
        title_zh: 放不下就换行
        statement_zh: 间距组可能放不下时允许换行（wrap），换行后的行间距与列间距一致；不出现横向滚动。
        enforcement: { kind: review }

      - id: CMP.SPACE.ALIGN
        title_zh: 对齐基线
        statement_zh: 不同高度的元素并排时按中线对齐（align=center），文字与输入框并排时按基线对齐。
        enforcement: { kind: review }

  - key: breadcrumb
    title_zh: 面包屑
    group: components.navigation
    prefix: CMP.BREADCRUMB
    summary_zh: 显示当前页面在层级中的位置：从一级菜单开始、最后一项是当前页且不可点；层级超过 4 级时折叠中间。
    rules:
      - id: CMP.BREADCRUMB.PATH
        title_zh: 从一级开始、最后一项不可点
        statement_zh: 面包屑从一级菜单开始（不从「首页」开始，除非首页是真实的一级入口），最后一项是当前页标题且不可点；中间项可点并回到对应列表时恢复其筛选（CONTEXT）。
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 层级路径
            jsx: |-
              <nav aria-label="面包屑" className="flex items-center gap-2 text-copy-14"><a href="#" className="text-ds-gray-900 no-underline">车辆管理</a><span className="text-ds-gray-900">/</span><a href="#" className="text-ds-gray-900 no-underline">车辆台账</a><span className="text-ds-gray-900">/</span><span aria-current="page" className="text-ds-gray-1000">沪A12345</span></nav>

      - id: CMP.BREADCRUMB.COLLAPSE
        title_zh: 太深就折叠
        statement_zh: 超过 4 级时折叠中间层级为「…」并可展开；单层页面不显示面包屑。
        enforcement: { kind: review }

      - id: CMP.BREADCRUMB.NAMES
        title_zh: 名称与菜单一致
        statement_zh: 面包屑里的名称与菜单、页面标题一致；详情页用对象名称（车牌号、单号），不用「详情」。
        enforcement: { kind: review }

  - key: dropdown
    title_zh: 下拉菜单
    group: components.navigation
    prefix: CMP.DROPDOWN
    summary_zh: 收起一组次要操作或选项：触发器说清会展开什么；菜单项是动作、按频率排序、危险项最后并分隔。
    rules:
      - id: CMP.DROPDOWN.TRIGGER
        title_zh: 触发器说清会展开什么
        statement_zh: 触发器写「更多」或带向下箭头的动作名（「导出 ▾」）；悬停触发只用于导航菜单，操作菜单用点击触发；键盘可打开、上下键移动、Esc 关闭。
        enforcement: { kind: review }

      - id: CMP.DROPDOWN.ITEMS
        title_zh: 动作排序、危险最后
        statement_zh: 菜单项是动作（动词开头），按使用频率排序；危险操作放最后，用分隔线隔开并用危险色；不可用的项置灰并说明原因。
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 危险项分隔在最后
            jsx: |-
              <ul role="menu" className="m-0 w-44 list-none rounded-xl border border-ds-gray-400 bg-ds-background-100 p-1 text-copy-14 shadow-md"><li role="menuitem" className="rounded-md px-3 py-1.5">编辑</li><li role="menuitem" className="rounded-md px-3 py-1.5">复制为新车辆</li><li role="separator" className="my-1 h-px bg-ds-gray-400" /><li role="menuitem" className="rounded-md px-3 py-1.5 text-ds-red-700">删除</li></ul>

      - id: CMP.DROPDOWN.SIZE
        title_zh: 菜单不宜过长
        statement_zh: 菜单项不超过 10 个，超过分组（带组标题）或改为对话框选择；嵌套子菜单最多一层。
        enforcement: { kind: review }

  - key: nav_menu
    title_zh: 导航菜单
    group: components.navigation
    prefix: CMP.NAV_MENU
    summary_zh: 应用的主导航：层级不超过两级、当前位置高亮；菜单项按权限出现；折叠后图标可辨认。
    rules:
      - id: CMP.NAV_MENU.DEPTH
        title_zh: 不超过两级
        statement_zh: 侧边主导航最多两级（分组 + 页面）；第三层放到页面内的标签页或筛选里；菜单名与页面标题一致。
        enforcement: { kind: review }

      - id: CMP.NAV_MENU.ACTIVE
        title_zh: 当前位置高亮
        statement_zh: 当前页面对应的菜单项高亮，进入详情页时其所属列表的菜单项仍高亮；展开状态记住（SIDEBAR）。
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 当前项高亮
            jsx: |-
              <nav className="flex w-56 flex-col gap-1 text-copy-14"><span className="px-3 py-1 text-label-12 text-ds-gray-900">车辆管理</span><a href="#" aria-current="page" className="rounded-md bg-ds-gray-200 px-3 py-1.5 text-ds-gray-1000 no-underline">车辆台账</a><a href="#" className="rounded-md px-3 py-1.5 text-ds-gray-900 no-underline">保险管理</a></nav>

      - id: CMP.NAV_MENU.PERMISSION
        title_zh: 按权限出现
        statement_zh: 没有权限的菜单项不显示（不是置灰）；整组都没有权限时整组不显示；菜单权限与路由守卫用同一份权限码（GUARD）。
        enforcement: { kind: review }

  - key: pagination
    title_zh: 分页
    group: components.navigation
    prefix: CMP.PAGINATION
    summary_zh: 分页：显示总数与当前范围，每页条数可选；页码进 URL；数据量不确定时用「加载更多」。
    rules:
      - id: CMP.PAGINATION.TOTAL
        title_zh: 显示总数与范围
        statement_zh: 显示总条数（「共 1,248 条」），每页条数可选 10 / 20 / 50 / 100；总页数多时显示快速跳转；只有一页时不显示分页。
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 总数与每页条数
            jsx: |-
              <nav aria-label="分页" className="flex items-center gap-3 text-copy-14"><span className="text-ds-gray-900">共 1,248 条</span><Button size="small" variant="secondary">上一页</Button><span className="tabular-nums">3 / 63</span><Button size="small" variant="secondary">下一页</Button></nav>

      - id: CMP.PAGINATION.URL
        title_zh: 页码进 URL
        statement_zh: 页码与每页条数写进 URL（STATE.URL）；筛选条件变化时回到第 1 页；删除当前页最后一条后回到上一页。
        enforcement: { kind: review }

      - id: CMP.PAGINATION.POSITION
        title_zh: 位置固定
        statement_zh: 表格分页放在表格右下方，与表格右边对齐；列表很长时可以在顶部也放一个简洁版。
        enforcement: { kind: review }

  - key: steps
    title_zh: 步骤条
    group: components.navigation
    prefix: CMP.STEPS
    summary_zh: 多步流程的进度：步骤 3–5 个、名称是名词；当前步骤、已完成、出错分明；可回到已完成的步骤修改。
    rules:
      - id: CMP.STEPS.COUNT
        title_zh: 3–5 步
        statement_zh: 步骤控制在 3–5 个，每步名称是名词或短动宾（「填写车辆」「上传证件」「确认提交」）；超过 5 步合并或拆成多个流程。
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 当前与出错
            jsx: |-
              <ol className="m-0 flex w-[480px] list-none items-center gap-3 p-0 text-label-13"><li className="flex items-center gap-2 text-ds-gray-1000"><span className="grid size-6 place-items-center rounded-full bg-ds-gray-1000 text-ds-background-100">1</span>填写车辆</li><li aria-hidden="true" className="h-px flex-1 bg-ds-gray-400" /><li className="flex items-center gap-2 text-ds-red-700"><span className="grid size-6 place-items-center rounded-full border border-ds-red-700">2</span>上传证件</li><li aria-hidden="true" className="h-px flex-1 bg-ds-gray-400" /><li className="flex items-center gap-2 text-ds-gray-900"><span className="grid size-6 place-items-center rounded-full border border-ds-gray-400">3</span>确认提交</li></ol>

      - id: CMP.STEPS.STATUS
        title_zh: 状态分明
        statement_zh: 已完成、当前、未开始、出错四种状态样式分明，出错的步骤写原因；已完成的步骤可点回去修改，未开始的不可跳过。
        enforcement: { kind: review }

      - id: CMP.STEPS.SAVE
        title_zh: 跨步保存
        statement_zh: 每步完成时保存草稿（FORM 草稿），中途离开再回来停在原步骤；最后一步汇总全部信息再提交。
        enforcement: { kind: review }

  - key: tabs
    title_zh: 标签页
    group: components.navigation
    prefix: CMP.TABS
    summary_zh: 同一页面内平级视图的切换：标签名短、数量少；当前标签进 URL；不把流程步骤做成标签页。
    rules:
      - id: CMP.TABS.WHEN
        title_zh: 平级视图才用标签页
        statement_zh: 标签页切换同一对象的平级视图（基本信息 / 维修记录 / 费用）；有先后顺序的流程用步骤条；标签多于 7 个时考虑拆页或用侧栏导航。
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 平级视图
            jsx: |-
              <div role="tablist" className="flex w-[420px] gap-4 border-b border-ds-gray-400 text-label-14"><span role="tab" aria-selected="false" className="pb-2 text-ds-gray-900">基本信息</span><span role="tab" aria-selected="true" className="border-b-2 border-ds-gray-1000 pb-2 text-ds-gray-1000">维修记录（3）</span><span role="tab" aria-selected="false" className="pb-2 text-ds-gray-900">费用</span></div>

      - id: CMP.TABS.URL
        title_zh: 当前标签进 URL
        statement_zh: 当前标签写进 URL（查询参数或子路由），刷新与分享后停在同一标签；切换标签不丢失其他标签里未保存的内容（或切换前提示）。
        enforcement: { kind: review }

      - id: CMP.TABS.LABEL
        title_zh: 标签名短，可带计数
        statement_zh: 标签名 2–6 个字，可以带计数（「维修记录（3）」）；不在标签名里放图标以外的装饰；禁用的标签说明原因。
        enforcement: { kind: review }

  - key: checkbox
    title_zh: 多选框
    group: components.entry
    prefix: CMP.CHECKBOX
    summary_zh: 在一组选项里选多个，或确认一句声明：选项竖排、标签可点；全选给出半选态；单个多选框不代替开关。
    rules:
      - id: CMP.CHECKBOX.LAYOUT
        title_zh: 竖排、标签可点
        statement_zh: 多于 3 个选项竖排，每项的标签文字也能点中；组有标题说明选什么；选项多于 10 个改带搜索的多选或穿梭框。
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 竖排与全选
            jsx: |-
              <fieldset className="flex flex-col gap-2"><legend className="mb-1 text-label-14 text-ds-gray-1000">通知</legend><label className="flex items-center gap-2 text-copy-14"><input type="checkbox" defaultChecked /> 保养到期</label><label className="flex items-center gap-2 text-copy-14"><input type="checkbox" /> 保险到期</label><label className="flex items-center gap-2 text-copy-14"><input type="checkbox" defaultChecked /> 年检到期</label></fieldset>

      - id: CMP.CHECKBOX.INDETERMINATE
        title_zh: 全选有半选态
        statement_zh: 有「全选」时，部分选中显示半选态（indeterminate），点击半选态变为全选；全选只作用于当前可见、可操作的选项，并说清范围。
        enforcement: { kind: review }

      - id: CMP.CHECKBOX.NOT_SWITCH
        title_zh: 立即生效用开关，提交生效用多选框
        statement_zh: 改了立即生效的设置用开关；需要随表单一起提交的选择用多选框；单个多选框只用于确认一句声明（「我已阅读并同意…」），并且声明文字完整可读。
        enforcement: { kind: review }

  - key: date_picker
    title_zh: 日期选择
    group: components.entry
    prefix: CMP.DATE_PICKER
    summary_zh: 选择日期或日期范围：显示格式统一、可键盘输入；范围选择给常用快捷项并限制跨度；不可选的日期置灰并说明。
    rules:
      - id: CMP.DATE_PICKER.FORMAT
        title_zh: 显示格式统一
        statement_zh: 日期显示统一为 YYYY-MM-DD，日期时间为 YYYY-MM-DD HH:mm:ss（见 FORMAT.DATETIME）；存储与传输用 ISO 8601；允许用户直接键入日期，键入后按同一格式回显。
        enforcement: { kind: review }

      - id: CMP.DATE_PICKER.RANGE
        title_zh: 范围选择有快捷项与上限
        statement_zh: 日期范围给常用快捷项（今天、最近 7 天、本月、上月）；查询类范围限制最大跨度（如 366 天）并在超出时提示；开始和结束一起选，不拆成两个独立控件。
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 范围与快捷项
            jsx: |-
              <div className="flex flex-col gap-2"><div className="flex items-center gap-2"><input type="date" className="h-9 rounded-md border border-ds-gray-400 bg-ds-background-100 px-3 text-copy-14 text-ds-gray-1000" /><span className="text-ds-gray-900">～</span><input type="date" className="h-9 rounded-md border border-ds-gray-400 bg-ds-background-100 px-3 text-copy-14 text-ds-gray-1000" /></div><div className="flex gap-2"><Button size="small" variant="secondary">最近 7 天</Button><Button size="small" variant="secondary">本月</Button></div></div>

      - id: CMP.DATE_PICKER.DISABLED
        title_zh: 不可选的日期置灰
        statement_zh: 不可选的日期（过去、节假日、超出业务范围）置灰并在面板里说明原因；不在选完后才报错。
        enforcement: { kind: review }

  - key: form
    title_zh: 表单
    group: components.entry
    prefix: CMP.FORM
    summary_zh: 字段的标签、分组、校验与提交：标签在上、按业务分组；必填只标星号不重复说明；提交时整体校验并定位到第一个错误；提交中锁定。
    rules:
      - id: CMP.FORM.LAYOUT
        title_zh: 标签在上，按业务分组
        statement_zh: 新建、编辑表单标签在输入框上方（Label 在上）；字段按业务分组（fieldset + legend），每组有标题；一行最多两列，相关字段放同一行；不把所有字段堆成一长列不分组。
        enforcement: { kind: review }
        showcase:
          - kind: demo
            title_zh: 分组、必填与操作区
            jsx: |-
              <form className="flex w-96 flex-col gap-4"><fieldset className="flex flex-col gap-3"><legend className="mb-1 text-label-14 font-semibold text-ds-gray-1000">基本信息</legend><div className="flex flex-col gap-1.5"><Label htmlFor="f1"><span className="text-ds-red-700">*</span> 车牌号</Label><Input id="f1" placeholder="例：沪A12345" /></div><div className="flex flex-col gap-1.5"><Label htmlFor="f2">备注（选填）</Label><Input id="f2" /></div></fieldset><div className="flex gap-2"><Button>保存</Button><Button variant="secondary">取消</Button></div></form>

      - id: CMP.FORM.REQUIRED
        title_zh: 必填只标星号
        statement_zh: 必填字段在标签前标星号，必填字段多于可选字段时改为只标「（选填）」；说明文字写在字段下方，不写在占位符里。
        enforcement: { kind: review }

      - id: CMP.FORM.SUBMIT
        title_zh: 提交整体校验并定位
        statement_zh: 提交时校验全部字段，滚动并聚焦到第一个错误字段；提交中锁定按钮与表单（CLICK.LOCK），成功后给出结果并决定去向（返回列表或停留继续编辑），失败保留已填内容。
        enforcement: { kind: review }

      - id: CMP.FORM.ACTIONS
        title_zh: 操作区固定位置
        statement_zh: 表单操作区在表单末尾左对齐（与字段左边对齐），主按钮在前；长表单把操作区吸底（sticky bottom-0），保证随时可提交。
        enforcement: { kind: review }

  - key: input
    title_zh: 输入框
    group: components.entry
    prefix: CMP.INPUT
    summary_zh: 单行文字输入：标签在上、占位符只给格式示例；必填、长度、格式在提交前就地提示；前后缀放单位与固定内容，不放说明。
    rules:
      - id: CMP.INPUT.LABEL
        title_zh: 标签在外，占位符只放示例
        statement_zh: 每个输入框都有可见标签（表单里用表单项的 label，不用占位符代替标签）；占位符只写格式示例（如「例：沪A12345」），不写「请输入」之类的废话；聚焦后占位符消失不影响理解。
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 标签 + 示例占位符
            jsx: |-
              <div className="flex w-72 flex-col gap-1.5"><Label htmlFor="plate">车牌号</Label><Input id="plate" placeholder="例：沪A12345" /></div>
          - kind: dont
            title_zh: 用占位符当标签
            jsx: |-
              <Input placeholder="请输入车牌号" className="w-72" />
        showcase:
          - kind: demo
            title_zh: 标签、示例占位符与错误态
            jsx: |-
              <div className="flex w-80 flex-col gap-4"><div className="flex flex-col gap-1.5"><Label htmlFor="p2">车牌号</Label><Input id="p2" defaultValue="沪A1" aria-invalid="true" className="border-ds-red-700" /><span className="text-copy-13 text-ds-red-700">车牌号为 7–8 位，如沪A12345</span></div><div className="flex flex-col gap-1.5"><Label htmlFor="w2">整备质量</Label><div className="flex items-center gap-2"><Input id="w2" placeholder="例：1580" /><span className="text-label-13 text-ds-gray-900">kg</span></div></div></div>

      - id: CMP.INPUT.VALIDATION
        title_zh: 就地校验，失败说清怎么改
        statement_zh: 格式与长度在失焦时校验，错误显示在输入框下方并把边框标为错误态（status=error / aria-invalid）；提示写清规则与改法（「车牌号为 7–8 位，如沪A12345」），不写「格式错误」；用户改动后立即撤掉错误。
        enforcement: { kind: review }

      - id: CMP.INPUT.AFFIX
        title_zh: 前后缀只放单位与固定内容
        statement_zh: 单位、货币代码、固定前缀（https://）放在前后缀里，不让用户输入；图标前缀只用于搜索、账号这类约定俗成的场景；清除按钮（allowClear）给可选字段，必填字段不清空为空串。
        enforcement: { kind: review }

      - id: CMP.INPUT.WIDTH
        title_zh: 宽度跟内容长度走
        statement_zh: 输入框宽度按预期内容长度选（短码、数量、手机号用窄档，名称、地址用宽档），同一表单里同类字段等宽；不要所有输入框都拉满整行。
        enforcement: { kind: review }

  - key: textarea
    title_zh: 多行输入
    group: components.entry
    prefix: CMP.TEXTAREA
    summary_zh: 多行文字输入：给出行数与字数上限，自动增高有上限；长文本才用它，短备注用单行。
    rules:
      - id: CMP.TEXTAREA.ROWS
        title_zh: 初始行数与自动增高
        statement_zh: 初始 3–4 行；内容变多时自动增高（autoSize / field-sizing），最多 8 行后出现滚动条；不允许用户把它拖得比容器还宽。
        enforcement: { kind: review }

      - id: CMP.TEXTAREA.COUNT
        title_zh: 有上限就显示计数
        statement_zh: 后端有长度上限的字段显示字数计数（showCount + maxlength），接近上限时计数变为警示色；超限不截断用户已输入的内容，而是阻止提交并提示。
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 计数
            jsx: |-
              <div className="flex w-80 flex-col gap-1"><textarea rows={3} maxLength={200} placeholder="例：前保险杠有划痕" className="rounded-md border border-ds-gray-400 bg-ds-background-100 p-3 text-copy-14" /><span className="self-end text-copy-13 text-ds-gray-900">0 / 200</span></div>

      - id: CMP.TEXTAREA.WHEN
        title_zh: 长文本才用多行
        statement_zh: 备注、描述、原因这类可能超过一行的内容用多行输入；名称、编号、短备注用单行输入，不为了「看起来宽敞」用多行。
        enforcement: { kind: review }

  - key: input_number
    title_zh: 数字输入
    group: components.entry
    prefix: CMP.INPUT_NUMBER
    summary_zh: 输入有范围的数字：写明单位、范围与精度，步进按钮可选；金额和数量右对齐。
    rules:
      - id: CMP.INPUT_NUMBER.RANGE
        title_zh: 范围、精度、单位写清
        statement_zh: 设置 min / max / precision，与后端校验一致；单位放在后缀或标签里（「整备质量（kg）」），不让用户输入单位；超出范围时就地提示允许的范围，不静默改成边界值。
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 范围与单位
            jsx: |-
              <div className="flex w-56 items-center gap-2"><Input type="number" min={0} max={9999} placeholder="0–9999" className="text-right" /><span className="text-label-13 text-ds-gray-900">kg</span></div>

      - id: CMP.INPUT_NUMBER.ALIGN
        title_zh: 数字右对齐、等宽
        statement_zh: 金额、数量、重量这类可比较的数字在输入框和列表里都右对齐并用等宽数字（tabular-nums），方便按位比较。
        enforcement: { kind: review }

      - id: CMP.INPUT_NUMBER.STEP
        title_zh: 步进按钮只给小范围
        statement_zh: 步进按钮适合 0–20 这类小范围的调整（数量、优先级）；金额、长编号不显示步进按钮，避免误点改值；滚轮不改值。
        enforcement: { kind: review }

  - key: radio
    title_zh: 单选框
    group: components.entry
    prefix: CMP.RADIO
    summary_zh: 在几个互斥的选项里选一个：2–5 个选项且要一眼看全时用；有默认值；选项多了改选择器。
    rules:
      - id: CMP.RADIO.WHEN
        title_zh: 选项少且要看全才用单选
        statement_zh: 2–5 个互斥选项且用户需要对比时用单选组；超过 5 个改选择器；只有「是 / 否」且立即生效时用开关。
        enforcement: { kind: review }
        showcase:
          - kind: demo
            title_zh: 表单里的单选与切换视图的按钮样式
            jsx: |-
              <div className="flex w-80 flex-col gap-4"><fieldset className="flex flex-col gap-2"><legend className="mb-1 text-label-14 text-ds-gray-1000">可见范围</legend><label className="flex items-center gap-2 text-copy-14"><input type="radio" name="scope" defaultChecked /> 仅本人可见</label><label className="flex items-center gap-2 text-copy-14"><input type="radio" name="scope" /> 本部门可见</label></fieldset><div className="inline-flex w-fit rounded-md border border-ds-gray-400 p-0.5 text-label-13"><span className="rounded px-3 py-1 text-ds-gray-900">日</span><span className="rounded bg-ds-gray-200 px-3 py-1 text-ds-gray-1000">周</span><span className="rounded px-3 py-1 text-ds-gray-900">月</span></div></div>

      - id: CMP.RADIO.DEFAULT
        title_zh: 给安全的默认值
        statement_zh: 单选组默认选中最常用或最安全的一项（如「仅本人可见」）；确实要用户主动选择的（无安全默认），不预选并在提交时校验必选。
        enforcement: { kind: review }

      - id: CMP.RADIO.BUTTON_STYLE
        title_zh: 按钮样式只用于切换视图
        statement_zh: 分段样式的单选（Segmented / Tabs 外观）只用于切换视图、筛选范围这类立即生效的选择；表单里的取值用普通单选，竖排或横排保持一致。
        enforcement: { kind: review }

  - key: select
    title_zh: 选择器
    group: components.entry
    prefix: CMP.SELECT
    summary_zh: 从下拉列表里选一项：选项多于 7 个可搜索、多于 50 个改远程搜索；选项文案短、互斥、有序；空态与加载态都要有。
    rules:
      - id: CMP.SELECT.WHEN
        title_zh: 选项数量决定控件
        statement_zh: 2–5 个互斥选项且需要一眼看全时用单选组或分段控制；6 个以上用选择器；超过 7 个打开搜索（showSearch）；超过 50 个或来自接口时改远程搜索，并防抖、显示加载态。
        enforcement: { kind: review }
        showcase:
          - kind: demo
            title_zh: 可搜索的选择器与禁用原因
            jsx: |-
              <div className="flex w-72 flex-col gap-1.5"><Label htmlFor="model">车型</Label><select id="model" className="h-9 rounded-md border border-ds-gray-400 bg-ds-background-100 px-3 text-copy-14 text-ds-gray-1000" defaultValue=""><option value="" disabled>选择车型</option><option value="M01">轻型厢式货车</option><option value="M02">中型栏板货车</option><option value="M09" disabled>重型牵引车（已停用）</option></select></div>

      - id: CMP.SELECT.OPTIONS
        title_zh: 选项短、互斥、有序
        statement_zh: 选项文案短（不超过 12 个字）、互斥、按使用频率或自然顺序排列（状态按流程顺序，地区按行政顺序），「其他」放最后；禁用的选项说明原因（tooltip），不直接隐藏。
        enforcement: { kind: review }

      - id: CMP.SELECT.EMPTY
        title_zh: 空与加载有反馈
        statement_zh: 远程搜索时显示加载态；没有匹配项时显示「无匹配的车型」并给出新建入口（有新建权限时）；不把空列表留成一片白。
        enforcement: { kind: review }

      - id: CMP.SELECT.VALUE
        title_zh: 值与显示分开
        statement_zh: 选项的值用稳定的编码（code / id），显示用名称；回显时用值匹配，名称改了不影响已存数据；值不在选项里时显示原值并提示「已停用」，不显示成空。
        enforcement: { kind: review }

  - key: switch
    title_zh: 开关
    group: components.entry
    prefix: CMP.SWITCH
    summary_zh: 两个状态之间切换、并且立即生效：标签写它控制什么；有副作用的切换先确认；切换中显示加载并防重复。
    playground:
      component: Switch
      props:
        disabled: { boolean: true, default: false }
    rules:
      - id: CMP.SWITCH.IMMEDIATE
        title_zh: 开关立即生效
        statement_zh: 开关只用于立即生效的设置；需要点「保存」才生效的选项用多选框或单选；切换后给出结果反馈（状态变化本身或一条轻提示），失败时回到原状态并提示原因。
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 标签写控制什么
            jsx: |-
              <label className="flex items-center gap-2 text-copy-14"><Switch defaultChecked aria-label="到期自动提醒" /> 到期自动提醒</label>
          - kind: dont
            title_zh: 用开关做表单项再点保存
            code: |-
              <Label>接收通知</Label><Switch checked={form.notify} onCheckedChange={(v) => setForm({ ...form, notify: v })} />
              <Button type="submit">保存</Button>
            lang: tsx

      - id: CMP.SWITCH.LOADING
        title_zh: 切换中加载、防重复
        statement_zh: 切换要请求接口时显示加载态（loading）并在返回前禁用，防止连点；接口失败回滚开关状态。
        enforcement: { kind: review }

      - id: CMP.SWITCH.CONFIRM
        title_zh: 有副作用先确认
        statement_zh: 关闭后会影响他人或不可撤回的开关（停用账号、关闭对外接口）先弹确认，说清后果；普通偏好不确认。
        enforcement: { kind: review }

  - key: upload
    title_zh: 上传
    group: components.entry
    prefix: CMP.UPLOAD
    summary_zh: 上传文件：说清格式、大小与数量；上传中显示进度、可取消；失败可重试；上传与提交分开。
    rules:
      - id: CMP.UPLOAD.LIMITS
        title_zh: 格式、大小、数量写在前面
        statement_zh: 上传区域旁写明允许的格式、单个大小与数量上限（「PDF、JPG，单个不超过 10 MB，最多 5 个」）；选择文件时就校验，不等上传完才拒绝；校验以服务端为准。
        enforcement: { kind: review }

      - id: CMP.UPLOAD.PROGRESS
        title_zh: 进度、取消、重试
        statement_zh: 每个文件显示进度，可取消；失败的文件保留在列表里标红、写清原因并可重试；全部完成前不允许提交依赖这些文件的表单。
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 文件列表
            jsx: |-
              <ul className="m-0 flex w-80 list-none flex-col gap-2 p-0 text-copy-14"><li className="flex items-center justify-between rounded-md border border-ds-gray-400 px-3 py-2"><span>行驶证.pdf</span><span className="text-ds-green-900">已上传</span></li><li className="flex items-center justify-between rounded-md border border-ds-red-700 px-3 py-2"><span>保单.jpg：文件超过 10 MB</span><Button size="small" variant="secondary">重试</Button></li></ul>

      - id: CMP.UPLOAD.SEPARATE
        title_zh: 上传与提交分开
        statement_zh: 文件先上传得到文件标识，表单提交只带标识；大文件分片上传、可断点续传；上传的文件名、类型在服务端重新校验与改名（SEC 规范）。
        enforcement: { kind: review }

  - key: badge
    title_zh: 徽标数
    group: components.display
    prefix: CMP.BADGE
    summary_zh: 在图标或头像右上角显示计数或状态点：只提示有新东西，数字封顶；状态点配文字。
    rules:
      - id: CMP.BADGE.COUNT
        title_zh: 计数封顶
        statement_zh: 计数超过 99 显示「99+」；为 0 时不显示；计数表示「有待处理的东西」，点进去处理后清零或减少。
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 封顶与状态点
            jsx: |-
              <div className="flex items-center gap-6"><span className="relative grid size-8 place-items-center rounded-md bg-ds-gray-200 text-label-13">消<span className="absolute -right-2 -top-2 rounded-full bg-ds-red-700 px-1.5 text-label-12 text-ds-background-100">99+</span></span><span className="flex items-center gap-2 text-copy-14"><span className="size-2 rounded-full bg-ds-blue-700" />同步中</span></div>

      - id: CMP.BADGE.DOT
        title_zh: 状态点配文字
        statement_zh: 状态点（在线、同步中、异常）旁边写文字，不单独用颜色表达状态；动画状态点只用于正在进行的过程。
        enforcement: { kind: review }

      - id: CMP.BADGE.RESTRAINT
        title_zh: 克制使用
        statement_zh: 徽标只用于需要用户注意的新消息、待办；不给每个菜单都加数字；同一屏不超过 3 个红点。
        enforcement: { kind: review }

  - key: tag
    title_zh: 标签
    group: components.display
    prefix: CMP.TAG
    summary_zh: 给对象打上分类或状态的短标签：颜色有固定语义、文字不超过 6 个字；可关闭的标签用于筛选条件；不当按钮用。
    playground:
      component: Badge
      text_zh: 在用
      props:
        variant: { options: [default, secondary, outline, destructive], default: secondary }
    rules:
      - id: CMP.TAG.SEMANTIC
        title_zh: 颜色有固定语义
        statement_zh: 状态标签的颜色按语义固定（成功 / 进行中 / 警告 / 失败 / 中性），同一状态全站同色；分类标签用中性色或预设色板，不自定义色值；颜色之外还有文字，不只靠颜色区分。
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 语义色
            jsx: |-
              <div className="flex gap-2"><Badge variant="secondary">在用</Badge><Badge>调度中</Badge><Badge variant="outline">待年检</Badge><Badge variant="destructive">已报废</Badge></div>
          - kind: dont
            title_zh: 自定义色值
            code: |-
              <Badge className="bg-[#f50]">急</Badge>
            lang: tsx

      - id: CMP.TAG.SHORT
        title_zh: 文字短
        statement_zh: 标签文字不超过 6 个字，不换行；一行标签超过 3 个时折叠为「+N」，悬停显示全部。
        enforcement: { kind: review }

      - id: CMP.TAG.CLOSABLE
        title_zh: 可关闭的标签只用于条件
        statement_zh: 可关闭标签用于展示已选的筛选条件或已添加的关键词，关闭即移除该条件；标签不当按钮或链接用，需要点击跳转的用链接。
        enforcement: { kind: review }

  - key: card
    title_zh: 卡片
    group: components.display
    prefix: CMP.CARD
    summary_zh: 把一组相关信息装进一个容器：标题说清是什么，操作在右上；卡片之间等距；可点的整张卡片有悬停反馈（见卡片悬停）。
    rules:
      - id: CMP.CARD.STRUCTURE
        title_zh: 标题、内容、操作
        statement_zh: 卡片标题说清内容是什么（CardTitle），补充说明放 CardDescription；操作放标题行右侧，最多 2 个；底部操作放 CardFooter，只放与卡片内容相关的动作。
        enforcement: { kind: review }
        showcase:
          - kind: demo
            title_zh: 标题、操作与内容
            jsx: |-
              <Card className="w-80"><CardHeader><CardTitle>本月保养</CardTitle><CardDescription>按到期日排序</CardDescription></CardHeader><CardContent className="flex justify-between text-copy-14"><span>待保养</span><span className="tabular-nums">12 辆</span></CardContent></Card>

      - id: CMP.CARD.SPACING
        title_zh: 等距与等高
        statement_zh: 同一行卡片等高、间距一致（取栅格 gutter）；卡片里不再套带边框的卡片，二级分组用分隔线或小标题。
        enforcement: { kind: review }

      - id: CMP.CARD.CLICKABLE
        title_zh: 整卡可点要说清
        statement_zh: 整张卡片可点时，整卡是一个链接或按钮（键盘可聚焦），悬停有反馈；卡片里同时还有其他按钮时，不把整卡做成可点，避免误触。
        enforcement: { kind: review }

  - key: descriptions
    title_zh: 描述列表
    group: components.display
    prefix: CMP.DESCRIPTIONS
    summary_zh: 详情页里成组展示字段：标签与值对齐、分组有标题；空值显示占位；长文本独占一行。
    rules:
      - id: CMP.DESCRIPTIONS.LAYOUT
        title_zh: 标签与值成对对齐
        statement_zh: 字段按业务分组，每组有标题；桌面端每行 3 列、窄屏 1 列；标签右侧或上方对齐保持全页一致；值可复制的（编号、单号）提供复制按钮。
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 分组详情
            jsx: |-
              <dl className="grid w-[520px] grid-cols-[96px_1fr_96px_1fr] gap-x-4 gap-y-2 text-copy-14"><dt className="text-ds-gray-900">车牌号</dt><dd>沪A12345</dd><dt className="text-ds-gray-900">车型</dt><dd>轻型厢式货车</dd><dt className="text-ds-gray-900">购置日期</dt><dd className="tabular-nums">2024-03-18</dd><dt className="text-ds-gray-900">备注</dt><dd className="text-ds-gray-900">—</dd></dl>

      - id: CMP.DESCRIPTIONS.EMPTY
        title_zh: 空值显示占位
        statement_zh: 没有值的字段显示「—」，不留空白也不隐藏字段（隐藏会让用户以为没有这个信息）；值为 0 显示 0。
        enforcement: { kind: review }

      - id: CMP.DESCRIPTIONS.LONG
        title_zh: 长文本独占一行
        statement_zh: 备注、地址这类长文本独占一整行（span 全部列），超过 3 行折叠并可展开。
        enforcement: { kind: review }

  - key: empty
    title_zh: 空状态
    group: components.display
    prefix: CMP.EMPTY
    summary_zh: 没有数据时：说清为什么空、下一步做什么；首次使用、筛选无结果、无权限、出错各用各的文案。
    rules:
      - id: CMP.EMPTY.REASON
        title_zh: 说清为什么空
        statement_zh: 空状态写清原因：首次使用（「还没有车辆」）、筛选无结果（「没有符合条件的车辆」）、无权限（「你没有查看车辆的权限」）；出错不用空状态，用错误状态（ERRH）。
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 原因 + 下一步
            jsx: |-
              <div className="flex w-80 flex-col items-center gap-3 rounded-xl border border-dashed border-ds-gray-400 p-6 text-center"><p className="text-copy-14 text-ds-gray-1000">没有符合条件的车辆</p><p className="text-copy-13 text-ds-gray-900">换个关键词，或清除筛选再看</p><Button size="small" variant="secondary">清除筛选</Button></div>

      - id: CMP.EMPTY.NEXT
        title_zh: 给出下一步
        statement_zh: 空状态带一个主要动作（新建、导入、清除筛选、申请权限），有权限才显示新建；不写「暂无数据」就结束。
        enforcement: { kind: review }

      - id: CMP.EMPTY.QUIET
        title_zh: 插图克制
        statement_zh: 表格、卡片里的空状态用简洁的小插图或不用插图；整页空状态可以用插图，但不喧宾夺主。
        enforcement: { kind: review }

  - key: table
    title_zh: 表格
    group: components.display
    prefix: CMP.TABLE
    summary_zh: 成行成列的数据：表头清楚、数字右对齐、操作列在最右；空、加载、错误三态保持表头；分页或虚拟滚动二选一。大数据与复杂交互见「数据网格」。
    rules:
      - id: CMP.TABLE.COLUMNS
        title_zh: 列的顺序与对齐
        statement_zh: 第一列放识别对象的名称或编号（可点进详情）；文字左对齐，数字、金额右对齐并用等宽数字，状态、操作居中或左对齐但同表一致；列宽给最小值，超长文本省略并悬停显示全文。
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 对齐与操作列
            jsx: |-
              <Table className="w-[520px]"><TableHeader><TableRow><TableHead>车牌号</TableHead><TableHead className="text-right">里程（km）</TableHead><TableHead>状态</TableHead><TableHead>操作</TableHead></TableRow></TableHeader><TableBody><TableRow><TableCell>沪A12345</TableCell><TableCell className="text-right tabular-nums">12,480</TableCell><TableCell>在用</TableCell><TableCell><Button size="small" variant="tertiary">编辑</Button></TableCell></TableRow></TableBody></Table>

      - id: CMP.TABLE.ACTIONS
        title_zh: 操作列在最右，最多三个
        statement_zh: 行操作放最右列，最多直接露出 3 个文字按钮，其余收进「更多」下拉；危险操作放最后并二次确认；操作列在横向滚动时固定在右侧。
        enforcement: { kind: review }

      - id: CMP.TABLE.STATES
        title_zh: 空、加载、错误保持表头
        statement_zh: 加载时保留表头并在表体显示骨架或加载态；没有数据时表体显示空状态（说明为什么空、能做什么）；出错时表体显示错误与重试，不把整张表换成一句话。
        enforcement: { kind: review }

      - id: CMP.TABLE.PAGING
        title_zh: 分页规则
        statement_zh: 默认每页 10 或 20 条，可选 10 / 20 / 50 / 100；页码、每页条数与排序写进 URL（STATE.URL）；翻页后回到表格顶部；数据量很大时用服务端分页，不在前端一次拉全量。
        enforcement: { kind: review }

  - key: tooltip
    title_zh: 文字提示
    group: components.display
    prefix: CMP.TOOLTIP
    summary_zh: 悬停或聚焦时显示的简短说明：只补充、不承载必需信息；键盘可触达；不放可点内容。
    rules:
      - id: CMP.TOOLTIP.SUPPLEMENT
        title_zh: 只补充，不承载必需信息
        statement_zh: 提示只放补充说明（图标按钮的名称、被截断的全文、禁用原因）；完成任务必需的信息直接写在界面上；提示文字一两句，超过就改用气泡卡片或帮助链接。
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 禁用原因
            jsx: |-
              <span title="已有在途工单，不能删除" className="inline-block"><Button variant="secondary" disabled>删除</Button></span>

      - id: CMP.TOOLTIP.A11Y
        title_zh: 键盘与读屏可达
        statement_zh: 触发元素可聚焦，聚焦时也显示提示；提示内容通过 aria-describedby 关联；移动端没有悬停，关键说明不要只放在提示里。
        enforcement: { kind: review }

      - id: CMP.TOOLTIP.NO_ACTIONS
        title_zh: 提示里不放可点内容
        statement_zh: 提示里不放按钮、链接；需要交互的用气泡卡片（Popover）；延迟出现（约 100ms）避免划过时闪烁。
        enforcement: { kind: review }

  - key: alert
    title_zh: 警告提示
    group: components.feedback
    prefix: CMP.ALERT
    summary_zh: 页面内常驻的提示条：按语义选类型，写清影响与怎么办；可关闭的只放可以忽略的信息。
    playground:
      component: Alert
      text_zh: 车辆数据每天 02:00 同步
      props:
        variant: { options: [default, destructive], default: default }
    rules:
      - id: CMP.ALERT.TYPE
        title_zh: 按语义选类型
        statement_zh: 信息（info）、成功（success）、警告（warning）、错误（error）四类按语义选，不按颜色喜好选；标题一句话说清发生了什么，描述写影响与怎么办。
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 写清影响与怎么办
            jsx: |-
              <Alert className="w-[420px]"><AlertTitle>3 辆车保险将在 7 天内到期</AlertTitle><AlertDescription>到期后车辆不能派单。到「保险管理」续保。</AlertDescription></Alert>

      - id: CMP.ALERT.PLACEMENT
        title_zh: 放在受影响内容的上方
        statement_zh: 与整页有关的提示放页面顶部（页头下方），与某个区块有关的放在该区块上方；同一位置最多一条，多条合并或按严重程度只显示最高的。
        enforcement: { kind: review }

      - id: CMP.ALERT.DISMISS
        title_zh: 只有可忽略的才能关
        statement_zh: 错误和必须处理的警告不可关闭，问题解决后自动消失；可关闭的提示关闭后记住（按用户），不每次刷新都出现。
        enforcement: { kind: review }

  - key: drawer
    title_zh: 侧边抽屉
    group: components.feedback
    prefix: CMP.DRAWER
    summary_zh: 从侧边滑出的面板：用于需要对照页面内容的录入与详情；宽度取档位；有未保存内容时关闭先确认。
    rules:
      - id: CMP.DRAWER.WHEN
        title_zh: 对照页面内容时用抽屉
        statement_zh: 查看或编辑一条记录、同时需要看着列表或页面时用抽屉；录入超过 5 个字段用抽屉而不是对话框；抽屉里不再打开抽屉（最多两层，第二层更窄）。
        enforcement: { kind: review }

      - id: CMP.DRAWER.SIZE
        title_zh: 宽度取档位
        statement_zh: 宽度取两档：普通 384px（w-96）、宽 736px，不随内容随意设宽；窄屏全宽。标题写对象名（「编辑 沪A12345」）。
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 操作在底部
            jsx: |-
              <aside className="flex h-64 w-96 flex-col border-l border-ds-gray-400 bg-ds-background-100 shadow-lg"><header className="border-b border-ds-gray-400 px-5 py-4 text-heading-16">编辑 沪A12345</header><div className="flex-1 p-5"><Label htmlFor="d1">车牌号</Label><Input id="d1" defaultValue="沪A12345" className="mt-1.5" /></div><footer className="flex gap-2 border-t border-ds-gray-400 px-5 py-3"><Button>保存</Button><Button variant="secondary">取消</Button></footer></aside>

      - id: CMP.DRAWER.CLOSE
        title_zh: 未保存先确认
        statement_zh: 有未保存的修改时，点关闭、遮罩或 Esc 先确认是否放弃；保存成功后关闭抽屉并刷新受影响的列表行，不整页刷新。
        enforcement: { kind: review }

  - key: message
    title_zh: 全局提示
    group: components.feedback
    prefix: CMP.MESSAGE
    summary_zh: 操作后的轻量全局反馈：一句话、自动消失、不打断；失败与需要处理的不用它。
    rules:
      - id: CMP.MESSAGE.WHEN
        title_zh: 只给轻量的结果
        statement_zh: 保存、复制、删除成功这类结果用全局提示，一句话说清结果（「已保存」「已复制车牌号」），2–3 秒自动消失；错误需要用户处理时用就地错误或通知，不用一闪而过的提示。
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 结果一句话
            code: |-
              toast.success('已保存')
              toast.success('已复制车牌号')
            lang: ts
          - kind: dont
            title_zh: 错误一闪而过
            code: |-
              toast.error('保存失败')
            lang: ts

      - id: CMP.MESSAGE.ONE
        title_zh: 同一时间一条
        statement_zh: 同类提示合并（连续保存只提示一次），同一时间最多 3 条；页面跳转后上一页的提示不延续。
        enforcement: { kind: review }

      - id: CMP.MESSAGE.WORDING
        title_zh: 措辞用结果
        statement_zh: 写结果而不是过程（「已删除 3 辆车」，不写「操作成功」）；与按钮名对应（按钮「发布」→ 提示「已发布」）。
        enforcement: { kind: review }

  - key: notification
    title_zh: 通知提醒框
    group: components.feedback
    prefix: CMP.NOTIFICATION
    summary_zh: 系统级、需要用户知道但不必立刻处理的消息：右上角、停留更久、可关闭、可带一个动作。
    rules:
      - id: CMP.NOTIFICATION.WHEN
        title_zh: 系统级消息用通知
        statement_zh: 后台任务完成（导出就绪、导入结束）、他人操作影响到当前用户、连接断开与恢复用通知；当前操作的直接结果用全局提示或就地反馈。
        enforcement: { kind: review }

      - id: CMP.NOTIFICATION.CONTENT
        title_zh: 标题、描述、一个动作
        statement_zh: 标题说清是什么，描述说清影响；最多一个动作（「下载」「查看」）；停留 4–5 秒，带动作或错误类的不自动关闭。
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 带动作的通知
            code: |-
              toast('车辆台账已导出', {
                description: '共 1,248 条，文件保留 24 小时。',
                action: { label: '下载', onClick: download },
                duration: Infinity,
              })
            lang: ts

      - id: CMP.NOTIFICATION.STACK
        title_zh: 堆叠有上限
        statement_zh: 同时最多 3 条，更早的折叠；同一任务的进度与结果更新同一条通知，不新弹一条。
        enforcement: { kind: review }

  - key: modal
    title_zh: 对话框
    group: components.feedback
    prefix: CMP.MODAL
    summary_zh: 需要用户先做决定的弹窗：只用于短流程与确认；标题是问题或动作，按钮写动作名；可键盘操作与关闭；长表单改抽屉或新页面。
    rules:
      - id: CMP.MODAL.WHEN
        title_zh: 只用于短流程
        statement_zh: 对话框用于确认、简短的录入（不超过 5 个字段）与需要打断当前流程的决定；字段多、需要对照页面内容的录入用抽屉；更复杂的流程用新页面；不在对话框里再弹对话框。
        enforcement: { kind: review }

      - id: CMP.MODAL.CONTENT
        title_zh: 标题与按钮写动作
        statement_zh: 标题写动作或问题（「删除 3 辆车？」），正文写后果；按钮写具体动作（「删除」「取消」），主按钮在右；危险动作的主按钮用危险样式，默认焦点在取消上。
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 动作化的标题与按钮
            jsx: |-
              <div className="w-96 rounded-xl border border-ds-gray-400 bg-ds-background-100 p-5 shadow-lg" role="dialog" aria-labelledby="dlg-title"><h3 id="dlg-title" className="text-heading-16 text-ds-gray-1000">删除 3 辆车？</h3><p className="mt-2 text-copy-14 text-ds-gray-900">删除后车辆的历史工单仍保留，但不能再派单。</p><div className="mt-5 flex justify-end gap-2"><Button variant="secondary">取消</Button><Button variant="error">删除</Button></div></div>

      - id: CMP.MODAL.KEYBOARD
        title_zh: 键盘与焦点
        statement_zh: 打开时焦点进入对话框、在内部循环；Esc 关闭（有未保存内容时先确认）；关闭后焦点回到触发它的元素；遮罩点击是否关闭与 Esc 一致。
        enforcement: { kind: review }

      - id: CMP.MODAL.ASYNC
        title_zh: 确认中锁定
        statement_zh: 点主按钮后按钮进入加载态并锁定，请求完成再关闭；失败时保持打开并显示错误，不丢失用户输入。
        enforcement: { kind: review }

  - key: popconfirm
    title_zh: 气泡确认
    group: components.feedback
    prefix: CMP.POPCONFIRM
    summary_zh: 就地的轻量确认：只问一句、可撤回的操作才用；不可撤回或影响大的用对话框。
    rules:
      - id: CMP.POPCONFIRM.WHEN
        title_zh: 轻量确认就地问
        statement_zh: 删除一条记录、移除一个成员这类影响小、可恢复的操作用气泡确认；批量、不可撤回、影响他人的操作用对话框写清后果。
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 一句话确认
            jsx: |-
              <div className="flex items-center gap-3"><Button size="small" variant="secondary">移除</Button><div className="rounded-xl border border-ds-gray-400 bg-ds-background-100 p-3 shadow-md"><p className="text-copy-14">移除这名司机？</p><div className="mt-2 flex justify-end gap-2"><Button size="small" variant="secondary">取消</Button><Button size="small" variant="error">移除</Button></div></div></div>

      - id: CMP.POPCONFIRM.WORDING
        title_zh: 问句 + 动作按钮
        statement_zh: 标题是一句问句，确认按钮写动作名（「移除」「删除」），不写「确定」；危险动作的确认按钮用危险样式。
        enforcement: { kind: review }

      - id: CMP.POPCONFIRM.ASYNC
        title_zh: 确认中加载
        statement_zh: 确认后按钮显示加载，请求完成再关闭；失败时提示原因并保持原状态。
        enforcement: { kind: review }

  - key: progress
    title_zh: 进度条
    group: components.feedback
    prefix: CMP.PROGRESS
    summary_zh: 长任务的进度：可估计的显示百分比与剩余量，不可估计的显示阶段；超过 10 秒的任务可离开页面后台进行。
    rules:
      - id: CMP.PROGRESS.DETERMINATE
        title_zh: 能估计就显示百分比
        statement_zh: 能估计进度的任务（导入、导出、上传）显示百分比与已完成数量（「已导入 320 / 1,248 条」）；失败时进度条转为错误态并写原因。
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 百分比与数量
            jsx: |-
              <div className="flex w-80 flex-col gap-1.5"><div className="h-1.5 rounded-full bg-ds-gray-200"><div className="h-1.5 w-[26%] rounded-full bg-ds-gray-1000" /></div><span className="text-copy-13 text-ds-gray-900">已导入 320 / 1,248 条</span></div>

      - id: CMP.PROGRESS.INDETERMINATE
        title_zh: 不能估计就显示阶段
        statement_zh: 无法估计的过程显示当前阶段（「校验中」「写入中」），不用假的百分比；1 秒以内的过程不显示进度（见加载条与延迟出现）。
        enforcement: { kind: review }

      - id: CMP.PROGRESS.BACKGROUND
        title_zh: 长任务转后台
        statement_zh: 超过 10 秒的任务允许离开页面继续，完成后用通知告知；任务可取消时提供取消。
        enforcement: { kind: review }

  - key: spin
    title_zh: 加载中
    group: components.feedback
    prefix: CMP.SPIN
    summary_zh: 局部加载：只盖住正在加载的区域，延迟出现避免闪烁；整页加载用骨架或加载条。
    rules:
      - id: CMP.SPIN.SCOPE
        title_zh: 只盖住正在加载的区域
        statement_zh: 局部刷新时只在该区域显示加载（spinning 包裹区域），保留原内容的占位，不清空；整页首屏用骨架屏，路由切换用顶部加载条。
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 区域加载
            jsx: |-
              <div className="relative w-80"><Card><CardHeader><CardTitle>本月保养</CardTitle></CardHeader><CardContent className="text-copy-14">待保养 12 辆</CardContent></Card><div className="absolute inset-0 grid place-items-center rounded-xl bg-ds-background-100/70 text-label-13 text-ds-gray-900">刷新中…</div></div>

      - id: CMP.SPIN.DELAY
        title_zh: 延迟出现
        statement_zh: 加载指示延迟约 200ms 出现，出现后至少显示约 400ms（LOADING.DELAY），避免快速请求时闪一下。
        enforcement: { kind: review }

      - id: CMP.SPIN.TEXT
        title_zh: 久了要说话
        statement_zh: 超过 2 秒的加载在指示旁写在做什么（「正在汇总 3 个月的数据」）；超过 10 秒提供取消或转后台。
        enforcement: { kind: review }

  # ───────────────────────────── 体验管理 · 界面静帧 ─────────────────────────────
  - key: ui_stills
    title_zh: 界面静帧
    group: patterns.experience
    prefix: STILL
    summary_zh: 文档、功能卡片、空状态与引导里的产品静帧：像真产品、只给故事主角真实文字、裁切有意图、一个焦点、按展示尺寸设计、动画先定封面帧、用规范组件与图标。
    rules:
      - id: STILL.WHEN
        title_zh: 什么时候用静帧
        statement_zh: 要在文档配图、功能介绍卡片、空状态或新手引导里说明「产品长什么样、这里会发生什么」时，用规范组件搭一张产品静帧，不贴真实截图：截图很快过期、带着真实数据、换主题就不对。一张静帧只讲一件事。
        rationale_zh: 静帧和产品同源（同一套组件与 token），改版时跟着变；截图是一次性的。
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 组件搭出来的功能卡片
            jsx: |-
              <div className="relative h-[210px] w-[360px] overflow-hidden rounded-xl bg-ds-background-200">
                <div className="absolute left-6 top-6 w-[420px] rounded-xl border border-ds-gray-400 bg-ds-background-100 shadow-sm">
                  <div className="flex items-center gap-2 border-b border-ds-gray-400 px-4 py-3">
                    <span className="text-label-14 text-ds-gray-1000">部署</span>
                    <span className="h-2 w-16 rounded-full bg-ds-gray-200" />
                  </div>
                  <div className="border-b border-ds-gray-400 px-4 py-3"><span className="block h-2 w-[60%] rounded-full bg-ds-gray-200" /></div>
                  <div className="flex items-center gap-3 border-b border-ds-gray-400 bg-ds-gray-100 px-4 py-3">
                    <span className="text-label-14 text-ds-gray-1000">pomaster-web</span>
                    <span className="text-label-13 tabular-nums text-ds-gray-900">2 分钟前</span>
                    <Badge variant="outline">Ready</Badge>
                  </div>
                  <div className="px-4 py-3"><span className="block h-2 w-[45%] rounded-full bg-ds-gray-200" /></div>
                </div>
              </div>
          - kind: dont
            title_zh: 贴一张产品截图
            code: |-
              <img src="/screenshots/dashboard-2026-05.png" alt="仪表盘">
            lang: html

      - id: STILL.RESTRAINT
        title_zh: 只给故事主角真实文字
        statement_zh: 一张静帧里真实的字通常只有 3 到 7 处：标题、被操作的对象、输入的内容和结果；其余位置用占位条，占位条的宽度逐行变化。不要每行都塞真实文本和数字——细节越多越像拼凑的假图；视线落点上不放占位条。
        params:
          real_strings: { value: 3–7, source: SRC.STAGESHOW, label_zh: 真实文字处数 }
        enforcement: { kind: review }

      - id: STILL.FRAMING
        title_zh: 裁切与出血
        statement_zh: 裁到故事发生的那块区域，窗口从画面的一边或两边出血；窗口保持原本的比例，不压扁、不整体缩小塞进卡片再四周留等宽空白；页面本身已有底色时不再垫一块底板；画面里不留空着的角落。
        enforcement: { kind: review }

      - id: STILL.FOCAL
        title_zh: 一个焦点
        statement_zh: 每张静帧只有一个主角，最重的视觉（实色、字重、阴影）落在它身上；辅助对象（一张回执、一个小卡片）至多一个，压在主体边缘；不用描边光晕去「指」主角，用产品自己的选中态。
        enforcement: { kind: review }

      - id: STILL.SCALE
        title_zh: 按展示尺寸设计
        statement_zh: 按最终显示尺寸 1:1 设计：功能卡片约 400×300，侧栏插图更小；手机宽度的版本重新排布，只留动作和可读的字，不是整体缩小——缩小后的小字没人看得清。
        params:
          card: { value: 400×300, source: SRC.STAGESHOW, label_zh: 功能卡片尺寸 }
        enforcement: { kind: review }

      - id: STILL.POSTER
        title_zh: 动画先定封面帧
        statement_zh: 静帧做成小动画时，先定封面帧：缩略图、截图和减少动效模式都只看到这一帧，它要能单独讲完故事——结果留在画面上，不是变化途中的一帧；动画只演一件事，回到开头时要有看得见的原因（撤销、关闭）或在被遮住时复位。
        enforcement: { kind: review }

      - id: STILL.REAL_PARTS
        title_zh: 用规范组件与图标
        statement_zh: 静帧里的按钮、徽标、头像、输入框都用 src/components/ui 的组件，不手画；图标只用 lucide-react，同一尺寸、同一描边；不发明 logo（色块里放一个字母不是 logo）；AI 功能不用闪光、魔杖和紫色当装饰，直接展示它做了什么。
        enforcement: { kind: review }

  # ───────────────────────────── 体验管理 · 组件动效 ─────────────────────────────
  - key: component_motion
    title_zh: 组件动效
    group: patterns.experience
    prefix: CMOTION
    summary_zh: 动效只说明变化：每个动作有原因；出现和离开都有过渡；动关系而不只动对象；数字与文字就地变化；成组只在首次出现时错峰；可以打断；只动 transform 与透明度；减少动效时状态变化仍看得见。
    rules:
      - id: CMOTION.CAUSE
        title_zh: 每个动作有原因
        statement_zh: 动效由用户操作或数据变化触发，用来说明「刚才发生了什么」；不做自动循环的吸睛动画（呼吸灯、无限脉冲）；同一屏同一时刻只有一处在动。界面反馈和真实产品一样快，只有讲故事的演示动画才放慢。
        enforcement: { kind: review }
        examples:
          - kind: dont
            title_zh: 无限脉冲吸引注意
            code: |-
              .badge-new { animation: pulse 1.2s infinite; }
            lang: css

      - id: CMOTION.ENTER_EXIT
        title_zh: 出现与离开
        statement_zh: 会出现又消失的元素保持挂载，用状态切换显隐，让离开也有过渡；离开比出现快；面板打开时带着内容一起出现，不先出一块空白再填内容；不要「啪」地插入或消失。
        params:
          enter: { value: 200ms, source: SRC.POMASTER.PRESET, label_zh: 出现 }
          exit: { value: 150ms, source: SRC.TAILWIND.TRANSITIONS, label_zh: 离开 }
          ease: { value: "cubic-bezier(0.4, 0, 0.2, 1)", source: SRC.TAILWIND.TRANSITIONS, label_zh: 缓动 }
        enforcement: { kind: review }
        showcase:
          - kind: demo
            title_zh: 展开与收起：同一个按钮、内容一起出现
            description_zh: 点按钮：面板高度与透明度一起过渡，收起比展开快；按钮文字在同一个按钮上变化。
            jsx: |-
              <div className="w-[340px]">
                <Button size="small" variant="secondary" onClick={() => set({ open: !s.open })}>{s.open ? "收起筛选" : "展开筛选"}</Button>
                <div className="grid transition-[grid-template-rows,opacity]" style={{ gridTemplateRows: s.open ? "1fr" : "0fr", opacity: s.open ? 1 : 0, transitionDuration: s.open ? p.enter : p.exit, transitionTimingFunction: p.ease }}>
                  <div className="overflow-hidden">
                    <div className="flex gap-2 pt-3"><Input placeholder="项目名称" /><Input placeholder="分支" /></div>
                  </div>
                </div>
              </div>

      - id: CMOTION.RELATIONSHIP
        title_zh: 动关系而不只动对象
        statement_zh: 新增一行时，下面的行一起让位（新行的高度从 0 展开），不是新行凭空出现、其余行跳位；删除时先收起占位再移除；尺寸变化的容器不拉伸里面的文字（用网格行或高度过渡，不用 scale）；列表重排用位置过渡。
        params:
          duration: { value: 200ms, source: SRC.POMASTER.PRESET, label_zh: 让位时长 }
          ease: { value: "cubic-bezier(0.4, 0, 0.2, 1)", source: SRC.TAILWIND.TRANSITIONS, label_zh: 缓动 }
        enforcement: { kind: review }
        showcase:
          - kind: demo
            title_zh: 新增一行：其余行一起让位
            jsx: |-
              <div className="w-80">
                <Button size="small" onClick={() => set({ added: !s.added })}>{s.added ? "撤销新增" : "新增项目"}</Button>
                <div className="mt-3 overflow-hidden rounded-xl border border-ds-gray-400">
                  <div className="grid transition-[grid-template-rows]" style={{ gridTemplateRows: s.added ? "1fr" : "0fr", transitionDuration: p.duration, transitionTimingFunction: p.ease }}>
                    <div className="overflow-hidden"><div className="border-b border-ds-gray-400 bg-ds-gray-100 px-4 py-3 text-label-14">docs-site（新）</div></div>
                  </div>
                  {["pomaster-web", "pomaster-api", "studio"].map((name) => (
                    <div key={name} className="border-b border-ds-gray-400 px-4 py-3 text-label-14 last:border-b-0">{name}</div>
                  ))}
                </div>
              </div>

      - id: CMOTION.VALUE_CHANGE
        title_zh: 数字与文字就地变化
        statement_zh: 数值变化用数字滚动：只滚变化的位，货币符号与千分位不动，用等宽数字，最终值停住；状态词变化（排队中→运行中→已通过）在同一位置滚动或淡入淡出，并按最长的词预留宽度，邻居不跳；按钮文字变化发生在同一个按钮上，不换成另一个按钮。
        enforcement: { kind: review }
        showcase:
          - kind: demo
            title_zh: 数字滚动
            description_zh: 点按钮：金额只滚动变化的数位（NumberTicker，收录自 affectUI，MIT）。
            jsx: |-
              <div className="flex items-center gap-4">
                <NumberTicker value={s.total || 48240} format={{ style: "currency", currency: "CNY", maximumFractionDigits: 0 }} locale="zh-CN" className="text-heading-24" />
                <Button size="small" variant="secondary" onClick={() => set({ total: (s.total || 48240) + 1280 })}>记一笔 ¥1,280</Button>
              </div>

      - id: CMOTION.STAGGER
        title_zh: 成组错峰只在首次出现
        statement_zh: 只有一组元素首次一起出现时才错峰：按阅读顺序、间隔小、总时长有上限；刷新数据、翻页、筛选时整组一次出现，不逐行飞入；栅格卡片首次进入视口时可以错峰一次。
        params:
          interval: { value: 60, unit: ms, source: SRC.STAGESHOW, label_zh: 错峰间隔, note_zh: 同一组 40–80ms 取中；栅格的格与格之间可放宽到 80–120ms }
          total: { value: 400, unit: ms, source: SRC.POMASTER.DEFAULTS, label_zh: 总时长上限, note_zh: 一组错峰总长不超过 400ms，再长就像在等动画 }
        enforcement: { kind: review }
        examples:
          - kind: dont
            title_zh: 每次刷新逐行飞入
            code: |-
              .row { animation: fly-in .4s both; animation-delay: calc(var(--i) * 80ms); }
            lang: css

      - id: CMOTION.INTERRUPT
        title_zh: 可以打断
        statement_zh: 动画进行中用户再次操作，从当前状态反向或继续，不排队等上一段放完；动画期间控件保持可用；状态切换用 CSS transition（天然可打断），不用固定时长的关键帧动画表达状态。
        enforcement: { kind: review }

      - id: CMOTION.PERF
        title_zh: 只动 transform 与透明度
        statement_zh: 过渡只作用于 transform 和 opacity，高度展开用 grid-template-rows 过渡；不过渡 width、height、top、left、margin 这类触发重排的属性；will-change 只在动画期间加在动的那个元素上，不全局铺。
        enforcement: { kind: gate, check: motion.transform-only }
        examples:
          - kind: do
            title_zh: 位移与透明度
            code: |-
              .panel { transition: transform .2s, opacity .2s; }
            lang: css
          - kind: dont
            title_zh: 过渡布局属性
            code: |-
              .panel { transition: height .3s, top .3s; }
            lang: css

      - id: CMOTION.REDUCED
        title_zh: 减少动效时保留状态变化
        statement_zh: 减少动效模式下状态变化仍要看得见：淡入淡出或直接切换，去掉位移、缩放、视差和自动播放；数字滚动直接显示最终值；每段关键帧动画都写 prefers-reduced-motion 分支（全局降级见 MOTION.REDUCED）。
        anchors:
          - { spec: ui, quote: 尊重 prefers-reduced-motion：动画、滚动、过渡在减少动效模式下关闭或降级 }
        enforcement: { kind: gate, check: motion.reduced-motion }
        examples:
          - kind: do
            title_zh: 关键帧动画的降级分支
            code: |-
              @media (prefers-reduced-motion: reduce) {
                .ticker-col { animation: none; }
                .ticker-stack { transition: none; }
              }
            lang: css

  # ───────────────────────────── 体验管理 · Bento 栅格 ─────────────────────────────
  - key: bento_grid
    title_zh: Bento 栅格
    group: patterns.experience
    prefix: BENTO
    summary_zh: 一组格子拼成一张图：一个主角格；格子不全是界面截图，邻格类型交替；同一套外框；跨度取栅格整数；数字格一行写完；窄屏重新排；可点的格整格可点。
    rules:
      - id: BENTO.WHEN
        title_zh: 什么时候用
        statement_zh: 功能概览、首页看板入口、发布说明和特性墙用 Bento；表单、明细列表、需要逐项对比的数据不用 Bento，用表格、描述列表或卡片列表。
        enforcement: { kind: review }

      - id: BENTO.HERO
        title_zh: 一个主角格
        statement_zh: 一格最大（跨两列或两行），放最主要的信息或画面，其余格支撑它；格子大小相同时，内容和分量要有明显差别，不排成五块一样重的卡片。
        enforcement: { kind: review }
        showcase:
          - kind: demo
            title_zh: 主角格 + 数字格 + 组件格 + 一句话
            description_zh: 主角格跨两列并整格可点；数字格一行写完；组件格只截一个控件；一句话格用正文大字。
            jsx: |-
              <div className="grid w-[600px] grid-cols-3 gap-4">
                <a href="#" className="col-span-2 flex flex-col gap-3 rounded-xl border border-ds-gray-400 bg-ds-background-100 p-6 text-ds-gray-1000 no-underline outline-none transition-[border-color] duration-150 hover:border-ds-gray-500 focus-visible:ring-2 focus-visible:ring-ds-blue-700">
                  <span className="text-label-16 font-semibold">部署总览</span>
                  <div className="flex h-[72px] items-end gap-2">
                    {[32, 48, 40, 64, 56, 72].map((h) => <span key={h} className={h === 72 ? "flex-1 rounded-sm bg-ds-gray-1000" : "flex-1 rounded-sm bg-ds-gray-400"} style={{ height: h }} />)}
                  </div>
                </a>
                <div className="flex flex-col justify-center gap-1 rounded-xl bg-ds-background-200 p-6">
                  <span className="whitespace-nowrap text-heading-32 tabular-nums">99.99%</span>
                  <span className="text-label-13 text-ds-gray-900">过去 90 天可用率</span>
                </div>
                <div className="flex flex-col gap-3 rounded-xl border border-ds-gray-400 bg-ds-background-100 p-6">
                  <span className="text-label-14 font-medium">自动回滚</span>
                  <Switch defaultChecked aria-label="自动回滚" />
                </div>
                <div className="col-span-2 flex items-center rounded-xl bg-ds-background-200 p-6 text-copy-16">
                  <span><b>每次推送都有预览。</b><span className="text-ds-gray-900">评审人打开链接就能看到改动。</span></span>
                </div>
              </div>

      - id: BENTO.KINDS
        title_zh: 邻格类型交替
        statement_zh: 界面格（只截一个组件或一小块界面，不放整个窗口）约占三分之一到一半，其余是大数字、一句话、对象、示意图或一组标志；相邻的格类型不同；窗口外框在一组栅格里至多出现一次；同一段真实文字不在两格里重复。
        params:
          ui_share: { value: 1/3–1/2, source: SRC.STAGESHOW, label_zh: 界面格占比 }
        enforcement: { kind: review }

      - id: BENTO.FRAME
        title_zh: 同一套外框
        statement_zh: 所有格的圆角、格间距、内边距、文案位置一致（文案都在上或都在下）；格间距等于格内边距或其整数分之一；一组栅格只选一种家族：带间距的圆角格，或无间距、用细分割线分格。
        params:
          gap: { value: 16, unit: px, source: SRC.TAILWIND.SPACING, label_zh: 格间距（gap-4） }
          radius: { value: 12, unit: px, source: SRC.GEIST.MATERIALS, label_zh: 格圆角（rounded-xl） }
        enforcement: { kind: review }

      - id: BENTO.SPANS
        title_zh: 跨度取栅格整数
        statement_zh: 用 CSS grid 分格，列数取 12 列栅格的约数（常用 3 列，即每格 4/12），格子跨度是整数列（col-span-2）；行高用统一基准；不给格子手写像素宽度。
        enforcement: { kind: review }
        examples:
          - kind: dont
            title_zh: 手写像素宽度拼格子
            code: |-
              <div style={{ width: 412, float: "left" }}>…</div>
            lang: tsx

      - id: BENTO.STAT
        title_zh: 数字格一行写完
        statement_zh: "数字格是一个大数字加一句短标签，数字和单位不换行（white-space: nowrap）；用真实数字，不用「10x」「无限」这类填充；数字紧跟标签或撑满格子，不要钉在高格底部、上面留一大片空。"
        enforcement: { kind: review }

      - id: BENTO.RESPONSIVE
        title_zh: 窄屏重新排
        statement_zh: 每格都读得清时才保留两列；手机宽度变单列，主角格在最前；按内容决定断点，不整体等比缩小；窄格里的界面画面重新取景，而不是缩小。
        enforcement: { kind: review }

      - id: BENTO.CLICK
        title_zh: 可点的格整格可点
        statement_zh: 一格对应一个去处时整格就是一个链接（a 或 button 包住整格），焦点环画在格上；格内不再放第二个去同一处的按钮；悬停反馈按卡片悬停的规则。
        enforcement: { kind: review }

  # ───────────────────────────── 体验管理 · 状态反馈 ─────────────────────────────
  - key: state_feedback
    title_zh: 状态反馈
    group: patterns.experience
    prefix: SFB
    summary_zh: 每个数据视图都有完整的状态；反馈出现在动作发生的地方；确认的力度跟操作的分量走；乐观更新只用于可回滚的小操作；能撤销就不弹确认；长操作给进度；读屏能感知状态变化。
    rules:
      - id: SFB.STATES
        title_zh: 每个视图都有完整状态
        statement_zh: 每个数据视图都设计并实现这些状态：加载中、空、出错、部分成功、正常，以及无权限和禁用；每种状态在 Storybook 里都能单独看到。空状态给下一步动作，出错给原因和恢复入口。
        anchors:
          - { spec: page, quote: State Matrix：默认、加载、空、错误、权限、禁用、长文本和小屏等状态。 }
          - { spec: ui, quote: hover、active、focus、disabled、loading、empty、error 状态完整。 }
        enforcement: { kind: review }
        showcase:
          - kind: demo
            title_zh: 同一个视图的五种状态
            description_zh: 切换看每种状态：骨架保持内容的几何；空状态给动作；出错保留筛选并给重试；部分成功说清成功几条、失败的怎么办。
            jsx: |-
              <div className="w-[440px]">
                <div className="flex gap-1" role="group" aria-label="状态">
                  {["加载中", "空", "出错", "部分成功", "正常"].map((name) => (
                    <Button key={name} size="small" variant={(s.view || "加载中") === name ? "default" : "tertiary"} onClick={() => set({ view: name })}>{name}</Button>
                  ))}
                </div>
                <div className="mt-3 min-h-[200px]">
                  {(s.view || "加载中") === "加载中" && (
                    <div className="flex flex-col gap-2"><Skeleton className="h-5 w-1/2" /><Skeleton className="h-4 w-full" /><Skeleton className="h-4 w-4/5" /></div>
                  )}
                  {s.view === "空" && (
                    <div className="flex flex-col items-center gap-3 rounded-xl border border-dashed border-ds-gray-400 p-8 text-center">
                      <span className="text-label-14">还没有部署</span>
                      <span className="text-copy-13 text-ds-gray-900">推送到 main 分支后会自动部署。</span>
                      <Button size="small">导入项目</Button>
                    </div>
                  )}
                  {s.view === "出错" && (
                    <Alert variant="destructive"><AlertTitle>部署列表没有加载出来</AlertTitle><AlertDescription>网络中断，筛选条件已保留。<Button size="small" variant="secondary" className="mt-2">重试</Button></AlertDescription></Alert>
                  )}
                  {s.view === "部分成功" && (
                    <Alert><AlertTitle>120 个环境变量，导入了 117 个</AlertTitle><AlertDescription>3 个变量名重复，修改后可以只重新导入这 3 个。</AlertDescription></Alert>
                  )}
                  {s.view === "正常" && (
                    <div className="flex flex-col rounded-xl border border-ds-gray-400">
                      {["pomaster-web · Ready", "pomaster-api · Ready", "studio · Building"].map((item) => <div key={item} className="border-b border-ds-gray-400 px-4 py-3 text-label-14 last:border-b-0">{item}</div>)}
                    </div>
                  )}
                </div>
              </div>

      - id: SFB.IN_PLACE
        title_zh: 反馈出现在动作发生的地方
        statement_zh: 按钮自己进入加载并在原位给出结果；字段错误挂在字段上；行内操作的结果出现在那一行；不把所有结果都弹到页面顶部，也不用一个轻提示处理所有错误。
        anchors:
          - { spec: api, quote: MUST NOT 用一个 Toast 处理所有错误。 }
        enforcement: { kind: review }

      - id: SFB.WEIGHT
        title_zh: 确认的力度跟操作的分量走
        statement_zh: 轻操作（收藏、切换显示）就地变化，不弹提示；普通保存用 Toast 轻提示；会影响他人或不可逆的操作用结果页或带操作的 Toast；失败比成功更显眼，并且停留到用户处理。
        enforcement: { kind: review }

      - id: SFB.OPTIMISTIC
        title_zh: 乐观更新只用于可回滚的小操作
        statement_zh: 点赞、标星、拖动排序这类成功率高、可回滚、影响范围小的操作可以先改界面再发请求，失败时回滚并就地说明；金额、库存、审批、权限这类以服务端结果为准，等返回再更新。
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: useMutation 的 onMutate / onError 回滚
            code: |-
              useMutation({
                mutationFn: (starred: boolean) => api.star(id, starred),
                onMutate: async (starred) => { const prev = queryClient.getQueryData(key); queryClient.setQueryData(key, (old) => ({ ...old, starred })); return { prev } },
                onError: (_e, _v, ctx) => queryClient.setQueryData(key, ctx?.prev),
                onSettled: () => queryClient.invalidateQueries({ queryKey: key }),
              })
            lang: tsx

      - id: SFB.UNDO
        title_zh: 能撤销就不弹确认
        statement_zh: 可以撤销的删除、归档用「已删除 · 撤销」的提示代替二次确认；真正不可逆的操作才要确认，确认框说清后果（删掉什么、影响谁）。
        anchors:
          - { spec: page, quote: 删除、提交、转账等高风险动作必须提供复核、确认、撤销或等效防错 }
        enforcement: { kind: review }

      - id: SFB.PROGRESS
        title_zh: 长操作给进度
        statement_zh: 超过 1 秒的操作给加载反馈；预计超过 10 秒的给确定进度（百分比或步骤）和预计剩余时间，并允许离开当前页面：转为后台任务，完成后通知并能回到结果。
        params:
          busy: { value: 1000, unit: ms, source: SRC.NNG.RESPONSE_TIMES, label_zh: 需要加载反馈 }
          determinate: { value: 10000, unit: ms, source: SRC.NNG.RESPONSE_TIMES, label_zh: 需要确定进度 }
        anchors:
          - { spec: perf, quote: 长任务异步执行并可恢复。 }
        enforcement: { kind: review }

      - id: SFB.LIVE
        title_zh: 读屏能感知状态变化
        statement_zh: 异步结果和进度变化写进 aria-live 区（一般用 polite，阻断性错误用 assertive），不抢焦点；颜色不是唯一的信号，状态都有文字。
        anchors:
          - { spec: ui, quote: 动态状态、异步结果、进度变化必须可在不抢夺焦点的前提下被辅助技术识别 }
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 状态写进 live 区
            code: |-
              <div aria-live="polite" className="sr-only">{statusText}</div>
            lang: tsx

  # ───────────────────────────── 体验管理 · 上下文管理 ─────────────────────────────
  - key: context
    title_zh: 上下文管理
    group: patterns.experience
    prefix: CTX
    summary_zh: 保住用户的位置（分页、筛选、滚动、选中）；未保存的内容有去处；就地操作与工具栏一致；当前位置始终可见；切换团队或身份时显式清理；代码里的上下文只放稳定的跨层依赖。
    rules:
      - id: CTX.PRESERVE
        title_zh: 保住用户的位置
        statement_zh: 从列表进详情再返回，恢复原来的页码、筛选、排序、滚动位置和选中行（筛选与页码在 URL 里，滚动位置用路由的滚动恢复）；能在当前页完成的查看用侧边抽屉，不离开列表。
        anchors:
          - { spec: page, quote: 返回恢复分页、筛选、排序和必要视图状态。 }
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 路由层恢复滚动位置
            code: |-
              <ScrollRestoration getKey={(location) => location.pathname} />
            lang: tsx
        showcase:
          - kind: lab
            lab: context.restore
            title_zh: 实验：返回列表时恢复位置
            description_zh: 翻到第 3 页、选中一行、打开详情再返回：正确做法回到原来的页和那一行；错误做法回到第 1 页。

      - id: CTX.DRAFTS
        title_zh: 未保存的内容有去处
        statement_zh: 表单有改动时离开要提示（页内跳转和关闭页签都拦）；长表单自动保存草稿，草稿按用户隔离、带版本与过期时间，提交成功后清掉；失败的提交保留用户的输入。
        anchors:
          - { spec: page, quote: dirty 离开、草稿隔离和版本冲突有策略。 }
          - { spec: page, quote: 提交防重复并保留失败输入。 }
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 离开前拦截
            code: |-
              const blocker = useBlocker(form.formState.isDirty)
            lang: tsx

      - id: CTX.INLINE_ACTIONS
        title_zh: 就地操作与工具栏一致
        statement_zh: 行上的「更多」菜单、右键菜单里的操作与工具栏、详情页同名同图标；右键菜单只是快捷方式，不是唯一入口；批量操作出现在选中后的批量栏里，并显示选中了几条。
        enforcement: { kind: review }

      - id: CTX.WAYFINDING
        title_zh: 当前位置始终可见
        statement_zh: 页面标题、导航高亮、面包屑三者一致并与路由同源；每个可分享的视图有深链接，打开深链接得到同样的视图（含筛选与标签页）。
        anchors:
          - { spec: page, quote: 每个页面路由有稳定 name、path、page key、title、权限和布局 meta。 }
        enforcement: { kind: review }

      - id: CTX.SCOPE_SWITCH
        title_zh: 切换团队或身份时显式清理
        statement_zh: 团队、租户、环境的切换入口全局可见，当前作用域显示在顶部；切换后清掉旧作用域的查询缓存、草稿和订阅，回到新作用域下安全的页面，不把旧数据带到新作用域。
        anchors:
          - { spec: state, quote: 用户、角色、组织和数据范围切换时清理风险缓存。 }
        enforcement: { kind: review }

      - id: CTX.PROVIDER
        title_zh: 代码里的上下文只放稳定的跨层依赖
        statement_zh: React Context 只放跨多层、变化少的依赖（主题、当前团队、权限判断函数）；按关注点拆成多个 Context；Provider 的 value 用 useMemo 固定引用，避免整棵树重渲染；频繁变化的数据走 Zustand 选择器或查询缓存。
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 固定 value 引用
            code: |-
              const value = useMemo(() => ({ team, can }), [team, can])
              return <TeamContext.Provider value={value}>{children}</TeamContext.Provider>
            lang: tsx
          - kind: dont
            title_zh: 每次渲染新建 value
            code: |-
              <TeamContext.Provider value={{ team, can, filters, setFilters }}>
            lang: tsx

  # ───────────────────────────── 体验管理 · 侧边栏管理 ─────────────────────────────
  - key: sidebar
    title_zh: 侧边栏管理
    group: patterns.experience
    prefix: SIDEBAR
    summary_zh: 宽度取规范值；收起后只留图标并有名字；收起状态按用户记住；窄屏变抽屉；当前项与路由同源；最多两级；分组按使用频率；自己滚动、底部固定；键盘可操作。
    rules:
      - id: SIDEBAR.WIDTH
        title_zh: 宽度取规范值
        statement_zh: 侧边栏展开宽度 16rem、手机上的抽屉宽度 18rem（shadcn/ui Sidebar 的缺省值）；收起成图标栏的宽度由项目定；不按页面各自调宽度。
        params:
          width: { value: 16rem, source: SRC.SHADCN.SIDEBAR, label_zh: 展开宽度 }
          mobile_width: { value: 18rem, source: SRC.SHADCN.SIDEBAR, label_zh: 手机抽屉宽度 }
          collapsed_width: { value: 3rem, unit: none, source: SRC.SHADCN.SIDEBAR, label_zh: 收起宽度, note_zh: shadcn/ui 的 SIDEBAR_WIDTH_ICON }
        enforcement: { kind: review }
        showcase:
          - kind: demo
            title_zh: 收起与展开
            description_zh: 点按钮收起：只留图标，每项有名字；当前项保持高亮。
            jsx: |-
              <div className="flex h-[260px] w-[520px] overflow-hidden rounded-xl border border-ds-gray-400">
                <nav aria-label="主导航" className="flex shrink-0 flex-col gap-1 border-r border-ds-gray-400 bg-ds-background-200 p-2 transition-[width] duration-200" style={{ width: s.collapsed ? "3rem" : p.width }}>
                  <a href="#" title={s.collapsed ? "总览" : undefined} className="flex h-8 items-center gap-2 overflow-hidden whitespace-nowrap rounded-md px-2 text-label-14 text-ds-gray-900 no-underline hover:bg-ds-gray-100"><LayoutDashboardIcon className="size-4 shrink-0" />{!s.collapsed && "总览"}</a>
                  <a href="#" title={s.collapsed ? "部署" : undefined} aria-current="page" className="flex h-8 items-center gap-2 overflow-hidden whitespace-nowrap rounded-md bg-ds-gray-200 px-2 text-label-14 text-ds-gray-1000 no-underline"><RocketIcon className="size-4 shrink-0" />{!s.collapsed && "部署"}</a>
                  <a href="#" title={s.collapsed ? "设置" : undefined} className="flex h-8 items-center gap-2 overflow-hidden whitespace-nowrap rounded-md px-2 text-label-14 text-ds-gray-900 no-underline hover:bg-ds-gray-100"><SettingsIcon className="size-4 shrink-0" />{!s.collapsed && "设置"}</a>
                </nav>
                <div className="flex-1 bg-ds-background-100 p-4">
                  <Button size="small" variant="tertiary" svgOnly aria-label={s.collapsed ? "展开侧边栏" : "收起侧边栏"} onClick={() => set({ collapsed: !s.collapsed })}>
                    {s.collapsed ? <PanelLeftOpenIcon /> : <PanelLeftCloseIcon />}
                  </Button>
                </div>
              </div>

      - id: SIDEBAR.COLLAPSE
        title_zh: 收起与展开
        statement_zh: 收起后只留图标，每项有 title 或 tooltip 显示名字；收起状态按用户记住（shadcn/ui Sidebar 用 sidebar_state Cookie，项目可换成偏好存储）；手机宽度下变成抽屉，点遮罩或按 Esc 关闭。
        params:
          persist: { value: sidebar_state, source: SRC.SHADCN.SIDEBAR, label_zh: 记住收起状态的 Cookie }
        enforcement: { kind: review }

      - id: SIDEBAR.ACTIVE
        title_zh: 当前项与路由同源
        statement_zh: 高亮哪一项由当前路由决定，不另存一份「选中项」状态；刷新后保持；子页面高亮它所属的一级项，父级自动展开。
        anchors:
          - { spec: permission, quote: 菜单、路由、按钮、字段和接口使用同一权限语义。 }
        enforcement: { kind: review }

      - id: SIDEBAR.DEPTH
        title_zh: 最多两级
        statement_zh: 侧边栏最多两级；第三级用页内的标签页或二级导航，不在侧边栏里继续嵌套；只有一个子项的分组不展开，直接放这一项。
        enforcement: { kind: review }

      - id: SIDEBAR.GROUPS
        title_zh: 分组按使用频率
        statement_zh: 菜单按任务分组、按使用频率排序，最常用的在上；分组标题不可点、不当链接；无权限的菜单项不显示（不显示禁用的菜单项让人猜）。
        enforcement: { kind: review }

      - id: SIDEBAR.SCROLL
        title_zh: 自己滚动、底部固定
        statement_zh: 侧边栏独立滚动，不跟着内容区滚；账户、设置、帮助固定在底部；当前项在可视区外时自动滚到可见。
        enforcement: { kind: review }

      - id: SIDEBAR.KEYBOARD
        title_zh: 键盘可操作
        statement_zh: 收起/展开用 Cmd/Ctrl + B（shadcn/ui Sidebar 的缺省快捷键），按钮提示里写出；菜单可以用 Tab 进入、方向键移动；收起展开后焦点留在切换按钮上。
        params:
          shortcut: { value: Mod+B, source: SRC.SHADCN.SIDEBAR, label_zh: 收起快捷键 }
        enforcement: { kind: review }

  # ───────────────────────────── 体验管理 · 卡片悬停 ─────────────────────────────
  - key: card_hover
    title_zh: 卡片悬停
    group: patterns.experience
    prefix: HOVER
    summary_zh: 悬停只表示可点；幅度克制（边框或阴影升一级，不缩放）；不引起布局移动；键盘焦点的反馈不弱于悬停；触屏不依赖悬停；悬停才出现的操作不挤开内容；时长取 token。
    rules:
      - id: HOVER.SIGNAL
        title_zh: 悬停只表示可点
        statement_zh: 只有可点的卡片做悬停效果；不可点的卡片悬停没有任何变化，避免让人以为能点。
        enforcement: { kind: review }
        showcase:
          - kind: demo
            title_zh: 可点与不可点
            description_zh: 把指针移到两张卡片上对比；用 Tab 键聚焦可点的那张。
            jsx: |-
              <div className="flex gap-4">
                <a href="#" className="block w-[200px] rounded-xl border border-ds-gray-400 bg-ds-background-100 p-4 text-ds-gray-1000 no-underline outline-none transition-[border-color,box-shadow] duration-150 hover:border-ds-gray-500 hover:shadow-sm focus-visible:ring-2 focus-visible:ring-ds-blue-700">
                  <div className="text-label-14 font-medium">pomaster-web</div>
                  <div className="text-copy-13 text-ds-gray-900">可点：边框加深、阴影升一级</div>
                </a>
                <div className="w-[200px] rounded-xl border border-ds-gray-400 bg-ds-background-100 p-4">
                  <div className="text-label-14 font-medium">构建说明</div>
                  <div className="text-copy-13 text-ds-gray-900">不可点：没有悬停效果</div>
                </div>
              </div>

      - id: HOVER.SUBTLE
        title_zh: 幅度克制
        statement_zh: 悬停时边框加深一档（gray-400 → gray-500）或阴影升一级；位移不超过 1px，不缩放卡片、不放大内容。
        enforcement: { kind: review }

      - id: HOVER.NO_SHIFT
        title_zh: 不引起布局移动
        statement_zh: 悬停不改卡片尺寸、不改边框宽度、不显示会挤开内容的元素；需要强调时用阴影、outline 或改变边框颜色，宽度不变。
        enforcement: { kind: review }
        examples:
          - kind: dont
            title_zh: 悬停加粗边框，整排卡片抖动
            code: |-
              .card:hover { border-width: 2px; }
            lang: css
          - kind: do
            title_zh: 只换颜色或加阴影
            code: |-
              .card:hover { border-color: var(--border-strong); box-shadow: var(--shadow-1); }
            lang: css

      - id: HOVER.FOCUS_PARITY
        title_zh: 焦点反馈不弱于悬停
        statement_zh: 可点的卡片能用键盘聚焦（链接或按钮包住整卡，或 tabindex=0 并响应 Enter/空格）；:focus-visible 的反馈不弱于悬停，并且不被遮挡。
        anchors:
          - { spec: ui, quote: MUST NOT 移除焦点轮廓而无同等级可见替代。 }
        enforcement: { kind: review }

      - id: HOVER.TOUCH
        title_zh: 触屏不依赖悬停
        statement_zh: "悬停才显示的操作，在不支持悬停的设备上常显或放进「更多」菜单（用 @media (hover: hover) 区分）；关键信息不只放在悬停提示里。"
        anchors:
          - { spec: ui, quote: MUST NOT 仅通过颜色、hover 或 tooltip 传递关键信息。 }
        enforcement: { kind: review }

      - id: HOVER.REVEAL
        title_zh: 悬停出现的操作不挤开内容
        statement_zh: 行或卡片上悬停才出现的操作占位预留（透明度从 0 到 1，不从无到有插入），键盘聚焦到行内时同样出现；离开后收起。
        enforcement: { kind: review }
        showcase:
          - kind: demo
            title_zh: 悬停与聚焦都显示行操作
            description_zh: 指针移到行上或用 Tab 聚焦到行内按钮，操作出现；在触屏设备上常显。
            jsx: |-
              <div className="w-[360px] rounded-xl border border-ds-gray-400">
                {["pomaster-web", "pomaster-api"].map((name) => (
                  <div key={name} className="group flex items-center justify-between border-b border-ds-gray-400 px-4 py-2 last:border-b-0">
                    <span className="text-label-14">{name}</span>
                    <span className="flex gap-1 opacity-100 transition-opacity duration-150 [@media(hover:hover)]:opacity-0 [@media(hover:hover)]:group-hover:opacity-100 [@media(hover:hover)]:group-focus-within:opacity-100">
                      <Button size="small" variant="tertiary" svgOnly aria-label="编辑"><PencilIcon /></Button>
                      <Button size="small" variant="tertiary" svgOnly aria-label="更多"><EllipsisIcon /></Button>
                    </span>
                  </div>
                ))}
              </div>

      - id: HOVER.TIMING
        title_zh: 时长取 token
        statement_zh: 悬停过渡 150ms（Tailwind 缺省时长），离开同档；不额外加延迟（文字提示除外）。
        params:
          duration: { value: 150ms, source: SRC.TAILWIND.TRANSITIONS, label_zh: 悬停过渡 }
        enforcement: { kind: review }

  # ───────────────────────────── 体验管理 · 加载条 ─────────────────────────────
  - key: loading_bar
    title_zh: 加载条
    group: patterns.experience
    prefix: LBAR
    summary_zh: 选对加载形态；快的请求不显示加载条，出现后至少停留一会儿；不确定进度时缓慢推进、完成时补满；全局只有一条；有确切进度时显示百分比与剩余并能取消；读屏能感知。
    rules:
      - id: LBAR.KIND
        title_zh: 选对加载形态
        statement_zh: 页面切换用顶部细加载条；区块首次加载用骨架（保持内容的几何）；按钮触发的操作用按钮自己的加载态；有确切进度的（上传、导出、导入）用确定进度条；不用整页转圈遮住已有内容。
        anchors:
          - { spec: page, quote: 首屏骨架保持主要布局尺寸。 }
        enforcement: { kind: review }

      - id: LBAR.DELAY
        title_zh: 快的不显示，出现了停一会儿
        statement_zh: 请求在延迟阈值内完成就不显示加载条，避免一闪；一旦显示，至少停留最短时长再淡出；两个值全局统一，在 HTTP 客户端或路由层实现，页面不各自写。
        params:
          delay: { value: 200, unit: ms, source: SRC.NNG.RESPONSE_TIMES, label_zh: 出现延迟, note_zh: 0.1 秒以内感觉即时；200ms 内返回的请求不出加载条，避免闪一下 }
          min_visible: { value: 400, unit: ms, source: SRC.POMASTER.DEFAULTS, label_zh: 最短停留, note_zh: 出现了就至少停 400ms，避免一闪而过（与加载延迟实验一致） }
        enforcement: { kind: review }
        showcase:
          - kind: lab
            lab: loading.delay
            title_zh: 实验：加载条的延迟出现与最短停留
            description_zh: 分别发一个快请求和一个慢请求：快的不出现加载条；慢的出现后至少停留一会儿再收起。打开「错误做法」看快请求让加载条一闪而过。

      - id: LBAR.TRICKLE
        title_zh: 不确定进度时缓慢推进
        statement_zh: 不知道总量时，加载条先快后慢地推进但停在 100% 之前；完成时补满并淡出；失败时也要收起，并在出错的位置给反馈。
        enforcement: { kind: review }

      - id: LBAR.SINGLE
        title_zh: 全局只有一条
        statement_zh: 页面级加载条全局只有一个，用计数管理：每个请求开始加一、结束减一，归零才收起；并发请求不各自起一条，也不互相提前收起。
        anchors:
          - { spec: api, quote: SHOULD 让 loading 来源唯一，避免重复状态。 }
        enforcement: { kind: review }

      - id: LBAR.DETERMINATE
        title_zh: 确定进度显示百分比与剩余
        statement_zh: 上传、导出、导入这类有确切进度的操作显示百分比和预计剩余时间，可以取消；超过 10 秒的转后台任务并在完成时通知（见 SFB.PROGRESS）。
        enforcement: { kind: review }
        showcase:
          - kind: demo
            title_zh: 确定进度：百分比、剩余时间、可取消
            jsx: |-
              <div className="flex w-[360px] flex-col gap-2">
                <div className="flex justify-between text-label-14"><span>上传构建产物</span><span className="tabular-nums text-ds-gray-900">约 20 秒</span></div>
                <div role="progressbar" aria-label="上传构建产物" aria-valuemin={0} aria-valuemax={100} aria-valuenow={64} className="h-2 overflow-hidden rounded-full bg-ds-gray-200">
                  <div className="h-full rounded-full bg-ds-gray-1000" style={{ width: "64%" }} />
                </div>
                <div><Button size="small" variant="secondary">取消上传</Button></div>
              </div>

      - id: LBAR.A11Y
        title_zh: 读屏能感知
        statement_zh: 进度条带 role=progressbar 与 aria-valuenow（不确定进度时不写 valuenow，所在区域标 aria-busy）；完成和失败写进 aria-live 区。
        enforcement: { kind: review }

  # ───────────────────────────── 数据呈现 · 数据网格 ─────────────────────────────
  - key: data_grid
    title_zh: 数据网格
    group: patterns.data
    prefix: DGRID
    summary_zh: 先分清表格与数据网格；列的对齐、冻结与宽度有规则；排序筛选在服务端并进 URL；跨页选择说清范围；大数据虚拟滚动；行内编辑可撤回；密度三档按用户记住；空与加载保持列结构。
    rules:
      - id: DGRID.WHEN
        title_zh: 表格还是数据网格
        statement_zh: 只读、列不多、一屏看得完的列表用普通表格；需要列配置、冻结列、行内编辑、海量数据滚动、键盘逐格移动的用数据网格；同一个产品里数据网格只用一种实现。
        params:
          grid_library: { decision: 数据网格用哪个实现？, candidates: [TanStack Table + TanStack Virtual, AG Grid], label_zh: 数据网格实现 }
        enforcement: { kind: review }

      - id: DGRID.COLUMNS
        title_zh: 列的对齐、冻结与宽度
        statement_zh: 文本左对齐，数字和金额右对齐并用等宽数字，日期统一格式；首列（标识列）冻结在左、操作列冻结在右；列宽有最小值，内容超出时省略并能看全文；用户调整的列宽、顺序、显示的列按用户记住。
        anchors:
          - { spec: ui, quote: 表格、图表、弹层、焦点和状态随主题同步。 }
        enforcement: { kind: review }
        showcase:
          - kind: demo
            title_zh: 冻结首列与操作列，数字右对齐
            description_zh: 横向滚动时首列与操作列保持可见；金额列右对齐、等宽数字。
            jsx: |-
              <div className="w-[560px] overflow-x-auto rounded-xl border border-ds-gray-400">
                <Table className="min-w-[680px]">
                  <TableHeader>
                    <TableRow>
                      <TableHead className="sticky left-0 border-r border-ds-gray-400 bg-ds-background-100">项目</TableHead>
                      <TableHead>环境</TableHead>
                      <TableHead className="text-right">构建（秒）</TableHead>
                      <TableHead className="text-right">请求（24 小时）</TableHead>
                      <TableHead>状态</TableHead>
                      <TableHead className="sticky right-0 border-l border-ds-gray-400 bg-ds-background-100"><span className="sr-only">操作</span></TableHead>
                    </TableRow>
                  </TableHeader>
                  <TableBody>
                    {[["pomaster-web", "生产", "48.2", "1,204,511", "Ready"], ["pomaster-api", "预览", "112.9", "86,240", "Building"], ["studio", "生产", "31.0", "9,812", "Error"]].map(([name, env, build, req, status]) => (
                      <TableRow key={name}>
                        <TableCell className="sticky left-0 border-r border-ds-gray-400 bg-ds-background-100 font-medium">{name}</TableCell>
                        <TableCell>{env}</TableCell>
                        <TableCell className="text-right tabular-nums">{build}</TableCell>
                        <TableCell className="text-right tabular-nums">{req}</TableCell>
                        <TableCell><Badge variant={status === "Error" ? "destructive" : "outline"}>{status}</Badge></TableCell>
                        <TableCell className="sticky right-0 border-l border-ds-gray-400 bg-ds-background-100"><Button size="small" variant="tertiary">查看</Button></TableCell>
                      </TableRow>
                    ))}
                  </TableBody>
                </Table>
              </div>

      - id: DGRID.SORT_FILTER
        title_zh: 排序与筛选在服务端并进 URL
        statement_zh: 数据量超过一页时排序和筛选由服务端完成；当前排序的列有标识、可以取消；筛选条件、排序、页码进 URL，刷新和分享后恢复；表头的列筛选与筛选条共享同一套条件。
        anchors:
          - { spec: perf, quote: 大列表服务端分页，宽表虚拟化。 }
          - { spec: state, quote: 可分享和可恢复状态进入 URL。 }
        enforcement: { kind: review }

      - id: DGRID.SELECTION
        title_zh: 跨页选择说清范围
        statement_zh: 勾选只作用于本页时写明「已选本页 N 条」；需要选中全部结果时给「选择全部 M 条」的明确入口，批量操作按筛选条件在服务端执行，不在前端拉全量；翻页、筛选变化后说清选择是否保留。
        enforcement: { kind: review }

      - id: DGRID.VIRTUAL
        title_zh: 大数据虚拟滚动
        statement_zh: 行数超过阈值时启用虚拟滚动，行高固定，表头与冻结列保持；不一次渲染全部行；滚动时不做重计算。
        params:
          virtual_threshold: { value: 500, unit: count, source: SRC.POMASTER.DEFAULTS, label_zh: 虚拟滚动阈值, note_zh: 500 行以内整表渲染的成本可以接受，超过再上虚拟滚动 }
        anchors:
          - { spec: perf, quote: MUST NOT 大列表用普通 `v-for` 渲染全量数据（须虚拟滚动或分页）。 }
        enforcement: { kind: review }

      - id: DGRID.EDIT
        title_zh: 行内编辑可撤回
        statement_zh: 单元格就地编辑：Enter 提交、Esc 取消、Tab 到下一格；校验错误挂在单元格上并能定位；保存失败回滚到原值并说明原因；有未保存的修改时离开要提示；批量粘贴先校验再提交。
        anchors:
          - { spec: api, quote: Field Error：可定位到字段/单元格的错误。 }
        enforcement: { kind: review }

      - id: DGRID.DENSITY
        title_zh: 密度三档按用户记住
        statement_zh: 紧凑、默认、宽松三档（行高 32 / 40 / 48px，与按钮尺寸对齐），默认取中档，用户的选择按用户记住；同一页的多个表格用同一档。
        enforcement: { kind: review }

      - id: DGRID.EMPTY_LOADING
        title_zh: 空与加载保持列结构
        statement_zh: 首次加载显示与真实行同高的骨架行，表头和列宽不变；重新查询时保留旧数据并标出「更新中」，不清空闪烁；空结果在表格内给原因和下一步（清除筛选、新建）。
        anchors:
          - { spec: state, quote: SHOULD 在后台刷新时保留可用旧数据并标识 stale。 }
        enforcement: { kind: review }

  # ───────────────────────────── 数据呈现 · 图表 ─────────────────────────────
  - key: charts
    title_zh: 图表
    group: patterns.data
    prefix: CHART
    summary_zh: 图表库全项目一个；按问题选图；配色取 token、不只靠颜色区分；坐标轴与单位写清，柱状图从 0 开始；提示给精确值与口径；空、加载、出错与列表一致；提供数据表替代；大数据降采样；随容器重绘、卸载时销毁。
    rules:
      - id: CHART.LIBRARY
        title_zh: 图表库全项目一个
        statement_zh: 全项目只用一个图表库，经一个封装层（主题、空与出错态、尺寸监听、销毁）使用；图表库按需引入，不在应用入口同步加载。
        params:
          library: { decision: 图表用哪个库？, candidates: [Recharts, visx, ECharts（按需引入）], label_zh: 图表库 }
        anchors:
          - { spec: perf, quote: 路由、图表和重组件按需加载。 }
        enforcement: { kind: review }

      - id: CHART.CHOOSE
        title_zh: 按问题选图
        statement_zh: 先问图要回答什么：随时间的趋势用折线，类别之间比较用柱，构成用堆叠柱（饼图只在 5 类以内、强调占比时用），分布用直方图或箱线图，两个量的关系用散点；一张图只回答一个问题；需要精确值时直接给表格。
        params:
          pie_max: { value: 5, unit: count, source: SRC.POMASTER.PRESET, label_zh: 饼图最多类别 }
        enforcement: { kind: review }

      - id: CHART.COLOR
        title_zh: 配色取 token、不只靠颜色
        statement_zh: 分类色取规范色板的顺序，系列数有上限，超出合并为「其他」；连续值用单色深浅，正负对比用发散色；状态色只表示状态；不只靠颜色区分系列（加图例、直接标注或线型），对比度满足要求。
        anchors:
          - { spec: ui, quote: 颜色不得作为唯一信息来源 }
        enforcement: { kind: review }

      - id: CHART.AXES
        title_zh: 坐标轴与单位写清
        statement_zh: 柱状图纵轴从 0 开始，折线图可以截断但要标明；单位写在轴标题或图注里；刻度 4 到 6 个，数字格式与数据格式规范一致（千分位、单位缩写）；时间轴按时间等距，不按数据点等距。
        enforcement: { kind: review }
        examples:
          - kind: dont
            title_zh: 柱状图纵轴从 40 开始，差距被放大
            code: |-
              <YAxis domain={[40, 'auto']} />
            lang: tsx
        showcase:
          - kind: demo
            title_zh: 纵轴从 0 开始、单位写在图注
            jsx: |-
              <figure className="m-0">
                <svg width="220" height="150" role="img" aria-label="近 4 周部署次数：42、56、48、71">
                  <line x1="36" y1="120" x2="210" y2="120" className="stroke-ds-gray-400" />
                  <line x1="36" y1="60" x2="210" y2="60" className="stroke-ds-gray-200" />
                  <text x="30" y="124" textAnchor="end" className="fill-ds-gray-900 text-[11px]">0</text>
                  <text x="30" y="64" textAnchor="end" className="fill-ds-gray-900 text-[11px]">40</text>
                  {[42, 56, 48, 71].map((v, i) => <rect key={i} x={48 + i * 42} y={120 - v * 1.5} width={26} height={v * 1.5} rx={4} className={i === 3 ? "fill-ds-gray-1000" : "fill-ds-gray-500"} />)}
                  {["W1", "W2", "W3", "W4"].map((w, i) => <text key={w} x={61 + i * 42} y={138} textAnchor="middle" className="fill-ds-gray-900 text-[11px]">{w}</text>)}
                </svg>
                <figcaption className="text-copy-13 text-ds-gray-900">部署次数，纵轴从 0 开始</figcaption>
              </figure>

      - id: CHART.TOOLTIP
        title_zh: 提示给精确值与口径
        statement_zh: 悬停显示该点的精确值、单位和口径说明，多系列时同一时刻的值放在一个提示里；图例可点击切换系列；触屏上点按显示提示；关键结论不只放在提示里。
        enforcement: { kind: review }

      - id: CHART.STATES
        title_zh: 空、加载、出错与列表一致
        statement_zh: 图表区域在加载、空、出错时保持尺寸不变：加载用骨架，空数据说明原因（时间范围内没有数据），出错给重试；不渲染一张空坐标轴冒充「没有数据」。
        anchors:
          - { spec: ui, quote: MUST NOT 只处理页面背景而遗漏 portal/图表。 }
        enforcement: { kind: review }

      - id: CHART.A11Y
        title_zh: 提供数据表替代
        statement_zh: 每张图有一句话的文字摘要（aria-label 或图注），并能切换到数据表视图或下载数据；颜色之外还有文字或图形区分。
        anchors:
          - { spec: ui, quote: SHOULD 为复杂图表、媒体提供数据表格、长描述或音频描述。 }
        enforcement: { kind: review }

      - id: CHART.PERF
        title_zh: 大数据降采样
        statement_zh: 点数超过阈值时先在服务端聚合或降采样；大量点用 canvas 渲染；聚合计算不放在主线程的渲染路径里；实时图表合并更新、按帧刷新。
        params:
          max_points: { value: 2000, unit: count, source: SRC.POMASTER.DEFAULTS, label_zh: 单系列点数上限, note_zh: 单系列超过 2000 点先降采样或聚合再画 }
        enforcement: { kind: review }

      - id: CHART.LIFECYCLE
        title_zh: 随容器重绘、卸载时销毁
        statement_zh: 图表跟随容器尺寸重绘（ResponsiveContainer 或 ResizeObserver，加防抖）；组件卸载时销毁实例并解除监听；主题切换时重新应用主题。
        anchors:
          - { spec: state, quote: 状态拥有的监听器、计时器、观察器、请求、流、连接、Worker 和对象 URL 必须声明释放时机，并在卸载、身份切换或能力关闭时清理。 }
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 清理函数里销毁
            code: |-
              useEffect(() => { const ro = new ResizeObserver(resize); ro.observe(el); return () => { ro.disconnect(); chart.destroy() } }, [])
            lang: tsx

  # ───────────────────────────── 数据呈现 · 报表 ─────────────────────────────
  - key: reports
    title_zh: 报表
    group: patterns.data
    prefix: REPORT
    summary_zh: 报表结构固定（标题与口径、筛选、指标、明细）；口径与数据截至时间写清；筛选与对比期进 URL；合计与小计规则明确；数字格式统一；导出与页面同口径并受权限控制；打印有专门样式；大报表服务端聚合。
    rules:
      - id: REPORT.STRUCTURE
        title_zh: 报表结构固定
        statement_zh: 从上到下：报表名称与数据截至时间、筛选与对比、关键指标、图表、明细表；每块都能单独加载和出错；同类报表结构一致，用户换一张报表不用重新学。
        enforcement: { kind: review }
        showcase:
          - kind: demo
            title_zh: 标题与截至时间、筛选、指标、带合计的明细
            jsx: |-
              <div className="flex w-[600px] flex-col gap-4">
                <div className="flex items-baseline justify-between">
                  <h3 className="text-heading-20">用量月报</h3>
                  <span className="text-label-13 text-ds-gray-900">数据截至 2026-11-05 24:00（UTC+8）</span>
                </div>
                <div className="grid grid-cols-3 gap-4">
                  {[["请求", "1,204,511"], ["带宽", "48.2 GB"], ["错误率", "0.03%"]].map(([label, value]) => (
                    <div key={label} className="rounded-xl border border-ds-gray-400 p-4"><div className="text-label-13 text-ds-gray-900">{label}</div><div className="text-heading-24 tabular-nums">{value}</div></div>
                  ))}
                </div>
                <div className="overflow-hidden rounded-xl border border-ds-gray-400">
                  <Table>
                    <TableHeader><TableRow><TableHead>项目</TableHead><TableHead className="text-right">请求</TableHead><TableHead className="text-right">带宽（GB）</TableHead></TableRow></TableHeader>
                    <TableBody>
                      <TableRow><TableCell>pomaster-web</TableCell><TableCell className="text-right tabular-nums">1,118,271</TableCell><TableCell className="text-right tabular-nums">41.9</TableCell></TableRow>
                      <TableRow><TableCell>studio</TableCell><TableCell className="text-right tabular-nums">86,240</TableCell><TableCell className="text-right tabular-nums">6.3</TableCell></TableRow>
                    </TableBody>
                    <TableFooter><TableRow><TableCell>合计</TableCell><TableCell className="text-right tabular-nums">1,204,511</TableCell><TableCell className="text-right tabular-nums">48.2</TableCell></TableRow></TableFooter>
                  </Table>
                </div>
              </div>

      - id: REPORT.DEFINITIONS
        title_zh: 口径与截至时间写清
        statement_zh: 每个指标都有口径说明（悬停或「口径」入口）：计算公式、包含与排除、统计时区；页面显示数据截至时间和数据延迟；口径变化时标出变化点，不把新旧口径的数据画成一条线。
        enforcement: { kind: review }

      - id: REPORT.FILTERS
        title_zh: 筛选与对比期进 URL
        statement_zh: 时间范围、维度筛选、对比期（环比、同比）进 URL，可分享可恢复；默认时间范围固定且写明；对比结果同时给绝对值和变化率。
        anchors:
          - { spec: state, quote: 可分享和可恢复状态进入 URL。 }
        enforcement: { kind: review }

      - id: REPORT.TOTALS
        title_zh: 合计与小计规则明确
        statement_zh: 合计行固定在明细底部（或顶部，全项目一致）；比率类指标的合计按分子分母重新计算，不对各行百分比求和或求平均；不同单位的值不相加；分组小计与总计的口径一致。
        enforcement: { kind: review }

      - id: REPORT.NUMBERS
        title_zh: 数字格式统一
        statement_zh: 金额、数量、比率按数据格式规范输出：千分位、固定小数位、单位写在表头或指标名里、负数格式统一；空值显示「—」，和 0 区分开；数字右对齐、用等宽数字。
        enforcement: { kind: gate, check: format.no-local-pattern }

      - id: REPORT.EXPORT
        title_zh: 导出与页面同口径并受权限控制
        statement_zh: 导出的数据与页面使用同一组筛选和口径，文件名带报表名与时间范围；大数据量导出走后台任务，给进度并在完成时通知；导出受权限控制并按规则脱敏，导出操作留审计。
        anchors:
          - { spec: security, quote: MUST 对复制、导出、打印功能实施权限控制与脱敏策略；高敏感字段导出需审计与额外授权。 }
        enforcement: { kind: review }

      - id: REPORT.PRINT
        title_zh: 打印有专门样式
        statement_zh: 需要打印的报表提供打印样式：去掉导航与交互控件，表头在每页重复，行不被分页截断，打印页脚写明报表名、筛选条件与截至时间。
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 打印样式
            code: |-
              @media print {
                nav, .toolbar { display: none; }
                thead { display: table-header-group; }
                tr { break-inside: avoid; }
              }
            lang: css

      - id: REPORT.PERF
        title_zh: 大报表服务端聚合
        statement_zh: 聚合在服务端完成，前端只拿结果；明细分页或懒加载；同一报表的多个区块并行请求；结果可以缓存，页面显示缓存的生成时间并能手动刷新。
        anchors:
          - { spec: perf, quote: MUST NOT 串行发起可并行的页面初始化请求（须并行或后端聚合）。 }
        enforcement: { kind: review }

  # ───────────────────────────── 工程规范 · 状态管理 ─────────────────────────────
  - key: state
    title_zh: 状态管理
    group: engineering
    prefix: STATE
    summary_zh: 每份状态先定属主再定存放处：服务端数据进 TanStack Query，跨页稳定状态进 Zustand，可分享的视图状态进 URL，表单用表单模型。
    rules:
      - id: STATE.OWNERSHIP
        title_zh: 状态放哪
        statement_zh: 每份状态都说清楚：谁拥有、谁能改、放在哪、活多久、什么时候清理。组件自己的状态用 useState / useReducer 留在组件里；接口数据进查询缓存；跨页稳定的状态进全局 store；可分享的视图状态进 URL；表单进表单模型。
        anchors:
          - { spec: state, quote: 每个状态声明 owner、更新者、存储位置、生命周期和清理策略。 }
          - { spec: state, quote: MUST NOT 将组件状态放入全局 store。 }
        enforcement: { kind: review }
        showcase:
          - kind: specimen
            title_zh: 这份状态放哪
            name_label_zh: 状态
            rows:
              - name: 接口返回的数据
                usage_zh: "@tanstack/react-query 查询缓存"
                jsx: |-
                  <code className="text-label-13-mono">useQuery(&#123; queryKey, queryFn &#125;)</code>
              - name: 跨页、少变（当前用户、团队、偏好）
                usage_zh: Zustand 全局 store
                jsx: |-
                  <code className="text-label-13-mono">useSessionStore()</code>
              - name: 可分享的筛选、页码、标签页
                usage_zh: URL 查询参数
                jsx: |-
                  <code className="text-label-13-mono">?status=ready&amp;page=2</code>
              - name: 正在编辑的表单
                usage_zh: 表单模型
                jsx: |-
                  <code className="text-label-13-mono">useForm()</code>
              - name: 组件内的临时状态（展开、悬停）
                usage_zh: 组件局部状态
                jsx: |-
                  <code className="text-label-13-mono">useState()</code>

      - id: STATE.SERVER_STATE
        title_zh: 服务端数据
        statement_zh: 从接口来的数据由 @tanstack/react-query 管理（缓存 key、过期、重新获取、失效都在这一层），组件直接从查询读；不把接口数据复制进全局 store 再手动同步。
        params:
          query_library: { value: "@tanstack/react-query", source: SRC.POMASTER.STACK_DECISION, label_zh: 查询缓存库 }
        anchors:
          - { spec: state, quote: server state 由查询缓存层管理。 }
          - { spec: state, quote: MUST NOT 复制 server state 到全局 store 手动同步。 }
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 组件从查询读
            code: |-
              const { data, isPending } = useQuery({ queryKey: ["deployments", { status, page }], queryFn: () => api.listDeployments({ status, page }) })
            lang: tsx
          - kind: dont
            title_zh: 拉回来塞进全局 store
            code: |-
              useEffect(() => { api.listDeployments(query).then((list) => useDeployStore.setState({ list })) }, [query])
            lang: tsx

      - id: STATE.GLOBAL_STORE
        title_zh: 全局 store
        statement_zh: 全局 store 用 Zustand，只放跨页面且稳定的状态（当前用户、团队、偏好设置）；每个 store 一个文件，文件头写明属主；组件用选择器只订阅自己用到的字段。
        params:
          library: { value: Zustand, source: SRC.POMASTER.STACK_DECISION, label_zh: 全局状态库 }
        anchors:
          - { spec: state, quote: 全局 store 只保存稳定跨页面状态。 }
        enforcement: { kind: gate, check: state.store-library }
        examples:
          - kind: do
            title_zh: 用选择器订阅
            code: |-
              const team = useSessionStore((state) => state.team)
            lang: tsx

      - id: STATE.URL
        title_zh: URL 状态
        statement_zh: 列表的筛选条件、页码、排序、当前标签页这类可分享、刷新后要恢复的状态放进 URL 查询参数；敏感信息和没提交的表单不进 URL。
        anchors:
          - { spec: state, quote: 可分享和可恢复状态进入 URL。 }
          - { spec: state, quote: MUST NOT 将敏感或未提交表单写入 URL。 }
        enforcement: { kind: review }
        showcase:
          - kind: lab
            lab: state.url-filters
            title_zh: 实验：筛选条件进 URL
            description_zh: 改筛选和页码，地址栏跟着变；点「刷新页面」，视图从 URL 原样恢复。

      - id: STATE.REQUESTS
        title_zh: 请求入口
        statement_zh: 组件不直接调用 fetch，一律经生成的接口客户端（类型与 OpenAPI 同源）和查询；展示组件不请求接口、不改路由、不改全局状态，数据从属性传入。
        anchors:
          - { spec: ui, quote: MUST NOT 让展示组件偷偷请求接口、改路由或全局状态。 }
        enforcement: { kind: gate, check: state.no-direct-request }
        examples:
          - kind: dont
            title_zh: 组件里直接 fetch
            code: |-
              useEffect(() => { fetch("/api/deployments").then((r) => r.json()).then(setRows) }, [])
            lang: tsx

      - id: STATE.CACHE_KEYS
        title_zh: 缓存 key 与失效
        statement_zh: 查询 key 包含所有影响结果的筛选条件和上下文（团队、数据范围）；每个写操作声明它会让哪些查询失效，成功后 invalidateQueries；切换团队或身份时清掉可能越权的缓存。
        anchors:
          - { spec: state, quote: Query Key 包含所有影响结果的筛选和上下文。 }
          - { spec: state, quote: 写操作定义依赖失效矩阵。 }
        enforcement: { kind: review }
        showcase:
          - kind: lab
            lab: state.query-cache
            title_zh: 实验：查询缓存与失效
            description_zh: 切换筛选看缓存命中；点「新建一条」后，对应的 key 失效并重新拉取。

      - id: STATE.CLEANUP
        title_zh: 清理与竞态
        statement_zh: 订阅、计时器、请求在组件卸载和身份切换时清理（useEffect 返回清理函数，请求带 AbortSignal）；已取消的请求和旧身份下的迟到结果不得写入当前状态。
        anchors:
          - { spec: state, quote: MUST NOT 让已取消请求、旧订阅或旧身份上下文的迟到结果继续写入当前状态。 }
        enforcement: { kind: review }
        showcase:
          - kind: lab
            lab: state.race
            title_zh: 实验：迟到的响应不写回
            description_zh: 快速输入会发出多个请求，响应乱序到达；只有最新一次的结果写进列表。打开「错误做法」看旧结果覆盖新结果。

      - id: STATE.FORM_MODEL
        title_zh: 表单模型
        statement_zh: 表单用独立的表单模型和类型化的校验 schema，不直接绑定接口返回的 DTO；区分初始值、当前值、是否改过、错误和提交中。
        params:
          form_library: { decision: 表单模型用哪个库？, candidates: ["react-hook-form + zod", "TanStack Form"], label_zh: 表单库 }
        anchors:
          - { spec: page, quote: 使用独立 FormModel 和 typed schema。 }
          - { spec: page, quote: MUST NOT 直接绑定 DTO。 }
        enforcement: { kind: review }

      - id: STATE.BROWSER_STORAGE
        title_zh: 浏览器存储
        statement_zh: 存进浏览器（localStorage、IndexedDB）的每一项都登记用途、隔离 key（按用户、团队）、版本、大小、过期时间和清理时机；读回来先校验版本和身份；脚本可读的存储里不放会话标识、刷新令牌等凭据。
        anchors:
          - { spec: state, quote: 可被脚本读取的存储不得持久化 session identifier、refresh token、secret 或等价凭据 }
        enforcement: { kind: review }

  # ───────────────────────────── 工程规范 · 性能 ─────────────────────────────
  - key: performance
    title_zh: 性能
    group: engineering
    prefix: PERF
    summary_zh: 先定预算；路由与重组件按需加载；组件与图标按需引入；大列表分页与虚拟化；输入防抖并丢弃过期响应；初始化请求并行；渲染里不做重计算；度量分清实验室与真实用户数据。
    rules:
      - id: PERF.BUDGET
        title_zh: 性能预算
        statement_zh: 上线前定好预算：真实用户第 75 百分位 LCP ≤ 2.5 s、INP ≤ 200 ms、CLS ≤ 0.1（项目可以凭证据收紧）；首屏脚本体积和单个路由分包体积由项目定上限，构建时检查。
        params:
          lcp: { value: 2500, unit: ms, source: SRC.POMASTER.PERF_SPEC, label_zh: LCP（p75） }
          inp: { value: 200, unit: ms, source: SRC.POMASTER.PERF_SPEC, label_zh: INP（p75） }
          cls: { value: 0.1, source: SRC.POMASTER.PERF_SPEC, label_zh: CLS（p75） }
          initial_js: { value: 170, unit: none, source: SRC.POMASTER.DEFAULTS, label_zh: 首屏脚本体积（KB，压缩后）, note_zh: 取业界常用的首屏脚本预算 170 KB（gzip 后） }
          route_chunk: { value: 100, unit: none, source: SRC.POMASTER.DEFAULTS, label_zh: 路由分包体积（KB，压缩后）, note_zh: 单个路由分包不超过 100 KB（gzip 后），超过就再拆 }
        anchors:
          - { spec: perf, quote: 定义首屏、包体、交互和核心页面预算。 }
        enforcement: { kind: review }

      - id: PERF.LAZY_LOAD
        title_zh: 按需加载
        statement_zh: 路由一律懒加载（lazy 路由或 React.lazy）；图表、富文本编辑器、大表格等重组件在用到的页面里按需加载；应用入口不同步引入这些重型依赖。
        anchors:
          - { spec: perf, quote: 路由、图表和重组件按需加载。 }
        enforcement: { kind: gate, check: perf.lazy-load }
        examples:
          - kind: do
            title_zh: 路由懒加载
            code: |-
              { path: '/usage', lazy: () => import('./pages/usage') }
            lang: tsx
          - kind: dont
            title_zh: 入口同步引入图表库
            code: |-
              // main.tsx
              import { LineChart } from 'recharts'
            lang: tsx

      - id: PERF.ON_DEMAND_LIBRARY
        title_zh: 组件库按需引入
        statement_zh: 组件按文件引入（shadcn/ui 的组件本来就在 src/components/ui 下按文件存在）；lucide-react 按图标名具名引入，不整包引入或用动态名字查整个图标表。
        enforcement: { kind: gate, check: perf.no-full-library-import }
        examples:
          - kind: do
            title_zh: 具名引入图标
            code: |-
              import { RocketIcon } from 'lucide-react'
            lang: tsx
          - kind: dont
            title_zh: 整包引入图标表
            code: |-
              import * as Icons from 'lucide-react'
              const Icon = Icons[name]
            lang: tsx

      - id: PERF.LARGE_LISTS
        title_zh: 大列表
        statement_zh: 大列表走服务端分页、筛选、排序；行数多或列很多的表格用虚拟滚动（TanStack Virtual）；不用 map 一次渲染全量数据；列表项有稳定的 key。
        params:
          virtual_threshold: { value: 500, unit: count, source: SRC.POMASTER.DEFAULTS, label_zh: 虚拟滚动阈值, note_zh: 与数据网格的虚拟滚动阈值一致 }
        anchors:
          - { spec: perf, quote: 大列表服务端分页，宽表虚拟化。 }
        enforcement: { kind: review }

      - id: PERF.INPUT
        title_zh: 输入与过期响应
        statement_zh: 搜索、联想等随输入触发的请求做防抖，或用 useDeferredValue 让输入保持跟手；新请求发出时取消旧请求；过期的响应不覆盖新状态（查询 key 带上关键字时由查询缓存层处理）。
        params:
          debounce: { value: 300, unit: ms, source: SRC.POMASTER.DEFAULTS, label_zh: 防抖间隔, note_zh: 输入停顿 300ms 再发请求：打字时不连发，停下来又不显得迟钝 }
        anchors:
          - { spec: perf, quote: 搜索防抖、旧请求取消、过期响应丢弃。 }
        enforcement: { kind: review }

      - id: PERF.PARALLEL_INIT
        title_zh: 并行初始化
        statement_zh: 页面初始化需要的多个请求并行发出（多个 useQuery 天然并行，或 useQueries），或由后端聚合成一个；不在 useEffect 里串行等待彼此无关的请求，不造成请求瀑布。
        anchors:
          - { spec: perf, quote: MUST NOT 串行发起可并行的页面初始化请求（须并行或后端聚合）。 }
        enforcement: { kind: review }
        examples:
          - kind: dont
            title_zh: 请求瀑布
            code: |-
              const { data: team } = useQuery(teamQuery)
              const { data: usage } = useQuery({ ...usageQuery(team?.id), enabled: !!team }) // 与 team 无关却等它
            lang: tsx

      - id: PERF.COMPUTE
        title_zh: 渲染计算
        statement_zh: 渲染里不做复杂计算：派生值在渲染时直接算（轻量的）或用 useMemo（昂贵的）；对大数据全集的计算放到后端或 Web Worker；只订阅用到的状态（Zustand 选择器），避免整树重渲染。
        anchors:
          - { spec: perf, quote: MUST NOT 在 render 中执行复杂计算。 }
        enforcement: { kind: review }

      - id: PERF.MEASURE
        title_zh: 度量口径
        statement_zh: 性能结论分清实验室数据和真实用户数据，记录设备、网络、浏览器、样本量和统计口径，放行看第 75 百分位；同一数据量下对比前后结果，不拿平均值或单次本地耗时下结论；用 React Profiler 定位重渲染。
        anchors:
          - { spec: perf, quote: 性能预算必须区分实验室数据与真实用户数据 }
        enforcement: { kind: review }

  # ───────────────────────────── 工程规范 · 安全 ─────────────────────────────
  - key: security
    title_zh: 安全
    group: engineering
    prefix: SEC
    summary_zh: 不可信内容不进危险渲染；链接与跳转走白名单；状态变更请求带 CSRF 防护；不用 eval 一类动态执行；第三方脚本登记并校验完整性；前端隐藏不是鉴权；敏感值不出现在 URL、日志、埋点和剪贴板；跨窗口消息校验来源。
    rules:
      - id: SEC.XSS
        title_zh: 不可信内容不进危险渲染
        statement_zh: 不用 dangerouslySetInnerHTML 渲染用户输入或接口返回的富文本；确实要渲染富文本时，经项目唯一的净化组件（白名单 sanitizer，如 DOMPurify）输出；不拼接 HTML 字符串。
        anchors:
          - { spec: security, quote: MUST NOT 使用 `v-html` / `innerHTML` / `dangerouslySetInnerHTML` 渲染不可信内容；富文本必须使用白名单 sanitizer。 }
        enforcement: { kind: gate, check: security.no-unsafe-html }
        examples:
          - kind: dont
            title_zh: 直接渲染接口返回的 HTML
            code: |-
              <div dangerouslySetInnerHTML={{ __html: notice.content }} />
            lang: tsx
          - kind: do
            title_zh: 经净化组件
            code: |-
              <SafeHtml html={notice.content} />
            lang: tsx

      - id: SEC.LINKS
        title_zh: 链接与跳转走白名单
        statement_zh: 用户或接口提供的链接只接受 http、https、mailto 协议（拒绝 javascript:、data:）；登录后的回跳地址只接受站内相对路径；新窗口打开外链一律带 rel="noopener noreferrer"。
        enforcement: { kind: gate, check: security.safe-link }
        examples:
          - kind: do
            title_zh: 回跳地址只认站内路径
            code: |-
              const next = params.get('next')
              navigate(next?.startsWith('/') && !next.startsWith('//') ? next : '/')
            lang: tsx
          - kind: do
            title_zh: 外链
            code: |-
              <a href={url} target="_blank" rel="noopener noreferrer">查看文档</a>
            lang: tsx

      - id: SEC.CSRF
        title_zh: 状态变更请求带 CSRF 防护
        statement_zh: 所有改变状态的请求（表单、AJAX、上传、批量操作）由 HTTP 客户端统一带上 CSRF token 和自定义请求头；token 不放 URL、不存进脚本可读的存储；业务代码不自己拼这些头。
        anchors:
          - { spec: security, quote: MUST 在表单提交、AJAX/Fetch、上传、批量操作、GraphQL mutation 中携带 CSRF token。 }
          - { spec: security, quote: MUST NOT 让业务请求自行决定 CSRF/token 头格式。 }
        enforcement: { kind: review }

      - id: SEC.NO_EVAL
        title_zh: 不用动态执行
        statement_zh: 不用 eval、new Function、字符串形式的 setTimeout / setInterval，不用内联事件属性；生产环境按严格 CSP 部署（script-src 不含 'unsafe-inline' 和 'unsafe-eval'）。
        anchors:
          - { spec: security, quote: MUST 部署 CSP，默认 `default-src 'self'`；脚本/样式/img/font/connect/frame 按业务最小白名单开放。 }
        enforcement: { kind: gate, check: security.no-eval }
        examples:
          - kind: dont
            title_zh: 字符串当代码执行
            code: |-
              setTimeout('refresh()', 1000)
              const fn = new Function('row', rule.expression)
            lang: ts

      - id: SEC.THIRD_PARTY
        title_zh: 第三方脚本登记并校验完整性
        statement_zh: 第三方脚本、iframe、SDK 先登记（负责人、来源域、权限、数据范围、版本、撤除方式）再引入；从 CDN 加载的脚本带 SRI（integrity + crossorigin）；iframe 用 sandbox 收紧能力。
        anchors:
          - { spec: security, quote: MUST NOT 加载无 SRI/无来源清单的第三方脚本或 iframe。 }
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 带完整性校验
            code: |-
              <script src="https://cdn.example.com/widget@2.1.0/widget.js" integrity="sha384-…" crossorigin="anonymous"></script>
            lang: html

      - id: SEC.AUTHZ_UI
        title_zh: 前端隐藏不是鉴权
        statement_zh: 按权限隐藏或禁用按钮、菜单只是体验；每个接口由后端强制鉴权；前端不拿全量敏感数据再自己过滤或用 CSS 藏起来，按权限脱敏由后端完成。
        anchors:
          - { spec: security, quote: MUST NOT 用前端隐藏菜单或按钮替代后端鉴权。 }
          - { spec: security, quote: MUST 后端返回字段按权限脱敏，前端不得获取全量敏感数据后再自行过滤或仅 CSS 隐藏。 }
        enforcement: { kind: review }

      - id: SEC.SENSITIVE
        title_zh: 敏感值不外泄
        statement_zh: token、密码、身份证号这类敏感原值不写进 console、日志、埋点、错误上报、剪贴板、URL 和下载文件名；错误提示不暴露堆栈、内部路径和内部 ID。
        anchors:
          - { spec: security, quote: MUST NOT 将敏感原值写入浏览器 console、日志、埋点、错误监控、剪贴板、URL、localStorage、下载文件。 }
        enforcement: { kind: review }

      - id: SEC.POSTMESSAGE
        title_zh: 跨窗口消息校验来源
        statement_zh: postMessage 指定目标 origin，不用 '*'；接收方先校验 event.origin 在白名单内，再按结构解析数据；收到的内容不进 eval 或 innerHTML。
        anchors:
          - { spec: security, quote: MUST NOT 使用 `postMessage('*')` 或在跨窗口消息中直接执行 eval/innerHTML。 }
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 校验来源
            code: |-
              window.addEventListener('message', (event) => {
                if (!TRUSTED_ORIGINS.includes(event.origin)) return
                const message = parseWidgetMessage(event.data)
              })
            lang: ts

  # ───────────────────────────── 工程规范 · 会话与凭据 ─────────────────────────────
  - key: session
    title_zh: 会话与凭据
    group: engineering
    prefix: SESSION
    summary_zh: 凭据放在脚本读不到的地方；Cookie 属性收紧；登录后换会话；空闲与绝对超时；敏感操作重新验证；静默刷新只试一次；登出全面清理并同步到所有标签页；非必要 Cookie 先征得同意。
    rules:
      - id: SESSION.STORAGE
        title_zh: 凭据放在脚本读不到的地方
        statement_zh: 会话标识与刷新令牌放在 HttpOnly Cookie 里，由后端设置；短期访问令牌只放内存（模块变量或状态库里不持久化的字段）；不存进 localStorage、sessionStorage、IndexedDB，不放进 URL 和 URL 片段。
        anchors:
          - { spec: security, quote: MUST 禁止将 session identifier、refresh token、access token、secret、密码等价凭据持久化到 localStorage/sessionStorage/IndexedDB（除非经安全 Owner 批准的短期例外）。 }
        enforcement: { kind: gate, check: security.no-token-storage }
        examples:
          - kind: dont
            title_zh: 令牌存进 localStorage
            code: |-
              localStorage.setItem('access_token', data.token)
            lang: ts
          - kind: do
            title_zh: 令牌只放内存
            code: |-
              let accessToken: string | null = null
              export const setAccessToken = (token: string | null) => { accessToken = token }
            lang: ts

      - id: SESSION.COOKIE
        title_zh: Cookie 属性收紧
        statement_zh: 会话类 Cookie 一律 HttpOnly、Secure、SameSite（默认 Lax，跨站场景不需要时用 Strict），优先用 __Host- 前缀（必须 Secure、Path=/、不带 Domain）；Path 与 Domain 取最小范围；Cookie 里不放业务数据和个人信息；前端代码不读写会话 Cookie。
        params:
          same_site: { decision: 会话 Cookie 的 SameSite 取 Lax 还是 Strict？, candidates: [Lax, Strict], label_zh: SameSite }
          prefix: { value: __Host-, source: SRC.MDN.COOKIES, label_zh: Cookie 名前缀 }
        anchors:
          - { spec: security, quote: MUST 使用双重提交 cookie 或同步器 token；token 必须每次会话/请求不可预测且由后端验证。 }
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 后端下发的会话 Cookie
            code: |-
              Set-Cookie: __Host-sid=…; Path=/; Secure; HttpOnly; SameSite=Lax
            lang: html

      - id: SESSION.ROTATE
        title_zh: 登录后换会话
        statement_zh: 登录成功、切换租户、提升权限后由后端签发新的会话标识并作废旧的（防会话固定）；前端在这些时刻丢弃内存里的旧令牌和旧的 CSRF token，重新获取。
        anchors:
          - { spec: security, quote: MUST 在登录、切换租户、敏感操作后轮换 CSRF token。 }
        enforcement: { kind: review }

      - id: SESSION.TIMEOUT
        title_zh: 空闲与绝对超时
        statement_zh: 会话同时有空闲超时和绝对超时；空闲超时到期前提示「即将退出」并允许续期；超时后保存可恢复的现场（当前路由、未提交表单的草稿），重新登录后回到原处。
        params:
          idle: { decision: 空闲多久自动退出？, candidates: [30 分钟, 2 小时], label_zh: 空闲超时 }
          absolute: { decision: 登录后最长多久必须重新登录？, candidates: [8 小时, 24 小时], label_zh: 绝对超时 }
          warn_before: { decision: 到期前多久提示？, candidates: [2 分钟, 5 分钟], label_zh: 到期提醒 }
        enforcement: { kind: review }

      - id: SESSION.STEP_UP
        title_zh: 敏感操作重新验证
        statement_zh: 修改密码、改绑手机、导出敏感数据、批量删除、审批这类高影响操作前要求重新验证身份（输入密码或二次验证），验证结果只对这一次操作有效。
        anchors:
          - { spec: security, quote: MUST 对导出、删除、审批、批量操作等高影响动作增加二次确认或后端 challenge。 }
        enforcement: { kind: review }

      - id: SESSION.REFRESH
        title_zh: 静默刷新只试一次
        statement_zh: 请求返回 401 时，HTTP 客户端用刷新令牌静默刷新一次（并发的 401 共用同一次刷新），成功后重放原请求；刷新失败就清理会话并带回跳地址去登录；刷新逻辑只在 HTTP 客户端里写一处。
        anchors:
          - { spec: security, quote: MUST 在 token 即将过期前使用 silent refresh 或显式重新认证，不得在 URL 中传递 token。 }
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 并发 401 共用一次刷新
            code: |-
              let refreshing: Promise<void> | null = null
              async function onUnauthorized() {
                refreshing ??= api.refresh().finally(() => { refreshing = null })
                await refreshing
              }
            lang: ts

      - id: SESSION.LOGOUT
        title_zh: 登出全面清理并同步
        statement_zh: 登出时调用后端注销接口，清空内存令牌、查询缓存、状态库、按用户隔离的存储、订阅、Worker 和长连接；用 BroadcastChannel 通知其他标签页同步登出。
        anchors:
          - { spec: security, quote: MUST 实现统一登出：清除服务端会话、客户端内存 token、触发所有标签页/Worker 登出事件。 }
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 多标签页同步登出
            code: |-
              const channel = new BroadcastChannel('auth')
              channel.onmessage = (event) => { if (event.data === 'logout') clearSession() }
              export function logout() { clearSession(); channel.postMessage('logout') }
            lang: ts

      - id: SESSION.CONSENT
        title_zh: 非必要 Cookie 先征得同意
        statement_zh: 统计、广告等非必要 Cookie 和本地存储在用户同意之前不写入；同意可以撤回，撤回后停止加载对应脚本并清理它写下的数据；必要 Cookie 在隐私说明里列明用途。
        anchors:
          - { spec: security, quote: MUST 在用户撤回同意或第三方 SDK 不再需要时停止加载并清理其状态/缓存。 }
        enforcement: { kind: review }

  # ───────────────────────────── 工程规范 · 防篡改与防劫持 ─────────────────────────────
  - key: tamper
    title_zh: 防篡改与防劫持
    group: engineering
    prefix: TAMPER
    summary_zh: 前端的一切都可被篡改：价格、权限、状态以服务端为准；关键写请求防重放；传输全程 HTTPS 与 HSTS；页面不被别人嵌套（防点击劫持）；外链防反向标签页劫持；本地数据读回先校验；前端混淆不是安全措施。
    rules:
      - id: TAMPER.SERVER_TRUTH
        title_zh: 以服务端为准
        statement_zh: 金额、价格、折扣、库存、权限、审批状态这类业务事实由服务端计算和判定；前端提交用户的意图（选了哪个商品、改成什么），不提交可被改写的结论（总价、是否有权限）；客户端校验只是体验，服务端再校验一遍。
        anchors:
          - { spec: security, quote: MUST 将客户端校验仅视为 UX 辅助，服务端校验为权威；前端仍需执行同步/异步校验以提升体验。 }
        enforcement: { kind: review }
        examples:
          - kind: dont
            title_zh: 提交前端算的总价
            code: |-
              api.createOrder({ items, totalPrice: cart.total })
            lang: ts
          - kind: do
            title_zh: 只提交意图，总价由后端算
            code: |-
              api.createOrder({ items: items.map(({ skuId, quantity }) => ({ skuId, quantity })) })
            lang: ts

      - id: TAMPER.REPLAY
        title_zh: 关键写请求防重放
        statement_zh: 支付、审批、转账这类关键写请求带一次性随机数和时间戳，由后端校验时效并拒绝重复；需要时对请求体签名（密钥不在前端代码里，由后端按会话下发短期签名凭据）；重放保护与幂等键一起使用。
        params:
          window: { value: 300, unit: none, source: SRC.POMASTER.DEFAULTS, label_zh: 时间窗口（秒）, note_zh: 允许 5 分钟时钟偏差，与常见请求签名方案一致 }
        enforcement: { kind: review }

      - id: TAMPER.TRANSPORT
        title_zh: 传输全程 HTTPS
        statement_zh: 全站 HTTPS 并启用 HSTS；页面不加载任何 HTTP 资源（无混合内容）；接口地址、WebSocket 地址都用 https / wss；证书错误不提供「继续访问」的旁路。
        anchors:
          - { spec: security, quote: MUST 配置 TLS 1.2+；HTTPS 页面不得加载 HTTP 资源（混合内容）。 }
        enforcement: { kind: review }

      - id: TAMPER.FRAMING
        title_zh: 页面不被别人嵌套
        statement_zh: 响应头设置 CSP frame-ancestors（或 X-Frame-Options），默认禁止被其他站点嵌入 iframe，防点击劫持；确需被嵌入的页面列出允许的来源。
        anchors:
          - { spec: security, quote: "MUST 使用 `X-Frame-Options: DENY/SAMEORIGIN` 或 CSP `frame-ancestors` 防止点击劫持。" }
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 禁止被嵌入
            code: |-
              Content-Security-Policy: frame-ancestors 'self'
            lang: html

      - id: TAMPER.TABNABBING
        title_zh: 外链防反向标签页劫持
        statement_zh: target=_blank 的链接一律带 rel="noopener noreferrer"；用 window.open 打开外部页面时传 noopener；不把 window.opener 交给外部页面。
        enforcement: { kind: gate, check: security.safe-link }
        examples:
          - kind: do
            title_zh: window.open 带 noopener
            code: |-
              window.open(url, '_blank', 'noopener,noreferrer')
            lang: ts

      - id: TAMPER.LOCAL_DATA
        title_zh: 本地数据读回先校验
        statement_zh: 从 localStorage、IndexedDB、URL 参数读回的数据当作不可信输入：校验结构、版本和所属用户，不符合就丢弃并回到默认值；不把本地数据当成权限或业务判定的依据。
        anchors:
          - { spec: state, quote: 持久化状态必须区分用户/租户/环境命名空间，并在登出、权限收缩或版本不兼容时失效或迁移。 }
        enforcement: { kind: review }

      - id: TAMPER.OBFUSCATION
        title_zh: 前端混淆不是安全措施
        statement_zh: 代码混淆、禁用右键、反调试只能增加一点阅读成本，不能保护任何秘密：前端代码里不放密钥、内部接口凭据和不该给用户看到的规则；source map 不公开发布（随版本上传到错误监控并限制访问）。
        anchors:
          - { spec: obs, quote: source map 与版本对应且受权限保护。 }
        enforcement: { kind: review }

  # ───────────────────────────── 工程规范 · 健壮性 ─────────────────────────────
  - key: robustness
    title_zh: 健壮性
    group: engineering
    prefix: ROBUST
    summary_zh: 接口数据在边界按契约解析；渲染不怕空值与缺字段；每个请求有超时；离线和弱网有处理；非核心模块失败不影响主流程；界面承受重复与乱序；资源在卸载时清理；输入上限前端先拦。
    rules:
      - id: ROBUST.PARSE
        title_zh: 接口数据在边界按契约解析
        statement_zh: 接口响应在 HTTP 客户端或接口层按契约 schema 解析（类型由 OpenAPI 生成，运行时用 zod 一类校验关键结构）；解析失败归为「契约错误」走错误处理，不把畸形数据交给组件去崩。
        anchors:
          - { spec: api, quote: 传输成功与业务成功必须分别判断；HTTP 非成功状态、契约解析失败、取消、超时、离线和业务错误不得混为一类。 }
        enforcement: { kind: review }

      - id: ROBUST.NULLS
        title_zh: 渲染不怕空值与缺字段
        statement_zh: 可选字段用可选链和明确的默认显示（「—」）；列表字段为空数组、null 或缺失时都能渲染；数字字段区分 0 与空；不在模板里写多层取值链而不设防。
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 明确的空值显示
            code: |-
              <span>{order.customer?.name ?? '—'}</span>
            lang: tsx

      - id: ROBUST.TIMEOUT
        title_zh: 每个请求有超时
        statement_zh: HTTP 客户端给每个请求设超时（上传、导出等长请求单独设）；超时、取消、离线、服务端错误分别处理与提示；超时的请求不自动重发非幂等写操作。
        params:
          timeout: { value: 15, unit: none, source: SRC.POMASTER.DEFAULTS, label_zh: 请求超时（秒）, note_zh: 普通请求 15 秒超时；导出、上传这类长任务走后台任务，不靠拉长超时 }
        anchors:
          - { spec: api, quote: HTTP Client 统一处理 base URL、认证、超时、取消、trace 和 envelope。 }
        enforcement: { kind: review }

      - id: ROBUST.OFFLINE
        title_zh: 离线和弱网有处理
        statement_zh: 监听 online / offline：离线时顶部提示并暂停轮询，已输入的内容不丢；恢复后重新校验数据新鲜度并重试读请求；页面从后台或前进后退缓存恢复时同样重新校验。
        anchors:
          - { spec: page, quote: 页面必须兼容 `pagehide` / `pageshow`、可见性变化和 bfcache 恢复；恢复后重新校验连接、缓存、权限与数据新鲜度。 }
        enforcement: { kind: review }

      - id: ROBUST.DEGRADE
        title_zh: 非核心模块失败不影响主流程
        statement_zh: 推荐位、统计 SDK、客服挂件、图表这类非核心模块失败时只在它自己的位置降级（隐藏或显示占位），不阻塞首屏和主流程；第三方 SDK 初始化失败静默降级并上报。
        anchors:
          - { spec: obs, quote: MUST NOT 让 SDK 初始化、遥测缓存或发送重试阻塞首屏、用户操作或错误恢复。 }
        enforcement: { kind: review }

      - id: ROBUST.REPEAT_ORDER
        title_zh: 承受重复与乱序
        statement_zh: 同一事件触发两次、响应乱序到达、组件重复挂载，界面状态都保持正确：请求结果写回前核对请求序号与上下文（见 ASYNC.LATEST），订阅与监听的数量有上限、不随重复挂载增长。
        anchors:
          - { spec: page, quote: 重复进入、挂载、恢复或重试必须保持资源数量有界，并有自动化证据证明不会重复订阅或产生开放句柄。 }
        enforcement: { kind: review }

      - id: ROBUST.CLEANUP
        title_zh: 资源在卸载时清理
        statement_zh: 定时器、事件监听、订阅、观察器、WebSocket、对象 URL 在 useEffect 的清理函数里释放；路由离开和身份切换时取消进行中的请求。
        anchors:
          - { spec: page, quote: 路由离开、组件销毁、注销、切换账号/租户、权限变化和功能关闭必须清理对应资源与敏感上下文。 }
        enforcement: { kind: review }

      - id: ROBUST.LIMITS
        title_zh: 输入上限前端先拦
        statement_zh: 长度、文件大小、文件类型、数量、数值范围的上限与后端契约一致，在前端先拦截并说清限制（还能输入多少字、最大 20 MB）；后端仍是最终校验。
        anchors:
          - { spec: api, quote: 上传声明 multipart 字段、类型、大小、数量、文件名、校验阶段和安全错误。 }
        enforcement: { kind: review }

  # ───────────────────────────── 工程规范 · 报错管理 ─────────────────────────────
  - key: error_handling
    title_zh: 报错管理
    group: engineering
    prefix: ERRH
    summary_zh: 错误归一成统一结构；按状态码分别处理；路由级与区块级错误边界，局部失败不白屏；全局兜底捕获并脱敏上报；文案说清发生了什么、怎么办；不吞错误；错误码到界面状态的映射只有一份。
    rules:
      - id: ERRH.NORMALIZE
        title_zh: 错误归一成统一结构
        statement_zh: HTTP 客户端把所有失败归一成一个结构：类别（网络、超时、取消、契约、业务、权限……）、稳定错误码、可显示的文案、traceId、是否可重试、字段错误、建议的恢复动作；页面只消费这个结构，不解析原始响应。
        anchors:
          - { spec: api, quote: 将原始错误归一化为稳定 code、trace、fieldErrors、retryable 和 recoverAction。 }
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 统一的错误结构
            code: |-
              interface AppError {
                kind: 'network' | 'timeout' | 'canceled' | 'contract' | 'business' | 'auth' | 'forbidden' | 'not_found' | 'conflict' | 'rate_limited' | 'server'
                code: string
                message: string
                traceId: string | null
                retryable: boolean
                fieldErrors: Record<string, string>
                recover: 'login' | 'retry' | 'reload' | 'resolve_conflict' | 'contact' | null
              }
            lang: ts

      - id: ERRH.MAPPING
        title_zh: 按状态码分别处理
        statement_zh: 401 走静默刷新或去登录；403 显示无权限状态；404 显示资源不存在；409 给冲突解决（重新加载或比较合并）；422 把字段错误挂到字段；429 按 Retry-After 稍后重试；5xx 与网络错误显示可重试的错误；取消不提示。
        anchors:
          - { spec: api, quote: 401、403、404、409、422、429、5xx 和网络错误分别处理。 }
          - { spec: api, quote: 错误码到 UI 状态的映射必须维护在单一事实源 `outputs/frontend/10_planned/api-error-mapping.yaml`，并与契约版本同步。 }
        enforcement: { kind: review }

      - id: ERRH.BOUNDARY
        title_zh: 局部失败不白屏
        statement_zh: 路由级和区块级都有错误边界（ErrorBoundary 包住每个独立区块，路由用 errorElement）：一个区块渲染失败只替换这个区块并给重试，页面其余部分照常可用。
        anchors:
          - { spec: api, quote: 分层设置错误边界，局部失败不得导致整页白屏。 }
        enforcement: { kind: review }
        showcase:
          - kind: lab
            lab: error.boundary
            title_zh: 实验：区块级错误边界
            description_zh: 让「回款趋势」区块出错：正确做法只有这一块显示错误并能重试；错误做法整页白屏。

      - id: ERRH.GLOBAL
        title_zh: 全局兜底捕获并脱敏上报
        statement_zh: 注册 window.onerror 与 unhandledrejection（根组件外再包一层 ErrorBoundary），捕获到的错误先过滤敏感字段再上报，带 traceId、版本、路由；兜底只记录和提示，不吞掉错误继续假装正常。
        anchors:
          - { spec: security, quote: MUST 在前端异常捕获（Error Boundary、window.onerror、unhandledrejection）中过滤敏感字段后再上报监控。 }
        enforcement: { kind: review }

      - id: ERRH.MESSAGE
        title_zh: 文案说清发生了什么、怎么办
        statement_zh: 错误文案用用户的话说清发生了什么和下一步（重试、检查网络、联系管理员）；不显示堆栈、内部错误码原文和接口路径；需要反馈时给 traceId 方便复制；同一种错误全站同一句话。
        anchors:
          - { spec: security, quote: MUST 禁止在错误消息、Toast、Modal、URL、日志、监控 payload 中暴露 token、密码、PII、内部 ID。 }
        enforcement: { kind: review }
        examples:
          - kind: dont
            title_zh: 把原始错误抛给用户
            code: |-
              message.error(error.response.data.exception)
            lang: ts
          - kind: do
            title_zh: 说清怎么办
            code: |-
              网络中断，修改已保存在本页。恢复后点「重试」。（问题编号 7f3a-21c9）
            lang: html

      - id: ERRH.NO_SWALLOW
        title_zh: 不吞错误
        statement_zh: catch 之后要么处理并告知用户，要么继续向上抛；不写空 catch，不只 console.log 了事；不用 try/catch 包住整段代码掩盖问题。
        anchors:
          - { spec: api, quote: MUST NOT 吞掉字段错误、冲突或 TraceId。 }
        enforcement: { kind: gate, check: error.no-empty-catch }
        examples:
          - kind: dont
            title_zh: 空 catch
            code: |-
              try { await save() } catch (e) {}
            lang: ts

      - id: ERRH.REPORT
        title_zh: 上报可定位、不刷屏
        statement_zh: 错误上报带版本、环境、页面、操作和 traceId，按去重键合并同类错误并采样；白屏、根组件渲染失败、接口失败率有告警；上报本身失败不影响用户操作。
        anchors:
          - { spec: obs, quote: 采集并分类运行错误、Promise rejection、资源失败、接口错误、白屏和根组件渲染失败 }
        enforcement: { kind: review }

  # ───────────────────────────── 工程规范 · 保护页 ─────────────────────────────
  - key: route_guard
    title_zh: 保护页
    group: engineering
    prefix: GUARD
    summary_zh: 每个路由声明访问要求；守卫集中在路由层；未登录去登录再回来；无权限与不存在有统一的页面；判定完成前不渲染受保护内容；会话过期保住现场；按钮级权限规则统一。
    rules:
      - id: GUARD.DECLARE
        title_zh: 每个路由声明访问要求
        statement_zh: 路由定义的 handle（或路由配置的元数据）里声明这个页面要求什么：是否登录、权限码、功能开关、布局；没有声明的路由在开发期就报错，不默认放行。
        anchors:
          - { spec: page, quote: 每个页面路由有稳定 name、path、page key、title、权限和布局 meta。 }
        enforcement: { kind: gate, check: guard.route-meta }
        examples:
          - kind: do
            title_zh: 路由声明访问要求
            code: |-
              { path: '/deployments', lazy: () => import('./pages/deployments'), handle: { title: '部署', auth: true, permission: 'deployment:read' } }
            lang: tsx

      - id: GUARD.CENTRAL
        title_zh: 守卫集中在路由层
        statement_zh: 访问判定只在路由层做一次（根路由的 loader 或统一的守卫组件，读 handle 与当前会话、权限），页面组件不各自判断；直接输入地址打开的页面同样经过守卫。
        anchors:
          - { spec: permission, quote: 直达 URL 仍经过页面权限守卫。 }
        enforcement: { kind: review }
        showcase:
          - kind: lab
            lab: guard.route
            title_zh: 实验：保护页与回跳
            description_zh: 以访客、只读成员、管理员身份打开受保护页面：访客去登录并在登录后回到原页面；只读成员看到无权限页；伪造的站外回跳地址被拒绝。

      - id: GUARD.LOGIN_REDIRECT
        title_zh: 未登录去登录再回来
        statement_zh: 未登录访问受保护页面时跳到登录页并带上当前地址作回跳；登录成功后回到原页面；回跳地址只接受站内相对路径（见 SEC.LINKS）；登录页本身不再要求登录。
        enforcement: { kind: review }

      - id: GUARD.FORBIDDEN
        title_zh: 无权限与不存在有统一的页面
        statement_zh: 无权限显示统一的 403 页（说明缺什么权限、找谁申请），资源不存在显示统一的 404 页（给返回列表的入口）；按安全要求，对不该知道存在与否的资源统一显示 404，不泄露它是否存在。
        anchors:
          - { spec: page, quote: 401、403、404、500 和资源删除有统一路由策略。 }
          - { spec: security, quote: MUST 对 401/403/404/409/422/429/5xx 分别处理，避免通过错误差异泄露权限/存在性信息。 }
        enforcement: { kind: review }

      - id: GUARD.NO_FLASH
        title_zh: 判定完成前不渲染受保护内容
        statement_zh: 会话和权限还在确认时显示页面级加载，不先渲染受保护内容再跳走（避免闪现敏感信息）；权限数据随会话一次取回并缓存，路由切换时不重复拉取。
        enforcement: { kind: review }

      - id: GUARD.EXPIRED
        title_zh: 会话过期保住现场
        statement_zh: 停留期间会话过期，下一次请求 401 时先静默刷新一次（见 SESSION.REFRESH）；仍失败就保存现场（路由与未提交的草稿）再去登录，登录后恢复；其他标签页同步处理。
        enforcement: { kind: review }

      - id: GUARD.BUTTON
        title_zh: 按钮级权限规则统一
        statement_zh: 页面内的操作按同一套权限判断：没有权限的操作隐藏，或禁用并说明原因（全项目选一种并写明）；同一个操作在列表、详情、右键菜单里的权限判断一致；后端仍然校验。
        params:
          mode: { decision: 无权限的操作是隐藏，还是禁用并说明原因？, candidates: [隐藏, 禁用并说明原因], label_zh: 无权限操作的呈现 }
        anchors:
          - { spec: permission, quote: SHOULD 对禁用动作展示只读原因。 }
        enforcement: { kind: review }

  # ───────────────────────────── 工程规范 · 页面加载 ─────────────────────────────
  - key: page_loading
    title_zh: 页面加载
    group: engineering
    prefix: PLOAD
    summary_zh: 路由分包并预取；首屏骨架保持布局；先框架后数据、核心优先；异步加载的边界给全加载、出错、超时；分包加载失败能自愈；不跳布局；字体与图片有加载策略。
    rules:
      - id: PLOAD.SPLIT
        title_zh: 路由分包并预取
        statement_zh: 每个路由懒加载成独立分包（lazy 路由或 React.lazy）；导航链接在悬停或进入视口时预取目标路由；首屏只加载当前路由需要的代码。
        anchors:
          - { spec: perf, quote: 路由、图表和重组件按需加载。 }
        enforcement: { kind: gate, check: perf.lazy-load }

      - id: PLOAD.SKELETON
        title_zh: 首屏骨架保持布局
        statement_zh: 首次加载用与真实内容同几何的骨架（同样的行高、列宽、卡片尺寸），不用整页转圈；骨架只覆盖还没到的区块，已经有的内容先显示。
        anchors:
          - { spec: page, quote: 首屏骨架保持主要布局尺寸。 }
        enforcement: { kind: review }

      - id: PLOAD.PROGRESSIVE
        title_zh: 先框架后数据、核心优先
        statement_zh: 页面框架（导航、标题、工具栏）立即出现；核心数据最先请求并渲染；图表、历史、推荐等非核心区块延后加载或进入视口再加载；多个区块的请求并行。
        anchors:
          - { spec: perf, quote: MUST NOT 串行发起可并行的页面初始化请求（须并行或后端聚合）。 }
        enforcement: { kind: review }

      - id: PLOAD.ASYNC_BOUNDARY
        title_zh: 异步边界给全加载、出错、超时
        statement_zh: Suspense 的 fallback 用区块骨架，外面包 ErrorBoundary 处理加载失败；数据加载给超时与重试入口。
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: Suspense 外包错误边界
            code: |-
              <ErrorBoundary fallback={<BlockError />}>
                <Suspense fallback={<ChartSkeleton />}>
                  <UsageChart />
                </Suspense>
              </ErrorBoundary>
            lang: tsx

      - id: PLOAD.CHUNK_ERROR
        title_zh: 分包加载失败能自愈
        statement_zh: 发布新版本后旧分包不存在（动态 import 失败）时，识别分包加载错误，提示「有新版本」并刷新一次到目标地址；同一会话只自动刷新一次，避免循环。
        enforcement: { kind: review }

      - id: PLOAD.NO_SHIFT
        title_zh: 不跳布局
        statement_zh: 图片、广告位、异步区块预留尺寸（宽高或 aspect-ratio）；字体加载不引起明显跳动；新内容插在用户视线下方或由用户触发；累计布局偏移守住性能预算。
        params:
          cls: { value: 0.1, source: SRC.POMASTER.PERF_SPEC, label_zh: CLS（p75） }
        enforcement: { kind: review }

      - id: PLOAD.ASSETS
        title_zh: 字体与图片有加载策略
        statement_zh: "字体用 font-display: swap 并只加载用到的字重；首屏大图预加载，其余图片懒加载（loading=\"lazy\"）并给出响应式尺寸；图标走图标库的按需引入，不加载整套字体图标。"
        enforcement: { kind: review }

  # ───────────────────────────── 工程规范 · 缓存 ─────────────────────────────
  - key: caching
    title_zh: 缓存
    group: engineering
    prefix: CACHE
    summary_zh: 分清每一层缓存的用途；每类数据定新鲜度；先显示旧数据、后台刷新；写后失效；按身份隔离；持久化只存可过期的非敏感数据；静态资源带指纹、入口页不缓存。
    rules:
      - id: CACHE.LAYERS
        title_zh: 分清每一层缓存
        statement_zh: HTTP 缓存管静态资源；查询缓存（TanStack Query）管接口数据；持久化缓存（localStorage、IndexedDB）只管偏好和离线需要的数据；Service Worker 只在明确需要离线时启用。同一份数据不在两层各缓存一份再手动同步。
        anchors:
          - { spec: state, quote: server state 由查询缓存层管理。 }
        enforcement: { kind: review }

      - id: CACHE.FRESHNESS
        title_zh: 每类数据定新鲜度
        statement_zh: 每类查询明确 staleTime：字典、配置这类少变的长，列表、详情短，实时数据不缓存；缓存保留时间（gcTime）默认 5 分钟，按需调整；默认失败重试 3 次（指数退避），写操作不自动重试。
        params:
          gc_time: { value: 5 分钟, source: SRC.TANSTACK.QUERY, label_zh: 缓存保留（gcTime 缺省） }
          query_retry: { value: 3, unit: count, source: SRC.TANSTACK.QUERY, label_zh: 查询失败重试（缺省） }
          dict_stale: { value: 1800000, unit: ms, source: SRC.POMASTER.DEFAULTS, label_zh: 字典新鲜度, note_zh: 字典类数据 30 分钟内视为新鲜；字典改动后由写操作主动失效 }
        anchors:
          - { spec: state, quote: 每个缓存声明 key、参数、身份/权限隔离、stale、保留和失效规则。 }
        enforcement: { kind: review }

      - id: CACHE.SWR
        title_zh: 先显示旧数据、后台刷新
        statement_zh: 有缓存时先显示旧数据并标出「更新中」，后台刷新后替换；不在刷新时清空列表造成闪烁；用户正在编辑的数据不被后台刷新覆盖。
        anchors:
          - { spec: state, quote: SHOULD 在后台刷新时保留可用旧数据并标识 stale。 }
        enforcement: { kind: review }
        showcase:
          - kind: lab
            lab: state.query-cache
            title_zh: 实验：查询缓存与失效
            description_zh: 切换筛选看缓存命中；让缓存过期后先显示旧数据再后台刷新；新建一条后对应的 key 失效并重新拉取。

      - id: CACHE.INVALIDATE
        title_zh: 写后失效
        statement_zh: 每个写操作声明它影响哪些查询（失效矩阵），成功后精确失效这些 key；不靠全量刷新页面；乐观更新的回滚和失效配套使用（见 STATE.CACHE_KEYS）。
        anchors:
          - { spec: state, quote: 写操作定义依赖失效矩阵。 }
          - { spec: state, quote: MUST NOT 成功后遗漏缓存刷新。 }
        enforcement: { kind: review }

      - id: CACHE.ISOLATION
        title_zh: 按身份隔离
        statement_zh: 查询 key 与持久化 key 都带用户、租户、数据范围；登出、切换租户、权限收缩时清理对应缓存；不同身份不复用同一份缓存。
        anchors:
          - { spec: state, quote: MUST NOT 多个用户、租户或权限范围复用未隔离的 key、数据库或缓存条目。 }
        enforcement: { kind: review }

      - id: CACHE.PERSIST
        title_zh: 持久化只存可过期的非敏感数据
        statement_zh: 写进浏览器的缓存登记用途、隔离 key、版本、大小和过期时间；读回先校验版本；不持久化接口的敏感数据和凭据；配额不足或写入失败时降级为只在内存里。
        anchors:
          - { spec: state, quote: MUST NOT 无限期持久化草稿、文件、接口响应或敏感偏好。 }
        enforcement: { kind: review }

      - id: CACHE.ASSETS
        title_zh: 静态资源带指纹、入口页不缓存
        statement_zh: 构建产物文件名带内容哈希并长缓存（immutable）；index.html 不缓存或每次校验（no-cache）；Service Worker 的缓存带版本，新版本激活时清理旧缓存。
        anchors:
          - { spec: state, quote: Service Worker 与 Cache API 必须限定作用域、版本化缓存、验证响应来源，并在发布和退出策略中清理过期内容。 }
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 入口页与静态资源的缓存头
            code: |-
              index.html      Cache-Control: no-cache
              /assets/*.js    Cache-Control: public, max-age=31536000, immutable
            lang: html

  # ───────────────────────────── 工程规范 · 异步处理 ─────────────────────────────
  - key: async
    title_zh: 异步处理
    group: engineering
    prefix: ASYNC
    summary_zh: 请求可取消；只认最新一次的结果；无依赖的并行、部分失败要处理；重试只对幂等与可重试错误、指数退避；输入防抖、滚动节流；轮询会暂停会停止；每个 Promise 都有去处。
    rules:
      - id: ASYNC.CANCEL
        title_zh: 请求可取消
        statement_zh: 请求接受 AbortSignal；重新输入、切换筛选、离开页面、组件卸载时取消进行中的请求；TanStack Query 会把 signal 传给 queryFn，接口层要接住它。
        anchors:
          - { spec: api, quote: 查询可取消和丢弃过期响应。 }
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 把 signal 传下去
            code: |-
              queryFn: ({ signal }) => api.listReceipts(filters, { signal })
            lang: ts

      - id: ASYNC.LATEST
        title_zh: 只认最新一次的结果
        statement_zh: 同一个视图的多次请求，只有最新一次的结果写进界面；写回前核对请求序号和当时的身份、租户、参数，旧的结果丢弃；已取消的请求不提示为错误。
        anchors:
          - { spec: api, quote: 请求结果提交前必须验证身份、租户、权限、参数和请求版本，防止旧上下文结果写回。 }
        enforcement: { kind: review }
        showcase:
          - kind: lab
            lab: state.race
            title_zh: 实验：迟到的响应不写回
            description_zh: 快速输入会发出多个请求，响应乱序到达；只有最新一次的结果写进列表。打开「错误做法」看旧结果覆盖新结果。

      - id: ASYNC.PARALLEL
        title_zh: 无依赖的并行、部分失败要处理
        statement_zh: 彼此无关的请求并行发出；需要全部结果时用 Promise.all，允许部分失败时用 Promise.allSettled 并逐项呈现失败；不在循环里逐个 await 彼此无关的请求。
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 部分失败逐项呈现
            code: |-
              const results = await Promise.allSettled(ids.map((id) => api.archive(id)))
              const failed = results.flatMap((result, index) => (result.status === 'rejected' ? [ids[index]] : []))
            lang: ts

      - id: ASYNC.RETRY
        title_zh: 重试只对幂等与可重试错误
        statement_zh: 只重试读请求和声明了幂等的写请求，且只在错误可重试时（网络错误、超时、5xx、429）；指数退避加随机抖动，有次数上限，服务端给了 Retry-After 就按它等；重试过程可以取消，用户能看到「正在重试」。
        params:
          max_attempts: { value: 3, unit: count, source: SRC.TANSTACK.QUERY, label_zh: 重试上限, note_zh: 与 TanStack Query 的缺省一致：失败的查询静默重试 3 次 }
          base_delay: { value: 1000, unit: ms, source: SRC.TANSTACK.QUERY, label_zh: 起始间隔, note_zh: 与 TanStack Query 的缺省退避一致：1 秒起，每次翻倍，上限 30 秒 }
        anchors:
          - { spec: api, quote: 重试必须服从幂等性、服务端 `Retry-After` 或受控退避，并能取消；取消或已被替代的请求不得提示为用户错误。 }
          - { spec: api, quote: MUST NOT 对非幂等 mutation 默认自动重试。 }
        enforcement: { kind: review }
        showcase:
          - kind: lab
            lab: async.retry
            title_zh: 实验：重试与退避
            description_zh: 调用一个时好时坏的接口：正确做法按指数退避重试、在上限内成功或明确失败；对不幂等的提交不自动重试。打开「错误做法」看立即重试把接口打爆。

      - id: ASYNC.DEBOUNCE
        title_zh: 输入防抖、滚动节流
        statement_zh: 随输入触发的查询做防抖；滚动、窗口尺寸变化、拖动这类高频事件做节流或合到动画帧；防抖和节流的间隔全项目统一。
        params:
          debounce: { value: 300, unit: ms, source: SRC.POMASTER.DEFAULTS, label_zh: 防抖间隔, note_zh: 与输入防抖同一取值 }
          throttle: { value: 100, unit: ms, source: SRC.POMASTER.DEFAULTS, label_zh: 节流间隔, note_zh: 滚动、拖拽每 100ms 最多处理一次；跟帧走的动画用 requestAnimationFrame }
        anchors:
          - { spec: perf, quote: 搜索防抖、旧请求取消、过期响应丢弃。 }
        enforcement: { kind: review }

      - id: ASYNC.POLLING
        title_zh: 轮询会暂停会停止
        statement_zh: 后台任务提交后轮询状态：间隔逐步加大，页面隐藏时暂停、回到页面时立即查一次，任务结束或离开页面时停止；能用服务端推送（SSE、WebSocket）就不轮询；同一任务只有一个轮询。
        anchors:
          - { spec: page, quote: 页面隐藏、冻结或进入前进后退缓存时必须暂停无必要轮询和高频工作；恢复时重新验证数据新鲜度、连接状态和权限上下文。 }
        enforcement: { kind: review }

      - id: ASYNC.NO_FLOATING
        title_zh: 每个 Promise 都有去处
        statement_zh: 每个 Promise 要么被 await，要么接上 catch 并处理；异步的事件处理器内部 try/catch，失败走错误处理；不留悬空的 Promise（失败会变成未处理的 rejection）。
        enforcement: { kind: review }
        examples:
          - kind: dont
            title_zh: 悬空的 Promise
            code: |-
              onMounted(() => { loadDashboard() })
            lang: ts
          - kind: do
            title_zh: 失败有去处
            code: |-
              onMounted(() => { loadDashboard().catch(reportAndShow) })
            lang: ts

  # ───────────────────────────── 工程规范 · 高并发 ─────────────────────────────
  - key: concurrency
    title_zh: 高并发
    group: engineering
    prefix: CONC
    summary_zh: 相同的在途请求合并；批量操作有并发上限；多个小请求合成批量接口；收到限流就退避排队；写冲突用版本号；实时推送重连退避、去重保序；高频更新合帧渲染。
    rules:
      - id: CONC.DEDUP
        title_zh: 相同的在途请求合并
        statement_zh: 同一个查询 key 在途时，新的调用复用同一个请求，不重复发；组件各自用同一个查询，由查询缓存层负责合并（TanStack Query 天然按 key 去重）。
        enforcement: { kind: review }
        showcase:
          - kind: lab
            lab: concurrency.pool
            title_zh: 实验：在途合并与并发上限
            description_zh: 三个组件同时要同一份数据：合并成一个请求。批量上传 10 个文件：并发池最多同时 3 个。打开「错误做法」看重复请求和同时发出 10 个请求。

      - id: CONC.LIMIT
        title_zh: 批量操作有并发上限
        statement_zh: 批量上传、批量导入、批量调用接口用并发池，同时进行的数量有上限，并显示整体进度；单项失败可以单独重试；不一次性发出全部请求。
        params:
          pool: { value: 4, unit: count, source: SRC.POMASTER.DEFAULTS, label_zh: 并发上限, note_zh: 浏览器对同一域名的并发连接有限（HTTP/1.1 通常 6 条），批量任务占 4 条，给页面其他请求留余量 }
        anchors:
          - { spec: perf, quote: 请求并发安全。 }
        enforcement: { kind: review }

      - id: CONC.BATCH
        title_zh: 多个小请求合成批量接口
        statement_zh: 要对很多对象做同一件事时调用批量接口，或在同一帧内把多个小请求合成一次；不在循环里逐条请求。
        enforcement: { kind: review }
        examples:
          - kind: dont
            title_zh: 循环里逐条请求
            code: |-
              for (const id of ids) await api.updateStatus(id, 'archived')
            lang: ts
          - kind: do
            title_zh: 批量接口
            code: |-
              await api.batchUpdateStatus({ ids, status: 'archived' })
            lang: ts

      - id: CONC.RATE_LIMIT
        title_zh: 收到限流就退避排队
        statement_zh: 收到 429 时读取 Retry-After，在客户端排队等待后再发，界面提示「请求过多，稍后自动重试」；不立即重发，不让多个组件同时各自重试。
        anchors:
          - { spec: api, quote: 409 返回冲突实体或重新获取方式；429 返回明确退避信息；5xx 不代表所有请求均可重试。 }
        enforcement: { kind: review }

      - id: CONC.VERSION
        title_zh: 写冲突用版本号
        statement_zh: 可编辑的资源带版本号（version、updatedAt 或 ETag），更新时一并提交；后端返回冲突时，给用户重新加载或比较合并的选择，不静默覆盖别人的修改。
        anchors:
          - { spec: api, quote: 可编辑资源返回 version、updatedAt 或 ETag，并在更新命令携带预期版本。 }
        enforcement: { kind: review }

      - id: CONC.REALTIME
        title_zh: 实时推送重连退避、去重保序
        statement_zh: WebSocket / SSE 断线后指数退避重连，重连后补拉断线期间的数据；消息按 messageId 去重、按序号保序；收到的消息先合并再渲染，不逐条触发整页更新。
        anchors:
          - { spec: api, quote: 必须定义鉴权、心跳、断线重连、重复、乱序、丢失、回放、完成终止和降级行为。 }
        enforcement: { kind: review }

      - id: CONC.RENDER
        title_zh: 高频更新合帧渲染
        statement_zh: 行情、日志、进度这类高频数据先进缓冲区，按动画帧（requestAnimationFrame）或固定间隔批量刷新界面；长列表虚拟化；不为每条消息触发一次状态更新。
        enforcement: { kind: review }

  # ───────────────────────────── 工程规范 · 防重复点击 ─────────────────────────────
  - key: click_guard
    title_zh: 防重复点击
    group: engineering
    prefix: CLICK
    summary_zh: 提交中锁住并显示加载；创建类写请求带幂等键；回车与按钮共用一把锁；刷新、点赞这类按钮节流或合并；重复导航不重复入栈；锁定期间有反馈；按钮锁只是体验，后端仍要幂等。
    rules:
      - id: CLICK.LOCK
        title_zh: 提交中锁住并显示加载
        statement_zh: 点击提交后按钮立即进入加载（Button 的 loading）并拒绝再次触发，请求结束（成功或失败）后解锁；锁放在提交函数里（或用 mutation 的 isPending），不只靠按钮的禁用样式。
        anchors:
          - { spec: page, quote: 提交防重复并保留失败输入。 }
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 用 mutation 的 isPending
            code: |-
              const create = useMutation({ mutationFn: (input) => api.createOrder(input, { idempotencyKey }) })
              <Button loading={create.isPending} onClick={() => !create.isPending && create.mutate(form)}>提交订单</Button>
            lang: tsx
        showcase:
          - kind: lab
            lab: click.guard
            title_zh: 实验：防重复点击
            description_zh: 连点「提交订单」五次：正确做法只发出一个请求，并且带同一个幂等键；错误做法发出五个请求、创建五张订单。

      - id: CLICK.IDEMPOTENCY
        title_zh: 创建类写请求带幂等键
        statement_zh: 创建订单、提交审批、发起支付这类写请求在表单打开时生成一个幂等键，提交和重试都复用它，成功后换新键；按钮锁只是体验保护，重复请求由后端按幂等键识别。
        params:
          header: { value: Idempotency-Key, source: SRC.IETF.IDEMPOTENCY_KEY, label_zh: 幂等键请求头 }
        anchors:
          - { spec: api, quote: 前端按钮禁用和 loading 只是体验保护，不构成业务幂等。 }
          - { spec: api, quote: MUST NOT 用按钮 loading 代替后端幂等。 }
        enforcement: { kind: review }

      - id: CLICK.ONE_PATH
        title_zh: 回车与按钮共用一把锁
        statement_zh: 表单的回车提交、按钮点击、快捷键都走同一个提交函数、共用同一把锁；不在两个地方各写一份提交逻辑。
        enforcement: { kind: review }

      - id: CLICK.THROTTLE
        title_zh: 刷新、点赞这类按钮节流或合并
        statement_zh: 刷新、点赞、收藏、切换这类可以重复触发的操作：刷新按钮在请求进行中不再发新的；点赞收藏先乐观改状态，连续点击只发最后一次的结果（防抖合并）。
        enforcement: { kind: review }

      - id: CLICK.NAVIGATION
        title_zh: 重复导航不重复入栈
        statement_zh: 连续点击同一个导航入口不重复压入历史记录、不重复打开同一个详情抽屉或新窗口；打开新窗口的操作在窗口打开前锁住。
        enforcement: { kind: review }

      - id: CLICK.FEEDBACK
        title_zh: 锁定期间有反馈
        statement_zh: 锁定期间按钮显示加载、文字说明正在做什么（「提交中…」），不静默吞掉点击；超过 1 秒还没结束的给出更明确的进度（见 SFB.PROGRESS）。
        enforcement: { kind: review }

  # ───────────────────────────── 工程规范 · 原型转换 ─────────────────────────────
  - key: prototype_intake
    title_zh: 原型转换
    group: engineering
    prefix: PROTO
    summary_zh: BA 交来的 spec 与 HTML 原型拆成四层：业务事实、信息结构、交互意图原样保留，表现全部丢掉；表现里藏着的事实翻译成语义；冲突进提问；按规范重绘后用同一个抽取器做事实对账。
    rules:
      - id: PROTO.LAYERS
        title_zh: 拆成四层，只丢表现
        statement_zh: 原型按四层读：业务事实（字段、操作、状态、有业务含义的文案）原样保留；信息结构（页面、区域、分组、顺序、主次）保留关系；交互意图（点什么打开什么、提交前校验、删除要确认）保留意图；表现（样式、栅格、间距、字体、组件长相）全部丢掉，由规范重新给出。不同 BA 写的原型结构与风格各不相同，读的是这四层，不是某一种写法。
        enforcement: { kind: review }
        showcase:
          - kind: specimen
            title_zh: 哪些保留、哪些丢掉
            description_zh: 判定口径：换一套 UI 以后，业务方会不会说「这不是我要的」——会，就是事实；不会，就是表现。
            name_label_zh: 原型里的内容
            rows:
              - name: 字段：标签、类型、必填、枚举值、校验、默认值、格式、能否编辑
                usage_zh: 业务事实 · 原样保留
                sample_zh: 保留
              - name: 操作：按钮与链接的文字、要求的权限、前置条件、是否二次确认
                usage_zh: 业务事实 · 原样保留
                sample_zh: 保留
              - name: 状态值与流转、有业务含义的文案（提示条、错误、空状态说明）
                usage_zh: 业务事实 · 原样保留
                sample_zh: 保留
              - name: 页面清单与页面类型、区域、字段分组与先后顺序、主次
                usage_zh: 信息结构 · 保留关系
                sample_zh: 保留关系
              - name: 页面之间与区域之间的跳转：点行开详情、新增开弹窗、返回
                usage_zh: 交互意图 · 保留意图
                sample_zh: 保留意图
              - name: class、内联样式、颜色、字体、字号、间距、圆角、阴影
                usage_zh: 表现 · 全部丢掉，改用规范 token
                sample_zh: 丢掉
              - name: 栅格列数、像素宽度、组件库与组件长相、图标库
                usage_zh: 表现 · 全部丢掉，改用规范组件
                sample_zh: 丢掉
              - name: 红字表示逾期、星号表示必填、删除线表示作废、右对齐表示金额
                usage_zh: 表现里藏着的事实 · 翻译成语义再保留
                sample_zh: 翻译

      - id: PROTO.EXTRACT
        title_zh: 去表现化抽取
        statement_zh: 用 pomaster prototype ingest 读原型：JS 渲染的页面先在浏览器里渲染再读（表格行、弹窗内容常常是脚本生成的）；隐藏的弹窗、抽屉也读，标为条件区域；丢掉 class、style、纯布局的包裹层，只留标题层级、地标、区域、字段、操作、表格（表头与示例行）、标签页、提示文字和状态值；每条事实带出处（文件、节点路径、文本指纹）。
        enforcement: { kind: review }
        showcase:
          - kind: lab
            lab: prototype.convert
            title_zh: 实验：原型转换与事实对账
            description_zh: 左边是一份样式很乱的原型片段；点「抽取」得到去掉表现后的大纲与事实清单；「对账」把按规范重绘的版本再抽一次，逐条比较。打开「错误做法」看重绘时漏掉一个字段、改掉一个选项后对账报出的差异。

      - id: PROTO.TRANSLATE
        title_zh: 表现里藏着的事实翻译成语义
        statement_zh: 表现里带业务含义的部分翻译成语义再保留，不照抄样子：标签旁的星号 → 必填；红色或绿色的状态文字 → 状态值与它的语气（危险、成功）；删除线 → 作废或删除状态；右对齐的数字列 → 数值列与格式；初始禁用的按钮 → 启用条件（要选中行才能用）；垃圾桶图标 → 删除意图；固定在左右的列 → 冻结列。颜色值、像素、字体名一律不带进实现。
        enforcement: { kind: review }

      - id: PROTO.SPEC_FACTS
        title_zh: spec 里读业务规则
        statement_zh: spec 按结构读而不是按格式读：字段表（中文名、英文名、类型、必填、编辑权限、枚举）、SHALL / MUST / 必须 一类规则句、枚举与默认值、状态流转、交互说明表、权限与角色表；每条带章节出处。读不出结构的段落原文保留为待确认的说明，不猜。
        enforcement: { kind: review }

      - id: PROTO.CONFLICTS
        title_zh: 冲突进提问，不自己挑
        statement_zh: spec 与 HTML 不一致（必填、枚举、字段有无）、原型与本规范冲突（例如原型每页 1000 条而规范上限 200 条）、原型里有 spec 没写的操作，都进 Question Gate 由人裁决；在裁决之前的默认口径：业务规则以 spec 为准，信息结构以 HTML 为准，呈现以本规范为准，并把这个默认写进提问里。
        enforcement: { kind: review }

      - id: PROTO.MAP
        title_zh: 映射到规范，记下依据
        statement_zh: 页面类型映射到规范的页面模板（列表、详情、表单、看板、向导），区域映射到规范的模式（筛选条、数据列表、描述列表、抽屉、分步表单……），元素映射到规范组件；每个映射在 UX 中间表示里记下依据的规则编号，后来的人和 agent 能复查。
        enforcement: { kind: review }

      - id: PROTO.REBUILD
        title_zh: 按规范重绘
        statement_zh: 重绘时布局、间距、字号、颜色、组件全部来自本规范的 token 与组件；不复制原型的 class、内联样式、字体、颜色值、栅格列数和像素宽度；原型里的分组、顺序、主次和文案保留。原型用了另一套组件库或 CDN 引入的样式框架，实现里都不出现。
        enforcement: { kind: gate, check: style.no-raw-color }

      - id: PROTO.VERIFY
        title_zh: 用同一个抽取器做事实对账
        statement_zh: 重绘完成后，用同一个抽取器读重绘后的页面，与事实清单逐条比较：缺失、改动、新增都为零（确需新增的事实走提问记录），同时规范门禁通过，才算转换完成；对账结果作为 verify 的证据。
        enforcement: { kind: review }
