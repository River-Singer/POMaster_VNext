status_legend:
  MECHANICAL_API_REQ_MATCH: fixtures[].scenario 与 api-requirement-registry requirements[].id 精确同形。仍属草表，落 KEYBINDING.* 对象前需人工复核一次。
  MECHANICAL_BLUEPRINT_MATCH: page_id 与 screen-blueprints/*.yaml 文件名精确同形。
  MECHANICAL_IMPL_FILE_PRESENT: canonical_implementation.file 锚路径字面在场（文件缓存存在性核验）。
  MECHANICAL_PACKAGE_JSON_BIJECTION: dependencies[].package 与 package.json 依赖并集双射（27↔27 零缺口）。
  MECHANICAL_TEMPLATE_MATCH: page_type 与 page-template-registry templates[].id 精确同键集。
  MECHANICAL_TOKEN_KEY_MAPPED: token_usage kebab 键经 token_generation_command 词形映射与 tokens.json camelCase 源键双向可解析（映射非漂移）。
  RESIDUAL_NO_API_REQ_ENTRY: 残差：fixtures[].scenario 在 api-requirement-registry 无对应条目（spec 侧 locale 契约在册但 registry/OpenAPI 缺位——归属裁决不在本批）。
  RESIDUAL_NO_PAGE_REGISTRY_ENTRY: 残差：boundaries[].page_id 在 application-page-registry pages[] 无条目（承 BATCH-1 screen_blueprints_not_in_pages 同一 4 页，分母歧义待人工裁决）。
  SEED_IMPL_FILE_MISSING: 形态登记：pattern-registry canonical_implementation.file 字面未落地（seed 先于实现的预期态，registry 自身 status 字段未标 implemented，非残差裁决；逐条登记供后续盘点对账）。
