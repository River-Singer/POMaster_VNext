# GENERATED by pomaster scaffold（spring-mybatis-plus@1）—— 管理侧应用配置。受管文件：改领域规格、确认后重新生成，手改会被一致性门禁拦下。
# 项目自己的配置写在 fleet-support/src/main/resources/support-admin.yml（优先于本文件）。
# 口令、密钥一律从环境变量或密钥管理服务注入，不写进仓库。
spring:
  application:
    name: fleet-admin-api
  config:
    import: optional:classpath:support-admin.yml
  datasource:
    # 例：jdbc:mysql://db:3306/fleet?connectionTimeZone=UTC&forceConnectionTimeZoneToSession=true
    url: ${FLEET_DB_URL}
    # 应用账号只有本面暴露所需的数据读写权限（backend/db/grants.sql）；迁移由迁移账号单独执行。
    username: ${FLEET_ADMIN_DB_USERNAME}
    password: ${FLEET_ADMIN_DB_PASSWORD}
  jackson:
    deserialization:
      fail-on-unknown-properties: true
  mvc:
    problemdetails:
      enabled: false

server:
  port: ${FLEET_ADMIN_PORT:8080}
  servlet:
    context-path: /admin/api/v1
  error:
    whitelabel:
      enabled: false

management:
  server:
    port: 8081
    address: ${FLEET_ADMIN_MANAGEMENT_ADDRESS:127.0.0.1}   # 部署时改成内网 / 运维网地址，不对公网暴露
  endpoints:
    web:
      exposure:
        include: health,info

mybatis-plus:
  global-config:
    banner: false

pomaster:
  rate-limit:
    # 按用户每分钟请求上限；页长上限 200 由接口参数校验。
    requests-per-minute: 600
