  classification: UNIVERSAL_POLICY
  sort: UNIVERSAL
  kind_proposal: policy
  enforcement: required_when_applicable
  vocab_pr_needed: true
  statement_zh: 自动化扫描通过不得单独充当可访问性验收证据；必须辅以人工键盘走查与读屏抽查。
  statement_en_keywords: automated scan insufficient, manual keyboard audit, screen reader spot check
  clean_room: true
  applies_when: {lane: frontend, condition: 可访问性验收出证时}
- proposed_id: POLICY.WEB.A11Y.ZOOM_REDUCED_MOTION
  source_section: MUST
  source_protocol: .trellis/spec/frontend/23-accessibility-protocol.md
  source_lines: L25
