        statement_zh: "MASTer 行级动作经统一列定义的 cellActions 声明为「图标+文字」按钮组（label/title 取文案常量），点击经 cell-action 事件上抛由页面按 actionKey 分发且必须阻断行选择与单元格点击通道；语义色随按钮 variant 表达（禁 tone 回调拼色与局部 CSS 覆盖）；动作格不渲染于 pinned 汇总行，锁定态整列移除；按钮容器间距取 token、行内动作用紧凑档。"
