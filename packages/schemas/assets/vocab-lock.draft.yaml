production_band_vocab:  # P34 Production Feedback / Control Band 词轴（PR-0004 收编；Owner 决议 2026-09-01 批准；§95/§30/§55.1/§90.4 逐字 + P34 任务定案补位词；schema 冻结锚 15-production-band definitions + kernel production.ts；扩值走词汇表 PR）
