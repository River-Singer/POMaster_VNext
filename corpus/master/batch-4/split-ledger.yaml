catalog_scope_note: 防范围膨胀：universal 半优先与既有 catalog 面审重（POLICY.WEB.API.SINGLE_HTTP_CLIENT/TRUSTED_ENDPOINT_SOURCE/ERROR_NORMALIZATION/RETRY_DISCIPLINE 等），确属缺口才立候选；候选 9 个归并为 6 个 merge_group（MG-ARCH-LAYER/MG-ARCH-BARREL/MG-ARCH-NAMING/MG-HTTP-RECOVERY/MG-PERF-SKELETON/MG-STYLE-MATRIX）。catalog-lock：候选物化时按 catalog/tools 既有模式同步 controlled_children（allowed+required 两处）并重生成 catalog-lock.draft.json（0 mismatch、幂等 byte-identical）。
clean_room_rule: D3 生死线：UNIVERSAL 条目全部独立改写（clean_room_rewrite_sketch 为改写词面，语义等价、词形独立），每条带 clean_room_note；sketch 词面零项目专名，catalog 条目 gate grep 面安全；catalog 物化（后续步骤）以 sketch 为底稿，禁回抄 MASTer 源文本。
decision_rule: 三选一：UNIVERSAL=换一个 Vue+FastAPI 项目仍成立的通用工程政策（上提 catalog，独立改写）；PROJECT=MASTer 专属事实（项目侧 truth 对象 + Baseline 引用）；HYBRID=骨架 universal+参数 project（拆两半分别落）。保守偏差：拿不准→PROJECT（catalog 防范围膨胀）。
