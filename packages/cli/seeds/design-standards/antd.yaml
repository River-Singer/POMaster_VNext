      - id: COLOR.TOKENS_ONLY
        title_zh: 颜色只经 token 取
        statement_zh: 组件和页面里的颜色只从主题 token 取（品牌色、文字色、边框色这类），不写十六进制或 rgb 字面量；换主题、换暗色时颜色才能一起变。
        anchors:
          - { spec: ui, quote: MUST NOT 在业务页面创建第二套视觉语言。 }
        enforcement: { kind: gate, check: style.no-raw-color }
        examples:
          - kind: do
            title_zh: 颜色从 token 取
            template: |-
              <span :style="{ color: t['color.brand.primary'], fontSize: t['typography.size.body'] + 'px' }">查看车型详情</span>
          - kind: dont
            title_zh: 写死色值
            code: |-
              .link { color: #1677ff; }
              .title { color: rgba(0, 0, 0, 0.88); }
            lang: css

      - id: COLOR.NEUTRAL_LAYERS
        title_zh: 中性色分层
        statement_zh: 中性色按用途分三层：文字四档（主要、次要、辅助、禁用），边框两档（控件边框、分割线），背景三档（页面底色、容器、浮层）。中性色用透明度实现，深浅背景上都保持同样的主次关系。
        params:
          page: { token: color.surface.page, label_zh: 页面底色 }
          container: { token: color.surface.container, label_zh: 容器 }
          border: { token: color.border.default, label_zh: 控件边框 }
          split: { token: color.border.subtle, label_zh: 分割线 }
        enforcement: { kind: review }
        showcase:
          - kind: palette
            title_zh: 中性色
            description_zh: 文字、边框、背景三层，取自主题 token。
            scales:
              - name: text
                label_zh: 文字
                swatches:
                  - { name: colorText, token: color.text.primary, usage_zh: 主要 }
                  - { name: colorTextSecondary, token: color.text.secondary, usage_zh: 次要 }
                  - { name: colorTextTertiary, token: color.text.tertiary, usage_zh: 辅助 }
                  - { name: colorTextQuaternary, token: color.text.disabled, usage_zh: 禁用 }
              - name: border
                label_zh: 边框
                swatches:
                  - { name: colorBorder, token: color.border.default, usage_zh: 控件边框 }
                  - { name: colorBorderSecondary, token: color.border.subtle, usage_zh: 分割线 }
              - name: surface
                label_zh: 背景
                swatches:
                  - { name: colorBgLayout, token: color.surface.page, usage_zh: 页面底色 }
                  - { name: colorBgContainer, token: color.surface.container, usage_zh: 容器 }
                  - { name: colorBgElevated, token: color.surface.elevated, usage_zh: 浮层 }

      - id: COLOR.BRAND
        title_zh: 品牌色
        statement_zh: 品牌色只用在关键行动点、选中与操作状态、重要信息高亮和图形化上；不用作大面积背景或装饰。
        params:
          primary: { token: color.brand.primary, label_zh: 品牌色 }
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 品牌色落在主按钮与链接上
            template: |-
              <div :style="{ display: 'flex', alignItems: 'center', gap: t['spacing.lg'] + 'px' }">
                <a-button type="primary">新建车型</a-button>
                <a :style="{ color: p.primary }">查看导入记录</a>
              </div>
          - kind: dont
            title_zh: 品牌色铺满整块区域
            code: |-
              .page-header { background: #1677ff; color: #fff; }
            lang: css
            note_zh: 大面积品牌色会抢走主按钮的注意力，页面里就没有「最重要的那个动作」了。

      - id: COLOR.STATUS
        title_zh: 状态色
        statement_zh: 成功、警告、错误、信息四种功能色只表达状态，同一产品里含义固定、不自定义；状态色总与文字或图标一起出现，不单靠颜色传达。
        params:
          success: { token: color.semantic.success, label_zh: 成功 }
          warning: { token: color.semantic.warning, label_zh: 警告 }
          error: { token: color.semantic.error, label_zh: 错误 }
          info: { token: color.semantic.info, label_zh: 信息 }
        anchors:
          - { spec: ui, quote: 颜色不得作为唯一信息来源；文本对比度至少 4.5:1 }
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 颜色配文字
            template: |-
              <div :style="{ display: 'flex', gap: t['spacing.sm'] + 'px' }">
                <a-tag color="success">已上线</a-tag>
                <a-tag color="warning">待审核</a-tag>
                <a-tag color="error">导入失败</a-tag>
                <a-tag color="processing">同步中</a-tag>
              </div>
          - kind: dont
            title_zh: 只有一个色点
            code: |-
              <span class="dot dot-red"></span>
            lang: html

      - id: COLOR.BORDERS
        title_zh: 边框
        statement_zh: 控件（输入框、按钮）用控件边框色；区块之间、列表行之间用分割线色。容器里的分割线画在边框里面，相邻容器不叠两条边框。
        params:
          border: { token: color.border.default, label_zh: 控件边框 }
          split: { token: color.border.subtle, label_zh: 分割线 }
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 分割线在卡片边框里面
            template: |-
              <div :style="{ width: '280px', border: '1px solid ' + p.split, borderRadius: t['radius.lg'] + 'px', background: t['color.surface.container'] }">
                <div :style="{ padding: t['spacing.md'] + 'px ' + t['spacing.lg'] + 'px', borderBottom: '1px solid ' + p.split, fontWeight: 500 }">导入中</div>
                <div :style="{ padding: t['spacing.md'] + 'px ' + t['spacing.lg'] + 'px', color: t['color.text.secondary'] }">车型数据导入完成后会通知你。</div>
              </div>

      - id: COLOR.NO_DECORATION
        title_zh: 不用装饰性效果
        statement_zh: 色彩用得克制，只为传递信息、引导操作和反馈交互服务；业务界面不用渐变、发光、彩色阴影这类装饰。插画和展示型页面可以例外。
        enforcement: { kind: review }
        examples:
          - kind: dont
            title_zh: 渐变按钮加发光
            code: |-
              .btn { background: linear-gradient(90deg, #722ed1, #1677ff); box-shadow: 0 0 12px #1677ff; }
            lang: css

  # ─────────────────────────── 基础 · 字体与富文本 ───────────────────────────
  - key: typography
    title_zh: 字体
    group: foundations
    prefix: TYPE
    summary_zh: 字体族、字阶、字重、文字颜色、等宽数字、富文本排版和文字溢出处理。
    rules:
      - id: TYPE.FAMILY
        title_zh: 字体族
        statement_zh: 界面文字用规范无衬线字体族，代码和需要等宽的数字用规范等宽字体族；不引入第三种字体，也不在单个组件里另外指定字体。
        params:
          sans: { token: typography.family.sans, label_zh: 无衬线字体族 }
          mono: { token: typography.family.mono, label_zh: 等宽字体族 }
        anchors:
          - { spec: ui, quote: MUST NOT 在业务页面创建第二套视觉语言。 }
        enforcement: { kind: gate, check: style.font-family-token }
        examples:
          - kind: do
            title_zh: 正文与代码
            template: |-
              <div :style="{ display: 'flex', flexDirection: 'column', gap: t['spacing.sm'] + 'px', color: t['color.text.primary'] }">
                <span :style="{ fontFamily: p.sans, fontSize: t['typography.size.body'] + 'px' }">车型编码只能包含大写字母、数字和连字符。</span>
                <code :style="{ fontFamily: p.mono, fontSize: t['typography.size.body'] + 'px' }">VM-2026-001</code>
              </div>

      - id: TYPE.SCALE
        title_zh: 字阶
        statement_zh: 字号只取字阶 12、14、16、20、24、30、38（46、56、68 只用于展示型页面），每级行高是字号加 8。正文 14 号、行高 22。一个系统里常用的字号控制在 5 种以内。
        params:
          scale: { value: [12, 14, 16, 20, 24, 30, 38], unit: px, source: SRC.ANTD.THEME.FONT_SIZES, label_zh: 字阶 }
          line_heights: { value: [20, 22, 24, 28, 32, 38, 46], unit: px, source: SRC.ANTD.THEME.FONT_SIZES, label_zh: 对应行高 }
          display_scale: { value: [46, 56, 68], unit: px, source: SRC.ANTD.THEME.FONT_SIZES, label_zh: 展示型字阶 }
          body: { token: typography.size.body, unit: px, label_zh: 正文字号 }
          body_line_height: { value: 22, unit: px, source: SRC.ANTD.SPEC.FONT, label_zh: 正文行高 }
          max_sizes: { value: 5, unit: count, source: SRC.ANTD.SPEC.FONT, label_zh: 常用字号种数上限 }
        enforcement: { kind: gate, check: style.font-size-scale }
        showcase:
          - kind: specimen
            title_zh: 字阶
            description_zh: 每级行高是字号加 8；正文 14 / 22。
            name_label_zh: 字号 / 行高
            rows:
              - name: 38 / 46
                usage_zh: 一级标题（内容型页面）
                template: |-
                  <span :style="{ fontSize: p.scale[6] + 'px', lineHeight: p.line_heights[6] + 'px', fontWeight: 600 }">车型管理</span>
              - name: 30 / 38
                usage_zh: 二级标题（内容型页面）
                template: |-
                  <span :style="{ fontSize: p.scale[5] + 'px', lineHeight: p.line_heights[5] + 'px', fontWeight: 600 }">车型管理</span>
              - name: 24 / 32
                usage_zh: 页面标题
                template: |-
                  <span :style="{ fontSize: p.scale[4] + 'px', lineHeight: p.line_heights[4] + 'px', fontWeight: 600 }">车型管理</span>
              - name: 20 / 28
                usage_zh: 区块标题
                template: |-
                  <span :style="{ fontSize: p.scale[3] + 'px', lineHeight: p.line_heights[3] + 'px', fontWeight: 600 }">基本信息</span>
              - name: 16 / 24
                usage_zh: 卡片标题、大号正文
                template: |-
                  <span :style="{ fontSize: p.scale[2] + 'px', lineHeight: p.line_heights[2] + 'px', fontWeight: 500 }">基本信息</span>
              - name: 14 / 22
                usage_zh: 正文，最常用
                template: |-
                  <span :style="{ fontSize: p.scale[1] + 'px', lineHeight: p.line_heights[1] + 'px' }">车型编码只能包含大写字母、数字和连字符。</span>
              - name: 12 / 20
                usage_zh: 辅助说明、标签、表格里的次要信息
                template: |-
                  <span :style="{ fontSize: p.scale[0] + 'px', lineHeight: p.line_heights[0] + 'px', color: t['color.text.tertiary'] }">最后更新于 2026-11-02 14:08</span>
        examples:
          - kind: dont
            title_zh: 字阶以外的 13px、17px
            code: |-
              .title { font-size: 17px; }
              .hint { font-size: 13px; }
            lang: css

      - id: TYPE.WEIGHT
        title_zh: 字重
        statement_zh: 正文用常规 400，需要强调的短文字用 500；600 只用于标题和英文加粗。强调时选一种手段，不要加粗、换色、放大同时叠加。
        params:
          regular: { value: 400, source: SRC.ANTD.SPEC.FONT, label_zh: 常规 }
          medium: { value: 500, source: SRC.ANTD.SPEC.FONT, label_zh: 中粗 }
          semibold: { token: typography.weight.semibold, label_zh: 标题 }
        enforcement: { kind: gate, check: style.font-weight-allowed }
        examples:
          - kind: do
            title_zh: 三种字重
            template: |-
              <div :style="{ display: 'flex', gap: t['spacing.xl'] + 'px', fontSize: t['typography.size.body_large'] + 'px', color: t['color.text.primary'] }">
                <span :style="{ fontWeight: p.regular }">400 常规</span>
                <span :style="{ fontWeight: p.medium }">500 中粗</span>
                <span :style="{ fontWeight: p.semibold }">600 标题</span>
              </div>

      - id: TYPE.LINE_ROLES
        title_zh: 单行与多行
        statement_zh: 单行文字（按钮、标签、表格单元、菜单项）放在控件高度里垂直居中，不另加行距；多行正文用字阶对应的行高（14 号配 22），段与段之间空一行的高度。
        params:
          control_height: { token: density.control_height, unit: px, label_zh: 控件高度 }
          body_line_height: { value: 22, unit: px, source: SRC.ANTD.SPEC.FONT, label_zh: 正文行高 }
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 单行在控件里居中，多行用正文行高
            template: |-
              <div :style="{ display: 'flex', flexDirection: 'column', alignItems: 'flex-start', gap: t['spacing.md'] + 'px', maxWidth: '360px' }">
                <a-button>导出车型</a-button>
                <p :style="{ margin: 0, fontSize: t['typography.size.body'] + 'px', lineHeight: p.body_line_height + 'px', color: t['color.text.secondary'] }">导出会包含当前筛选条件下的全部车型，文件生成后在消息中心下载，保留 7 天。</p>
              </div>

      - id: TYPE.COLOR
        title_zh: 文字颜色
        statement_zh: 文字颜色只用四档文本 token：主要、次要、辅助、禁用。正文、标题与背景的对比度以 7:1 为目标，最低不得低于 4.5:1；颜色不能是传达信息的唯一手段。
        params:
          primary: { token: color.text.primary, label_zh: 主要 }
          secondary: { token: color.text.secondary, label_zh: 次要 }
          tertiary: { token: color.text.tertiary, label_zh: 辅助 }
          disabled: { token: color.text.disabled, label_zh: 禁用 }
          contrast_target: { value: 7, unit: ratio, source: SRC.ANTD.SPEC.FONT, label_zh: 对比度目标 }
          contrast_min: { value: 4.5, unit: ratio, source: SRC.POMASTER.UI_SPEC, label_zh: 对比度下限 }
        anchors:
          - { spec: ui, quote: 颜色不得作为唯一信息来源；文本对比度至少 4.5:1 }
        enforcement: { kind: gate, check: style.no-raw-color }
        examples:
          - kind: do
            title_zh: 四档文本色
            template: |-
              <div :style="{ display: 'flex', flexDirection: 'column', gap: t['spacing.xs'] + 'px', fontSize: t['typography.size.body'] + 'px' }">
                <span :style="{ color: p.primary }">主要：车型名称、正文</span>
                <span :style="{ color: p.secondary }">次要：字段说明、辅助信息</span>
                <span :style="{ color: p.tertiary }">辅助：占位、时间戳</span>
                <span :style="{ color: p.disabled }">禁用：不可操作的内容</span>
              </div>

      - id: TYPE.TABULAR_NUMS
        title_zh: 等宽数字
        statement_zh: 需要上下对比的数字（金额、数量、时间列）用等宽数字（font-variant-numeric 取 tabular-nums），并右对齐。
        params:
          numeric: { value: tabular-nums, source: SRC.ANTD.SPEC.FONT, label_zh: font-variant-numeric }
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 等宽数字、右对齐
            template: |-
              <div :style="{ width: '160px', textAlign: 'right', fontVariantNumeric: p.numeric, color: t['color.text.primary'] }">
                <div>1,111.11</div><div>98,000.00</div><div>7.50</div>
              </div>
          - kind: dont
            title_zh: 比例数字、左对齐，位数对不齐
            template: |-
              <div :style="{ width: '160px', textAlign: 'left', color: t['color.text.primary'] }">
                <div>1,111.11</div><div>98,000.00</div><div>7.50</div>
              </div>

      - id: TYPE.READING
        title_zh: 长文行宽
        statement_zh: 说明、帮助文档这类长段落限制每行宽度，不随窗口无限拉宽；表格、表单这类结构化内容不受此限。
        params:
          max_chars: { value: 40, unit: chars, source: SRC.POMASTER.DEFAULTS, label_zh: 每行字数上限, note_zh: 中文长段落每行 35–45 字取中 }
        enforcement: { kind: review }
        examples:
          - kind: dont
            title_zh: 长段落铺满宽屏
            code: |-
              .help-text { width: 100%; }
            lang: css

      - id: TYPE.RICH_TEXT
        title_zh: 富文本
        statement_zh: 公告、帮助、说明等富文本统一放进 a-typography 里渲染，用组件自带的排版：段落之间隔一倍字高，列表每级缩进 20px 再加 4px，引用左侧 4px 竖线，行内代码字号 85%。业务页面不另写一套富文本样式。
        params:
          paragraph_gap: { value: 1, unit: em, source: SRC.ANTDV.TYPOGRAPHY, label_zh: 段落间距 }
          list_indent: { value: [20, 4], unit: px, source: SRC.ANTDV.TYPOGRAPHY, label_zh: 列表缩进（外边距 + 内边距） }
          quote_border: { value: 4, unit: px, source: SRC.ANTDV.TYPOGRAPHY, label_zh: 引用竖线宽度 }
          code_size: { value: 85, unit: percent, source: SRC.ANTDV.TYPOGRAPHY, label_zh: 行内代码字号 }
        anchors:
          - { spec: ui, quote: MUST NOT 在业务页面创建第二套视觉语言。 }
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 标题、段落、列表、引用、代码、按键、标记
            template: |-
              <a-typography style="max-width: 560px;">
                <a-typography-title :level="3">车型数据维护说明</a-typography-title>
                <a-typography-paragraph>车型是运输计划的基础数据。新建车型前，先确认 <a-typography-text code>business_code</a-typography-text> 没有被占用。</a-typography-paragraph>
                <a-typography-paragraph>
                  <ul>
                    <li>编码启用后不能修改；</li>
                    <li>停用的车型不会出现在下单页。</li>
                  </ul>
                </a-typography-paragraph>
                <a-typography-paragraph><blockquote>批量导入请先下载模板，按模板列填写。</blockquote></a-typography-paragraph>
                <a-typography-paragraph>按 <a-typography-text keyboard>Ctrl</a-typography-text> + <a-typography-text keyboard>S</a-typography-text> 保存；<a-typography-text mark>标记</a-typography-text>的字段必填。</a-typography-paragraph>
              </a-typography>

      - id: TYPE.OVERFLOW
        title_zh: 文字溢出
        statement_zh: 文字放不下时换行，或者单行省略、悬停显示全文；不得缩小字号硬塞进去。
        anchors:
          - { spec: ui, quote: 文本换行、截断、tooltip 和横向滚动有统一规则。 }
          - { spec: ui, quote: MUST NOT 通过缩小字体掩盖溢出。 }
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 单行省略，悬停看全文
            template: |-
              <a-typography-paragraph :style="{ width: '240px', margin: 0 }" :ellipsis="{ rows: 1, tooltip: true }" content="轻型厢式货车（国六排放，冷链改装版，适用于城市配送）" />
          - kind: dont
            title_zh: 缩小字号硬塞
            template: |-
              <div style="width: 240px; font-size: 10px; white-space: nowrap;">轻型厢式货车（国六排放，冷链改装版，适用于城市配送）</div>

  # ───────────────────────────── 基础 · 标题层级 ─────────────────────────────
  - key: headings
    title_zh: 标题层级
    group: foundations
    prefix: HEADING
    summary_zh: 应用界面最多三级标题；内容型页面用 1–5 级排版标题；语义层级与视觉层级一致、不跳级。
    rules:
      - id: HEADING.APP_LEVELS
        title_zh: 应用界面的标题级数
        statement_zh: 列表、表单、详情等工作页最多用三级标题：h1 是页面标题，20px；h2 是卡片或区块标题，16px；h3 是区块里的分组标题，14px；三级都用 600 字重。更细的层次用间距和分组表达，不再加标题级。
        surfaces: [admin]
        params:
          h1_size: { value: 20, unit: px, source: SRC.ANTDV.PAGE_HEADER, label_zh: h1 页面标题 }
          h2_size: { value: 16, unit: px, source: SRC.ANTDV.CARD, label_zh: h2 卡片 / 区块标题 }
          h3_size: { value: 14, unit: px, source: SRC.ANTDV.CARD, label_zh: h3 分组标题 }
          weight: { token: typography.weight.semibold, label_zh: 标题字重 }
        enforcement: { kind: gate, check: markup.heading-level-max }
        examples:
          - kind: do
            title_zh: 页面、区块、分组三级
            note_zh: a-card 的 title 不是标题元素；卡片标题要进页面大纲时，在 title 插槽里放 h2。
            template: |-
              <div :style="{ display: 'flex', flexDirection: 'column', gap: t['spacing.lg'] + 'px', color: t['color.text.primary'] }">
                <h1 :style="{ fontSize: p.h1_size + 'px', fontWeight: p.weight, margin: 0 }">车型管理</h1>
                <a-card>
                  <template #title><h2 :style="{ fontSize: p.h2_size + 'px', fontWeight: p.weight, margin: 0 }">基本信息</h2></template>
                  <h3 :style="{ fontSize: p.h3_size + 'px', fontWeight: p.weight, margin: '0 0 ' + t['spacing.sm'] + 'px' }">识别信息</h3>
                  <p :style="{ margin: 0 }">车型编码 VM-001 · 轻型厢式货车</p>
                </a-card>
              </div>

      - id: HEADING.SINGLE_H1
        title_zh: 每个视图一个 h1
        statement_zh: 每个页面视图（一个路由页面，或一个全屏抽屉、模态）只有一个一级标题，内容就是这个页面叫什么；路由切换后同步更新浏览器标签页标题。
        anchors:
          - { spec: ui, quote: 路由/页面切换后必须更新 document.title 并宣布页面变化 }
        enforcement: { kind: gate, check: markup.single-h1 }

      - id: HEADING.ORDER
        title_zh: 标题不跳级
        statement_zh: 标题的语义层级与视觉层级一致，逐级下降：h1 下面是 h2，h2 下面是 h3，不能从 h1 直接跳到 h3。
        anchors:
          - { spec: ui, quote: 标题层级 h1–h6 与视觉层级一致，不跳过层级 }
        enforcement: { kind: gate, check: markup.heading-order }
        examples:
          - kind: do
            title_zh: h1 → h2 → h3
            code: |-
              <h1>车型管理</h1>
                <h2>基本信息</h2>
                  <h3>识别信息</h3>
            lang: html
          - kind: dont
            title_zh: h1 直接跳到 h3
            code: |-
              <h1>车型管理</h1>
                <h3>识别信息</h3>
            lang: html

      - id: HEADING.CONTENT_LEVELS
        title_zh: 内容型页面的标题
        statement_zh: 帮助、公告、文章这类内容型页面用 a-typography-title 的 1–5 级：字号 38、30、24、20、16，行高 46、38、32、28、24，字重 600；标题前留 1.2 倍字高，标题后留 0.5 倍字高。
        params:
          sizes: { value: [38, 30, 24, 20, 16], unit: px, source: SRC.ANTD.THEME.FONT_SIZES, label_zh: 1–5 级字号 }
          line_heights: { value: [46, 38, 32, 28, 24], unit: px, source: SRC.ANTD.THEME.FONT_SIZES, label_zh: 1–5 级行高 }
          margin_top: { value: 1.2, unit: em, source: SRC.ANTDV.TYPOGRAPHY, label_zh: 标题前间距 }
          margin_bottom: { value: 0.5, unit: em, source: SRC.ANTDV.TYPOGRAPHY, label_zh: 标题后间距 }
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 五级排版标题
            template: |-
              <a-typography>
                <a-typography-title v-for="level in [1, 2, 3, 4, 5]" :key="level" :level="level">{{ level }} 级标题 · {{ p.sizes[level - 1] }}px</a-typography-title>
              </a-typography>

      - id: HEADING.REAL_ELEMENT
        title_zh: 用真正的标题元素
        statement_zh: 标题必须是 h1–h6 或 a-typography-title，不能用加粗的 div、span 冒充；反过来，只是想把文字放大加粗时也不要用标题元素。
        anchors:
          - { spec: ui, quote: 使用原生 HTML 语义可承载时优先使用原生元素 }
        enforcement: { kind: review }
        examples:
          - kind: dont
            title_zh: 加粗的 div 冒充标题
            code: |-
              <div class="big-bold">基本信息</div>
            lang: html

  # ───────────────────────────── 基础 · 图标 ─────────────────────────────
  - key: icons
    title_zh: 图标
    group: foundations
    prefix: ICON
    summary_zh: 一套图标库、一种系统图标风格；图标跟随文字的大小和颜色；同一动作同一图标；纯图标按钮有可访问名称。
    rules:
      - id: ICON.LIBRARY
        title_zh: 图标库
        statement_zh: 管理侧系统图标只用 @ant-design/icons-vue 的图标组件；不混用第二套图标库，也不用切图或内联 SVG 充当系统图标。用户侧（H5）的图标库待项目决定。
        params:
          admin_library: { value: "@ant-design/icons-vue", source: SRC.ANTDV.ICON, label_zh: 管理侧图标库 }
          public_library: { decision: 用户侧（H5）的图标库用哪一套？, candidates: [Vant Icon], label_zh: 用户侧图标库 }
        enforcement: { kind: gate, check: icon.single-library }

      - id: ICON.STYLE
        title_zh: 图标风格
        statement_zh: 同一界面的系统图标统一用线框风格（Outlined）；实心风格（Filled）只用于表达状态（成功、警告、错误、信息）；双色风格（TwoTone）只用于业务图标。
        params:
          system_style: { value: Outlined, source: SRC.POMASTER.PRESET, label_zh: 系统图标风格 }
          two_tone_scope: { value: 业务图标, source: SRC.ANTD.SPEC.ICON, label_zh: 双色风格的使用范围 }
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 操作用线框，状态用实心
            template: |-
              <div :style="{ display: 'flex', alignItems: 'center', gap: t['spacing.lg'] + 'px', fontSize: t['typography.size.body_large'] + 'px', color: t['color.text.primary'] }">
                <PlusOutlined /><EditOutlined /><DeleteOutlined /><SearchOutlined />
                <span :style="{ color: t['color.border.default'] }">|</span>
                <CheckCircleFilled :style="{ color: t['color.semantic.success'] }" />
                <ExclamationCircleFilled :style="{ color: t['color.semantic.warning'] }" />
                <CloseCircleFilled :style="{ color: t['color.semantic.error'] }" />
              </div>

      - id: ICON.SIZE
        title_zh: 图标尺寸
        statement_zh: 系统图标与相邻文字同字号：14 号正文配 14px 图标，16 号配 16px；控件里的指示图标（下拉箭头、清除）用 12px。业务图标只用 32、48、64 三档。
        params:
          with_body: { token: typography.size.body, unit: px, label_zh: 配正文 }
          with_large: { token: typography.size.body_large, unit: px, label_zh: 配大号文字 }
          indicator: { value: 12, unit: px, source: SRC.ANTDV.THEME_SEED, label_zh: 控件指示图标, note_zh: fontSizeIcon 取 fontSizeSM }
          business_sizes: { value: [32, 48, 64], unit: px, source: SRC.ANTD.SPEC.ICON, label_zh: 业务图标尺寸 }
        enforcement: { kind: review }
        showcase:
          - kind: specimen
            title_zh: 尺寸
            name_label_zh: 尺寸
            rows:
              - name: 12px
                usage_zh: 控件里的指示图标（下拉箭头、清除）
                template: |-
                  <DownOutlined :style="{ fontSize: p.indicator + 'px' }" />
              - name: 14px
                usage_zh: 配 14 号正文，最常用
                template: |-
                  <span :style="{ display: 'inline-flex', alignItems: 'center', gap: '8px', fontSize: p.with_body + 'px' }"><SearchOutlined />搜索车型</span>
              - name: 16px
                usage_zh: 配 16 号文字（大号按钮、卡片标题）
                template: |-
                  <span :style="{ display: 'inline-flex', alignItems: 'center', gap: '8px', fontSize: p.with_large + 'px' }"><SettingOutlined />车型设置</span>
              - name: 32 / 48 / 64px
                usage_zh: 业务图标（空状态、结果页、功能入口）
                template: |-
                  <span :style="{ display: 'inline-flex', alignItems: 'flex-end', gap: '16px', color: t['color.text.tertiary'] }"><CarOutlined :style="{ fontSize: p.business_sizes[0] + 'px' }" /><CarOutlined :style="{ fontSize: p.business_sizes[1] + 'px' }" /><CarOutlined :style="{ fontSize: p.business_sizes[2] + 'px' }" /></span>

      - id: ICON.SPACING
        title_zh: 图标与文字的间距
        statement_zh: 图标和文字之间留 8px；按钮里的图标间距由组件给出，不手动加空格或外边距。
        params:
          text_gap: { value: 8, unit: px, source: SRC.ANTD.SPEC.ICON, label_zh: 图标与文字间距 }
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 14px 文字配 14px 图标，间隔 8
            template: |-
              <span :style="{ display: 'inline-flex', alignItems: 'center', gap: p.text_gap + 'px', fontSize: t['typography.size.body'] + 'px', color: t['color.text.primary'] }"><SearchOutlined />搜索车型</span>
          - kind: dont
            title_zh: 用空格隔开
            code: |-
              <span><SearchOutlined />&nbsp;&nbsp;搜索车型</span>
            lang: vue

      - id: ICON.COLOR
        title_zh: 图标颜色
        statement_zh: 系统图标跟随相邻文字的颜色；只有表达状态时才用语义色 token（成功、警告、错误、信息），并且同时配文字，不能只靠图标颜色传达状态。
        params:
          success: { token: color.semantic.success }
          warning: { token: color.semantic.warning }
          error: { token: color.semantic.error }
          info: { token: color.semantic.info }
        anchors:
          - { spec: ui, quote: MUST NOT 仅通过颜色、hover 或 tooltip 传递关键信息。 }
        enforcement: { kind: gate, check: style.no-raw-color }
        examples:
          - kind: do
            title_zh: 语义色图标 + 状态文字
            template: |-
              <div :style="{ display: 'flex', gap: t['spacing.xl'] + 'px', fontSize: t['typography.size.body'] + 'px', color: t['color.text.primary'] }">
                <span :style="{ display: 'inline-flex', alignItems: 'center', gap: t['spacing.sm'] + 'px' }"><CheckCircleFilled :style="{ color: p.success }" />已启用</span>
                <span :style="{ display: 'inline-flex', alignItems: 'center', gap: t['spacing.sm'] + 'px' }"><ExclamationCircleFilled :style="{ color: p.warning }" />待审核</span>
                <span :style="{ display: 'inline-flex', alignItems: 'center', gap: t['spacing.sm'] + 'px' }"><CloseCircleFilled :style="{ color: p.error }" />已停用</span>
              </div>
          - kind: dont
            title_zh: 只有颜色点，没有文字
            template: |-
              <div :style="{ display: 'flex', gap: t['spacing.lg'] + 'px' }">
                <CheckCircleFilled :style="{ color: p.success }" /><CloseCircleFilled :style="{ color: p.error }" />
              </div>

      - id: ICON.SEMANTICS
        title_zh: 同一动作同一图标
        statement_zh: 同一个动作在全系统用同一个图标，按下表取用；表里没有的动作，先补进表再用。
        params:
          map:
            value:
              新建: PlusOutlined
              编辑: EditOutlined
              删除: DeleteOutlined
              搜索: SearchOutlined
              刷新: ReloadOutlined
              导出: DownloadOutlined
              导入: UploadOutlined
              筛选: FilterOutlined
              设置: SettingOutlined
              更多: MoreOutlined
              查看: EyeOutlined
              复制: CopyOutlined
            source: SRC.POMASTER.PRESET
            label_zh: 动作 → 图标
        anchors:
          - { spec: ui, quote: MUST NOT 同一路径使用不同文案或图标表示同一功能 }
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 动作图标对照
            template: |-
              <div :style="{ display: 'grid', gridTemplateColumns: 'repeat(4, minmax(0, 1fr))', gap: t['spacing.sm'] + 'px', maxWidth: '560px', fontSize: t['typography.size.body'] + 'px', color: t['color.text.primary'] }">
                <span v-for="(icon, action) in p.map" :key="action" :style="{ display: 'inline-flex', alignItems: 'center', gap: t['spacing.sm'] + 'px' }"><component :is="icon" />{{ action }}</span>
              </div>

      - id: ICON.BUTTON_LABEL
        title_zh: 纯图标按钮的名称
        statement_zh: 只有图标、没有文字的按钮必须带可访问名称（aria-label），悬停时用 tooltip 显示同样的文字。
        anchors:
          - { spec: ui, quote: MUST NOT 图标按钮缺少 aria-label 或等效可访问名称。 }
        enforcement: { kind: gate, check: markup.icon-button-label }
        examples:
          - kind: do
            title_zh: aria-label 与 tooltip 同名
            template: |-
              <a-tooltip title="刷新">
                <a-button shape="circle" aria-label="刷新"><template #icon><ReloadOutlined /></template></a-button>
              </a-tooltip>
          - kind: dont
            title_zh: 读屏只能读出「按钮」
            code: |-
              <a-button shape="circle"><template #icon><ReloadOutlined /></template></a-button>
            lang: vue

  # ───────────────────────────── 基础 · 材质 ─────────────────────────────
  - key: materials
    title_zh: 材质
    group: foundations
    prefix: MATERIAL
    summary_zh: 圆角三档、背景三层、阴影四个层级：第 0 层贴着页面没有阴影，第 1 层是被悬停的卡片，第 2 层是下拉面板，第 3 层是对话框。
    rules:
      - id: MATERIAL.RADIUS
        title_zh: 圆角
        statement_zh: 圆角只取三档：小尺寸控件 4，按钮、输入框等基础控件 6，卡片、对话框、下拉面板等大容器 8。同一层级的元素圆角一致，嵌套时内层不大于外层。
        params:
          sm: { token: radius.sm, unit: px, label_zh: 小尺寸控件 }
          md: { token: radius.md, unit: px, label_zh: 基础控件 }
          lg: { token: radius.lg, unit: px, label_zh: 大容器 }
        enforcement: { kind: review }
        showcase:
          - kind: specimen
            title_zh: 圆角
            name_label_zh: token
            rows:
              - name: borderRadiusSM · 4
                usage_zh: 小尺寸按钮、输入框
                template: |-
                  <div :style="{ width: '120px', height: '56px', borderRadius: p.sm + 'px', border: '1px solid ' + t['color.border.default'], background: t['color.surface.container'] }"></div>
              - name: borderRadius · 6
                usage_zh: 按钮、输入框、选择器
                template: |-
                  <div :style="{ width: '120px', height: '56px', borderRadius: p.md + 'px', border: '1px solid ' + t['color.border.default'], background: t['color.surface.container'] }"></div>
              - name: borderRadiusLG · 8
                usage_zh: 卡片、对话框、下拉面板
                template: |-
                  <div :style="{ width: '120px', height: '56px', borderRadius: p.lg + 'px', border: '1px solid ' + t['color.border.default'], background: t['color.surface.container'] }"></div>

      - id: MATERIAL.SURFACES
        title_zh: 页面内的表面
        statement_zh: 页面底色用布局背景，内容放在白色容器里；容器贴在页面上、没有阴影（第 0 层）。不在容器里再叠一层带底色的容器来区分层级，改用间距和分割线。
        params:
          page: { token: color.surface.page, label_zh: 页面底色 }
          container: { token: color.surface.container, label_zh: 容器 }
        enforcement: { kind: review }
        showcase:
          - kind: demo
            title_zh: 页面底色上的容器
            template: |-
              <div :style="{ padding: t['spacing.xl'] + 'px', background: p.page, borderRadius: t['radius.lg'] + 'px' }">
                <div :style="{ padding: t['spacing.lg'] + 'px', background: p.container, borderRadius: t['radius.lg'] + 'px' }">
                  <div :style="{ fontWeight: 500, marginBottom: t['spacing.sm'] + 'px' }">基本信息</div>
                  <div :style="{ color: t['color.text.secondary'] }">容器贴在页面底色上，没有阴影。</div>
                </div>
              </div>

      - id: MATERIAL.FLOATING
        title_zh: 浮层
        statement_zh: 浮在页面上的元素按层级取阴影：第 1 层是被悬停的卡片；第 2 层是下拉、气泡这类跟随触发元素的面板；第 3 层是对话框这类独立的层。浮层背景用浮层色。
        params:
          card: { token: elevation.card, label_zh: 第 1 层 }
          popover: { token: elevation.popover, label_zh: 第 2 层 }
          modal: { token: elevation.modal, label_zh: 第 3 层 }
        enforcement: { kind: review }
        showcase:
          - kind: specimen
            title_zh: 阴影层级
            description_zh: 默认主题里第 2、3 层取同一档阴影。
            name_label_zh: token
            rows:
              - name: boxShadowCard · 第 1 层
                usage_zh: 被悬停的卡片
                template: |-
                  <div :style="{ width: '120px', height: '56px', borderRadius: t['radius.lg'] + 'px', boxShadow: p.card, background: t['color.surface.elevated'] }"></div>
              - name: boxShadow · 第 2 层
                usage_zh: 下拉菜单、气泡卡片、选择器面板
                template: |-
                  <div :style="{ width: '120px', height: '56px', borderRadius: t['radius.lg'] + 'px', boxShadow: p.popover, background: t['color.surface.elevated'] }"></div>
              - name: boxShadow · 第 3 层
                usage_zh: 对话框、全局提示
                template: |-
                  <div :style="{ width: '120px', height: '56px', borderRadius: t['radius.lg'] + 'px', boxShadow: p.modal, background: t['color.surface.elevated'] }"></div>

      - id: MATERIAL.SHADOWS
        title_zh: 阴影
        statement_zh: 阴影只表达高度，不做装饰：离页面越远阴影越淡、越大。方向随位置：一般向下；底部工具栏向上；右侧抽屉与固定列向左，左侧导航与抽屉向右。
        params:
          layers: { value: 4, unit: count, source: SRC.ANTD.SPEC.SHADOW, label_zh: 层级数（含第 0 层） }
        enforcement: { kind: review }
        examples:
          - kind: dont
            title_zh: 卡片常驻一圈深色阴影
            code: |-
              .card { box-shadow: 0 0 16px rgba(0, 0, 0, 0.4); }
            lang: css
            note_zh: 平放的卡片在第 0 层，只有被悬停时才浮到第 1 层。

  # ───────────────────────────── 基础 · 圆角管理 ─────────────────────────────
  - key: radius
    title_zh: 圆角管理
    group: foundations
    prefix: RADIUS
    summary_zh: 圆角只取规范的档位；每类组件用哪一档有对照表；同一组件的尺寸越大圆角越大但有上限；嵌套时内层 = 外层 − 内边距；贴边与相接的那侧没有圆角；整圆只给短小的元素；媒体随容器裁切。
    rules:
      - id: RADIUS.TOKENS
        title_zh: 只用规范的圆角档
        statement_zh: 圆角值只取 MATERIAL.RADIUS 的三档（radius.sm / md / lg = 4 / 6 / 8），写成 token；组件库的圆角经主题 token（borderRadius、borderRadiusSM、borderRadiusLG）统一调，不在页面里逐个覆盖；不写 3px、5px、10px 这类档位外的值。
        anchors:
          - { spec: ui, quote: MUST NOT 写孤立色值、魔法间距和临时阴影。 }
        enforcement: { kind: gate, check: style.radius-token }
        examples:
          - kind: do
            title_zh: 用 token
            code: |-
              <div :style="{ borderRadius: t['radius.lg'] + 'px' }">…</div>
            lang: vue
          - kind: dont
            title_zh: 档位外的值
            code: |-
              .summary-card { border-radius: 10px; }
            lang: css

      - id: RADIUS.BY_COMPONENT
        title_zh: 组件与圆角对照
        statement_zh: 每类组件用哪一档圆角按对照表执行，新组件先归到表里的一类再取值；同一页面上同类组件的圆角一致。
        enforcement: { kind: review }
        showcase:
          - kind: specimen
            title_zh: 组件用哪一档圆角
            name_label_zh: 组件
            rows:
              - name: 小尺寸按钮、标签、复选框（borderRadiusSM）
                usage_zh: 4px
                template: |-
                  <div :style="{ display: 'flex', gap: t['spacing.sm'] + 'px', alignItems: 'center' }"><a-button size="small">小按钮</a-button><a-tag>标签</a-tag><a-checkbox :checked="true">复选</a-checkbox></div>
              - name: 按钮、输入框、选择器、提示气泡（borderRadius）
                usage_zh: 6px
                template: |-
                  <div :style="{ display: 'flex', gap: t['spacing.sm'] + 'px' }"><a-button>按钮</a-button><a-input placeholder="输入框" :style="{ width: '140px' }" /></div>
              - name: 大尺寸控件、卡片、对话框、下拉面板（borderRadiusLG）
                usage_zh: 8px
                template: |-
                  <a-card size="small" :style="{ width: '220px' }">卡片</a-card>
              - name: 头像、徽标计数、开关、进度条
                usage_zh: 整圆
                template: |-
                  <div :style="{ display: 'flex', gap: t['spacing.md'] + 'px', alignItems: 'center' }"><a-avatar>王</a-avatar><a-badge :count="5"><a-avatar shape="square">回</a-avatar></a-badge><a-switch :checked="true" /></div>

      - id: RADIUS.SIZE_SCALE
        title_zh: 尺寸越大圆角越大，但有上限
        statement_zh: 同一组件的小、中、大三种尺寸分别用 sm / md / lg 档（按钮、输入框、选择器一致）；容器越大圆角可以越大，但不超过 lg 档；不按像素尺寸按比例算圆角。
        enforcement: { kind: review }

      - id: RADIUS.NESTED
        title_zh: 嵌套时内层 = 外层 − 内边距
        statement_zh: "圆角容器里再放圆角元素时，内层圆角 = 外层圆角 − 两者之间的内边距（不小于 0），这样角落同心；内层直接贴边（没有内边距）时由外层裁切（overflow: hidden），内层不再单写圆角。"
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 内层减去内边距
            template: |-
              <div :style="{ padding: '4px', borderRadius: t['radius.lg'] + 'px', border: '1px solid ' + t['color.border.default'], width: '220px' }"><div :style="{ borderRadius: t['radius.sm'] + 'px', background: t['color.surface.page'], padding: t['spacing.md'] + 'px', color: t['color.text.primary'] }">外 8 − 内边距 4 = 内 4</div></div>
          - kind: dont
            title_zh: 内外同样的圆角
            template: |-
              <div :style="{ padding: '4px', borderRadius: t['radius.lg'] + 'px', border: '1px solid ' + t['color.border.default'], width: '220px' }"><div :style="{ borderRadius: t['radius.lg'] + 'px', background: t['color.surface.page'], padding: t['spacing.md'] + 'px', color: t['color.text.primary'] }">内外都是 8，角落不同心</div></div>

      - id: RADIUS.FLUSH
        title_zh: 贴边与相接的那侧没有圆角
        statement_zh: 元素贴着容器边缘时，贴边那一侧不要圆角（卡片顶部的封面图只保留上面两个角，表格贴满卡片时由卡片裁切）；按钮组、输入框与前后缀相接处圆角为 0，只保留整组外侧的圆角（用 a-space-compact、addonBefore / addonAfter，不手拼）。
        enforcement: { kind: review }

      - id: RADIUS.PILL
        title_zh: 整圆只给短小的元素
        statement_zh: 整圆（胶囊、圆形）只用于徽标、计数、标签型状态、开关、进度条和头像；按钮、输入框不做胶囊，除非整个产品在主题里统一改；圆形图标按钮宽高相等。
        enforcement: { kind: review }

      - id: RADIUS.MEDIA
        title_zh: 媒体随容器裁切
        statement_zh: 图片、视频、地图、图表在圆角容器里由容器裁切，不各自再加圆角；单独出现的缩略图用控件那一档；头像用整圆；用户上传的图片不加阴影、描边之外的装饰。
        enforcement: { kind: review }

  # ───────────────────────────── 基础 · 投影 ─────────────────────────────
  - key: elevation
    title_zh: 投影
    group: foundations
    prefix: ELEV
    summary_zh: 投影只表达离页面多远：四个层级各一个阴影 token；页面内的区块用边框不用阴影；不手写阴影、不做发光；悬停最多升一级；阴影层级与叠放层级同序；深色主题改用更亮的表面；吸顶与固定列的阴影只在滚动后出现。
    rules:
      - id: ELEV.LEVELS
        title_zh: 四个层级各一个阴影
        statement_zh: 层级固定为四层：0 层贴在页面上；1 层是悬停抬起与吸顶后的元素；2 层是下拉、气泡、悬浮按钮；3 层是对话框、抽屉、通知。每层只有一个阴影 token，组件按所在层级取用（方向规则见 MATERIAL.SHADOWS）。
        params:
          level_1: { token: elevation.card, label_zh: 第 1 层 }
          level_2: { token: elevation.popover, label_zh: 第 2 层 }
          level_3: { token: elevation.modal, label_zh: 第 3 层 }
        enforcement: { kind: review }
        showcase:
          - kind: specimen
            title_zh: 四个层级
            name_label_zh: 层级
            rows:
              - name: 第 0 层：贴在页面上（区块、表格、未悬停的卡片）
                usage_zh: 无阴影，用边框或底色区分
                template: |-
                  <div :style="{ width: '220px', height: '48px', borderRadius: t['radius.lg'] + 'px', border: '1px solid ' + t['color.border.subtle'], background: t['color.surface.container'] }"></div>
              - name: 第 1 层：可点卡片悬停、吸顶表头滚动后
                usage_zh: elevation.card
                template: |-
                  <div :style="{ width: '220px', height: '48px', borderRadius: t['radius.lg'] + 'px', background: t['color.surface.container'], boxShadow: t['elevation.card'] }"></div>
              - name: 第 2 层：下拉、气泡卡片、悬浮按钮
                usage_zh: elevation.popover
                template: |-
                  <div :style="{ width: '220px', height: '48px', borderRadius: t['radius.lg'] + 'px', background: t['color.surface.elevated'], boxShadow: t['elevation.popover'] }"></div>
              - name: 第 3 层：对话框、抽屉、通知
                usage_zh: elevation.modal（默认主题与第 2 层同值）
                template: |-
                  <div :style="{ width: '220px', height: '48px', borderRadius: t['radius.lg'] + 'px', background: t['color.surface.elevated'], boxShadow: t['elevation.modal'] }"></div>

      - id: ELEV.FLAT_FIRST
        title_zh: 页面内的区块用边框不用阴影
        statement_zh: 页面里的区块、表格、表单分组用边框或底色区分，不用阴影；阴影只给浮在页面上、或者正在被拖动的东西；同一个元素不同时用粗边框和大阴影。
        enforcement: { kind: review }

      - id: ELEV.ONE_TOKEN
        title_zh: 不手写阴影、不做发光
        statement_zh: 阴影只取 elevation token（或组件库的 boxShadow 一类主题 token），不手写 box-shadow；不做彩色、发光、内阴影装饰；光从上方来，阴影向下（特殊位置按 MATERIAL.SHADOWS）。
        anchors:
          - { spec: ui, quote: MUST NOT 写孤立色值、魔法间距和临时阴影。 }
        enforcement: { kind: gate, check: style.shadow-token }
        examples:
          - kind: dont
            title_zh: 彩色发光阴影
            code: |-
              .promo { box-shadow: 0 0 24px rgba(99, 102, 241, 0.6); }
            lang: css

      - id: ELEV.HOVER
        title_zh: 悬停最多升一级
        statement_zh: 可点的卡片悬停时从 0 层升到 1 层（见 HOVER.SUBTLE），不跳到 2、3 层；浮层本身悬停不再变化；拖动中的元素升到 2 层，放下后回到原层。
        enforcement: { kind: review }

      - id: ELEV.Z_PAIR
        title_zh: 阴影层级与叠放层级同序
        statement_zh: 阴影层级和叠放层级（z-index，见 LAYOUT.Z_INDEX）同序：叠放在下面的元素不能有更重的阴影；同一层的两个浮层互相覆盖时，后出现的在上面。
        enforcement: { kind: review }

      - id: ELEV.DARK
        title_zh: 深色主题改用更亮的表面
        statement_zh: 深色背景上阴影几乎看不见，深色主题里层级改用更亮一档的表面色加细边框表达；阴影 token 随主题切换，组件不判断当前主题。
        anchors:
          - { spec: ui, quote: 表格、图表、弹层、焦点和状态随主题同步。 }
        enforcement: { kind: review }

      - id: ELEV.STICKY
        title_zh: 吸顶与固定列的阴影只在滚动后出现
        statement_zh: 吸顶的表头、工具栏和固定列，只有在内容滚到它下面时才显示分隔阴影（a-table 的固定列与 sticky 表头就是这样），静止时不显示。
        enforcement: { kind: review }

  # ───────────────────────────── 基础 · 布局 ─────────────────────────────
  - key: layout
    title_zh: 布局
    group: foundations
    prefix: LAYOUT
    summary_zh: 页面骨架、适配基准与内容区尺寸。管理侧是「顶栏 + 左侧导航 + 内容区」，用户侧是移动端单列。
    rules:
      - id: LAYOUT.ADMIN_SHELL
        title_zh: 管理侧页面骨架
        statement_zh: 管理侧应用统一用「顶栏 + 左侧导航 + 内容区」骨架。顶栏放产品标识和全局操作，左侧放多级菜单，内容区承载页面本身；侧栏可以收起，收起后只留图标；内容区两侧不留白，随窗口伸缩。
        surfaces: [admin]
        params:
          header_height: { token: layout.header_height, unit: px, label_zh: 顶栏高度 }
          sider_width: { value: 200, unit: px, source: SRC.ANTD.COMP.LAYOUT, label_zh: 侧栏宽度 }
          sider_collapsed_width: { value: 80, unit: px, source: SRC.ANTD.COMP.LAYOUT, label_zh: 侧栏收起宽度 }
        anchors:
          - { spec: page, quote: 每类页面定义标题、面包屑、筛选、工具栏、主体、分页和详情位置。 }
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 顶栏 + 左侧导航 + 内容区
            template: |-
              <a-layout :style="{ height: '260px', border: '1px solid ' + t['color.border.subtle'] }">
                <a-layout-header :style="{ height: p.header_height + 'px', lineHeight: p.header_height + 'px', padding: '0 ' + t['spacing.xl'] + 'px', background: t['color.surface.container'], borderBottom: '1px solid ' + t['color.border.subtle'], color: t['color.text.primary'] }">车队管理 · 全局搜索 · 个人中心</a-layout-header>
                <a-layout>
                  <a-layout-sider :width="p.sider_width" theme="light" :style="{ borderRight: '1px solid ' + t['color.border.subtle'] }">
                    <a-menu mode="inline" :selected-keys="['vehicle-model']" :items="[{ key: 'vehicle-model', label: '车型管理' }, { key: 'dict', label: '数据字典' }, { key: 'plan', label: '运输计划' }]" />
                  </a-layout-sider>
                  <a-layout-content :style="{ padding: t['spacing.xl'] + 'px', background: t['color.surface.page'], color: t['color.text.secondary'] }">内容区随窗口伸缩</a-layout-content>
                </a-layout>
              </a-layout>

      - id: LAYOUT.PUBLIC_SHELL
        title_zh: 用户侧页面骨架
        statement_zh: 用户侧页面按移动端单列排布，宽度铺满视口；在 320 CSS px 宽度下内容仍能纵向阅读、不出现横向滚动；不得禁止缩放或锁定视口。
        surfaces: [public]
        params:
          min_viewport: { value: 320, unit: px, source: SRC.POMASTER.UI_SPEC, label_zh: 最窄验收视口 }
        anchors:
          - { spec: ui, quote: 内容在 320 CSS px 宽度下可纵向阅读，不出现横向滚动；不得禁用浏览器缩放或固定视口 }
        enforcement: { kind: review }

      - id: LAYOUT.ADAPTIVE
        title_zh: 适配基准与验收宽度
        statement_zh: 设计稿按 1440 宽的画板出；交付前在 1920、1440、1366、1280 四个宽度下逐一验收。左右布局时侧栏固定、内容区伸缩；内容区变窄时内容换行、折叠或出现横向滚动，不缩小字号。
        surfaces: [admin]
        params:
          artboard: { value: 1440, unit: px, source: SRC.ANTD.SPEC.LAYOUT, label_zh: 设计画板宽度 }
          acceptance_widths: { value: [1920, 1440, 1366, 1280], unit: px, source: SRC.ANTD.SPEC.LAYOUT, label_zh: 验收宽度 }
        anchors:
          - { spec: ui, quote: 响应式断点和密度切换有验收矩阵。 }
          - { spec: page, quote: MUST NOT 用缩小字体解决小屏。 }
        enforcement: { kind: review }

      - id: LAYOUT.CONTENT_REGION
        title_zh: 内容区边距与宽度
        statement_zh: 内容区内边距、相邻区块之间的间距、内容最大宽度全站各用一个值，都取规范 token，不在单个页面里另定。
        params:
          page_padding: { token: layout.page_padding, unit: px, label_zh: 内容区内边距 }
          section_gap: { token: spacing.section_gap, unit: px, label_zh: 区块间距, note_zh: 候选 24 或 32 }
          content_max_width: { token: layout.content_max_width, unit: px, label_zh: 内容最大宽度 }
        anchors:
          - { spec: ui, quote: MUST NOT 写孤立色值、魔法间距和临时阴影。 }
        enforcement: { kind: gate, check: style.spacing-scale }

      - id: LAYOUT.REFLOW
        title_zh: 先换行再缩小
        statement_zh: 宽度不够时，先让一行里的元素换行（按钮组、标签、筛选项），再考虑收进「更多」；不靠缩小字号或压缩间距硬塞进一行。
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 按钮组允许换行
            template: |-
              <div :style="{ width: '280px' }">
                <a-space wrap>
                  <a-button>导入</a-button>
                  <a-button>导出</a-button>
                  <a-button>批量编辑</a-button>
                  <a-button>同步到门店</a-button>
                </a-space>
              </div>

      - id: LAYOUT.OVERFLOW
        title_zh: 尺寸与滚动的归属
        statement_zh: 尺寸和滚动由外层容器负责，内层组件不得把外层撑破；固定格式的控件（日期、金额、状态标签）给出稳定宽度或最小、最大宽度。
        anchors:
          - { spec: ui, quote: 外层负责布局与 overflow，内层不得反向撑爆。 }
          - { spec: ui, quote: 固定格式控件定义稳定尺寸、min/max 或比例。 }
        enforcement: { kind: review }

      - id: LAYOUT.Z_INDEX
        title_zh: 层级
        statement_zh: z-index 只能取层级 token（下拉、气泡、消息、抽屉、模态各一档），不写死数字。
        params:
          layers: { value: { base: 0, sticky: 10, header: 100, popup_base: 1000 }, unit: none, source: SRC.ANTD.THEME.Z_INDEX, note_zh: 业务层只用 base / sticky / header 三档；下拉、气泡、消息、抽屉、模态都在 zIndexPopupBase（1000）之上由 antd 自己排，页面不再写弹层的 z-index }
        anchors:
          - { spec: ui, quote: z-index 只能来自层级 token。 }
        enforcement: { kind: gate, check: style.no-raw-z-index }

  # ───────────────────────────── 基础 · 栅格 ─────────────────────────────
  - key: grid
    title_zh: 栅格
    group: foundations
    prefix: GRID
    summary_zh: 24 列栅格；列间距固定、列宽伸缩；响应式只用规范断点。
    rules:
      - id: GRID.COLUMNS
        title_zh: 栅格列数
        statement_zh: 页面区块按 24 列栅格切分，每个区块从某一列开始、到某一列结束；不用小数跨度或百分比宽度拼区块。
        params:
          columns: { value: 24, unit: count, source: SRC.ANTD.SPEC.LAYOUT, label_zh: 列数 }
        enforcement: { kind: gate, check: grid.span-range }
        examples:
          - kind: do
            title_zh: 三个等宽区块各占 8 列
            template: |-
              <a-row :gutter="16">
                <a-col :span="8"><div class="std-block">span 8</div></a-col>
                <a-col :span="8"><div class="std-block">span 8</div></a-col>
                <a-col :span="8"><div class="std-block">span 8</div></a-col>
              </a-row>
          - kind: dont
            title_zh: 用百分比宽度拼区块
            note_zh: 百分比宽度不对齐栅格，和页面其他区块的列线错位。
            template: |-
              <div style="display: flex; gap: 10px;">
                <div class="std-block" style="width: 37%;">37%</div>
                <div class="std-block" style="width: 30%;">30%</div>
                <div class="std-block" style="width: 33%;">33%</div>
              </div>

      - id: GRID.GUTTER
        title_zh: 列间距
        statement_zh: 列间距（gutter）是固定值，不随窗口缩放，只取 16 或 24；窗口变化时变的是列宽，不是间距。
        params:
          gutter: { value: [16, 24], unit: px, source: SRC.ANTD.SPEC.BASICS, label_zh: 允许的列间距 }
        enforcement: { kind: gate, check: grid.gutter-allowed }
        examples:
          - kind: do
            title_zh: gutter 取 16
            template: |-
              <a-row :gutter="p.gutter[0]">
                <a-col :span="6" v-for="n in 4" :key="n"><div class="std-block">span 6</div></a-col>
              </a-row>
          - kind: dont
            title_zh: gutter 取 10
            template: |-
              <a-row :gutter="10">
                <a-col :span="6" v-for="n in 4" :key="n"><div class="std-block">span 6</div></a-col>
              </a-row>

      - id: GRID.ROW_SUM
        title_zh: 一行的列数之和
        statement_zh: 同一行里各列跨度之和不超过 24。需要换行就拆成两行，不靠超出后自动折行。
        params:
          columns: { value: 24, unit: count, source: SRC.ANTD.SPEC.LAYOUT, label_zh: 一行列数上限 }
        enforcement: { kind: gate, check: grid.row-sum }
        examples:
          - kind: do
            title_zh: 拆成两行
            template: |-
              <div style="display: flex; flex-direction: column; gap: 16px;">
                <a-row :gutter="16"><a-col :span="12"><div class="std-block">span 12</div></a-col><a-col :span="12"><div class="std-block">span 12</div></a-col></a-row>
                <a-row :gutter="16"><a-col :span="8"><div class="std-block">span 8</div></a-col></a-row>
              </div>
          - kind: dont
            title_zh: 12 + 12 + 8 = 32，第三列被挤到下一行
            template: |-
              <a-row :gutter="16">
                <a-col :span="12"><div class="std-block">span 12</div></a-col>
                <a-col :span="12"><div class="std-block">span 12</div></a-col>
                <a-col :span="8"><div class="std-block">span 8</div></a-col>
              </a-row>

      - id: GRID.BREAKPOINTS
        title_zh: 断点
        statement_zh: 响应式只用规范断点（sm 576、md 768、lg 992、xl 1200），在 a-col 上用 xs / sm / md / lg / xl 声明各断点的跨度；样式里不自定义媒体查询断点。
        params:
          sm: { token: breakpoints.sm, unit: px }
          md: { token: breakpoints.md, unit: px }
          lg: { token: breakpoints.lg, unit: px }
          xl: { token: breakpoints.xl, unit: px }
        anchors:
          - { spec: ui, quote: 响应式断点和密度切换有验收矩阵。 }
        enforcement: { kind: gate, check: style.breakpoint-allowed }
        examples:
          - kind: do
            title_zh: 小屏一列、中屏两列、大屏四列
            template: |-
              <a-row :gutter="16">
                <a-col v-for="n in 4" :key="n" :xs="24" :md="12" :xl="6" style="margin-bottom: 16px;"><div class="std-block">xs 24 · md 12 · xl 6</div></a-col>
              </a-row>

      - id: GRID.GUIDES
        title_zh: 参考线
        statement_zh: 栅格参考线只在设计稿和调试时使用，业务界面不把栅格线画出来；需要表达二维结构时用卡片和分割线。
        enforcement: { kind: review }
        examples:
          - kind: dont
            title_zh: 把栅格线画进业务界面
            code: |-
              .page { background-image: repeating-linear-gradient(90deg, #f0f0f0 0 1px, transparent 1px 4.1667%); }
            lang: css

  # ───────────────────────────── 基础 · 间距 ─────────────────────────────
  - key: spacing
    title_zh: 间距
    group: foundations
    prefix: SPACING
    summary_zh: 间距只取间距阶梯；用小、中、大三档间距表达元素之间关系的远近。
    rules:
      - id: SPACING.SCALE
        title_zh: 间距阶梯
        statement_zh: 间距只取间距阶梯 4、8、12、16、24、32。基础单位是 8，4 和 12 只用于组件内部的紧凑间距。margin、padding、gap 不写阶梯以外的数值，比如 10px、13px、15px。
        params:
          base_unit: { value: 8, unit: px, source: SRC.ANTD.SPEC.LAYOUT, label_zh: 基础单位 }
          xs: { token: spacing.xs, unit: px }
          sm: { token: spacing.sm, unit: px }
          md: { token: spacing.md, unit: px }
          lg: { token: spacing.lg, unit: px }
          xl: { token: spacing.xl, unit: px }
          xxl: { token: spacing.xxl, unit: px }
        anchors:
          - { spec: ui, quote: MUST NOT 写孤立色值、魔法间距和临时阴影。 }
        enforcement: { kind: gate, check: style.spacing-scale }
        examples:
          - kind: do
            title_zh: 间距阶梯
            template: |-
              <div :style="{ display: 'flex', alignItems: 'flex-end', gap: p.xl + 'px' }">
                <div v-for="v in [p.xs, p.sm, p.md, p.lg, p.xl, p.xxl]" :key="v" :style="{ display: 'flex', flexDirection: 'column', alignItems: 'center', gap: p.sm + 'px' }">
                  <div :style="{ width: v + 'px', height: v + 'px', background: t['color.brand.primary'] }"></div>
                  <span :style="{ color: t['color.text.secondary'] }">{{ v }}</span>
                </div>
              </div>
          - kind: dont
            title_zh: 照着截图量出来的 13px、15px
            code: |-
              .vehicle-card { padding: 13px 15px; margin-bottom: 10px; }
            lang: css

      - id: SPACING.TIERS
        title_zh: 间距分档
        statement_zh: 用三档纵向间距表达关系远近：同一组里的元素用小间距 8，组与组之间用中间距 16，区块与区块之间用大间距 24。关系越近，间距越小；不要整页只用一个间距。
        params:
          small: { token: spacing.sm, unit: px, source: SRC.ANTD.SPEC.PROXIMITY, label_zh: 组内 }
          middle: { token: spacing.lg, unit: px, source: SRC.ANTD.SPEC.PROXIMITY, label_zh: 组间 }
          large: { token: spacing.xl, unit: px, source: SRC.ANTD.SPEC.PROXIMITY, label_zh: 区块间 }
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 组内 8、组间 16、区块间 24
            template: |-
              <div :style="{ display: 'flex', flexDirection: 'column', gap: p.large + 'px', color: t['color.text.primary'] }">
                <section :style="{ display: 'flex', flexDirection: 'column', gap: p.middle + 'px' }">
                  <div :style="{ display: 'flex', flexDirection: 'column', gap: p.small + 'px' }"><strong>识别信息</strong><span>车型编码：VM-001</span><span>车型名称：轻型厢式货车</span></div>
                  <div :style="{ display: 'flex', flexDirection: 'column', gap: p.small + 'px' }"><strong>状态</strong><span>启用</span></div>
                </section>
                <section :style="{ display: 'flex', flexDirection: 'column', gap: p.small + 'px' }"><strong>规格参数</strong><span>载重：1.5 吨</span><span>车厢长度：4.2 米</span></section>
              </div>
          - kind: dont
            title_zh: 所有元素一个间距，看不出分组
            template: |-
              <div :style="{ display: 'flex', flexDirection: 'column', gap: p.middle + 'px', color: t['color.text.primary'] }">
                <strong>识别信息</strong><span>车型编码：VM-001</span><span>车型名称：轻型厢式货车</span><strong>状态</strong><span>启用</span><strong>规格参数</strong><span>载重：1.5 吨</span>
              </div>

  # ───────────────────────────── 基础 · 动效 ─────────────────────────────
  - key: motion
    title_zh: 动效
    group: foundations
    prefix: MOTION
    summary_zh: 动效遵循自然、高效、克制：只为反馈、说明层级和变化服务；时长取三档 token；系统要求减少动效时只保留淡入淡出。
    rules:
      - id: MOTION.PURPOSE
        title_zh: 动效要有理由
        statement_zh: 每个动效都要说得出目的：给操作反馈、说明元素之间的层级与空间关系、或解释界面发生了什么变化。没有目的的动效不加；出场比进场更快、更简单，不排队依次出场。
        enforcement: { kind: review }
        examples:
          - kind: dont
            title_zh: 列表每行依次飞入
            code: |-
              .row { animation: fly-in 0.6s ease both; }
              .row:nth-child(n) { animation-delay: calc(var(--i) * 80ms); }
            lang: css

      - id: MOTION.DURATION
        title_zh: 时长与缓动
        statement_zh: 时长只取三档：小元素（按钮、开关、勾选）快速，中等元素（下拉、提示）中速，大元素（抽屉、对话框）慢速。缓动用主题预设曲线，不自定义。
        params:
          fast: { token: motion.fast, label_zh: 快速 }
          normal: { token: motion.normal, label_zh: 中速 }
          slow: { token: motion.slow, label_zh: 慢速 }
          ease_in_out: { value: "cubic-bezier(0.645, 0.045, 0.355, 1)", source: SRC.ANTDV.THEME_SEED, label_zh: 进出缓动 }
          ease_out: { value: "cubic-bezier(0.215, 0.61, 0.355, 1)", source: SRC.ANTDV.THEME_SEED, label_zh: 进场缓动 }
        enforcement: { kind: review }
        showcase:
          - kind: specimen
            title_zh: 时长
            description_zh: 把指针移到轨道上看速度。
            name_label_zh: token
            rows:
              - name: motionDurationFast · 0.1s
                usage_zh: 按钮、开关、勾选
                template: |-
                  <div class="std-motion-track"><span class="std-motion-dot" :style="{ transitionDuration: p.fast, transitionTimingFunction: p.ease_in_out }"></span></div>
              - name: motionDurationMid · 0.2s
                usage_zh: 下拉、提示、展开收起
                template: |-
                  <div class="std-motion-track"><span class="std-motion-dot" :style="{ transitionDuration: p.normal, transitionTimingFunction: p.ease_in_out }"></span></div>
              - name: motionDurationSlow · 0.3s
                usage_zh: 抽屉、对话框
                template: |-
                  <div class="std-motion-track"><span class="std-motion-dot" :style="{ transitionDuration: p.slow, transitionTimingFunction: p.ease_in_out }"></span></div>

      - id: MOTION.REDUCED
        title_zh: 减少动效
        statement_zh: 系统开启「减少动态效果」时，去掉位移、缩放、弹跳类动效，只保留淡入淡出或直接切换；加载指示保留，但不另加动画。
        anchors:
          - { spec: ui, quote: 尊重 prefers-reduced-motion：动画、滚动、过渡在减少动效模式下关闭或降级 }
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 全局降级
            code: |-
              @media (prefers-reduced-motion: reduce) {
                *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; scroll-behavior: auto !important; }
              }
            lang: css

  # ───────────────────────────── 基础 · 点击反馈 ─────────────────────────────
  - key: press_feedback
    title_zh: 点击反馈
    group: foundations
    prefix: PRESS
    summary_zh: 每个可点的元素都有默认、悬停、按下、聚焦与禁用；按下的瞬间就有反馈，颜色加深一档、不移动不变尺寸；波纹只用组件库自带的；时长取快档；触屏去掉点击延迟、目标够大；键盘触发同样的反馈；禁用与加载中不响应；减少动效时只保留颜色变化。
    rules:
      - id: PRESS.STATES
        title_zh: 可点的元素都有五态
        statement_zh: 每个可点的元素都设计默认、悬停、按下、聚焦、禁用五态；按下态在按下的瞬间出现，不等请求返回；松开后回到悬停态。
        anchors:
          - { spec: ui, quote: hover、active、focus、disabled、loading、empty、error 状态完整。 }
        enforcement: { kind: review }
        showcase:
          - kind: demo
            title_zh: 按下态
            description_zh: 按住按钮看按下态；松开回到悬停态。
            template: |-
              <div :style="{ display: 'flex', gap: t['spacing.md'] + 'px', alignItems: 'center' }">
                <a-button type="primary">按住看按下态</a-button>
                <a-button>次要按钮</a-button>
                <a-switch :checked="!!s.on" @change="(v) => (s.on = v)" />
                <a-checkbox :checked="!!s.agree" @change="(e) => (s.agree = e.target.checked)">同意</a-checkbox>
              </div>

      - id: PRESS.VISUAL
        title_zh: 按下时颜色加深一档
        statement_zh: 按下时颜色比悬停再深一档（主题的 colorPrimaryActive 一类 token，组件已内置）；不移动位置、不改尺寸、不改边框宽度；antd 组件不另加缩放。
        enforcement: { kind: review }

      - id: PRESS.WAVE
        title_zh: 波纹只用组件库自带的
        statement_zh: 按钮、开关、复选框自带点击波纹（Wave），保持开启、不另写 ripple；列表行、表格行、卡片不加波纹，按下用背景色变化表示。
        enforcement: { kind: review }

      - id: PRESS.TIMING
        title_zh: 按下即时、回弹取快档
        statement_zh: 按下态即时出现（不加过渡延迟），松开回弹用快档时长；点击动画不长于 200ms，也不阻塞下一次点击。
        params:
          release: { token: motion.fast, label_zh: 回弹时长 }
        enforcement: { kind: review }

      - id: PRESS.TOUCH
        title_zh: 触屏：无延迟、目标够大
        statement_zh: "可点元素设 touch-action: manipulation 去掉双击缩放带来的点击延迟；去掉系统的灰色点按高亮时必须提供自己的按下态；点击目标至少 24×24 CSS px（建议 44×44），相邻目标之间留出间距。"
        params:
          target_min: { value: 24, unit: px, source: SRC.POMASTER.UI_SPEC, label_zh: 最小点击目标 }
        anchors:
          - { spec: ui, quote: 触控目标尺寸至少 24×24 CSS px，且目标之间提供足够间距（WCAG 2.5.8）；建议达到 44×44（AAA）。 }
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 触屏点按
            code: |-
              button, a, [role='button'] {
                touch-action: manipulation;
                -webkit-tap-highlight-color: transparent; /* 前提：有自己的 :active 样式 */
              }
            lang: css

      - id: PRESS.KEYBOARD
        title_zh: 键盘触发同样的反馈
        statement_zh: 可点元素用真正的 button / a 元素，空格与回车能触发并显示按下态；用 div 模拟按钮时要补上 role、tabindex 和键盘处理，否则不算可点。
        enforcement: { kind: review }

      - id: PRESS.DISABLED
        title_zh: 禁用与加载中不响应
        statement_zh: 禁用和加载中的元素没有悬停、按下效果，点击不触发任何反馈动画；禁用的光标为 not-allowed；加载中的按钮保持宽度不变（见 CMP.BUTTON.LOADING）。
        enforcement: { kind: review }

      - id: PRESS.REDUCED
        title_zh: 减少动效时只保留颜色变化
        statement_zh: 减少动效模式下去掉缩放与波纹，保留按下时的颜色变化；状态仍然看得出来。
        anchors:
          - { spec: ui, quote: 尊重 prefers-reduced-motion：动画、滚动、过渡在减少动效模式下关闭或降级 }
        enforcement: { kind: review }

  # ───────────────────────────── 基础 · 焦点环 ─────────────────────────────
  - key: focus_ring
    title_zh: 焦点环
    group: foundations
    prefix: FOCUS
    summary_zh: 焦点只在键盘聚焦时显示且永远不去掉；全站一种焦点样式；与相邻颜色有足够对比；不被裁切、不被吸顶栏遮住；焦点顺序与视觉顺序一致，弹层进出时焦点有去处；焦点环跟随元素圆角。
    rules:
      - id: FOCUS.VISIBLE
        title_zh: 键盘聚焦时显示，永远不去掉
        statement_zh: "焦点样式写在 :focus-visible 上（鼠标点击不出现，键盘聚焦一定出现）；不写 outline: none 而不给同等可见的替代。"
        anchors:
          - { spec: ui, quote: MUST NOT 移除焦点轮廓而无同等级可见替代。 }
        enforcement: { kind: review }
        examples:
          - kind: dont
            title_zh: 去掉焦点不给替代
            code: |-
              button:focus { outline: none; }
            lang: css
        showcase:
          - kind: demo
            title_zh: 用 Tab 键依次聚焦
            description_zh: 点击不出焦点环，按 Tab 才出；自定义元素与组件同一种样式。
            template: |-
              <div :style="{ display: 'flex', gap: t['spacing.md'] + 'px', alignItems: 'center' }">
                <a-button>按 Tab 看焦点</a-button>
                <a-input placeholder="输入框" :style="{ width: '140px' }" />
                <a href="#" class="std-focus-link">自定义链接</a>
              </div>

      - id: FOCUS.STYLE
        title_zh: 全站一种焦点样式
        statement_zh: 组件自带的焦点样式（主题的 controlOutline 外发光与主色描边）不覆盖；自己写的可点元素用同一种：2px 主色轮廓、外偏移 2px，写成一个共享的类，不各写一份。
        params:
          width: { value: 2, unit: px, source: SRC.POMASTER.PRESET, label_zh: 轮廓宽度 }
          offset: { value: 2, unit: px, source: SRC.POMASTER.PRESET, label_zh: 轮廓偏移 }
        anchors:
          - { spec: ui, quote: SHOULD 提供统一、设计系统级别的 focus indicator token（颜色、宽度、offset、:focus-visible）。 }
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 共享的焦点类
            code: |-
              .std-focus-link { border-radius: 4px; }
              .std-focus-link:focus-visible { outline: 2px solid var(--focus-color); outline-offset: 2px; }
            lang: css

      - id: FOCUS.CONTRAST
        title_zh: 与相邻颜色对比足够
        statement_zh: 焦点指示与相邻背景的对比度至少 3:1；在深色、彩色背景上换用能看清的颜色，不靠颜色变化本身表示焦点。
        anchors:
          - { spec: ui, quote: 颜色不得作为唯一信息来源；文本对比度至少 4.5:1，大文本至少 3:1，UI 组件/图标边界至少 3:1（WCAG 1.4.1 / 1.4.3 / 1.4.11）。 }
        enforcement: { kind: review }

      - id: FOCUS.NOT_OBSCURED
        title_zh: 不被裁切、不被遮住
        statement_zh: "overflow: hidden 的容器里改用内收的轮廓（负偏移或 inset 阴影），避免焦点环被裁掉；吸顶栏、固定底栏不能盖住获得焦点的元素（给滚动容器设 scroll-padding）。"
        anchors:
          - { spec: ui, quote: 焦点必须可见，且不得被吸顶栏、浮层、sticky 元素完全遮挡（WCAG 2.4.7 / 2.4.11）。 }
        enforcement: { kind: review }

      - id: FOCUS.ORDER
        title_zh: 焦点顺序与去处
        statement_zh: Tab 顺序与视觉顺序一致，不用正数 tabindex；弹层、抽屉、对话框打开时焦点进入，关闭后回到触发它的元素；只有模态层把焦点困在里面。
        anchors:
          - { spec: ui, quote: 弹层、抽屉、对话框打开后必须接管焦点，关闭后返回触发元素；背景不得保持可 Tab（WCAG 2.4.3 / 2.1.2）。 }
        enforcement: { kind: review }

      - id: FOCUS.RADIUS
        title_zh: 焦点环跟随元素圆角
        statement_zh: 焦点轮廓的圆角与元素一致（outline 会跟随 border-radius；用 box-shadow 画焦点时同样带圆角）；圆形按钮的焦点环也是圆的。
        enforcement: { kind: review }

  # ───────────────────────────── 组件 · 通用 · 按钮 ─────────────────────────────
  - key: button
    title_zh: 按钮
    group: components.general
    prefix: CMP.BUTTON
    summary_zh: 在当前页面触发一个即时操作。五种类型（主按钮、默认、虚线、文本、链接）配合危险、幽灵、禁用、加载四种状态使用。
    playground:
      component: a-button
      text_zh: 新建车型
      props:
        type: { options: [primary, default, dashed, text, link], default: primary }
        size: { options: [large, middle, small], default: middle }
        shape: { options: [default, round], default: default }
        danger: { boolean: true, default: false }
        ghost: { boolean: true, default: false }
        loading: { boolean: true, default: false }
        disabled: { boolean: true, default: false }
        block: { boolean: true, default: false }
      matrix: { rows: type, columns: size }
    rules:
      - id: CMP.BUTTON.USAGE
        title_zh: 何时用
        statement_zh: 按钮在当前页面触发一个操作（提交、保存、删除、打开对话框）；跳到另一个地址用链接按钮。按钮组合时用 1 个主操作加若干次要操作，超过 3 个操作就把其余的收进「更多」下拉。
        params:
          max_visible: { value: 3, unit: count, source: SRC.ANTD.COMP.BUTTON, label_zh: 平铺按钮上限 }
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 一个主操作，其余收进「更多」
            template: |-
              <a-space>
                <a-button type="primary">新建车型</a-button>
                <a-button>导入</a-button>
                <a-dropdown>
                  <a-button>更多 <DownOutlined /></a-button>
                  <template #overlay>
                    <a-menu><a-menu-item key="export">导出</a-menu-item><a-menu-item key="batch">批量编辑</a-menu-item></a-menu>
                  </template>
                </a-dropdown>
              </a-space>
          - kind: dont
            title_zh: 五个按钮平铺
            template: |-
              <a-space wrap>
                <a-button type="primary">新建车型</a-button>
                <a-button>导入</a-button>
                <a-button>导出</a-button>
                <a-button>批量编辑</a-button>
                <a-button>同步到门店</a-button>
              </a-space>

      - id: CMP.BUTTON.VARIANTS
        title_zh: 变体
        statement_zh: 主按钮用于主行动点，一个操作区最多一个；默认按钮用于没有主次之分的一组操作；虚线按钮用于「添加」；文本按钮用于最次级的操作；链接按钮用于跳转。
        params:
          types: { value: [primary, default, dashed, text, link], source: SRC.ANTDV.BUTTON, label_zh: type 取值 }
        enforcement: { kind: gate, check: markup.single-primary-button }
        showcase:
          - kind: specimen
            title_zh: 五种类型
            name_label_zh: type
            rows:
              - name: primary
                usage_zh: 主行动点，一个操作区最多一个
                template: |-
                  <a-button type="primary">新建车型</a-button>
              - name: default
                usage_zh: 没有主次之分的一组操作
                template: |-
                  <a-button>导入</a-button>
              - name: dashed
                usage_zh: 添加一项（表格行、表单项）
                template: |-
                  <a-button type="dashed"><PlusOutlined />添加配置项</a-button>
              - name: text
                usage_zh: 最次级的操作
                template: |-
                  <a-button type="text">取消</a-button>
              - name: link
                usage_zh: 跳转到别的地址
                template: |-
                  <a-button type="link">查看导入记录</a-button>
        examples:
          - kind: do
            title_zh: 一个主按钮
            template: |-
              <a-space><a-button type="primary">保存</a-button><a-button>取消</a-button></a-space>
          - kind: dont
            title_zh: 两个主按钮
            template: |-
              <a-space><a-button type="primary">保存</a-button><a-button type="primary">保存并发布</a-button></a-space>

      - id: CMP.BUTTON.DANGER
        title_zh: 危险操作
        statement_zh: 删除、移动、修改权限这类危险操作用危险按钮（danger 是属性，可以配任何类型），并且要二次确认；文案写清对象，如「删除车型」。
        enforcement: { kind: review }
        showcase:
          - kind: demo
            title_zh: 危险属性配四种类型
            template: |-
              <a-space wrap>
                <a-button type="primary" danger>删除车型</a-button>
                <a-button danger>删除车型</a-button>
                <a-button type="text" danger>删除</a-button>
                <a-button type="link" danger>删除</a-button>
              </a-space>
        examples:
          - kind: do
            title_zh: 危险操作先确认
            template: |-
              <a-popconfirm title="删除后不能恢复，确定删除这个车型吗？" ok-text="删除车型" cancel-text="取消">
                <a-button danger>删除车型</a-button>
              </a-popconfirm>

      - id: CMP.BUTTON.SIZES
        title_zh: 尺寸
        statement_zh: 三种尺寸：大 40、中 32（默认）、小 24。同一个操作区里按钮尺寸一致；小号只用在表格行、卡片角落这类紧凑位置。
        params:
          large: { value: 40, unit: px, source: SRC.ANTDV.THEME_SEED, label_zh: 大, note_zh: controlHeightLG }
          middle: { token: density.control_height, unit: px, label_zh: 中（默认） }
          small: { token: density.compact_control_height, unit: px, label_zh: 小 }
        enforcement: { kind: review }
        showcase:
          - kind: specimen
            title_zh: 三种尺寸
            name_label_zh: size · 高度
            rows:
              - name: large · 40
                usage_zh: 移动端主操作、登录这类单列页面
                template: |-
                  <a-button type="primary" size="large">新建车型</a-button>
              - name: middle · 32
                usage_zh: 默认
                template: |-
                  <a-button type="primary">新建车型</a-button>
              - name: small · 24
                usage_zh: 表格行、卡片角落
                template: |-
                  <a-button type="primary" size="small">新建车型</a-button>

      - id: CMP.BUTTON.SHAPES
        title_zh: 形状
        statement_zh: 默认是圆角矩形；圆形只用于纯图标按钮；胶囊形（round）只用于展示型页面。
        enforcement: { kind: review }
        showcase:
          - kind: demo
            title_zh: 三种形状
            template: |-
              <a-space>
                <a-button type="primary">新建车型</a-button>
                <a-tooltip title="搜索车型"><a-button type="primary" shape="circle" aria-label="搜索车型"><SearchOutlined /></a-button></a-tooltip>
                <a-button type="primary" shape="round">立即体验</a-button>
              </a-space>

      - id: CMP.BUTTON.ICONS
        title_zh: 搭配图标
        statement_zh: 图标放在文字前面，表达动作本身（新建、搜索、下载）；图标与文字的间距由组件给出（8px）。同一个按钮区要么都带图标，要么都不带。
        params:
          icon_gap: { value: 8, unit: px, source: SRC.ANTD.COMP.BUTTON, label_zh: 图标与文字间距 }
        enforcement: { kind: review }
        showcase:
          - kind: demo
            title_zh: 图标在文字前
            template: |-
              <a-space>
                <a-button type="primary"><PlusOutlined />新建车型</a-button>
                <a-button><DownloadOutlined />导出</a-button>
                <a-button><SearchOutlined />搜索</a-button>
              </a-space>

      - id: CMP.BUTTON.ICON_ONLY
        title_zh: 纯图标按钮
        statement_zh: 只有图标的按钮必须有可访问名称（aria-label），并配文字提示显示同样的文字；名称写动作和对象，如「刷新车型列表」，不写图标名。
        anchors:
          - { spec: ui, quote: MUST NOT 图标按钮缺少 aria-label 或等效可访问名称。 }
        enforcement: { kind: gate, check: markup.icon-button-label }
        examples:
          - kind: do
            title_zh: 有名称，悬停有提示
            template: |-
              <a-tooltip title="刷新车型列表"><a-button shape="circle" aria-label="刷新车型列表"><ReloadOutlined /></a-button></a-tooltip>
          - kind: dont
            title_zh: 读屏只能读出「按钮」
            code: |-
              <a-button shape="circle"><ReloadOutlined /></a-button>
            lang: vue

      - id: CMP.BUTTON.LOADING
        title_zh: 加载
        statement_zh: 异步操作提交后用按钮自身的加载状态，既给出反馈也防止重复提交；不要把按钮换成单独的加载图标。
        enforcement: { kind: review }
        showcase:
          - kind: demo
            title_zh: 加载状态
            template: |-
              <a-space>
                <a-button type="primary" loading>保存中</a-button>
                <a-button loading>导出中</a-button>
              </a-space>

      - id: CMP.BUTTON.DISABLED
        title_zh: 禁用
        statement_zh: 只有操作此刻做不了（缺必填项、没有权限）时才禁用，并就近说明原因；能做但不推荐的操作不要禁用。
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 禁用并说明原因
            template: |-
              <a-tooltip title="先选择至少一个车型"><span><a-button type="primary" disabled>批量导出</a-button></span></a-tooltip>
          - kind: dont
            title_zh: 灰掉但不说为什么
            template: |-
              <a-button type="primary" disabled>批量导出</a-button>

      - id: CMP.BUTTON.LINK
        title_zh: 链接按钮
        statement_zh: 跳转到另一个地址的操作用链接按钮（带 href），行为和链接一致，能在新标签页打开；不用按钮的点击事件去改地址。
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 带 href 的链接按钮
            template: |-
              <a-button type="link" href="#/admin/vehicle-models/1">查看车型</a-button>
          - kind: dont
            title_zh: 点击事件里跳转
            code: |-
              <a-button @click="router.push('/admin/vehicle-models/1')">查看车型</a-button>
            lang: vue

      - id: CMP.BUTTON.WIDTH
        title_zh: 宽度
        statement_zh: 按钮宽度由文字决定；只在移动端表单底部、登录这类单列场景用通栏按钮（block）。
        enforcement: { kind: review }
        showcase:
          - kind: demo
            title_zh: 单列表单的通栏按钮
            template: |-
              <div :style="{ width: '320px' }"><a-button type="primary" block>提交预约</a-button></div>

      - id: CMP.BUTTON.SUBMIT
        title_zh: 表单提交
        statement_zh: 表单的提交按钮设 html-type="submit"，回车即可提交；一个表单只有一个提交按钮，放在表单末尾。
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 提交按钮走表单的提交
            code: |-
              <a-form :model="form" @finish="onSave">
                <a-form-item label="车型名称" name="name"><a-input v-model:value="form.name" /></a-form-item>
                <a-button type="primary" html-type="submit">保存车型</a-button>
              </a-form>
            lang: vue

      - id: CMP.BUTTON.LABEL
        title_zh: 文案
        statement_zh: 文案以动词开头，说清操作的结果和对象：「新建车型」「导出报表」；不用「确定」「提交」这类泛泛的词。两个汉字的按钮，组件会自动在字间加空格，不要手动加。
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 动词加对象
            template: |-
              <a-button type="primary">导出报表</a-button>
          - kind: dont
            title_zh: 泛泛的「确定」
            template: |-
              <a-button type="primary">确定</a-button>

  - key: divider
    title_zh: 分割线
    group: components.layout
    prefix: CMP.DIVIDER
    summary_zh: 分隔两块内容：优先用间距分组，分隔线只在间距不够时用；带文字的分隔线用于长表单分段。
    rules:
      - id: CMP.DIVIDER.SPACING_FIRST
        title_zh: 先用间距，再用线
        statement_zh: 相关内容用间距分组（PROXIMITY），只有间距不足以区分时才加分隔线；卡片之间、列表项之间不同时用间距和线。
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 线只在需要时
            template: |-
              <div :style="{ width: '320px', color: t['color.text.primary'] }"><div>基本信息</div><a-divider :style="{ margin: t['spacing.md'] + 'px 0' }" /><div>证件信息</div></div>

      - id: CMP.DIVIDER.TEXT
        title_zh: 带文字的分隔线用于分段
        statement_zh: 长表单或长详情里，带文字的分隔线可以作为轻量的分段标题；文字左对齐，不居中。
        enforcement: { kind: review }

      - id: CMP.DIVIDER.VERTICAL
        title_zh: 竖线分隔行内元素
        statement_zh: 竖向分隔线用于分隔同一行的文字链接或元信息（「编辑 | 复制」），高度与文字一致。
        enforcement: { kind: review }

  - key: space
    title_zh: 间距组合
    group: components.layout
    prefix: CMP.SPACE
    summary_zh: 行内元素之间的统一间距：按钮组、标签组、表单行内控件用间距组件而不是各自写外边距。
    rules:
      - id: CMP.SPACE.USE
        title_zh: 用间距组件，不手写外边距
        statement_zh: 一组并排的按钮、标签、行内控件用 a-space 统一间距（size 取 small / middle / large 或间距阶梯的值），不在每个元素上写 margin；需要相接（按钮组、输入框加按钮）用 a-space-compact。
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 统一间距
            template: |-
              <a-space><a-button type="primary">新建车辆</a-button><a-button>导入</a-button><a-button>导出</a-button></a-space>
          - kind: dont
            title_zh: 各自写外边距
            code: |-
              <a-button style="margin-right: 10px">导入</a-button><a-button style="margin-right: 10px">导出</a-button>
            lang: vue

      - id: CMP.SPACE.WRAP
        title_zh: 放不下就换行
        statement_zh: 间距组可能放不下时允许换行（wrap），换行后的行间距与列间距一致；不出现横向滚动。
        enforcement: { kind: review }

      - id: CMP.SPACE.ALIGN
        title_zh: 对齐基线
        statement_zh: 不同高度的元素并排时按中线对齐（align=center），文字与输入框并排时按基线对齐。
        enforcement: { kind: review }

  - key: breadcrumb
    title_zh: 面包屑
    group: components.navigation
    prefix: CMP.BREADCRUMB
    summary_zh: 显示当前页面在层级中的位置：从一级菜单开始、最后一项是当前页且不可点；层级超过 4 级时折叠中间。
    rules:
      - id: CMP.BREADCRUMB.PATH
        title_zh: 从一级开始、最后一项不可点
        statement_zh: 面包屑从一级菜单开始（不从「首页」开始，除非首页是真实的一级入口），最后一项是当前页标题且不可点；中间项可点并回到对应列表时恢复其筛选（CONTEXT）。
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 层级路径
            template: |-
              <a-breadcrumb><a-breadcrumb-item><a>车辆管理</a></a-breadcrumb-item><a-breadcrumb-item><a>车辆台账</a></a-breadcrumb-item><a-breadcrumb-item>沪A12345</a-breadcrumb-item></a-breadcrumb>

      - id: CMP.BREADCRUMB.COLLAPSE
        title_zh: 太深就折叠
        statement_zh: 超过 4 级时折叠中间层级为「…」并可展开；单层页面不显示面包屑。
        enforcement: { kind: review }

      - id: CMP.BREADCRUMB.NAMES
        title_zh: 名称与菜单一致
        statement_zh: 面包屑里的名称与菜单、页面标题一致；详情页用对象名称（车牌号、单号），不用「详情」。
        enforcement: { kind: review }

  - key: dropdown
    title_zh: 下拉菜单
    group: components.navigation
    prefix: CMP.DROPDOWN
    summary_zh: 收起一组次要操作或选项：触发器说清会展开什么；菜单项是动作、按频率排序、危险项最后并分隔。
    rules:
      - id: CMP.DROPDOWN.TRIGGER
        title_zh: 触发器说清会展开什么
        statement_zh: 触发器写「更多」或带向下箭头的动作名（「导出 ▾」）；悬停触发只用于导航菜单，操作菜单用点击触发；键盘可打开、上下键移动、Esc 关闭。
        enforcement: { kind: review }

      - id: CMP.DROPDOWN.ITEMS
        title_zh: 动作排序、危险最后
        statement_zh: 菜单项是动作（动词开头），按使用频率排序；危险操作放最后，用分隔线隔开并用危险色；不可用的项置灰并说明原因。
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 危险项分隔在最后
            template: |-
              <a-menu :style="{ width: '180px', border: '1px solid ' + t['color.border.subtle'], borderRadius: t['radius.lg'] + 'px' }" :selectable="false"><a-menu-item key="edit">编辑</a-menu-item><a-menu-item key="copy">复制为新车辆</a-menu-item><a-menu-divider /><a-menu-item key="del" danger>删除</a-menu-item></a-menu>

      - id: CMP.DROPDOWN.SIZE
        title_zh: 菜单不宜过长
        statement_zh: 菜单项不超过 10 个，超过分组（带组标题）或改为对话框选择；嵌套子菜单最多一层。
        enforcement: { kind: review }

  - key: nav_menu
    title_zh: 导航菜单
    group: components.navigation
    prefix: CMP.NAV_MENU
    summary_zh: 应用的主导航：层级不超过两级、当前位置高亮；菜单项按权限出现；折叠后图标可辨认。
    rules:
      - id: CMP.NAV_MENU.DEPTH
        title_zh: 不超过两级
        statement_zh: 侧边主导航最多两级（分组 + 页面）；第三层放到页面内的标签页或筛选里；菜单名与页面标题一致。
        enforcement: { kind: review }

      - id: CMP.NAV_MENU.ACTIVE
        title_zh: 当前位置高亮
        statement_zh: 当前页面对应的菜单项高亮，进入详情页时其所属列表的菜单项仍高亮；展开状态记住（SIDEBAR）。
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 当前项高亮
            template: |-
              <a-menu mode="inline" :selected-keys="['ledger']" :open-keys="['vehicle']" :style="{ width: '220px' }" :items="[{ key: 'vehicle', label: '车辆管理', children: [{ key: 'ledger', label: '车辆台账' }, { key: 'insurance', label: '保险管理' }] }, { key: 'driver', label: '司机管理' }]" />

      - id: CMP.NAV_MENU.PERMISSION
        title_zh: 按权限出现
        statement_zh: 没有权限的菜单项不显示（不是置灰）；整组都没有权限时整组不显示；菜单权限与路由守卫用同一份权限码（GUARD）。
        enforcement: { kind: review }

  - key: pagination
    title_zh: 分页
    group: components.navigation
    prefix: CMP.PAGINATION
    summary_zh: 分页：显示总数与当前范围，每页条数可选；页码进 URL；数据量不确定时用「加载更多」。
    rules:
      - id: CMP.PAGINATION.TOTAL
        title_zh: 显示总数与范围
        statement_zh: 显示总条数（「共 1,248 条」），每页条数可选 10 / 20 / 50 / 100；总页数多时显示快速跳转；只有一页时不显示分页。
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 总数与每页条数
            template: |-
              <a-pagination :total="1248" :current="3" :page-size="20" show-size-changer :show-total="(total) => '共 ' + total + ' 条'" />

      - id: CMP.PAGINATION.URL
        title_zh: 页码进 URL
        statement_zh: 页码与每页条数写进 URL（STATE.URL）；筛选条件变化时回到第 1 页；删除当前页最后一条后回到上一页。
        enforcement: { kind: review }

      - id: CMP.PAGINATION.POSITION
        title_zh: 位置固定
        statement_zh: 表格分页放在表格右下方，与表格右边对齐；列表很长时可以在顶部也放一个简洁版。
        enforcement: { kind: review }

  - key: steps
    title_zh: 步骤条
    group: components.navigation
    prefix: CMP.STEPS
    summary_zh: 多步流程的进度：步骤 3–5 个、名称是名词；当前步骤、已完成、出错分明；可回到已完成的步骤修改。
    rules:
      - id: CMP.STEPS.COUNT
        title_zh: 3–5 步
        statement_zh: 步骤控制在 3–5 个，每步名称是名词或短动宾（「填写车辆」「上传证件」「确认提交」）；超过 5 步合并或拆成多个流程。
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 当前与出错
            template: |-
              <a-steps :current="1" status="error" size="small" :items="[{ title: '填写车辆' }, { title: '上传证件', description: '行驶证缺页' }, { title: '确认提交' }]" :style="{ width: '480px' }" />

      - id: CMP.STEPS.STATUS
        title_zh: 状态分明
        statement_zh: 已完成、当前、未开始、出错四种状态样式分明，出错的步骤写原因；已完成的步骤可点回去修改，未开始的不可跳过。
        enforcement: { kind: review }

      - id: CMP.STEPS.SAVE
        title_zh: 跨步保存
        statement_zh: 每步完成时保存草稿（FORM 草稿），中途离开再回来停在原步骤；最后一步汇总全部信息再提交。
        enforcement: { kind: review }

  - key: tabs
    title_zh: 标签页
    group: components.navigation
    prefix: CMP.TABS
    summary_zh: 同一页面内平级视图的切换：标签名短、数量少；当前标签进 URL；不把流程步骤做成标签页。
    rules:
      - id: CMP.TABS.WHEN
        title_zh: 平级视图才用标签页
        statement_zh: 标签页切换同一对象的平级视图（基本信息 / 维修记录 / 费用）；有先后顺序的流程用步骤条；标签多于 7 个时考虑拆页或用侧栏导航。
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 平级视图
            template: |-
              <a-tabs active-key="repair" :style="{ width: '420px' }"><a-tab-pane key="base" tab="基本信息" /><a-tab-pane key="repair" tab="维修记录（3）" /><a-tab-pane key="cost" tab="费用" /></a-tabs>

      - id: CMP.TABS.URL
        title_zh: 当前标签进 URL
        statement_zh: 当前标签写进 URL（查询参数或子路由），刷新与分享后停在同一标签；切换标签不丢失其他标签里未保存的内容（或切换前提示）。
        enforcement: { kind: review }

      - id: CMP.TABS.LABEL
        title_zh: 标签名短，可带计数
        statement_zh: 标签名 2–6 个字，可以带计数（「维修记录（3）」）；不在标签名里放图标以外的装饰；禁用的标签说明原因。
        enforcement: { kind: review }

  - key: checkbox
    title_zh: 多选框
    group: components.entry
    prefix: CMP.CHECKBOX
    summary_zh: 在一组选项里选多个，或确认一句声明：选项竖排、标签可点；全选给出半选态；单个多选框不代替开关。
    rules:
      - id: CMP.CHECKBOX.LAYOUT
        title_zh: 竖排、标签可点
        statement_zh: 多于 3 个选项竖排，每项的标签文字也能点中；组有标题说明选什么；选项多于 10 个改带搜索的多选或穿梭框。
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 竖排与全选
            template: |-
              <div :style="{ display: 'flex', flexDirection: 'column', gap: t['spacing.sm'] + 'px' }"><a-checkbox :indeterminate="true" :checked="false">全部通知</a-checkbox><div :style="{ display: 'flex', flexDirection: 'column', gap: t['spacing.xs'] + 'px', paddingLeft: t['spacing.xl'] + 'px' }"><a-checkbox :checked="true">保养到期</a-checkbox><a-checkbox>保险到期</a-checkbox><a-checkbox :checked="true">年检到期</a-checkbox></div></div>

      - id: CMP.CHECKBOX.INDETERMINATE
        title_zh: 全选有半选态
        statement_zh: 有「全选」时，部分选中显示半选态（indeterminate），点击半选态变为全选；全选只作用于当前可见、可操作的选项，并说清范围。
        enforcement: { kind: review }

      - id: CMP.CHECKBOX.NOT_SWITCH
        title_zh: 立即生效用开关，提交生效用多选框
        statement_zh: 改了立即生效的设置用开关；需要随表单一起提交的选择用多选框；单个多选框只用于确认一句声明（「我已阅读并同意…」），并且声明文字完整可读。
        enforcement: { kind: review }

  - key: date_picker
    title_zh: 日期选择
    group: components.entry
    prefix: CMP.DATE_PICKER
    summary_zh: 选择日期或日期范围：显示格式统一、可键盘输入；范围选择给常用快捷项并限制跨度；不可选的日期置灰并说明。
    rules:
      - id: CMP.DATE_PICKER.FORMAT
        title_zh: 显示格式统一
        statement_zh: 日期显示统一为 YYYY-MM-DD，日期时间为 YYYY-MM-DD HH:mm:ss（见 FORMAT.DATETIME）；存储与传输用 ISO 8601；允许用户直接键入日期，键入后按同一格式回显。
        enforcement: { kind: review }

      - id: CMP.DATE_PICKER.RANGE
        title_zh: 范围选择有快捷项与上限
        statement_zh: 日期范围给常用快捷项（今天、最近 7 天、本月、上月）；查询类范围限制最大跨度（如 366 天）并在超出时提示；开始和结束一起选，不拆成两个独立控件。
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 范围与快捷项
            template: |-
              <a-range-picker :style="{ width: '300px' }" />

      - id: CMP.DATE_PICKER.DISABLED
        title_zh: 不可选的日期置灰
        statement_zh: 不可选的日期（过去、节假日、超出业务范围）置灰并在面板里说明原因；不在选完后才报错。
        enforcement: { kind: review }

  - key: form
    title_zh: 表单
    group: components.entry
    prefix: CMP.FORM
    summary_zh: 字段的标签、分组、校验与提交：标签在上、按业务分组；必填只标星号不重复说明；提交时整体校验并定位到第一个错误；提交中锁定。
    rules:
      - id: CMP.FORM.LAYOUT
        title_zh: 标签在上，按业务分组
        statement_zh: 新建、编辑表单用垂直布局（layout="vertical"），标签在输入框上方；字段按业务分组，每组有标题；一行最多两列，相关字段（起止日期、省市区）放同一行；查询表单用行内或栅格布局。
        enforcement: { kind: review }
        showcase:
          - kind: demo
            title_zh: 分组、必填与操作区
            template: |-
              <a-form layout="vertical" :style="{ width: '360px' }"><div :style="{ fontWeight: 600, marginBottom: t['spacing.sm'] + 'px', color: t['color.text.primary'] }">基本信息</div><a-form-item label="车牌号" required><a-input placeholder="例：沪A12345" /></a-form-item><a-form-item label="所属部门" required><a-select placeholder="选择部门" :options="[{ value: 'd1', label: '华东运营部' }]" /></a-form-item><a-form-item label="备注（选填）"><a-textarea :rows="2" /></a-form-item><a-space><a-button type="primary">保存</a-button><a-button>取消</a-button></a-space></a-form>

      - id: CMP.FORM.REQUIRED
        title_zh: 必填只标星号
        statement_zh: 必填字段在标签前标星号，必填字段多于可选字段时改为只标「（选填）」；说明文字写在字段下方，不写在占位符里。
        enforcement: { kind: review }

      - id: CMP.FORM.SUBMIT
        title_zh: 提交整体校验并定位
        statement_zh: 提交时校验全部字段，滚动并聚焦到第一个错误字段；提交中锁定按钮与表单（CLICK.LOCK），成功后给出结果并决定去向（返回列表或停留继续编辑），失败保留已填内容。
        enforcement: { kind: review }

      - id: CMP.FORM.ACTIONS
        title_zh: 操作区固定位置
        statement_zh: 表单操作区在表单末尾左对齐（与字段左边对齐），主按钮在前；长表单把操作区吸底（a-affix 或页脚工具栏），保证随时可提交。
        enforcement: { kind: review }

  - key: input
    title_zh: 输入框
    group: components.entry
    prefix: CMP.INPUT
    summary_zh: 单行文字输入：标签在上、占位符只给格式示例；必填、长度、格式在提交前就地提示；前后缀放单位与固定内容，不放说明。
    playground:
      component: a-input
      props:
        size: { options: [large, middle, small], default: middle }
        disabled: { boolean: true, default: false }
        allowClear: { boolean: true, default: false }
    rules:
      - id: CMP.INPUT.LABEL
        title_zh: 标签在外，占位符只放示例
        statement_zh: 每个输入框都有可见标签（表单里用表单项的 label，不用占位符代替标签）；占位符只写格式示例（如「例：沪A12345」），不写「请输入」之类的废话；聚焦后占位符消失不影响理解。
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 标签 + 示例占位符
            template: |-
              <a-form layout="vertical" :style="{ width: '280px' }"><a-form-item label="车牌号"><a-input placeholder="例：沪A12345" /></a-form-item></a-form>
          - kind: dont
            title_zh: 用占位符当标签
            template: |-
              <a-input placeholder="请输入车牌号" :style="{ width: '280px' }" />
        showcase:
          - kind: demo
            title_zh: 标签、示例占位符与错误态
            template: |-
              <div :style="{ display: 'flex', flexDirection: 'column', gap: t['spacing.md'] + 'px', width: '320px' }"><a-form layout="vertical"><a-form-item label="车牌号" validate-status="error" help="车牌号为 7–8 位，如沪A12345"><a-input value="沪A1" /></a-form-item><a-form-item label="整备质量"><a-input placeholder="例：1580"><template #suffix>kg</template></a-input></a-form-item></a-form></div>

      - id: CMP.INPUT.VALIDATION
        title_zh: 就地校验，失败说清怎么改
        statement_zh: 格式与长度在失焦时校验，错误显示在输入框下方并把边框标为错误态（status=error / aria-invalid）；提示写清规则与改法（「车牌号为 7–8 位，如沪A12345」），不写「格式错误」；用户改动后立即撤掉错误。
        enforcement: { kind: review }

      - id: CMP.INPUT.AFFIX
        title_zh: 前后缀只放单位与固定内容
        statement_zh: 单位、货币代码、固定前缀（https://）放在前后缀里，不让用户输入；图标前缀只用于搜索、账号这类约定俗成的场景；清除按钮（allowClear）给可选字段，必填字段不清空为空串。
        enforcement: { kind: review }

      - id: CMP.INPUT.WIDTH
        title_zh: 宽度跟内容长度走
        statement_zh: 输入框宽度按预期内容长度选（短码、数量、手机号用窄档，名称、地址用宽档），同一表单里同类字段等宽；不要所有输入框都拉满整行。
        enforcement: { kind: review }

  - key: textarea
    title_zh: 多行输入
    group: components.entry
    prefix: CMP.TEXTAREA
    summary_zh: 多行文字输入：给出行数与字数上限，自动增高有上限；长文本才用它，短备注用单行。
    rules:
      - id: CMP.TEXTAREA.ROWS
        title_zh: 初始行数与自动增高
        statement_zh: 初始 3–4 行；内容变多时自动增高（autoSize / field-sizing），最多 8 行后出现滚动条；不允许用户把它拖得比容器还宽。
        enforcement: { kind: review }

      - id: CMP.TEXTAREA.COUNT
        title_zh: 有上限就显示计数
        statement_zh: 后端有长度上限的字段显示字数计数（showCount + maxlength），接近上限时计数变为警示色；超限不截断用户已输入的内容，而是阻止提交并提示。
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 计数
            template: |-
              <a-textarea :rows="3" :maxlength="200" show-count placeholder="例：前保险杠有划痕" :style="{ width: '320px' }" />

      - id: CMP.TEXTAREA.WHEN
        title_zh: 长文本才用多行
        statement_zh: 备注、描述、原因这类可能超过一行的内容用多行输入；名称、编号、短备注用单行输入，不为了「看起来宽敞」用多行。
        enforcement: { kind: review }

  - key: input_number
    title_zh: 数字输入
    group: components.entry
    prefix: CMP.INPUT_NUMBER
    summary_zh: 输入有范围的数字：写明单位、范围与精度，步进按钮可选；金额和数量右对齐。
    rules:
      - id: CMP.INPUT_NUMBER.RANGE
        title_zh: 范围、精度、单位写清
        statement_zh: 设置 min / max / precision，与后端校验一致；单位放在后缀或标签里（「整备质量（kg）」），不让用户输入单位；超出范围时就地提示允许的范围，不静默改成边界值。
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 范围与单位
            template: |-
              <a-input-number :min="0" :max="9999" :precision="0" addon-after="kg" placeholder="0–9999" />

      - id: CMP.INPUT_NUMBER.ALIGN
        title_zh: 数字右对齐、等宽
        statement_zh: 金额、数量、重量这类可比较的数字在输入框和列表里都右对齐并用等宽数字（tabular-nums），方便按位比较。
        enforcement: { kind: review }

      - id: CMP.INPUT_NUMBER.STEP
        title_zh: 步进按钮只给小范围
        statement_zh: 步进按钮适合 0–20 这类小范围的调整（数量、优先级）；金额、长编号不显示步进按钮，避免误点改值；滚轮不改值。
        enforcement: { kind: review }

  - key: radio
    title_zh: 单选框
    group: components.entry
    prefix: CMP.RADIO
    summary_zh: 在几个互斥的选项里选一个：2–5 个选项且要一眼看全时用；有默认值；选项多了改选择器。
    rules:
      - id: CMP.RADIO.WHEN
        title_zh: 选项少且要看全才用单选
        statement_zh: 2–5 个互斥选项且用户需要对比时用单选组；超过 5 个改选择器；只有「是 / 否」且立即生效时用开关。
        enforcement: { kind: review }
        showcase:
          - kind: demo
            title_zh: 表单里的单选与切换视图的按钮样式
            template: |-
              <div :style="{ display: 'flex', flexDirection: 'column', gap: t['spacing.md'] + 'px', width: '320px' }"><a-radio-group value="self"><a-radio value="self">仅本人可见</a-radio><a-radio value="team">本部门可见</a-radio><a-radio value="all">全公司可见</a-radio></a-radio-group><a-radio-group value="week" button-style="solid"><a-radio-button value="day">日</a-radio-button><a-radio-button value="week">周</a-radio-button><a-radio-button value="month">月</a-radio-button></a-radio-group></div>

      - id: CMP.RADIO.DEFAULT
        title_zh: 给安全的默认值
        statement_zh: 单选组默认选中最常用或最安全的一项（如「仅本人可见」）；确实要用户主动选择的（无安全默认），不预选并在提交时校验必选。
        enforcement: { kind: review }

      - id: CMP.RADIO.BUTTON_STYLE
        title_zh: 按钮样式只用于切换视图
        statement_zh: 按钮样式的单选（a-radio-group 的 button 样式）或分段控制只用于切换视图、筛选范围这类立即生效的选择；表单里的取值用普通单选，竖排或横排保持一致。
        enforcement: { kind: review }

  - key: select
    title_zh: 选择器
    group: components.entry
    prefix: CMP.SELECT
    summary_zh: 从下拉列表里选一项：选项多于 7 个可搜索、多于 50 个改远程搜索；选项文案短、互斥、有序；空态与加载态都要有。
    playground:
      component: a-select
      props:
        size: { options: [large, middle, small], default: middle }
        disabled: { boolean: true, default: false }
        loading: { boolean: true, default: false }
    rules:
      - id: CMP.SELECT.WHEN
        title_zh: 选项数量决定控件
        statement_zh: 2–5 个互斥选项且需要一眼看全时用单选组或分段控制；6 个以上用选择器；超过 7 个打开搜索（showSearch）；超过 50 个或来自接口时改远程搜索，并防抖、显示加载态。
        enforcement: { kind: review }
        showcase:
          - kind: demo
            title_zh: 可搜索的选择器与禁用原因
            template: |-
              <a-select show-search placeholder="选择车型" :style="{ width: '280px' }" :options="[{ value: 'M01', label: '轻型厢式货车' }, { value: 'M02', label: '中型栏板货车' }, { value: 'M09', label: '重型牵引车（已停用）', disabled: true }]" />

      - id: CMP.SELECT.OPTIONS
        title_zh: 选项短、互斥、有序
        statement_zh: 选项文案短（不超过 12 个字）、互斥、按使用频率或自然顺序排列（状态按流程顺序，地区按行政顺序），「其他」放最后；禁用的选项说明原因（tooltip），不直接隐藏。
        enforcement: { kind: review }

      - id: CMP.SELECT.EMPTY
        title_zh: 空与加载有反馈
        statement_zh: 远程搜索时显示加载态；没有匹配项时显示「无匹配的车型」并给出新建入口（有新建权限时）；不把空列表留成一片白。
        enforcement: { kind: review }

      - id: CMP.SELECT.VALUE
        title_zh: 值与显示分开
        statement_zh: 选项的值用稳定的编码（code / id），显示用名称；回显时用值匹配，名称改了不影响已存数据；值不在选项里时显示原值并提示「已停用」，不显示成空。
        enforcement: { kind: review }

  - key: switch
    title_zh: 开关
    group: components.entry
    prefix: CMP.SWITCH
    summary_zh: 两个状态之间切换、并且立即生效：标签写它控制什么；有副作用的切换先确认；切换中显示加载并防重复。
    playground:
      component: a-switch
      props:
        size: { options: [default, small], default: default }
        checked: { boolean: true, default: true }
        disabled: { boolean: true, default: false }
        loading: { boolean: true, default: false }
    rules:
      - id: CMP.SWITCH.IMMEDIATE
        title_zh: 开关立即生效
        statement_zh: 开关只用于立即生效的设置；需要点「保存」才生效的选项用多选框或单选；切换后给出结果反馈（状态变化本身或一条轻提示），失败时回到原状态并提示原因。
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 标签写控制什么
            template: |-
              <div :style="{ display: 'flex', alignItems: 'center', gap: t['spacing.sm'] + 'px' }"><a-switch :checked="true" /><span>到期自动提醒</span></div>
          - kind: dont
            title_zh: 用开关做表单项再点保存
            code: |-
              <a-form-item label="接收通知"><a-switch v-model:checked="form.notify" /></a-form-item>
              <a-button type="primary" html-type="submit">保存</a-button>
            lang: vue

      - id: CMP.SWITCH.LOADING
        title_zh: 切换中加载、防重复
        statement_zh: 切换要请求接口时显示加载态（loading）并在返回前禁用，防止连点；接口失败回滚开关状态。
        enforcement: { kind: review }

      - id: CMP.SWITCH.CONFIRM
        title_zh: 有副作用先确认
        statement_zh: 关闭后会影响他人或不可撤回的开关（停用账号、关闭对外接口）先弹确认，说清后果；普通偏好不确认。
        enforcement: { kind: review }

  - key: upload
    title_zh: 上传
    group: components.entry
    prefix: CMP.UPLOAD
    summary_zh: 上传文件：说清格式、大小与数量；上传中显示进度、可取消；失败可重试；上传与提交分开。
    rules:
      - id: CMP.UPLOAD.LIMITS
        title_zh: 格式、大小、数量写在前面
        statement_zh: 上传区域旁写明允许的格式、单个大小与数量上限（「PDF、JPG，单个不超过 10 MB，最多 5 个」）；选择文件时就校验，不等上传完才拒绝；校验以服务端为准。
        enforcement: { kind: review }

      - id: CMP.UPLOAD.PROGRESS
        title_zh: 进度、取消、重试
        statement_zh: 每个文件显示进度，可取消；失败的文件保留在列表里标红、写清原因并可重试；全部完成前不允许提交依赖这些文件的表单。
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 文件列表
            template: |-
              <a-upload :file-list="[{ uid: '1', name: '行驶证.pdf', status: 'done' }, { uid: '2', name: '保单.jpg', status: 'error', response: '文件超过 10 MB' }]"><a-button>选择文件</a-button></a-upload>

      - id: CMP.UPLOAD.SEPARATE
        title_zh: 上传与提交分开
        statement_zh: 文件先上传得到文件标识，表单提交只带标识；大文件分片上传、可断点续传；上传的文件名、类型在服务端重新校验与改名（SEC 规范）。
        enforcement: { kind: review }

  - key: badge
    title_zh: 徽标数
    group: components.display
    prefix: CMP.BADGE
    summary_zh: 在图标或头像右上角显示计数或状态点：只提示有新东西，数字封顶；状态点配文字。
    rules:
      - id: CMP.BADGE.COUNT
        title_zh: 计数封顶
        statement_zh: 计数超过 99 显示「99+」；为 0 时不显示；计数表示「有待处理的东西」，点进去处理后清零或减少。
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 封顶与状态点
            template: |-
              <div :style="{ display: 'flex', gap: t['spacing.xl'] + 'px', alignItems: 'center' }"><a-badge :count="128" :overflow-count="99"><a-avatar shape="square">消</a-avatar></a-badge><a-badge status="processing" text="同步中" /></div>

      - id: CMP.BADGE.DOT
        title_zh: 状态点配文字
        statement_zh: 状态点（在线、同步中、异常）旁边写文字，不单独用颜色表达状态；动画状态点只用于正在进行的过程。
        enforcement: { kind: review }

      - id: CMP.BADGE.RESTRAINT
        title_zh: 克制使用
        statement_zh: 徽标只用于需要用户注意的新消息、待办；不给每个菜单都加数字；同一屏不超过 3 个红点。
        enforcement: { kind: review }

  - key: tag
    title_zh: 标签
    group: components.display
    prefix: CMP.TAG
    summary_zh: 给对象打上分类或状态的短标签：颜色有固定语义、文字不超过 6 个字；可关闭的标签用于筛选条件；不当按钮用。
    playground:
      component: a-tag
      text_zh: 在用
      props:
        color: { options: [default, success, processing, warning, error], default: success }
        bordered: { boolean: true, default: true }
    rules:
      - id: CMP.TAG.SEMANTIC
        title_zh: 颜色有固定语义
        statement_zh: 状态标签的颜色按语义固定（成功 / 进行中 / 警告 / 失败 / 中性），同一状态全站同色；分类标签用中性色或预设色板，不自定义色值；颜色之外还有文字，不只靠颜色区分。
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 语义色
            template: |-
              <div :style="{ display: 'flex', gap: t['spacing.sm'] + 'px' }"><a-tag color="success">在用</a-tag><a-tag color="processing">调度中</a-tag><a-tag color="warning">待年检</a-tag><a-tag color="error">已报废</a-tag><a-tag>备用</a-tag></div>
          - kind: dont
            title_zh: 自定义色值
            code: |-
              <a-tag color="#f50">急</a-tag>
            lang: vue

      - id: CMP.TAG.SHORT
        title_zh: 文字短
        statement_zh: 标签文字不超过 6 个字，不换行；一行标签超过 3 个时折叠为「+N」，悬停显示全部。
        enforcement: { kind: review }

      - id: CMP.TAG.CLOSABLE
        title_zh: 可关闭的标签只用于条件
        statement_zh: 可关闭标签用于展示已选的筛选条件或已添加的关键词，关闭即移除该条件；标签不当按钮或链接用，需要点击跳转的用链接。
        enforcement: { kind: review }

  - key: card
    title_zh: 卡片
    group: components.display
    prefix: CMP.CARD
    summary_zh: 把一组相关信息装进一个容器：标题说清是什么，操作在右上；卡片之间等距；可点的整张卡片有悬停反馈（见卡片悬停）。
    rules:
      - id: CMP.CARD.STRUCTURE
        title_zh: 标题、内容、操作
        statement_zh: 卡片标题说清内容是什么（「本月保养」而不是「列表」），操作（更多、刷新、查看全部）放在标题行右侧（extra），最多 2 个；内容区内边距用规范的卡片内边距；底部操作栏只放与卡片内容相关的动作。
        enforcement: { kind: review }
        showcase:
          - kind: demo
            title_zh: 标题、操作与内容
            template: |-
              <a-card title="本月保养" size="small" :style="{ width: '320px' }"><template #extra><a>查看全部</a></template><div :style="{ display: 'flex', justifyContent: 'space-between', color: t['color.text.primary'] }"><span>待保养</span><span :style="{ fontVariantNumeric: 'tabular-nums' }">12 辆</span></div></a-card>

      - id: CMP.CARD.SPACING
        title_zh: 等距与等高
        statement_zh: 同一行卡片等高、间距一致（取栅格 gutter）；卡片里不再套带边框的卡片，二级分组用分隔线或小标题。
        enforcement: { kind: review }

      - id: CMP.CARD.CLICKABLE
        title_zh: 整卡可点要说清
        statement_zh: 整张卡片可点时，整卡是一个链接或按钮（键盘可聚焦），悬停有反馈；卡片里同时还有其他按钮时，不把整卡做成可点，避免误触。
        enforcement: { kind: review }

  - key: descriptions
    title_zh: 描述列表
    group: components.display
    prefix: CMP.DESCRIPTIONS
    summary_zh: 详情页里成组展示字段：标签与值对齐、分组有标题；空值显示占位；长文本独占一行。
    rules:
      - id: CMP.DESCRIPTIONS.LAYOUT
        title_zh: 标签与值成对对齐
        statement_zh: 字段按业务分组，每组有标题；桌面端每行 3 列、窄屏 1 列；标签右侧或上方对齐保持全页一致；值可复制的（编号、单号）提供复制按钮。
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 分组详情
            template: |-
              <a-descriptions title="车辆信息" :column="2" size="small" bordered :style="{ width: '520px' }"><a-descriptions-item label="车牌号">沪A12345</a-descriptions-item><a-descriptions-item label="车型">轻型厢式货车</a-descriptions-item><a-descriptions-item label="购置日期">2024-03-18</a-descriptions-item><a-descriptions-item label="备注">—</a-descriptions-item></a-descriptions>

      - id: CMP.DESCRIPTIONS.EMPTY
        title_zh: 空值显示占位
        statement_zh: 没有值的字段显示「—」，不留空白也不隐藏字段（隐藏会让用户以为没有这个信息）；值为 0 显示 0。
        enforcement: { kind: review }

      - id: CMP.DESCRIPTIONS.LONG
        title_zh: 长文本独占一行
        statement_zh: 备注、地址这类长文本独占一整行（span 全部列），超过 3 行折叠并可展开。
        enforcement: { kind: review }

  - key: empty
    title_zh: 空状态
    group: components.display
    prefix: CMP.EMPTY
    summary_zh: 没有数据时：说清为什么空、下一步做什么；首次使用、筛选无结果、无权限、出错各用各的文案。
    rules:
      - id: CMP.EMPTY.REASON
        title_zh: 说清为什么空
        statement_zh: 空状态写清原因：首次使用（「还没有车辆」）、筛选无结果（「没有符合条件的车辆」）、无权限（「你没有查看车辆的权限」）；出错不用空状态，用错误状态（ERRH）。
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 原因 + 下一步
            template: |-
              <a-empty description="没有符合条件的车辆" :style="{ width: '320px' }"><a-button>清除筛选</a-button></a-empty>

      - id: CMP.EMPTY.NEXT
        title_zh: 给出下一步
        statement_zh: 空状态带一个主要动作（新建、导入、清除筛选、申请权限），有权限才显示新建；不写「暂无数据」就结束。
        enforcement: { kind: review }

      - id: CMP.EMPTY.QUIET
        title_zh: 插图克制
        statement_zh: 表格、卡片里的空状态用简洁的小插图或不用插图；整页空状态可以用插图，但不喧宾夺主。
        enforcement: { kind: review }

  - key: table
    title_zh: 表格
    group: components.display
    prefix: CMP.TABLE
    summary_zh: 成行成列的数据：表头清楚、数字右对齐、操作列在最右；空、加载、错误三态保持表头；分页或虚拟滚动二选一。大数据与复杂交互见「数据网格」。
    rules:
      - id: CMP.TABLE.COLUMNS
        title_zh: 列的顺序与对齐
        statement_zh: 第一列放识别对象的名称或编号（可点进详情）；文字左对齐，数字、金额右对齐并用等宽数字，状态、操作居中或左对齐但同表一致；列宽给最小值，超长文本省略并悬停显示全文。
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 对齐与操作列
            template: |-
              <a-table size="small" :pagination="false" :columns="[{ title: '车牌号', dataIndex: 'plate' }, { title: '里程（km）', dataIndex: 'km', align: 'right' }, { title: '状态', dataIndex: 'state' }, { title: '操作', key: 'op', width: 120 }]" :data-source="[{ key: 1, plate: '沪A12345', km: '12,480', state: '在用' }, { key: 2, plate: '沪B67890', km: '3,205', state: '维修中' }]" :style="{ width: '520px' }" />

      - id: CMP.TABLE.ACTIONS
        title_zh: 操作列在最右，最多三个
        statement_zh: 行操作放最右列，最多直接露出 3 个文字按钮，其余收进「更多」下拉；危险操作放最后并二次确认；操作列在横向滚动时固定在右侧。
        enforcement: { kind: review }

      - id: CMP.TABLE.STATES
        title_zh: 空、加载、错误保持表头
        statement_zh: 加载时保留表头并在表体显示骨架或加载态；没有数据时表体显示空状态（说明为什么空、能做什么）；出错时表体显示错误与重试，不把整张表换成一句话。
        enforcement: { kind: review }

      - id: CMP.TABLE.PAGING
        title_zh: 分页规则
        statement_zh: 默认每页 10 或 20 条，可选 10 / 20 / 50 / 100；页码、每页条数与排序写进 URL（STATE.URL）；翻页后回到表格顶部；数据量很大时用服务端分页，不在前端一次拉全量。
        enforcement: { kind: review }

  - key: tooltip
    title_zh: 文字提示
    group: components.display
    prefix: CMP.TOOLTIP
    summary_zh: 悬停或聚焦时显示的简短说明：只补充、不承载必需信息；键盘可触达；不放可点内容。
    rules:
      - id: CMP.TOOLTIP.SUPPLEMENT
        title_zh: 只补充，不承载必需信息
        statement_zh: 提示只放补充说明（图标按钮的名称、被截断的全文、禁用原因）；完成任务必需的信息直接写在界面上；提示文字一两句，超过就改用气泡卡片或帮助链接。
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 禁用原因
            template: |-
              <a-tooltip title="已有在途工单，不能删除"><a-button disabled>删除</a-button></a-tooltip>

      - id: CMP.TOOLTIP.A11Y
        title_zh: 键盘与读屏可达
        statement_zh: 触发元素可聚焦，聚焦时也显示提示；提示内容通过 aria-describedby 关联；移动端没有悬停，关键说明不要只放在提示里。
        enforcement: { kind: review }

      - id: CMP.TOOLTIP.NO_ACTIONS
        title_zh: 提示里不放可点内容
        statement_zh: 提示里不放按钮、链接；需要交互的用气泡卡片（Popover）；延迟出现（约 100ms）避免划过时闪烁。
        enforcement: { kind: review }

  - key: alert
    title_zh: 警告提示
    group: components.feedback
    prefix: CMP.ALERT
    summary_zh: 页面内常驻的提示条：按语义选类型，写清影响与怎么办；可关闭的只放可以忽略的信息。
    playground:
      component: a-alert
      props:
        type: { options: [info, success, warning, error], default: info }
        message: { options: [车辆数据每天 02:00 同步], default: 车辆数据每天 02:00 同步 }
        showIcon: { boolean: true, default: true }
        closable: { boolean: true, default: false }
    rules:
      - id: CMP.ALERT.TYPE
        title_zh: 按语义选类型
        statement_zh: 信息（info）、成功（success）、警告（warning）、错误（error）四类按语义选，不按颜色喜好选；标题一句话说清发生了什么，描述写影响与怎么办。
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 写清影响与怎么办
            template: |-
              <a-alert type="warning" show-icon message="3 辆车保险将在 7 天内到期" description="到期后车辆不能派单。到「保险管理」续保。" :style="{ width: '420px' }" />

      - id: CMP.ALERT.PLACEMENT
        title_zh: 放在受影响内容的上方
        statement_zh: 与整页有关的提示放页面顶部（页头下方），与某个区块有关的放在该区块上方；同一位置最多一条，多条合并或按严重程度只显示最高的。
        enforcement: { kind: review }

      - id: CMP.ALERT.DISMISS
        title_zh: 只有可忽略的才能关
        statement_zh: 错误和必须处理的警告不可关闭，问题解决后自动消失；可关闭的提示关闭后记住（按用户），不每次刷新都出现。
        enforcement: { kind: review }

  - key: drawer
    title_zh: 侧边抽屉
    group: components.feedback
    prefix: CMP.DRAWER
    summary_zh: 从侧边滑出的面板：用于需要对照页面内容的录入与详情；宽度取档位；有未保存内容时关闭先确认。
    rules:
      - id: CMP.DRAWER.WHEN
        title_zh: 对照页面内容时用抽屉
        statement_zh: 查看或编辑一条记录、同时需要看着列表或页面时用抽屉；录入超过 5 个字段用抽屉而不是对话框；抽屉里不再打开抽屉（最多两层，第二层更窄）。
        enforcement: { kind: review }

      - id: CMP.DRAWER.SIZE
        title_zh: 宽度取档位
        statement_zh: 宽度取两档：普通 378px、宽 736px（size="default" / "large"），不随内容随意设宽；窄屏全宽。标题写对象名（「编辑 沪A12345」）。
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 操作在底部
            template: |-
              <div><a-button @click="s.open = true">编辑车辆</a-button><a-drawer v-model:open="s.open" title="编辑 沪A12345" :width="378"><a-form layout="vertical"><a-form-item label="车牌号"><a-input value="沪A12345" /></a-form-item></a-form><template #footer><a-space><a-button type="primary">保存</a-button><a-button @click="s.open = false">取消</a-button></a-space></template></a-drawer></div>

      - id: CMP.DRAWER.CLOSE
        title_zh: 未保存先确认
        statement_zh: 有未保存的修改时，点关闭、遮罩或 Esc 先确认是否放弃；保存成功后关闭抽屉并刷新受影响的列表行，不整页刷新。
        enforcement: { kind: review }

  - key: message
    title_zh: 全局提示
    group: components.feedback
    prefix: CMP.MESSAGE
    summary_zh: 操作后的轻量全局反馈：一句话、自动消失、不打断；失败与需要处理的不用它。
    rules:
      - id: CMP.MESSAGE.WHEN
        title_zh: 只给轻量的结果
        statement_zh: 保存、复制、删除成功这类结果用全局提示，一句话说清结果（「已保存」「已复制车牌号」），2–3 秒自动消失；错误需要用户处理时用就地错误或通知，不用一闪而过的提示。
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 结果一句话
            code: |-
              message.success('已保存')
              message.success('已复制车牌号')
            lang: ts
          - kind: dont
            title_zh: 错误一闪而过
            code: |-
              message.error('保存失败')
            lang: ts

      - id: CMP.MESSAGE.ONE
        title_zh: 同一时间一条
        statement_zh: 同类提示合并（连续保存只提示一次），同一时间最多 3 条；页面跳转后上一页的提示不延续。
        enforcement: { kind: review }

      - id: CMP.MESSAGE.WORDING
        title_zh: 措辞用结果
        statement_zh: 写结果而不是过程（「已删除 3 辆车」，不写「操作成功」）；与按钮名对应（按钮「发布」→ 提示「已发布」）。
        enforcement: { kind: review }

  - key: notification
    title_zh: 通知提醒框
    group: components.feedback
    prefix: CMP.NOTIFICATION
    summary_zh: 系统级、需要用户知道但不必立刻处理的消息：右上角、停留更久、可关闭、可带一个动作。
    rules:
      - id: CMP.NOTIFICATION.WHEN
        title_zh: 系统级消息用通知
        statement_zh: 后台任务完成（导出就绪、导入结束）、他人操作影响到当前用户、连接断开与恢复用通知；当前操作的直接结果用全局提示或就地反馈。
        enforcement: { kind: review }

      - id: CMP.NOTIFICATION.CONTENT
        title_zh: 标题、描述、一个动作
        statement_zh: 标题说清是什么，描述说清影响；最多一个动作（「下载」「查看」）；停留 4–5 秒，带动作或错误类的不自动关闭。
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 带动作的通知
            code: |-
              notification.open({
                message: '车辆台账已导出',
                description: '共 1,248 条，文件保留 24 小时。',
                btn: () => h(Button, { size: 'small', onClick: download }, () => '下载'),
                duration: 0,
              })
            lang: ts

      - id: CMP.NOTIFICATION.STACK
        title_zh: 堆叠有上限
        statement_zh: 同时最多 3 条，更早的折叠；同一任务的进度与结果更新同一条通知，不新弹一条。
        enforcement: { kind: review }

  - key: modal
    title_zh: 对话框
    group: components.feedback
    prefix: CMP.MODAL
    summary_zh: 需要用户先做决定的弹窗：只用于短流程与确认；标题是问题或动作，按钮写动作名；可键盘操作与关闭；长表单改抽屉或新页面。
    rules:
      - id: CMP.MODAL.WHEN
        title_zh: 只用于短流程
        statement_zh: 对话框用于确认、简短的录入（不超过 5 个字段）与需要打断当前流程的决定；字段多、需要对照页面内容的录入用抽屉；更复杂的流程用新页面；不在对话框里再弹对话框。
        enforcement: { kind: review }

      - id: CMP.MODAL.CONTENT
        title_zh: 标题与按钮写动作
        statement_zh: 标题写动作或问题（「删除 3 辆车？」），正文写后果；按钮写具体动作（「删除」「取消」），主按钮在右；危险动作的主按钮用危险样式，默认焦点在取消上。
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 动作化的标题与按钮
            template: |-
              <div><a-button danger @click="s.open = true">删除选中车辆</a-button><a-modal v-model:open="s.open" title="删除 3 辆车？" ok-text="删除" cancel-text="取消" :ok-button-props="{ danger: true }"><p>删除后车辆的历史工单仍保留，但不能再派单。</p></a-modal></div>

      - id: CMP.MODAL.KEYBOARD
        title_zh: 键盘与焦点
        statement_zh: 打开时焦点进入对话框、在内部循环；Esc 关闭（有未保存内容时先确认）；关闭后焦点回到触发它的元素；遮罩点击是否关闭与 Esc 一致。
        enforcement: { kind: review }

      - id: CMP.MODAL.ASYNC
        title_zh: 确认中锁定
        statement_zh: 点主按钮后按钮进入加载态并锁定，请求完成再关闭；失败时保持打开并显示错误，不丢失用户输入。
        enforcement: { kind: review }

  - key: popconfirm
    title_zh: 气泡确认
    group: components.feedback
    prefix: CMP.POPCONFIRM
    summary_zh: 就地的轻量确认：只问一句、可撤回的操作才用；不可撤回或影响大的用对话框。
    rules:
      - id: CMP.POPCONFIRM.WHEN
        title_zh: 轻量确认就地问
        statement_zh: 删除一条记录、移除一个成员这类影响小、可恢复的操作用气泡确认；批量、不可撤回、影响他人的操作用对话框写清后果。
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 一句话确认
            template: |-
              <a-popconfirm title="移除这名司机？" ok-text="移除" cancel-text="取消"><a-button size="small">移除</a-button></a-popconfirm>

      - id: CMP.POPCONFIRM.WORDING
        title_zh: 问句 + 动作按钮
        statement_zh: 标题是一句问句，确认按钮写动作名（「移除」「删除」），不写「确定」；危险动作的确认按钮用危险样式。
        enforcement: { kind: review }

      - id: CMP.POPCONFIRM.ASYNC
        title_zh: 确认中加载
        statement_zh: 确认后按钮显示加载，请求完成再关闭；失败时提示原因并保持原状态。
        enforcement: { kind: review }

  - key: progress
    title_zh: 进度条
    group: components.feedback
    prefix: CMP.PROGRESS
    summary_zh: 长任务的进度：可估计的显示百分比与剩余量，不可估计的显示阶段；超过 10 秒的任务可离开页面后台进行。
    rules:
      - id: CMP.PROGRESS.DETERMINATE
        title_zh: 能估计就显示百分比
        statement_zh: 能估计进度的任务（导入、导出、上传）显示百分比与已完成数量（「已导入 320 / 1,248 条」）；失败时进度条转为错误态并写原因。
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 百分比与数量
            template: |-
              <div :style="{ width: '320px' }"><a-progress :percent="26" size="small" /><div :style="{ color: t['color.text.secondary'] }">已导入 320 / 1,248 条</div></div>

      - id: CMP.PROGRESS.INDETERMINATE
        title_zh: 不能估计就显示阶段
        statement_zh: 无法估计的过程显示当前阶段（「校验中」「写入中」），不用假的百分比；1 秒以内的过程不显示进度（见加载条与延迟出现）。
        enforcement: { kind: review }

      - id: CMP.PROGRESS.BACKGROUND
        title_zh: 长任务转后台
        statement_zh: 超过 10 秒的任务允许离开页面继续，完成后用通知告知；任务可取消时提供取消。
        enforcement: { kind: review }

  - key: spin
    title_zh: 加载中
    group: components.feedback
    prefix: CMP.SPIN
    summary_zh: 局部加载：只盖住正在加载的区域，延迟出现避免闪烁；整页加载用骨架或加载条。
    rules:
      - id: CMP.SPIN.SCOPE
        title_zh: 只盖住正在加载的区域
        statement_zh: 局部刷新时只在该区域显示加载（spinning 包裹区域），保留原内容的占位，不清空；整页首屏用骨架屏，路由切换用顶部加载条。
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 区域加载
            template: |-
              <a-spin :spinning="true" tip="刷新中"><a-card size="small" title="本月保养" :style="{ width: '320px' }">待保养 12 辆</a-card></a-spin>

      - id: CMP.SPIN.DELAY
        title_zh: 延迟出现
        statement_zh: 加载指示延迟约 200ms 出现，出现后至少显示约 400ms（LOADING.DELAY），避免快速请求时闪一下。
        enforcement: { kind: review }

      - id: CMP.SPIN.TEXT
        title_zh: 久了要说话
        statement_zh: 超过 2 秒的加载在指示旁写在做什么（「正在汇总 3 个月的数据」）；超过 10 秒提供取消或转后台。
        enforcement: { kind: review }

  # ─────────────────────────── 设计模式 · 全局规则 · 反馈 ───────────────────────────
  - key: feedback
    title_zh: 反馈
    group: patterns.global
    prefix: FEEDBACK
    summary_zh: 按反馈的重要程度和用户是否需要处理来选提示方式；失败要给恢复动作；加载、空状态、部分成功各有固定做法。
    rules:
      - id: FEEDBACK.CHOOSE
        title_zh: 按重要程度选提示方式
        statement_zh: 操作结果轻、用户不必等待时用全局提示（顶部居中，约 3 秒自动消失）；重要且必须处理的才用对话框；系统主动推送的消息用通知提醒框（右上角）；需要在页面上常驻的说明用警告提示（不自动消失）；操作前的二次确认用贴着按钮的气泡确认框。能立刻看到结果的简单操作可以不提示，不要过度反馈。
        params:
          channels:
            value: { 轻量结果: message 全局提示, 必须处理: modal 对话框, 系统推送: notification 通知提醒框, 页面常驻说明: alert 警告提示, 操作前确认: popconfirm 气泡确认框 }
            source: SRC.ANTD.SPEC.FEEDBACK
            label_zh: 场景 → 提示方式
          message_duration: { value: 3000, unit: ms, source: SRC.ANTD.SPEC.FEEDBACK, label_zh: 全局提示停留时长 }
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 页面常驻说明用警告提示
            template: |-
              <a-alert type="info" show-icon message="停用的车型不会出现在下单页，已有运单不受影响。" :style="{ maxWidth: '520px' }" />
          - kind: do
            title_zh: 轻量结果用全局提示
            code: |-
              message.success(t('vehicleModel.saved'))   // 「车型已保存」，约 3 秒后自动消失
            lang: ts

      - id: FEEDBACK.FAILURE
        title_zh: 失败的处理
        statement_zh: 重要的失败不用会自动消失的全局提示，用警告提示或对话框，写清发生了什么，并给出恢复动作（重试、下载错误明细、联系管理员）；权限不足、离线也一样要给恢复动作。
        anchors:
          - { spec: ui, quote: MUST NOT 错误通知自动消失且不可恢复（除非用户可重新查看）。 }
          - { spec: page, quote: error、permission 和 offline 提供恢复动作。 }
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 警告提示 + 恢复动作
            template: |-
              <a-alert type="error" show-icon message="导入失败：第 12 行车型编码 VM-001 已存在" :style="{ maxWidth: '560px' }">
                <template #action><a-button size="small">下载错误明细</a-button></template>
              </a-alert>
          - kind: dont
            title_zh: 3 秒后消失、没有下一步
            code: |-
              message.error('导入失败')
            lang: ts

      - id: FEEDBACK.LOADING
        title_zh: 加载反馈
        statement_zh: 预计超过约 2 秒的操作立即给出加载反馈：短的用加载态（按钮 loading、局部 Spin），长的用进度条并允许取消；首屏加载用骨架屏，骨架保持主要布局尺寸，加载完成后页面不跳动。
        params:
          threshold: { value: 2000, unit: ms, source: SRC.ANTD.SPEC.FEEDBACK, label_zh: 需要加载反馈的耗时 }
        anchors:
          - { spec: page, quote: 首屏骨架保持主要布局尺寸。 }
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 按钮加载态、进度条、骨架屏
            template: |-
              <div :style="{ display: 'flex', flexDirection: 'column', gap: t['spacing.lg'] + 'px', maxWidth: '420px' }">
                <a-button type="primary" loading>正在保存</a-button>
                <a-progress :percent="45" status="active" />
                <a-skeleton active :paragraph="{ rows: 2 }" />
              </div>

      - id: FEEDBACK.FIELD_ERROR
        title_zh: 字段错误
        statement_zh: 校验错误显示在对应字段下方，用文字说明怎么改，用户修改前不消失；提交失败时页面顶部给出错误摘要并聚焦到第一个错误字段；不能只靠颜色、图标或全局提示表达字段错误；提交失败不清空已填内容。
        anchors:
          - { spec: ui, quote: 错误必须与字段关联，并以文本描述提供纠错建议；提交时提供错误摘要并聚焦第一个错误字段 }
          - { spec: page, quote: MUST NOT 提交失败清空输入。 }
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 错误文字贴着字段
            template: |-
              <a-form layout="horizontal" :label-col="{ span: 6 }" :wrapper-col="{ span: 14 }" :style="{ maxWidth: '520px' }">
                <a-form-item label="车型编码" required validate-status="error" help="VM-001 已存在，换一个编码">
                  <a-input value="VM-001" />
                </a-form-item>
              </a-form>

      - id: FEEDBACK.EMPTY
        title_zh: 空状态
        statement_zh: 还没有任何数据时，空状态引导第一步操作（如「新建车型」）；筛选或搜索没有结果时，说明没找到并提供「清除筛选」。两种情况文案和动作不同。
        anchors:
          - { spec: page, quote: empty 区分无数据与筛选无结果。 }
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 还没有数据：引导第一步
            template: |-
              <a-empty description="还没有车型">
                <a-button type="primary">新建车型</a-button>
              </a-empty>
          - kind: do
            title_zh: 筛选无结果：提供清除筛选
            template: |-
              <a-empty description="没有符合条件的车型">
                <a-button>清除筛选</a-button>
              </a-empty>

      - id: FEEDBACK.PARTIAL
        title_zh: 部分成功
        statement_zh: 批量操作部分成功时，结果里写明成功、失败、跳过各多少条，并提供失败明细；不能只说「操作成功」或「操作失败」。
        anchors:
          - { spec: page, quote: partial success 提供成功/失败/跳过数量和明细。 }
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 结果页写清三个数
            template: |-
              <a-result status="warning" title="导入完成，部分失败" sub-title="成功 120 条，失败 3 条，跳过 2 条">
                <template #extra><a-button type="primary">下载失败明细</a-button></template>
              </a-result>

      - id: FEEDBACK.BADGE
        title_zh: 徽标
        statement_zh: 与用户强相关的重要信息（待审批数）用数字徽标，次要提醒用红点；有图标时放在图标右上角，没有图标时放在标题后。
        params:
          rule:
            value: { 重要且与用户相关: 数字, 次要提醒: 红点 }
            source: SRC.ANTD.SPEC.FEEDBACK
            label_zh: 信息类型 → 徽标形式
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 数字与红点
            template: |-
              <div :style="{ display: 'flex', alignItems: 'center', gap: t['spacing.xxl'] + 'px', fontSize: t['typography.size.body_large'] + 'px' }">
                <a-badge :count="5"><BellOutlined :style="{ fontSize: '20px' }" /></a-badge>
                <a-badge dot><MailOutlined :style="{ fontSize: '20px' }" /></a-badge>
              </div>

  # ─────────────────────────── 设计模式 · 全局规则 · 导航 ───────────────────────────
  - key: navigation
    title_zh: 导航
    group: patterns.global
    prefix: NAV
    summary_zh: 管理侧用左侧菜单；顶部导航只在一级入口少时用；面包屑、标签页、步骤条、分页各有数量与字数上限。
    rules:
      - id: NAV.ADMIN_SIDE
        title_zh: 管理侧主导航
        statement_zh: 管理侧主导航用左侧菜单，适合多级、操作密集的工作台。菜单项按业务域分组，多了可以滚动；当前页面在菜单里高亮。菜单高亮按路由的稳定标识匹配，不按标题文字或截取 URL 判断。
        surfaces: [admin]
        params:
          sider_width: { value: 200, unit: px, source: SRC.ANTD.COMP.LAYOUT, label_zh: 菜单宽度 }
        anchors:
          - { spec: page, quote: MUST NOT 用标题字符串或 URL 截取判断菜单。 }
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 按业务域分组的多级菜单
            template: |-
              <a-menu mode="inline" :style="{ width: p.sider_width + 'px' }" :selected-keys="['vehicle-model']" :open-keys="['master', 'plan']" :items="[
                { key: 'master', label: '基础数据', children: [{ key: 'vehicle-model', label: '车型管理' }, { key: 'dict', label: '数据字典' }] },
                { key: 'plan', label: '运输计划', children: [{ key: 'plan-list', label: '计划列表' }, { key: 'plan-board', label: '调度看板' }] }
              ]" />

      - id: NAV.TOP
        title_zh: 顶部导航
        statement_zh: 顶部导航只在一级入口为 2 到 7 个时使用，常见于用户侧门户；每个导航项名称不超过 14 个字。
        params:
          min_items: { value: 2, unit: count, source: SRC.ANTD.SPEC.NAVIGATION, label_zh: 一级入口下限 }
          max_items: { value: 7, unit: count, source: SRC.ANTD.SPEC.NAVIGATION, label_zh: 一级入口上限 }
          label_max: { value: 14, unit: chars, source: SRC.ANTD.SPEC.NAVIGATION, label_zh: 导航项字数上限 }
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 五个一级入口
            template: |-
              <a-menu mode="horizontal" :selected-keys="['home']" :items="[{ key: 'home', label: '首页' }, { key: 'order', label: '我的订单' }, { key: 'track', label: '运单追踪' }, { key: 'invoice', label: '发票' }, { key: 'help', label: '帮助中心' }]" />

      - id: NAV.BREADCRUMB
        title_zh: 面包屑
        statement_zh: 面包屑显示当前页在层级里的位置，建议不超过 3 级、最多 5 级；页面自身的导航已经能说明位置时不加面包屑。
        params:
          recommended_max: { value: 3, unit: count, source: SRC.ANTD.SPEC.NAVIGATION, label_zh: 建议层级上限 }
          max: { value: 5, unit: count, source: SRC.ANTD.SPEC.NAVIGATION, label_zh: 层级上限 }
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 三级面包屑
            template: |-
              <a-breadcrumb>
                <a-breadcrumb-item>基础数据</a-breadcrumb-item>
                <a-breadcrumb-item>车型管理</a-breadcrumb-item>
                <a-breadcrumb-item>车型详情</a-breadcrumb-item>
              </a-breadcrumb>

      - id: NAV.TABS
        title_zh: 标签页
        statement_zh: 标签页名称不超过 14 个字。切换整页核心功能用基础标签页；切换页面局部内容用卡片式标签页；卡片里的小范围切换用分段控件；选项很多时改用竖向标签页。
        params:
          label_max: { value: 14, unit: chars, source: SRC.ANTD.SPEC.NAVIGATION, label_zh: 标签名字数上限 }
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 页面级标签页 + 卡片内分段控件
            template: |-
              <div :style="{ display: 'flex', flexDirection: 'column', gap: t['spacing.lg'] + 'px' }">
                <a-tabs active-key="base">
                  <a-tab-pane key="base" tab="基本信息" />
                  <a-tab-pane key="spec" tab="规格参数" />
                  <a-tab-pane key="log" tab="变更记录" />
                </a-tabs>
                <a-segmented :options="['按日', '按周', '按月']" value="按周" />
              </div>

      - id: NAV.STEPS
        title_zh: 步骤条
        statement_zh: 有固定流程的任务用步骤条。横向步骤条放 3 到 4 步，每步标题不超过 11 个字；步骤更多或数量会变时，用固定在页面左侧的竖向步骤条。
        params:
          horizontal_min: { value: 3, unit: count, source: SRC.ANTD.SPEC.NAVIGATION, label_zh: 横向步数下限 }
          horizontal_max: { value: 4, unit: count, source: SRC.ANTD.SPEC.NAVIGATION, label_zh: 横向步数上限 }
          title_max: { value: 11, unit: chars, source: SRC.ANTD.SPEC.NAVIGATION, label_zh: 步骤标题字数上限 }
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 三步流程
            template: |-
              <a-steps :current="1" :items="[{ title: '填写基本信息' }, { title: '上传资料' }, { title: '提交审核' }]" />

      - id: NAV.PAGINATION
        title_zh: 分页
        statement_zh: 管理侧列表用页码分页：默认每页 20 条，每页最多 200 条；超过 5 页时提供快速跳转，数据多时允许改每页条数；卡片或浮层里用迷你分页。用户侧列表用「加载更多」的游标分页，与接口的 KEYSET 分页一致，每次最多 50 条，不显示总页数。不得前端拉全量再假分页。
        params:
          admin_page_size: { value: 20, unit: count, source: SRC.POMASTER.SURFACES, label_zh: 管理侧默认每页条数 }
          admin_max_page_size: { value: 200, unit: count, source: SRC.POMASTER.SURFACES, label_zh: 管理侧每页上限 }
          quick_jumper_after: { value: 5, unit: count, source: SRC.ANTD.SPEC.NAVIGATION, label_zh: 超过多少页加快速跳转 }
          public_max_page_size: { value: 50, unit: count, source: SRC.POMASTER.SURFACES, label_zh: 用户侧每次加载上限 }
        anchors:
          - { spec: ui, quote: MUST NOT 前端加载全量数据假分页。 }
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 管理侧页码分页
            template: |-
              <a-pagination :total="1280" :page-size="p.admin_page_size" show-quick-jumper show-size-changer :page-size-options="[String(p.admin_page_size), '50', '100', String(p.admin_max_page_size)]" />

  # ─────────────────────────── 设计模式 · 全局规则 · 数据录入 ───────────────────────────
  - key: data_entry
    title_zh: 数据录入
    group: patterns.global
    prefix: ENTRY
    summary_zh: 标签常驻可见、位置全系统一致；选择控件按选项数选；提示放对位置；校验分前后端；提交防重复且失败不丢输入。
    rules:
      - id: ENTRY.LABEL
        title_zh: 输入标签
        statement_zh: 每个输入都有常驻可见的标签，必填项有标记。管理侧表单默认标签在输入左侧、右对齐、带冒号；标签很长或界面是英文时放到输入上方；同一个系统只用一种。占位文字只是补充提示，不能代替标签。
        surfaces: [admin]
        params:
          label_position: { value: 左侧，右对齐，带冒号, source: SRC.ANTD.SPEC.ALIGNMENT, label_zh: 标签位置 }
        anchors:
          - { spec: page, quote: 每个输入必须有持久可见且程序化关联的标签、格式说明和必要性提示；placeholder 不得替代标签。 }
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 标签在左、右对齐、带冒号
            template: |-
              <a-form layout="horizontal" :label-col="{ span: 6 }" :wrapper-col="{ span: 14 }" :style="{ maxWidth: '520px' }">
                <a-form-item label="车型编码" required><a-input placeholder="如 VM-001" /></a-form-item>
                <a-form-item label="车型名称" required><a-input /></a-form-item>
                <a-form-item label="载重（吨）"><a-input-number :min="0" :style="{ width: '100%' }" /></a-form-item>
              </a-form>
          - kind: dont
            title_zh: 只有占位文字，填了之后就不知道是什么
            template: |-
              <div :style="{ display: 'flex', flexDirection: 'column', gap: t['spacing.sm'] + 'px', maxWidth: '320px' }">
                <a-input placeholder="车型编码" />
                <a-input placeholder="车型名称" />
              </div>

      - id: ENTRY.CHOICE_CONTROL
        title_zh: 选择控件
        statement_zh: 二选一、改了立即生效的用开关；选项多于 2 个、少于 5 个用单选按钮全部摆出来；多于 5 个用下拉选择；多选少量用复选框组，多了用多选下拉；需要精确数值时不用滑块，用数字输入。
        params:
          radio_range: { value: [3, 4], unit: count, source: SRC.ANTD.SPEC.DATA_ENTRY, label_zh: 单选按钮的选项数 }
          select_above: { value: 5, unit: count, source: SRC.ANTD.SPEC.DATA_ENTRY, label_zh: 多于这个数用下拉 }
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 3 个选项用单选，选项多用下拉，即时生效用开关
            template: |-
              <div :style="{ display: 'flex', flexDirection: 'column', gap: t['spacing.lg'] + 'px', alignItems: 'flex-start' }">
                <a-radio-group value="box" :options="[{ label: '厢式', value: 'box' }, { label: '平板', value: 'flat' }, { label: '冷藏', value: 'cold' }]" />
                <a-select value="beijing" :style="{ width: '200px' }" :options="[{ label: '北京', value: 'beijing' }, { label: '上海', value: 'shanghai' }, { label: '广州', value: 'guangzhou' }, { label: '深圳', value: 'shenzhen' }, { label: '成都', value: 'chengdu' }, { label: '武汉', value: 'wuhan' }]" />
                <a-switch checked checked-children="启用" un-checked-children="停用" />
              </div>
          - kind: dont
            title_zh: 两个选项用下拉，多点一次还看不到全部
            template: |-
              <a-select value="enabled" :style="{ width: '200px' }" :options="[{ label: '启用', value: 'enabled' }, { label: '停用', value: 'disabled' }]" />

      - id: ENTRY.SWITCH_IMMEDIATE
        title_zh: 开关即时生效
        statement_zh: 开关拨动即生效，旁边不放「保存」按钮，开关两侧文字写清当前状态（启用、停用）；需要和其他字段一起提交才生效的，用复选框。
        params:
          labels: { value: [启用, 停用], source: SRC.ANTD.SPEC.DATA_ENTRY, label_zh: 状态文字示例 }
        enforcement: { kind: review }

      - id: ENTRY.HINTS
        title_zh: 提示
        statement_zh: 短提示放在字段下方，不超过一句话；长说明收进字段旁的信息图标，悬停显示；收集身份证号、手机号等敏感信息时，写明为什么需要；能给合理默认值就给。
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 字段下方一句话提示
            template: |-
              <a-form layout="horizontal" :label-col="{ span: 6 }" :wrapper-col="{ span: 14 }" :style="{ maxWidth: '520px' }">
                <a-form-item label="联系电话" extra="用于司机到达前联系收货人，不会对外展示"><a-input /></a-form-item>
              </a-form>

      - id: ENTRY.VALIDATION
        title_zh: 校验
        statement_zh: 前端先校验格式（必填、长度、格式），后端返回的字段错误定位到对应字段并聚焦；提交中按钮进入加载态防止重复提交；提交失败保留已填内容。
        anchors:
          - { spec: page, quote: 前端先做格式校验，后端字段错误定位并聚焦字段。 }
          - { spec: page, quote: 提交防重复并保留失败输入。 }
        enforcement: { kind: review }

      - id: ENTRY.UPLOAD
        title_zh: 上传
        statement_zh: 单个文件、不需要预览，用点击上传；图片用缩略图上传，达到数量上限后隐藏上传按钮；拖拽上传区写明允许的文件格式和大小，上传中显示进度。
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 写明格式与大小
            template: |-
              <a-upload-dragger :before-upload="() => false" :style="{ maxWidth: '420px' }">
                <p :style="{ margin: 0 }">点击或拖拽文件到这里上传</p>
                <p :style="{ margin: 0, color: t['color.text.tertiary'] }">支持 xlsx，单个文件不超过 5 MB</p>
              </a-upload-dragger>

  # ─────────────────────────── 设计模式 · 全局规则 · 数据展示 ───────────────────────────
  - key: data_display
    title_zh: 数据展示
    group: patterns.global
    prefix: DISPLAY
    summary_zh: 表格列有稳定的类型、宽度与对齐；卡片一行最多 4 张；折叠、时间轴、轮播各有用法；每种展示都要设计超长与空数据。
    rules:
      - id: DISPLAY.TABLE_COLUMNS
        title_zh: 表格列
        statement_zh: 每列有稳定的 key、标题、值类型和宽度策略；时间、状态、操作列不换行；金额、数量右对齐，同列小数位一致，单位写在表头；空单元格显示「-」；长文本单行省略、悬停看全文。
        params:
          empty: { value: "-", source: SRC.ANTD.SPEC.DATA_DISPLAY, label_zh: 空值占位, note_zh: 数据格式页写的是「--」，全站只取一种，这里取「-」 }
        anchors:
          - { spec: ui, quote: 每列有稳定 key、标题、值类型、宽度策略、权限和导出规则。 }
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 金额右对齐、单位在表头、空值用「-」
            template: |-
              <a-table size="small" :pagination="false" :style="{ maxWidth: '620px' }" row-key="code"
                :columns="[
                  { title: '车型编码', dataIndex: 'code', key: 'code', width: 110 },
                  { title: '车型名称', dataIndex: 'name', key: 'name', ellipsis: true },
                  { title: '运费（元）', dataIndex: 'fee', key: 'fee', align: 'right', width: 120 },
                  { title: '状态', dataIndex: 'status', key: 'status', width: 80 }
                ]"
                :data-source="[
                  { code: 'VM-001', name: '轻型厢式货车（国六，冷链改装版）', fee: '1,280.00', status: '启用' },
                  { code: 'VM-002', name: '平板运输车', fee: '960.50', status: '启用' },
                  { code: 'VM-003', name: '冷藏车', fee: p.empty, status: '停用' }
                ]" />

      - id: DISPLAY.CARD_GRID
        title_zh: 卡片排布
        statement_zh: 卡片用来把相关信息收拢成一块，按栅格排列，一行最多 4 张；卡片里的长文本截断，卡片之间间距一致。
        params:
          per_row_max: { value: 4, unit: count, source: SRC.ANTD.SPEC.DATA_DISPLAY, label_zh: 一行最多卡片数 }
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 一行 4 张
            template: |-
              <a-row :gutter="16" :style="{ maxWidth: '760px' }">
                <a-col v-for="n in p.per_row_max" :key="n" :span="24 / p.per_row_max">
                  <a-card size="small" :title="'车型 ' + n">载重 1.5 吨</a-card>
                </a-col>
              </a-row>

      - id: DISPLAY.COLLAPSE
        title_zh: 折叠
        statement_zh: 长而不规则的内容用折叠面板逐步展开；各面板之间关系松散时用手风琴，一次只展开一个。
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 手风琴
            template: |-
              <a-collapse accordion active-key="1" :style="{ maxWidth: '520px' }">
                <a-collapse-panel key="1" header="规格参数">载重 1.5 吨，车厢长度 4.2 米。</a-collapse-panel>
                <a-collapse-panel key="2" header="变更记录">2026-10-28 修改载重。</a-collapse-panel>
              </a-collapse>

      - id: DISPLAY.TIMELINE
        title_zh: 时间轴
        statement_zh: 按时间记录的事件、任务用竖向时间轴，最新的在最上面。
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 新的在上
            template: |-
              <a-timeline>
                <a-timeline-item>2026-11-02 10:20 审核通过</a-timeline-item>
                <a-timeline-item>2026-11-01 16:05 提交审核</a-timeline-item>
                <a-timeline-item>2026-11-01 09:30 创建车型</a-timeline-item>
              </a-timeline>

      - id: DISPLAY.CAROUSEL
        title_zh: 轮播
        statement_zh: 轮播只放同级内容（图片、卡片），3 到 5 张，让用户看得出一共几张、往哪个方向切。管理侧工作页不用轮播。
        params:
          slides: { value: [3, 5], unit: count, source: SRC.ANTD.SPEC.DATA_DISPLAY, label_zh: 张数范围 }
        enforcement: { kind: review }

      - id: DISPLAY.EDGE_CASES
        title_zh: 超长与空数据
        statement_zh: 每个展示组件都要设计两种边界情况：内容超长（截断、换行或展开）和没有数据（空状态）。按重要程度、使用频率和关联程度排列信息。
        enforcement: { kind: review }

  # ─────────────────────────── 设计模式 · 全局规则 · 数据格式 ───────────────────────────
  - key: data_format
    title_zh: 数据格式
    group: patterns.global
    prefix: FORMAT
    summary_zh: 数字、金额、日期时间、相对时间、脱敏各有固定格式，全部经格式化注册表输出，页面里不手拼。
    rules:
      - id: FORMAT.NUMBER
        title_zh: 数字
        statement_zh: 数字默认带千分位；单位小写、紧跟数字（123,220kg）；比例用百分比（12.32%），进度用分数（12/30）；很大的数可以用「万」「亿」，不用「千」作单位；表格里的单位写在表头，不写在每个单元格。
        params:
          examples: { value: ['123,220kg', '12.32%', '12/30'], source: SRC.ANTD.SPEC.DATA_FORMAT, label_zh: 写法示例 }
          large_units: { value: [万, 亿], source: SRC.ANTD.SPEC.DATA_FORMAT, label_zh: 可用的大数单位 }
        enforcement: { kind: review }

      - id: FORMAT.AMOUNT
        title_zh: 金额
        statement_zh: 金额写成货币代码加数字（CNY 1,280.00），保留到分（两位小数），列表里右对齐并用等宽数字；货币代码用 ISO 4217，不在代码里写死 ¥、$ 符号；经格式化注册表输出。
        params:
          code: { value: CNY, source: SRC.ANTD.SPEC.DATA_FORMAT, label_zh: 人民币代码 }
          decimals: { value: 2, unit: count, source: SRC.POMASTER.PRESET, label_zh: 小数位 }
        anchors:
          - spec: i18n
            quote: '货币代码使用 ISO 4217（`CNY`、`USD`、`EUR`）；禁止用 `$`、`￥` 符号硬编码。'
        enforcement: { kind: gate, check: format.no-local-pattern }
        examples:
          - kind: do
            title_zh: 经格式化注册表输出
            code: |-
              formatMoney(row.fee, { currency: 'CNY' })   // CNY 1,280.00
            lang: ts
          - kind: dont
            title_zh: 页面里拼符号和小数
            code: |-
              '¥' + row.fee.toFixed(2)
            lang: ts

      - id: FORMAT.DATETIME
        title_zh: 日期时间
        statement_zh: 日期 YYYY-MM-DD，时间 24 小时制 HH:mm:ss，日期与时间之间一个空格；日期区间用「～」，两侧各一个空格；存储用 ISO 8601（UTC），显示按用户时区转换；全部经格式化注册表输出，页面里不手拼格式串。
        params:
          date: { value: YYYY-MM-DD, source: SRC.ANTD.SPEC.DATA_FORMAT, label_zh: 日期 }
          time: { value: "HH:mm:ss", source: SRC.ANTD.SPEC.DATA_FORMAT, label_zh: 时间 }
          datetime: { value: "YYYY-MM-DD HH:mm:ss", source: SRC.ANTD.SPEC.DATA_FORMAT, label_zh: 日期时间 }
          range_separator: { value: " ～ ", source: SRC.ANTD.SPEC.DATA_FORMAT, label_zh: 区间分隔 }
        anchors:
          - spec: i18n
            quote: '日期、时间、相对时间通过 Formatter Registry 统一输出；禁止页面本地拼接 `YYYY-MM-DD` 或写死 "2 天前"。'
          - { spec: i18n, quote: 存储时间使用 ISO 8601 / UTC；显示时间按用户 locale + 显式时区转换。 }
        enforcement: { kind: gate, check: format.no-local-pattern }
        examples:
          - kind: do
            title_zh: 注册表输出
            code: |-
              formatDateTime(row.updatedAt)              // 2026-11-02 14:08:00
              formatDateRange(range.start, range.end)    // 2026-11-01 ～ 2026-11-30
            lang: ts
          - kind: dont
            title_zh: 页面里手拼格式串
            code: |-
              dayjs(row.updatedAt).format('YYYY/MM/DD HH:mm')
            lang: ts

      - id: FORMAT.RELATIVE_TIME
        title_zh: 相对时间
        statement_zh: 消息、通知里的时间用相对时间：1 分钟内写「刚刚」，1 小时内写「N 分钟前」，24 小时内写「N 小时前」，超过 24 小时写「MM-DD HH:mm」，超过一年写「YYYY-MM-DD HH:mm」。同样经格式化注册表输出。
        params:
          tiers:
            value: { 1 分钟内: 刚刚, 1 小时内: N 分钟前, 24 小时内: N 小时前, 超过 24 小时: "MM-DD HH:mm", 超过一年: "YYYY-MM-DD HH:mm" }
            source: SRC.ANTD.SPEC.DATA_FORMAT
            label_zh: 时间差 → 写法
        enforcement: { kind: review }

      - id: FORMAT.MASKING
        title_zh: 脱敏
        statement_zh: 管理侧展示个人信息（领域规格里分级为 pii / sensitive_pii 的字段）时脱敏：用 * 替换并保持位数；金额、时间等高度敏感的值整体隐藏为 ***。各类信息保留的位数按下表，业务更严格时可以收紧。
        surfaces: [admin]
        params:
          rules:
            value: { 姓名: 两个字留首字，三个字及以上留首尾, 手机号: 留前 3 后 4, 证件号: 高留首尾各 1，中留前 3 后 3，低留前 6 后 4, 银行卡: 高留后 4，中留前 6 后 4，低留前 4 后 6, 邮箱: 留域名和账号前 3 位, 地址: 留到省市区 }
            source: SRC.ANTD.SPEC.DATA_FORMAT
            label_zh: 信息类型 → 保留位数
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 保持位数的部分脱敏
            template: |-
              <a-descriptions :column="1" size="small" bordered :style="{ maxWidth: '420px' }">
                <a-descriptions-item label="收货人">张*明</a-descriptions-item>
                <a-descriptions-item label="手机号">138****5678</a-descriptions-item>
                <a-descriptions-item label="地址">广东省深圳市南山区***</a-descriptions-item>
              </a-descriptions>

  # ─────────────────────────── 设计模式 · 全局规则 · 文案 ───────────────────────────
  - key: copywriting
    title_zh: 文案
    group: patterns.global
    prefix: COPY
    summary_zh: 界面文字走文案字典；从用户视角、简洁一致地写；语气平和；报错说清怎么办；标点与用词统一。
    rules:
      - id: COPY.NO_LITERAL
        title_zh: 文案字典
        statement_zh: 模板、组件、脚本里不写死界面文字，统一经文案字典的 key 取用（用户数据除外）；key 用稳定的点分标识，如 vehicleModel.form.code，不用文案本身作 key；插值用命名占位符 {name}。
        anchors:
          - { spec: i18n, quote: 禁止在模板/组件/脚本中硬编码任何自然语言文本（用户数据除外）。 }
          - { spec: i18n, quote: key 使用稳定标识，禁止用中文/英文文案本身作为 key。 }
        enforcement: { kind: gate, check: text.no-literal-copy }
        examples:
          - kind: do
            title_zh: 经 key 取文案
            code: |-
              <a-form-item :label="t('vehicleModel.form.code')">
            lang: vue
          - kind: dont
            title_zh: 模板里写死中文
            code: |-
              <a-form-item label="车型编码">
            lang: vue

      - id: COPY.USER_VIEW
        title_zh: 用户视角
        statement_zh: 写用户能做什么、会得到什么，不写系统怎么实现；去掉用户已经知道的话；用常见、具体的词；同一事物全系统一个叫法，操作名称和它打开的页面标题一致；最重要的信息放在最前面。
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 说结果
            code: |-
              停用后，这个车型不会出现在下单页。
            lang: html
          - kind: dont
            title_zh: 说实现
            code: |-
              系统将把该车型的 status 字段更新为 DISABLED。
            lang: html

      - id: COPY.TONE
        title_zh: 语气
        statement_zh: 称呼用「你」，同一句里不混用「你」「我」；多给建议，少用「不能」「不要」「请勿」这类命令；出了问题聚焦怎么解决，不指责用户；「抱歉」只用在系统造成的问题上；不用「绝不」这类绝对化说法。
        enforcement: { kind: review }

      - id: COPY.ERROR_MESSAGE
        title_zh: 报错文案
        statement_zh: 报错写清两件事：发生了什么（客观描述，不只给错误码），用户下一步怎么做。错误码可以附在后面供排查。
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 原因 + 下一步
            template: |-
              <a-alert type="error" show-icon message="车型编码 VM-001 已存在" description="换一个编码，或打开已有车型继续编辑。" :style="{ maxWidth: '480px' }" />
          - kind: dont
            title_zh: 只有错误码
            template: |-
              <a-alert type="error" show-icon message="操作失败（40901）" :style="{ maxWidth: '480px' }" />

      - id: COPY.PUNCTUATION
        title_zh: 标点与空格
        statement_zh: 中文与数字、英文之间加一个空格（2 个、5 MB）；按钮、标题、输入提示、表格里的短句不加句号；感叹号只用于问候和祝贺；省略号用「…」；连接号用半角「-」；隐私遮挡用「*」。
        enforcement: { kind: review }

      - id: COPY.TERMS
        title_zh: 用词
        statement_zh: 规范用词：写「其他」不写「其它」，写「登录」不写「登陆」，指代时「此」比「该」更明确；统计数字用阿拉伯数字。禁用词表随项目补充。
        params:
          banned: { value: { 其它: 其他, 登陆: 登录 }, source: SRC.ANTD.SPEC.COPYWRITING, label_zh: 禁用词 → 规范词 }
        enforcement: { kind: gate, check: text.banned-terms }

  # ─────────────────────────── 设计模式 · 全局规则 · 按钮 ───────────────────────────
  - key: buttons
    title_zh: 按钮
    group: patterns.global
    prefix: BUTTON
    summary_zh: 按用途选按钮类型；一个按钮区一个主按钮；推荐操作在前、风险操作在后、「更多」在最右；文案用动词。
    rules:
      - id: BUTTON.TYPES
        title_zh: 按钮类型
        statement_zh: 主按钮用于完成、推荐类操作；拿不准时用次按钮；表格操作列等大量重复的地方用文字按钮；引导「在这里添加」用虚线按钮；删除等有风险的操作用危险按钮；空间小、按钮多时用图标按钮，必须配文字提示；一个按钮里不放两个图标。
        params:
          map:
            value: { 完成与推荐: 主按钮, 其余操作: 次按钮, 表格操作列: 文字按钮, 引导添加: 虚线按钮, 有风险: 危险按钮, 空间小: 图标按钮（配文字提示） }
            source: SRC.ANTD.SPEC.BUTTONS
            label_zh: 用途 → 类型
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 各类型的用途
            template: |-
              <div :style="{ display: 'flex', flexWrap: 'wrap', alignItems: 'center', gap: t['spacing.sm'] + 'px' }">
                <a-button type="primary">保存</a-button>
                <a-button>取消</a-button>
                <a-button type="dashed"><template #icon><PlusOutlined /></template>添加规格</a-button>
                <a-button type="link">查看</a-button>
                <a-button danger>删除</a-button>
              </div>

      - id: BUTTON.SINGLE_PRIMARY
        title_zh: 主按钮
        statement_zh: 同一个按钮区（工具栏、弹窗底部、表单底部）最多一个主按钮，其余用次按钮或文字按钮。
        params:
          max_primary: { value: 1, unit: count, source: SRC.ANTD.SPEC.BUTTONS, label_zh: 每个按钮区主按钮上限 }
        enforcement: { kind: gate, check: markup.single-primary-button }
        examples:
          - kind: do
            title_zh: 一个主按钮
            template: |-
              <div :style="{ display: 'flex', gap: t['spacing.sm'] + 'px' }"><a-button type="primary">提交审核</a-button><a-button>保存草稿</a-button><a-button>取消</a-button></div>
          - kind: dont
            title_zh: 三个主按钮，看不出该点哪个
            template: |-
              <div :style="{ display: 'flex', gap: t['spacing.sm'] + 'px' }"><a-button type="primary">提交审核</a-button><a-button type="primary">保存草稿</a-button><a-button type="primary">取消</a-button></div>

      - id: BUTTON.ORDER
        title_zh: 按钮顺序
        statement_zh: 推荐的操作放在阅读起点，有风险的操作放最后，折叠起来的「更多」永远在最右；有返回含义的按钮放最左。工具栏按「推进业务（新建、保存、发布）→ 视图控制 → 其他（刷新、设置）→ 更多」排列。
        anchors:
          - { spec: page, quote: 主次操作、批量操作和状态信息位置一致。 }
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 工具栏顺序
            template: |-
              <div :style="{ display: 'flex', justifyContent: 'flex-end', gap: t['spacing.sm'] + 'px', maxWidth: '620px' }">
                <a-button type="primary"><template #icon><PlusOutlined /></template>新建车型</a-button>
                <a-button><template #icon><DownloadOutlined /></template>导出</a-button>
                <a-button aria-label="刷新"><template #icon><ReloadOutlined /></template></a-button>
                <a-button aria-label="更多"><template #icon><MoreOutlined /></template></a-button>
              </div>

      - id: BUTTON.PLACEMENT
        title_zh: 按钮位置
        statement_zh: 按钮放在它作用的内容旁边；工具栏的按钮靠右；页面底部的按钮区只用于两种情况：详情页推进流程（审批通过、驳回）和拆成多张卡片的复杂表单。
        enforcement: { kind: review }

      - id: BUTTON.COPY
        title_zh: 按钮文案
        statement_zh: 按钮文案用动词（下拉按钮除外），简短、说清点了会发生什么，如「发布」「保存车型」，少用「确定」「提交」这类泛词；主要操作本身是否定动作时点明后果，如「删除车型」。
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 说清结果
            template: |-
              <div :style="{ display: 'flex', gap: t['spacing.sm'] + 'px' }"><a-button danger type="primary">删除车型</a-button><a-button>取消</a-button></div>
          - kind: dont
            title_zh: 泛词，看不出后果
            template: |-
              <div :style="{ display: 'flex', gap: t['spacing.sm'] + 'px' }"><a-button type="primary">确定</a-button><a-button>取消</a-button></div>

      - id: BUTTON.GROUPING
        title_zh: 按钮分组
        statement_zh: 按钮之间用间距分组，确有需要才加分割线；不要把普通按钮拼接成一组，容易被当成切换按钮。
        enforcement: { kind: review }

  # ─────────────────────────── 设计模式 · 全局规则 · 数据列表 ───────────────────────────
  - key: data_list
    title_zh: 数据列表
    group: patterns.global
    prefix: LIST
    summary_zh: 按数据选列表形态与查询方式；分页并记住位置；详情打开方式有选择规则；批量、新建、删除各有固定做法。
    rules:
      - id: LIST.FORM
        title_zh: 列表形态
        statement_zh: 多字段、需要比较的数据用表格；空间小（侧栏、下拉、小弹窗）时用竖向列表；展示型内容用卡片网格。
        enforcement: { kind: review }

      - id: LIST.QUERY
        title_zh: 查询方式
        statement_zh: 多个条件组合后一起提交用查询表单；改条件立刻刷新结果用筛选；一个关键词跨多个字段找用搜索框。常用的查询放在列表工具栏里，复杂查询单独放一个区域。
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 工具栏里的搜索与筛选
            template: |-
              <div :style="{ display: 'flex', gap: t['spacing.sm'] + 'px', maxWidth: '620px' }">
                <a-input-search placeholder="搜索车型编码或名称" :style="{ width: '260px' }" />
                <a-select value="all" :style="{ width: '140px' }" :options="[{ label: '全部状态', value: 'all' }, { label: '启用', value: 'enabled' }, { label: '停用', value: 'disabled' }]" />
              </div>

      - id: LIST.PAGING
        title_zh: 分页与位置
        statement_zh: 列表默认分页加载，只有一页时隐藏分页；从详情返回列表时恢复原来的页码、筛选和滚动位置，并标记看过的条目；信息流、消息类列表用同页加载更多。
        anchors:
          - { spec: ui, quote: 大数据使用服务端分页/筛选/排序及虚拟化。 }
        enforcement: { kind: review }

      - id: LIST.DETAIL_ENTRY
        title_zh: 详情入口
        statement_zh: 点标题进入详情。内容一屏放得下就在行内展开；信息较多用抽屉；需要分享链接或沉浸处理用独立页面；需要在多条之间快速切换用左右两栏。
        anchors:
          - { spec: page, quote: 抽屉、弹窗和路由跳转有选择规则。 }
        enforcement: { kind: review }

      - id: LIST.BATCH
        title_zh: 批量操作
        statement_zh: 勾选行之后，工具栏位置出现批量操作栏，写明已选几项，并提供批量操作和取消选择；批量操作的位置全系统一致。
        anchors:
          - { spec: page, quote: 主次操作、批量操作和状态信息位置一致。 }
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 已选数量 + 批量操作
            template: |-
              <div :style="{ display: 'flex', alignItems: 'center', gap: t['spacing.md'] + 'px', padding: t['spacing.sm'] + 'px ' + t['spacing.lg'] + 'px', background: t['color.surface.container'], border: '1px solid ' + t['color.border.subtle'], borderRadius: t['radius.md'] + 'px', maxWidth: '620px' }">
                <span>已选 3 项</span>
                <a-button size="small">批量停用</a-button>
                <a-button size="small" danger>批量删除</a-button>
                <a-button size="small" type="link">取消选择</a-button>
              </div>

      - id: LIST.CREATE
        title_zh: 新建入口
        statement_zh: 右上角「新建」按钮打开弹窗、抽屉或新页面，新建成功后新条目排在列表第一并短暂高亮；在列表里就地添加时，用虚线「添加」按钮放在列表首或尾，新条目出现在按钮的位置。
        enforcement: { kind: review }

      - id: LIST.DELETE
        title_zh: 删除
        statement_zh: 能撤销的删除直接执行，并在约 1 分钟内提供撤销；不能撤销的删除用贴着按钮的气泡确认框确认，不弹模态框；破坏性很大的操作（批量删除、清空）要再做一次验证，如输入名称确认。
        params:
          undo_window: { value: 60000, unit: ms, source: SRC.ANTD.SPEC.STAY, label_zh: 撤销保留时长 }
        anchors:
          - { spec: ui, quote: 高风险操作必须提供确认、复核、撤销或等效防错机制 }
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 气泡确认框贴着按钮
            template: |-
              <a-popconfirm title="删除车型 VM-001？删除后不能恢复" ok-text="删除" cancel-text="取消">
                <a-button danger>删除</a-button>
              </a-popconfirm>

  # ─────────────────────────── 设计模式 · 原则 ───────────────────────────
  - key: proximity
    title_zh: 亲密性
    group: patterns.principles
    prefix: PROXIMITY
    summary_zh: 有关系的靠近，没关系的拉开；用间距的远近表达结构与层级。
    rules:
      - id: PROXIMITY.GROUPING
        title_zh: 分组
        statement_zh: 关系紧密的元素靠在一起，读作一个整体；没关系的拉开距离。纵向间距按 8 的倍数取（8 + 8n），常用小 8、中 16、大 24 三档（见「间距」领域 SPACING.TIERS）；需要再拉开层次时加减一个基础单位，或加分割线。
        params:
          formula: { value: 8 + 8n（n ≥ 0）, source: SRC.ANTD.SPEC.PROXIMITY, label_zh: 纵向间距公式 }
          small: { token: spacing.sm, unit: px, label_zh: 小 }
          middle: { token: spacing.lg, unit: px, label_zh: 中 }
          large: { token: spacing.xl, unit: px, label_zh: 大 }
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 标签和值靠近，组与组拉开
            template: |-
              <div :style="{ display: 'flex', flexDirection: 'column', gap: p.large + 'px', color: t['color.text.primary'] }">
                <div :style="{ display: 'flex', flexDirection: 'column', gap: p.small + 'px' }"><span :style="{ color: t['color.text.secondary'] }">车型编码</span><span>VM-001</span></div>
                <div :style="{ display: 'flex', flexDirection: 'column', gap: p.small + 'px' }"><span :style="{ color: t['color.text.secondary'] }">载重</span><span>1.5 吨</span></div>
              </div>

  - key: alignment
    title_zh: 对齐
    group: patterns.principles
    prefix: ALIGN
    summary_zh: 文字左对齐共用起始边；横排表单标签右对齐带冒号；数字右对齐、小数位一致。
    rules:
      - id: ALIGN.TEXT
        title_zh: 文字对齐
        statement_zh: 标题和正文左对齐，共用同一条起始边；短段落、行距较松的内容尤其要对齐起点。只有在刻意强调标题与正文的区别时才打破这条线。
        enforcement: { kind: review }

      - id: ALIGN.FORM_LABEL
        title_zh: 表单标签对齐
        statement_zh: 标签在输入左侧的表单，标签右对齐并带冒号，冒号连成一条竖线，引导视线从上到下填写。
        surfaces: [admin]
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 冒号连成一条线
            template: |-
              <a-form layout="horizontal" :label-col="{ span: 6 }" :wrapper-col="{ span: 14 }" :style="{ maxWidth: '520px' }">
                <a-form-item label="车型编码"><a-input /></a-form-item>
                <a-form-item label="车厢长度（米）"><a-input /></a-form-item>
              </a-form>

      - id: ALIGN.NUMBERS
        title_zh: 数字对齐
        statement_zh: 同一列的数字右对齐，小数位保持一致，方便上下比较（配合 TYPE.TABULAR_NUMS 的等宽数字）。
        enforcement: { kind: review }

  - key: contrast
    title_zh: 对比
    group: patterns.principles
    prefix: CONTRAST
    summary_zh: 主次分明；需要慎重的选择保持中立；状态靠颜色加形状或文字区分；对比要足够强。
    rules:
      - id: CONTRAST.PRIMARY_ACTION
        title_zh: 主次对比
        statement_zh: 更重要、更常用的操作要突出，也可以靠弱化其他操作来突出它。需要用户慎重判断的选择（同意或拒绝一份申请）两个按钮用同样的样式，不引导用户选某一个。
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 审批时两个选择同等对待
            template: |-
              <div :style="{ display: 'flex', gap: t['spacing.sm'] + 'px' }"><a-button>通过</a-button><a-button>驳回</a-button></div>
          - kind: dont
            title_zh: 把「通过」做成主按钮，暗示用户选它
            template: |-
              <div :style="{ display: 'flex', gap: t['spacing.sm'] + 'px' }"><a-button type="primary">通过</a-button><a-button>驳回</a-button></div>

      - id: CONTRAST.STATUS
        title_zh: 状态区分
        statement_zh: 不同状态用不同颜色，同时配图标或文字，不能只靠颜色区分；交互状态（悬停、选中）的变化要明显。整页的标题与正文用字号、字重拉开层级，对比要足够强。
        anchors:
          - { spec: ui, quote: 颜色不得作为唯一信息来源 }
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 颜色 + 文字
            template: |-
              <div :style="{ display: 'flex', gap: t['spacing.sm'] + 'px' }"><a-tag color="success">启用</a-tag><a-tag color="default">停用</a-tag><a-tag color="warning">待审核</a-tag></div>

  - key: repetition
    title_zh: 重复
    group: patterns.principles
    prefix: REPEAT
    summary_zh: 同类东西全系统长得一样、放在一样的位置，降低学习成本。
    rules:
      - id: REPEAT.CONSISTENCY
        title_zh: 一致性
        statement_zh: 同一类元素（分割线、颜色、形状、信息格式、间距）在全系统用同一种做法；同类页面用同样的结构，共性问题在共享结构里改，不在单个页面里改。
        anchors:
          - { spec: page, quote: 同类页面共性问题在共享结构层修复。 }
        enforcement: { kind: review }

  - key: direct
    title_zh: 直截了当
    group: patterns.principles
    prefix: DIRECT
    summary_zh: 在哪里看到就在哪里改；拖拽只沿一个方向，并提供不用拖拽的替代方式。
    rules:
      - id: DIRECT.INLINE_EDIT
        title_zh: 就地编辑
        statement_zh: 能就地编辑的不跳到另一页。偶尔改、以阅读为主的单个字段用点击编辑（悬停高亮，点开带确认和取消）；经常要改的用旁边的编辑图标或链接；多个字段一起改时进入行内编辑，切换前后表格列宽不跳动。
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 单字段点击编辑
            template: |-
              <a-typography-paragraph editable :style="{ maxWidth: '360px', margin: 0 }" content="轻型厢式货车" />

      - id: DIRECT.DRAG
        title_zh: 拖拽
        statement_zh: 可拖拽的条目悬停时出现拖拽手柄、指针变成手形，可放置的位置有明显外框；只沿一个方向拖（纵向或横向）；同时提供不用拖拽的替代方式（上移、下移按钮或序号输入）。
        anchors:
          - { spec: ui, quote: 依赖拖拽的操作必须提供无需拖拽的等价路径 }
        enforcement: { kind: review }

  - key: stay
    title_zh: 足不出户
    group: patterns.principles
    prefix: STAY
    summary_zh: 能在当前页完成的不跳页：确认用气泡确认框或撤销，补充信息用浮层或抽屉，流程尽量在一页内展开。
    rules:
      - id: STAY.ON_PAGE
        title_zh: 不跳页
        statement_zh: 能撤销的操作直接做并提供撤销，不能撤销的用贴着按钮的气泡确认框；补充信息用浮层或抽屉，悬停触发的浮层约 0.5 秒后出现、移开立即关闭；小的文字修改用就地浮层，点击外部即保存并关闭；多步任务尽量在一页内逐步展开，只有步骤必须依次完成时才用分步弹窗，不把每一步拆成独立页面。
        params:
          hover_delay: { value: 500, unit: ms, source: SRC.ANTD.SPEC.STAY, label_zh: 悬停浮层出现延迟 }
          undo_window: { value: 60000, unit: ms, source: SRC.ANTD.SPEC.STAY, label_zh: 撤销保留时长 }
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 悬停看详情，不跳页
            template: |-
              <a-popover title="VM-001 轻型厢式货车" :mouse-enter-delay="p.hover_delay / 1000" content="载重 1.5 吨，车厢长度 4.2 米">
                <a-button type="link">VM-001</a-button>
              </a-popover>

  - key: lightweight
    title_zh: 简化交互
    group: patterns.principles
    prefix: LIGHT
    summary_zh: 关键操作常驻可见；上下文操作悬停出现；非主流程工具进入编辑模式才出现；可点区域做大，工具靠近内容。
    rules:
      - id: LIGHT.TOOLS
        title_zh: 工具常驻
        statement_zh: 关键操作始终可见，有清晰的可点区域和悬停、点击状态；只和某一行或某个对象相关的操作，悬停时才出现；不属于主流程的工具，进入编辑模式后才出现。关键操作不能藏在悬停或模式切换后面。
        enforcement: { kind: review }

      - id: LIGHT.HOTSPOT
        title_zh: 可点区域
        statement_zh: 优先放大可点区域，而不是放大按钮本身（比如整个单元格都能点）；工具放在它作用的内容旁边。触控目标至少 24×24 CSS px。
        params:
          min_target: { value: 24, unit: px, source: SRC.POMASTER.UI_SPEC, label_zh: 最小触控目标边长 }
        anchors:
          - { spec: ui, quote: 触控目标尺寸至少 24×24 CSS px }
        enforcement: { kind: review }

  - key: invitation
    title_zh: 提供邀请
    group: patterns.principles
    prefix: INVITE
    summary_zh: 拖拽、就地编辑这类不容易发现的交互，要主动给出提示。
    rules:
      - id: INVITE.DISCOVERABILITY
        title_zh: 交互邀请
        statement_zh: 拖拽、就地编辑、上下文工具这类不容易发现的交互要给出提示：空状态引导第一步、悬停时提示可点或可编辑、未完成的任务提示继续。新功能引导只放几步，可跳过、可重看；不能拿引导来弥补交互本身的问题。
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 未完成任务提示继续
            template: |-
              <a-alert type="info" show-icon message="车型资料还差 2 项未填（车厢尺寸、排放标准）" :style="{ maxWidth: '520px' }">
                <template #action><a-button size="small" type="link">继续填写</a-button></template>
              </a-alert>

  - key: transition
    title_zh: 巧用过渡
    group: patterns.principles
    prefix: TRANSITION
    summary_zh: 用过渡说明刚刚发生了什么；新增、修改、删除各有提示；不动没变化的东西；尊重减少动效设置。
    rules:
      - id: TRANSITION.EXPLAIN
        title_zh: 用过渡说明变化
        statement_zh: 切换视图时用滑动、展开等过渡保留上下文；新增的条目短暂高亮，修改过的单元格短暂着色后恢复，删除的元素平滑移除，高亮在几秒内淡出；不给没变化的元素加动画；用户系统开启「减少动效」时关闭或降级过渡。时长取动效 token。
        params:
          fast: { token: motion.fast, label_zh: 短 }
          normal: { token: motion.normal, label_zh: 中 }
          slow: { token: motion.slow, label_zh: 长 }
        anchors:
          - { spec: ui, quote: 尊重 prefers-reduced-motion：动画、滚动、过渡在减少动效模式下关闭或降级 }
        enforcement: { kind: review }

  - key: reaction
    title_zh: 即时反应
    group: patterns.principles
    prefix: REACT
    summary_zh: 输入时即时给出联想、校验与结果；加载样式随操作的频率与重要程度选；新内容到达时提示或短暂高亮。
    rules:
      - id: REACT.IMMEDIATE
        title_zh: 即时反应
        statement_zh: 输入时给出联想、实时校验（如密码强度）、实时搜索结果，并做防抖、取消旧请求、丢弃过期响应；加载样式按操作的频率和重要程度选（按钮、表格、整页），不要所有操作都用同一种；有新内容时提示刷新，或在几秒内高亮新到的条目；提示逐步给，不要一次全摆出来。
        anchors:
          - { spec: perf, quote: 搜索防抖、旧请求取消、过期响应丢弃。 }
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 输入联想
            template: |-
              <a-auto-complete :style="{ width: '260px' }" value="VM-00" :options="[{ value: 'VM-001 轻型厢式货车' }, { value: 'VM-002 平板运输车' }]" placeholder="输入车型编码" />

  # ─────────────────────────── 设计模式 · 模板文档 ───────────────────────────
  - key: visualization_page
    title_zh: 数据可视化页
    group: patterns.templates
    prefix: VIZ
    summary_zh: 概览、分析、明细三类；最重要的指标放左上；一屏 5 到 9 个模块；高度概括的数据用指标卡；一张卡片一个主题。
    rules:
      - id: VIZ.TYPES
        title_zh: 页面类型
        statement_zh: 数据可视化页分三类：概览（指标大盘、监控）、分析（多维分析）、明细（数据明细）。先定类型，再选模块。
        enforcement: { kind: review }

      - id: VIZ.LAYOUT
        title_zh: 版面布局
        statement_zh: 最重要的指标和视图放在页面顶部或左上；一屏控制在 5 到 9 个模块；高度概括的数据优先用指标卡（数值），而不是图表；一张卡片一个主题，相关度高的数据合并到一张卡片，用通栏分割线分开。
        params:
          modules: { value: [5, 9], unit: count, source: SRC.ANTD.SPEC.VISUALIZATION, label_zh: 一屏模块数 }
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 顶部一排指标卡
            template: |-
              <a-row :gutter="16" :style="{ maxWidth: '760px' }">
                <a-col :span="6"><a-card size="small"><a-statistic title="在途运单" :value="1280" /></a-card></a-col>
                <a-col :span="6"><a-card size="small"><a-statistic title="准时率" :value="96.4" suffix="%" /></a-card></a-col>
                <a-col :span="6"><a-card size="small"><a-statistic title="异常运单" :value="12" /></a-card></a-col>
                <a-col :span="6"><a-card size="small"><a-statistic title="可用车辆" :value="342" /></a-card></a-col>
              </a-row>

      - id: VIZ.CHART
        title_zh: 图表与口径
        statement_zh: 按要表达的关系选图表类型（趋势用折线，构成用堆叠，比较用柱状），必要时说明指标口径；用筛选让用户既能看全局，也能下钻到细节；页面之间用交互串联。
        enforcement: { kind: review }

  - key: detail_page
    title_zh: 详情页
    group: patterns.templates
    prefix: DETAIL
    summary_zh: 按信息复杂度选布局；信息平铺直给；用分割线、卡片、标签页分出层级；单据类流程操作放页脚。
    rules:
      - id: DETAIL.LAYOUT
        title_zh: 布局
        statement_zh: 内容简单时放在一张卡片里，用非通栏分割线分组；有多个复杂模块时每个模块一张卡片（审批单据类）；内容多到一页放不下时用标签页做导航；按阶段推进的内容用步骤组织。默认用最简单的那种。
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 一张卡片，非通栏分割线分组
            template: |-
              <a-card title="车型详情" :style="{ maxWidth: '620px' }">
                <a-descriptions :column="2" size="small" title="识别信息">
                  <a-descriptions-item label="车型编码">VM-001</a-descriptions-item>
                  <a-descriptions-item label="车型名称">轻型厢式货车</a-descriptions-item>
                </a-descriptions>
                <a-divider dashed />
                <a-descriptions :column="2" size="small" title="规格参数">
                  <a-descriptions-item label="载重">1.5 吨</a-descriptions-item>
                  <a-descriptions-item label="车厢长度">4.2 米</a-descriptions-item>
                </a-descriptions>
              </a-card>

      - id: DETAIL.FLAT
        title_zh: 信息平铺
        statement_zh: 信息平铺直给，没有必要不折叠、不隐藏；强相关的内容靠近，弱相关的拉开；同类详情页用同样的结构和模块。
        enforcement: { kind: review }

      - id: DETAIL.SEPARATORS
        title_zh: 分隔方式
        statement_zh: 组内用非通栏分割线，大段之间用通栏分割线，一个主题一张卡片，最高一级用标签页（按版本、意图或阶段）。
        enforcement: { kind: review }

      - id: DETAIL.ACTIONS
        title_zh: 流程操作
        statement_zh: 审批单据类详情页的流程操作（通过、驳回、转交、加签、挂起、撤回）放在页面底部按钮区；通过与驳回同等样式（见 CONTRAST.PRIMARY_ACTION）。
        enforcement: { kind: review }

  # ───────────────────────────── 体验管理 · 界面静帧 ─────────────────────────────
  - key: ui_stills
    title_zh: 界面静帧
    group: patterns.experience
    prefix: STILL
    summary_zh: 文档、功能卡片、空状态与引导里的产品静帧：像真产品、只给故事主角真实文字、裁切有意图、一个焦点、按展示尺寸设计、动画先定封面帧、用规范组件与图标。
    rules:
      - id: STILL.WHEN
        title_zh: 什么时候用静帧
        statement_zh: 要在文档配图、功能介绍卡片、空状态或新手引导里说明「产品长什么样、这里会发生什么」时，用规范组件搭一张产品静帧，不贴真实截图：截图很快过期、带着真实数据、换主题就不对。一张静帧只讲一件事。
        rationale_zh: 静帧和产品同源（同一套组件与 token），改版时跟着变；截图是一次性的。
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 组件搭出来的功能卡片
            template: |-
              <div :style="{ position: 'relative', width: '360px', height: '210px', overflow: 'hidden', borderRadius: t['radius.lg'] + 'px', background: t['color.surface.page'] }">
                <div :style="{ position: 'absolute', left: '24px', top: '24px', width: '420px', background: t['color.surface.container'], border: '1px solid ' + t['color.border.default'], borderRadius: t['radius.lg'] + 'px', boxShadow: t['elevation.card'] }">
                  <div :style="{ display: 'flex', alignItems: 'center', gap: t['spacing.sm'] + 'px', padding: t['spacing.md'] + 'px ' + t['spacing.lg'] + 'px', borderBottom: '1px solid ' + t['color.border.subtle'] }">
                    <span :style="{ fontWeight: 600, color: t['color.text.primary'] }">回款明细</span>
                    <span :style="{ width: '64px', height: '8px', borderRadius: '4px', background: t['color.border.subtle'] }"></span>
                  </div>
                  <div :style="{ padding: t['spacing.md'] + 'px ' + t['spacing.lg'] + 'px', borderBottom: '1px solid ' + t['color.border.subtle'] }">
                    <span :style="{ display: 'block', width: '60%', height: '8px', borderRadius: '4px', background: t['color.border.subtle'] }"></span>
                  </div>
                  <div :style="{ display: 'flex', alignItems: 'center', gap: t['spacing.md'] + 'px', padding: t['spacing.md'] + 'px ' + t['spacing.lg'] + 'px', borderBottom: '1px solid ' + t['color.border.subtle'], background: t['color.surface.page'] }">
                    <span :style="{ color: t['color.text.primary'] }">华东区</span>
                    <span :style="{ fontVariantNumeric: 'tabular-nums', color: t['color.text.primary'], fontWeight: 600 }">¥1,284,000</span>
                    <a-tag color="success">已回款</a-tag>
                  </div>
                  <div :style="{ padding: t['spacing.md'] + 'px ' + t['spacing.lg'] + 'px' }">
                    <span :style="{ display: 'block', width: '45%', height: '8px', borderRadius: '4px', background: t['color.border.subtle'] }"></span>
                  </div>
                </div>
              </div>
          - kind: dont
            title_zh: 贴一张产品截图
            code: |-
              <img src="/screenshots/dashboard-2026-05.png" alt="仪表盘">
            lang: html

      - id: STILL.RESTRAINT
        title_zh: 只给故事主角真实文字
        statement_zh: 一张静帧里真实的字通常只有 3 到 7 处：标题、被操作的对象、输入的内容和结果；其余位置用占位条，占位条的宽度逐行变化。不要每行都塞真实文本和数字——细节越多越像拼凑的假图；视线落点上不放占位条。
        params:
          real_strings: { value: 3–7, source: SRC.STAGESHOW, label_zh: 真实文字处数 }
        enforcement: { kind: review }

      - id: STILL.FRAMING
        title_zh: 裁切与出血
        statement_zh: 裁到故事发生的那块区域，窗口从画面的一边或两边出血；窗口保持原本的比例，不压扁、不整体缩小塞进卡片再四周留等宽空白；页面本身已有底色时不再垫一块底板；画面里不留空着的角落。
        enforcement: { kind: review }

      - id: STILL.FOCAL
        title_zh: 一个焦点
        statement_zh: 每张静帧只有一个主角，最重的视觉（实色、字重、阴影）落在它身上；辅助对象（一张回执、一个小卡片）至多一个，压在主体边缘；不用描边光晕去「指」主角，用产品自己的选中态。
        enforcement: { kind: review }

      - id: STILL.SCALE
        title_zh: 按展示尺寸设计
        statement_zh: 按最终显示尺寸 1:1 设计：功能卡片约 400×300，侧栏插图更小；手机宽度的版本重新排布，只留动作和可读的字，不是整体缩小——缩小后的小字没人看得清。
        params:
          card: { value: 400×300, source: SRC.STAGESHOW, label_zh: 功能卡片尺寸 }
        enforcement: { kind: review }

      - id: STILL.POSTER
        title_zh: 动画先定封面帧
        statement_zh: 静帧做成小动画时，先定封面帧：缩略图、截图和减少动效模式都只看到这一帧，它要能单独讲完故事——结果留在画面上，不是变化途中的一帧；动画只演一件事，回到开头时要有看得见的原因（撤销、关闭）或在被遮住时复位。
        enforcement: { kind: review }

      - id: STILL.REAL_PARTS
        title_zh: 用规范组件与图标
        statement_zh: 静帧里的按钮、标签、头像、输入框都用 ant-design-vue 组件，不手画；图标只用 @ant-design/icons-vue，同一尺寸；不发明 logo（色块里放一个字母不是 logo）；AI 功能不用闪光、魔杖和紫色当装饰，直接展示它做了什么。
        enforcement: { kind: review }

  # ───────────────────────────── 体验管理 · 组件动效 ─────────────────────────────
  - key: component_motion
    title_zh: 组件动效
    group: patterns.experience
    prefix: CMOTION
    summary_zh: 动效只说明变化：每个动作有原因；出现和离开都有过渡；动关系而不只动对象；数字与文字就地变化；成组只在首次出现时错峰；可以打断；只动 transform 与透明度；减少动效时状态变化仍看得见。
    rules:
      - id: CMOTION.CAUSE
        title_zh: 每个动作有原因
        statement_zh: 动效由用户操作或数据变化触发，用来说明「刚才发生了什么」；不做自动循环的吸睛动画（呼吸灯、无限脉冲）；同一屏同一时刻只有一处在动。界面反馈和真实产品一样快，只有讲故事的演示动画才放慢。
        enforcement: { kind: review }
        examples:
          - kind: dont
            title_zh: 无限脉冲吸引注意
            code: |-
              .badge-new { animation: pulse 1.2s infinite; }
            lang: css

      - id: CMOTION.ENTER_EXIT
        title_zh: 出现与离开
        statement_zh: 会出现又消失的元素保持挂载，用状态切换显隐，让离开也有过渡；离开比出现快；面板打开时带着内容一起出现，不先出一块空白再填内容；不要「啪」地插入或消失。
        params:
          enter: { token: motion.normal, label_zh: 出现 }
          exit: { token: motion.fast, label_zh: 离开 }
          ease: { value: "cubic-bezier(0.215, 0.61, 0.355, 1)", source: SRC.ANTDV.THEME_SEED, label_zh: 缓动 }
        enforcement: { kind: review }
        showcase:
          - kind: demo
            title_zh: 展开与收起：同一个按钮、内容一起出现
            description_zh: 点按钮：面板高度与透明度一起过渡，收起比展开快；按钮文字在同一个按钮上变化。
            template: |-
              <div :style="{ width: '340px' }">
                <a-button size="small" @click="s.open = !s.open">{{ s.open ? '收起筛选' : '展开筛选' }}</a-button>
                <div :style="{ display: 'grid', gridTemplateRows: s.open ? '1fr' : '0fr', opacity: s.open ? 1 : 0, transitionProperty: 'grid-template-rows, opacity', transitionDuration: s.open ? p.enter : p.exit, transitionTimingFunction: p.ease }">
                  <div :style="{ overflow: 'hidden' }">
                    <div :style="{ display: 'flex', gap: t['spacing.sm'] + 'px', paddingTop: t['spacing.md'] + 'px' }">
                      <a-select placeholder="回款状态" :style="{ width: '120px' }" :options="[{ value: 'paid', label: '已回款' }, { value: 'due', label: '待回款' }]" />
                      <a-input placeholder="客户名称" />
                    </div>
                  </div>
                </div>
              </div>

      - id: CMOTION.RELATIONSHIP
        title_zh: 动关系而不只动对象
        statement_zh: 新增一行时，下面的行一起让位（新行的高度从 0 展开），不是新行凭空出现、其余行跳位；删除时先收起占位再移除；尺寸变化的容器不拉伸里面的文字（用网格行或高度过渡，不用 scale）；列表重排用位置过渡。
        params:
          duration: { token: motion.normal, label_zh: 让位时长 }
          ease: { value: "cubic-bezier(0.645, 0.045, 0.355, 1)", source: SRC.ANTDV.THEME_SEED, label_zh: 缓动 }
        enforcement: { kind: review }
        showcase:
          - kind: demo
            title_zh: 新增一行：其余行一起让位
            template: |-
              <div :style="{ width: '320px' }">
                <a-button size="small" type="primary" @click="s.added = !s.added">{{ s.added ? '撤销新增' : '新增客户' }}</a-button>
                <div :style="{ marginTop: t['spacing.md'] + 'px', border: '1px solid ' + t['color.border.subtle'], borderRadius: t['radius.lg'] + 'px', overflow: 'hidden' }">
                  <div :style="{ display: 'grid', gridTemplateRows: s.added ? '1fr' : '0fr', transitionProperty: 'grid-template-rows', transitionDuration: p.duration, transitionTimingFunction: p.ease }">
                    <div :style="{ overflow: 'hidden' }">
                      <div :style="{ padding: t['spacing.md'] + 'px ' + t['spacing.lg'] + 'px', borderBottom: '1px solid ' + t['color.border.subtle'], background: t['color.surface.page'], color: t['color.text.primary'] }">杭州云帆（新）</div>
                    </div>
                  </div>
                  <div v-for="name in ['上海星河', '苏州远景', '南京长风']" :key="name" :style="{ padding: t['spacing.md'] + 'px ' + t['spacing.lg'] + 'px', borderBottom: '1px solid ' + t['color.border.subtle'], color: t['color.text.primary'] }">{{ name }}</div>
                </div>
              </div>

      - id: CMOTION.VALUE_CHANGE
        title_zh: 数字与文字就地变化
        statement_zh: 数值变化用数字滚动：只滚变化的位，货币符号与千分位不动，用等宽数字，最终值停住；状态词变化（排队中→运行中→已通过）在同一位置滚动或淡入淡出，并按最长的词预留宽度，邻居不跳；按钮文字变化发生在同一个按钮上，不换成另一个按钮。
        enforcement: { kind: review }
        showcase:
          - kind: demo
            title_zh: 数字滚动
            description_zh: 点按钮：金额只滚动变化的数位（StdNumberRoll，按 affectUI Number Ticker 的做法实现）。
            template: |-
              <div :style="{ display: 'flex', alignItems: 'center', gap: t['spacing.lg'] + 'px' }">
                <std-number-roll :value="s.total || 48240" :format="{ style: 'currency', currency: 'CNY', maximumFractionDigits: 0 }" locale="zh-CN" :style="{ fontSize: t['typography.size.title_large'] + 'px', fontWeight: 600, color: t['color.text.primary'] }" />
                <a-button size="small" @click="s.total = (s.total || 48240) + 1280">登记回款 ¥1,280</a-button>
              </div>

      - id: CMOTION.STAGGER
        title_zh: 成组错峰只在首次出现
        statement_zh: 只有一组元素首次一起出现时才错峰：按阅读顺序、间隔小、总时长有上限；刷新数据、翻页、筛选时整组一次出现，不逐行飞入；栅格卡片首次进入视口时可以错峰一次。
        params:
          interval: { value: 60, unit: ms, source: SRC.STAGESHOW, label_zh: 错峰间隔, note_zh: 同一组 40–80ms 取中；栅格的格与格之间可放宽到 80–120ms }
          total: { value: 400, unit: ms, source: SRC.POMASTER.DEFAULTS, label_zh: 总时长上限, note_zh: 一组错峰总长不超过 400ms，再长就像在等动画 }
        enforcement: { kind: review }
        examples:
          - kind: dont
            title_zh: 每次刷新逐行飞入
            code: |-
              .row { animation: fly-in .4s both; animation-delay: calc(var(--i) * 80ms); }
            lang: css

      - id: CMOTION.INTERRUPT
        title_zh: 可以打断
        statement_zh: 动画进行中用户再次操作，从当前状态反向或继续，不排队等上一段放完；动画期间控件保持可用；状态切换用 CSS transition（天然可打断），不用固定时长的关键帧动画表达状态。
        enforcement: { kind: review }

      - id: CMOTION.PERF
        title_zh: 只动 transform 与透明度
        statement_zh: 过渡只作用于 transform 和 opacity，高度展开用 grid-template-rows 过渡；不过渡 width、height、top、left、margin 这类触发重排的属性；will-change 只在动画期间加在动的那个元素上，不全局铺。
        enforcement: { kind: gate, check: motion.transform-only }
        examples:
          - kind: do
            title_zh: 位移与透明度
            code: |-
              .panel { transition: transform .2s, opacity .2s; }
            lang: css
          - kind: dont
            title_zh: 过渡布局属性
            code: |-
              .panel { transition: height .3s, top .3s; }
            lang: css

      - id: CMOTION.REDUCED
        title_zh: 减少动效时保留状态变化
        statement_zh: 减少动效模式下状态变化仍要看得见：淡入淡出或直接切换，去掉位移、缩放、视差和自动播放；数字滚动直接显示最终值；每段关键帧动画都写 prefers-reduced-motion 分支（全局降级见 MOTION.REDUCED）。
        anchors:
          - { spec: ui, quote: 尊重 prefers-reduced-motion：动画、滚动、过渡在减少动效模式下关闭或降级 }
        enforcement: { kind: gate, check: motion.reduced-motion }
        examples:
          - kind: do
            title_zh: 关键帧动画的降级分支
            code: |-
              @media (prefers-reduced-motion: reduce) {
                .ticker-col { animation: none; }
                .ticker-stack { transition: none; }
              }
            lang: css

  # ───────────────────────────── 体验管理 · Bento 栅格 ─────────────────────────────
  - key: bento_grid
    title_zh: Bento 栅格
    group: patterns.experience
    prefix: BENTO
    summary_zh: 一组格子拼成一张图：一个主角格；格子不全是界面截图，邻格类型交替；同一套外框；跨度取栅格整数；数字格一行写完；窄屏重新排；可点的格整格可点。
    rules:
      - id: BENTO.WHEN
        title_zh: 什么时候用
        statement_zh: 功能概览、首页看板入口、发布说明和特性墙用 Bento；表单、明细列表、需要逐项对比的数据不用 Bento，用表格、描述列表或卡片列表。
        enforcement: { kind: review }

      - id: BENTO.HERO
        title_zh: 一个主角格
        statement_zh: 一格最大（跨两列或两行），放最主要的信息或画面，其余格支撑它；格子大小相同时，内容和分量要有明显差别，不排成五块一样重的卡片。
        enforcement: { kind: review }
        showcase:
          - kind: demo
            title_zh: 主角格 + 数字格 + 组件格 + 一句话
            description_zh: 主角格跨两列并整格可点；数字格一行写完；组件格只截一个控件；一句话格用正文大字。
            template: |-
              <div :style="{ display: 'grid', gridTemplateColumns: 'repeat(3, 1fr)', gap: t['spacing.lg'] + 'px', width: '600px' }">
                <a href="#" :style="{ gridColumn: 'span 2', display: 'flex', flexDirection: 'column', gap: t['spacing.md'] + 'px', padding: t['spacing.xl'] + 'px', borderRadius: t['radius.lg'] + 'px', border: '1px solid ' + t['color.border.subtle'], background: t['color.surface.container'], color: t['color.text.primary'], textDecoration: 'none' }">
                  <span :style="{ fontSize: t['typography.size.body_large'] + 'px', fontWeight: 600 }">回款总览</span>
                  <div :style="{ display: 'flex', alignItems: 'flex-end', gap: t['spacing.sm'] + 'px', height: '72px' }">
                    <span v-for="h in [32, 48, 40, 64, 56, 72]" :key="h" :style="{ flex: 1, height: h + 'px', borderRadius: t['radius.sm'] + 'px', background: t['color.brand.primary'], opacity: h === 72 ? 1 : 0.35 }"></span>
                  </div>
                </a>
                <div :style="{ display: 'flex', flexDirection: 'column', justifyContent: 'center', gap: t['spacing.xs'] + 'px', padding: t['spacing.xl'] + 'px', borderRadius: t['radius.lg'] + 'px', background: t['color.surface.page'] }">
                  <span :style="{ fontSize: t['typography.size.title_large'] + 'px', fontWeight: 600, fontVariantNumeric: 'tabular-nums', whiteSpace: 'nowrap', color: t['color.text.primary'] }">98.6%</span>
                  <span :style="{ color: t['color.text.secondary'] }">本月准时回款率</span>
                </div>
                <div :style="{ display: 'flex', flexDirection: 'column', gap: t['spacing.md'] + 'px', padding: t['spacing.xl'] + 'px', borderRadius: t['radius.lg'] + 'px', border: '1px solid ' + t['color.border.subtle'], background: t['color.surface.container'] }">
                  <span :style="{ color: t['color.text.primary'], fontWeight: 600 }">到期自动催收</span>
                  <a-switch :checked="true" />
                </div>
                <div :style="{ gridColumn: 'span 2', display: 'flex', alignItems: 'center', padding: t['spacing.xl'] + 'px', borderRadius: t['radius.lg'] + 'px', background: t['color.surface.page'], color: t['color.text.primary'], fontSize: t['typography.size.body_large'] + 'px' }">
                  <span><b>对账不再靠表格。</b><span :style="{ color: t['color.text.secondary'] }">银行流水到账即自动核销。</span></span>
                </div>
              </div>

      - id: BENTO.KINDS
        title_zh: 邻格类型交替
        statement_zh: 界面格（只截一个组件或一小块界面，不放整个窗口）约占三分之一到一半，其余是大数字、一句话、对象、示意图或一组标志；相邻的格类型不同；窗口外框在一组栅格里至多出现一次；同一段真实文字不在两格里重复。
        params:
          ui_share: { value: 1/3–1/2, source: SRC.STAGESHOW, label_zh: 界面格占比 }
        enforcement: { kind: review }

      - id: BENTO.FRAME
        title_zh: 同一套外框
        statement_zh: 所有格的圆角、格间距、内边距、文案位置一致（文案都在上或都在下）；格间距等于格内边距或其整数分之一；一组栅格只选一种家族：带间距的圆角格，或无间距、用细分割线分格。
        params:
          gap: { token: spacing.lg, label_zh: 格间距 }
          radius: { token: radius.lg, label_zh: 格圆角 }
        enforcement: { kind: review }

      - id: BENTO.SPANS
        title_zh: 跨度取栅格整数
        statement_zh: 用 CSS grid 分格，列数取 24 列栅格的约数（常用 3 列，即每格 8/24），格子跨度是整数列；行高用统一基准；不给格子手写像素宽度。
        enforcement: { kind: review }
        examples:
          - kind: dont
            title_zh: 手写像素宽度拼格子
            code: |-
              <div style="width: 412px; float: left">…</div>
            lang: vue

      - id: BENTO.STAT
        title_zh: 数字格一行写完
        statement_zh: "数字格是一个大数字加一句短标签，数字和单位不换行（white-space: nowrap）；用真实数字，不用「10x」「无限」这类填充；数字紧跟标签或撑满格子，不要钉在高格底部、上面留一大片空。"
        enforcement: { kind: review }

      - id: BENTO.RESPONSIVE
        title_zh: 窄屏重新排
        statement_zh: 每格都读得清时才保留两列；手机宽度变单列，主角格在最前；按内容决定断点，不整体等比缩小；窄格里的界面画面重新取景，而不是缩小。
        enforcement: { kind: review }

      - id: BENTO.CLICK
        title_zh: 可点的格整格可点
        statement_zh: 一格对应一个去处时整格就是一个链接（a 或 button 包住整格），焦点环画在格上；格内不再放第二个去同一处的按钮；悬停反馈按卡片悬停的规则。
        enforcement: { kind: review }

  # ───────────────────────────── 体验管理 · 状态反馈 ─────────────────────────────
  - key: state_feedback
    title_zh: 状态反馈
    group: patterns.experience
    prefix: SFB
    summary_zh: 每个数据视图都有完整的状态；反馈出现在动作发生的地方；确认的力度跟操作的分量走；乐观更新只用于可回滚的小操作；能撤销就不弹确认；长操作给进度；读屏能感知状态变化。
    rules:
      - id: SFB.STATES
        title_zh: 每个视图都有完整状态
        statement_zh: 每个数据视图都设计并实现这些状态：加载中、空、出错、部分成功、正常，以及无权限和禁用；每种状态在 Storybook 里都能单独看到。空状态给下一步动作，出错给原因和恢复入口。
        anchors:
          - { spec: page, quote: State Matrix：默认、加载、空、错误、权限、禁用、长文本和小屏等状态。 }
          - { spec: ui, quote: hover、active、focus、disabled、loading、empty、error 状态完整。 }
        enforcement: { kind: review }
        showcase:
          - kind: demo
            title_zh: 同一个视图的五种状态
            description_zh: 切换看每种状态：骨架保持内容的几何；空状态给动作；出错保留筛选并给重试；部分成功说清成功几条、失败的怎么办。
            template: |-
              <div :style="{ width: '440px' }">
                <a-segmented :value="s.view || '加载中'" :options="['加载中', '空', '出错', '部分成功', '正常']" @change="(v) => (s.view = v)" />
                <div :style="{ marginTop: t['spacing.md'] + 'px', minHeight: '200px' }">
                  <a-skeleton v-if="(s.view || '加载中') === '加载中'" active :paragraph="{ rows: 3 }" />
                  <a-empty v-else-if="s.view === '空'" description="还没有回款记录">
                    <a-button type="primary">登记回款</a-button>
                  </a-empty>
                  <a-result v-else-if="s.view === '出错'" status="error" title="回款记录没有加载出来" sub-title="网络中断。筛选条件已保留，可以直接重试。">
                    <template #extra><a-button type="primary">重试</a-button></template>
                  </a-result>
                  <div v-else-if="s.view === '部分成功'" :style="{ display: 'flex', flexDirection: 'column', gap: t['spacing.sm'] + 'px' }">
                    <a-alert type="warning" show-icon message="导入 120 条，成功 117 条，3 条失败" description="失败的行已标出原因，修改后可以只重新导入这 3 条。" />
                    <a-button size="small" :style="{ alignSelf: 'flex-start' }">查看失败的 3 条</a-button>
                  </div>
                  <a-list v-else bordered size="small" :data-source="['华东区 · ¥1,284,000', '华南区 · ¥968,500', '华北区 · ¥742,300']">
                    <template #renderItem="{ item }"><a-list-item>{{ item }}</a-list-item></template>
                  </a-list>
                </div>
              </div>

      - id: SFB.IN_PLACE
        title_zh: 反馈出现在动作发生的地方
        statement_zh: 按钮自己进入加载并在原位给出结果；字段错误挂在字段上；行内操作的结果出现在那一行；不把所有结果都弹到页面顶部，也不用一个轻提示处理所有错误。
        anchors:
          - { spec: api, quote: MUST NOT 用一个 Toast 处理所有错误。 }
        enforcement: { kind: review }

      - id: SFB.WEIGHT
        title_zh: 确认的力度跟操作的分量走
        statement_zh: 轻操作（收藏、切换显示）就地变化，不弹提示；普通保存用 message 轻提示；会影响他人或不可逆的操作用结果页或 notification；失败比成功更显眼，并且停留到用户处理。
        enforcement: { kind: review }

      - id: SFB.OPTIMISTIC
        title_zh: 乐观更新只用于可回滚的小操作
        statement_zh: 点赞、标星、拖动排序这类成功率高、可回滚、影响范围小的操作可以先改界面再发请求，失败时回滚并就地说明；金额、库存、审批、权限这类以服务端结果为准，等返回再更新。
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 先改界面，失败回滚
            code: |-
              const prev = item.starred
              item.starred = !prev
              try { await api.star(item.id, item.starred) } catch (e) { item.starred = prev; message.error('收藏没有成功，已恢复') }
            lang: ts

      - id: SFB.UNDO
        title_zh: 能撤销就不弹确认
        statement_zh: 可以撤销的删除、归档用「已删除 · 撤销」的提示代替二次确认；真正不可逆的操作才要确认，确认框说清后果（删掉什么、影响谁）。
        anchors:
          - { spec: page, quote: 删除、提交、转账等高风险动作必须提供复核、确认、撤销或等效防错 }
        enforcement: { kind: review }

      - id: SFB.PROGRESS
        title_zh: 长操作给进度
        statement_zh: 超过 1 秒的操作给加载反馈；预计超过 10 秒的给确定进度（百分比或步骤）和预计剩余时间，并允许离开当前页面：转为后台任务，完成后通知并能回到结果。
        params:
          busy: { value: 1000, unit: ms, source: SRC.NNG.RESPONSE_TIMES, label_zh: 需要加载反馈 }
          determinate: { value: 10000, unit: ms, source: SRC.NNG.RESPONSE_TIMES, label_zh: 需要确定进度 }
        anchors:
          - { spec: perf, quote: 长任务异步执行并可恢复。 }
        enforcement: { kind: review }

      - id: SFB.LIVE
        title_zh: 读屏能感知状态变化
        statement_zh: 异步结果和进度变化写进 aria-live 区（一般用 polite，阻断性错误用 assertive），不抢焦点；颜色不是唯一的信号，状态都有文字。
        anchors:
          - { spec: ui, quote: 动态状态、异步结果、进度变化必须可在不抢夺焦点的前提下被辅助技术识别 }
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 状态写进 live 区
            code: |-
              <div aria-live="polite" class="sr-only">{{ statusText }}</div>
            lang: vue

  # ───────────────────────────── 体验管理 · 上下文管理 ─────────────────────────────
  - key: context
    title_zh: 上下文管理
    group: patterns.experience
    prefix: CTX
    summary_zh: 保住用户的位置（分页、筛选、滚动、选中）；未保存的内容有去处；就地操作与工具栏一致；当前位置始终可见；切换团队或身份时显式清理；代码里的上下文只放稳定的跨层依赖。
    rules:
      - id: CTX.PRESERVE
        title_zh: 保住用户的位置
        statement_zh: 从列表进详情再返回，恢复原来的页码、筛选、排序、滚动位置和选中行（筛选与页码在 URL 里，滚动位置用 vue-router 的 scrollBehavior 返回 savedPosition）；能在当前页完成的查看用抽屉，不离开列表。
        anchors:
          - { spec: page, quote: 返回恢复分页、筛选、排序和必要视图状态。 }
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 返回时恢复滚动位置
            code: |-
              const router = createRouter({
                history: createWebHistory(),
                routes,
                scrollBehavior: (_to, _from, saved) => saved ?? { top: 0 },
              })
            lang: ts
        showcase:
          - kind: lab
            lab: context.restore
            title_zh: 实验：返回列表时恢复位置
            description_zh: 翻到第 3 页、选中一行、打开详情再返回：正确做法回到原来的页和那一行；错误做法回到第 1 页。

      - id: CTX.DRAFTS
        title_zh: 未保存的内容有去处
        statement_zh: 表单有改动时离开要提示（页内跳转和关闭页签都拦）；长表单自动保存草稿，草稿按用户隔离、带版本与过期时间，提交成功后清掉；失败的提交保留用户的输入。
        anchors:
          - { spec: page, quote: dirty 离开、草稿隔离和版本冲突有策略。 }
          - { spec: page, quote: 提交防重复并保留失败输入。 }
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 离开前拦截
            code: |-
              onBeforeRouteLeave(() => (form.dirty ? window.confirm('有未保存的修改，确定离开吗？') : true))
            lang: ts

      - id: CTX.INLINE_ACTIONS
        title_zh: 就地操作与工具栏一致
        statement_zh: 行上的「更多」菜单、右键菜单里的操作与工具栏、详情页同名同图标；右键菜单只是快捷方式，不是唯一入口；批量操作出现在选中后的批量栏里，并显示选中了几条。
        enforcement: { kind: review }

      - id: CTX.WAYFINDING
        title_zh: 当前位置始终可见
        statement_zh: 页面标题、导航高亮、面包屑三者一致并与路由同源；每个可分享的视图有深链接，打开深链接得到同样的视图（含筛选与标签页）。
        anchors:
          - { spec: page, quote: 每个页面路由有稳定 name、path、page key、title、权限和布局 meta。 }
        enforcement: { kind: review }

      - id: CTX.SCOPE_SWITCH
        title_zh: 切换团队或身份时显式清理
        statement_zh: 团队、租户、环境的切换入口全局可见，当前作用域显示在顶部；切换后清掉旧作用域的查询缓存、草稿和订阅，回到新作用域下安全的页面，不把旧数据带到新作用域。
        anchors:
          - { spec: state, quote: 用户、角色、组织和数据范围切换时清理风险缓存。 }
        enforcement: { kind: review }

      - id: CTX.PROVIDER
        title_zh: 代码里的上下文只放稳定的跨层依赖
        statement_zh: provide / inject 只放跨多层、变化少的依赖（主题、当前团队、权限判断函数）；按关注点拆成多个注入键，不放一个大对象；频繁变化的数据走 Pinia 或查询缓存，不经 provide 往下灌。
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 按关注点拆分注入键
            code: |-
              export const TeamKey: InjectionKey<Ref<Team>> = Symbol('team')
              provide(TeamKey, team)
            lang: ts

  # ───────────────────────────── 体验管理 · 侧边栏管理 ─────────────────────────────
  - key: sidebar
    title_zh: 侧边栏管理
    group: patterns.experience
    prefix: SIDEBAR
    summary_zh: 宽度取规范值；收起后只留图标并有名字；收起状态按用户记住；窄屏变抽屉；当前项与路由同源；最多两级；分组按使用频率；自己滚动、底部固定；键盘可操作。
    rules:
      - id: SIDEBAR.WIDTH
        title_zh: 宽度取规范值
        statement_zh: 侧边栏展开宽度 200px、收起宽度 80px（a-layout-sider 的缺省值），不按页面各自调；内容放不下时调整菜单文字，不加宽侧边栏。
        params:
          width: { value: 200, unit: px, source: SRC.ANTD.COMP.LAYOUT, label_zh: 展开宽度 }
          collapsed_width: { value: 80, unit: px, source: SRC.ANTD.COMP.LAYOUT, label_zh: 收起宽度 }
        enforcement: { kind: review }
        showcase:
          - kind: demo
            title_zh: 收起与展开
            description_zh: 点按钮收起：菜单只留图标，悬停有名字；当前项保持高亮。
            template: |-
              <a-layout :style="{ height: '260px', width: '520px', border: '1px solid ' + t['color.border.subtle'], borderRadius: t['radius.lg'] + 'px', overflow: 'hidden' }">
                <a-layout-sider theme="light" collapsible :collapsed="!!s.collapsed" :width="p.width" :collapsed-width="p.collapsed_width" :trigger="null" :style="{ borderRight: '1px solid ' + t['color.border.subtle'] }">
                  <a-menu mode="inline" :selected-keys="['receipts']" :inline-collapsed="!!s.collapsed">
                    <a-menu-item key="overview"><template #icon><DashboardOutlined /></template>总览</a-menu-item>
                    <a-menu-item key="receipts"><template #icon><AccountBookOutlined /></template>回款</a-menu-item>
                    <a-menu-item key="customers"><template #icon><TeamOutlined /></template>客户</a-menu-item>
                  </a-menu>
                </a-layout-sider>
                <a-layout-content :style="{ padding: t['spacing.lg'] + 'px', background: t['color.surface.container'] }">
                  <a-button size="small" :aria-label="s.collapsed ? '展开侧边栏' : '收起侧边栏'" @click="s.collapsed = !s.collapsed">
                    <template #icon><MenuUnfoldOutlined v-if="s.collapsed" /><MenuFoldOutlined v-else /></template>
                  </a-button>
                </a-layout-content>
              </a-layout>

      - id: SIDEBAR.COLLAPSE
        title_zh: 收起与展开
        statement_zh: 收起后只留图标，每项悬停显示名字（a-menu 收起时自带 tooltip）；收起状态按用户记住（偏好存储，按用户隔离）；屏幕宽度低于断点时自动收起成抽屉，点遮罩关闭。
        enforcement: { kind: review }

      - id: SIDEBAR.ACTIVE
        title_zh: 当前项与路由同源
        statement_zh: 高亮哪一项由当前路由决定，不另存一份「选中项」状态；刷新后保持；子页面高亮它所属的一级项，父级自动展开。
        anchors:
          - { spec: permission, quote: 菜单、路由、按钮、字段和接口使用同一权限语义。 }
        enforcement: { kind: review }

      - id: SIDEBAR.DEPTH
        title_zh: 最多两级
        statement_zh: 侧边栏最多两级；第三级用页内的标签页或二级导航，不在侧边栏里继续嵌套；只有一个子项的分组不展开，直接放这一项。
        enforcement: { kind: review }

      - id: SIDEBAR.GROUPS
        title_zh: 分组按使用频率
        statement_zh: 菜单按任务分组、按使用频率排序，最常用的在上；分组标题不可点、不当链接；无权限的菜单项不显示（不显示禁用的菜单项让人猜）。
        enforcement: { kind: review }

      - id: SIDEBAR.SCROLL
        title_zh: 自己滚动、底部固定
        statement_zh: 侧边栏独立滚动，不跟着内容区滚；账户、设置、帮助固定在底部；当前项在可视区外时自动滚到可见。
        enforcement: { kind: review }

      - id: SIDEBAR.KEYBOARD
        title_zh: 键盘可操作
        statement_zh: 收起/展开有快捷键并在按钮的提示里写出；菜单可以用 Tab 进入、方向键移动；收起展开后焦点留在切换按钮上。
        enforcement: { kind: review }

  # ───────────────────────────── 体验管理 · 卡片悬停 ─────────────────────────────
  - key: card_hover
    title_zh: 卡片悬停
    group: patterns.experience
    prefix: HOVER
    summary_zh: 悬停只表示可点；幅度克制（边框或阴影升一级，不缩放）；不引起布局移动；键盘焦点的反馈不弱于悬停；触屏不依赖悬停；悬停才出现的操作不挤开内容；时长取 token。
    rules:
      - id: HOVER.SIGNAL
        title_zh: 悬停只表示可点
        statement_zh: 只有可点的卡片做悬停效果（a-card 的 hoverable）；不可点的卡片悬停没有任何变化，避免让人以为能点。
        enforcement: { kind: review }
        showcase:
          - kind: demo
            title_zh: 可点与不可点
            description_zh: 把指针移到两张卡片上对比；用 Tab 键聚焦可点的那张。
            template: |-
              <div :style="{ display: 'flex', gap: t['spacing.lg'] + 'px' }">
                <a-card hoverable size="small" :style="{ width: '200px' }" tabindex="0">
                  <div :style="{ fontWeight: 600, color: t['color.text.primary'] }">华东区回款</div>
                  <div :style="{ color: t['color.text.secondary'] }">可点：悬停抬起一级阴影</div>
                </a-card>
                <a-card size="small" :style="{ width: '200px' }">
                  <div :style="{ fontWeight: 600, color: t['color.text.primary'] }">口径说明</div>
                  <div :style="{ color: t['color.text.secondary'] }">不可点：没有悬停效果</div>
                </a-card>
              </div>

      - id: HOVER.SUBTLE
        title_zh: 幅度克制
        statement_zh: 悬停时阴影升一级（hoverable 的缺省效果），边框和背景最多变一档；不缩放卡片、不放大内容、不换颜色主题。
        enforcement: { kind: review }

      - id: HOVER.NO_SHIFT
        title_zh: 不引起布局移动
        statement_zh: 悬停不改卡片尺寸、不改边框宽度、不显示会挤开内容的元素；需要强调时用阴影、outline 或改变边框颜色，宽度不变。
        enforcement: { kind: review }
        examples:
          - kind: dont
            title_zh: 悬停加粗边框，整排卡片抖动
            code: |-
              .card:hover { border-width: 2px; }
            lang: css
          - kind: do
            title_zh: 只换颜色或加阴影
            code: |-
              .card:hover { border-color: var(--border-strong); box-shadow: var(--shadow-1); }
            lang: css

      - id: HOVER.FOCUS_PARITY
        title_zh: 焦点反馈不弱于悬停
        statement_zh: 可点的卡片能用键盘聚焦（链接或按钮包住整卡，或 tabindex=0 并响应 Enter/空格）；:focus-visible 的反馈不弱于悬停，并且不被遮挡。
        anchors:
          - { spec: ui, quote: MUST NOT 移除焦点轮廓而无同等级可见替代。 }
        enforcement: { kind: review }

      - id: HOVER.TOUCH
        title_zh: 触屏不依赖悬停
        statement_zh: "悬停才显示的操作，在不支持悬停的设备上常显或放进「更多」菜单（用 @media (hover: hover) 区分）；关键信息不只放在悬停提示里。"
        anchors:
          - { spec: ui, quote: MUST NOT 仅通过颜色、hover 或 tooltip 传递关键信息。 }
        enforcement: { kind: review }

      - id: HOVER.REVEAL
        title_zh: 悬停出现的操作不挤开内容
        statement_zh: 行或卡片上悬停才出现的操作占位预留（透明度从 0 到 1，不从无到有插入），键盘聚焦到行内时同样出现；离开后收起。
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 行操作的样式
            code: |-
              .std-reveal-actions { opacity: 1; transition: opacity .1s; }
              @media (hover: hover) {
                .std-reveal-row .std-reveal-actions { opacity: 0; }
                .std-reveal-row:hover .std-reveal-actions,
                .std-reveal-row:focus-within .std-reveal-actions { opacity: 1; }
              }
            lang: css
        showcase:
          - kind: demo
            title_zh: 悬停与聚焦都显示行操作
            description_zh: 指针移到行上或用 Tab 聚焦到行内按钮，操作出现；在触屏设备上常显。
            template: |-
              <div :style="{ width: '360px', border: '1px solid ' + t['color.border.subtle'], borderRadius: t['radius.lg'] + 'px' }">
                <div v-for="name in ['上海星河', '苏州远景']" :key="name" class="std-reveal-row" :style="{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', padding: t['spacing.sm'] + 'px ' + t['spacing.lg'] + 'px', borderBottom: '1px solid ' + t['color.border.subtle'] }">
                  <span :style="{ color: t['color.text.primary'] }">{{ name }}</span>
                  <span class="std-reveal-actions" :style="{ display: 'flex', gap: t['spacing.xs'] + 'px' }">
                    <a-button size="small" type="text" aria-label="编辑"><template #icon><EditOutlined /></template></a-button>
                    <a-button size="small" type="text" aria-label="更多"><template #icon><EllipsisOutlined /></template></a-button>
                  </span>
                </div>
              </div>

      - id: HOVER.TIMING
        title_zh: 时长取 token
        statement_zh: 悬停进入用快速档（motionDurationFast），离开可以同档；不额外加延迟（提示类除外）。
        params:
          duration: { token: motion.fast, label_zh: 悬停过渡 }
        enforcement: { kind: review }

  # ───────────────────────────── 体验管理 · 加载条 ─────────────────────────────
  - key: loading_bar
    title_zh: 加载条
    group: patterns.experience
    prefix: LBAR
    summary_zh: 选对加载形态；快的请求不显示加载条，出现后至少停留一会儿；不确定进度时缓慢推进、完成时补满；全局只有一条；有确切进度时显示百分比与剩余并能取消；读屏能感知。
    rules:
      - id: LBAR.KIND
        title_zh: 选对加载形态
        statement_zh: 页面切换用顶部细加载条；区块首次加载用骨架（保持内容的几何）；按钮触发的操作用按钮自己的加载态；有确切进度的（上传、导出、导入）用确定进度条；不用整页转圈遮住已有内容。
        anchors:
          - { spec: page, quote: 首屏骨架保持主要布局尺寸。 }
        enforcement: { kind: review }

      - id: LBAR.DELAY
        title_zh: 快的不显示，出现了停一会儿
        statement_zh: 请求在延迟阈值内完成就不显示加载条，避免一闪；一旦显示，至少停留最短时长再淡出；两个值全局统一，在 HTTP 客户端或路由层实现，页面不各自写。
        params:
          delay: { value: 200, unit: ms, source: SRC.NNG.RESPONSE_TIMES, label_zh: 出现延迟, note_zh: 0.1 秒以内感觉即时；200ms 内返回的请求不出加载条，避免闪一下 }
          min_visible: { value: 400, unit: ms, source: SRC.POMASTER.DEFAULTS, label_zh: 最短停留, note_zh: 出现了就至少停 400ms，避免一闪而过（与加载延迟实验一致） }
        enforcement: { kind: review }
        showcase:
          - kind: lab
            lab: loading.delay
            title_zh: 实验：加载条的延迟出现与最短停留
            description_zh: 分别发一个快请求和一个慢请求：快的不出现加载条；慢的出现后至少停留一会儿再收起。打开「错误做法」看快请求让加载条一闪而过。

      - id: LBAR.TRICKLE
        title_zh: 不确定进度时缓慢推进
        statement_zh: 不知道总量时，加载条先快后慢地推进但停在 100% 之前；完成时补满并淡出；失败时也要收起，并在出错的位置给反馈。
        enforcement: { kind: review }

      - id: LBAR.SINGLE
        title_zh: 全局只有一条
        statement_zh: 页面级加载条全局只有一个，用计数管理：每个请求开始加一、结束减一，归零才收起；并发请求不各自起一条，也不互相提前收起。
        anchors:
          - { spec: api, quote: SHOULD 让 loading 来源唯一，避免重复状态。 }
        enforcement: { kind: review }

      - id: LBAR.DETERMINATE
        title_zh: 确定进度显示百分比与剩余
        statement_zh: 上传、导出、导入这类有确切进度的操作显示百分比和预计剩余时间，可以取消；超过 10 秒的转后台任务并在完成时通知（见 SFB.PROGRESS）。
        enforcement: { kind: review }
        showcase:
          - kind: demo
            title_zh: 确定进度：百分比、剩余时间、可取消
            template: |-
              <div :style="{ width: '360px', display: 'flex', flexDirection: 'column', gap: t['spacing.sm'] + 'px' }">
                <div :style="{ display: 'flex', justifyContent: 'space-between', color: t['color.text.primary'] }"><span>导出回款明细</span><span :style="{ fontVariantNumeric: 'tabular-nums', color: t['color.text.secondary'] }">约 20 秒</span></div>
                <a-progress :percent="64" size="small" />
                <div><a-button size="small">取消导出</a-button></div>
              </div>

      - id: LBAR.A11Y
        title_zh: 读屏能感知
        statement_zh: 进度条带 role=progressbar 与 aria-valuenow（不确定进度时不写 valuenow，所在区域标 aria-busy）；完成和失败写进 aria-live 区。
        enforcement: { kind: review }

  # ───────────────────────────── 数据呈现 · 数据网格 ─────────────────────────────
  - key: data_grid
    title_zh: 数据网格
    group: patterns.data
    prefix: DGRID
    summary_zh: 先分清表格与数据网格；列的对齐、冻结与宽度有规则；排序筛选在服务端并进 URL；跨页选择说清范围；大数据虚拟滚动；行内编辑可撤回；密度三档按用户记住；空与加载保持列结构。
    rules:
      - id: DGRID.WHEN
        title_zh: 表格还是数据网格
        statement_zh: 只读、列不多、一屏看得完的列表用普通表格；需要列配置、冻结列、行内编辑、海量数据滚动、键盘逐格移动的用数据网格；同一个产品里数据网格只用一种实现。
        params:
          grid_library: { decision: 数据网格用哪个实现？, candidates: [ant-design-vue Table + 虚拟滚动, vxe-table, AG Grid], label_zh: 数据网格实现 }
        enforcement: { kind: review }

      - id: DGRID.COLUMNS
        title_zh: 列的对齐、冻结与宽度
        statement_zh: 文本左对齐，数字和金额右对齐并用等宽数字，日期统一格式；首列（标识列）冻结在左、操作列冻结在右；列宽有最小值，内容超出时省略并能看全文；用户调整的列宽、顺序、显示的列按用户记住。
        anchors:
          - { spec: ui, quote: 表格、图表、弹层、焦点和状态随主题同步。 }
        enforcement: { kind: review }
        showcase:
          - kind: demo
            title_zh: 冻结首列与操作列，数字右对齐
            description_zh: 横向滚动时首列与操作列保持可见；金额列右对齐、等宽数字。
            template: |-
              <a-table size="small" bordered :pagination="false" :scroll="{ x: 640 }" :style="{ width: '560px' }"
                :columns="[
                  { title: '客户', dataIndex: 'name', fixed: 'left', width: 120 },
                  { title: '区域', dataIndex: 'region', width: 100 },
                  { title: '应收（元）', dataIndex: 'due', align: 'right', width: 140 },
                  { title: '已收（元）', dataIndex: 'paid', align: 'right', width: 140 },
                  { title: '状态', dataIndex: 'status', width: 100 },
                  { title: '操作', key: 'op', fixed: 'right', width: 80 },
                ]"
                :data-source="[
                  { key: 1, name: '上海星河', region: '华东', due: '1,284,000.00', paid: '1,284,000.00', status: '已回款' },
                  { key: 2, name: '苏州远景', region: '华东', due: '968,500.00', paid: '600,000.00', status: '部分回款' },
                  { key: 3, name: '广州南岭', region: '华南', due: '742,300.00', paid: '0.00', status: '待回款' },
                ]">
                <template #bodyCell="{ column, text }">
                  <span v-if="column.dataIndex === 'due' || column.dataIndex === 'paid'" :style="{ fontVariantNumeric: 'tabular-nums' }">{{ text }}</span>
                  <a v-else-if="column.key === 'op'">查看</a>
                  <template v-else>{{ text }}</template>
                </template>
              </a-table>

      - id: DGRID.SORT_FILTER
        title_zh: 排序与筛选在服务端并进 URL
        statement_zh: 数据量超过一页时排序和筛选由服务端完成；当前排序的列有标识、可以取消；筛选条件、排序、页码进 URL，刷新和分享后恢复；表头的列筛选与筛选条共享同一套条件。
        anchors:
          - { spec: perf, quote: 大列表服务端分页，宽表虚拟化。 }
          - { spec: state, quote: 可分享和可恢复状态进入 URL。 }
        enforcement: { kind: review }

      - id: DGRID.SELECTION
        title_zh: 跨页选择说清范围
        statement_zh: 勾选只作用于本页时写明「已选本页 N 条」；需要选中全部结果时给「选择全部 M 条」的明确入口，批量操作按筛选条件在服务端执行，不在前端拉全量；翻页、筛选变化后说清选择是否保留。
        enforcement: { kind: review }

      - id: DGRID.VIRTUAL
        title_zh: 大数据虚拟滚动
        statement_zh: 行数超过阈值时启用虚拟滚动，行高固定，表头与冻结列保持；不一次渲染全部行；滚动时不做重计算。
        params:
          virtual_threshold: { value: 500, unit: count, source: SRC.POMASTER.DEFAULTS, label_zh: 虚拟滚动阈值, note_zh: 500 行以内整表渲染的成本可以接受，超过再上虚拟滚动 }
        anchors:
          - { spec: perf, quote: MUST NOT 大列表用普通 `v-for` 渲染全量数据（须虚拟滚动或分页）。 }
        enforcement: { kind: review }

      - id: DGRID.EDIT
        title_zh: 行内编辑可撤回
        statement_zh: 单元格就地编辑：Enter 提交、Esc 取消、Tab 到下一格；校验错误挂在单元格上并能定位；保存失败回滚到原值并说明原因；有未保存的修改时离开要提示；批量粘贴先校验再提交。
        anchors:
          - { spec: api, quote: Field Error：可定位到字段/单元格的错误。 }
        enforcement: { kind: review }

      - id: DGRID.DENSITY
        title_zh: 密度三档按用户记住
        statement_zh: "紧凑、默认、宽松三档（a-table 的 size: small / middle / large），默认取中档，用户的选择按用户记住；同一页的多个表格用同一档。"
        enforcement: { kind: review }

      - id: DGRID.EMPTY_LOADING
        title_zh: 空与加载保持列结构
        statement_zh: 首次加载显示与真实行同高的骨架行，表头和列宽不变；重新查询时保留旧数据并标出「更新中」，不清空闪烁；空结果在表格内给原因和下一步（清除筛选、新建）。
        anchors:
          - { spec: state, quote: SHOULD 在后台刷新时保留可用旧数据并标识 stale。 }
        enforcement: { kind: review }

  # ───────────────────────────── 数据呈现 · 图表 ─────────────────────────────
  - key: charts
    title_zh: 图表
    group: patterns.data
    prefix: CHART
    summary_zh: 图表库全项目一个；按问题选图；配色取 token、不只靠颜色区分；坐标轴与单位写清，柱状图从 0 开始；提示给精确值与口径；空、加载、出错与列表一致；提供数据表替代；大数据降采样；随容器重绘、卸载时销毁。
    rules:
      - id: CHART.LIBRARY
        title_zh: 图表库全项目一个
        statement_zh: 全项目只用一个图表库，经一个封装层（主题、空与出错态、尺寸监听、销毁）使用；图表库按需引入，不在应用入口同步加载。
        params:
          library: { decision: 图表用哪个库？, candidates: [ECharts（按需引入）, "@antv/g2"], label_zh: 图表库 }
        anchors:
          - { spec: perf, quote: 路由、图表和重组件按需加载。 }
        enforcement: { kind: review }

      - id: CHART.CHOOSE
        title_zh: 按问题选图
        statement_zh: 先问图要回答什么：随时间的趋势用折线，类别之间比较用柱，构成用堆叠柱（饼图只在 5 类以内、强调占比时用），分布用直方图或箱线图，两个量的关系用散点；一张图只回答一个问题；需要精确值时直接给表格。
        params:
          pie_max: { value: 5, unit: count, source: SRC.POMASTER.PRESET, label_zh: 饼图最多类别 }
        enforcement: { kind: review }

      - id: CHART.COLOR
        title_zh: 配色取 token、不只靠颜色
        statement_zh: 分类色取规范色板的顺序，系列数有上限，超出合并为「其他」；连续值用单色深浅，正负对比用发散色；状态色只表示状态；不只靠颜色区分系列（加图例、直接标注或线型），对比度满足要求。
        anchors:
          - { spec: ui, quote: 颜色不得作为唯一信息来源 }
        enforcement: { kind: review }

      - id: CHART.AXES
        title_zh: 坐标轴与单位写清
        statement_zh: 柱状图纵轴从 0 开始，折线图可以截断但要标明；单位写在轴标题或图注里；刻度 4 到 6 个，数字格式与数据格式规范一致（千分位、单位缩写）；时间轴按时间等距，不按数据点等距。
        enforcement: { kind: review }
        examples:
          - kind: dont
            title_zh: 柱状图纵轴从 40 开始，差距被放大
            code: |-
              yAxis: { min: 40 }
            lang: vue
        showcase:
          - kind: demo
            title_zh: 纵轴从 0 开始、单位写在图注
            template: |-
              <div :style="{ display: 'flex', gap: t['spacing.xl'] + 'px' }">
                <figure :style="{ margin: 0 }">
                  <svg width="220" height="150" role="img" aria-label="近 4 个月回款：1 月 42 万、2 月 56 万、3 月 48 万、4 月 71 万">
                    <line x1="36" y1="120" x2="210" y2="120" :stroke="t['color.border.default']" />
                    <text x="30" y="124" text-anchor="end" font-size="11" :fill="t['color.text.tertiary']">0</text>
                    <text x="30" y="64" text-anchor="end" font-size="11" :fill="t['color.text.tertiary']">40</text>
                    <line x1="36" y1="60" x2="210" y2="60" :stroke="t['color.border.subtle']" />
                    <rect v-for="(v, i) in [42, 56, 48, 71]" :key="i" :x="48 + i * 42" :y="120 - v * 1.5" width="26" :height="v * 1.5" :rx="t['radius.sm']" :fill="t['color.brand.primary']" :fill-opacity="i === 3 ? 1 : 0.45" />
                    <text v-for="(m, i) in ['1月', '2月', '3月', '4月']" :key="m" :x="61 + i * 42" y="138" text-anchor="middle" font-size="11" :fill="t['color.text.secondary']">{{ m }}</text>
                  </svg>
                  <figcaption :style="{ fontSize: t['typography.size.body'] + 'px', color: t['color.text.secondary'] }">回款（万元），纵轴从 0 开始</figcaption>
                </figure>
              </div>

      - id: CHART.TOOLTIP
        title_zh: 提示给精确值与口径
        statement_zh: 悬停显示该点的精确值、单位和口径说明，多系列时同一时刻的值放在一个提示里；图例可点击切换系列；触屏上点按显示提示；关键结论不只放在提示里。
        enforcement: { kind: review }

      - id: CHART.STATES
        title_zh: 空、加载、出错与列表一致
        statement_zh: 图表区域在加载、空、出错时保持尺寸不变：加载用骨架，空数据说明原因（时间范围内没有数据），出错给重试；不渲染一张空坐标轴冒充「没有数据」。
        anchors:
          - { spec: ui, quote: MUST NOT 只处理页面背景而遗漏 portal/图表。 }
        enforcement: { kind: review }

      - id: CHART.A11Y
        title_zh: 提供数据表替代
        statement_zh: 每张图有一句话的文字摘要（aria-label 或图注），并能切换到数据表视图或下载数据；颜色之外还有文字或图形区分。
        anchors:
          - { spec: ui, quote: SHOULD 为复杂图表、媒体提供数据表格、长描述或音频描述。 }
        enforcement: { kind: review }

      - id: CHART.PERF
        title_zh: 大数据降采样
        statement_zh: 点数超过阈值时先在服务端聚合或降采样；大量点用 canvas 渲染；聚合计算不放在主线程的渲染路径里；实时图表合并更新、按帧刷新。
        params:
          max_points: { value: 2000, unit: count, source: SRC.POMASTER.DEFAULTS, label_zh: 单系列点数上限, note_zh: 单系列超过 2000 点先降采样或聚合再画 }
        enforcement: { kind: review }

      - id: CHART.LIFECYCLE
        title_zh: 随容器重绘、卸载时销毁
        statement_zh: 图表跟随容器尺寸重绘（ResizeObserver，加防抖）；组件卸载时 dispose 图表实例并解除监听；主题切换时重新应用主题。
        anchors:
          - { spec: state, quote: 状态拥有的监听器、计时器、观察器、请求、流、连接、Worker 和对象 URL 必须声明释放时机，并在卸载、身份切换或能力关闭时清理。 }
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 卸载时销毁
            code: |-
              onBeforeUnmount(() => { observer.disconnect(); chart.dispose() })
            lang: ts

  # ───────────────────────────── 数据呈现 · 报表 ─────────────────────────────
  - key: reports
    title_zh: 报表
    group: patterns.data
    prefix: REPORT
    summary_zh: 报表结构固定（标题与口径、筛选、指标、明细）；口径与数据截至时间写清；筛选与对比期进 URL；合计与小计规则明确；数字格式统一；导出与页面同口径并受权限控制；打印有专门样式；大报表服务端聚合。
    rules:
      - id: REPORT.STRUCTURE
        title_zh: 报表结构固定
        statement_zh: 从上到下：报表名称与数据截至时间、筛选与对比、关键指标、图表、明细表；每块都能单独加载和出错；同类报表结构一致，用户换一张报表不用重新学。
        enforcement: { kind: review }
        showcase:
          - kind: demo
            title_zh: 标题与截至时间、筛选、指标、带合计的明细
            template: |-
              <div :style="{ width: '600px', display: 'flex', flexDirection: 'column', gap: t['spacing.lg'] + 'px' }">
                <div :style="{ display: 'flex', alignItems: 'baseline', justifyContent: 'space-between' }">
                  <span :style="{ fontSize: t['typography.size.title_medium'] + 'px', fontWeight: 600, color: t['color.text.primary'] }">回款月报</span>
                  <span :style="{ color: t['color.text.tertiary'] }">数据截至 2026-11-05 24:00（北京时间）</span>
                </div>
                <div :style="{ display: 'flex', gap: t['spacing.sm'] + 'px' }">
                  <a-range-picker picker="month" size="small" />
                  <a-select size="small" :style="{ width: '140px' }" placeholder="对比：上月" :options="[{ value: 'mom', label: '对比：上月' }, { value: 'yoy', label: '对比：去年同期' }]" />
                  <a-button size="small" :style="{ marginLeft: 'auto' }">导出</a-button>
                </div>
                <div :style="{ display: 'grid', gridTemplateColumns: 'repeat(3, 1fr)', gap: t['spacing.lg'] + 'px' }">
                  <a-statistic title="回款（元）" :value="2994800" :value-style="{ fontVariantNumeric: 'tabular-nums' }" />
                  <a-statistic title="回款率" :value="86.4" suffix="%" :precision="1" />
                  <a-statistic title="逾期客户" :value="3" suffix="家" />
                </div>
                <a-table size="small" :pagination="false"
                  :columns="[{ title: '区域', dataIndex: 'region' }, { title: '应收（元）', dataIndex: 'due', align: 'right' }, { title: '已收（元）', dataIndex: 'paid', align: 'right' }, { title: '回款率', dataIndex: 'rate', align: 'right' }]"
                  :data-source="[{ key: 1, region: '华东', due: '2,252,500.00', paid: '1,884,000.00', rate: '83.6%' }, { key: 2, region: '华南', due: '742,300.00', paid: '742,300.00', rate: '100.0%' }]">
                  <template #summary>
                    <a-table-summary-row>
                      <a-table-summary-cell>合计</a-table-summary-cell>
                      <a-table-summary-cell align="right">2,994,800.00</a-table-summary-cell>
                      <a-table-summary-cell align="right">2,626,300.00</a-table-summary-cell>
                      <a-table-summary-cell align="right">87.7%</a-table-summary-cell>
                    </a-table-summary-row>
                  </template>
                </a-table>
              </div>

      - id: REPORT.DEFINITIONS
        title_zh: 口径与截至时间写清
        statement_zh: 每个指标都有口径说明（悬停或「口径」入口）：计算公式、包含与排除、统计时区；页面显示数据截至时间和数据延迟；口径变化时标出变化点，不把新旧口径的数据画成一条线。
        enforcement: { kind: review }

      - id: REPORT.FILTERS
        title_zh: 筛选与对比期进 URL
        statement_zh: 时间范围、维度筛选、对比期（环比、同比）进 URL，可分享可恢复；默认时间范围固定且写明；对比结果同时给绝对值和变化率。
        anchors:
          - { spec: state, quote: 可分享和可恢复状态进入 URL。 }
        enforcement: { kind: review }

      - id: REPORT.TOTALS
        title_zh: 合计与小计规则明确
        statement_zh: 合计行固定在明细底部（或顶部，全项目一致）；比率类指标的合计按分子分母重新计算，不对各行百分比求和或求平均；不同单位的值不相加；分组小计与总计的口径一致。
        enforcement: { kind: review }

      - id: REPORT.NUMBERS
        title_zh: 数字格式统一
        statement_zh: 金额、数量、比率按数据格式规范输出：千分位、固定小数位、单位写在表头或指标名里、负数格式统一；空值显示「—」，和 0 区分开；数字右对齐、用等宽数字。
        enforcement: { kind: gate, check: format.no-local-pattern }

      - id: REPORT.EXPORT
        title_zh: 导出与页面同口径并受权限控制
        statement_zh: 导出的数据与页面使用同一组筛选和口径，文件名带报表名与时间范围；大数据量导出走后台任务，给进度并在完成时通知；导出受权限控制并按规则脱敏，导出操作留审计。
        anchors:
          - { spec: security, quote: MUST 对复制、导出、打印功能实施权限控制与脱敏策略；高敏感字段导出需审计与额外授权。 }
        enforcement: { kind: review }

      - id: REPORT.PRINT
        title_zh: 打印有专门样式
        statement_zh: 需要打印的报表提供打印样式：去掉导航与交互控件，表头在每页重复，行不被分页截断，打印页脚写明报表名、筛选条件与截至时间。
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 打印样式
            code: |-
              @media print {
                nav, .toolbar { display: none; }
                thead { display: table-header-group; }
                tr { break-inside: avoid; }
              }
            lang: css

      - id: REPORT.PERF
        title_zh: 大报表服务端聚合
        statement_zh: 聚合在服务端完成，前端只拿结果；明细分页或懒加载；同一报表的多个区块并行请求；结果可以缓存，页面显示缓存的生成时间并能手动刷新。
        anchors:
          - { spec: perf, quote: MUST NOT 串行发起可并行的页面初始化请求（须并行或后端聚合）。 }
        enforcement: { kind: review }

  # ─────────────────────────────── 工程规范 · 状态管理 ───────────────────────────────
  - key: state
    title_zh: 状态管理
    group: engineering
    prefix: STATE
    summary_zh: 每份状态有属主；服务端数据进查询缓存，不复制进全局 store；全局 store 只放稳定的跨页状态；可分享的状态进 URL；组件不直接发请求；身份切换与卸载时清理。
    rules:
      - id: STATE.OWNERSHIP
        title_zh: 状态放哪
        statement_zh: 每份状态都说清楚：谁拥有、谁能改、放在哪（组件内、页面、全局 store、查询缓存、URL、浏览器存储）、活多久、什么时候清理。组件自己的状态留在组件里，不放进全局 store。
        anchors:
          - { spec: state, quote: 每个状态声明 owner、更新者、存储位置、生命周期和清理策略。 }
          - { spec: state, quote: MUST NOT 将组件状态放入全局 store。 }
        enforcement: { kind: review }

      - id: STATE.SERVER_STATE
        title_zh: 服务端数据
        statement_zh: 从接口来的数据由查询缓存层管理（缓存 key、过期、重新获取、失效都在这一层），页面直接从查询缓存读；不把服务端数据复制进全局 store 再手动同步，也不在全局 store 里存大量业务数据。查询缓存用 @tanstack/vue-query。
        params:
          query_library: { value: "@tanstack/vue-query", source: SRC.POMASTER.STACK_DECISION, label_zh: 查询缓存库 }
        anchors:
          - { spec: state, quote: server state 由查询缓存层管理。 }
          - { spec: state, quote: MUST NOT 复制 server state 到全局 store 手动同步。 }
          - { spec: perf, quote: MUST NOT 在全局状态库存储大量业务数据（server state 须走 Query Cache）。 }
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 页面从查询缓存读
            code: |-
              const { data, isLoading } = useVehicleModelList(query)   // 由生成的接口客户端 + 查询缓存提供
            lang: ts
          - kind: dont
            title_zh: 拉回来塞进全局 store 再同步
            code: |-
              const store = useVehicleStore()
              store.list = (await api.listVehicleModels(query)).items   // 之后每次改动都要手动同步
            lang: ts

      - id: STATE.GLOBAL_STORE
        title_zh: 全局 store
        statement_zh: 全局状态库用 Pinia（Vuex 已是维护模式，不再使用）；全局 store 只放跨页面且稳定的状态，比如当前用户、权限、偏好设置；每个 store 一个文件，放在约定目录，文件头写明属主。
        params:
          library: { value: Pinia, source: SRC.POMASTER.VUE3_SPEC, label_zh: 全局状态库 }
        anchors:
          - { spec: vue3, quote: 新应用状态管理选 Pinia }
          - { spec: state, quote: 全局 store 只保存稳定跨页面状态。 }
        enforcement: { kind: gate, check: state.store-library }

      - id: STATE.URL
        title_zh: URL 状态
        statement_zh: 列表的筛选条件、页码、排序、当前标签页这类可分享、刷新后要恢复的状态放进 URL；敏感信息和没提交的表单不进 URL。
        anchors:
          - { spec: state, quote: 可分享和可恢复状态进入 URL。 }
          - { spec: state, quote: MUST NOT 将敏感或未提交表单写入 URL。 }
        enforcement: { kind: review }
        showcase:
          - kind: lab
            lab: state.url-filters
            title_zh: 实验：筛选条件进 URL
            description_zh: 改筛选和页码，地址栏跟着变；点「刷新页面」，视图从 URL 原样恢复。
        examples:
          - kind: do
            title_zh: 筛选与页码在 URL 里
            code: |-
              /admin/vehicle-models?status=ENABLED&page=3&size=20&sort=business_code,asc
            lang: html

      - id: STATE.REQUESTS
        title_zh: 请求入口
        statement_zh: 组件不直接调用 fetch、axios，一律经生成的接口客户端（类型与 OpenAPI 同源）和查询缓存；展示组件不请求接口、不改路由、不改全局状态，数据从参数传入。
        anchors:
          - { spec: ui, quote: MUST NOT 让展示组件偷偷请求接口、改路由或全局状态。 }
        enforcement: { kind: gate, check: state.no-direct-request }
        examples:
          - kind: dont
            title_zh: 组件里直接 fetch
            code: |-
              onMounted(async () => { rows.value = await (await fetch('/admin/api/v1/vehicle-models')).json() })
            lang: ts

      - id: STATE.CACHE_KEYS
        title_zh: 缓存 key 与失效
        statement_zh: 查询缓存的 key 包含所有影响结果的筛选条件和上下文（用户、租户、数据范围）；每个写操作声明它会让哪些查询失效，成功后刷新依赖数据；切换用户、角色、组织或数据范围时清掉可能越权的缓存。
        anchors:
          - { spec: state, quote: Query Key 包含所有影响结果的筛选和上下文。 }
          - { spec: state, quote: 写操作定义依赖失效矩阵。 }
          - { spec: state, quote: 用户、权限或范围切换时清除越权风险状态。 }
        enforcement: { kind: review }
        showcase:
          - kind: lab
            lab: state.query-cache
            title_zh: 实验：查询缓存与失效
            description_zh: 切换筛选看缓存命中；点「新建一条」后，对应的 key 失效并重新拉取。

      - id: STATE.CLEANUP
        title_zh: 清理与竞态
        statement_zh: 状态持有的监听器、计时器、订阅、请求在组件卸载、身份切换时清理；已取消的请求、旧订阅、旧身份下的迟到结果不得写入当前状态。
        anchors:
          - { spec: state, quote: MUST NOT 让已取消请求、旧订阅或旧身份上下文的迟到结果继续写入当前状态。 }
        enforcement: { kind: review }
        showcase:
          - kind: lab
            lab: state.race
            title_zh: 实验：迟到的响应不写回
            description_zh: 快速输入会发出多个请求，响应乱序到达；只有最新一次的结果写进列表。打开「错误做法」看旧结果覆盖新结果。

      - id: STATE.FORM_MODEL
        title_zh: 表单模型
        statement_zh: 表单用独立的表单模型和类型化的校验 schema，不直接绑定接口返回的 DTO；区分初始值、当前值、是否改过、错误和提交中。
        anchors:
          - { spec: page, quote: 使用独立 FormModel 和 typed schema。 }
          - { spec: page, quote: MUST NOT 直接绑定 DTO。 }
        enforcement: { kind: review }

      - id: STATE.BROWSER_STORAGE
        title_zh: 浏览器存储
        statement_zh: 存进浏览器（localStorage、IndexedDB 等）的每一项都登记用途、隔离 key（按用户、租户）、版本、大小、过期时间和清理时机；读回来先校验版本和身份；脚本可读的存储里不放会话标识、刷新令牌等凭据。
        anchors:
          - { spec: state, quote: 每个持久化项必须声明用途、Storage Class、Isolation Key、schema 版本、大小预算、过期时间、迁移/重置策略、清理触发器和 Owner。 }
          - { spec: state, quote: 可被脚本读取的存储不得持久化 session identifier、refresh token、secret 或等价凭据 }
        enforcement: { kind: review }

  # ─────────────────────────────── 工程规范 · 性能 ───────────────────────────────
  - key: performance
    title_zh: 性能
    group: engineering
    prefix: PERF
    summary_zh: 先定预算；路由与重组件按需加载；大列表分页、宽表虚拟化；输入防抖并丢弃过期响应；初始化请求并行；度量分清实验室与真实用户数据。
    rules:
      - id: PERF.BUDGET
        title_zh: 性能预算
        statement_zh: 上线前定好预算：真实用户第 75 百分位 LCP ≤ 2.5 s、INP ≤ 200 ms、CLS ≤ 0.1（用户侧必须达到，管理侧作为参考目标，项目可以凭证据收紧）；首屏脚本体积和单个路由分包体积由项目定上限。
        params:
          lcp: { value: 2500, unit: ms, source: SRC.POMASTER.PERF_SPEC, label_zh: LCP（p75） }
          inp: { value: 200, unit: ms, source: SRC.POMASTER.PERF_SPEC, label_zh: INP（p75） }
          cls: { value: 0.1, source: SRC.POMASTER.PERF_SPEC, label_zh: CLS（p75） }
          initial_js: { value: 170, unit: none, source: SRC.POMASTER.DEFAULTS, label_zh: 首屏脚本体积（KB，压缩后）, note_zh: 取业界常用的首屏脚本预算 170 KB（gzip 后） }
          route_chunk: { value: 100, unit: none, source: SRC.POMASTER.DEFAULTS, label_zh: 路由分包体积（KB，压缩后）, note_zh: 单个路由分包不超过 100 KB（gzip 后），超过就再拆 }
        anchors:
          - { spec: perf, quote: 定义首屏、包体、交互和核心页面预算。 }
          - { spec: perf, quote: 默认参考目标为 p75 的 LCP ≤ 2.5s、INP ≤ 200ms、CLS ≤ 0.1 }
        enforcement: { kind: review }

      - id: PERF.LAZY_LOAD
        title_zh: 按需加载
        statement_zh: 路由一律懒加载；图表、富文本编辑器、大表格等重组件在用到的页面里按需加载；应用入口（main.ts）不同步引入这些重型依赖；页面先加载核心内容，非核心的延后。
        anchors:
          - { spec: perf, quote: 路由、图表和重组件按需加载。 }
          - { spec: perf, quote: MUST NOT 在应用入口同步 import 重型编辑器、图表库或大表组件（首屏重依赖）。 }
        enforcement: { kind: gate, check: perf.lazy-load }
        examples:
          - kind: do
            title_zh: 路由懒加载
            code: |-
              { path: '/vehicle-models', component: () => import('@/pages/vehicle-model/ListPage.vue') }
            lang: ts
          - kind: dont
            title_zh: 入口同步引入图表库
            code: |-
              // main.ts
              import * as echarts from 'echarts'
            lang: ts

      - id: PERF.ON_DEMAND_LIBRARY
        title_zh: 组件库按需引入
        statement_zh: 组件库按需引入，不整包注册：管理侧按组件引入 ant-design-vue；用户侧 Vant 用官方的自动按需引入插件，不与全量引入混用。
        anchors:
          - { spec: h5, quote: Vant 引入必须走官方口径 }
        enforcement: { kind: gate, check: perf.no-full-library-import }
        examples:
          - kind: dont
            title_zh: 整包注册
            code: |-
              import Antd from 'ant-design-vue'
              app.use(Antd)
            lang: ts

      - id: PERF.LARGE_LISTS
        title_zh: 大列表
        statement_zh: 大列表走服务端分页、筛选、排序（管理侧每页最多 200 条，用户侧每次最多 50 条，与接口分页档一致）；行数多或列很多的表格用虚拟滚动；不用 v-for 一次渲染全量数据。
        params:
          admin_max_page_size: { value: 200, unit: count, source: SRC.POMASTER.SURFACES, label_zh: 管理侧每页上限 }
          public_max_page_size: { value: 50, unit: count, source: SRC.POMASTER.SURFACES, label_zh: 用户侧每次上限 }
          virtual_threshold: { value: 500, unit: count, source: SRC.POMASTER.DEFAULTS, label_zh: 虚拟滚动阈值, note_zh: 与数据网格的虚拟滚动阈值一致 }
        anchors:
          - { spec: perf, quote: 大列表服务端分页，宽表虚拟化。 }
          - spec: perf
            quote: 'MUST NOT 大列表用普通 `v-for` 渲染全量数据（须虚拟滚动或分页）。'
        enforcement: { kind: review }

      - id: PERF.INPUT
        title_zh: 输入与过期响应
        statement_zh: 搜索、联想等随输入触发的请求做防抖；新请求发出时取消旧请求；过期的响应不覆盖新状态。
        params:
          debounce: { value: 300, unit: ms, source: SRC.POMASTER.DEFAULTS, label_zh: 防抖间隔, note_zh: 输入停顿 300ms 再发请求：打字时不连发，停下来又不显得迟钝 }
        anchors:
          - { spec: perf, quote: 搜索防抖、旧请求取消、过期响应丢弃。 }
        enforcement: { kind: review }

      - id: PERF.PARALLEL_INIT
        title_zh: 并行初始化
        statement_zh: 页面初始化需要的多个请求并行发出，或由后端聚合成一个；不串行等待彼此无关的请求。
        anchors:
          - { spec: perf, quote: MUST NOT 串行发起可并行的页面初始化请求（须并行或后端聚合）。 }
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 并行
            code: |-
              const [dict, regions] = await Promise.all([api.getDict('vehicle_type'), api.listRegions()])
            lang: ts
          - kind: dont
            title_zh: 串行等待
            code: |-
              const dict = await api.getDict('vehicle_type')
              const regions = await api.listRegions()
            lang: ts

      - id: PERF.COMPUTE
        title_zh: 渲染计算
        statement_zh: 渲染函数和模板里不做复杂计算，派生值用 computed；对大数据全集的计算放到后端或 Web Worker，前端只做即时的轻计算。
        anchors:
          - { spec: perf, quote: MUST NOT 在 render 中执行复杂计算。 }
        enforcement: { kind: review }

      - id: PERF.MEASURE
        title_zh: 度量口径
        statement_zh: 性能结论分清实验室数据和真实用户数据，记录设备、网络、浏览器、样本量和统计口径，放行看第 75 百分位；同一数据量下对比前后结果，不拿平均值或单次本地耗时下结论。
        anchors:
          - { spec: perf, quote: 性能预算必须区分实验室数据与真实用户数据 }
        enforcement: { kind: review }

  # ───────────────────────────── 工程规范 · 安全 ─────────────────────────────
  - key: security
    title_zh: 安全
    group: engineering
    prefix: SEC
    summary_zh: 不可信内容不进危险渲染；链接与跳转走白名单；状态变更请求带 CSRF 防护；不用 eval 一类动态执行；第三方脚本登记并校验完整性；前端隐藏不是鉴权；敏感值不出现在 URL、日志、埋点和剪贴板；跨窗口消息校验来源。
    rules:
      - id: SEC.XSS
        title_zh: 不可信内容不进危险渲染
        statement_zh: 不用 v-html 渲染用户输入或接口返回的富文本；确实要渲染富文本时，经项目唯一的净化组件（白名单 sanitizer，如 DOMPurify）输出；不拼接 HTML 字符串。
        anchors:
          - { spec: security, quote: MUST NOT 使用 `v-html` / `innerHTML` / `dangerouslySetInnerHTML` 渲染不可信内容；富文本必须使用白名单 sanitizer。 }
        enforcement: { kind: gate, check: security.no-unsafe-html }
        examples:
          - kind: dont
            title_zh: 直接渲染接口返回的 HTML
            code: |-
              <div v-html="notice.content"></div>
            lang: vue
          - kind: do
            title_zh: 经净化组件
            code: |-
              <SafeHtml :html="notice.content" />
            lang: vue

      - id: SEC.LINKS
        title_zh: 链接与跳转走白名单
        statement_zh: 用户或接口提供的链接只接受 http、https、mailto 协议（拒绝 javascript:、data:）；登录后的回跳地址只接受站内相对路径；新窗口打开外链一律带 rel="noopener noreferrer"。
        enforcement: { kind: gate, check: security.safe-link }
        examples:
          - kind: do
            title_zh: 回跳地址只认站内路径
            code: |-
              const target = typeof route.query.redirect === 'string' && route.query.redirect.startsWith('/') && !route.query.redirect.startsWith('//') ? route.query.redirect : '/'
              router.replace(target)
            lang: ts
          - kind: do
            title_zh: 外链
            code: |-
              <a :href="url" target="_blank" rel="noopener noreferrer">查看合同</a>
            lang: vue

      - id: SEC.CSRF
        title_zh: 状态变更请求带 CSRF 防护
        statement_zh: 所有改变状态的请求（表单、AJAX、上传、批量操作）由 HTTP 客户端统一带上 CSRF token 和自定义请求头；token 不放 URL、不存进脚本可读的存储；业务代码不自己拼这些头。
        anchors:
          - { spec: security, quote: MUST 在表单提交、AJAX/Fetch、上传、批量操作、GraphQL mutation 中携带 CSRF token。 }
          - { spec: security, quote: MUST NOT 让业务请求自行决定 CSRF/token 头格式。 }
        enforcement: { kind: review }

      - id: SEC.NO_EVAL
        title_zh: 不用动态执行
        statement_zh: 不用 eval、new Function、字符串形式的 setTimeout / setInterval，不用内联事件属性；生产环境按严格 CSP 部署（script-src 不含 'unsafe-inline' 和 'unsafe-eval'）。
        anchors:
          - { spec: security, quote: MUST 部署 CSP，默认 `default-src 'self'`；脚本/样式/img/font/connect/frame 按业务最小白名单开放。 }
        enforcement: { kind: gate, check: security.no-eval }
        examples:
          - kind: dont
            title_zh: 字符串当代码执行
            code: |-
              setTimeout('refresh()', 1000)
              const fn = new Function('row', rule.expression)
            lang: ts

      - id: SEC.THIRD_PARTY
        title_zh: 第三方脚本登记并校验完整性
        statement_zh: 第三方脚本、iframe、SDK 先登记（负责人、来源域、权限、数据范围、版本、撤除方式）再引入；从 CDN 加载的脚本带 SRI（integrity + crossorigin）；iframe 用 sandbox 收紧能力。
        anchors:
          - { spec: security, quote: MUST NOT 加载无 SRI/无来源清单的第三方脚本或 iframe。 }
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 带完整性校验
            code: |-
              <script src="https://cdn.example.com/widget@2.1.0/widget.js" integrity="sha384-…" crossorigin="anonymous"></script>
            lang: html

      - id: SEC.AUTHZ_UI
        title_zh: 前端隐藏不是鉴权
        statement_zh: 按权限隐藏或禁用按钮、菜单只是体验；每个接口由后端强制鉴权；前端不拿全量敏感数据再自己过滤或用 CSS 藏起来，按权限脱敏由后端完成。
        anchors:
          - { spec: security, quote: MUST NOT 用前端隐藏菜单或按钮替代后端鉴权。 }
          - { spec: security, quote: MUST 后端返回字段按权限脱敏，前端不得获取全量敏感数据后再自行过滤或仅 CSS 隐藏。 }
        enforcement: { kind: review }

      - id: SEC.SENSITIVE
        title_zh: 敏感值不外泄
        statement_zh: token、密码、身份证号这类敏感原值不写进 console、日志、埋点、错误上报、剪贴板、URL 和下载文件名；错误提示不暴露堆栈、内部路径和内部 ID。
        anchors:
          - { spec: security, quote: MUST NOT 将敏感原值写入浏览器 console、日志、埋点、错误监控、剪贴板、URL、localStorage、下载文件。 }
        enforcement: { kind: review }

      - id: SEC.POSTMESSAGE
        title_zh: 跨窗口消息校验来源
        statement_zh: postMessage 指定目标 origin，不用 '*'；接收方先校验 event.origin 在白名单内，再按结构解析数据；收到的内容不进 eval 或 innerHTML。
        anchors:
          - { spec: security, quote: MUST NOT 使用 `postMessage('*')` 或在跨窗口消息中直接执行 eval/innerHTML。 }
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 校验来源
            code: |-
              window.addEventListener('message', (event) => {
                if (!TRUSTED_ORIGINS.includes(event.origin)) return
                const message = parseWidgetMessage(event.data)
              })
            lang: ts

  # ───────────────────────────── 工程规范 · 会话与凭据 ─────────────────────────────
  - key: session
    title_zh: 会话与凭据
    group: engineering
    prefix: SESSION
    summary_zh: 凭据放在脚本读不到的地方；Cookie 属性收紧；登录后换会话；空闲与绝对超时；敏感操作重新验证；静默刷新只试一次；登出全面清理并同步到所有标签页；非必要 Cookie 先征得同意。
    rules:
      - id: SESSION.STORAGE
        title_zh: 凭据放在脚本读不到的地方
        statement_zh: 会话标识与刷新令牌放在 HttpOnly Cookie 里，由后端设置；短期访问令牌只放内存（模块变量或状态库里不持久化的字段）；不存进 localStorage、sessionStorage、IndexedDB，不放进 URL 和 URL 片段。
        anchors:
          - { spec: security, quote: MUST 禁止将 session identifier、refresh token、access token、secret、密码等价凭据持久化到 localStorage/sessionStorage/IndexedDB（除非经安全 Owner 批准的短期例外）。 }
        enforcement: { kind: gate, check: security.no-token-storage }
        examples:
          - kind: dont
            title_zh: 令牌存进 localStorage
            code: |-
              localStorage.setItem('access_token', data.token)
            lang: ts
          - kind: do
            title_zh: 令牌只放内存
            code: |-
              let accessToken: string | null = null
              export const setAccessToken = (token: string | null) => { accessToken = token }
            lang: ts

      - id: SESSION.COOKIE
        title_zh: Cookie 属性收紧
        statement_zh: 会话类 Cookie 一律 HttpOnly、Secure、SameSite（默认 Lax，跨站场景不需要时用 Strict），优先用 __Host- 前缀（必须 Secure、Path=/、不带 Domain）；Path 与 Domain 取最小范围；Cookie 里不放业务数据和个人信息；前端代码不读写会话 Cookie。
        params:
          same_site: { decision: 会话 Cookie 的 SameSite 取 Lax 还是 Strict？, candidates: [Lax, Strict], label_zh: SameSite }
          prefix: { value: __Host-, source: SRC.MDN.COOKIES, label_zh: Cookie 名前缀 }
        anchors:
          - { spec: security, quote: MUST 使用双重提交 cookie 或同步器 token；token 必须每次会话/请求不可预测且由后端验证。 }
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 后端下发的会话 Cookie
            code: |-
              Set-Cookie: __Host-sid=…; Path=/; Secure; HttpOnly; SameSite=Lax
            lang: html

      - id: SESSION.ROTATE
        title_zh: 登录后换会话
        statement_zh: 登录成功、切换租户、提升权限后由后端签发新的会话标识并作废旧的（防会话固定）；前端在这些时刻丢弃内存里的旧令牌和旧的 CSRF token，重新获取。
        anchors:
          - { spec: security, quote: MUST 在登录、切换租户、敏感操作后轮换 CSRF token。 }
        enforcement: { kind: review }

      - id: SESSION.TIMEOUT
        title_zh: 空闲与绝对超时
        statement_zh: 会话同时有空闲超时和绝对超时；空闲超时到期前提示「即将退出」并允许续期；超时后保存可恢复的现场（当前路由、未提交表单的草稿），重新登录后回到原处。
        params:
          idle: { decision: 空闲多久自动退出？, candidates: [30 分钟, 2 小时], label_zh: 空闲超时 }
          absolute: { decision: 登录后最长多久必须重新登录？, candidates: [8 小时, 24 小时], label_zh: 绝对超时 }
          warn_before: { decision: 到期前多久提示？, candidates: [2 分钟, 5 分钟], label_zh: 到期提醒 }
        enforcement: { kind: review }

      - id: SESSION.STEP_UP
        title_zh: 敏感操作重新验证
        statement_zh: 修改密码、改绑手机、导出敏感数据、批量删除、审批这类高影响操作前要求重新验证身份（输入密码或二次验证），验证结果只对这一次操作有效。
        anchors:
          - { spec: security, quote: MUST 对导出、删除、审批、批量操作等高影响动作增加二次确认或后端 challenge。 }
        enforcement: { kind: review }

      - id: SESSION.REFRESH
        title_zh: 静默刷新只试一次
        statement_zh: 请求返回 401 时，HTTP 客户端用刷新令牌静默刷新一次（并发的 401 共用同一次刷新），成功后重放原请求；刷新失败就清理会话并带回跳地址去登录；刷新逻辑只在 HTTP 客户端里写一处。
        anchors:
          - { spec: security, quote: MUST 在 token 即将过期前使用 silent refresh 或显式重新认证，不得在 URL 中传递 token。 }
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 并发 401 共用一次刷新
            code: |-
              let refreshing: Promise<void> | null = null
              async function onUnauthorized() {
                refreshing ??= api.refresh().finally(() => { refreshing = null })
                await refreshing
              }
            lang: ts

      - id: SESSION.LOGOUT
        title_zh: 登出全面清理并同步
        statement_zh: 登出时调用后端注销接口，清空内存令牌、查询缓存、状态库、按用户隔离的存储、订阅、Worker 和长连接；用 BroadcastChannel 通知其他标签页同步登出。
        anchors:
          - { spec: security, quote: MUST 实现统一登出：清除服务端会话、客户端内存 token、触发所有标签页/Worker 登出事件。 }
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 多标签页同步登出
            code: |-
              const channel = new BroadcastChannel('auth')
              channel.onmessage = (event) => { if (event.data === 'logout') clearSession() }
              export function logout() { clearSession(); channel.postMessage('logout') }
            lang: ts

      - id: SESSION.CONSENT
        title_zh: 非必要 Cookie 先征得同意
        statement_zh: 统计、广告等非必要 Cookie 和本地存储在用户同意之前不写入；同意可以撤回，撤回后停止加载对应脚本并清理它写下的数据；必要 Cookie 在隐私说明里列明用途。
        anchors:
          - { spec: security, quote: MUST 在用户撤回同意或第三方 SDK 不再需要时停止加载并清理其状态/缓存。 }
        enforcement: { kind: review }

  # ───────────────────────────── 工程规范 · 防篡改与防劫持 ─────────────────────────────
  - key: tamper
    title_zh: 防篡改与防劫持
    group: engineering
    prefix: TAMPER
    summary_zh: 前端的一切都可被篡改：价格、权限、状态以服务端为准；关键写请求防重放；传输全程 HTTPS 与 HSTS；页面不被别人嵌套（防点击劫持）；外链防反向标签页劫持；本地数据读回先校验；前端混淆不是安全措施。
    rules:
      - id: TAMPER.SERVER_TRUTH
        title_zh: 以服务端为准
        statement_zh: 金额、价格、折扣、库存、权限、审批状态这类业务事实由服务端计算和判定；前端提交用户的意图（选了哪个商品、改成什么），不提交可被改写的结论（总价、是否有权限）；客户端校验只是体验，服务端再校验一遍。
        anchors:
          - { spec: security, quote: MUST 将客户端校验仅视为 UX 辅助，服务端校验为权威；前端仍需执行同步/异步校验以提升体验。 }
        enforcement: { kind: review }
        examples:
          - kind: dont
            title_zh: 提交前端算的总价
            code: |-
              api.createOrder({ items, totalPrice: cart.total })
            lang: ts
          - kind: do
            title_zh: 只提交意图，总价由后端算
            code: |-
              api.createOrder({ items: items.map(({ skuId, quantity }) => ({ skuId, quantity })) })
            lang: ts

      - id: TAMPER.REPLAY
        title_zh: 关键写请求防重放
        statement_zh: 支付、审批、转账这类关键写请求带一次性随机数和时间戳，由后端校验时效并拒绝重复；需要时对请求体签名（密钥不在前端代码里，由后端按会话下发短期签名凭据）；重放保护与幂等键一起使用。
        params:
          window: { value: 300, unit: none, source: SRC.POMASTER.DEFAULTS, label_zh: 时间窗口（秒）, note_zh: 允许 5 分钟时钟偏差，与常见请求签名方案一致 }
        enforcement: { kind: review }

      - id: TAMPER.TRANSPORT
        title_zh: 传输全程 HTTPS
        statement_zh: 全站 HTTPS 并启用 HSTS；页面不加载任何 HTTP 资源（无混合内容）；接口地址、WebSocket 地址都用 https / wss；证书错误不提供「继续访问」的旁路。
        anchors:
          - { spec: security, quote: MUST 配置 TLS 1.2+；HTTPS 页面不得加载 HTTP 资源（混合内容）。 }
        enforcement: { kind: review }

      - id: TAMPER.FRAMING
        title_zh: 页面不被别人嵌套
        statement_zh: 响应头设置 CSP frame-ancestors（或 X-Frame-Options），默认禁止被其他站点嵌入 iframe，防点击劫持；确需被嵌入的页面列出允许的来源。
        anchors:
          - { spec: security, quote: "MUST 使用 `X-Frame-Options: DENY/SAMEORIGIN` 或 CSP `frame-ancestors` 防止点击劫持。" }
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 禁止被嵌入
            code: |-
              Content-Security-Policy: frame-ancestors 'self'
            lang: html

      - id: TAMPER.TABNABBING
        title_zh: 外链防反向标签页劫持
        statement_zh: target=_blank 的链接一律带 rel="noopener noreferrer"；用 window.open 打开外部页面时传 noopener；不把 window.opener 交给外部页面。
        enforcement: { kind: gate, check: security.safe-link }
        examples:
          - kind: do
            title_zh: window.open 带 noopener
            code: |-
              window.open(url, '_blank', 'noopener,noreferrer')
            lang: ts

      - id: TAMPER.LOCAL_DATA
        title_zh: 本地数据读回先校验
        statement_zh: 从 localStorage、IndexedDB、URL 参数读回的数据当作不可信输入：校验结构、版本和所属用户，不符合就丢弃并回到默认值；不把本地数据当成权限或业务判定的依据。
        anchors:
          - { spec: state, quote: 持久化状态必须区分用户/租户/环境命名空间，并在登出、权限收缩或版本不兼容时失效或迁移。 }
        enforcement: { kind: review }

      - id: TAMPER.OBFUSCATION
        title_zh: 前端混淆不是安全措施
        statement_zh: 代码混淆、禁用右键、反调试只能增加一点阅读成本，不能保护任何秘密：前端代码里不放密钥、内部接口凭据和不该给用户看到的规则；source map 不公开发布（随版本上传到错误监控并限制访问）。
        anchors:
          - { spec: obs, quote: source map 与版本对应且受权限保护。 }
        enforcement: { kind: review }

  # ───────────────────────────── 工程规范 · 健壮性 ─────────────────────────────
  - key: robustness
    title_zh: 健壮性
    group: engineering
    prefix: ROBUST
    summary_zh: 接口数据在边界按契约解析；渲染不怕空值与缺字段；每个请求有超时；离线和弱网有处理；非核心模块失败不影响主流程；界面承受重复与乱序；资源在卸载时清理；输入上限前端先拦。
    rules:
      - id: ROBUST.PARSE
        title_zh: 接口数据在边界按契约解析
        statement_zh: 接口响应在 HTTP 客户端或接口层按契约 schema 解析（类型由 OpenAPI 生成，运行时用 zod 一类校验关键结构）；解析失败归为「契约错误」走错误处理，不把畸形数据交给组件去崩。
        anchors:
          - { spec: api, quote: 传输成功与业务成功必须分别判断；HTTP 非成功状态、契约解析失败、取消、超时、离线和业务错误不得混为一类。 }
        enforcement: { kind: review }

      - id: ROBUST.NULLS
        title_zh: 渲染不怕空值与缺字段
        statement_zh: 可选字段用可选链和明确的默认显示（「—」）；列表字段为空数组、null 或缺失时都能渲染；数字字段区分 0 与空；不在模板里写多层取值链而不设防。
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 明确的空值显示
            code: |-
              <span>{{ order.customer?.name ?? '—' }}</span>
            lang: vue

      - id: ROBUST.TIMEOUT
        title_zh: 每个请求有超时
        statement_zh: HTTP 客户端给每个请求设超时（上传、导出等长请求单独设）；超时、取消、离线、服务端错误分别处理与提示；超时的请求不自动重发非幂等写操作。
        params:
          timeout: { value: 15, unit: none, source: SRC.POMASTER.DEFAULTS, label_zh: 请求超时（秒）, note_zh: 普通请求 15 秒超时；导出、上传这类长任务走后台任务，不靠拉长超时 }
        anchors:
          - { spec: api, quote: HTTP Client 统一处理 base URL、认证、超时、取消、trace 和 envelope。 }
        enforcement: { kind: review }

      - id: ROBUST.OFFLINE
        title_zh: 离线和弱网有处理
        statement_zh: 监听 online / offline：离线时顶部提示并暂停轮询，已输入的内容不丢；恢复后重新校验数据新鲜度并重试读请求；页面从后台或前进后退缓存恢复时同样重新校验。
        anchors:
          - { spec: page, quote: 页面必须兼容 `pagehide` / `pageshow`、可见性变化和 bfcache 恢复；恢复后重新校验连接、缓存、权限与数据新鲜度。 }
        enforcement: { kind: review }

      - id: ROBUST.DEGRADE
        title_zh: 非核心模块失败不影响主流程
        statement_zh: 推荐位、统计 SDK、客服挂件、图表这类非核心模块失败时只在它自己的位置降级（隐藏或显示占位），不阻塞首屏和主流程；第三方 SDK 初始化失败静默降级并上报。
        anchors:
          - { spec: obs, quote: MUST NOT 让 SDK 初始化、遥测缓存或发送重试阻塞首屏、用户操作或错误恢复。 }
        enforcement: { kind: review }

      - id: ROBUST.REPEAT_ORDER
        title_zh: 承受重复与乱序
        statement_zh: 同一事件触发两次、响应乱序到达、组件重复挂载，界面状态都保持正确：请求结果写回前核对请求序号与上下文（见 ASYNC.LATEST），订阅与监听的数量有上限、不随重复挂载增长。
        anchors:
          - { spec: page, quote: 重复进入、挂载、恢复或重试必须保持资源数量有界，并有自动化证据证明不会重复订阅或产生开放句柄。 }
        enforcement: { kind: review }

      - id: ROBUST.CLEANUP
        title_zh: 资源在卸载时清理
        statement_zh: 定时器、事件监听、订阅、观察器、WebSocket、对象 URL 在 onBeforeUnmount（或 effectScope 结束）时释放；路由离开和身份切换时取消进行中的请求。
        anchors:
          - { spec: page, quote: 路由离开、组件销毁、注销、切换账号/租户、权限变化和功能关闭必须清理对应资源与敏感上下文。 }
        enforcement: { kind: review }

      - id: ROBUST.LIMITS
        title_zh: 输入上限前端先拦
        statement_zh: 长度、文件大小、文件类型、数量、数值范围的上限与后端契约一致，在前端先拦截并说清限制（还能输入多少字、最大 20 MB）；后端仍是最终校验。
        anchors:
          - { spec: api, quote: 上传声明 multipart 字段、类型、大小、数量、文件名、校验阶段和安全错误。 }
        enforcement: { kind: review }

  # ───────────────────────────── 工程规范 · 报错管理 ─────────────────────────────
  - key: error_handling
    title_zh: 报错管理
    group: engineering
    prefix: ERRH
    summary_zh: 错误归一成统一结构；按状态码分别处理；路由级与区块级错误边界，局部失败不白屏；全局兜底捕获并脱敏上报；文案说清发生了什么、怎么办；不吞错误；错误码到界面状态的映射只有一份。
    rules:
      - id: ERRH.NORMALIZE
        title_zh: 错误归一成统一结构
        statement_zh: HTTP 客户端把所有失败归一成一个结构：类别（网络、超时、取消、契约、业务、权限……）、稳定错误码、可显示的文案、traceId、是否可重试、字段错误、建议的恢复动作；页面只消费这个结构，不解析原始响应。
        anchors:
          - { spec: api, quote: 将原始错误归一化为稳定 code、trace、fieldErrors、retryable 和 recoverAction。 }
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 统一的错误结构
            code: |-
              interface AppError {
                kind: 'network' | 'timeout' | 'canceled' | 'contract' | 'business' | 'auth' | 'forbidden' | 'not_found' | 'conflict' | 'rate_limited' | 'server'
                code: string
                message: string
                traceId: string | null
                retryable: boolean
                fieldErrors: Record<string, string>
                recover: 'login' | 'retry' | 'reload' | 'resolve_conflict' | 'contact' | null
              }
            lang: ts

      - id: ERRH.MAPPING
        title_zh: 按状态码分别处理
        statement_zh: 401 走静默刷新或去登录；403 显示无权限状态；404 显示资源不存在；409 给冲突解决（重新加载或比较合并）；422 把字段错误挂到字段；429 按 Retry-After 稍后重试；5xx 与网络错误显示可重试的错误；取消不提示。
        anchors:
          - { spec: api, quote: 401、403、404、409、422、429、5xx 和网络错误分别处理。 }
          - { spec: api, quote: 错误码到 UI 状态的映射必须维护在单一事实源 `outputs/frontend/10_planned/api-error-mapping.yaml`，并与契约版本同步。 }
        enforcement: { kind: review }

      - id: ERRH.BOUNDARY
        title_zh: 局部失败不白屏
        statement_zh: 路由级和区块级都有错误边界（onErrorCaptured 组件包住每个独立区块）：一个区块渲染失败只替换这个区块并给重试，页面其余部分照常可用；路由级边界兜住整页。
        anchors:
          - { spec: api, quote: 分层设置错误边界，局部失败不得导致整页白屏。 }
        enforcement: { kind: review }
        showcase:
          - kind: lab
            lab: error.boundary
            title_zh: 实验：区块级错误边界
            description_zh: 让「回款趋势」区块出错：正确做法只有这一块显示错误并能重试；错误做法整页白屏。

      - id: ERRH.GLOBAL
        title_zh: 全局兜底捕获并脱敏上报
        statement_zh: 注册 app.config.errorHandler、window.onerror 与 unhandledrejection，捕获到的错误先过滤敏感字段再上报，带 traceId、版本、路由；兜底只记录和提示，不吞掉错误继续假装正常。
        anchors:
          - { spec: security, quote: MUST 在前端异常捕获（Error Boundary、window.onerror、unhandledrejection）中过滤敏感字段后再上报监控。 }
        enforcement: { kind: review }

      - id: ERRH.MESSAGE
        title_zh: 文案说清发生了什么、怎么办
        statement_zh: 错误文案用用户的话说清发生了什么和下一步（重试、检查网络、联系管理员）；不显示堆栈、内部错误码原文和接口路径；需要反馈时给 traceId 方便复制；同一种错误全站同一句话。
        anchors:
          - { spec: security, quote: MUST 禁止在错误消息、Toast、Modal、URL、日志、监控 payload 中暴露 token、密码、PII、内部 ID。 }
        enforcement: { kind: review }
        examples:
          - kind: dont
            title_zh: 把原始错误抛给用户
            code: |-
              message.error(error.response.data.exception)
            lang: ts
          - kind: do
            title_zh: 说清怎么办
            code: |-
              网络中断，修改已保存在本页。恢复后点「重试」。（问题编号 7f3a-21c9）
            lang: html

      - id: ERRH.NO_SWALLOW
        title_zh: 不吞错误
        statement_zh: catch 之后要么处理并告知用户，要么继续向上抛；不写空 catch，不只 console.log 了事；不用 try/catch 包住整段代码掩盖问题。
        anchors:
          - { spec: api, quote: MUST NOT 吞掉字段错误、冲突或 TraceId。 }
        enforcement: { kind: gate, check: error.no-empty-catch }
        examples:
          - kind: dont
            title_zh: 空 catch
            code: |-
              try { await save() } catch (e) {}
            lang: ts

      - id: ERRH.REPORT
        title_zh: 上报可定位、不刷屏
        statement_zh: 错误上报带版本、环境、页面、操作和 traceId，按去重键合并同类错误并采样；白屏、根组件渲染失败、接口失败率有告警；上报本身失败不影响用户操作。
        anchors:
          - { spec: obs, quote: 采集并分类运行错误、Promise rejection、资源失败、接口错误、白屏和根组件渲染失败 }
        enforcement: { kind: review }

  # ───────────────────────────── 工程规范 · 保护页 ─────────────────────────────
  - key: route_guard
    title_zh: 保护页
    group: engineering
    prefix: GUARD
    summary_zh: 每个路由声明访问要求；守卫集中在路由层；未登录去登录再回来；无权限与不存在有统一的页面；判定完成前不渲染受保护内容；会话过期保住现场；按钮级权限规则统一。
    rules:
      - id: GUARD.DECLARE
        title_zh: 每个路由声明访问要求
        statement_zh: 路由表的 meta 里声明这个页面要求什么：是否登录、权限码、功能开关、布局；没有声明的路由在开发期就报错，不默认放行。
        anchors:
          - { spec: page, quote: 每个页面路由有稳定 name、path、page key、title、权限和布局 meta。 }
        enforcement: { kind: gate, check: guard.route-meta }
        examples:
          - kind: do
            title_zh: 路由声明访问要求
            code: |-
              { path: '/receipts', name: 'receipts', component: () => import('@/pages/receipts/ListPage.vue'), meta: { title: '回款', auth: true, permission: 'receipt:read' } }
            lang: ts

      - id: GUARD.CENTRAL
        title_zh: 守卫集中在路由层
        statement_zh: 访问判定只在全局的 router.beforeEach 里做一次（读 meta 与当前会话、权限），页面组件不各自判断；直接输入地址打开的页面同样经过守卫。
        anchors:
          - { spec: permission, quote: 直达 URL 仍经过页面权限守卫。 }
        enforcement: { kind: review }
        showcase:
          - kind: lab
            lab: guard.route
            title_zh: 实验：保护页与回跳
            description_zh: 以访客、只读成员、管理员身份打开受保护页面：访客去登录并在登录后回到原页面；只读成员看到无权限页；伪造的站外回跳地址被拒绝。

      - id: GUARD.LOGIN_REDIRECT
        title_zh: 未登录去登录再回来
        statement_zh: 未登录访问受保护页面时跳到登录页并带上当前地址作回跳；登录成功后回到原页面；回跳地址只接受站内相对路径（见 SEC.LINKS）；登录页本身不再要求登录。
        enforcement: { kind: review }

      - id: GUARD.FORBIDDEN
        title_zh: 无权限与不存在有统一的页面
        statement_zh: 无权限显示统一的 403 页（说明缺什么权限、找谁申请），资源不存在显示统一的 404 页（给返回列表的入口）；按安全要求，对不该知道存在与否的资源统一显示 404，不泄露它是否存在。
        anchors:
          - { spec: page, quote: 401、403、404、500 和资源删除有统一路由策略。 }
          - { spec: security, quote: MUST 对 401/403/404/409/422/429/5xx 分别处理，避免通过错误差异泄露权限/存在性信息。 }
        enforcement: { kind: review }

      - id: GUARD.NO_FLASH
        title_zh: 判定完成前不渲染受保护内容
        statement_zh: 会话和权限还在确认时显示页面级加载，不先渲染受保护内容再跳走（避免闪现敏感信息）；权限数据随会话一次取回并缓存，路由切换时不重复拉取。
        enforcement: { kind: review }

      - id: GUARD.EXPIRED
        title_zh: 会话过期保住现场
        statement_zh: 停留期间会话过期，下一次请求 401 时先静默刷新一次（见 SESSION.REFRESH）；仍失败就保存现场（路由与未提交的草稿）再去登录，登录后恢复；其他标签页同步处理。
        enforcement: { kind: review }

      - id: GUARD.BUTTON
        title_zh: 按钮级权限规则统一
        statement_zh: 页面内的操作按同一套权限判断：没有权限的操作隐藏，或禁用并说明原因（全项目选一种并写明）；同一个操作在列表、详情、右键菜单里的权限判断一致；后端仍然校验。
        params:
          mode: { decision: 无权限的操作是隐藏，还是禁用并说明原因？, candidates: [隐藏, 禁用并说明原因], label_zh: 无权限操作的呈现 }
        anchors:
          - { spec: permission, quote: SHOULD 对禁用动作展示只读原因。 }
        enforcement: { kind: review }

  # ───────────────────────────── 工程规范 · 页面加载 ─────────────────────────────
  - key: page_loading
    title_zh: 页面加载
    group: engineering
    prefix: PLOAD
    summary_zh: 路由分包并预取；首屏骨架保持布局；先框架后数据、核心优先；异步加载的边界给全加载、出错、超时；分包加载失败能自愈；不跳布局；字体与图片有加载策略。
    rules:
      - id: PLOAD.SPLIT
        title_zh: 路由分包并预取
        statement_zh: 每个路由懒加载成独立分包；导航链接在悬停或进入视口时预取目标路由的分包；首屏只加载当前路由需要的代码。
        anchors:
          - { spec: perf, quote: 路由、图表和重组件按需加载。 }
        enforcement: { kind: gate, check: perf.lazy-load }

      - id: PLOAD.SKELETON
        title_zh: 首屏骨架保持布局
        statement_zh: 首次加载用与真实内容同几何的骨架（同样的行高、列宽、卡片尺寸），不用整页转圈；骨架只覆盖还没到的区块，已经有的内容先显示。
        anchors:
          - { spec: page, quote: 首屏骨架保持主要布局尺寸。 }
        enforcement: { kind: review }

      - id: PLOAD.PROGRESSIVE
        title_zh: 先框架后数据、核心优先
        statement_zh: 页面框架（导航、标题、工具栏）立即出现；核心数据最先请求并渲染；图表、历史、推荐等非核心区块延后加载或进入视口再加载；多个区块的请求并行。
        anchors:
          - { spec: perf, quote: MUST NOT 串行发起可并行的页面初始化请求（须并行或后端聚合）。 }
        enforcement: { kind: review }

      - id: PLOAD.ASYNC_BOUNDARY
        title_zh: 异步边界给全加载、出错、超时
        statement_zh: defineAsyncComponent 一律给 loadingComponent、errorComponent、delay 和 timeout；Suspense 的 fallback 用区块骨架。
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 异步组件写全
            code: |-
              const ReceiptChart = defineAsyncComponent({
                loader: () => import('./ReceiptChart.vue'),
                loadingComponent: ChartSkeleton,
                errorComponent: BlockError,
                delay: 200,
                timeout: 15000,
              })
            lang: ts

      - id: PLOAD.CHUNK_ERROR
        title_zh: 分包加载失败能自愈
        statement_zh: 发布新版本后旧分包不存在（动态 import 失败）时，在 router.onError 里识别分包加载错误，提示「有新版本」并刷新一次到目标地址；同一会话只自动刷新一次，避免循环。
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 分包失败刷新一次
            code: |-
              router.onError((error, to) => {
                if (/Failed to fetch dynamically imported module|Loading chunk/.test(String(error)) && !sessionStorage.getItem('chunk-reload')) {
                  sessionStorage.setItem('chunk-reload', '1')
                  window.location.assign(to.fullPath)
                }
              })
            lang: ts

      - id: PLOAD.NO_SHIFT
        title_zh: 不跳布局
        statement_zh: 图片、广告位、异步区块预留尺寸（宽高或 aspect-ratio）；字体加载不引起明显跳动；新内容插在用户视线下方或由用户触发；累计布局偏移守住性能预算。
        params:
          cls: { value: 0.1, source: SRC.POMASTER.PERF_SPEC, label_zh: CLS（p75） }
        enforcement: { kind: review }

      - id: PLOAD.ASSETS
        title_zh: 字体与图片有加载策略
        statement_zh: "字体用 font-display: swap 并只加载用到的字重；首屏大图预加载，其余图片懒加载（loading=\"lazy\"）并给出响应式尺寸；图标走图标库的按需引入，不加载整套字体图标。"
        enforcement: { kind: review }

  # ───────────────────────────── 工程规范 · 缓存 ─────────────────────────────
  - key: caching
    title_zh: 缓存
    group: engineering
    prefix: CACHE
    summary_zh: 分清每一层缓存的用途；每类数据定新鲜度；先显示旧数据、后台刷新；写后失效；按身份隔离；持久化只存可过期的非敏感数据；静态资源带指纹、入口页不缓存。
    rules:
      - id: CACHE.LAYERS
        title_zh: 分清每一层缓存
        statement_zh: HTTP 缓存管静态资源；查询缓存（TanStack Query）管接口数据；持久化缓存（localStorage、IndexedDB）只管偏好和离线需要的数据；Service Worker 只在明确需要离线时启用。同一份数据不在两层各缓存一份再手动同步。
        anchors:
          - { spec: state, quote: server state 由查询缓存层管理。 }
        enforcement: { kind: review }

      - id: CACHE.FRESHNESS
        title_zh: 每类数据定新鲜度
        statement_zh: 每类查询明确 staleTime：字典、配置这类少变的长，列表、详情短，实时数据不缓存；缓存保留时间（gcTime）默认 5 分钟，按需调整；默认失败重试 3 次（指数退避），写操作不自动重试。
        params:
          gc_time: { value: 5 分钟, source: SRC.TANSTACK.VUE_QUERY, label_zh: 缓存保留（gcTime 缺省） }
          query_retry: { value: 3, unit: count, source: SRC.TANSTACK.VUE_QUERY, label_zh: 查询失败重试（缺省） }
          dict_stale: { value: 1800000, unit: ms, source: SRC.POMASTER.DEFAULTS, label_zh: 字典新鲜度, note_zh: 字典类数据 30 分钟内视为新鲜；字典改动后由写操作主动失效 }
        anchors:
          - { spec: state, quote: 每个缓存声明 key、参数、身份/权限隔离、stale、保留和失效规则。 }
        enforcement: { kind: review }

      - id: CACHE.SWR
        title_zh: 先显示旧数据、后台刷新
        statement_zh: 有缓存时先显示旧数据并标出「更新中」，后台刷新后替换；不在刷新时清空列表造成闪烁；用户正在编辑的数据不被后台刷新覆盖。
        anchors:
          - { spec: state, quote: SHOULD 在后台刷新时保留可用旧数据并标识 stale。 }
        enforcement: { kind: review }
        showcase:
          - kind: lab
            lab: state.query-cache
            title_zh: 实验：查询缓存与失效
            description_zh: 切换筛选看缓存命中；让缓存过期后先显示旧数据再后台刷新；新建一条后对应的 key 失效并重新拉取。

      - id: CACHE.INVALIDATE
        title_zh: 写后失效
        statement_zh: 每个写操作声明它影响哪些查询（失效矩阵），成功后精确失效这些 key；不靠全量刷新页面；乐观更新的回滚和失效配套使用（见 STATE.CACHE_KEYS）。
        anchors:
          - { spec: state, quote: 写操作定义依赖失效矩阵。 }
          - { spec: state, quote: MUST NOT 成功后遗漏缓存刷新。 }
        enforcement: { kind: review }

      - id: CACHE.ISOLATION
        title_zh: 按身份隔离
        statement_zh: 查询 key 与持久化 key 都带用户、租户、数据范围；登出、切换租户、权限收缩时清理对应缓存；不同身份不复用同一份缓存。
        anchors:
          - { spec: state, quote: MUST NOT 多个用户、租户或权限范围复用未隔离的 key、数据库或缓存条目。 }
        enforcement: { kind: review }

      - id: CACHE.PERSIST
        title_zh: 持久化只存可过期的非敏感数据
        statement_zh: 写进浏览器的缓存登记用途、隔离 key、版本、大小和过期时间；读回先校验版本；不持久化接口的敏感数据和凭据；配额不足或写入失败时降级为只在内存里。
        anchors:
          - { spec: state, quote: MUST NOT 无限期持久化草稿、文件、接口响应或敏感偏好。 }
        enforcement: { kind: review }

      - id: CACHE.ASSETS
        title_zh: 静态资源带指纹、入口页不缓存
        statement_zh: 构建产物文件名带内容哈希并长缓存（immutable）；index.html 不缓存或每次校验（no-cache）；Service Worker 的缓存带版本，新版本激活时清理旧缓存。
        anchors:
          - { spec: state, quote: Service Worker 与 Cache API 必须限定作用域、版本化缓存、验证响应来源，并在发布和退出策略中清理过期内容。 }
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 入口页与静态资源的缓存头
            code: |-
              index.html      Cache-Control: no-cache
              /assets/*.js    Cache-Control: public, max-age=31536000, immutable
            lang: html

  # ───────────────────────────── 工程规范 · 异步处理 ─────────────────────────────
  - key: async
    title_zh: 异步处理
    group: engineering
    prefix: ASYNC
    summary_zh: 请求可取消；只认最新一次的结果；无依赖的并行、部分失败要处理；重试只对幂等与可重试错误、指数退避；输入防抖、滚动节流；轮询会暂停会停止；每个 Promise 都有去处。
    rules:
      - id: ASYNC.CANCEL
        title_zh: 请求可取消
        statement_zh: 请求接受 AbortSignal；重新输入、切换筛选、离开页面、组件卸载时取消进行中的请求；vue-query 会把 signal 传给 queryFn，接口层要接住它。
        anchors:
          - { spec: api, quote: 查询可取消和丢弃过期响应。 }
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 把 signal 传下去
            code: |-
              queryFn: ({ signal }) => api.listReceipts(filters, { signal })
            lang: ts

      - id: ASYNC.LATEST
        title_zh: 只认最新一次的结果
        statement_zh: 同一个视图的多次请求，只有最新一次的结果写进界面；写回前核对请求序号和当时的身份、租户、参数，旧的结果丢弃；已取消的请求不提示为错误。
        anchors:
          - { spec: api, quote: 请求结果提交前必须验证身份、租户、权限、参数和请求版本，防止旧上下文结果写回。 }
        enforcement: { kind: review }
        showcase:
          - kind: lab
            lab: state.race
            title_zh: 实验：迟到的响应不写回
            description_zh: 快速输入会发出多个请求，响应乱序到达；只有最新一次的结果写进列表。打开「错误做法」看旧结果覆盖新结果。

      - id: ASYNC.PARALLEL
        title_zh: 无依赖的并行、部分失败要处理
        statement_zh: 彼此无关的请求并行发出；需要全部结果时用 Promise.all，允许部分失败时用 Promise.allSettled 并逐项呈现失败；不在循环里逐个 await 彼此无关的请求。
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 部分失败逐项呈现
            code: |-
              const results = await Promise.allSettled(ids.map((id) => api.archive(id)))
              const failed = results.flatMap((result, index) => (result.status === 'rejected' ? [ids[index]] : []))
            lang: ts

      - id: ASYNC.RETRY
        title_zh: 重试只对幂等与可重试错误
        statement_zh: 只重试读请求和声明了幂等的写请求，且只在错误可重试时（网络错误、超时、5xx、429）；指数退避加随机抖动，有次数上限，服务端给了 Retry-After 就按它等；重试过程可以取消，用户能看到「正在重试」。
        params:
          max_attempts: { value: 3, unit: count, source: SRC.TANSTACK.VUE_QUERY, label_zh: 重试上限, note_zh: 与 TanStack Query 的缺省一致：失败的查询静默重试 3 次 }
          base_delay: { value: 1000, unit: ms, source: SRC.TANSTACK.VUE_QUERY, label_zh: 起始间隔, note_zh: 与 TanStack Query 的缺省退避一致：1 秒起，每次翻倍，上限 30 秒 }
        anchors:
          - { spec: api, quote: 重试必须服从幂等性、服务端 `Retry-After` 或受控退避，并能取消；取消或已被替代的请求不得提示为用户错误。 }
          - { spec: api, quote: MUST NOT 对非幂等 mutation 默认自动重试。 }
        enforcement: { kind: review }
        showcase:
          - kind: lab
            lab: async.retry
            title_zh: 实验：重试与退避
            description_zh: 调用一个时好时坏的接口：正确做法按指数退避重试、在上限内成功或明确失败；对不幂等的提交不自动重试。打开「错误做法」看立即重试把接口打爆。

      - id: ASYNC.DEBOUNCE
        title_zh: 输入防抖、滚动节流
        statement_zh: 随输入触发的查询做防抖；滚动、窗口尺寸变化、拖动这类高频事件做节流或合到动画帧；防抖和节流的间隔全项目统一。
        params:
          debounce: { value: 300, unit: ms, source: SRC.POMASTER.DEFAULTS, label_zh: 防抖间隔, note_zh: 与输入防抖同一取值 }
          throttle: { value: 100, unit: ms, source: SRC.POMASTER.DEFAULTS, label_zh: 节流间隔, note_zh: 滚动、拖拽每 100ms 最多处理一次；跟帧走的动画用 requestAnimationFrame }
        anchors:
          - { spec: perf, quote: 搜索防抖、旧请求取消、过期响应丢弃。 }
        enforcement: { kind: review }

      - id: ASYNC.POLLING
        title_zh: 轮询会暂停会停止
        statement_zh: 后台任务提交后轮询状态：间隔逐步加大，页面隐藏时暂停、回到页面时立即查一次，任务结束或离开页面时停止；能用服务端推送（SSE、WebSocket）就不轮询；同一任务只有一个轮询。
        anchors:
          - { spec: page, quote: 页面隐藏、冻结或进入前进后退缓存时必须暂停无必要轮询和高频工作；恢复时重新验证数据新鲜度、连接状态和权限上下文。 }
        enforcement: { kind: review }

      - id: ASYNC.NO_FLOATING
        title_zh: 每个 Promise 都有去处
        statement_zh: 每个 Promise 要么被 await，要么接上 catch 并处理；异步的事件处理器内部 try/catch，失败走错误处理；不留悬空的 Promise（失败会变成未处理的 rejection）。
        enforcement: { kind: review }
        examples:
          - kind: dont
            title_zh: 悬空的 Promise
            code: |-
              onMounted(() => { loadDashboard() })
            lang: ts
          - kind: do
            title_zh: 失败有去处
            code: |-
              onMounted(() => { loadDashboard().catch(reportAndShow) })
            lang: ts

  # ───────────────────────────── 工程规范 · 高并发 ─────────────────────────────
  - key: concurrency
    title_zh: 高并发
    group: engineering
    prefix: CONC
    summary_zh: 相同的在途请求合并；批量操作有并发上限；多个小请求合成批量接口；收到限流就退避排队；写冲突用版本号；实时推送重连退避、去重保序；高频更新合帧渲染。
    rules:
      - id: CONC.DEDUP
        title_zh: 相同的在途请求合并
        statement_zh: 同一个查询 key 在途时，新的调用复用同一个请求，不重复发；组件各自用同一个查询，由查询缓存层负责合并（TanStack Query 天然按 key 去重）。
        enforcement: { kind: review }
        showcase:
          - kind: lab
            lab: concurrency.pool
            title_zh: 实验：在途合并与并发上限
            description_zh: 三个组件同时要同一份数据：合并成一个请求。批量上传 10 个文件：并发池最多同时 3 个。打开「错误做法」看重复请求和同时发出 10 个请求。

      - id: CONC.LIMIT
        title_zh: 批量操作有并发上限
        statement_zh: 批量上传、批量导入、批量调用接口用并发池，同时进行的数量有上限，并显示整体进度；单项失败可以单独重试；不一次性发出全部请求。
        params:
          pool: { value: 4, unit: count, source: SRC.POMASTER.DEFAULTS, label_zh: 并发上限, note_zh: 浏览器对同一域名的并发连接有限（HTTP/1.1 通常 6 条），批量任务占 4 条，给页面其他请求留余量 }
        anchors:
          - { spec: perf, quote: 请求并发安全。 }
        enforcement: { kind: review }

      - id: CONC.BATCH
        title_zh: 多个小请求合成批量接口
        statement_zh: 要对很多对象做同一件事时调用批量接口，或在同一帧内把多个小请求合成一次；不在循环里逐条请求。
        enforcement: { kind: review }
        examples:
          - kind: dont
            title_zh: 循环里逐条请求
            code: |-
              for (const id of ids) await api.updateStatus(id, 'archived')
            lang: ts
          - kind: do
            title_zh: 批量接口
            code: |-
              await api.batchUpdateStatus({ ids, status: 'archived' })
            lang: ts

      - id: CONC.RATE_LIMIT
        title_zh: 收到限流就退避排队
        statement_zh: 收到 429 时读取 Retry-After，在客户端排队等待后再发，界面提示「请求过多，稍后自动重试」；不立即重发，不让多个组件同时各自重试。
        anchors:
          - { spec: api, quote: 409 返回冲突实体或重新获取方式；429 返回明确退避信息；5xx 不代表所有请求均可重试。 }
        enforcement: { kind: review }

      - id: CONC.VERSION
        title_zh: 写冲突用版本号
        statement_zh: 可编辑的资源带版本号（version、updatedAt 或 ETag），更新时一并提交；后端返回冲突时，给用户重新加载或比较合并的选择，不静默覆盖别人的修改。
        anchors:
          - { spec: api, quote: 可编辑资源返回 version、updatedAt 或 ETag，并在更新命令携带预期版本。 }
        enforcement: { kind: review }

      - id: CONC.REALTIME
        title_zh: 实时推送重连退避、去重保序
        statement_zh: WebSocket / SSE 断线后指数退避重连，重连后补拉断线期间的数据；消息按 messageId 去重、按序号保序；收到的消息先合并再渲染，不逐条触发整页更新。
        anchors:
          - { spec: api, quote: 必须定义鉴权、心跳、断线重连、重复、乱序、丢失、回放、完成终止和降级行为。 }
        enforcement: { kind: review }

      - id: CONC.RENDER
        title_zh: 高频更新合帧渲染
        statement_zh: 行情、日志、进度这类高频数据先进缓冲区，按动画帧（requestAnimationFrame）或固定间隔批量刷新界面；长列表虚拟化；不为每条消息触发一次状态更新。
        enforcement: { kind: review }

  # ───────────────────────────── 工程规范 · 防重复点击 ─────────────────────────────
  - key: click_guard
    title_zh: 防重复点击
    group: engineering
    prefix: CLICK
    summary_zh: 提交中锁住并显示加载；创建类写请求带幂等键；回车与按钮共用一把锁；刷新、点赞这类按钮节流或合并；重复导航不重复入栈；锁定期间有反馈；按钮锁只是体验，后端仍要幂等。
    rules:
      - id: CLICK.LOCK
        title_zh: 提交中锁住并显示加载
        statement_zh: 点击提交后按钮立即进入 loading（a-button 的 loading 属性）并拒绝再次触发，请求结束（成功或失败）后解锁；锁放在提交函数里，不只靠按钮的禁用样式。
        anchors:
          - { spec: page, quote: 提交防重复并保留失败输入。 }
        enforcement: { kind: review }
        examples:
          - kind: do
            title_zh: 锁在提交函数里
            code: |-
              const submitting = ref(false)
              async function submit() {
                if (submitting.value) return
                submitting.value = true
                try { await api.createOrder(form, { idempotencyKey }) } finally { submitting.value = false }
              }
            lang: ts
        showcase:
          - kind: lab
            lab: click.guard
            title_zh: 实验：防重复点击
            description_zh: 连点「提交订单」五次：正确做法只发出一个请求，并且带同一个幂等键；错误做法发出五个请求、创建五张订单。

      - id: CLICK.IDEMPOTENCY
        title_zh: 创建类写请求带幂等键
        statement_zh: 创建订单、提交审批、发起支付这类写请求在表单打开时生成一个幂等键，提交和重试都复用它，成功后换新键；按钮锁只是体验保护，重复请求由后端按幂等键识别。
        params:
          header: { value: Idempotency-Key, source: SRC.IETF.IDEMPOTENCY_KEY, label_zh: 幂等键请求头 }
        anchors:
          - { spec: api, quote: 前端按钮禁用和 loading 只是体验保护，不构成业务幂等。 }
          - { spec: api, quote: MUST NOT 用按钮 loading 代替后端幂等。 }
        enforcement: { kind: review }

      - id: CLICK.ONE_PATH
        title_zh: 回车与按钮共用一把锁
        statement_zh: 表单的回车提交、按钮点击、快捷键都走同一个提交函数、共用同一把锁；不在两个地方各写一份提交逻辑。
        enforcement: { kind: review }

      - id: CLICK.THROTTLE
        title_zh: 刷新、点赞这类按钮节流或合并
        statement_zh: 刷新、点赞、收藏、切换这类可以重复触发的操作：刷新按钮在请求进行中不再发新的；点赞收藏先乐观改状态，连续点击只发最后一次的结果（防抖合并）。
        enforcement: { kind: review }

      - id: CLICK.NAVIGATION
        title_zh: 重复导航不重复入栈
        statement_zh: 连续点击同一个导航入口不重复压入历史记录、不重复打开同一个详情抽屉或新窗口；打开新窗口的操作在窗口打开前锁住。
        enforcement: { kind: review }

      - id: CLICK.FEEDBACK
        title_zh: 锁定期间有反馈
        statement_zh: 锁定期间按钮显示加载、文字说明正在做什么（「提交中…」），不静默吞掉点击；超过 1 秒还没结束的给出更明确的进度（见 SFB.PROGRESS）。
        enforcement: { kind: review }

  # ───────────────────────────── 工程规范 · 原型转换 ─────────────────────────────
  - key: prototype_intake
    title_zh: 原型转换
    group: engineering
    prefix: PROTO
    summary_zh: BA 交来的 spec 与 HTML 原型拆成四层：业务事实、信息结构、交互意图原样保留，表现全部丢掉；表现里藏着的事实翻译成语义；冲突进提问；按规范重绘后用同一个抽取器做事实对账。
    rules:
      - id: PROTO.LAYERS
        title_zh: 拆成四层，只丢表现
        statement_zh: 原型按四层读：业务事实（字段、操作、状态、有业务含义的文案）原样保留；信息结构（页面、区域、分组、顺序、主次）保留关系；交互意图（点什么打开什么、提交前校验、删除要确认）保留意图；表现（样式、栅格、间距、字体、组件长相）全部丢掉，由规范重新给出。不同 BA 写的原型结构与风格各不相同，读的是这四层，不是某一种写法。
        enforcement: { kind: review }
        showcase:
          - kind: specimen
            title_zh: 哪些保留、哪些丢掉
            description_zh: 判定口径：换一套 UI 以后，业务方会不会说「这不是我要的」——会，就是事实；不会，就是表现。
            name_label_zh: 原型里的内容
            rows:
              - name: 字段：标签、类型、必填、枚举值、校验、默认值、格式、能否编辑
                usage_zh: 业务事实 · 原样保留
                sample_zh: 保留
              - name: 操作：按钮与链接的文字、要求的权限、前置条件、是否二次确认
                usage_zh: 业务事实 · 原样保留
                sample_zh: 保留
              - name: 状态值与流转、有业务含义的文案（提示条、错误、空状态说明）
                usage_zh: 业务事实 · 原样保留
                sample_zh: 保留
              - name: 页面清单与页面类型、区域、字段分组与先后顺序、主次
                usage_zh: 信息结构 · 保留关系
                sample_zh: 保留关系
              - name: 页面之间与区域之间的跳转：点行开详情、新增开弹窗、返回
                usage_zh: 交互意图 · 保留意图
                sample_zh: 保留意图
              - name: class、内联样式、颜色、字体、字号、间距、圆角、阴影
                usage_zh: 表现 · 全部丢掉，改用规范 token
                sample_zh: 丢掉
              - name: 栅格列数、像素宽度、组件库与组件长相、图标库
                usage_zh: 表现 · 全部丢掉，改用规范组件
                sample_zh: 丢掉
              - name: 红字表示逾期、星号表示必填、删除线表示作废、右对齐表示金额
                usage_zh: 表现里藏着的事实 · 翻译成语义再保留
                sample_zh: 翻译

      - id: PROTO.EXTRACT
        title_zh: 去表现化抽取
        statement_zh: 用 pomaster prototype ingest 读原型：JS 渲染的页面先在浏览器里渲染再读（表格行、弹窗内容常常是脚本生成的）；隐藏的弹窗、抽屉也读，标为条件区域；丢掉 class、style、纯布局的包裹层，只留标题层级、地标、区域、字段、操作、表格（表头与示例行）、标签页、提示文字和状态值；每条事实带出处（文件、节点路径、文本指纹）。
        enforcement: { kind: review }
        showcase:
          - kind: lab
            lab: prototype.convert
            title_zh: 实验：原型转换与事实对账
            description_zh: 左边是一份样式很乱的原型片段；点「抽取」得到去掉表现后的大纲与事实清单；「对账」把按规范重绘的版本再抽一次，逐条比较。打开「错误做法」看重绘时漏掉一个字段、改掉一个选项后对账报出的差异。

      - id: PROTO.TRANSLATE
        title_zh: 表现里藏着的事实翻译成语义
        statement_zh: 表现里带业务含义的部分翻译成语义再保留，不照抄样子：标签旁的星号 → 必填；红色或绿色的状态文字 → 状态值与它的语气（危险、成功）；删除线 → 作废或删除状态；右对齐的数字列 → 数值列与格式；初始禁用的按钮 → 启用条件（要选中行才能用）；垃圾桶图标 → 删除意图；固定在左右的列 → 冻结列。颜色值、像素、字体名一律不带进实现。
        enforcement: { kind: review }

      - id: PROTO.SPEC_FACTS
        title_zh: spec 里读业务规则
        statement_zh: spec 按结构读而不是按格式读：字段表（中文名、英文名、类型、必填、编辑权限、枚举）、SHALL / MUST / 必须 一类规则句、枚举与默认值、状态流转、交互说明表、权限与角色表；每条带章节出处。读不出结构的段落原文保留为待确认的说明，不猜。
        enforcement: { kind: review }

      - id: PROTO.CONFLICTS
        title_zh: 冲突进提问，不自己挑
        statement_zh: spec 与 HTML 不一致（必填、枚举、字段有无）、原型与本规范冲突（例如原型每页 1000 条而规范上限 200 条）、原型里有 spec 没写的操作，都进 Question Gate 由人裁决；在裁决之前的默认口径：业务规则以 spec 为准，信息结构以 HTML 为准，呈现以本规范为准，并把这个默认写进提问里。
        enforcement: { kind: review }

      - id: PROTO.MAP
        title_zh: 映射到规范，记下依据
        statement_zh: 页面类型映射到规范的页面模板（列表、详情、表单、看板、向导），区域映射到规范的模式（筛选条、数据列表、描述列表、抽屉、分步表单……），元素映射到规范组件；每个映射在 UX 中间表示里记下依据的规则编号，后来的人和 agent 能复查。
        enforcement: { kind: review }

      - id: PROTO.REBUILD
        title_zh: 按规范重绘
        statement_zh: 重绘时布局、间距、字号、颜色、组件全部来自本规范的 token 与组件；不复制原型的 class、内联样式、字体、颜色值、栅格列数和像素宽度；原型里的分组、顺序、主次和文案保留。原型用了另一套组件库或 CDN 引入的样式框架，实现里都不出现。
        enforcement: { kind: gate, check: style.no-raw-color }

      - id: PROTO.VERIFY
        title_zh: 用同一个抽取器做事实对账
        statement_zh: 重绘完成后，用同一个抽取器读重绘后的页面，与事实清单逐条比较：缺失、改动、新增都为零（确需新增的事实走提问记录），同时规范门禁通过，才算转换完成；对账结果作为 verify 的证据。
        enforcement: { kind: review }
