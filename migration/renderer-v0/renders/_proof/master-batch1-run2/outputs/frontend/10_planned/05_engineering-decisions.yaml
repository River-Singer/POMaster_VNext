    {
      "decision": "确立四条架构硬规则，前三条可被扫描器验证，第四条必须靠评审因为扫描器在此处静默放过：(1) 用户可见文案只写在渲染它的叶 .vue 的 <template> 里，作为原生节点文本或 title/placeholder/aria-* 属性，父组件只传 v-if/v-model/@event/class/ref，禁止用 props 传文案、禁止用插槽传内容；(2) element-plus / ag-grid 等高风险供应商只在 src/shared/<adapter_dir>/*.ts 中 import 并命令式挂载，业务页面引用项目封装组件（与 scan_unauthorized_vendor_usage.py 的 adapter_dir 分层一致）；(3) 禁止 <component :is>、v-html、跨 SFC 插槽内容；(4) 【最易被忽略】任何用户可见文案都不得住在 .ts/.js 里，也不得住在 .vue 的 <script setup> 常量里——实测两者都完全逃逸内容真相扫描（见 EV_TS_TEXT_ESCAPE），门禁会给绿灯而文案不可追溯。宽表列头（AG Grid headerName）、空态模板、导出文件名是最高危场景：它们天然想写在配置对象里，而配置对象天然在 .ts 里。列头须由 .vue 模板渲染或由适配层从 .vue 传入的、来源于模板的文案数组驱动；规则 (4) 的违反只能靠 code review 与本条决策拦截。实现期每个切片提交前跑 scan_ui_content_truth.py 自检，并同时人工核对 content_count 是否覆盖该页全部可见文案——只看 ok=true 不足以判定通过。供应区一字节不改。",
      "decision_dimension": "assessment:FTA-ENG-CONTENT-TRUTH-ARCHITECTURE",
      "id": "FTA-ENG-CONTENT-TRUTH-ARCHITECTURE",
