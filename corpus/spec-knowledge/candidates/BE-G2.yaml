# ============ 文件 1/6: backend/10-security-protocol.md (sha256 56387f03...) ============

- proposed_id: POLICY.SEC.TRUST_BOUNDARY_ENFORCEMENT
  source_section: MUST
  source_protocol: .trellis/spec/backend/10-security-protocol.md
  source_lines: L25
  source_sha256: 56387f03edd35df50a5a701f4daab174b744d490663393f43331cf5401149f67
  classification: UNIVERSAL_POLICY
  sort: UNIVERSAL
  kind_proposal: policy
  enforcement: required_when_applicable
  vocab_pr_needed: true
  statement_zh: 数据或调用每次从较低信任域进入较高权限域时，必须由服务端一侧完成四项动作——输入校验、最小权限授予、默认拒绝（fail-closed）与审计留痕——任何一项不可省略。
  statement_en_keywords: trust boundary, server-side validation, least privilege, fail-closed, audit trail
  clean_room: true
  applies_when: {lane: backend, condition: 任何跨信任域的数据流或调用入口}
  cross_refs: [POLICY.WEB.API.TRUSTED_ENDPOINT_SOURCE]
  notes: 与 FE 侧 TRUSTED_ENDPOINT_SOURCE 同属信任纪律族但层向不同（入口校验 vs 请求构造），互引不合并

- proposed_id: POLICY.SEC.NO_CLIENT_SIDE_TRUST
  source_section: MUST NOT
  source_protocol: .trellis/spec/backend/10-security-protocol.md
  source_lines: L29
  source_sha256: 56387f03edd35df50a5a701f4daab174b744d490663393f43331cf5401149f67
  classification: UNIVERSAL_POLICY
  sort: UNIVERSAL
  kind_proposal: policy
  enforcement: required_when_applicable
  vocab_pr_needed: true
  statement_zh: 客户端侧的任何信号——隐藏字段、前端校验结论、代理附加头、调用方自述的资源归属——一律不得作为服务端授权判定或数据归属认定的依据。
  statement_en_keywords: no client-side trust, hidden fields, proxy headers, self-declared ownership
  clean_room: true
  applies_when: {lane: backend, condition: 服务端处理任何携带客户端来源信息的请求}
  cross_refs: [POLICY.SEC.TRUST_BOUNDARY_ENFORCEMENT]
  notes: 独立成卡（BE12 先例 NO_INFORMAL_CONTRACT）：本条枚举了正本未列的四类不可信向量，非单纯极性反转

