# =============================================================================
# POMaster_VNext 外部参照站点索引（External Sites Index · P-v06 收尾批次）
#
# 定位：AI 开发时的「眼睛」外部参照取用面——按 domain/theme 检索站点 → 用
# WebSearch / chrome-devtools MCP（观测诊断面）或 playwright MCP 抓取核实，
# 禁止凭训练数据推测（Owner 纪律：外部专有名词必须联网核实）。
#
# 数据源：任务 09-02-vnext-prd-v06-governed-substrate 的 research/ 四份核实报告
# （external-design-references / frontend-state-references / backend-references /
# runtime-references）的站点穷举——每条 site 必带 verified 实抓日期 + source_research
# 归属；页级 URL 收在 pages（双向钉守卫：
# tests/integration/external-sites-index.spec.ts——index 里的 URL 必须真实出现在
# research 文件中、research 文件里的 URL 必须被 index 覆盖，防手补假条目）。
#
# 时效纪律：所有 verified 均为单时点实抓（2026-09-02/03），页面内容可能随后变动；
# 后续取用应重新核实并更新 verified 日期，不沿用陈旧锚冒充新事实。
# =============================================================================

