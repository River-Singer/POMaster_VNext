candidates:
  # --- 文件 1: code-reuse-thinking-guide.md ---
  - candidate_id: "POLICY.REUSE.SEARCH_BEFORE_CREATE"
    source: design_seed
    evidence: PLANNED
    source_file: ".trellis/spec/guides/code-reuse-thinking-guide.md"
    source_lines: "L3, L20-38, L100-105"
    source_section: "The Problem + Before Writing New Code + Checklist Before Commit"
    kind_proposal: policy
    classification_suggestion: UNIVERSAL_POLICY
    scope_sort: UNIVERSAL
    applies_when: { lane: any, condition: "准备编写任何新函数/组件/工具时" }
    enforcement: advisory
    vocab_pr_needed: true
    statement_zh: "新建任何函数、组件或工具之前必须先检索既有实现：已有相似能力则复用或扩展，已有既定模式则沿用该模式；一旦发现自己正在跨文件复制代码即停止动作，改为提取到共享位置后再引用。"
    statement_en_keywords: ["search before create", "reuse or extend existing", "follow established pattern", "stop on cross-file copy", "extract to shared"]
    clean_room: { independent_wording: true, note: "statement_zh 为独立改写，语义等价、词形独立，零逐字拷贝源文本" }
    uncertainty: "源文对跨文件复制用强禁令语气（STOP），是否升 required_when_applicable 交 Owner 裁决"
    notes: "与 KNOWLEDGE.FP.API.PER_PAGE_HTTP_CLIENT（请求层重复实例失败模式）互为政策/症候对，建议互引"

  - candidate_id: "POLICY.REUSE.CONSTANT_SINGLE_DEFINITION"
    source: design_seed
    evidence: PLANNED
    source_file: ".trellis/spec/guides/code-reuse-thinking-guide.md"
    source_lines: "L41-45, L55-59, L104"
    source_section: "Common Duplication Patterns / Pattern 3 Repeated Constants"
    kind_proposal: policy
    classification_suggestion: UNIVERSAL_POLICY
    scope_sort: UNIVERSAL
    applies_when: { lane: any, condition: "定义常量或发现重复字面常量时" }
    enforcement: advisory
    vocab_pr_needed: true
    statement_zh: "同一常量全库只允许一个定义点，其余位置一律引用该定义；禁止在多个文件重复书写相同字面常量。"
    statement_en_keywords: ["single definition point", "no duplicated literal constants", "import instead of redeclare"]
    clean_room: { independent_wording: true, note: "statement_zh 为独立改写，语义等价、词形独立，零逐字拷贝源文本" }
    notes: "与 POLICY.WEB.API.SINGLE_HTTP_CLIENT 主题相邻但对象不同（字面常量 vs 传输设施单点），非重复"

  - candidate_id: "POLICY.REUSE.ABSTRACTION_THRESHOLD"
    source: design_seed
    evidence: PLANNED
    source_file: ".trellis/spec/guides/code-reuse-thinking-guide.md"
    source_lines: "L63-74"
    source_section: "When to Abstract"
    kind_proposal: policy
    classification_suggestion: UNIVERSAL_POLICY
    scope_sort: UNIVERSAL
    applies_when: { lane: any, condition: "决定是否把重复代码提取为共享抽象时" }
    enforcement: advisory
    vocab_pr_needed: true
    statement_zh: "提取共享的时机判据：同一段代码出现三次及以上、逻辑复杂到可能藏有缺陷、或预计多方需要时才值得抽象；仅单处使用、一行量级、或抽象本身比重复更复杂的场景应保留重复，不为抽象而抽象。"
    statement_en_keywords: ["abstraction threshold", "rule of three", "do not over-abstract", "complexity vs duplication tradeoff"]
    clean_room: { independent_wording: true, note: "statement_zh 为独立改写，语义等价、词形独立，零逐字拷贝源文本" }
    uncertainty: "「三次」阈值为源文经验参数，可声明由项目基线覆写"

  - candidate_id: "POLICY.REUSE.POST_BATCH_COMPLETENESS_SWEEP"
    source: design_seed
    evidence: PLANNED
    source_file: ".trellis/spec/guides/code-reuse-thinking-guide.md"
    source_lines: "L77-84"
    source_section: "After Batch Modifications"
    kind_proposal: policy
    classification_suggestion: UNIVERSAL_POLICY
    scope_sort: UNIVERSAL
    applies_when: { lane: any, condition: "对多个文件完成同构修改后" }
    enforcement: advisory
    vocab_pr_needed: true
    statement_zh: "对多个文件完成同构修改后必须做完整性复核：逐处确认同类实例无遗漏，用检索工具复查一遍，并评估该重复模式是否已达到提取共享的时机。"
    statement_en_keywords: ["post-batch completeness sweep", "grep for missed instances", "reassess abstraction timing"]
    clean_room: { independent_wording: true, note: "statement_zh 为独立改写，语义等价、词形独立，零逐字拷贝源文本" }
