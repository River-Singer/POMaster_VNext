                label_zh: 紫
                swatches:
                  - { name: purple-100, pending_zh: 未公开 }
                  - { name: purple-200, pending_zh: 未公开 }
                  - { name: purple-300, pending_zh: 未公开 }
                  - { name: purple-400, pending_zh: 未公开 }
                  - { name: purple-500, pending_zh: 未公开 }
