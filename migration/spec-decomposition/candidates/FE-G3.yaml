        applies_when: {lane: frontend, condition: "MASTer 表格多语言"}
        enforcement: required_when_applicable
        source: {file: .trellis/spec/frontend/30-data-grid-protocol.md, lines: "107"}
        clean_room: true
        uncertainty: "依赖引擎「initial-only option」行为，引擎版本升级需复核"

      - proposed_id: PROJECT.GRID.CELL_STATE_AND_FOCUS_MODEL
        triage: PROJECT
        kind_proposal: policy
        classification_proposal: PROJECT_BASELINE_TEMPLATE
        statement_zh: "MASTer 单元格状态模型：交互状态经 cellClass 回调动态计算并区分复选框/数值公式/只读/可编辑四类（禁行级单一 class 覆盖）；行选中仅由复选框点击或表头全选触发（适配器必须抑制点击行选中）；引擎默认焦点边框必须全局抹除，焦点描边以 inset 阴影统一三态宽度，不可编辑单元格 focus 时显示同制焦点环作为键盘可见性补偿；描边优先级为 editing > dirty > focus > hover（经选择器特异性与声明顺序实现，禁单一 important 规则顺序依赖）；行内编辑输入框背景必须透明以不遮挡描边。"
        statement_en_keywords: "cellClass state model, checkbox-only row selection, inset focus ring, state priority order, transparent edit input"
        applies_when: {lane: frontend, condition: "MASTer 可编辑表格状态呈现"}
        enforcement: required_when_applicable
        source: {file: .trellis/spec/frontend/30-data-grid-protocol.md, lines: "117-123"}
