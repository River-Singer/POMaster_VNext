        kind_proposal: policy
        classification_proposal: PROJECT_BASELINE_TEMPLATE
        statement_zh: "MASTer 单元格垂直居中统一机制：cell 级 flex 居中，全部非复选框列挂统一 CellRenderer 以 block wrapper 承接水平对齐继承（裸文本在 flex 下会成为匿名 item 致对齐静默失效）；禁 inline 级 wrapper 配高度撑满（原子内联盒 strut 致系统性基线偏移，验收为内容中心与单元格中心差值不超过 1-2px）；slot wrapper 必须显式恢复换行与正常行高（行高 0 仅限 wrapper 自身），多行文本须提供元素级根；业务页禁止在 slot 内自建第二套居中机制。"
        statement_en_keywords: "cell-level flex centering, unified cell renderer, inline-box strut offset, line-height discipline"
        applies_when: {lane: frontend, condition: "MASTer 单元格内容布局"}
        enforcement: required_when_applicable
        source: {file: .trellis/spec/frontend/30-data-grid-protocol.md, lines: "127-129"}
        clean_room: true

      - proposed_id: PROJECT.GRID.FLEX_PINNED_MUTUAL_EXCLUSION
        triage: PROJECT
        kind_proposal: policy
        classification_proposal: PROJECT_BASELINE_TEMPLATE
        statement_zh: "MASTer 列宽弹性纪律：列总宽不足容器时必须由明确弹性策略吸收剩余宽度（主数据列声明 flex 份额，width 兼作下限），禁止依赖引擎对未声明列的默认分配；参与弹性分配的列不得 pinned（引擎弹性分配仅发生在中央视口，pinned 列 flex 无效）——冻结与弹性二选一：钉住列给稳定定宽，吸收剩余宽的列留在中央区。"
        statement_en_keywords: "explicit flex strategy, flex-pinned mutual exclusion, center-viewport-only distribution"
        applies_when: {lane: frontend, condition: "MASTer 列宽弹性设计"}
        enforcement: required_when_applicable
        source: {file: .trellis/spec/frontend/30-data-grid-protocol.md, lines: "133-135"}
        clean_room: true
        uncertainty: "成因依赖引擎弹性分配的作用域行为，引擎版本升级需复核"

      - proposed_id: PROJECT.GRID.SINGLE_ENGINE_ADAPTER
        triage: PROJECT
        kind_proposal: policy
        classification_proposal: PROJECT_BASELINE_TEMPLATE
        statement_zh: "MASTer 全部表格必须使用项目统一网格适配器，禁止引入第二种表格引擎实现（含组件库表格与原生表格）；使用集成版社区包时禁止手动调用模块注册（两套模块系统冲突），禁止在组件卸载钩子手动调用已由框架托管销毁的实例销毁方法。以上禁止项已由本地 ESLint 规则自动拦截（no-el-table / no-direct-ag-grid-import / no-ag-grid-module-registration / no-ag-grid-manual-destroy，lint 硬失败）。"
        statement_en_keywords: "single engine adapter, no second grid implementation, no manual module registration, no manual destroy, ESLint enforcement"
        applies_when: {lane: frontend, condition: "MASTer 任何表格实现"}
        enforcement: required_when_applicable
        source: {file: .trellis/spec/frontend/30-data-grid-protocol.md, lines: "156-158, 164, 214-249"}
        clean_room: true

      - proposed_id: KNOWLEDGE.FP.GRID.PAGE_LOCAL_COLUMN_FORK
        triage: UNIVERSAL
        kind_proposal: failure_pattern
        classification_proposal: FAILURE_PATTERN
        statement_zh: "失败模式：业务页面直接引用网格引擎手写列数组并跨页面复制粘贴，列定义逐渐分叉失控。"
        statement_en_keywords: "failure pattern, page-local engine columns, copy-paste fork"
        applies_when: {lane: frontend, condition: "表格实现评审"}
        enforcement: advisory
        source: {file: .trellis/spec/frontend/30-data-grid-protocol.md, lines: "204"}
        clean_room: true

      - proposed_id: KNOWLEDGE.FP.GRID.ENGINE_LIFECYCLE_MISUSE
        triage: PROJECT
        kind_proposal: failure_pattern
        classification_proposal: FAILURE_PATTERN
        statement_zh: "失败模式（引擎集成）：页面同时维护两套表格实现致重复修复；集成版包再手动注册模块致两套模块系统冲突与体积异常；组件卸载钩子手动销毁已托管实例致对已销毁实例调用报错。三者同属绕开统一适配器契约的引擎生命周期误用。"
        statement_en_keywords: "failure pattern, dual implementations, manual module registration, manual destroy on managed instance"
        applies_when: {lane: frontend, condition: "引擎集成评审"}
        enforcement: advisory
        source: {file: .trellis/spec/frontend/30-data-grid-protocol.md, lines: "210-268"}
        clean_room: true

      - proposed_id: KNOWLEDGE.FP.GRID.BLANK_GRID_DIAGNOSTICS
        triage: PROJECT
        kind_proposal: failure_pattern
        classification_proposal: FAILURE_PATTERN
        statement_zh: "失败模式（空白表格）：宿主元素未撑满父容器致渲染于零高区域；数据为空或容器无确定高度时渲染为 0 高；隐藏面板中挂载的实例不执行布局测量也不处理后续数据更新（开发态热替换掩盖缺陷，整页加载即复现；同页行标识重复告警与此同源）。配套五级判断树（数据模型→DOM 行→根容器高→视口高→样式遮罩）与诊断取值函数。"
        statement_en_keywords: "failure pattern, blank grid, zero-height host, hidden pane no-layout, five-level decision tree, diagnostic function"
        applies_when: {lane: frontend, condition: "表格空白问题排查"}
        enforcement: advisory
        source: {file: .trellis/spec/frontend/30-data-grid-protocol.md, lines: "270-367"}
        clean_room: true
        notes: "内嵌通用教训：验收不得以开发态热替换后的表现为通过证据（该子句已在 POLICY.WEB.GRID.EMPTY_STATE_MOUNT_DISCIPLINE 以通用措辞承载）"

      - proposed_id: KNOWLEDGE.FP.GRID.DEEP_WATCH_SELF_WRITE
        triage: UNIVERSAL
        kind_proposal: failure_pattern
        classification_proposal: FAILURE_PATTERN
        statement_zh: "失败模式：对响应式行数据启用深度侦听后在回调中写回该对象的属性，写操作再次触发同一侦听形成无限递归，页面卡死。内部派生状态必须写入组件内部非入参引用，或在状态回调中经只读判断实时计算，不得在侦听回调中回写被监听对象。"
        statement_en_keywords: "failure pattern, deep watch self-write infinite recursion, derived state into internal refs"
        applies_when: {lane: frontend, condition: "响应式数据侦听实现"}
        enforcement: advisory
        source: {file: .trellis/spec/frontend/30-data-grid-protocol.md, lines: "369-373"}
        clean_room: true
        notes: "语句已去框架专名化（深度侦听/响应式为通用概念），跨项目可复用"

      - proposed_id: KNOWLEDGE.FP.GRID.RAW_ROW_REACTIVITY_BREAK
        triage: PROJECT
        kind_proposal: failure_pattern
        classification_proposal: FAILURE_PATTERN
        statement_zh: "失败模式（适配器原始行对象断裂响应）：网格适配器在挂载与数据变更通道对传入行数据执行去代理化处理后才交给引擎，字段级直写不经页面引用的代理，页面派生计算收不到通知（数组级变更仍触发）。正确做法：页面持有修订版本号并在派生计算中显式声明依赖，全部原始写路径统一递增版本号；版本号只补触发，禁止复制数据当第二事实源；禁止在变更事件里把变更行回写响应式数组元素（触发适配器全量刷新破坏编辑态与焦点）。"
        statement_en_keywords: "failure pattern, raw row object proxy break, revision counter dependency, no second source of truth"
        applies_when: {lane: frontend, condition: "网格编辑与页面派生计算联动"}
        enforcement: advisory
        source: {file: .trellis/spec/frontend/30-data-grid-protocol.md, lines: "375-379"}
        clean_room: true
        uncertainty: "成因依赖适配器去代理化实现细节，适配器重构需复核"

