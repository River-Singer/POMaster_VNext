areas:
  # ───────────────────────────── 基础 · 色彩 ─────────────────────────────
  - key: color
    title_zh: 色彩
    group: foundations
    prefix: COLOR
    summary_zh: 默认单色；每个色阶 10 档、每档用途固定；主操作用最深的灰，彩色只表达状态；颜色只经主题变量取，不用装饰性效果。
    rules:
      - id: COLOR.PALETTE
        title_zh: 色板
        statement_zh: 色彩体系共 10 个色阶：背景、灰、透明灰、蓝、红、琥珀、绿、青、紫、粉。除背景外每个色阶 10 档，100 到 1000 的用途固定：1–3 档是组件背景（默认、悬停、按下），4–6 档是边框（默认、悬停、按下），7–8 档是高对比背景，9–10 档是文字与图标。
        params:
          steps: { value: 10, unit: count, source: SRC.GEIST.COLORS, label_zh: 每个色阶的档数 }
        enforcement: { kind: review }
        showcase:
          - kind: palette
            title_zh: 背景与灰阶
            description_zh: 每个色阶 10 档，100 到 1000 各有固定用途（见灰阶的用途标注）。这里显示浅色主题的值。
            source: SRC.VERCEL.BRAND_CSS
            scales:
              - name: background
                label_zh: 背景
                swatches:
                  - { name: background-100, value: "oklch(1 0 0)", usage_zh: 默认背景 }
                  - { name: background-200, value: "oklch(0.984 0 0)", usage_zh: 次级背景（少用） }
              - name: gray
                label_zh: 灰
                swatches:
                  - { name: gray-100, value: "oklch(0.961 0 0)", usage_zh: 默认背景 }
                  - { name: gray-200, value: "oklch(0.94 0 0)", usage_zh: 悬停背景 }
                  - { name: gray-300, value: "oklch(0.925 0 0)", usage_zh: 按下背景 }
                  - { name: gray-400, value: "oklch(0.937 0 0)", usage_zh: 默认边框 }
                  - { name: gray-500, value: "oklch(0.836 0 0)", usage_zh: 悬停边框 }
                  - { name: gray-600, value: "oklch(0.732 0 0)", usage_zh: 按下边框 }
                  - { name: gray-700, value: "oklch(0.65 0 0)", usage_zh: 高对比背景 }
                  - { name: gray-800, value: "oklch(0.59 0 0)", usage_zh: 悬停高对比背景 }
                  - { name: gray-900, value: "oklch(0.42 0 0)", usage_zh: 次要文字与图标 }
                  - { name: gray-1000, value: "oklch(0.205 0 0)", usage_zh: 主要文字与图标 }
              - name: gray-alpha
                label_zh: 灰（透明）
                swatches:
                  - { name: gray-alpha-100, value: "oklch(0 0 0 / 0.05)" }
                  - { name: gray-alpha-200, value: "oklch(0 0 0 / 0.081)" }
                  - { name: gray-alpha-300, value: "oklch(0 0 0 / 0.1)" }
                  - { name: gray-alpha-400, value: "oklch(0 0 0 / 0.08)" }
                  - { name: gray-alpha-500, value: "oklch(0 0 0 / 0.21)" }
                  - { name: gray-alpha-600, value: "oklch(0 0 0 / 0.24)" }
                  - { name: gray-alpha-700, value: "oklch(0 0 0 / 0.44)" }
                  - { name: gray-alpha-800, value: "oklch(0 0 0 / 0.51)" }
                  - { name: gray-alpha-900, value: "oklch(0 0 0 / 0.7)" }
                  - { name: gray-alpha-1000, value: "oklch(0 0 0 / 0.91)" }
          - kind: palette
            title_zh: 彩色色阶
            description_zh: 彩色色阶同样按 100 到 1000 分档。官方样式表只公开了部分档位，其余标为未公开，拿到完整色值后回填。
            source: SRC.VERCEL.BRAND_CSS
            scales:
              - name: blue
                label_zh: 蓝
                swatches:
                  - { name: blue-100, value: "oklch(97.32% 0.0141 251.56)" }
                  - { name: blue-200, pending_zh: 未公开 }
                  - { name: blue-300, pending_zh: 未公开 }
