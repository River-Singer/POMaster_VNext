        statement_zh: "MASTer 复选框选择列为纯选择列：固定宽度且不可调整，不走普通列测宽算法；经专属 class 去除单元格 padding 与控件外边距、隐藏无业务意义的内部容器、以 flex 居中，表头全选与数据行复选框水平中心严格对齐（差值不超过 1px）；覆盖仅作用于复选框列。"
