  applies_when: { lane: any, condition: 引入或变更任一技术栈层时 }
  enforcement: required_when_applicable
  clean_room: true
  source: { protocol: .trellis/spec/backend/stacks/java/java-language-overlay.md, lines: "L19", sha256: 38b592a5beaa899abb45e871e5097cafedeea80502baee00bcfbfcfa313dab85 }
