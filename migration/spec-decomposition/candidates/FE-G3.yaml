files:

  - file: .trellis/spec/frontend/18-state-management-protocol.md
    sha256: 9f14bed4cea91c06c4dca8a05989a1d5bb0c6a3ae2641a33720c9272a1789394
    coverage: {cards_total: 32, new: 18, duplicate: 14, empty_conclusion: false}
    cards:

      - proposed_id: POLICY.STATE.LIFECYCLE_DECLARATION
        triage: UNIVERSAL
        kind_proposal: policy
        classification_proposal: UNIVERSAL_POLICY
        statement_zh: "应用中的每一项状态都必须显式登记五类事实：归属者、允许写入者、存放位置、生命周期边界与清理时机。"
        statement_en_keywords: "state declaration, owner, writer, storage, lifecycle, cleanup policy"
        applies_when: {lane: any, condition: "声明或评审任何应用状态"}
        enforcement: required_when_applicable
        source: {file: .trellis/spec/frontend/18-state-management-protocol.md, lines: "20"}
        clean_room: true

      - proposed_id: POLICY.STATE.SERVER_STATE_OWNERSHIP
        triage: UNIVERSAL
        kind_proposal: policy
        classification_proposal: LANE_POLICY
        statement_zh: "远端权威数据及其请求生命周期必须由查询缓存层统一持有，禁止在各处维护手工同步副本。"
        statement_en_keywords: "server state ownership, query cache layer, no manual sync copies"
        applies_when: {lane: frontend, condition: "消费远端数据"}
        enforcement: required_when_applicable
        source: {file: .trellis/spec/frontend/18-state-management-protocol.md, lines: "21"}
        clean_room: true

      - proposed_id: POLICY.STATE.GLOBAL_STORE_MINIMALITY
        triage: UNIVERSAL
        kind_proposal: policy
        classification_proposal: LANE_POLICY
        statement_zh: "全局状态库只允许承载稳定的跨页面状态；组件局部、页面临时与服务端数据副本一律不得迁入。稳定跨页面状态的正面清单属项目基线供给。"
        statement_en_keywords: "global store minimality, stable cross-page state only, positive list as project baseline"
        applies_when: {lane: frontend, condition: "决定状态是否进入全局库"}
        enforcement: required_when_applicable
        source: {file: .trellis/spec/frontend/18-state-management-protocol.md, lines: "23, 57-59"}
        clean_room: true
        notes: "本行源文件 L57-59 正面白名单（用户摘要/认证/语言/上下文/偏好/通知）为项目基线枚举，随两半拆分先例由项目基线供给"

      - proposed_id: POLICY.STATE.IDENTITY_SWITCH_CLEANSE
        triage: UNIVERSAL
        kind_proposal: policy
        classification_proposal: UNIVERSAL_POLICY
        statement_zh: "用户身份、权限或数据范围发生切换时，必须清除所有携带越权风险的状态。"
        statement_en_keywords: "identity switch cleanse, privilege-risk state purge"
        applies_when: {lane: any, condition: "身份/权限/数据范围切换"}
        enforcement: required_when_applicable
        source: {file: .trellis/spec/frontend/18-state-management-protocol.md, lines: "24"}
        clean_room: true

      - proposed_id: POLICY.STATE.FORM_STATE_AXES
        triage: UNIVERSAL
        kind_proposal: policy
        classification_proposal: LANE_POLICY
        statement_zh: "表单的初值、当前值、脏标记、校验错误、提交进行中与冲突六类状态必须彼此独立建模，不得混叠为单一变量。"
        statement_en_keywords: "form state axes, initial/current/dirty/errors/submitting/conflict separation"
        applies_when: {lane: frontend, condition: "建模表单状态"}
        enforcement: required_when_applicable
        source: {file: .trellis/spec/frontend/18-state-management-protocol.md, lines: "25"}
        clean_room: true

      - proposed_id: POLICY.STATE.OPAQUE_RUNTIME_REFERENCES
        triage: UNIVERSAL
        kind_proposal: policy
        classification_proposal: LANE_POLICY
        statement_zh: "不可序列化的运行时对象（第三方实例、DOM 节点、连接句柄等）必须保持为不透明引用，不得进入持久化层、URL 或可序列化的全局状态。"
        statement_en_keywords: "opaque runtime references, non-serializable handles out of persisted/URL/serializable state"
        applies_when: {lane: frontend, condition: "持有第三方实例或 DOM/连接句柄"}
        enforcement: required_when_applicable
        source: {file: .trellis/spec/frontend/18-state-management-protocol.md, lines: "27"}
        clean_room: true

      - proposed_id: POLICY.STATE.AUTH_STORE_MINIMALITY
        triage: UNIVERSAL
        kind_proposal: policy
        classification_proposal: UNIVERSAL_POLICY
        statement_zh: "认证与权限状态存储只保存最小摘要集（标识、显示名、组织与会话概要、数据范围概要、过期信息）；访问令牌、刷新令牌、完整声明集与完整权限矩阵不得进入。"
        statement_en_keywords: "auth store minimality, no tokens/claims/permission matrix in client store"
        applies_when: {lane: any, condition: "设计认证/权限客户端状态"}
        enforcement: required_when_applicable
        source: {file: .trellis/spec/frontend/18-state-management-protocol.md, lines: "61"}
        clean_room: true

      - proposed_id: POLICY.STATE.SINGLE_WRITER
        triage: UNIVERSAL
        kind_proposal: policy
        classification_proposal: UNIVERSAL_POLICY
        statement_zh: "每项状态必须有唯一且可追踪的写入者，禁止建立双向隐式同步通道。"
        statement_en_keywords: "single writer, traceable mutation source, no implicit two-way sync"
        applies_when: {lane: any, condition: "任何状态写入路径"}
        enforcement: required_when_applicable
        source: {file: .trellis/spec/frontend/18-state-management-protocol.md, lines: "69"}
        clean_room: true

      - proposed_id: POLICY.STATE.NO_PERMISSION_VERSION_KEY
        triage: HYBRID
        kind_proposal: policy
        classification_proposal: LANE_POLICY
        statement_zh: "当后端按请求实时计算权限且不提供版本标识时，权限版本与数据范围版本不得作为查询缓存键维度；权限失效由身份重取与 401/403 强制刷新覆盖。"
        statement_en_keywords: "no permission-version cache key, per-request permission computation, 401/403 forced refresh"
        applies_when: {lane: frontend, condition: "设计查询缓存键维度"}
        enforcement: required_when_applicable
        source: {file: .trellis/spec/frontend/18-state-management-protocol.md, lines: "53-55, 95"}
        clean_room: true
        uncertainty: "依赖「后端按请求实时计算权限、无版本响应头」这一架构事实，跨项目非普适；迁移时须按目标后端契约重审"

      - proposed_id: PROJECT.STATE.REGISTRY_THREE_CATEGORIES
        triage: PROJECT
        kind_proposal: policy
        classification_proposal: PROJECT_BASELINE_TEMPLATE
        statement_zh: "MASTer 状态登记表按 editing / ui(mode) / server 三类划分，每类绑定唯一 owner 格式与实现归属（per-page store 或查询缓存 hooks）；每页面声明 EDIT/MODE/REQUEST 三组状态机边界，转移由业务步骤推导。"
        statement_en_keywords: "three-category state registry, per-page state machine boundary"
        applies_when: {lane: frontend, condition: "MASTer 页面状态归属登记"}
        enforcement: required_when_applicable
        source: {file: .trellis/spec/frontend/18-state-management-protocol.md, lines: "32-42"}
        clean_room: true

      - proposed_id: PROJECT.STATE.RENDER_ISOLATION
        triage: PROJECT
        kind_proposal: policy
        classification_proposal: PROJECT_BASELINE_TEMPLATE
        statement_zh: "MASTer 分层约束：server state 归 entities 层查询 hooks（含请求生命周期与 per-query 错误），client state 归 shared/state 层 per-page store；渲染层（pages/features）组件本地引用不得持有业务或异步状态，两类状态不交叉（server state 不进 Pinia，client state 不进查询缓存）。"
        statement_en_keywords: "state/render layer isolation, entities hooks vs shared/state per-page store"
        applies_when: {lane: frontend, condition: "MASTer 页面实现"}
        enforcement: required_when_applicable
        source: {file: .trellis/spec/frontend/18-state-management-protocol.md, lines: "44-49, 93-94"}
        clean_room: true

      - proposed_id: PROJECT.STATE.FORMULA_DERIVED_STATE
        triage: PROJECT
        kind_proposal: policy
        classification_proposal: PROJECT_BASELINE_TEMPLATE
        statement_zh: "MASTer 公式输出态归属：每条公式对应一个 computed，桥接 server state（external:* 输入槽）与 client state（用户覆写）两类输入并调纯求值器；不得进入 Pinia 或长期缓存，正式结果以后端返回为准；求值返回 ok/blocked/pending/error 四态判别，blocked/pending 渲染占位符。"
        statement_en_keywords: "formula output as derived state, computed binding, four-state evaluation"
        applies_when: {lane: frontend, condition: "MASTer 公式引擎接入页面"}
        enforcement: required_when_applicable
        source: {file: .trellis/spec/frontend/18-state-management-protocol.md, lines: "73-80, 96"}
        clean_room: true

      - proposed_id: TEMPLATE.STATE.REGISTRY_RECORD
        triage: UNIVERSAL
        kind_proposal: contract_template
        classification_proposal: CONTRACT_TEMPLATE
        statement_zh: "状态登记对象字段形状：StateId、Category、Owner、Writer、Storage、Persistence、IsolationKey、CleanupTrigger。"
        statement_en_keywords: "state record schema fields"
        applies_when: {lane: any, condition: "登记任何状态对象"}
        enforcement: deterministic_where_possible
        source: {file: .trellis/spec/frontend/18-state-management-protocol.md, lines: "103-108"}
        clean_room: true
        notes: "落点随试点 R-C（POLICY.TPL.* 暂留 candidates，catalog/templates/ 与 TEMPLATE. 前缀挂起至 vocab-pr）"

      - proposed_id: GATE.STATE.CHECKS
        triage: UNIVERSAL
        kind_proposal: gate_recipe
        classification_proposal: GATE_RECIPE
        statement_zh: "状态门禁检查单：①状态分类正确 ②写入者与生命周期明确 ③URL/全局白名单遵守 ④身份切换可安全清理 ⑤运行时资源有释放时机且迟到结果不污染新上下文 ⑥持久化命名空间、版本迁移与失效策略明确。"
        statement_en_keywords: "state gate checklist"
        applies_when: {lane: frontend, condition: "状态相关变更过门禁"}
        enforcement: deterministic_where_possible
        source: {file: .trellis/spec/frontend/18-state-management-protocol.md, lines: "110-117"}
        clean_room: true
        notes: "GATE. 前缀随试点 V2 挂起（vocab-pr）"

      - proposed_id: KNOWLEDGE.STATE.EXAMPLE_STATE_PLACEMENT
        triage: UNIVERSAL
        kind_proposal: knowledge_entry
        classification_proposal: KNOWLEDGE_PATTERN
        statement_zh: "示例：页面编辑态由页面 store 持有并随卸载销毁；列表数据由领域查询 hooks 持有且键含页面、用户与数据范围维度；分页筛选进 URL、抽屉开关留页面状态、用户摘要进全局 store。"
        statement_en_keywords: "example, state placement decisions"
        applies_when: {lane: frontend, condition: "状态归属设计参考"}
        enforcement: advisory
        source: {file: .trellis/spec/frontend/18-state-management-protocol.md, lines: "121-125"}
        clean_room: true

      - proposed_id: KNOWLEDGE.FP.STATE.GLOBAL_STORE_DUMPING
        triage: UNIVERSAL
        kind_proposal: failure_pattern
        classification_proposal: FAILURE_PATTERN
        statement_zh: "失败模式：把全部列表、筛选、弹窗与表单塞进单一全局 store；在页面本地引用里保存接口返回列表并手写 loading/error；把完整权限矩阵与令牌放进认证存储，导致登出后越权数据残留。"
        statement_en_keywords: "failure pattern, global store dumping, page-local request state, credential residue"
        applies_when: {lane: frontend, condition: "状态架构评审"}
        enforcement: advisory
        source: {file: .trellis/spec/frontend/18-state-management-protocol.md, lines: "127-133"}
        clean_room: true

      - proposed_id: AUTHORITY.STATE.OWNERSHIP
        triage: HYBRID
        kind_proposal: authority_default
        classification_proposal: UNIVERSAL_POLICY
        statement_zh: "权威分配默认值：平台 Owner 维护状态基础设施，页面/领域 Owner 负责具体状态归属。MASTer 落点：shared/state 层 Owner 维护 per-page store 与隔离约定，entities 层 Owner 维护查询 hooks、键维度与缓存失效；状态登记表与页面状态机由前端交付编译产出，为状态归属唯一机器事实源。"
        statement_en_keywords: "state ownership defaults, machine source of truth registry"
        applies_when: {lane: frontend, condition: "Authority Map 构建"}
        enforcement: advisory
        source: {file: .trellis/spec/frontend/18-state-management-protocol.md, lines: "135-139"}
        clean_room: true
        notes: "与试点 M6 同型（权威三层默认值模板上提审阅已登记，留后续批次）；项目层 Owner 分工为 HYBRID 落点"

      - proposed_id: POLICY.STATE.CHANGE_MIGRATION
        triage: UNIVERSAL
        kind_proposal: policy
        classification_proposal: LANE_POLICY
        statement_zh: "状态存放位置或持久化方式的变化必须提供迁移、清理与兼容策略，用户隔离数据场景为强制项。"
        statement_en_keywords: "state location/persistence change, migration and cleanup obligation"
        applies_when: {lane: any, condition: "状态归属或持久化方式变更"}
        enforcement: required_when_applicable
        source: {file: .trellis/spec/frontend/18-state-management-protocol.md, lines: "141-143"}
        clean_room: true
        notes: "POLICY.CHG.COMPAT_MIGRATION_ROLLBACK 在状态域的实例化清单（互引），随 GRID.SCHEMA_VERSIONING 先例保留为域卡"

      - proposed_id: POLICY.STATE.URL_SHAREABLE_RESTORE
        kind_proposal: policy
        classification_proposal: DUPLICATE
        statement_zh: "可分享、可刷新恢复的状态应进入 URL。"
        source: {file: .trellis/spec/frontend/18-state-management-protocol.md, lines: "22, 63-65"}
        clean_room: true
        duplicate_of: POLICY.ROUTE.SHAREABLE_STATE_IN_URL
        notes: "跨文件语义重复（本组 29 号路由协议为正本自然归属）；L63-65 正面字段白名单为项目基线供给，不入 Universal 正本"

      - proposed_id: POLICY.STATE.RESOURCE_DISPOSAL_DECLARATION
        kind_proposal: policy
        classification_proposal: DUPLICATE
        statement_zh: "状态持有的监听器、计时器、观察者、请求、流、连接、Worker 与对象 URL 必须声明释放时机，并在销毁、身份切换或能力关闭时清理。"
        source: {file: .trellis/spec/frontend/18-state-management-protocol.md, lines: "26"}
        clean_room: true
        duplicate_of: POLICY.LIFE.PAIRED_DISPOSAL
        notes: "与本组 42 号运行时生命周期协议（本批正本）语义重复"

      - proposed_id: POLICY.STATE.PERSISTENCE_NAMESPACING
        kind_proposal: policy
        classification_proposal: DUPLICATE
        statement_zh: "持久化状态必须按用户/租户/环境命名空间隔离，并在登出、权限收缩或版本不兼容时失效或迁移。"
        source: {file: .trellis/spec/frontend/18-state-management-protocol.md, lines: "28"}
        clean_room: true
        duplicate_of: POLICY.STORAGE.ISOLATION_ENFORCEMENT
        notes: "与本组 45 号浏览器存储协议（本批正本）隔离语义重复"

      - proposed_id: POLICY.STATE.QUERY_KEY_PROJECT_DIMENSIONS
        kind_proposal: policy
        classification_proposal: DUPLICATE
        statement_zh: "查询键必须包含全部影响结果的稳定维度（本项目枚举含领域、实体、页面、用户、数据范围、车型/条线版本、记录状态、筛选、排序、分页、schema 版本）。"
        source: {file: .trellis/spec/frontend/18-state-management-protocol.md, lines: "53"}
        clean_room: true
        duplicate_of: POLICY.CACHE.QUERY_KEY_COMPLETENESS
        notes: "正本在本组 19 号缓存协议；维度枚举（含车型/条线等项目域对象）属项目基线供给"

      - proposed_id: POLICY.STATE.NO_LOCAL_INVALIDATION_ONLY
        kind_proposal: policy
        classification_proposal: DUPLICATE
        statement_zh: "状态变更操作不得只刷新当前页面局部变量，必须声明缓存失效范围、失败回滚与冲突处理。"
        source: {file: .trellis/spec/frontend/18-state-management-protocol.md, lines: "70"}
        clean_room: true
        duplicate_of: POLICY.CACHE.MUTATION_INVALIDATION_MATRIX
        notes: "同文件（18）与同组（19）正本联合覆盖的极性形态"

      - proposed_id: POLICY.STATE.NO_STALE_CONTEXT_WRITE
        kind_proposal: policy
        classification_proposal: DUPLICATE
        statement_zh: "快速切换筛选、车型、角色、数据范围、页签或路由时，旧查询响应不得写入当前状态。"
        source: {file: .trellis/spec/frontend/18-state-management-protocol.md, lines: "71"}
        clean_room: true
        duplicate_of: POLICY.WEB.API.LATE_RESULT_GUARD
        notes: "试点既有正本（迟到结果写回防护）语义覆盖"

      - proposed_id: POLICY.STATE.NO_COMPONENT_STATE_IN_GLOBAL_STORE
        kind_proposal: policy
        classification_proposal: DUPLICATE
        statement_zh: "组件局部状态不得迁入全局 store。"
        source: {file: .trellis/spec/frontend/18-state-management-protocol.md, lines: "84"}
        clean_room: true
        duplicate_of: POLICY.STATE.GLOBAL_STORE_MINIMALITY
        notes: "同协议极性反转（正本禁止形态）"

      - proposed_id: POLICY.STATE.NO_SERVER_STATE_MANUAL_SYNC
