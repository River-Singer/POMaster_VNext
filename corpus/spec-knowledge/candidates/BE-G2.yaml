  statement_en_keywords: no gating proxy trust, route hiding, button state, client-declared tenant/owner
  clean_room: true
  applies_when: {lane: backend, condition: 服务端授权判定}
  cross_refs: [POLICY.AUTHZ.SERVER_FIVE_FACTOR_VERIFICATION, POLICY.SEC.NO_CLIENT_SIDE_TRUST]
  notes: 独立成卡（BE12 先例）：枚举三类客户端表象绕过向量；与 SEC.NO_CLIENT_SIDE_TRUST 同族不同域（安全泛化 vs 授权具体）

