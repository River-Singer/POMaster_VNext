# ============================================================
# pomaster.vocab/v0.8-resolved   （2026-09-05 PR-0009 增补；append-only 纯增量，v0.1~v0.7 词值零删改）
# 历史：原 v0-draft（三开放问题已于 2026-08-27 会话裁决）→ v0.1-resolved（2026-08-27 FROZEN）
#       → v0.2-resolved（2026-08-29 PR-0001 增补）→ v0.3-resolved（2026-09-01 PR-0004 增补）
#       → v0.4-resolved（2026-09-01 PR-0005 增补）→ v0.5-resolved（2026-09-02 PR-0006 增补）
#       → v0.6-resolved（2026-09-03 PR-0007 增补）→ v0.7-resolved（2026-09-04 PR-0008 增补）
#       → v0.8-resolved（2026-09-05 PR-0009 增补）
# ============================================================

ir_schema: pomaster.truth-index/v1-draft

state_axes:
  lifecycle:            # 对象在治理世界的位置（A2 六值超集）
    values: [PROPOSED, CURRENT, SUPERSEDED, DEPRECATED, RETIRED, REJECTED]
    transitions:
      PROPOSED:    { to: [CURRENT, REJECTED], requires: authority_approval }
      CURRENT:     { to: [SUPERSEDED, DEPRECATED], requires: transition_record }
      SUPERSEDED:  { to: [], notes: terminal; successor_ref 必填 }
      DEPRECATED:  { to: [RETIRED], grace_policy: config }
      # PR-0009 转正注记：grace_policy 键与 config 值即宽限期策略键词形本体（本行即登记；
      # kernel GRACE_POLICY_CONFIG_EDGES 边集承载，无需另立词轴——原 TODO(vocab-pr) 闭合）。
      RETIRED:     { to: [] }
      REJECTED:    { to: [] }
  confidence:           # 决策置信（PRD §18.2 四值不动）
    values: [UNRESOLVED, EXPERIMENTAL, PROVISIONAL, LOCKED]
  evidence:             # 凭什么信（PRD 三值 + 正交字段扩容见 realization）
    values: [PLANNED, IMPLEMENTED, VERIFIED]
  change:
    values: [STABLE, CHALLENGED, MIGRATING]

orthogonal_fields:      # 不进状态轴、独立建模（A3）
  realization:          # 治理 CLAIMED 歧义的专用通道
    applies_to: [contract_operation, capability]
    values: [stub, mock, wired]
    derivation: machine_preferred   # D21：优先机器派生，人只做例外复核

source_types:           # sources[].type 词轴（2026-08-27 收编 02 信封 x-vocab-extra.source_type，任务书 02 给定；2026-09-03 PR-0007 增值 owner_directive，append-only）
  all:        [bp_blueprint, design_seed, human_directive, owner_directive, code_refactor,
               prototype_walkthrough, prototype_html_scrape, research_evidence,
               openapi_contract, ai_invention]
  allowed:    [bp_blueprint, design_seed, human_directive, owner_directive, code_refactor,
               prototype_walkthrough, research_evidence, openapi_contract]
  forbidden:  [prototype_html_scrape, ai_invention]
  # forbidden 两值 schema 只保证可判别、不做硬拦；Transition/Gate 层判 FATAL 并留痕
  # PR-0007（2026-09-03）：owner_directive=Owner 明令（区别于 human_directive 泛化人类指令——knowledge 物料 x-vocab-pr 注记先例）

keybinding_axes:        # KEYBINDING 词族三轴（2026-08-27 收编 04-keybinding，摘除其暂定事实源声明；D15/A7）
  binding_class:        # A7 三类最小集；类-前缀耦合：page_to_dir⇒PAGE.* / contract_operation_to_operationId⇒API_REQ.* / capability_to_file⇒CAPABILITY.*
    values: [page_to_dir, contract_operation_to_operationId, capability_to_file]
  binding_status:
    values: [confirmed, derived, stale]
  probe_result:
    values: [matched, mismatched, unreachable, not_probed]

id_namespace:           # closed-world（A5）：未登记前缀 = 解析即 FATAL
  rules:
    separator: "."
    casing: SCREAMING_SNAKE
    unknown_prefix_action: FATAL
  prefixes_v0:          # P0/tracer bullet 所需最小闭包；扩展走词汇表 PR 流程
    PAGE.          : 页面对象（surface/路由入口）
    CAPABILITY.    : 能力对象（含 GRID.EDITABLE_GRID 类既有别名）
    COMPONENT.     : 组件实现登记
    API_REQ.       : API 契约操作（外部 OpenAPI operationId 锚点）
    ERR.           : 错误词条（error-taxonomy，D18）
    FIELD.         : 字段语义定义
    KNOWLEDGE.     : 知识条目（legacy KB- 前缀经 alias 收编，A6）
    CHANGE.        : 变更对象
    TASK.          : 任务对象
    DENOMINATOR.   : 覆盖分母（一等公民，只许 supersede 不许删除）
    KEYBINDING.    : ID↔路径绑定表（一等公民，D15）
    POLICY.        : 目录策略引用条目
    PROFILE.       : governance/quality profile 引用
    AUTHORITY.     : Authority Map 条目
    TEST.          : fixture 专用域（Q3 已决）：对象身份合法；
                     doctor 将「生产代码引用 TEST.*」列为违规探针
    # PR-0008（2026-09-04，vNext Batch 2 R1 / D6）增补：Evidence Spec 一等对象
    # （要求面——「需要什么证明」，PRD vNext §9.2 四概念分离）。append-only：
    # 15 前缀无语义适配位（裁定留痕见头部 PR-0008 段）；family 派生 SPEC→EVIDENCE。
    SPEC.          : 证据要求规范（Evidence Spec 一等对象——要求面；Spec 持要求
                     不持判定，判卷值只住 Verification Result / Gate Result）
  state_plane_refs:     # PR-0001 文档化收编：状态面台账键词形（非 governed 前缀——不入 prefixes_v0、不过 parseGovernedId）
    - form: "PERMIT.<BASE>.<SEQ>"
      plane: state/permits.json（kernel 内部台账；A8 同族不入 truth-index）
      validation: 台账存在性 + 显式四态 outcome；PERMIT_EXPIRED_OBSERVED / PERMIT_STOLEN 事件流引用同形
    # —— PR-0004 增补（P34 production 侧车五通路编号词形；HM-/GRN-/CLM-/EXC-/EQG-/AGX- 同族：
    #    内容寻址 sha256 前 12 hex，A4 无墙钟无随机，词形校验归 kernel ENTRY_ID_PATTERN 正则 +
    #    台账存在性，非 governed 前缀不过 parseGovernedId）——
    - form: "POB-<12hex>"
      plane: .pomaster/production/observations/（observation 台账；§95.2 Deterministic Detection 判定随录）
      validation: 内容寻址 id + 台账存在性；NOT_EVALUABLE 观测同样显式入账（breach_ref=null 禁静默丢弃）
    - form: "PBR-<12hex>"
      plane: .pomaster/production/breaches/（breach Evidence；detected_by 恒 tool_signal——C5 判定来自工具信号非 LLM 自报）
      validation: 词形正则 ^PBR-[0-9a-f]{12}$ + 台账存在性（禁手造引用，EVIDENCE_NOT_FOUND）；作 tx.authorityRef 承载位（store LOCKED+STABLE→CHALLENGED 前置——确定性工具信号即挑战权威，PR-0004 登记该接线事实不是新约束：store 仅校验非空）
    - form: "PCH-<12hex>"
      plane: .pomaster/production/challenges/（challenge 留痕；§95.3 事务结果镜像——唯一治理事实变更经 applyTransaction 落 state/）
      validation: 内容寻址 id + 台账存在性；一 (band, breach) 至多一留痕（重复 challenge 显式拒绝）
    - form: "PDG-<12hex>"
      plane: .pomaster/production/diagnoses/（diagnosis 台账；§95.2 链序第 4 拍 Agent Diagnosis）
      validation: 内容寻址 id + 台账存在性；必挂在册 PCH-* 且其 breach_ref 可解析为在册 BREACHED 记录（DIAGNOSIS_WITHOUT_BREACH_EVIDENCE 封条——无确定性检测在先诊断不可入账）
    - form: "PSI-<12hex>"
      plane: .pomaster/production/self-improvement/（§90.4 候选；kind 恒 POMASTER_SELF_IMPROVEMENT_CANDIDATE 呈报态）
      validation: 内容寻址 id + 台账存在性；零 journal 零 state/ 写入（纯呈报位——「不得自动应用」L5695 逐字）
    # —— PR-0006 增补（Software Graph relation sidecar 通路词形；EQG-/POB- 同族：
    #    内容寻址 sha256 前 12 hex，A4 无墙钟无随机，非 governed 前缀不过 parseGovernedId）——
    - form: "EDGE-<12hex>"
      plane: .pomaster/state/relations.jsonl（Typed Relation sidecar 台账；D-3 裁定 2026-09-02：append-only 追加流 + journal RELATION_* 事件流 + 不进 content_digest；A8 同族不入 truth-index——01 additionalProperties:false 封条不动）
      validation: 词形正则 ^EDGE-[0-9a-f]{12}$ + 台账存在性；id=内容寻址（canonical 序列化 sha256 前 12 hex——同 (source,type,target) 重登记 dedupe noop 幂等）；edge 词形校验归 kernel relations.ts 装载面（19-relations definitions 镜像）
    # —— PR-0009 增补（Discovery 平面前缀词形注记；Owner 裁决 9② 2026-09-01「不入 governed
    #    prefixes（Discovery 平面局部词形，state_plane_refs 先例）」定案的登记位；非 governed
    #    前缀不过 parseGovernedId，校验=18-decision-graph schema 词形正则 + 图内/台账存在性）——
    - form: "DECISION.<SLUG>"
      plane: .pomaster/scratchpad/decision-graph sidecar（Grounded Decision Graph 节点 id）
      validation: 18 schema DECISION_ID_PATTERN 正则 + 图内存在性；PR-0009 登记（裁决 9②）
    - form: "RESEARCH.REQ.<SLUG>"
      plane: decision-graph sidecar research_request 平面（§9.1 research_request id）
      validation: 18 schema RESEARCH_REQUEST_ID_PATTERN 正则 + 图内存在性；PR-0009 登记（裁决 9②）
    - form: "FINDING.<SLUG>"
      plane: decision-graph sidecar finding_link 平面（§10.1 finding id）
      validation: 18 schema FINDING_ID_PATTERN 正则 + 图内/台账存在性；PR-0009 登记（裁决 9②）
    - form: "DISCOVERY.INTENT.<SLUG>"
      plane: decision-graph sidecar（§5.x intent 四分拣 meta 承载位）
      validation: 18 schema DISCOVERY_INTENT_REF_PATTERN 正则；PR-0009 登记（裁决 9②）
    - form: "FACT.<SLUG>"
      plane: decision-graph sidecar（missing fact / grounding fact 引用位）
      validation: 18 schema MISSING_FACT_REF_PATTERN 正则；PR-0009 登记（裁决 9②）
    # —— PR-0009 增补（感知/回执通路编号词形注记；17-perception-receipts x-pomaster-vocab-source
