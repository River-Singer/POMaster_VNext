  - candidate_id: "KNOWLEDGE.FP.REUSE.ASYMMETRIC_OUTPUT_DRIFT"
    source: design_seed
    evidence: PLANNED
    source_file: ".trellis/spec/guides/code-reuse-thinking-guide.md"
    source_lines: "L87-97"
    source_section: "Gotcha: Asymmetric Mechanisms Producing Same Output"
    kind_proposal: knowledge_entry
    classification_suggestion: FAILURE_PATTERN
    scope_sort: UNIVERSAL
    applies_when: { lane: any, condition: "存在多机制产出同一输出集的架构评审场景" }
    enforcement: advisory
    vocab_pr_needed: false
    statement_zh: "失败模式：同一输出集由自动派生与人工维护两条机制分别产出时，结构性调整（重命名、移动、新增子路径）只传导到自动路径，人工路径静默漂移——初始化场景看似完好，更新场景开始产出错误路径或遗漏文件。防御：结构迁移时排查引用旧结构的全部代码路径；一端自动派生、另一端人工罗列的组合必须把人工端列为必改项；为两条机制的输出一致性建立回归比对测试。"
    statement_en_keywords: ["failure pattern", "asymmetric mechanisms", "manual mirror path drift", "regression diff between generators"]
    clean_room: { independent_wording: true, note: "statement_zh 为独立改写，语义等价、词形独立，零逐字拷贝源文本" }
    notes: "B3 failure-pattern 附带池候选；与 po-master 侧 mirror 同步事故经验同型（经验证的真实失败形态）"

